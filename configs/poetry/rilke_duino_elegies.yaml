# Rilke, *Duineser Elegien* (Insel, Leipzig 1923).
# Not on Project Gutenberg — sourced from German Wikisource, whose transcription of the
# first edition is marked BEARBEITUNGSSTAND=fertig (fully proofread). One page per elegy.
collection_title: "Duineser Elegien"
language: de
wikisource_lang: de
poems:
  - poem_title: "Erste Elegie"
    page: "Die erste Elegie"
    start_marker: "WER, wenn ich schriee, hörte mich denn aus der Engel"
    end_marker: "Schwingung geriet, die uns jetzt hinreißt und tröstet und hilft."
  - poem_title: "Zweite Elegie"
    page: "Die zweite Elegie"
    start_marker: "JEDER Engel ist schrecklich. Und dennoch, weh mir,"
    end_marker: "göttliche Körper, in denen es größer sich mäßigt."
  - poem_title: "Dritte Elegie"
    page: "Die dritte Elegie"
    start_marker: "EINES ist, die Geliebte zu singen. Ein anderes, wehe,"
    end_marker: "Verhalt ihn......"
  - poem_title: "Vierte Elegie"
    page: "Die vierte Elegie"
    start_marker: "O Bäume Lebens, o wann winterlich?"
    end_marker: "ist unbeschreiblich."
  - poem_title: "Fünfte Elegie"
    page: "Die fünfte Elegie"
    start_marker: "WER aber sind sie, sag mir, die Fahrenden, diese ein wenig"
    end_marker: "Teppich?"
  - poem_title: "Sechste Elegie"
    page: "Die sechste Elegie"
    start_marker: "FEIGENBAUM, seit wie lange schon ists mir bedeutend,"
    end_marker: "abgewendet schon, stand er am Ende der Lächeln, anders."
  - poem_title: "Siebente Elegie"
    page: "Die siebente Elegie"
    start_marker: "WERBUNG nicht mehr, nicht Werbung, entwachsene Stimme,"
    end_marker: "Unfaßlicher, weit auf."
  - poem_title: "Achte Elegie"
    page: "Die achte Elegie"
    start_marker: "MIT allen Augen sieht die Kreatur"
    end_marker: "so leben wir und nehmen immer Abschied."
  - poem_title: "Neunte Elegie"
    page: "Die neunte Elegie"
    start_marker: "WARUM, wenn es angeht, also die Frist des Daseins"
    end_marker: "entspringt mir im Herzen."
  - poem_title: "Zehnte Elegie"
    page: "Die zehnte Elegie"
    start_marker: "DASS ich dereinst, an dem Ausgang der grimmigen Einsicht,"
    end_marker: "wenn ein Glückliches fällt."
