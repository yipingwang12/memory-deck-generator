# disasters, population. Wars and states stay in politics; trade volumes, companies, forts and trading
# posts stay in economy; missions, churches and Islamic scholarship stay in religion (first-come:
# Quaque's ordination, Krotoa's baptism, Ahmad Baba's treatise are there). Freetown's founding by the
