# Cell: Central Asia x society x 1945 to present. DRAFT 2026-11-07.
# Scope: Kazakhstan, Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan, Afghanistan, Mongolia,
# Tibet, Xinjiang, the Eurasian steppe. Social change, education, rights movements, epidemics,
# natural disasters, famines, population, sport. Mountain first ascents count as sport and go to the
# region of the peak (Everest from the north side goes here; from Nepal it does not).
# Olympic and other results won abroad stay out, as in the 1800-1945 cell; sport events held in the
# region are in. Ethnic riots stay here unless the politics cell already holds them (Fergana, Osh).
