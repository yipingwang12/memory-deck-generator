# Aral Sea events have their own group (Kazakhstan and Uzbekistan share the sea).
# Dates: memory pass + web check (45 searches + Kiwix WP mirror fetches). Gregorian years.
# Peg = last two digits of the year. A phase is dated by its start.
# confidence: high | medium | low | disputed | unverified (no source found)
