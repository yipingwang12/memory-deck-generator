# Cell: Eastern Europe x religion x 500 to 1499. DRAFT 2026-11-04.
# Scope: Poland, Czechia, Slovakia, Hungary, Balkans, Greece, Romania, Moldova, Baltic states,
# Belarus, Ukraine, Russia (including Siberia). Religions, philosophies, founders, councils,
# scriptures, religious buildings and reforms.
# Constantinople (the old city on the European shore of the Bosporus, East Thrace) is in: it is
# part of the Balkans, not Anatolia. Asian-shore and Anatolian sites (Nicaea, Hieria, Chalcedon,
# Lampsakos) are out. Councils held in Rome, Lyon, Florence or Constance are out; their effect
# inside the region is in only when a separate local act is dated (Jihlava, Kremlin, Hagia Sophia).
# Crimea is Ukraine; Khazar and Golden Horde sites on the lower Volga are Russia.
# Mount Athos and Meteora are Greece. Skopje and Ohrid are North Macedonia.
# Icons, frescoes and books as art stay in arts; churches, mosques, synagogues and monasteries are in.
# Dates: memory pass + web check (25 searches + fetches). Julian years as the sources give them.
# Peg = last two digits of the year. Range -> conventional "c." date (rule of 2026-11-04).
# A building -> the year it opens (dedication, consecration); a monastery -> its founding.
# confidence: high | medium | low | disputed | unverified (no source found)
