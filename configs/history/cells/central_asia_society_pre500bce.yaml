# Cell: Central Asia x society x before 500 BCE. DRAFT 2026-11-11.
# Scope: Kazakhstan, Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan, Afghanistan, Mongolia, Tibet,
# Xinjiang and the Eurasian steppe east of the Ural River (Trans-Urals and Sayan-Altai included).
# Society here: settlement and population (first people, archaic humans, families), migrations and
# steppe ancestry, towns and proto-urban centres as social change, burials as evidence of rank or
# violence, diet and health, epidemics. Trade, farming, herding and metal are economy; ritual
# burials, cults and sanctuaries are religion; excavations as such are science.
# Dates: memory pass + web check (45 searches).
# Peg rules as policy.md: last two digits; approximate year ending 00 -> first two digits
# (under 1000: year // 10). years_ago (10,000+) -> first two digits, cut not rounded.
# Range -> the conventional "c." date; no conventional date -> start of a phase, or the midpoint
# of the span for one work of uncertain date. "X +/- Y" -> X.
# confidence: high | medium | low | disputed | unverified (no source found)
