# Cell: Oceania x society x 500 to 1499. DRAFT 2026-11-13.
# Dates: memory pass + web check (45 searches). Peg rules as policy.md.
# Range -> conventional "c." date, else start of phase; "X +/- Y" -> X. Approximate year ending 00 -> first two digits (under 1000: year // 10).
# Genomic settlement dates (Ioannidis 2021) are the latest possible dates for a founding.
# Scope: arrival of people and settlement of islands, population, social structure, burials, natural disasters.
# Trade, quarries, crops, fishponds and field systems are in oceania_economy_500_1500. States, rulers and
# wars are in oceania_politics_500_1500; monuments and royal tombs in oceania_arts_500_1500.
# Left out: Moriori arrival on the Chatham Islands (accepted date c. 1500, next period); Roi Mata burial
# (later centuries); Pulu kod, Torres Strait (after 400 BP). No dated sport or game found for this period.
# confidence: high | medium | low | disputed | unverified (no source found)
