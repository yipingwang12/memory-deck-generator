# Under 10,000 years: BCE = years ago - 2,000, rounded to the nearest century, unless the source gives BCE.
# (approximate) + year ending 00 -> first two digits (under 1000: year // 10); else last two digits.
# Cities as places people live (population), migration, abandonment, disasters, ballgame as sport.
# Temples and rites stay in latin_america_religion_500bce_500ce; rulers and wars in latin_america_politics_500bce_500ce;
# the Saladoid canoe crossing stays in latin_america_science_500bce_500ce (first-come).
