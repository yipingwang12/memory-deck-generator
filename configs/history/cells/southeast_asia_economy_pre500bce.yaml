# Cell: Southeast Asia x economy x before 500 BCE. DRAFT 2026-11-11.
# Scope: Myanmar, Thailand, Laos, Cambodia, Vietnam, Malaysia, Singapore, Indonesia, Brunei, Philippines,
# Timor-Leste. Farming and crop arrival (rice, millet), domestic animals, mining and metal production,
# craft production, and long-distance exchange (Taiwan nephrite, copper, cloves).
# Dates: memory pass + web check (45 searches; one southeastasianarchaeology.com fetch for Ciarla and Pryce 2020).
# Thin cell: dates rest on radiocarbon ranges and two competing chronologies (Higham short, White long)
# for the Thai Bronze Age. Not padded. No dated pre-500 BCE economy event found for Peninsular Malaysia,
# Singapore or Brunei. Iron working, salt making and lingling-o earrings start at or after 500 BCE: left
# to southeast_asia_economy_500bce_500ce.
# Already in southeast_asia_politics_pre500bce (first-come): Ban Non Wat first copper and aggrandisers,
# Non Nok Tha chiefdom, Nyaung-gan elite bronze graves, Phung Nguyen jade nha chuong blades, Van Lang.
# Range -> conventional c. date, else start of the phase. Years ago -> BCE = years ago - 2,000.
# Peg: last two digits of the year. Approximate year ending 00 -> first two digits (year // 10 under 1000).
# years_ago: its first two digits.
# confidence: high | medium | low | disputed | unverified (no source found)
