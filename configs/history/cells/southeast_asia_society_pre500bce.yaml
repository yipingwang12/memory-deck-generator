# stone tools as technique stay in science; rock art and ornaments stay in arts; finds of the modern
# era (excavation, naming) stay in science of their own period.
# Dates: memory pass + web check (43 searches).
# Range -> conventional c. date, else start of the phase; one fossil or find of uncertain date -> midpoint.
# "At least X" (a minimum age) -> X.
# years_ago: dates of 10,000+ years; encode its first two digits.
# Under 10,000 years: BCE = years ago - 2,000, rounded to the nearest century, unless the source gives BCE.
# Peg: last two digits of the year. Approximate year ending 00 -> first two digits (year // 10 under 1000).
# confidence: high | medium | low | disputed | unverified (no source found)
