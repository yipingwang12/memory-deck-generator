# Cell: Latin America x society x before 500 BCE. DRAFT 2026-11-13.
# Scope: Mexico, Central America, Caribbean, South America. Society here: arrival of people and
# early settlement, population and genetic history, sedentism and villages, burials as social
# evidence, natural disasters, violence, diet and health. Chiefdoms, capitals and war monuments
# stay in latin_america_politics_pre500bce; temples, ritual burials and mummies in
# latin_america_religion_pre500bce (first-come). Domestication, farming, fishing and trade go to
# economy; pottery, metal, textiles, calendars and writing go to science (wave 24 split).
# Dates: memory pass + web check (45 searches). Peg rules as policy.md: last two digits;
# approximate year ending 00 -> first two digits (under 1000: year // 10). years_ago (10,000+)
# -> first two digits, cut not rounded. Under 10,000 years: BCE = years ago - 2,000, rounded to
# the nearest century, unless the source gives BCE.
# Range -> the conventional "c." date; no conventional date -> start of a phase, or the midpoint
# of the span for one work of uncertain date. "X +/- Y" -> X.
# confidence: high | medium | low | disputed | unverified (no source found)
