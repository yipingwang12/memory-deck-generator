# Cell: Sub-Saharan Africa x science and technology x 1500 to 1799. DRAFT 2026-11-13.
# Dates: memory pass + web check (45 searches, plus mirror fetches; the rest is unverified).
# Peg rules as world_dates.yaml: last two digits; approximate year ending 00 -> first two digits.
# Range -> conventional "c." date, else start of a phase; "X +/- Y" -> X.
# A work -> first public appearance (print); a manuscript -> year written.
# Scope: natural history, medicine, astronomy, mathematics, engineering, printing, language study
# (grammars and dictionaries), discoveries. Exploration and trade journeys stay in the economy cell;
# travel books stay in the arts cell; epidemics stay in the society cell.
# confidence: high | medium | low | disputed | unverified (no source found)
