# Cell: Oceania x politics x 500 to 1499. DRAFT 2026-11-07.
# Scope: Polynesia (Hawaii included), Micronesia, Melanesia, New Zealand, Australia, New Guinea.
# States, rulers, wars, forts, tribute systems, councils. Stone monuments and royal tombs as works
# stay in the arts cell (Nan Madol walls, Haʻamonga, langi, Leluh tombs); settlement goes to society.
# Most dates come from genealogy counts or radiocarbon and U-Th ranges. Policy "legendary king lists"
# rule: reigns dated only by a king list are left out (Samoan Tui Atua from c. 700, Upolu under Pili's
# sons, Hotu Matuʻa, Pāʻao and Pili, Kakaʻalaneo, Līloa). A single tradition with a well-known date stays,
# marked (traditional date). Australia and New Guinea: no dated political event found for this period.
# Dates: memory pass + web check (45 searches + fetches of WP mirror pages, ScienceDaily, Cordy 2022).
# Peg = last two digits of the year; approximate round year -> first two digits (under 1000: year // 10).
# A phase (a war, a split) is dated by its start. Century statements -> the first year of that century.
# confidence: high | medium | low | disputed | unverified (no source found)
