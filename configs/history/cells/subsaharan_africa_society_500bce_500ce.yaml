# Kush and Meroe (Nubia) belong to north_africa.
# Dates: memory pass + web check (45 searches + Kiwix WP mirror fetches). Peg rules as policy.md.
# Encode the last two digits of the year. Approximate year ending 00 -> first two digits (under 1000: year // 10).
