# Cell: North Africa x science and technology x 1945 to 2026. DRAFT 2026-11-06.
# Scope: Egypt, Nubia / northern Sudan, Libya, Tunisia, Algeria, Morocco (Western Sahara finds under Morocco).
# Science, technology, medicine, mathematics, engineering, astronomy; dams, metros, bridges, reactors,
# satellites, desalination plants and rocket ranges are here. Excavation, fossil and meteorite finds count
# here as science (as in the 1800-1945 cell); museums, art finds and moved temples stay in arts.
# Disease elimination by medicine (polio, malaria, trachoma, filariasis) is here; epidemics stay in society.
# Already in older cells, so not repeated (policy.md Scope): Gerboise Bleue (politics), US withdrawal of
# High Dam money (politics), Nubian resettlement (society), Abu Simbel and Philae moves, Cairo Tower,
# Bibliotheca Alexandrina (arts), hepatitis C screening and WHO gold tier (society), university foundings
# (society), Libya gives up weapons programmes (politics).
# A satellite built or run for a country of the region is listed under that country, also when the launch
# site is outside the region. French tests and launches in the Algerian Sahara are listed under Algeria.
# Prize: in only if the prize work was done here (Zewail, El-Baz, Yacoub's British work are out).
# Dates: memory pass + web check (45 web searches + Kiwix WP mirror fetches). All dates are CE years.
# Peg: last two digits of the year. A work -> first publication; a find -> year of the find, or year of
# publication when the event says "published" or "announced". A reactor -> first criticality.
# A dam, line or bridge -> opening, unless the event text says "begins".
