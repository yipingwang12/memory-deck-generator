# Economy here: farming and crops, herding and dairying as production, metallurgy and mining,
# crafts, and trade (lapis, tin, the Inner Asian Mountain Corridor). Settlement, migration, burial,
# diet and violence are society; excavations as such are science.
# Dates: memory pass + web check (45 searches).
# Peg rules as policy.md: last two digits; approximate year ending 00 -> first two digits
