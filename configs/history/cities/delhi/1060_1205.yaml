# Faridabad, Noida, Ghaziabad). Tarain, Ajmer, Hansi and Chandawar are outside the area.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Chahamana court acts at Ajmer,
# Ghurid wars outside the area -> out_refs. World-grid events -> world_refs.
# Dates: memory pass + web check (20 of 30 searches; no unauthorised book copies).
