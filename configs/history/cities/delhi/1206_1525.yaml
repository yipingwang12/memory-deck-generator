# Department, Obrock (JRAS 2020) on the Palam Baoli inscription, Digby (BSOAS) on Lodi tombs.
# Hijri or Vikram Samvat year over two Common Era years -> the CE year of the event, confidence medium.
# A building -> its completion. A work of a known reign but no known year -> midpoint of the reign,
# marked (approximate), confidence low.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
