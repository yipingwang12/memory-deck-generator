# Firozabad, the Ridge, Nizamuddin, Palam; Faridabad with Tilpat; Ghaziabad with Loni).
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Sultans' accessions, court
# murders and coups, embassies and laws for the whole Sultanate -> out_refs; sultans' and nobles'
# buildings, water works, city offices, sieges and fighting in the city are cards. World-grid events ->
# world_refs. The Sultanate court is at Daulatabad c. 1327-1334 and at Agra from 1506.
# Dates: memory pass + web check (43 of 45 searches; no unauthorised book copies).
# Main sources: Wikipedia (Qutb complex, Siri Fort, Jahanpanah, Feroz Shah Kotla, Lodi Gardens, Kotla
