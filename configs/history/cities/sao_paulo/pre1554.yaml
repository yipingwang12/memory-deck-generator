# City: São Paulo x prehistory to 1553 (Morumbi stone workshop, the Tupiniquim, João Ramalho, São Vicente, the first mills, Santos, Santo André da Borda do Campo). DRAFT 2026-11-25.
# Area: the São Paulo Metropolitan Region (39 municipalities: São Paulo, Guarulhos, the ABC with Santo André da Borda do Campo,
# Osasco, Mogi das Cruzes, Santana de Parnaíba, ...) plus Santos and São Vicente on the coast. Bertioga, Guarujá, Cubatão and Itanhaém are OUT.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Captaincy and crown acts -> out_refs.
# World-grid events -> world_refs (latin_america cells). Dates: memory pass + web check (17 of 25 searches; no unauthorised book copies).
# Main sources: wikipedia.org (pt/en: São Vicente, Santos, Santo André da Borda do Campo, João Ramalho, Engenho dos Erasmos,
# Guerra de Iguape, Santa Casa de Santos, Brás Cubas, Martim Afonso de Sousa, História da cidade de São Paulo),
# Reis and Katinsky in Revista USP 41 (1999), ALESP "São Paulo 460 anos", Revista de História (USP), IBGE (Pero Lopes diary), Olhar Digital (Morumbi).
# Radiocarbon: calibrated date first; a card with only an uncalibrated BP date is disputed.
# Range -> conventional c. date; one work of uncertain date -> midpoint; a phase -> its start.
# Approximate year ending 00 -> first two digits; under 1000 -> year // 10. Peg: last two digits of the year otherwise.
# All dates are Julian (Portugal changed to the Gregorian calendar in October 1582).
# confidence: high | medium | low | disputed | unverified (no source found)
