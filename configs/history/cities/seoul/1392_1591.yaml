# move to Gaeseong and back; Taejong's stream, bridges and shop rows; Sejong's stone wall, fire office and palace
# halls; temples rise and fall; Yeonsangun's city; the purges in the capital). DRAFT 2026-11-22.
# Area: Seoul Capital Area (Hanyang/Hanseong and its ten-ri suburbs, the Han River banks, Bukhansan, Gangnam,
# Incheon with Ganghwa and Gyodong, Gyeonggi: Guri, Namyangju, Goyang, Paju, Yangju, Yeoju, Gwangju).
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Joseon court events (accessions,
# royal funerals, national laws, state examinations, embassies) -> out_refs; palaces, gates, walls, shrines,
# temples, tombs, bridges, fires and executions in the city -> cards (main-stage rule). World-grid events -> world_refs.
# Dates: memory pass + web check (35 of 45 searches; no unauthorised book copies).
# Main sources: ko Wikipedia (Hanyang wall, palaces, Jongmyo, Sajikdan, gates, bridges, Hanseongbu, Seonggyungwan,
# royal tombs, Heungcheonsa, Wongaksa site); Sillok wiki at dh.aks.ac.kr (Taepyeonggwan, Jongnu, Jeongeobwon,
# Jangeuisa, Bongeunsa, Munsojeon, Suganggung, Gyotaejeon, Jaseondang, Jesaengwon, Hwarinseo, Nakcheonjeong,
# Mangwonjeong, Yeonhuigung, Apgujeong, Gyeongsiseo, Seonnongdan); encykorea.aks.ac.kr and Seoul city media pages
# through search summaries.
# Lunar dates: Western year of the event; a lunar date late in a Korean year can fall in the next Western year.
# A building -> its completion unless the text says "work starts".
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
