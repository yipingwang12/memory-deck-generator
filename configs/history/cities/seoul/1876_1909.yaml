# Dates: memory pass + web check (45 searches max; no unauthorised book copies). Main sources: ko and en Wikipedia
# (per-site and per-event articles), encykorea.aks.ac.kr, Seoul mediahub, Incheon city pages, Pressian, Korea Times.
# Lunar dates converted to the Western year of the day. A building -> its opening or completion; a work -> its
# first public appearance; a phase -> its start. Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
