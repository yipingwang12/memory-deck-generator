# Ganghwa, Palmido, Suwon, Siheung, Gyeonggi). Region: east_asia.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). The Joseon court and the Korean
# Empire sit in the city: accessions, court rituals, national laws, treaties -> out_refs. Palaces, walls, gates,
