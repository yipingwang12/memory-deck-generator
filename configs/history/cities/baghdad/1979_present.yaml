# Main sources: Wikipedia (Timeline of Baghdad, event articles, Years in Iraq), AP, Reuters, AFP,
# Al Jazeera, The National, Shafaq, Rudaw, CIA FOIA, UN documents, CSM, MERIP.
# A work -> first public appearance; a building or line -> its opening.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
