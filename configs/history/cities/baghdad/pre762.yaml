# centroscavitorino.it (Seleucia archive), CDLI, worldhistory.org, Britannica and Iranica via search,
# Xenophon (Anabasis, Perseus), Tacitus (Annals, via search).
# Range -> conventional c. date; one work of uncertain date -> midpoint; a phase -> its start.
# Hijri year over two Common Era years -> medium, year of the main source.
# Peg: last two digits of the year; approximate round hundreds -> first two digits.
# confidence: high | medium | low | disputed | unverified (no source found)
