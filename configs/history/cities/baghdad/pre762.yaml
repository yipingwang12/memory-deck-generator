# City: Baghdad x prehistory to 761 (Shaduppum / Tell Harmal and the Old Babylonian sites, Opis, Kassite
# Dur-Kurigalzu at Aqar Quf, Seleucia on the Tigris, Parthian and Sasanian Ctesiphon, Veh-Ardashir and Mahoza,
# the Arab conquest and Umayyad al-Mada'in, to the eve of al-Mansur's Round City). DRAFT 2026-11-26.
# Area: Baghdad Governorate plus Ctesiphon and Seleucia on the Tigris (Salman Pak, Tell Umar, Taq Kasra) and the
# old sites inside the governorate (Tell Harmal / Shaduppum, Tell Muhammad, Tell edh-Dhiba'i, Aqar Quf /
# Dur-Kurigalzu). Opis (Upi) is counted IN on its tentative site, Tall al-Mujailat, about 15 km north of Ctesiphon.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Seleucid, Parthian and Sasanian
# court events, Church of the East synods and elections, Umayyad and Abbasid court events -> out_refs.
# World-grid events -> world_refs.
# Dates: memory pass + web check (26 of 35 searches; no unauthorised book copies).
# Main sources: wikipedia.org (Ctesiphon, Seleucia, Al-Mada'in, Veh-Ardashir, Mahoza, Tell Harmal,
