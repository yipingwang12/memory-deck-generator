# City: Kolkata x prehistory to 1689 (Elgin Road pollen, Dum Dum mound, Tribeni and Saptagram, Portuguese Hooghly
# and Bandel, the siege of Hooghly, Dutch Chinsurah, the English at Hooghly and Sutanuti). DRAFT 2026-11-24.
# Area: Kolkata Metropolitan Area as decided (Kolkata, Howrah and Betor, Baranagar, Panihati, Khardah, Serampore
# and Mahesh, Chandannagar, Chinsurah, Hooghly and Bandel, Bansberia and Tribeni, Uluberia); Saptagram counts
# when a source places the event there.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). National, provincial and
# Company-government events -> out_refs. World-grid events -> world_refs.
# Dates: memory pass + web check (31 of 35 searches; no unauthorised book copies).
# Main sources: Wikipedia (History of Kolkata, Job Charnock, Siege of Hooghly, Bandel Church, Dutch Bengal,
# Chandannagar, Baranagar, Howrah, Chitpur, Kalikata, Gobindapur, Saptagram, Tribeni, Zafar Khan Ghazi Mosque
