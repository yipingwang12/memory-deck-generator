# Hughli City, Chinsura, Calcutta, Charnock, Hedges); news and heritage pages named in each source field.
# Hijri dates -> the Common Era year of the event; a Hijri year over two CE years -> first CE year, medium.
# Range -> conventional c. date; one work of uncertain date -> midpoint; a phase -> its start.
# Approximate year ending 00 -> first two digits; under 1000 -> year // 10. Peg: last two digits otherwise.
# Radiocarbon: calibrated dates first; a card with only an uncalibrated BP date is disputed (policy.md).
# confidence: high | medium | low | disputed | unverified (no source found)
