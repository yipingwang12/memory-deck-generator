# Area: Lagos State (Lagos Island, Ikoyi, Victoria Island, Lekki, Ebute Metta, Yaba, Surulere, Mushin, Apapa, Ajegunle, Ikeja,
# Agege, Badagry, Epe, Ikorodu, the Lagoon and the Lekki coast). Ota, Abeokuta, Ijebu-Ode, Porto-Novo and Ouidah are OUT.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). From 12 December 1991 Lagos is no longer the
# federal seat; Lagos State is a city government (its governors, laws and elections are IN). National events -> out_refs.
# World-grid events -> world_refs (subsaharan_africa cells). Dates: memory pass + web check (Wikipedia at wikipedia.org;
# 45 of 45 searches). Main sources: WP Timeline of Lagos, Lagos, governors, Lagos Rail Mass Transit, Lagos BRT, MMIA, Eko Atlantic,
# Lekki Free Zone; Guardian, ThisDay, Vanguard, Premium Times, Sahara Reporters, Nairametrics, HRW, Amnesty, NPR, Al Jazeera.
# Every card dated 2025 or 2026 is confirmed in two independent outlets, or it is marked unverified.
# A work -> first public appearance (premiere, opening); a building -> its opening or completion.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
