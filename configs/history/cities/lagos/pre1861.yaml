# City: Lagos x prehistory to 1860 (Late Stone Age finds near Badagry, the Benin camp of Eko, the Obas of Lagos,
# the Portuguese name, the slave trade at Lagos and Badagry, the missions at Badagry, Kosoko and Akitoye, the 1851
# attacks and the British consulate). DRAFT 2026-11-26.
# Area: Lagos State: Lagos Island (Isale Eko, Iga Idunganran), Iddo, Ebute Metta, Badagry and Apa, Epe, Ikorodu,
# the Lekki coast and Palma. Ota, Abeokuta, Ijebu-Ode, Porto-Novo and Ouidah are OUT.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). The Kingdom of Lagos (Obas, Idejo
# chiefs) is a city government: its successions, wars and acts are cards. The Lagos consulate is a city
# authority: its consuls and acts are cards. Benin acts for the whole kingdom and British regional policy ->
# out_refs. World-grid events -> world_refs. The cession of 6 August 1861 is in the next era (1861_1959).
# Dates: memory pass + web check (30 of 35 searches; no unauthorised book copies).
# Main sources: Wikipedia (Timeline of Lagos, History of Lagos, Oba of Lagos, the Obas' articles, Kosoko,
# Akitoye, Reduction of Lagos, Badagry, Treaty of Epe, William McCoskry, Eyo festival, Dutch Slave Coast),
# Walker, The Romance of the Black River (Project Canterbury), DACB (Gollmer), Dubawa, Lagos newspapers.
# Oba reign years: two chronologies exist (Ashipa c. 1600 in older lists, c. 1682 in later ones). The cards use
# the later list, which fits Mann (Lagos from 1760) and Law; both years are in `source`, confidence disputed.
# Radiocarbon: only an uncalibrated BP date -> disputed (policy.md).
# Peg: last two digits of the year; approximate year ending 00 -> first two digits.
# confidence: high | medium | low | disputed | unverified (no source found)
