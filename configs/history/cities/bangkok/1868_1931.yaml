# JSS 99 (Chittawadi, Politics of Defecation), company, school and hospital pages.
# Thai dates: BE = CE + 543; until 1940 the official year began on 1 April, so a January-March BE date maps to
# CE = BE - 542 (Nang Loeng market, Lahuthot prison, Memorial Bridge work).
# A work -> first public appearance (opening, premiere, first exhibition). A phase -> its start.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
