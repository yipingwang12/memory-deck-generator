# Tha Chalom and Mahachai; Nakhon Pathom). Region: southeast_asia.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). National events -> out_refs.
# The OUT rule covers the Siamese crown and government seated in Bangkok (accessions, coronations, national laws,
# treaties, ministries for the kingdom). Acts about the city (canals, roads, police, sanitation, the Ministry of
# the Capital), the Front Palace crisis and the Paknam blockade are IN. World-grid events -> world_refs.
# Dates: memory pass + web check (35 searches; no unauthorised book copies). Main sources: Wikipedia (English
