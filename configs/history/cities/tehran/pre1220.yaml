# Tabarak, Rashkan, Tepe Mil, Chal Tarkhan, Shah Abdol-Azim, Bibi Shahrbanu), Varamin and Pishva (Pardis, Sofalin,
# Qaleh Iraj), Damavand, Shahriar, Malard, Eslamshahr. Karaj, Alborz, Qazvin and Qom are OUT.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). National events -> out_refs.
# World-grid events -> world_refs. OUT rule: Buyid court at Rayy (943-1029), Seljuk court under Tughril (1043-1063).
