# City: Beijing x 1421 to 1643 (the Ming capital: Zhengtong's gates, the Oirat siege, Jiajing's altars and
# Outer City, Wanli's temples and tombs, palace fires, the Wanggongchang blast, the Jin and Qing raids). DRAFT 2026-11-20.
# Area: Beijing Municipality (Inner and Outer cities, Imperial City and Western Park, Western Hills, Changping and
# the Ming Tombs, Badaling, Mutianyu, Juyongguan, Lugou, Tongzhou and Zhangjiawan, Miyun, Huairou, Fangshan).
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Ming court events (accessions,
# imperial burials, court purges, national decrees and armies) -> out_refs; palaces, gates, walls, temples, tombs,
# fires, raids, riots and public executions in the city -> cards (main-stage rule). World-grid events -> world_refs.
# Dates: memory pass + web check (24 of 45 searches; no unauthorised book copies).
# Main sources: Ming shi annals (juan 7-24) and river treatises (juan 86-87) on zh.wikisource; zh and en
# Wikipedia (Beijing walls, Outer City, Zhengyangmen, Forbidden City halls, temples, mosques, Ming Tombs, Leopard
# House, Jisi incident); visitbeijing.com.cn, people.com.cn and thepaper.cn through search summaries.
# Lunar dates late in a Chinese year -> the Western year of the day (Man Gui's death, Chongzhen 2/12 -> 1630).
# A building -> its completion unless the text says "work starts". A book -> its completion or printing.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
