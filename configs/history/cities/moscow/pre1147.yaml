# City: Moscow x before 1147 (prehistory: Zaraysk, the Mesolithic and Neolithic peat-bog sites, Lyalovo and
# Volosovo, the Fatyanovo culture, the Dyakovo hillforts, the dark centuries, the Slavic colonists and the
# Novgorod and Suzdal border before the first chronicle mention of Moscow). DRAFT 2026-11-19.
# Area: Moscow city in its 2012 borders and Moscow Oblast (Kremlin hill, Kolomenskoye, Tsaritsyno, Kuntsevo,
# Zvenigorod, Sergiyev Posad district, Istra, Odintsovo, Podolsk, Ramenskoye, Shchyolkovo, Korolyov, Kolomna,
# Zaraysk, Mozhaysk, Volokolamsk).
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). National events -> out_refs.
# World-grid events -> world_refs (the first mention of Moscow in the chronicle starts the next era).
# Dates: memory pass + web check (21 of 25 searches; no unauthorised book copies).
# Main sources: N. A. Krenke, doctoral thesis abstract (IA RAN, 2014), "Antiquities of the Moskva river basin
# from the Neolithic to the Middle Ages"; S. Z. Chernov, "Mogutovo sphragistic complex of the 12th century and
# the prehistory of Moscow" (IA RAN, 2023, open PDF); Moscow Kremlin Museums (unesco.kreml.ru archaeology page);
# Don's Maps (Zaraysk); Open Archaeology 2023 and CSIC 2012 (Zamostje 2); popular-archaeology.com (Pavlovskaya
# Sloboda); m24.ru and mos.ru (Dyakovo hillfort); Tsaritsyno museum (mounds).
# Range -> conventional c. date; one event of uncertain date -> midpoint; a phase -> its start.
# Coin-dated deposits -> soon after the youngest coin (approximate).
# >= 10,000 years -> years_ago (peg = first two digits). Approximate year ending 00 -> first two digits.
# Radiocarbon: calibrated dates first; a card with only an uncalibrated BP date is disputed (policy.md).
# Peg: last two digits of the year otherwise.
# confidence: high | medium | low | disputed | unverified (no source found)
