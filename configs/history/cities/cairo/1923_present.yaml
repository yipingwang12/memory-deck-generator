# City: Cairo x 1923 to the present (the kingdom, the republic, the megacity). DRAFT 2026-11-19.
# Area: Greater Cairo, the Cairo and Giza governorates (downtown, Garden City, Zamalek, Bulaq, Shubra,
# Abbasiya, Heliopolis, Nasr City, Muqattam, Maadi, Helwan, Tora, Giza, Dokki, Agouza, Mohandessin, Imbaba,
# the pyramids, Saqqara, Dahshur, Abusir, the new cities: 6th of October, Sheikh Zayed, New Cairo, Badr,
# and the New Administrative Capital east of New Cairo). Shubra el-Kheima and Obour (Qalyubia) are out.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Cairo is the seat of the
# kings and of the republic: national laws, accessions, elections, treaties and summits -> out_refs.
# Main-stage events (riots, mass protests, assassinations and attacks in the city) are cards.
# World-grid events -> world_refs (world year kept).
# Dates: memory pass + web check (45 of 45 searches; no unauthorised book copies).
# Main sources: Wikipedia (Timeline of Cairo, History of Cairo, Cairo Metro, Cairo International Airport,
# Terrorism in Egypt, Zabbaleen, single articles), Ahram Online, Al Jazeera, AP and Reuters reports.
# Modern discoveries in the area are cards (science) when no world cell holds them.
# A work -> first public appearance; a building -> opening; a district -> founding decree or plan.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
