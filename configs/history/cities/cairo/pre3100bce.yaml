# City: Cairo x before 3100 BCE (Palaeolithic, Neolithic Merimde and Omari, the Maadi culture with its
# Maadi, Wadi Digla, Heliopolis and Es-Saff sites, late Predynastic Helwan and Tura). DRAFT 2026-11-19.
# Area: Greater Cairo (Cairo and Giza governorates) with Memphis, Saqqara, Dahshur and Abusir: Maadi, Wadi
# Digla, Helwan and Wadi Hof (El Omari), Tura, Heliopolis (Matariya), Es-Saff, Merimde Beni Salama (Giza
# governorate, western Delta edge), Tarkhan and Gerzeh (Kafr Ammar and Girza, al-Ayyat markaz, Giza governorate).
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). National events -> out_refs.
# World-grid events -> world_refs (Memphis founding c. 3100 BCE starts the next era).
# Dates: memory pass + web check (25 of 25 searches; no unauthorised book copies).
# Main sources: Hartung, Paleorient 39.1 (2013), Maadi radiocarbon; IntChron EgyptDB (El Omari, Merimde,
# Wadi Digla 14C); eHRAF Archaeology abstracts (Debono & Mortensen 1988, 1990; Rizkana & Seeher 1990;
# Boessneck et al. 1989); Univ. Leipzig / idw 2019 and SCA reports (Heliopolis); Univ. Vienna (Helwan).
# Chronology: Oxford History of Ancient Egypt (Shaw 2000) for the city; calibrated 14C first.
# Range -> conventional c. date; one work of uncertain date -> midpoint; a phase -> its start.
# >= 10,000 years -> years_ago (peg = first two digits). Approximate year ending 00 -> first two digits.
# Radiocarbon: calibrated dates first; a card with only an uncalibrated BP date is disputed (policy.md).
# Peg: last two digits of the year otherwise.
# confidence: high | medium | low | disputed | unverified (no source found)
