# City: Cairo x 641 to 968 (Fustat, al-Askar and al-Qata'i: from the Arab foundation to the eve of the
# Fatimid conquest). DRAFT 2026-11-19.
# Area: Greater Cairo (Cairo and Giza governorates) with Memphis, Saqqara, Dahshur and Abusir: Fustat and the
# Babylon fortress (Qasr al-Sham'), al-Askar, al-Qata'i, Rawda island, Giza, Hulwan, the Qarafa and the Muqattam.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Governors, the Tulunid and
# Ikhshidid courts and Coptic patriarchal acts -> out_refs; a ruler's mosque, palace, fort, bridge, dockyard or
# hospital is IN; sieges, mutinies, riots, lynchings and battles at the city are IN (main-stage rule).
# World-grid events -> world_refs. A thin era: many key events (Fustat, the Mosque of Amr, al-Qata'i, the
# Rawda nilometers, Ibn Tulun's hospital and mosque) are world_refs.
# Dates: memory pass + web check (35 of 45 searches; no unauthorised book copies).
# Main sources: wikipedia.org (Abd al-Aziz ibn Marwan, Ahmad ibn Tulun, Mosque of Ibn Tulun, First and Second
# Fatimid invasions of Egypt, Ikhshidid dynasty, Abu al-Misk Kafur, Hafs ibn al-Walid, Ubaydallah ibn al-Sari,
# Hanging Church, Ben Ezra Synagogue, Saints Sergius and Bacchus Church, Qarafa, Khalij, Old Cairo; Arabic WP
# al-Fustat), Akkush's history of the Ibn Tulun mosque (OpenITI), Hebrew University Rawda dockyard study,
# al-Ahram (Istabl Antar), search summaries (hawramani lexicon, Universalis, IIS Fatimid medicine).
# Hijri years: the Common Era year in which most of the Hijri year falls; calendar straddle -> medium.
# Range -> conventional c. date; one work of uncertain date -> midpoint; a phase -> its start.
# Peg: last two digits of the year (approximate round years: first two digits; under 1000: year // 10).
# confidence: high | medium | low | disputed | unverified (no source found)
