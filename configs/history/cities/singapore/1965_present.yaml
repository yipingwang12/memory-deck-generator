# City: Singapore x 1965 to the present (separation, the MacDonald House bombing aftermath, the British withdrawal,
# Changi Airport, the MRT, the Nicoll Highway collapse, the Esplanade and Marina Bay, the Youth Olympics, Lee Kuan Yew's
# death, COVID-19, the handover to Lawrence Wong, the Circle Line loop). DRAFT 2026-11-26.
# Area: Singapore island and its islands (Singapore River, Kampong Glam, Chinatown, Little India, Tanjong Pagar, Keppel
# Harbour, Changi, Jurong, Sentosa, Pulau Ubin, Pulau Tekong, the causeway) plus Johor Bahru (the city, Iskandar Puteri,
# Pasir Gudang, the Johor Strait). Johor Lama, Kota Tinggi, Muar, Batam, Bintan, Riau are OUT.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject").
# The Republic is a city-state: its national acts are IN; foreign treaties and acts abroad -> out_refs.
# Johor Bahru: state-wide and Malaysian federal acts -> out_refs; the town, its buildings, transport and port are IN.
# World-grid events -> world_refs. Dates: memory pass + web check (45 searches; no unauthorised book copies).
# Main sources: wikipedia.org ("<year> in Singapore", Timeline of Singaporean history, single articles), LTA, PMO, news.
# Cards dated 2025-2026 carry two independent outlets, else unverified.
# A building or line -> its opening to the public; a phase -> its start.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
