# City: Singapore x prehistory to 1818 (the Tuas stone axe, Pu Luo Chung, the Singapore Stone, Longyamen and
# the Yuan envoys, Temasek on Fort Canning Hill and its rampart, Parameswara, the Malacca and Johor years, the
# shahbandar and its burning by the Portuguese, ships and wrecks in the Singapore Strait, the Raja Negara and the
# Siak wars, the Temenggong at the river mouth). DRAFT 2026-11-26.
# Area: Singapore island and its islands (Pedra Branca, Pulau Ubin, Blakang Mati) plus Johor Bahru. Johor Lama,
# Kota Tinggi, the Johor River, Malacca, Batam, Bintan and Riau are OUT. No dated pre-1819 event found for Johor
# Bahru (a Malay fishing village until Tanjung Puteri, 1855). Raffles's landing (January 1819) is in the next era.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Legendary dates (Sang Nila Utama)
# and Johor-wide and outside-area events -> out_refs. World-grid events -> world_refs.
# Dates: memory pass + web check (16 of 30 searches; no unauthorised book copies). Thin era: not padded.
# Main sources: Wikipedia en (History of Singapore, Early history of Singapore, Temasek, Kingdom of Singapura,
# Singapore Stone, Fort Canning Hill, Santa Catarina, Juan de Silva, Alexander Hamilton (sailor), Temenggong
# Abdul Rahman); NUS Press site reports (Temasek sites); NHB media release 2021 (Pedra Branca wrecks); BiblioAsia
# (stone tools, Eredia map, premodern knowledge of Singapore); ISEAS (Raja Negara and Siak); L. Andaya, IPS slides.
# Range -> conventional c. date; a phase -> its start; one work of uncertain date -> midpoint. Approximate year
# ending 00 -> first two digits. Peg: last two digits otherwise.
# confidence: high | medium | low | disputed | unverified (no source found)
