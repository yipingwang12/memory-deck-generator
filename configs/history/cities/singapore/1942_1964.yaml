# riots and strikes, self-government, HDB and Jurong, merger with Malaysia, the 1964 riots, Konfrontasi bombs).
# DRAFT 2026-11-26.
# Area: Singapore island and its islands (the old town, Fort Canning, Kampong Glam, Changi, Jurong, Blakang Mati,
# Pulau Ubin, Pulau Tekong, the causeway) plus Johor Bahru. Johor Lama, Kota Tinggi, Muar, Batam, Bintan, Riau OUT.
# Region: southeast_asia.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). National events -> out_refs.
# The OUT rule covers Malaya-wide acts of the Japanese military administration seated at Syonan (1942-1945), the
# British Military Administration of Malaya, Malaysian federal acts (1963-1965) and Johor state acts (sultans'
# accessions). The Crown Colony (1946-1959) and the State of Singapore (1959-1963) are city governments: IN. Acts about
# Singapore made in London are IN. Main stage (cities.md): the invasion and fall, Sook Ching massacres, the 1945
# surrender, the riots, Konfrontasi bombs. Radio and television go under science; newspapers and airlines under economy.
# MacDonald House (1965), separation and all later events -> next era.
# World-grid events -> world_refs. Dates: CE.
# Dates: memory pass + web check (36 of 45 searches; no unauthorised book copies). Main sources: Wikipedia at
# wikipedia.org (Year in Singapore pages, topic articles), NLB BiblioAsia and Infopedia, Roots.gov.sg, SG101,
# Hansard, National Archives of Singapore, Docomomo Singapore.
# A work -> first public appearance (opening, premiere, first publication). A phase -> its start.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
