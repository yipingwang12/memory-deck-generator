# City: Sydney x prehistory to 1787 (the oldest sites on the Hawkesbury-Nepean and Parramatta rivers, the Blue
# Mountains and Illawarra shelters, the drowning of the harbour, the Eora, Darug and Dharawal toolmakers, Cook at
# Kurnell in 1770, Banks's case for Botany Bay). DRAFT 2026-11-26.
# Area: Greater Sydney (Sydney Cove, the CBD, Port Jackson, Botany Bay with La Perouse and Kurnell, Parramatta, the
# Hawkesbury towns, Penrith, Campbelltown, Rouse Hill, the Northern Beaches, Cronulla) plus the Blue Mountains and
# Wollongong (the Illawarra coast). The Central Coast, Newcastle, Lithgow and the Jenolan Caves are OUT.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). British national acts and plans for
# the colony -> out_refs. World-grid events -> world_refs (backed-blade decline, shell fishhooks, Narrabeen Man,
# Cook's landing, Banks's plants, Parkinson's Journal, Lord Sydney's letter). The First Fleet's arrival (1788) is in the next era.
# Dates: memory pass + web check (23 of 35 searches). Main sources: Williams et al. 2014 (JQS, Pitt Town),
# Williams et al. 2017 (Peach Tree Creek), Williams et al. 2020 (Parramatta hornfels), Owen et al. 2024 (Archaeology
# in Oceania, Parramatta ochre), Attenbrow 2012 (Proc. Linn. Soc. NSW, Royal NP), UNSW 2021, Stockton (Mt Wilson
# paper 5), Cook's journal (South Seas edition), WP (Botany Bay, Kamay, Forby Sutherland, Gweagal Shield, First
# voyage of Cook, Sydney rock engravings, Red Hands Cave), ADB, Tink (APR), Royal Society prints, Sydney Barani.
# Few calendar dates exist before Cook: most early cards are (approximate). No padding.
# Range -> conventional c. date; one work of uncertain date -> midpoint; a phase -> its start.
# Calibrated radiocarbon first; a card with only an uncalibrated BP date -> disputed.
# >= 10,000 years -> years_ago (peg = first two digits). Approximate year ending 00 -> first two digits.
# Peg: last two digits of the year otherwise.
# confidence: high | medium | low | disputed | unverified (no source found)
