# City: Mexico City x 100 BCE to 1324 CE (Teotihuacan, Xitle, the Toltec-era valley, Tenayuca, Texcoco, Azcapotzalco, Culhuacan). DRAFT 2026-11-21.
# Area: Valley of Mexico metro (all 16 CDMX boroughs + State of Mexico valley municipalities: Teotihuacan, Texcoco, Tenayuca,
# Chalco, Chimalhuacan, Zumpango, Coatlinchan, Huexotla). Tula, Cholula and Puebla are OUT.
# Rules: cities.md (Mexico City section: accessions of tlatoque and campaigns far from the valley OUT), then policy.md.
# Grouped by theme ("Theme of each subject"). National events -> out_refs. World-grid events -> world_refs.
# Dates: memory pass + web check (29 of 35 searches; no unauthorised book copies). Main sources: wikipedia.org (Teotihuacan,
# Pyramid of the Moon, Temple of the Feathered Serpent, Teotihuacan Ocelot, Culhuacan, Azcapotzalco, Tenayuca, Texcoco,
# Xochimilco, Huejotla, Cerro de la Estrella, es: Mexicas), Nichols et al. 2002 (Ancient Mesoamerica, Postclassic ceramics),
# INAH (La Ventilla, Cerro de la Estrella), Sugiyama et al. (Plaza of the Columns), PLoS ONE 2015 (Teopancazco),
# Radiocarbon 2021 (Xalla), Anales de Cuauhtitlan via UNAM.
# Mexica year-signs: the years the sources give (common correlation). Traditional chronicle dates -> (traditional date).
# Range -> conventional c. date; one work of uncertain date -> midpoint; a phase -> its start.
# Peg: last two digits of the year. Approximate year ending 00 -> year // 10 under 1000, first two digits from 1000.
# confidence: high | medium | low | disputed | unverified (no source found)
