# City: Mexico City x 1325 to 1520 (Tenochtitlan, Tlatelolco, Texcoco and the Triple Alliance). DRAFT 2026-11-21.
# Area: Valley of Mexico metro (CDMX, all 16 boroughs, and the State of Mexico municipalities of the valley:
# Texcoco, Huexotla, Tenayuca, Tepexpan, Acolman, Cuautitlan, Chalco, Xaltocan ...). Tula, Toluca, Cholula OUT.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). Accessions, royal births and deaths
# and campaigns far from the valley -> out_refs. World-grid events (latin_america cells) -> world_refs.
# Dates: memory pass + web check (31 of 45 searches; no unauthorised book copies). Mexica year names are converted
# with the correlation each source uses; chronicle variants -> disputed with both years in source.
# Main sources: wikipedia.org (Tenochtitlan, Templo Mayor, Nezahualcoyotl, Tlatelolco, Moctezuma I and II,
