# INAH pages, UCSD Aztec chronology (D. K. Jordan), Gaceta UNAM, World History Encyclopedia.
# Range -> conventional c. date; one work of uncertain date -> midpoint; a phase -> its start.
# Peg: last two digits of the year (approximate round years: first two digits).
# confidence: high | medium | low | disputed | unverified (no source found)
