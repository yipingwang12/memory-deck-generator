# World-grid events -> world_refs. Dates: CE.
# Dates: memory pass + web check (24 of 45 searches; no unauthorised book copies). Main sources: Wikipedia at
# wikipedia.org (English and Indonesian articles per site), historia.id, tirto.id, Archipel, Papers Past,
# Bisnis.com, Britannica, Leiden thesis (Ravando Lie), FKUI history page.
# A work -> first public appearance (opening, premiere, first publication). A phase -> its start.
# Peg: last two digits of the year.
# confidence: high | medium | low | disputed | unverified (no source found)
