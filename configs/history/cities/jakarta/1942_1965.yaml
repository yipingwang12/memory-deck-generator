# Area: Jabodetabek (DKI Jakarta with the Thousand Islands, Bogor, Depok, Tangerang with Serpong, Bekasi).
# Banten Lama, Serang, Rengasdengklok, Karawang, Bandung and Cirebon are OUT. Region: southeast_asia.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). National events -> out_refs.
# The OUT rule covers the Japanese military administration of Java (1942-1945) and the Republic of Indonesia
# (from 1945; not 1946-1949, when the capital was Yogyakarta). The Dutch government at Batavia (1945-1949) is
