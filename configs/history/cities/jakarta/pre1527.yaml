# City: Jakarta x prehistory to 1526 (the Ciliwung farming sites, Pasir Angin, the Buni culture, the
# Tarumanagara inscriptions and Sundapura, Kebon Kopi II, Pakuan Pajajaran under Sri Baduga, Kalapa the port,
# Tome Pires, the first Portuguese ships and the padrao of 1522). DRAFT 2026-11-24.
# Area: Jabodetabek as decided (DKI Jakarta with Sunda Kelapa and Tugu; Bogor with Pakuan, Batutulis,
# Ciaruteun, Kebon Kopi, Cibungbulang and the Puncak; Depok; Tangerang; Bekasi with Buni and Kebantenan).
# Karawang (Batujaya, Cibuaya), Banten and Pandeglang (Cidanghiang) and Sukabumi (Sanghyang Tapak) are OUT.
# Rules: cities.md, then policy.md. Grouped by theme ("Theme of each subject"). The Sunda court and
# national embassies -> out_refs. World-grid events -> world_refs.
# Dates: memory pass + web check (16 of 35 searches; no unauthorised book copies).
# Main sources: Wikipedia en (History of Jakarta, Sunda Kelapa, Sunda Kingdom, Luso-Sundanese padrao,
# Bujangga Manik, Batutulis inscription, Sri Baduga Maharaja); Wikipedia id (Sejarah Jakarta, Pakuan
# Pajajaran, Tarumanagara, Prasasti Tugu, Prasasti Kebon Kopi II, Prasasti Kebantenan, Prasasti Pasir Awi,
# Prasasti Muara Cianten, Situs Pasir Angin); Berkala Arkeologi (Pasir Angin bronzes); NOW! Jakarta;
# Liputan6 (Condet); Dinas Kebudayaan DKI Jakarta (Sejarah Singkat Jakarta 2023).
# Saka year + 78 = CE. Reign spans and undated works of one reign -> midpoint, approximate. Range ->
# conventional c. date; a phase -> its start. Approximate year ending 00 -> first two digits; under 1000 ->
# year // 10. Peg: last two digits otherwise.
# confidence: high | medium | low | disputed | unverified (no source found)
