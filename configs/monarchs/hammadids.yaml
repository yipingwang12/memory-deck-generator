wikipedia_list: "Hammadid dynasty"
# 1014 vs 1015 for Hammad's independence is a genuine source disagreement, NOT an error, and is
# deliberately left at Wikidata's 1014. Wikipedia's ruler list (Bosworth, *The New Islamic
# Dynasties*, p. 35) dates independence to 1015; the same article's Establishment section
# (Huebner 1996) and the Hammad ibn Buluggin article both say 1014, as does the title of
# *Hammadid-Zirid War (1014-1018)*. Independence was a process — the renunciation of Fatimid
# allegiance, the war, and Zirid recognition in 1017 are separate events — and sources anchor
# "the dynasty begins" to different ones. Reviewed 2026-08-23; same class as Orhan's 1324/1326.
corrections:
  - year: 1104
    action: drop
    reason: "Al-Mansur ibn al-Nasir died January 1105 and Badis ibn Mansur reigned January to 27 July 1105; Wikidata dates both al-Mansur's end and Badis's accession to 1104, and then starts Abd al-Aziz in 1105, leaving a year in which Badis had stopped ruling and nobody had begun"
    source: "Al-Mansur ibn al-Nasir; Badis ibn Mansur (Hammadid) (both citing Idris 1962, p. 282); Hammadid dynasty, List of rulers (Bosworth 2004, p. 35)"
    checked: "2026-08-23"
  - year: 1105
    action: add
    count: 2
    reason: "1105 carries TWO transitions — al-Mansur to Badis in January, Badis to Abd al-Aziz on 27 July. Wikidata supplies only the second (Abd al-Aziz's accession), so the count tops the year up to both"
    source: "Badis ibn Mansur (Hammadid); Abd al-Aziz ibn Mansur (both citing Idris 1962, p. 282)"
    checked: "2026-08-23"
