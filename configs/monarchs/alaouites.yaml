subject: "Alaouites"
# Added 2026-08-11 from a Wikidata coverage survey of 24 North African dynasties.
# Position and house Q-numbers were verified by counting DATED holders (P580) before
# building — see the survey notes in PRD.md.
# TWO positions because the title changed in 1957 (sultan -> king), the same era-split pattern as
# Britain's four. `houses` is essential: Alaouite family members also hold ambassadorships and
# UNESCO roles, none of which are reigns; listing only the two throne positions excludes them.
positions:
  - Q14566713   # sultan of Morocco
  - Q14566719   # King of Morocco
houses:
  - Q1129036   # 'Alawi dynasty
chunk_years: 100
chunk_start_year: 1600
group: "North African Monarchs"
# 2026-08-27: the 1727–1757 turmoil is lifted onto its own card.
#
# After Moulay Ismail's death the sultanate changed hands fifteen times in thirty years — his
# sons deposing one another, Abdallah alone taking the throne six times. Wikidata holds only
# Abdallah's reigns, so the timeline card showed his six accessions with nothing between them,
# which reads as a stable reign interrupted rather than a scramble. Adding the missing six
# transitions instead would have made the 1700s card eighteen digits, eleven of them inside
# those thirty years and carrying repeated 8…8, 6…6 and 1…1 — past the density this deck can
# carry, and past the ~15 gate applied to Denmark's 1100s.
#
# So the turmoil MOVES rather than duplicating: the drops below take Abdallah's reigns off the
# timeline card, leaving it as the dynasty's main thread — Ismail's death, Mohammed III, Yazid,
# Slimane — and the interregnum card carries all fifteen accessions in order. 1727 sits on both,
# as the Saadi 1603 does: on the timeline it is Ismail's reign ending, on the interregnum card it
# is Ahmad's accession. Same event, the two framings each card needs.
#
# CONTESTED, and flattened here: Abdalmalik's own article gives him March 1728 – March 1729,
# while the ruler list and Ahmad's article have Ahmad restored in July 1728 and deposed on the
# day of his death, 5 March 1729. The two were most likely claiming simultaneously from
# different bases. The card follows the ruler list's sequence.
#
# THINLY SOURCED, and taken from the ruler list alone: Ali ibn Ismail, Muhammad ibn Ismail and
# Zin al-Abidin have no article of their own. Muhammad is corroborated obliquely (in 1738 Aouda
# Doukalia had al-Mostadi crowned "in place of Sultan Mohammed ben Ismail, who was thus
# overthrown"); Ali is named as Abdallah's successor in Abdallah's article; Zin al-Abidin is the
# weakest of the three.
corrections:
