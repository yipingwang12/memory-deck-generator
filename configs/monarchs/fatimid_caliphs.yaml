    action: drop
    reason: "Calendar-conversion artifact, not a transition. Al-Mustansir died 18 Dhu'l-Hijja 487 AH = 29 Dec 1094, and al-Musta'li acceded the same day. Wikidata ends the reign 1095-01-12 at day precision while recording the death as 1094-01-16 — it contradicts itself, and neither value matches the sources: Wikipedia notes the AH date is 'sometimes given as 6 January 1095, but 29 December is the date commonly used'. The 1095 event also produced a spurious overlap with al-Musta'li's 1094 accession. 1094 is already a transition year via that accession, so this is a drop with no matching add"
    source: "Al-Mustansir Billah; Al-Musta'li"
