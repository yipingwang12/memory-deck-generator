# Start at 500 CE: the 11 legendary emperors with traditional BCE/early-CE
# accession dates (Jimmu 660 BCE …) are excluded; deck covers the historical line.
chunk_start_year: 500
wikipedia_list: "List of emperors of Japan"
# 2026-08-26: six reigning empresses are absent from Wikidata's `Emperor of Japan` (Q208233)
# holders — Kōgyoku, Saimei, Genmei, Genshō, Kōken and Shōtoku. Suiko and Jitō are present and
# correctly dated, so this is not a blanket exclusion of women; it is an upstream coverage gap.
# Only THREE of the six cost a digit. Genmei (707), Kōken (749) and Shōtoku (764) each acceded
# in the year the predecessor's reign already ends, and that end year is already a digit — so
# adding them would double a transition that happened once, not restore a missing one.
