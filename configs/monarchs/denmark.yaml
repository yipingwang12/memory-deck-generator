# Valdemar the Young was JUNIOR KING (co-ruler), never sole monarch: elected co-king 1215,
# crowned at Schleswig 1218, killed by a stray arrow hunting at Refsnæs 28 Nov 1231 aged 21.
# Valdemar II reigned continuously 1202–1241 throughout and after, and Eric simply became the
# next junior co-king — so neither year is a transition of the throne. Same failure mode as the
# consort contamination on Byzantium's position (see PRD): the title is held by someone who
# never held the throne. Checked 2026-08-11 against "Valdemar the Young".
#
# NOT corrected — 1533/1534 is a REAL interregnum and both digits are earned. Frederick I
# reigned to his death (Apr 1533); the Catholic Rigsraad refused to elect the Lutheran
# Christian III and proclaimed Count Christopher of Oldenburg regent instead, which became the
# Count's Feud (1534–36). Christian III's reign dates from 14 Jul 1534.
