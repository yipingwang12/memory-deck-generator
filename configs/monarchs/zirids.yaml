subject: "Zirids"
# Added 2026-08-11 from a Wikidata coverage survey of 24 North African dynasties.
# Position and house Q-numbers were verified by counting DATED holders (P580) before
# building — see the survey notes in PRD.md.
# DELIBERATELY EXCLUDES `emir of Granada` (Q33083118), which 3 family members hold: that is the
# Zirid taifa of Granada in al-Andalus, a different polity from Zirid Ifriqiya. Including it
# would interleave two realms' successions into one digit string.
#
# 2026-08-23: that exclusion was leaking. Q1097498 "ruler" is generic, and it walked the taifa of
# MALAGA in through the side door — Tamim ben Bologhin (1072–1090), two of the four digits on the
# 1000s card, from the realm the Granada exclusion exists to keep out. Dropped by year below,
# since corrections patch transition years and there is no per-person exclusion for monarchs.
# The generic position cannot simply be removed: Bologhine ibn Ziri and al-Hasan ibn Ali are
# filed nowhere else.
positions:
  - Q51680298   # Emir of Ifriqiya
  - Q1097498   # ruler — GENERIC; see the Malaga note above
  - Q14698333   # viceroy of Ifriqiya — where Yahya ibn Tamim (1108–1116) is filed
houses:
  - Q205718   # Zirid Dynasty
# 2026-08-26: the Malaga leak now uses per-person exclusion instead of dropping its two years.
# The year-drops worked, but said "1072 and 1090 are not transitions" when the truth is "this
# man ruled a different realm" — and they would go stale silently if either date were revised
# upstream. `exclude_people` states the actual claim and survives a re-dating.
exclude_people:
  - Q3514822   # Tamim ben Bologhin — Zirid taifa of MALAGA, al-Andalus, not Ifriqiya
chunk_years: 100
chunk_start_year: 900
group: "North African Monarchs"
wikipedia_list: "Zirid dynasty"
corrections:
  - year: 995
    action: drop
    reason: "Badis ibn al-Mansur acceded in 996, on al-Mansur's death; Wikidata stamps 0995-01-01"
    source: "Zirid dynasty, List of Zirid rulers (Idris 1962, pp. 831-833)"
    checked: "2026-08-23"
  - year: 996
    action: add
    reason: "Badis ibn al-Mansur's accession, 996"
    source: "Zirid dynasty, List of Zirid rulers (Idris 1962, pp. 831-833)"
    checked: "2026-08-23"
  - year: 1152
    action: drop
    reason: "Al-Hasan ibn Ali carries two 'ruler' statements, 1121-1152 and 1121-1148; dedup keeps the LATEST end year and so discards the correct one. 1152 conflates the end of Zirid rule with his later detention in Algiers"
    source: "Zirid dynasty, End of Zirid rule (Abun-Nasr 1987, p. 92; Baadj 2015, p. 35)"
    checked: "2026-08-23"
  - year: 1148
    action: add
    reason: "Al-Hasan abandoned Mahdia to the Norman fleet in 1148, ending Zirid rule"
    source: "Zirid dynasty, End of Zirid rule (Abun-Nasr 1987, p. 92; Baadj 2015, p. 35)"
    checked: "2026-08-23"
