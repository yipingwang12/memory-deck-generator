subject: "Wattasids"
# Added 2026-08-11 from a Wikidata coverage survey of 24 North African dynasties.
# Position and house Q-numbers were verified by counting DATED holders (P580) before
# building — see the survey notes in PRD.md.
# Only 3 dated reigns of a dynasty that ruled ~1472-1554; thin, and likely incomplete upstream.
positions:
  - Q14566713   # sultan of Morocco
houses:
  - Q970799   # Wattasid dynasty
chunk_years: 100
chunk_start_year: 1400
group: "North African Monarchs"
# 2026-08-29: extended at both ends after a web check. The deck ran 1472–1549; the dynasty ran
# 1420–1554, and both boundaries were wrong for the same reason — Wikidata's `sultan of Morocco`
# holders cover only the years the Wattasids held the throne outright.
#
# BEFORE 1472 — the vizierate. The Wattasids held the Marinid vizierate for nearly forty years
# before taking the throne, and "these viziers gradually assumed many of the powers of the
# sultans". In 1458–59 the Marinid Abd al-Haqq II reasserted control and suppressed the family;
# after his assassination in 1465 they returned and took Fez in 1472.
#
# These three are VIZIER successions sitting on a card whose other digits are SULTAN successions,
# which is a real conflation and is why it is written down here. Kept on the timeline rather than
# given their own card because the vizierate is SEQUENTIAL — it ended in 1459, the sultanate
# began in 1472, and the two never overlap. That is what separates this from the Saadi Marrakesh
# and Fes lines, which ran simultaneously and genuinely could not share a card. The Saadi
# al-Qa'im and al-A'raj set the precedent: not sultans of Morocco either, and on the timeline as
# the dynasty's origin phase.
#
# 1420 also appears in the MARINID deck, as Abd al-Haqq II's accession — the same year read from
# the two sides of the same arrangement. No collision: item keys carry the deck.
#
# AFTER 1549 — Ali Abu Hassun. Regent from 1545, when Ahmad was taken prisoner by the Saadis;
# lost Fez in 1549; retook it in 1554 with Ottoman help under Salah Rais and was installed as
# Sultan of Fez, supported by janissaries; killed at the Battle of Tadla in September 1554,
# ending the dynasty. The canonical ruler list gives him "1549–1554" (his claim from the loss of
# Fez) and the dynasty article "1554–1554" (his actual rule); 1554 alone is taken, because 1549
# is already a digit and adding it there would double one transition.
#
# NOT ADDED, because it costs no digit: Nasir ad-Din al-Qasri (1545–1547), for whom Abu Hassun
# was regent. His accession coincides with Ahmad's 1545 deposition and his end with Ahmad's 1547
# restoration, and both are already digits — the same case as the Japanese empresses.
