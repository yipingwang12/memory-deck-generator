subject: "Idrisids"
# Added 2026-08-11 from a Wikidata coverage survey of 24 North African dynasties.
# Position and house Q-numbers were verified by counting DATED holders (P580) before
# building — see the survey notes in PRD.md.
# 'sultan' is a generic position, so `houses` is load-bearing: without it this pulls every
# sultan on Wikidata. It is also anachronistic for 9th-century Idrisids (who used imam/emir),
# but it is where Wikidata records their reigns. The family also has a stray 'sultan of
# Morocco' statement dated 1465 (the Idrisid sharifian restoration in Fez, five centuries
# after the dynasty ended); that position is deliberately NOT listed here, which excludes it.
positions:
  - Q43292   # sultan — GENERIC, shared across Islamic history
houses:
  - Q431575   # Idrisid dynasty
chunk_years: 100
chunk_start_year: 800
group: "North African Monarchs"
