subject: "Safavid Shahs"
positions:
  - Q20110796   # Safavid monarch (used as the P39 position value for Safavid shahs on Wikidata)
# Wikidata has two plain accession-year errors here, both confirmed by adversarial cross-check
# on 2026-07-16 (3/3 refuters failed to refute). Expressed as drop/add of transition years
# because the pipeline has no way to correct a ruler's accession year directly — see PRD.
corrections:
  - year: 1502
    action: drop
    reason: "Ismail I's accession is 1501 (crowned 22 Dec 1501), not 1502; no article location gives 1502"
    source: "Safavid dynasty; Ismail I"
    checked: "2026-07-16"
  - year: 1501
    action: add
    reason: "the real Ismail I accession year, and the dynasty's first transition; replaces the dropped 1502"
    source: "Safavid dynasty; Ismail I"
    checked: "2026-07-16"
  - year: 1729
    action: drop
    reason: "Tahmasp II acceded 1722 (declared shah at Qazvin, 10 Nov 1722); 1729 is when he regained control after the Afghan occupation, not his accession. No matching add needed — 1722 is already a transition year via Soltan Hoseyn's end year"
    source: "Safavid dynasty; Tahmasp II"
    checked: "2026-07-16"
  - year: 1588
    action: drop
    reason: "Abbas I's accession off by one year. Mohammad Khodabanda was deposed in Oct 1587 (Wikidata ends his reign 1587-10-01) and crowned Abbas at the Qazvin palace on 1 Oct 1587; Wikidata starts Abbas 1588-10-01 — the same day and month, one year later, i.e. one event shifted rather than two events. Wikipedia dates the reign 1 Oct 1587 – 20 Jan 1629. NOTE this is a real historiographic split, not a plain error: Britannica dates the accession to Oct 1588 and Wikipedia carries a separate 'coronation 1588' field, so the deck follows the proclamation/deposition date over the coronation. No matching add — 1587 is already a transition year via Khodabanda's end"
    source: "Abbas the Great; Mohammad Khodabanda"
    checked: "2026-08-11"
  # Abbas III (b. 1732, r. 1732–1736) is absent from Wikidata entirely — no P39 statement on
  # Q20110796 — so both his years can only be supplied by hand. His accession (7 Sep 1732) needs
  # no correction: it coincides with Tahmasp II's end year, already a transition. Only the
  # dynasty's terminal year is missing, which is why the 18th-century card held two end years and
  # no accession at all before this.
  - year: 1736
    action: add
    reason: "Terminal year of the dynasty, absent because Wikidata has no Abbas III. Nader Khan deposed the eight-year-old Abbas III on 22 Jan 1736 and had himself crowned Nader Shah in March 1736, the official end of Safavid rule. A dynasty's last year is a transition event everywhere else in this deck set (cf. Ottoman 1922, Fatimid 1171), and here no successor accession supplies it"
    source: "Abbas III; Safavid dynasty"
    checked: "2026-08-11"
chunk_years: 100
chunk_start_year: 1500
# NOTE: this article is prose, not a reign table, and is a weak source for a date cross-check;
