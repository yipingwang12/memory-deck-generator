# 2026-08-27: web-checked every digit against Wikipedia's per-ruler articles. Eight of ten are
# corroborated exactly (1056, 1061, 1087, 1106, 1143, 1145, 1146, 1147). Two are not, and both
# come from one Wikidata statement — Q2368541 Yahya Ibn Ibrahim, 1042-01-01 to 1048-01-01:
#
#   1042  UNCERTAIN, KEPT DELIBERATELY. No source found gives 1042 for anything. Wikipedia
#         attaches only "c. 1048" to Yahya ibn Ibrahim — in his own article, the dynasty
#         infobox and his succession box alike — and his status as a RULER is itself doubtful:
#         the dynasty article calls him "a chieftain of the Gudala" who helped *initiate* the
#         movement, and his own article says he "founded the movement alongside ibn Yasin
#         rather than ruling it alone". Kept by explicit decision rather than corrected, so
#         the first digit of the 1000s card is a claim nothing outside Wikidata supports.
#
#   1048  Yahya ibn Umar al-Lamtuni's article gives his leadership as ~1046-1056, not
#         1048-1056; 1048 is the year Wikipedia attaches to Yahya ibn IBRAHIM. The deck's tidy
#         hand-off at 1048 is an interleaving no source asserts. Left alone: ~1046 is itself
#         approximate, so changing it would swap one contested reconstruction for another.
#
# Also noted, not defects: Tashfin ibn Ali died March 1145 but Ibrahim ibn Tashfin's reign is
# dated from 1146 — an inconsistency within Wikipedia itself (the dynasty infobox instead gives
# Ishaq 1146-1147; the per-ruler articles are the more precise source and are what this
# follows). And the early chronology is contested across references: Encyclopedia.com puts
# Yahya ibn Umar's death at 1059 rather than 1056.
