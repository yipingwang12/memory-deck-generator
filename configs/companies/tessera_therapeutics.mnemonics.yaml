anchor_reason: "TESSER-a → TESSERACT (glowing cube)"
story:
  # Act 1 — the cube arrives and shows what it can do
  - "On a hot evening, a white bird circles low over the rooftops, carrying an egg that glows blue."
  - "Out in the harbour, an ADMIRAL (Flagship) watches it from the deck of his boat; the egg is his."
  - q11
  - q01
  - "Its blue light spills over the fence and into the street, where a tall animal walks past."
  - q02
  - "The GIRAFFE bends its long neck down and asks the cube what it can do."
  - "A panel slides open in one face of the cube, and out comes a quill with a glowing tip."
  - q04
  - "The giraffe watches a sick cell read the new letters, and the cell begins to heal."
  - "---"
  # Act 2 — the quill finds money and its first patient
  - "News of the glowing quill travels across the country, to a big house behind iron bars."
  - q08
  - "The coins pay for more quills, and the cube starts to look for its first patient."
  - "Down the street, a woman stops to catch her breath before she reaches her own door."
  - q06
  - "The cube tears a fresh page from inside itself and writes a cure for her."
  - q05
  - "---"
  # Act 3 — one winter: the partner, the inspectors, the cuts; then summer and a new keeper
  - "Years pass, and one January morning there is frost on the garden."
  - q07
  - "In the city, the medicine inspectors read the auntie's page closely."
  - "One month later, they send their fastest runner back down the road."
  - q10
  - "The same winter, the lab goes quiet; the lizard's money keeps the light on, but only just."
  - q09
  - "By now, the giraffe has long since passed the crown to another keeper."
  - "In high summer, a soldier marches up the garden path in a coat of every colour."
  - q03
  - "The giraffe sits on in the big chair, the soldier picks up the quill, and the cube glows again."
