# Famous artworks → image + multiple-choice deck (quiz mode `image-mc`).
# See docs/design/artworks-pipeline.md. Export with:  deck-export --only 'artworks_*'
# Preview the resolved set without downloading images:  deck-artworks --config <this>
#
# Expanded 2026-07-24: paintings-only 290 → broadened media, fame floor sitelinks>=5, capped
# at the 10k most famous. Fetch sweeps sitelink bands per media type (a whole-catalog ORDER BY
# times out WDQS); results are merged + fame-sorted + capped client-side.

deck_name: "Famous Artworks"
group: "Artworks"

source: wikidata            # wikidata | curated | collection
# TODO (surveyed 2026-07-30): this list drops ~938 eligible works — P31 is matched exactly, so
# frescoes/statues/monuments never enter the candidate set (Statue of Liberty, School of Athens,
# Creation of Adam, The Last Supper). QIDs + counts + tiering: docs/design/artworks-pipeline.md
instance_of:                # broadened media to keep recognizability high past paintings-only
  - Q3305213                # painting
  - Q860861                 # sculpture
  - Q93184                  # drawing
  - Q11060274               # print
  - Q125191                 # photograph
min_sitelinks: 5            # fame floor (# of Wikipedias) — broadly-known-and-up across media
limit: 10000                # cap at the 10k most famous
# Download is Commons-rate-limited (~15-40/min); the full 10k takes hours (resumable — images
# cache under cache/artworks/ by QID). To export a CHECKPOINT deck from what's already cached
# without downloading more, add:  cache_only: true  (5,707 works fetched; 5,552 shipped to the quiz).
# image_workers: 8 (default) — enough in-flight to absorb 429 retry-backoff.

image_px: 480               # longest side of the downsized WebP (~25 KB each)
image_workers: 8            # parallel downloads; Commons caps ~40/min via 429s, and enough
                            # in-flight workers is needed to absorb the retry-backoff waits
                            # (3 workers under-fills and craters to ~10/min; 8 sustains ~36/min)
distractors:
  count: 4
  same_creator_bias: true   # title distractors prefer same-creator / same-era works

# --- sourced manual overrides of Wikidata's creator (P170) -----------------------------
# Two failure modes, neither fixable by the fetch: a work with several P170 statements (the
# pipeline cannot know which one carries it), and a plainly wrong single statement. Every entry
# records why and against what, so it can be re-verified and retired; `deck-artworks --config`
# reports entries that have gone stale (work left the deck, or Wikidata resolved the ambiguity
# itself) plus any NEW multi-creator work that no correction covers yet.
# Corrections rewrite only the answer text, never the item string (`<QID>|creator`), so applying
# one preserves that card's FSRS review history in the quiz.
corrections:
  # --- upstream statement is simply wrong ---
  - work: Q4429116
    action: set
    value: "Claude Monet"
    reason: "P170 credits Q5593 (Pablo Picasso); the item's own description reads 'painting by Claude Monet' and its P18 is the Google Art Project scan of Monet's La Pie (1868-69, Musee d'Orsay)"
    source: "https://www.wikidata.org/wiki/Q4429116"
    checked: "2026-07-25"
