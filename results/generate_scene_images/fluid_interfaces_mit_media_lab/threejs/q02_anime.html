<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { guard } from './kit.js';
import { THREE, add, box, cyl, ball, mat, setup, placeFlute, setCam, paperSheet, pencilProp, coin } from './common.js';
guard(() => {
  const env = setup(); const { scene } = env;
  // brain on a pedestal with a lightbulb: the flute props it up, never replaces it
  const br = new THREE.Group(); br.position.set(1.2, 0, 0.3); br.scale.setScalar(0.85); scene.add(br);
  cyl(br, 0.5, 0.6, 0.55, '#d8d2e8', [0, 0.28, 0]);
  const pink = '#f48fb1';
  for (const [x, y, z, sx, sy, sz] of [[-0.3, 1.25, 0, 0.42, 0.38, 0.45], [0.3, 1.25, 0, 0.42, 0.38, 0.45], [-0.25, 1.0, 0.12, 0.38, 0.28, 0.4], [0.25, 1.0, 0.12, 0.38, 0.28, 0.4], [0, 1.1, -0.25, 0.5, 0.35, 0.3], [0, 1.35, 0.1, 0.45, 0.3, 0.38]]) ball(br, pink, [x, y, z], [sx, sy, sz]);
  for (let i = 0; i < 9; i++) { const a = i * 0.7; add(br, new THREE.TorusGeometry(0.16, 0.025, 8, 16, 3.4), mat('#d9647f'), [Math.cos(a) * 0.45, 1.2 + Math.sin(a * 1.7) * 0.2, 0.42], [0, 0, a]); }
  cyl(br, 0.06, 0.06, 0.25, '#8d8d98', [0, 1.95, 0]);
  ball(br, '#fff17a', [0, 2.3, 0], [0.32, 0.36, 0.32], { emissive: '#ffe45e', emissiveIntensity: 0.6 });
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; box(br, 0.05, 0.22, 0.04, '#ffd84a', [Math.cos(a) * 0.6, 2.3 + Math.sin(a) * 0.6, 0], [0, 0, a - Math.PI / 2]); }
  placeFlute(env, { s: 1.1, x: -1.0, z: 1.0, ry: 0.5, pose: { lean: 0.05, headTilt: 0.12 }, reach: ['l', [0.25, 1.15, 1.0]] });
  setCam(env, { cx: 0.2, cy: 1.3, cz: 4.8, tx: 0.2, ty: 1.2 });
  env.finish();
});
</script></body></html>
