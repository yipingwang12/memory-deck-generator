<!doctype html>
<html><head><meta charset="utf-8"><title>Fluid q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — a PATTY in a MAZE leads the FLUTE band.
import { guard } from './kit.js';
import { THREE, add, box, cyl, ball, mat, setup, placeFlute, setCam } from './common.js';
guard(() => {
  const env = setup();
  const { scene } = env;
  // hedge maze (square spiral walls) on a plinth
  const maze = new THREE.Group(); maze.position.set(1.1, 0, 0.3); scene.add(maze);
  box(maze, 2.3, 0.1, 2.3, '#d9c28f', [0, 0.05, 0]);
  const walls = [[0, -1.0, 2.1, 0.16], [0, 1.0, 2.1, 0.16], [-1.0, 0, 0.16, 2.1], [1.0, 0.3, 0.16, 1.5], [0.2, -0.55, 1.5, 0.16], [-0.35, 0.55, 1.3, 0.16], [-0.35, 0.1, 0.16, 0.9], [0.55, 0.0, 0.16, 0.8], [0.1, 0.1, 0.6, 0.16]];
  for (const [x, z, w, d] of walls) { box(maze, w, 0.3, d, '#35a040', [x, 0.25, z]); }
  // patty burger in the middle
  const b = new THREE.Group(); b.position.set(0.0, 0.35, 0.3); maze.add(b);
  add(b, new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), mat('#e49a3c'), [0, 0.2, 0], [0, 0, 0], [1, 0.75, 1]);
  cyl(b, 0.52, 0.52, 0.11, '#6b3a1e', [0, 0.14, 0]);
  cyl(b, 0.56, 0.56, 0.04, '#7fd04a', [0, 0.07, 0]);
  cyl(b, 0.5, 0.5, 0.05, '#ffcf3a', [0, 0.02, 0]);
  add(b, new THREE.CylinderGeometry(0.5, 0.46, 0.14, 32), mat('#e49a3c'), [0, -0.07, 0]);
  for (let i = 0; i < 8; i++) { const a = i * 0.8; ball(b, '#fff3c8', [Math.cos(a) * 0.22, 0.38 + 0.0, Math.sin(a) * 0.22 - 0.0], [0.03, 0.015, 0.05]); }
  // band: lead flute + two small band flutes
  placeFlute(env, { s: 1.15, x: -1.0, z: 0.9, ry: 0.55, pose: { lean: 0.08, headTilt: 0.1 }, reach: ['l', [-0.2, 1.1, 1.1]] });
  placeFlute(env, { s: 0.7, x: -2.4, z: -0.2, ry: 0.35, color: '#f2a65a', pose: { headTilt: -0.1 } });
  placeFlute(env, { s: 0.7, x: -3.1, z: -0.5, ry: 0.3, color: '#b88af0', pose: { headTilt: 0.1 } });
  setCam(env, { cx: 0.2, cy: 2.5, cz: 4.8, tx: 0.0, ty: 0.55 });
  env.finish();
});
</script></body></html>
