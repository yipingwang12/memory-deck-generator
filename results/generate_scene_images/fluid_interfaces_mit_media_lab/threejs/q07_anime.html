<html><head><meta charset="utf-8"><title>Fluid q07 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { guard } from './kit.js';
import { THREE, add, box, cyl, ball, mat, setup, placeFlute, setCam, paperSheet, pencilProp, coin } from './common.js';
guard(() => {
  const env = setup(); const { scene } = env;
  // companies (office towers with coin bags) pay to join the flute band
  const co = (x, z, col, h) => { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
    box(g, 0.8, h, 0.7, col, [0, h / 2, 0]);
    for (let r = 0; r < Math.floor(h / 0.45); r++) for (const wx of [-0.2, 0.2]) box(g, 0.2, 0.2, 0.04, '#cfeeff', [wx, 0.4 + r * 0.42, 0.36]);
    for (const sx of [-1, 1]) { ball(g, '#fff', [sx * 0.17, h - 0.15, 0.37], [0.08, 0.1, 0.02]); ball(g, '#123', [sx * 0.17, h - 0.17, 0.385], [0.045, 0.06, 0.01]); }
    return g; };
  co(1.4, -0.2, '#8e9aa8', 2.0); co(2.6, -0.6, '#c58a5a', 1.5);
  // pile of big coins and a coin on its way into the flute band
  for (const [x, z] of [[0.3, 0.6], [0.5, 0.5], [0.4, 0.8]]) coin(scene, [x + 0.15, 0.2 + (x - 0.3) * 1, z], 0.3);
  coin(scene, [0.35, 0.65, 0.9], 0.32); coin(scene, [0.1, 1.6, 0.9], 0.38);
  placeFlute(env, { s: 1.15, x: -0.9, z: 1.0, ry: 0.5, pose: { lean: 0.05, headTilt: 0.1 }, reach: ['l', [0.0, 1.35, 1.0]] });
  placeFlute(env, { s: 0.8, x: -2.1, z: 0.2, ry: 0.35, color: '#f2a65a', pose: { headTilt: -0.1 } });
  placeFlute(env, { s: 0.8, x: -2.9, z: -0.2, ry: 0.3, color: '#b88af0', pose: { headTilt: 0.1 } });
  setCam(env, { cx: -0.2, cy: 1.3, cz: 5.0, tx: 0.0, ty: 1.0 });
  env.finish();
});
</script></body></html>
