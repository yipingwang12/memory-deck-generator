<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q07 — The PYRAMID's mouse result is printed in Nature Biotechnology.
import { THREE, guard, build, finish, add, mat, box, blob, cyl, glow, sign, textTex, chip, monk, mouse, brain, flame, debitCard, reachWorld, canvasTexture, rng } from './common.js';
guard(() => {
  const S = build({ ground: '#e0b98c', py: [-0.9, 0, 0], ps: 1.9, pry: 0.3 });
  const { scene, pyr } = S;
  pyr.userData.pose({ arms: { r: [0, 0.9] } });
  const cover = canvasTexture(512, (c, s) => {
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, s, s * 1.4);
    c.fillStyle = '#0a7a4a'; c.fillRect(0, 0, s, 150);
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = 'bold 78px serif'; c.fillText('nature', s / 2, 78); c.font = 'bold 56px serif'; c.fillText('biotechnology', s / 2, 132);
    c.fillStyle = '#b9b3ad'; c.beginPath(); c.ellipse(256, 470, 150, 110, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(256, 340, 95, 80, 0, 0, 7); c.fill();
    for (const sx of [-1, 1]) { c.beginPath(); c.arc(256 + sx * 90, 275, 50, 0, 7); c.fill(); c.fillStyle = '#f4a6b6'; c.beginPath(); c.arc(256 + sx * 90, 275, 32, 0, 7); c.fill(); c.fillStyle = '#b9b3ad'; }
    c.fillStyle = '#1c1030'; for (const sx of [-1, 1]) { c.beginPath(); c.arc(256 + sx * 38, 335, 15, 0, 7); c.fill(); } c.fillStyle = '#f4a6b6'; c.beginPath(); c.arc(256, 370, 12, 0, 7); c.fill();
  }, { repeat: 1 });
  const j = new THREE.Group(); j.position.set(0.95, 1.5, 0.9); j.rotation.set(-0.08, -0.35, -0.05); scene.add(j);
  add(j, new THREE.BoxGeometry(1.5, 2.0, 0.07), new THREE.MeshBasicMaterial({ color: '#fff' }));
  add(j, new THREE.PlaneGeometry(1.46, 1.96), new THREE.MeshBasicMaterial({ map: cover }), [0, 0, 0.04]);
  for (let i = 0; i < 3; i++) box(scene, mat('#fff'), [1.8 + i * 0.05, 0.03 + i * 0.03, 0.5], [1.4, 0.03, 1.0], [0, 0.2 * i, 0]);
  reachWorld(pyr, 'l', [0.0, 1.3, 0.95]);
  finish(S, [pyr], [0.1, 1.3, 5.7], [0.1, 1.05, 0]);
});
