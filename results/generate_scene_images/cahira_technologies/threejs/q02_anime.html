<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q02 — The DEBIT card sits in an AT&T phone chair at MIT, facing the PYRAMID.
import { THREE, guard, build, finish, add, mat, box, blob, cyl, sign, debitCard, mitDome, reachWorld, canvasTexture } from './common.js';
guard(() => {
  const S = build({ ground: '#c9c0a8', py: [1.5, 0, 0.0], ps: 1.7, pry: -0.3 });
  const { scene, pyr } = S;
  pyr.userData.pose({ arms: { r: [0, 0.9] } }); reachWorld(pyr, 'r', [0.2, 1.2, 1.0]);
  mitDome(scene, [-1.5, 0, -3.6], 1.1);
  // AT&T-style chair: red armchair with a big blue striped globe as back + phone handset on arm
  const chair = new THREE.Group(); chair.position.set(-1.5, 0, 0.9); chair.rotation.y = 0.6; chair.scale.setScalar(1.35); scene.add(chair);
  box(chair, mat('#c8344a'), [0, 0.2, 0], [0.95, 0.2, 0.8]);
  box(chair, mat('#a82a3c'), [-0.5, 0.4, 0], [0.12, 0.45, 0.8]); box(chair, mat('#a82a3c'), [0.5, 0.4, 0], [0.12, 0.45, 0.8]);
  const globe = add(chair, new THREE.SphereGeometry(0.62, 40, 24), mat('#2a7fe0', { roughness: 0.4 }), [0, 0.95, -0.34], [0, 0, 0], [1, 1, 0.35]);
  for (let i = -3; i <= 3; i++) add(chair, new THREE.TorusGeometry(0.62 * Math.cos(i * 0.22), 0.012, 6, 40), mat('#fff'), [0, 0.95 + 0.62 * Math.sin(i * 0.22), -0.34], [Math.PI / 2, 0, 0], [1, 0.35, 1]);
  add(chair, new THREE.TorusGeometry(0.61, 0.016, 6, 40), mat('#fff'), [0, 0.95, -0.2], [0, 0, 0], [1, 1, 0.3]);
  // handset on the right arm
  box(chair, mat('#1a1a22'), [0.5, 0.67, 0.05], [0.1, 0.07, 0.34]);
  blob(chair, mat('#1a1a22'), [0.5, 0.7, 0.24], [0.08, 0.07, 0.08]); blob(chair, mat('#1a1a22'), [0.5, 0.7, -0.14], [0.08, 0.07, 0.08]);
  const card = debitCard(chair, [0, 0.3, 0.02], 1.15, 0, true);
  finish(S, [pyr, card], [0.0, 1.1, 5.6], [0.0, 0.85, 0]);
});
</script></body></html>
