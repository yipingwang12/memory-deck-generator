<script type="module">
// q03 — Tiny chips circulate in the blood to the PYRAMID: Circulatronics.
import { THREE, guard, build, finish, add, mat, box, blob, cyl, glow, sign, textTex, chip, monk, mouse, brain, flame, debitCard, reachWorld, canvasTexture, rng } from './common.js';
guard(() => {
  const S = build({ ground: '#e0b98c', py: [1.9, 0, 0.6], ps: 1.8, pry: -0.3 });
  const { scene, pyr } = S;
  pyr.userData.pose({ arms: { l: [0, 0.5] } }); reachWorld(pyr, 'r', [0.9, 1.0, 1.0]);
  const tube = new THREE.Group(); tube.position.set(-2.3, 0.8, -0.5); scene.add(tube);
  const wall = new THREE.MeshStandardMaterial({ color: '#e23a3a', transparent: true, opacity: 0.9, roughness: 0.2, side: THREE.DoubleSide });
  const t = add(tube, new THREE.CylinderGeometry(0.75, 0.75, 6.2, 40, 1, true, 0.4 * Math.PI, 1.2 * Math.PI), wall, [0, 0, 0], [0, 0, Math.PI / 2]); t.castShadow = false;
  add(tube, new THREE.CylinderGeometry(0.74, 0.74, 6.1, 40, 1, true, 0.4 * Math.PI, 1.2 * Math.PI), new THREE.MeshStandardMaterial({ color: '#8a1428', side: THREE.DoubleSide }), [0, 0, 0], [0, 0, Math.PI / 2]).castShadow = false;
  const r = rng(5);
  for (let i = 0; i < 22; i++) { const a = r() * 6.28, d = r() * 0.5; const c = blob(tube, mat('#d42a3a'), [-2.8 + r() * 5.6, Math.sin(a) * d, Math.cos(a) * d - 0.1], [0.17, 0.17, 0.06], [r(), r(), r()]); }
  const chips = [-2.2, -0.9, 0.4, 1.6].map((x, i) => chip(tube, [x, 0.05 * (i % 2), 0.15], 2.6));
  chips.forEach((c, i) => { c.rotation.set(0.6, i * 0.7, 0.2); });
  for (let i = 0; i < 4; i++) add(tube, new THREE.ConeGeometry(0.1, 0.25, 12), glow('#ffd23a', 0.9), [-2.0 + i * 1.2, -0.95, 0.2], [0, 0, -Math.PI / 2]);
  finish(S, [pyr], [0.0, 1.1, 5.6], [0.0, 0.85, 0]);
});
