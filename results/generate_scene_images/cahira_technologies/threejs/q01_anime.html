<!doctype html>
<html><head><meta charset="utf-8"><title>Cahira q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — A DEBIT card leads a nano-cyber trek out of MIT to the PYRAMID.
import { THREE, guard, build, finish, add, mat, box, blob, glow, debitCard, mitDome, reachWorld, rng } from './common.js';
guard(() => {
  const S = build({ ground: '#d8b878', py: [1.35, 0, 0], ps: 1.7, pry: -0.3 });
  const { scene, pyr } = S;
  pyr.userData.pose({ arms: { r: [0, 0.9] } }); reachWorld(pyr, 'r', [-0.4, 1.0, 1.0]);
  mitDome(scene, [-3.3, 0, -3], 1.0);
  add(scene, new THREE.PlaneGeometry(2, 40), mat('#c49a5c'), [-1, 0.004, 0], [-Math.PI / 2, 0, 0.0]);
  const card = debitCard(scene, [-1.0, 0, 1.2], 1.5, 0.5);
  const r = rng(9);
  for (let i = 0; i < 9; i++) { const b = blob(scene, glow('#59e6ff', 1.6), [-2.7 + i * 0.28, 0.18 + 0.05 * Math.sin(i), 0.5 + 0.18 * (i % 2)], [0.05, 0.05, 0.05]); b.castShadow = false; }
  for (let i = 0; i < 4; i++) box(scene, glow('#59e6ff', 1.2), [-2.4 + i * 0.7, 0.012, 0.5], [0.3, 0.012, 0.06]);
  finish(S, [pyr, card], [0.0, 1.1, 5.4], [0.0, 0.85, 0]);
});
</script></body></html>
