<script type="module">
import * as THREE from 'three';
import { guard, rng } from './kit.js';
import { createPuritan, addFace } from './puritan.js';
import * as K from './props.js';
const { mat, add, blob, num, makeStage, finishScene, reachWorld } = K;
guard(() => {
  const stage = makeStage({ ground: '#78b24a' });
  const S = stage.scene, R = 1.8, N = 8;
  const { g: w, ang } = K.wheel(R, N); S.add(w);
  const cols = ['#e8584a', '#4a8fe8', '#f0b83a', '#58b858', '#b870d8', '#f08a3a', '#3ac0c0', '#e870a0'];
  ang.forEach((a, i) => { const c = K.cottage(cols[i], 1.7); c.position.set(Math.cos(a) * (R - 0.35), 0.1, Math.sin(a) * (R - 0.35)); c.rotation.y = -a + Math.PI / 2; S.add(c); });
  const pur = createPuritan({ scale: num('ps', 1.7) }); pur.position.set(0, 0.32, 0); pur.rotation.y = 0.2; S.add(pur);
  pur.userData.pose({ headTilt: 0.05, arms: { l: [0, 0.9, 0.3], r: [0, 0.9, 0.3] } });
  finishScene(stage, [pur], [num('cx', 0), num('cy', 2.5), num('cz', 5.6)], [0, num('ty', 0.8), 0]);
});
