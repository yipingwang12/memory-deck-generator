<script type="module">
import * as THREE from 'three';
import { guard, rng } from './kit.js';

const { mat, add, blob, num, makeStage, finishScene, reachWorld } = K;
guard(() => {

    b.lookAt(0, 0.4, 4.6); b.rotation.x = 0; b.rotation.z = 0;
  });
