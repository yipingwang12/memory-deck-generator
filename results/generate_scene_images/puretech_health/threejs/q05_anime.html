<script type="module">
import * as THREE from 'three';
import { guard, rng } from './kit.js';
import { createPuritan, addFace } from './puritan.js';
import * as K from './props.js';
const { mat, add, blob, num, makeStage, finishScene, reachWorld } = K;
guard(() => {
  const stage = makeStage({ ground: '#e6cf9a' });
  const S = stage.scene;
  add(S, new THREE.PlaneGeometry(400, 400), mat('#3a8fc8', { roughness: 0.3 }), [0, 0.012, -202.5], [-Math.PI / 2, 0, 0]);

  pur.userData.pose({ headTilt: -0.05, arms: { r: [0, 0.3, 0.2] } });
