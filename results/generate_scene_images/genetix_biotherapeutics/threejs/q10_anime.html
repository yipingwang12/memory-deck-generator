<!doctype html>
<html><head><meta charset="utf-8"><title>Genetix q10</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q10 — a CHEF pays $6.84 in coins per share if the TICKET's sales reach the goal.
import { THREE, guard, mat, add, blob, cyl, rbox, setup, person, labelMesh, coin } from './common.js';

guard(() => {
  const S = setup({ ground: '#e9c98f' });
  const { scene, num } = S;
  const t = S.ticket(-1.3, 0.2, 0.3, 1.5, { arms: { l: [0, 1.0, 0], r: [0, 1.0, 0] }, headTilt: -0.04 });
  const c = person({ shirt: '#fafafa', pants: '#3a3f55', hair: '#2a1a10' }); c.scale.setScalar(1.5); c.position.set(2.2, 0, 0); c.rotation.y = -0.45; S.char(c);
  const hat = new THREE.Group(); hat.position.set(0, 0.17, 0); c.userData.head.add(hat);
  cyl(hat, 0.2, 0.19, 0.16, mat('#fff'), [0, 0.1, 0]); [[0, 0.3, 0], [-0.12, 0.28, 0.02], [0.12, 0.28, 0.02], [0, 0.28, -0.1]].forEach(([x, y, z]) => blob(hat, mat('#fff'), [x, y - 0.0, z], [0.14, 0.14, 0.14]));
  for (const y of [0.55, 0.45, 0.35]) blob(c, mat('#999'), [0, y, 0.18], [0.025, 0.025, 0.02]);
  add(c.userData.head, new THREE.TorusGeometry(0.05, 0.02, 6, 12, Math.PI), mat('#2a1a10'), [0, -0.05, 0.2], [0, 0, 0], [2, 0.8, 1]);
  c.userData.armL.rotation.set(-1.0, 0, 0.9); c.userData.armR.rotation.set(0, 0, -0.3);
  // flying coins
  [[0.6, 2.1], [0.2, 2.5], [-0.25, 2.55], [0.9, 1.9], [-0.7, 2.35], [0.35, 2.0]].forEach(([x, y], i) => coin(scene, 0.2, [x, y, 0.5], [Math.PI / 2 - 0.3, 0.2 * i, 0.5 * (i % 2 ? 1 : -1)]));
  // price medallion
  const med = new THREE.Group(); med.position.set(0.5, 3.3, 0); scene.add(med);
  cyl(med, 0.5, 0.5, 0.1, mat('#ffc928', { metalness: 0.5, roughness: 0.3 }), [0, 0, 0], [Math.PI / 2, 0, 0]);
  const lab = labelMesh('$6.84', 0.74, 0.34, { bg: '#ffe27a', fg: '#2a1a0a', font: 'bold 190px sans-serif' }); lab.position.set(0, 0, 0.06); med.add(lab);
  // goal flag
  cyl(scene, 0.03, 0.03, 2.4, mat('#ddd'), [-3.5, 1.2, -1]); add(scene, new THREE.BoxGeometry(0.8, 0.5, 0.03), mat('#e8283c'), [-3.1, 2.1, -1]); blob(scene, mat('#ffc928'), [-3.5, 2.45, -1], [0.06, 0.06, 0.06]);
  // stack of coins
  for (let i = 0; i < 8; i++) coin(scene, 0.24, [0.3, 0.04 + i * 0.045, 1.5], [0, 0, 0]);
  S.finish([num('cx', 0.4), num('cy', 1.9), num('cz', 7.4)], [0.4, 1.8, 0]);
});
</script></body></html>
