<!doctype html>
<html><head><meta charset="utf-8"><title>Genetix q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — a BLUEBIRD carries the TICKET in its beak.
import { THREE, guard, mat, add, blob, cyl, setup } from './common.js';

function bird() {
  const g = new THREE.Group(), blue = mat('#2f78e8'), deep = mat('#1d4fb0'), orange = mat('#f0883a'), white = mat('#fff7ec');
  blob(g, blue, [0, 0, 0], [0.75, 0.46, 0.44]);
  blob(g, orange, [0.3, -0.12, 0.05], [0.45, 0.34, 0.38]);
  blob(g, white, [0.05, -0.3, 0.05], [0.5, 0.2, 0.34]);
  blob(g, blue, [0.78, 0.22, 0], [0.34, 0.32, 0.32]);
  add(g, new THREE.ConeGeometry(0.1, 0.34, 20), mat('#f5b730'), [1.16, 0.15, 0], [0, 0, -Math.PI / 2 - 0.12]);
  for (const k of [-1, 1]) {
    const z = k * 0.27;
    blob(g, mat('#fff'), [0.95, 0.32, z], [0.085, 0.1, 0.05]);
    blob(g, mat('#2a1a10', { roughness: 0.3 }), [0.97, 0.32, z * 1.07], [0.055, 0.075, 0.04]);
    blob(g, mat('#fff'), [0.985, 0.35, z * 1.12], [0.02, 0.025, 0.02]);
    const w = new THREE.Group(); w.position.set(-0.1, 0.12, k * 0.38); w.rotation.set(k * 0.3, 0, 0.35); g.add(w);
    blob(w, deep, [-0.15, 0.45, 0], [0.42, 0.62, 0.07], [0, 0, -0.5]);
    blob(w, blue, [-0.1, 0.35, k * 0.02], [0.3, 0.45, 0.07], [0, 0, -0.5]);
  }
  add(g, new THREE.BoxGeometry(0.8, 0.06, 0.32), deep, [-0.95, -0.05, 0], [0, 0, 0.15], [1, 1, 1]);
  return g;
}

guard(() => {
  const S = setup({ ground: null });
  const { scene, num } = S;
  const b = bird(); b.position.set(0, 2.9, 0); b.rotation.y = -0.2; scene.add(b); S.char(b);
  const t = S.ticket(1.72, -0.05, 0, 1.5, { headTilt: 0.06, arms: { l: [0.2, 0.7, 0], r: [0.2, 0.7, 0] }, legs: { l: [0.1, 0], r: [-0.15, 0] } });
  t.position.y = 3.0 - 0.97 * 1.5;
  S.finish([num('cx', 0.9), num('cy', 2.4), num('cz', 4.6)], [0.9, 2.3, 0]);
});
</script></body></html>
