<html><head><meta charset="utf-8"><title>Biogen scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q03 — The BUOY floats in a sea of brains and moods: neurology and neuropsychiatry.
import { THREE, guard, mat, glow, add, box, cyl, blob, textPlane, water, ground, ripples, makeStage, createBuoy, person, armPose, dome, grab, wrapUp, rng } from './common.js';
function brain(s = 1) {
  const g = new THREE.Group(), pink = mat('#f29aa8', { roughness: 0.5 }), r = rng(11);
  for (const sx of [-1, 1]) {
    blob(g, pink, [sx * 0.1, 0, 0], [0.19, 0.2, 0.3]);
    for (let i = 0; i < 40; i++) {
      const u = r() * 6.283, v = Math.acos(2 * r() - 1), x = Math.sin(v) * Math.cos(u), y = Math.cos(v), z = Math.sin(v) * Math.sin(u);
      if (y < -0.3) continue; blob(g, pink, [sx * 0.1 + x * 0.17, y * 0.18, z * 0.28], [0.055, 0.055, 0.055]);
    }
  }
  box(g, mat('#c8606e'), [0.012, 0.1, 0.5], [0, 0.17, 0]);
  blob(g, mat('#e88594'), [0, -0.14, -0.2], [0.09, 0.07, 0.1]);
  g.scale.setScalar(s); return g;
}
function mood(kind, c) {
  const g = new THREE.Group(); blob(g, mat(c, { roughness: 0.4 }), [0, 0, 0], [0.3, 0.3, 0.3]);
  for (const s of [-1, 1]) { blob(g, mat('#2a1a10'), [s * 0.1, 0.07, 0.27], [0.04, 0.06, 0.02]); if (kind === 'angry') box(g, mat('#2a1a10'), [0.12, 0.025, 0.02], [s * 0.1, 0.17, 0.28], [0, 0, s * -0.5]); }
  const m = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.018, 8, 20, Math.PI), mat('#2a1a10'));
  if (kind === 'happy') { m.rotation.z = Math.PI; m.position.set(0, -0.02, 0.28); } else { m.position.set(0, -0.13, 0.28); m.scale.y = 0.6; }
  g.add(m); return g;
}
guard(() => {
  const { stage, scene, num } = makeStage();
  water(scene);
  const buoy = createBuoy({ scale: 1.5 }); buoy.position.set(0, 0, 0); scene.add(buoy); ripples(scene, 0, 0, 0.01, 0.5);
  buoy.userData.pose({ arms: { l: [0, 0.9, 0.2], r: [0, 0.9, 0.2] } });
  const items = [[brain(1.6), -1.5, 0.3, 0.5, 0.4], [brain(1.3), 1.6, 0.4, 0.5, -0.5], [brain(1.1), -2.6, -1.2, 0.35, 0.8], [brain(1.2), 0.9, -1.2, 0.35, 0.2],
    [mood('happy', '#ffd23a'), -0.9, 1.2, 0.35, 0], [mood('sad', '#6ab0ff'), 1.0, 1.3, 0.35, 0], [mood('angry', '#ff6a4a'), 2.7, -0.6, 0.35, -0.3], [mood('happy', '#ffd23a'), -2.1, 1.0, 0.35, 0.3]];
  for (const [o, x, z, y, ry] of items) { o.position.set(x, y, z); o.rotation.y = ry; scene.add(o); ripples(scene, x, z, 0.01, 0.3); }
  wrapUp(stage, scene, [buoy, ...items.map((i) => i[0])], { cx: num('cx', 0), cy: num('cy', 1.4), cz: num('cz', 5.3), tx: 0, ty: 0.7 });
});
</script></body></html>
