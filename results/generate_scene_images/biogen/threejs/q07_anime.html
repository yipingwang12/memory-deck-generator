<!doctype html>
<html><head><meta charset="utf-8"><title>Biogen scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q07 — The BUOY will float on a village COMMON green beside the MIT DOME: Kendall Common.
import { THREE, guard, mat, glow, add, box, cyl, blob, textPlane, water, ground, ripples, makeStage, createBuoy, person, armPose, dome, grab, wrapUp, rng } from './common.js';
guard(() => {
  const { stage, scene, num } = makeStage();
  ground(scene, '#6fc04a');
  // paths + pond
  add(scene, new THREE.CircleGeometry(1.6, 48), mat('#2f9ad8', { roughness: 0.25 }), [0, 0.01, 1.2], [-Math.PI / 2, 0, 0], [1.6, 1, 1]);
  add(scene, new THREE.TorusGeometry(1.62, 0.07, 8, 48), mat('#b5b0a0'), [0, 0.02, 1.2], [Math.PI / 2, 0, 0], [1.6, 1, 0.5]);
  const d = dome({ scale: 1.1 }); d.position.set(3.4, 0, -2.6); d.rotation.y = -0.4; scene.add(d);
  // village cottages
  const house = (x, z, c, ry) => { const g = new THREE.Group(); box(g, mat(c), [1.3, 0.9, 1.0], [0, 0.45, 0]); add(g, new THREE.ConeGeometry(1.0, 0.6, 4), mat('#b3452e'), [0, 1.2, 0], [0, Math.PI / 4, 0]); box(g, mat('#7a4a2a'), [0.25, 0.5, 0.05], [0, 0.25, 0.52]); box(g, mat('#a8dcff'), [0.25, 0.25, 0.05], [0.4, 0.55, 0.52]); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); };
  house(-4.6, -2.2, '#f4e4c0', 0.4); house(-3.0, -3.6, '#f8c8b0', 0.2); house(-5.8, -0.2, '#d8e8c0', 0.7);
  // trees + flowers + villagers
  const r = rng(9);
  for (const [x, z, s] of [[-2.2, -1.5, 1], [1.9, -4.4, 1.2], [5.6, 0.5, 1.1], [-6.5, 2.0, 1.2]]) { cyl(scene, mat('#7a5230'), 0.1, 0.14, 0.9 * s, [x, 0.45 * s, z]); blob(scene, mat('#3a9a3a'), [x, 1.3 * s, z], [0.7 * s, 0.65 * s, 0.7 * s]); }
  for (let i = 0; i < 80; i++) { const x = (r() - 0.5) * 14, z = r() * 4 - 0.5; if (Math.abs(x) < 2.8 && z > -0.3 && z < 2.6) continue; blob(scene, mat(['#ffd84a', '#ffffff', '#ff8fa8'][i % 3]), [x, 0.04, z], [0.04, 0.04, 0.04]); }
  const v1 = person({ suit: '#c8683a', pants: '#4a5a8a', hair: '#6a3a1a', scale: 0.9 }); v1.position.set(-2.6, 0, 1.6); v1.rotation.y = 0.5; scene.add(v1); armPose(v1, 'l', [0, 0.2, 0]);
  const v2 = person({ suit: '#5a8a5a', pants: '#3a3a4a', hair: '#b0a090', scale: 0.85 }); v2.position.set(2.7, 0, 1.8); v2.rotation.y = -0.5; scene.add(v2);
  const buoy = createBuoy({ scale: 1.5 }); buoy.position.set(0, 0.02, 1.2); buoy.rotation.y = 0.1; scene.add(buoy); ripples(scene, 0, 1.2, 0.03, 0.5);
  buoy.userData.pose({ arms: { l: [0, 0.8, 0.2], r: [0, 0.8, 0.2] } }); grab(buoy, 'l', [0.5, 1.2, 1.4]);
  wrapUp(stage, scene, [buoy, v1, v2], { cx: num('cx', 0), cy: num('cy', 1.8), cz: num('cz', 7.0), tx: 0.3, ty: 1.0 });
});
</script></body></html>
