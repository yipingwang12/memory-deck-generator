<!doctype html>
<html><head><meta charset="utf-8"><title>Biogen scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q09 — The BUOY goes to the gym: FIT FOR GROWTH.
import { THREE, guard, mat, glow, add, box, cyl, blob, textPlane, water, ground, ripples, makeStage, createBuoy, person, armPose, dome, grab, wrapUp, rng } from './common.js';
guard(() => {
  const { stage, scene, num } = makeStage({ sky: { cover: 3, seed: 5, towerTop: 0.5, puffCover: 2 } });
  ground(scene, '#2c3340');
  box(scene, mat('#e8eaf0'), [12, 5, 0.2], [0, 2.5, -2.4]);
  box(scene, mat('#9fd8ff', { roughness: 0.1, metalness: 0.3 }), [4.4, 2.4, 0.05], [-2.2, 2.4, -2.28]);   // mirror
  box(scene, mat('#ff5a3a'), [12, 0.5, 0.22], [0, 0.9, -2.3]);
  const buoy = createBuoy({ scale: 1.7 }); buoy.position.set(-0.2, 0, 0.3); buoy.rotation.y = 0.1; scene.add(buoy);
  // headband
  add(buoy, new THREE.TorusGeometry(0.222, 0.025, 8, 36), mat('#ffd21a'), [0, 0.5, 0], [Math.PI / 2, 0, 0]);
  buoy.userData.parts.body.add(add(new THREE.Group(), new THREE.TorusGeometry(0.222, 0.03, 8, 36), mat('#ffd21a'), [0, 0.51, 0], [Math.PI / 2, 0, 0]));
  // barbell
  const bar = new THREE.Group(), iron = mat('#2a2d34', { metalness: 0.5, roughness: 0.4 });
  cyl(bar, mat('#c8ccd4', { metalness: 0.6, roughness: 0.3 }), 0.035, 0.035, 2.8, [0, 0, 0], [0, 0, Math.PI / 2], 16);
  for (const s of [-1, 1]) for (let i = 0; i < 2; i++) cyl(bar, iron, 0.4 - i * 0.1, 0.4 - i * 0.1, 0.1, [s * (1.0 + i * 0.12), 0, 0], [0, 0, Math.PI / 2], 36);
  for (const s of [-1, 1]) cyl(bar, mat('#ff5a3a'), 0.28, 0.28, 0.08, [s * 1.34, 0, 0], [0, 0, Math.PI / 2], 36);
  bar.position.set(-0.2, 1.15, 0.9); scene.add(bar);
  grab(buoy, 'l', [0.1, 1.15, 0.9]); grab(buoy, 'r', [-0.5, 1.15, 0.9]);
  // growing sprout + measuring tape (right)
  const pot = new THREE.Group(); pot.position.set(3.0, 0, 0.4); scene.add(pot);
  cyl(pot, mat('#c8603a'), 0.3, 0.22, 0.4, [0, 0.2, 0]); blob(pot, mat('#5a3a22'), [0, 0.4, 0], [0.29, 0.04, 0.29]);
  cyl(pot, mat('#3a9a3a'), 0.035, 0.05, 1.5, [0, 1.15, 0], [0, 0, 0.1], 10);
  for (const [y, s, a] of [[0.9, 1, 0.9], [1.2, -1, 0.9], [1.5, 1, 0.8]]) blob(pot, mat('#4ab84a'), [s * 0.25 + 0.05, y, 0], [0.28, 0.07, 0.12], [0, 0, s * a]);
  const tape = new THREE.Group(); cyl(tape, mat('#ffd21a'), 0.2, 0.2, 0.06, [0, 0, 0], [Math.PI / 2, 0, 0]); box(tape, mat('#ffd21a'), [0.9, 0.03, 0.02], [0.6, -0.17, 0]); tape.position.set(2.4, 0.2, 1.2); scene.add(tape);
  for (let i = 0; i < 7; i++) box(tape, mat('#222'), [0.012, 0.05, 0.022], [0.3 + i * 0.12, -0.17, 0]);
  // up arrow
  const ar = new THREE.Shape(); ar.moveTo(0, 0.3); ar.lineTo(0.25, 0); ar.lineTo(0.09, 0); ar.lineTo(0.09, -0.3); ar.lineTo(-0.09, -0.3); ar.lineTo(-0.09, 0); ar.lineTo(-0.25, 0); ar.closePath();
  const arrow = new THREE.Mesh(new THREE.ExtrudeGeometry(ar, { depth: 0.05, bevelEnabled: false }), glow('#3cff7a', 0.8)); arrow.position.set(3.0, 2.5, 0.4); scene.add(arrow);
  wrapUp(stage, scene, [buoy], { cx: num('cx', 0.5), cy: num('cy', 1.5), cz: num('cz', 6.0), tx: 0.5, ty: 1.2, clouds: false });
});
</script></body></html>
