<html><head><meta charset="utf-8"><title>Biogen scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q02 — With a KNIFE, the BUOY cuts its fiftieth birthday cake in its new home.
import { THREE, guard, mat, glow, add, box, cyl, blob, textPlane, water, ground, ripples, makeStage, createBuoy, person, armPose, dome, grab, wrapUp, rng } from './common.js';
guard(() => {
  const { stage, scene, num } = makeStage({ sky: { cover: 3, seed: 5, towerTop: 0.5, puffCover: 2 } });
  ground(scene, '#c79a62');
  // new home: wall + big windows + door
  box(scene, mat('#f2e6d0'), [9, 4, 0.2], [0, 2, -2]);
  for (const x of [-2.5, 2.5]) { box(scene, mat('#7ec8ff', { roughness: 0.2 }), [1.5, 1.8, 0.05], [x, 2.2, -1.88]); box(scene, mat('#fff'), [1.6, 0.06, 0.08], [x, 2.2, -1.85]); box(scene, mat('#fff'), [0.06, 1.9, 0.08], [x, 2.2, -1.85]); }
  box(scene, mat('#b5483a'), [1.2, 2.3, 0.1], [0, 1.15, -1.88]);
  const buoy = createBuoy({ scale: 1.7 }); buoy.position.set(-0.3, 0, 1.0); buoy.rotation.y = 0.25; scene.add(buoy);
  const cakeG = new THREE.Group(); cakeG.position.set(0, -0.3, 0.6); scene.add(cakeG); const S0 = scene;
  // table + cake
  cyl(cakeG, mat('#9b6b3d'), 0.9, 0.9, 0.08, [0.9, 0.78, 0.2]); cyl(cakeG, mat('#7a5230'), 0.1, 0.12, 0.74, [0.9, 0.4, 0.2]);
  const tiers = [[0.5, 0.28, '#ffd6e4', 0.96], [0.37, 0.25, '#ffffff', 1.2], [0.25, 0.22, '#ffd6e4', 1.45]];
  for (const [r, h, c, y] of tiers) cyl(cakeG, mat(c), r, r, h, [0.9, y - 0.02, 0.2], [0, 0, 0], 40);
  for (const y of [0.97, 1.21, 1.46]) add(cakeG, new THREE.TorusGeometry(y === 0.97 ? 0.5 : y === 1.21 ? 0.37 : 0.25, 0.025, 8, 40), mat('#ff5a8a'), [0.9, y + 0.12, 0.2], [Math.PI / 2, 0, 0]);
  for (let i = 0; i < 5; i++) { const a = i / 5 * 6.283; cyl(cakeG, mat(['#ff4a5a', '#4aa8ff', '#ffd23a', '#5ad27a', '#b06aff'][i]), 0.015, 0.015, 0.14, [0.9 + 0.17 * Math.sin(a), 1.68, 0.2 + 0.17 * Math.cos(a)], [0, 0, 0], 8); blob(cakeG, glow('#ffb020', 1.4), [0.9 + 0.17 * Math.sin(a), 1.78, 0.2 + 0.17 * Math.cos(a)], [0.02, 0.035, 0.02]); }
  // number 50 sign
  const sign = textPlane('50', 0.8, 0.5, { bg: '#ffcf3a', fg: '#c8283c' }); sign.position.set(0.9, 2.2, 0.2); cakeG.add(sign);
  cyl(cakeG, mat('#7a5230'), 0.012, 0.012, 0.6, [0.9, 1.9, 0.19], [0, 0, 0], 8);
  // big knife in the buoy's hand, blade into the cake
  const knife = new THREE.Group(); box(knife, mat('#f4f8fc', { roughness: 0.3 }), [0.11, 0.62, 0.02], [0, -0.38, 0]); box(knife, mat('#5a3a22'), [0.05, 0.26, 0.04], [0, 0.13, 0]); knife.rotation.set(0.0, 0, 1.15); knife.scale.setScalar(1.7); scene.add(knife);
  const hp = grab(buoy, 'l', [0.45, 1.0, 1.05]); knife.position.copy(hp);
  grab(buoy, 'r', [-0.6, 0.7, 1.1]);
  // balloons
  [['#ff5a8a', -2.6], ['#ffd23a', -3.1], ['#4aa8ff', 2.9]].forEach(([c, x], i) => { blob(scene, mat(c, { roughness: 0.3 }), [x, 2.7 + (i % 2) * 0.3, -1.2], [0.4, 0.5, 0.4]); cyl(scene, mat('#fff'), 0.005, 0.005, 2, [x, 1.5, -1.2], [0, 0, 0], 4); });
  wrapUp(stage, scene, [buoy, knife], { cx: num('cx', 0.2), cy: num('cy', 1.5), cz: num('cz', 5.0), tx: 0.2, ty: 1.15 });
});
</script></body></html>
