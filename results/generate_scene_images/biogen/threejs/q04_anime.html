<!doctype html>
<html><head><meta charset="utf-8"><title>Biogen scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q04 — BUOY carries a LEAKY EMBER, SKY CLARETS, a SURE SUAVE man and a KALE SALAD.
import { THREE, guard, mat, glow, add, box, cyl, blob, textPlane, water, ground, ripples, makeStage, createBuoy, person, armPose, dome, grab, wrapUp, rng } from './common.js';
guard(() => {
  const { stage, scene, num } = makeStage();
  water(scene);
  const buoy = createBuoy({ scale: 1.7 }); buoy.position.set(0, 0, -0.2); scene.add(buoy); ripples(scene, 0, -0.5, 0.01, 0.5);
  // tray
  const tray = new THREE.Group(); tray.position.set(0, 0.42, 0.6); scene.add(tray);
  cyl(tray, mat('#a8743c'), 1.8, 1.75, 0.06, [0, 0, 0], [0, 0, 0], 48);
  add(tray, new THREE.TorusGeometry(1.78, 0.03, 8, 48), mat('#8a5a2c'), [0, 0.04, 0], [Math.PI / 2, 0, 0]);
  // leaky ember: cracked pot with glowing coals and drips
  const pot = new THREE.Group(); pot.position.set(-1.35, 0.03, 0.0); tray.add(pot);
  cyl(pot, mat('#4a4a52', { metalness: 0.4 }), 0.22, 0.16, 0.3, [0, 0.15, 0]);
  blob(pot, glow('#ff5a1a', 1.5), [0, 0.3, 0], [0.2, 0.08, 0.2]); for (let i = 0; i < 5; i++) blob(pot, glow('#ffb020', 1.8), [(i - 2) * 0.07, 0.36, 0.03 * (i % 2)], [0.05, 0.05, 0.05]);
  cyl(pot, glow('#ff6a1a', 1.5), 0.02, 0.02, 0.1, [0.2, 0.16, 0.08], [0, 0, 0.5], 8);
  for (let i = 0; i < 3; i++) blob(pot, glow('#ff7a1a', 1.5), [0.25 + 0.03 * i, 0.08 - i * 0.04, 0.1], [0.03, 0.045, 0.03]);
  // sky claret: bottle with a cloud-sky label
  const bt = new THREE.Group(); bt.position.set(-0.8, 0.03, 0.2); tray.add(bt);
  cyl(bt, mat('#5a1228', { roughness: 0.2 }), 0.09, 0.09, 0.4, [0, 0.2, 0]); cyl(bt, mat('#5a1228', { roughness: 0.2 }), 0.035, 0.09, 0.16, [0, 0.48, 0]); cyl(bt, mat('#5a1228'), 0.035, 0.035, 0.14, [0, 0.62, 0]); cyl(bt, mat('#c8a050'), 0.04, 0.04, 0.05, [0, 0.7, 0]);
  const lab = new THREE.Mesh(new THREE.CylinderGeometry(0.092, 0.092, 0.2, 24, 1, true), mat('#8ad0ff')); lab.position.y = 0.2; bt.add(lab);
  for (const [x, y, s] of [[0, 0.22, 0.05], [0.06, 0.18, 0.04], [-0.05, 0.17, 0.04]]) blob(bt, mat('#fff'), [x * 0.7, y, 0.08], [s * 1.3, s, 0.01]);
  const wine = new THREE.Group(); wine.position.set(-1.0, 0.03, 0.6); tray.add(wine); cyl(wine, mat('#cfe8ff', { transparent: true, opacity: 0.6 }), 0.09, 0.04, 0.14, [0, 0.2, 0]); cyl(wine, mat('#cfe8ff'), 0.01, 0.01, 0.1, [0, 0.08, 0], [0, 0, 0], 8); cyl(wine, mat('#a01836'), 0.075, 0.05, 0.07, [0, 0.21, 0]);
  // suave man (small) with sunglasses + slick hair + rose
  const man = person({ suit: '#1d2438', shirt: '#ffffff', hairStyle: 'slick', hair: '#14101a', scale: 0.55 }); man.position.set(0.85, 0.03, 0.1); man.rotation.y = -0.1; tray.add(man);
  box(man, mat('#101010'), [0.26, 0.07, 0.02], [0, 1.52, 0.17]);
  box(man, mat('#d82a4a'), [0.05, 0.05, 0.02], [0.08, 1.12, 0.14]);
  armPose(man, 'l', [0, 0.5, 0]); armPose(man, 'r', [-0.3, -0.2, -1.5]);
  // kale salad
  const bowl = new THREE.Group(); bowl.position.set(1.4, 0.03, 0.1); tray.add(bowl);
  add(bowl, new THREE.SphereGeometry(0.3, 28, 14, 0, 6.283, Math.PI / 2, Math.PI / 2), mat('#e8e0d2'), [0, 0.28, 0]);
  const r = rng(5); for (let i = 0; i < 12; i++) { const a = r() * 6.283, d = r() * 0.2; blob(bowl, mat(['#2f8a3a', '#4aa84a', '#1f6a30'][i % 3]), [Math.sin(a) * d, 0.3 + r() * 0.14, Math.cos(a) * d], [0.1, 0.03, 0.08], [r(), r() * 6, r()]); }
  blob(bowl, mat('#e84a3a'), [0.05, 0.4, 0.08], [0.04, 0.04, 0.04]);
  grab(buoy, 'l', [0.7, 0.45, 0.4]); grab(buoy, 'r', [-0.7, 0.45, 0.4]);
  wrapUp(stage, scene, [buoy, man], { cx: num('cx', 0), cy: num('cy', 1.5), cz: num('cz', 5.8), tx: 0, ty: 0.8 });
});
</script></body></html>
