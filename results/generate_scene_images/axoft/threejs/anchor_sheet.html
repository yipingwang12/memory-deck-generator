<!doctype html>
<html><head><meta charset="utf-8"><title>Axoft anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createAxe } from './axe.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, sky: { cover: 1, seed: 5 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 },
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, shadowSize: 4 });
  const g = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: '#6fae45' })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; stage.scene.add(g);
  [[-0.85, 0.0], [0, 0.6], [0.85, 1.5708]].forEach(([x, ry], i) => {
    const a = createAxe({ scale: 1.3 }); a.position.set(x * 1.3, 0, 0); a.rotation.y = ry; stage.scene.add(a);
    a.userData.pose({ lean: 0.05, headTilt: 0.06, arms: { l: [0, 0.5, 0], r: [0.2, 0.3, 0.6] }, legs: { l: [0.2, 0], r: [-0.2, 0] } });
    a.userData.reach('l', [0.25, 0.75, 0.1]);
    const pm = new Set(); a.traverse((o) => pm.add(o)); stage.toonify(a, (m) => pm.has(m));
  });
  const env = new Set(); stage.scene.traverse((o) => { if (o === g) env.add(o); });
  stage.toonify(stage.scene, () => false);
  stage.addClouds([[150, 900, 90, 1.2], [200, 1000, 120, 1.6]]);
  stage.camera.position.set(0, 0.8, 4.6); stage.camera.lookAt(0, 0.7, 0);
  stage.finish();
});
</script></body></html>
