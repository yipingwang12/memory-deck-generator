<script type="module">
// FLEURON is 10,000x softer than polyimide.
import { THREE, guard, mat, add, blob, box, cyl, eyes, human, sheep, flower, coin, coinStack, tree, setup, finish, placeAxe, canvasTexture, rng } from './lib.js';
import { seg, hand, textPlane, crown, mountain, starShape, sparks } from './props.js';
guard(() => {

const S = setup({});
const a = placeAxe(S, { pos: [0, 0, 0.3], ry: 0, scale: 1.95, pose: { arms: { l: [0, 1.1, 0], r: [0, -1.1, 0] }, legs: { l: [0.15, 0], r: [-0.15, 0] } } });

const amber = mat('#d98e1f', { roughness: 0.35, metalness: 0.2 });
const board = new THREE.Group(); board.position.set(-1.9, 0, 0); board.rotation.z = 0.04; S.scene.add(board);
box(board, amber, [0, 1.15, 0], [0.5, 2.3, 0.2]); box(board, mat('#8a5410'), [0, 0.03, 0], [0.9, 0.08, 0.5]);
for (const y of [0.4, 1.0, 1.6, 2.1]) cyl(board, mat('#555a64', { metalness: 0.6 }), [0, y, 0.12], 0.05, 0.05, [Math.PI / 2, 0, 0]);
// soft fleuron flower drooping
const pk = mat('#ff6fa4'), leaf = mat('#3f9a4a');
const pts = [[1.7, 0, 0], [1.7, 0.7, 0], [1.9, 1.2, 0], [2.3, 1.45, 0], [2.7, 1.3, 0], [2.85, 0.95, 0]];

const fl = flower({ r: 0.55, stem: 0.001 }); fl.position.set(2.9, 0.75, 0.05); fl.userData.bloom.rotation.z = 0.5; S.scene.add(fl);

});
