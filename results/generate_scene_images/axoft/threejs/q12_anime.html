<html><head><meta charset="utf-8"><title>Axoft q12 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Each FINESSE probe has 128 channels.
import { THREE, guard, mat, add, blob, box, cyl, eyes, human, sheep, flower, coin, coinStack, tree, setup, finish, placeAxe, canvasTexture, rng } from './lib.js';
import { seg, hand, textPlane, crown, mountain, starShape, sparks } from './props.js';
guard(() => {

const S = setup({});
const a = placeAxe(S, { pos: [-0.9, 0, 0.55], ry: 0.35, scale: 1.95, pose: { headTilt: 0.07, arms: { r: [0, -0.5, 0.3] } }, reach: { l: [-0.05, 1.1, 0.75] } });
// probe: thin shank with 8x16 = 128 electrode dots
const tex = canvasTexture(1024, (ctx, s) => {
  ctx.fillStyle = '#ffb3cf'; ctx.fillRect(0, 0, s, s);
  for (let r = 0; r < 16; r++) for (let c = 0; c < 8; c++) { ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(s * (0.1 + c * 0.114), s * (0.04 + r * 0.06), s * 0.022, 0, 7); ctx.fill(); ctx.strokeStyle = '#a8326a'; ctx.lineWidth = 3; ctx.stroke(); }
});
const pr = new THREE.Group(); pr.position.set(0.95, 0, 0.7); S.scene.add(pr);
const body = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 2.3), new THREE.MeshBasicMaterial({ map: tex })); body.position.set(0, 1.55, 0); pr.add(body);
add(pr, new THREE.ConeGeometry(0.575, 0.45, 4), mat('#ffb3cf'), [0, 0.2, 0], [Math.PI, Math.PI / 4, 0], [1, 1, 0.1]);
box(pr, mat('#6a5acd'), [0, 2.78, -0.01], [1.3, 0.3, 0.1]);
const sg = textPlane('128', { w: 1.6, h: 0.85, bg: '#ffffff', fg: '#2a3f6a', frame: '#ffb02e' }); sg.position.set(2.5, 3.2, 0.7); S.scene.add(sg);
finish(S, [0.5, 1.6, 6.9], [0.5, 1.65, 0]);

});
</script></body></html>
