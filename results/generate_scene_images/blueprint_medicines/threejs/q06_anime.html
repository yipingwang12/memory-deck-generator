<!doctype html>
<html><head><meta charset="utf-8"><title>Blueprint q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — A PERSIAN CART (Percy Carter) leaves the BLUEPRINT's lab for a seat on the CELLAR's board.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, cyl, blob, makeStage, clouds, ground, look, finishScene, buildCat, buildCart, buildBox } from './common.js';
import { createBlueprint } from './blueprint.js';

guard(() => {
  const stage = makeStage(); const scene = stage.scene; ground(scene, '#7fb552');
  add(scene, new THREE.PlaneGeometry(40, 1.4), mat('#c9a56b'), [0, 0.004, 1.2], [-Math.PI / 2, 0, 0]);
  // lab
  const lab = new THREE.Group(); lab.position.set(-3.2, 0, -0.5); scene.add(lab);
  box(lab, mat('#e8e4da'), [0, 1.2, 0], [2.4, 2.4, 2.0]); box(lab, mat('#4a8ec0'), [0, 2.55, 0], [2.7, 0.2, 2.3]);
  box(lab, mat('#1a1418'), [0.5, 0.8, 1.01], [0.7, 1.6, 0.04]); box(lab, mat('#9fd0ee'), [-0.6, 1.4, 1.01], [0.7, 0.7, 0.04]);
  const fl = new THREE.Group(); fl.position.set(0, 3.5, 0.9); lab.add(fl);
  add(fl, new THREE.CylinderGeometry(0.1, 0.5, 0.8, 28), mat('#8fe0a0', { transparent: true, opacity: 0.85 }), [0, 0, 0]); cyl(fl, mat('#cfeff5'), [0, 0.55, 0], 0.1, 0.4);
  // cellar mound + door + board table
  const cel = new THREE.Group(); cel.position.set(3.6, 0, -1.2); scene.add(cel);
  blob(cel, mat('#6a9a46'), [0, 0, 0], [2.4, 1.6, 1.6]);
  box(cel, mat('#2a1a10'), [0, 0.6, 1.2], [1.1, 1.2, 0.2]); add(cel, new THREE.TorusGeometry(0.55, 0.08, 10, 24, Math.PI), mat('#a09a90'), [0, 1.2, 1.3]);
  box(cel, mat('#6b4423'), [-0.85, 0.6, 1.45], [0.08, 1.2, 0.5], [0, -0.7, 0]);
  const wb = (x, z) => { cyl(cel, mat('#8a5a2a'), [x, 0.35, z], 0.3, 0.7, [0, 0, 0], 0.26); for (const y of [0.15, 0.55]) cyl(cel, mat('#3a3a3a'), [x, y, z], 0.31, 0.04); };
  wb(1.7, 1.2); wb(2.2, 0.6);
  const board = new THREE.Group(); board.position.set(0.0, 0, 2.3); cel.add(board);
  box(board, mat('#a8743a'), [0, 0.75, 0], [2.6, 0.1, 0.9]); for (const x of [-1.1, 1.1]) box(board, mat('#6b4423'), [x, 0.37, 0], [0.1, 0.75, 0.8]);
  box(board, mat('#d4a24a'), [0, 0.42, 0.95], [0.5, 0.06, 0.5]); box(board, mat('#d4a24a'), [0, 0.8, 1.2], [0.5, 0.7, 0.06]);
  for (const x of [-0.2, 0.2]) cyl(board, mat('#6b4423'), [x, 0.2, 0.95], 0.03, 0.4);
  // cart with persian cat
  const cart = buildCart(); cart.position.set(-0.2, 0, 1.4); cart.scale.setScalar(1.5); scene.add(cart);
  const cat = buildCat(); cat.position.set(0, 0.4, 0); cat.scale.setScalar(1.15); cart.add(cat);
  const bp = createBlueprint({ scale: 1.8 }); bp.position.set(-3.8, 0, 1.0); bp.rotation.y = 0.5; scene.add(bp);
  bp.userData.pose({ arms: { r: [0, -2.5, 0.4] } });
  clouds(stage); look(stage, 0, 1.7, 9.0, 0, 1.5, 0); stage.camera.fov = 42;
  finishScene(stage, [bp, cat]);
});
</script></body></html>
