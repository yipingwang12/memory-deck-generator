<!doctype html>
<html><head><meta charset="utf-8"><title>Blueprint q04</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q04 — The BLUEPRINT draws KINASE locks, aimed at diseases defined by their genes.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, cyl, blob, makeStage, clouds, ground, look, finishScene, buildPadlock, buildBridge, label } from './common.js';
import { createBlueprint } from './blueprint.js';

guard(() => {
  const stage = makeStage({ sky: { cover: 0.5 } }); const scene = stage.scene; ground(scene, '#7a8f6a');
  const br = buildBridge({ span: 14, h: 3 }); br.position.set(0, 0, -5); scene.add(br);
  // easel board with padlocks being drawn
  const board = new THREE.Group(); board.position.set(1.3, 0, -0.3); scene.add(board);
  box(board, mat('#2a6fd6'), [0, 1.35, 0], [2.6, 1.5, 0.06]);
  for (const x of [-1, 1]) cyl(board, mat('#8a5a2a'), [x * 1.0, 0.6, -0.1], 0.04, 1.4, [0.1, 0, 0]);
  [['#d9b13a', -0.8, 1.55], ['#e8483c', 0, 1.55], ['#3ab26a', 0.8, 1.55], ['#d9b13a', -0.4, 1.0], ['#9a5ae0', 0.4, 1.0]].forEach(([c, x, y]) => {
    const l = buildPadlock(c); l.position.set(x, y, 0.1); l.scale.setScalar(1.5); board.add(l);
  });
  // ace card
  const card = add(scene, new THREE.BoxGeometry(0.55, 0.78, 0.02), mat('#fdfdfd'), [-1.5, 0.45, 1.3], [-0.5, 0.2, 0.15]); card.castShadow = true;
  label(card, 'A', [0, 0.05, 0.012], [0.4, 0.5], { bg: '#fdfdfd', fg: '#c01818', font: 'bold 230px serif' });
  // DNA helix
  const dna = new THREE.Group(); dna.position.set(-2.3, 0, 0.1); scene.add(dna);
  for (let i = 0; i < 26; i++) {
    const y = 0.15 + i * 0.1, a = i * 0.5, x1 = Math.cos(a) * 0.32, z1 = Math.sin(a) * 0.32;
    blob(dna, mat('#ff6a3a'), [x1, y, z1], [0.07, 0.07, 0.07]); blob(dna, mat('#2ac0c8'), [-x1, y, -z1], [0.07, 0.07, 0.07]);
    if (i % 2 === 0) cyl(dna, mat('#f3e9c8'), [0, y, 0], 0.018, 0.64, [0, 0, 0], 0.018).rotation.set(Math.PI / 2, 0, -a + Math.PI / 2 - Math.PI / 2 + 0);
  }
  const bp = createBlueprint({ scale: 1.8 }); bp.position.set(-0.45, 0, 1.2); bp.rotation.y = 0.45; scene.add(bp);
  bp.userData.pose({ lean: 0.05, headTilt: 0.05 });
  bp.updateMatrixWorld(true); const t = bp.worldToLocal(new THREE.Vector3(0.7, 1.35, 0.1));
  bp.userData.reach('l', [t.x, t.y, t.z]); bp.userData.pose({ lean: 0.05 }); bp.userData.reach('l', [t.x, t.y, t.z]);
  // pen
  clouds(stage); look(stage, 0, 1.4, 5.2, 0, 1.3, 0);
  finishScene(stage, [bp]);
});
</script></body></html>
