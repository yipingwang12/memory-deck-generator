<!doctype html>
<html><head><meta charset="utf-8"><title>Blueprint q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — A SUNNY FEE (Sanofi) swallows the BLUEPRINT.
import { guard } from './kit.js';
import { THREE, num, mat, add, blob, cyl, makeStage, clouds, ground, look, finishScene, eyes, label } from './common.js';
import { createBlueprint } from './blueprint.js';

guard(() => {
  const stage = makeStage(); const scene = stage.scene; ground(scene);
  const sun = new THREE.Group(); sun.position.set(0.5, 1.5, -0.3); scene.add(sun);
  blob(sun, mat('#ffb82e', { roughness: 0.5 }), [0, 0, 0], [1.1, 1.1, 1.1]);
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; const c = add(sun, new THREE.ConeGeometry(0.16, 0.5, 12), mat('#ff9a1a'), [Math.cos(a) * 1.3, Math.sin(a) * 1.3, 0], [0, 0, a - Math.PI / 2]); }
  eyes(sun, { x: 0.38, y: 0.4, z: 1.04, s: 2.0, iris: '#7a3a10' });
  for (const s of [-1, 1]) { const b = blob(sun, mat('#ff7f8f'), [s * 0.65, 0.05, 1.0], [0.14, 0.08, 0.02]); b.material.transparent = true; b.material.opacity = 0.6; }
  const mouth = blob(sun, mat('#1a0808'), [0, -0.38, 1.0], [0.52, 0.34, 0.06]);
  blob(sun, mat('#e0566a'), [0, -0.55, 1.03], [0.3, 0.12, 0.03]);
  for (const x of [-0.2, 0.2]) add(sun, new THREE.ConeGeometry(0.06, 0.12, 4), mat('#fff'), [x, -0.14, 1.04], [Math.PI, 0, 0]);
  // FEE price tag held on a stick
  const tag = new THREE.Group(); tag.position.set(-1.75, 1.0, 0.8); tag.rotation.z = 0.12; scene.add(tag);
  cyl(tag, mat('#8a5a2a'), [0, -0.5, 0], 0.03, 1.0);
  add(tag, new THREE.BoxGeometry(0.9, 0.5, 0.05), mat('#f6efe0'), [0, 0.2, 0]);
  label(tag, 'FEE', [0, 0.2, 0.03], [0.85, 0.45], { font: 'bold 190px sans-serif', fg: '#d02a2a' });
  // blueprint sliding headfirst into the mouth
  const bp = createBlueprint({ scale: 1.15 }); bp.position.set(0.0, 0.2, 1.0); bp.rotation.set(0, 0, -0.5); scene.add(bp);
  bp.userData.pose({ arms: { l: [0, 2.4, 0], r: [0, -2.4, 0] }, legs: { l: [0, 0.3], r: [0, -0.2] } });
  clouds(stage); look(stage, 0.2, 1.1, 5.2, 0.2, 1.1, 0);
  finishScene(stage, [bp, sun]);
});
</script></body></html>
