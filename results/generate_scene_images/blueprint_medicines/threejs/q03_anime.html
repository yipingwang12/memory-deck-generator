<!doctype html>
<html><head><meta charset="utf-8"><title>Blueprint q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q03 — A NAIL pins the BLUEPRINT to the buyer's wall as the deal closes.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, cyl, makeStage, ground, look, finishScene, buildNail, buildHammer, canvasTexture, rng } from './common.js';
import { createBlueprint } from './blueprint.js';

guard(() => {
  const stage = makeStage({ sky: { cover: 0.1 } }); const scene = stage.scene;
  const floor = add(scene, new THREE.PlaneGeometry(40, 40), mat('#9a6a3e'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
  const wall = new THREE.MeshStandardMaterial({ map: canvasTexture(512, (ctx, s) => { ctx.fillStyle = '#e9d9b8'; ctx.fillRect(0, 0, s, s); const r = rng(3); for (let i = 0; i < 400; i++) { ctx.fillStyle = `rgba(150,120,80,${r() * 0.08})`; ctx.fillRect(r() * s, r() * s, 14, 14); } }), roughness: 0.9 });
  add(scene, new THREE.BoxGeometry(14, 6, 0.2), wall, [0, 3, -0.6]);
  box(scene, mat('#7a4a22'), [0, 0.15, -0.45], [14, 0.3, 0.1]);
  box(scene, mat('#d8b27a'), [2.6, 2.6, -0.48], [1.5, 1.9, 0.06]); box(scene, mat('#9fd0ee'), [2.6, 2.6, -0.44], [1.3, 1.7, 0.03]);
  const bp = createBlueprint({ scale: 1.9 }); bp.position.set(0, 0.55, -0.4); scene.add(bp);
  bp.userData.pose({ headTilt: 0.05, arms: { l: [0, 1.9, 0.5], r: [0, -1.9, 0.5] }, legs: { l: [0.1, 0.12], r: [-0.05, -0.12] } });
  const nail = buildNail(0.8, 0.045); nail.position.set(0, 0.55 + 0.87 * 1.9 + 0.05, -0.15); scene.add(nail);
  nail.scale.setScalar(1.3); nail.rotation.set(0.15, -0.2, 0);
  nail.children[1].scale.set(1.3, 1, 1.3);
  const h = buildHammer(); h.position.set(1.6, 0.35, 0.6); h.rotation.set(0.3, 0.5, 1.2); h.scale.setScalar(1.6); scene.add(h);
  look(stage, 2.4, 2.3, 4.2, 0, 1.9, -0.3);
  finishScene(stage, [bp, nail, h]);
});
</script></body></html>
