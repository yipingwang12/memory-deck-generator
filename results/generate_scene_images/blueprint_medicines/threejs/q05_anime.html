<!doctype html>
<html><head><meta charset="utf-8"><title>Blueprint q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — Two hundred twenty-nine BLUEPRINT staff carry boxes out of the office.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, cyl, makeStage, clouds, ground, look, finishScene, buildBox, label } from './common.js';
import { createBlueprint } from './blueprint.js';

function carrier(scale, x, z, ry, withNum) {
  const bp = createBlueprint({ scale }); bp.position.set(x, 0, z); bp.rotation.y = ry;
  const b = buildBox(withNum ? '#d9a860' : '#c89a5a'); b.position.set(0, 0.1, 0.25); bp.add(b);
  if (withNum) label(b, '229', [0, 0.15, 0.162], [0.3, 0.22], { bg: '#f6efe0', fg: '#d02a2a', font: 'bold 210px sans-serif' });
  bp.userData.pose({ lean: 0.04, legs: { l: [0.3, 0], r: [-0.25, 0] } });
  bp.updateMatrixWorld(true);
  bp.userData.reach('l', [0.17, 0.25, 0.3]); bp.userData.reach('r', [-0.17, 0.25, 0.3]);
  return bp;
}
guard(() => {
  const stage = makeStage(); const scene = stage.scene; ground(scene, '#8fb56a');
  add(scene, new THREE.PlaneGeometry(40, 3), mat('#c9b99a'), [0, 0.004, 0.5], [-Math.PI / 2, 0, 0]);
  const off = new THREE.Group(); off.position.set(4.2, 0, -1.8); scene.add(off);
  box(off, mat('#c7684a'), [0, 1.8, 0], [4.2, 3.6, 2.4]);
  box(off, mat('#1a1418'), [-1.9 + 0, 1.0, 1.21], [1.3, 2.0, 0.05]); box(off, mat('#e6dcc8'), [-1.9, 2.05, 1.23], [1.5, 0.1, 0.1]);
  for (const [x, y] of [[0.4, 2.4], [1.6, 2.4], [0.4, 1.2], [1.6, 1.2]]) box(off, mat('#9fd0ee'), [x, y, 1.22], [0.8, 0.8, 0.04]);
  const staff = [carrier(1.7, -0.5, 1.9, 0.15, true), carrier(1.25, 1.0, 0.7, 1.2, false), carrier(1.25, 1.9, 0.5, 1.2, false), carrier(0.9, 2.7, -0.05, 1.15, false), carrier(0.9, 3.0, 0.9, 1.1, false)];
  staff.forEach((s) => scene.add(s));
  clouds(stage); look(stage, 1.0, 1.3, 6.4, 1.0, 1.1, 0);
  finishScene(stage, staff);
});
</script></body></html>
