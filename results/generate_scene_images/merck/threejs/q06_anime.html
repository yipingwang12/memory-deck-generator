<!doctype html>
<html><head><meta charset="utf-8"><title>Merck q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, rng, mat, add, box, cyl, blob, textTex, textBoard, person, tent, makeStage, finish, createPond } from "./props.js";
// q06 — The POND's job post asks for an ASSOCIATE PRINCIPAL, a school head's helper.
guard(() => {
  const P = new URLSearchParams(location.search), S = makeStage(P), { scene, num } = S;
  const t = tent({ w: 3.4, h: 2.8 }); t.position.set(-0.3, 0, -3.2); scene.add(t);
  // job-post board with posted sheet: HELP WANTED
  const bd = textBoard('HELP WANTED', 3.0, 0.7, { bg: '#fff4d0', fg: '#c0302a', frame: '#6a4a2a', px: 200 }); bd.position.set(-0.3, 3.6, -1.3); scene.add(bd);
  cyl(scene, mat('#6a4a2a'), [-1.6, 3.0, -1.35], 0.04, 0.04, 0.8); cyl(scene, mat('#6a4a2a'), [1.0, 3.0, -1.35], 0.04, 0.04, 0.8);
  // principal (tall, suit, tie, ruler, school bell) + small helper
  const mk = (suit, tie) => { const p = person({ shirt: suit, pants: suit, glasses: true, hair: '#aaa', scale: 2.0 }); box(p, mat(tie), [0, 0.88, 0.17], [0.06, 0.3, 0.02]); return p; };
  const principal = mk('#34405a', '#c0302a'); principal.position.set(1.7, 0, 0.5); principal.rotation.y = -0.3; scene.add(principal);
  principal.userData.armL.rotation.set(-1.0, 0, 0.2);
  const ruler = box(principal, mat('#e8c35a'), [0.35, 0.95, 0.35], [0.05, 0.6, 0.015], [0.6, 0, 0.2]);
  const helper = person({ shirt: '#e0703a', pants: '#3a4a6a', hair: '#3a2416', cap: null, scale: 1.3 }); helper.position.set(3.1, 0, 0.9); helper.rotation.y = -0.5; scene.add(helper);
  helper.userData.armR.rotation.set(0, 0, -2.5);
  // school bell + apple on a stump
  const st = cyl(scene, mat('#7a5a38'), [-3.4, 0.35, 0.9], 0.45, 0.5, 0.7);
  add(scene, new THREE.SphereGeometry(0.3, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.85), mat('#d9a82a', { metalness: 0.6, roughness: 0.3 }), [-3.4, 0.95, 0.9], [Math.PI, 0, 0]);
  blob(scene, mat('#e83a3a'), [-3.4, 0.64, 0.9], [0.12, 0.12, 0.12]);
  blob(scene, mat('#d03030'), [-2.6, 0.2, 1.7], [0.2, 0.18, 0.2]); cyl(scene, mat('#6a4a2a'), [-2.6, 0.44, 1.7], 0.012, 0.012, 0.12);
  const pond = createPond({ scale: 2.6 }); pond.position.set(-1.2, 0, 1.3); pond.rotation.y = 0.35; scene.add(pond);
  pond.userData.pose({ tilt: -0.05, arms: { r: [0, 0.4, 0] } }); pond.userData.reach('l', [0.45, 1.2, 0.25]);
  finish(S, [pond, principal, helper], [num('cx', 0), num('cy', 2.3), num('cz', 8.8)], [num('tx', 0), num('ty', 2.0), 0]);
});
</script></body></html>
