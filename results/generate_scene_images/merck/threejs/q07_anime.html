<!doctype html>
<html><head><meta charset="utf-8"><title>Merck q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — The POND's ticker on the NYSE reads MRK.
import { THREE, guard, mat, add, box, cyl, blob, textTex, makeStage, finish, createPond } from './props.js';
guard(() => {
  const P = new URLSearchParams(location.search), S = makeStage(P), { scene, num } = S;
  // NYSE facade: stone block, pediment, six columns, steps
  const fac = new THREE.Group(); fac.position.set(0, 0, -3.2); scene.add(fac);
  const stone = mat('#e9e2d2');
  box(fac, stone, [0, 0.12, 1.3], [6.6, 0.24, 1.2]); box(fac, stone, [0, 0.3, 1.0], [6.2, 0.2, 0.9]);
  box(fac, stone, [0, 1.9, -0.3], [5.6, 3.4, 0.6]);
  for (let i = 0; i < 6; i++) { const x = -2.5 + i; cyl(fac, stone, [x, 1.75, 0.55], 0.2, 0.2, 2.9, [0, 0, 0], 20); box(fac, stone, [x, 3.28, 0.55], [0.5, 0.12, 0.5]); box(fac, stone, [x, 0.4, 0.55], [0.5, 0.12, 0.5]); }
  box(fac, stone, [0, 3.45, 0.5], [5.9, 0.22, 1.2]);
  const ped = new THREE.Shape(); ped.moveTo(-3, 0); ped.lineTo(3, 0); ped.lineTo(0, 0.9); ped.closePath();
  add(fac, new THREE.ExtrudeGeometry(ped, { depth: 0.9, bevelEnabled: false }), mat('#f2ecde'), [0, 3.56, 0.0]);
  const flagPole = cyl(fac, mat('#888'), [3.2, 4.4, 0.9], 0.03, 0.03, 2.5);
  add(fac, new THREE.PlaneGeometry(0.9, 0.55), new THREE.MeshStandardMaterial({ color: '#d03a3a', side: 2 }), [3.65, 5.3, 0.9]);
  // LED ticker banner across the columns
  const tex = textTex(1024, 256, (c, W, H) => {
    c.fillStyle = '#0a0f14'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#22e07a'; c.font = 'bold 190px "Arial Black", Helvetica, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('MRK', W * 0.44, H * 0.52);
    c.beginPath(); c.moveTo(W * 0.80, H * 0.72); c.lineTo(W * 0.92, H * 0.72); c.lineTo(W * 0.86, H * 0.25); c.closePath(); c.fill();
    c.fillStyle = '#134a2a'; for (let x = 0; x < W; x += 8) c.fillRect(x, 0, 1, H);
  });
  const tk = new THREE.Group(); tk.position.set(0, 2.6, 0.85); fac.add(tk);
  box(tk, mat('#2a2f36'), [0, 0, 0], [5.2, 1.25, 0.12]);
  add(tk, new THREE.PlaneGeometry(5.0, 1.05), new THREE.MeshBasicMaterial({ map: tex }), [0, 0, 0.065]);
  // pond anchor, front, looking at the ticker
  const pond = createPond({ scale: 1.8 }); pond.position.set(-1.5, 0, 1.8); pond.rotation.y = 0.35; scene.add(pond);
  pond.userData.pose({ tilt: 0.06, lean: -0.1, arms: { l: [0, 0.5, 0], r: [0, 0.3, 0] } });
  pond.userData.reach('r', [-0.05, 1.1, 0.3]);
  // sidewalk + trees
  add(scene, new THREE.PlaneGeometry(14, 3), mat('#cfc7b8'), [0, 0.01, -1.5], [-Math.PI / 2, 0, 0]);
  finish(S, [pond], [num('cx', 0.1), num('cy', 1.5), num('cz', 6.4)], [num('tx', 0), num('ty', 1.9), -3]);
});
</script></body></html>
