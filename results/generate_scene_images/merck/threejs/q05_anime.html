<!doctype html>
<html><head><meta charset="utf-8"><title>Merck q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, rng, mat, add, box, cyl, blob, textTex, textBoard, person, tent, makeStage, finish, createPond } from "./props.js";
// q05 — The POND discovers in Cambridge and runs its clinics in New Jersey.
guard(() => {
  const P = new URLSearchParams(location.search), S = makeStage(P), { scene, num } = S;
  // LEFT: Cambridge bridge over water + microscope (discover)
  add(scene, new THREE.PlaneGeometry(6, 3.2), mat('#5a9a9a', { roughness: 0.3 }), [-3.6, 0.01, -0.6], [-Math.PI / 2, 0, 0]);
  const br = new THREE.Group(); br.position.set(-3.6, 0, -0.6); scene.add(br);
  add(br, new THREE.TorusGeometry(1.3, 0.2, 12, 28, Math.PI), mat('#b8a88a'), [0, 0, 0]); box(br, mat('#c9b99a'), [0, 1.35, 0], [3.4, 0.2, 0.8]);
  for (const s of [-1, 1]) box(br, mat('#b8a88a'), [s * 1.7, 0.3, 0], [0.4, 0.6, 0.8]);
  const mic = new THREE.Group(); mic.position.set(-3.6, 1.45, 0); scene.add(mic);
  box(mic, mat('#2a2f36'), [0, 0.04, 0], [0.9, 0.08, 0.6]); cyl(mic, mat('#e8edf2'), [0, 0.55, -0.1], 0.07, 0.07, 1.0, [0.0, 0, 0]);
  cyl(mic, mat('#3a7ad0'), [0, 0.8, 0.12], 0.1, 0.1, 0.6, [0.5, 0, 0]); cyl(mic, mat('#222'), [0, 0.55, 0.32], 0.04, 0.04, 0.3, [0.5, 0, 0]);
  // RIGHT: clinic tent with red cross + New Jersey jersey on a line
  const clinic = tent({ w: 3.2, h: 2.4, color: '#f4f4f0', stripe: '#d8e6ee' }); clinic.position.set(3.4, 0, -1.2); scene.add(clinic);
  const cross = new THREE.Group(); cross.position.set(3.4, 1.45, 0.4); scene.add(cross);
  box(cross, mat('#d8282a'), [0, 0, 0], [0.7, 0.22, 0.05]); box(cross, mat('#d8282a'), [0, 0, 0], [0.22, 0.7, 0.05]);
  // jersey: shirt shape with number, hung on a pole
  const jt = textTex(256, 256, (c, W, H) => { c.fillStyle = '#2a6a3a'; c.fillRect(0, 0, W, H); c.fillStyle = '#ffd23f'; c.fillRect(0, 0, W, 26); c.fillRect(0, H - 26, W, 26); c.font = 'bold 150px "Arial Black",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('1', W / 2, H / 2); });
  const jer = new THREE.Group(); jer.position.set(1.4, 1.9, 1.0); jer.rotation.y = -0.3; scene.add(jer);
  box(jer, mat('#2a6a3a'), [0, 0, 0], [0.9, 1.0, 0.1]); for (const s of [-1, 1]) box(jer, mat('#2a6a3a'), [s * 0.6, 0.35, 0], [0.5, 0.3, 0.1], [0, 0, s * -0.5]);
  add(jer, new THREE.PlaneGeometry(0.9, 1.0), new THREE.MeshStandardMaterial({ map: jt }), [0, 0, 0.056]);
  box(jer, mat('#2a6a3a'), [0, 0.5, 0], [0.3, 0.1, 0.12]);
  cyl(scene, mat('#6a4a2a'), [1.4, 1.2, 0.95], 0.03, 0.03, 2.4); cyl(scene, mat('#6a4a2a'), [1.4, 2.6, 0.95], 0.03, 0.03, 0.9, [0, 0, Math.PI / 2]);
  // stretcher bed + doctor? keep: bed in front of clinic
  box(scene, mat('#e8eef2'), [4.9, 0.55, 0.9], [1.1, 0.14, 0.6]); for (const s of [-1, 1]) cyl(scene, mat('#888'), [4.9 + s * 0.45, 0.28, 0.9], 0.03, 0.03, 0.55);
  const pond = createPond({ scale: 2.6 }); pond.position.set(-0.4, 0, 1.6); pond.rotation.y = -0.2; scene.add(pond);
  pond.userData.pose({ tilt: 0.03, arms: { l: [0, 0.4, 0], r: [0, 0.4, 0] } });
  finish(S, [pond], [num('cx', 0), num('cy', 2.0), num('cz', 9.0)], [num('tx', 0), num('ty', 1.4), 0]);
});
</script></body></html>
