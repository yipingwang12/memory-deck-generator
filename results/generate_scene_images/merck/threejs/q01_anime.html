<script type="module">
import { THREE, guard, rng, mat, add, box, cyl, blob, textTex, textBoard, person, tent, makeStage, finish, createPond } from "./props.js";

guard(() => {
  const P = new URLSearchParams(location.search), S = makeStage(P), { scene, num } = S;

  cyl(em, mat('#fff'), [0, 0.25, 0], 0.03, 0.03, 0.3); add(em, new THREE.ConeGeometry(0.3, 0.45, 24), mat('#5fd0e0'), [0, -0.02, 0]); cyl(em, mat('#fff'), [0, 0.42, 0], 0.07, 0.05, 0.05);

  const br = new THREE.Group(); br.position.set(4.2, 0, -4); scene.add(br);
  add(br, new THREE.TorusGeometry(1.2, 0.18, 12, 28, Math.PI), mat('#b8a88a'), [0, 0, 0]); box(br, mat('#c9b99a'), [0, 1.25, 0], [3.2, 0.2, 0.7]);
  // explorers walking away to the right with flag
  const ex = [];
  [[2.0, 0.2, -1.2], [3.0, 0.4, -1.8]].forEach(([x, z, ry], i) => {
    const p = person({ hat: 'pith', backpack: true, shirt: i ? '#4aa86a' : '#e0703a', scale: 1.7 }); p.position.set(x, 0, z + 0.4); p.rotation.y = 0.7; scene.add(p); ex.push(p);
    p.userData.armL.rotation.x = 0.5; p.userData.armR.rotation.x = -0.5;
  });
  const pole = cyl(scene, mat('#6a4a2a'), [3.6, 1.7, 0.5], 0.02, 0.02, 3.4); add(scene, new THREE.PlaneGeometry(0.7, 0.45), new THREE.MeshStandardMaterial({ color: '#e0403a', side: 2 }), [3.95, 3.2, 0.5]);

  finish(S, [pond, ...ex], [num('cx', 0.2), num('cy', 1.6), num('cz', 7.0)], [num('tx', 0.2), num('ty', 1.5), -1]);
