<!doctype html>
<html><head><meta charset="utf-8"><title>Merck q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, rng, mat, add, box, cyl, blob, textTex, textBoard, person, tent, makeStage, finish, createPond } from "./props.js";
// q03 — The POND's computer room is called Data, AI & Genome Sciences.
guard(() => {
  const P = new URLSearchParams(location.search), S = makeStage(P, { pond: false }), { scene, num } = S;
  // open-fronted tent: floor, back + side walls, prism roof
  const room = new THREE.Group(); room.position.set(0, 0, -2.0); scene.add(room);
  box(room, mat('#d9c7a0'), [0, 0.03, 0.6], [8.4, 0.06, 4.6]);
  box(room, mat('#e8c35a'), [0, 1.9, -1.7], [8.4, 3.8, 0.12]);
  for (const s of [-1, 1]) box(room, mat('#e8c35a'), [s * 4.2, 1.9, 0.6], [0.12, 3.8, 4.6]);
  const roof = new THREE.Shape(); roof.moveTo(-4.4, 0); roof.lineTo(4.4, 0); roof.lineTo(0, 1.6); roof.closePath();
  add(room, new THREE.ExtrudeGeometry(roof, { depth: 4.9, bevelEnabled: false }), mat('#c0462a'), [0, 3.8, -1.8]).rotation.set(0, 0, 0);
  // screens
  const bars = textTex(512, 320, (c, W, H) => { c.fillStyle = '#0d1b2a'; c.fillRect(0, 0, W, H); const r = rng(3); ['#37d6c8', '#ffd23f', '#ff7a8a', '#7aa8ff'].forEach((col, i) => { for (let k = 0; k < 6; k++) { c.fillStyle = col; const h = 40 + r() * 190; c.fillRect(30 + k * 80 + i * 4, H - 20 - h, 16, h); } }); });
  const ai = textTex(512, 320, (c, W, H) => { c.fillStyle = '#0d1b2a'; c.fillRect(0, 0, W, H); c.strokeStyle = '#37d6c8'; c.lineWidth = 8; c.strokeRect(120, 50, 270, 220); c.fillStyle = '#37d6c8'; c.font = 'bold 150px "Arial Black",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('AI', 256, 160); for (let i = 0; i < 5; i++) { c.fillRect(150 + i * 50, 20, 8, 30); c.fillRect(150 + i * 50, 270, 8, 30); } });
  const mon = (x, y, tex, ry = 0) => { const g = new THREE.Group(); g.position.set(x, y, 0); g.rotation.y = ry; room.add(g); box(g, mat('#2a2f36'), [0, 0, 0], [1.6, 1.0, 0.1]); add(g, new THREE.PlaneGeometry(1.5, 0.9), new THREE.MeshBasicMaterial({ map: tex }), [0, 0, 0.056]); box(g, mat('#2a2f36'), [0, -0.65, 0], [0.12, 0.3, 0.1]); };
  mon(-3.0, 1.9, bars, 0.35); mon(3.0, 1.9, ai, -0.35); mon(-3.0, 0.9, ai, 0.35);
  // desks
  for (const x of [-3, 3]) { box(room, mat('#7a5a38'), [x, 0.55, 0.2], [2.1, 0.12, 1.0]); for (const s of [-1, 1]) box(room, mat('#6a4a2a'), [x + s * 0.9, 0.27, 0.2], [0.1, 0.55, 0.8]); box(room, mat('#2a2f36'), [x, 0.68, 0.0], [0.9, 0.04, 0.3]); }
  // server rack
  box(room, mat('#3a4250'), [0, 1.3, -1.35], [1.2, 2.6, 0.5]); for (let i = 0; i < 6; i++) { box(room, mat('#222'), [0, 0.3 + i * 0.4, -1.08], [1.05, 0.28, 0.04]); add(room, new THREE.SphereGeometry(0.03, 8, 6), new THREE.MeshBasicMaterial({ color: i % 2 ? '#3f3' : '#fa3' }), [-0.4, 0.3 + i * 0.4, -1.04]); }
  // DNA helix floating
  const dna = new THREE.Group(); dna.position.set(1.0, 1.6, 0.5); room.add(dna);
  const cols = ['#ff5a7a', '#ffd23f', '#37d6c8', '#7aa8ff'];
  for (let i = 0; i <= 28; i++) {
    const y = i * 0.1 - 1.4, a = i * 0.45;
    const p1 = [Math.cos(a) * 0.42, y, Math.sin(a) * 0.42], p2 = [-Math.cos(a) * 0.42, y, -Math.sin(a) * 0.42];
    blob(dna, new THREE.MeshStandardMaterial({ color: '#ff7ac0', emissive: '#ff3f9a', emissiveIntensity: 0.4 }), p1, [0.07, 0.07, 0.07]);
    blob(dna, new THREE.MeshStandardMaterial({ color: '#7ad0ff', emissive: '#3f9aff', emissiveIntensity: 0.4 }), p2, [0.07, 0.07, 0.07]);
    if (i % 2 === 0) add(dna, new THREE.CylinderGeometry(0.03, 0.03, 0.84, 8), mat(cols[(i / 2) % 4]), [0, y, 0], [0, -a, Math.PI / 2]);
  }
  const pond = createPond({ scale: 2.5 }); pond.position.set(-0.7, 0, 1.4); pond.rotation.y = 0.3; scene.add(pond);
  pond.userData.pose({ tilt: 0.05, arms: { l: [0, 0.6, 0] } }); pond.userData.reach('r', [-0.3, 0.95, 0.35]);
  finish(S, [pond], [num('cx', 0), num('cy', 2.0), num('cz', 8.0)], [num('tx', 0), num('ty', 1.7), -1]);
});
</script></body></html>
