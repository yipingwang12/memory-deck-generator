<!doctype html>
<html><head><meta charset="utf-8"><title>TFS</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard, canvasTexture, rng } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createThermos } from './thermos.js';
const mat = (c, e = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.65, ...e });
const add = (parent, geo, m, pos = [0, 0, 0], rot = [0, 0, 0], scl = [1, 1, 1]) => {
  const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.rotation.set(...rot); o.scale.set(...scl);
  o.castShadow = o.receiveShadow = true; parent.add(o); return o;
};
const txt = (w, h, draw) => canvasTexture(512, (ctx, s) => { ctx.clearRect(0, 0, s, s); draw(ctx, s); });
function sign(text, w, h, bg, fg, font = 'bold 110px Arial') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = Math.round(1024 * h / w); const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, c.width / 2, c.height / 2); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function setup(ground = '#7fbf5a') {
  const P = new URLSearchParams(location.search); const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: num('el', 35), sunAzimuth: num('az', 150), exposure: num('exp', 1),
    sky: { cover: num('cover', 2), seed: num('seed', 5), towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 },
  });
  add(stage.scene, new THREE.PlaneGeometry(400, 400), mat(ground), [0, 0, 0], [-Math.PI / 2, 0, 0]);
  return { stage, num, scene: stage.scene };
}
function finishScene(stage, chars, cam, look) {
  const pm = new Set(); chars.forEach((c) => c.traverse((o) => pm.add(o)));
  stage.toonify(stage.scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [168, 1300, 200, 2.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9], [252, 900, 80, 1.1]]);
  stage.camera.position.set(...cam); stage.camera.lookAt(...look); stage.finish();
}
function labelTex() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 780; const x = c.getContext('2d');
  x.fillStyle = '#fffdf6'; x.fillRect(0, 0, 1024, 512); x.fillStyle = '#3a6fd8'; x.fillRect(0, 0, 1024, 50); x.fillRect(0, 730, 1024, 50);
  x.fillStyle = '#1b2a55'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = 'bold 150px Arial'; x.fillText('SPECIALTY', 512, 170);
  x.font = 'bold 128px Arial'; x.fillText('DIAGNOSTICS', 512, 330);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function testTubeRack() {
  const g = new THREE.Group();
  add(g, new THREE.BoxGeometry(1.4, 0.08, 0.4), mat('#8a5a34'), [0, 0.04, 0]); add(g, new THREE.BoxGeometry(1.4, 0.06, 0.4), mat('#8a5a34'), [0, 0.5, 0]);
  [-0.55, 0.55].forEach((x) => add(g, new THREE.BoxGeometry(0.06, 0.5, 0.4), mat('#8a5a34'), [x, 0.27, 0]));
  ['#e8403a', '#3fa8e0', '#f0c030', '#58c060', '#a060d0'].forEach((c, i) => {
    const x = -0.5 + i * 0.25; add(g, new THREE.CylinderGeometry(0.06, 0.06, 0.7, 16), mat('#e8f4ff', { transparent: true, opacity: 0.35, depthWrite: false }), [x, 0.5, 0]);
    add(g, new THREE.CylinderGeometry(0.062, 0.062, 0.3, 16), mat(c), [x, 0.3, 0.001]); add(g, new THREE.SphereGeometry(0.06, 16, 10), mat('#e8f4ff', { transparent: true, opacity: 0.7 }), [x, 0.15, 0]);
  });
  return g;
}
guard(() => {
  const { stage, scene } = setup('#cfe3f2');
  add(scene, new THREE.BoxGeometry(14, 3.2, 0.2), mat('#e8f0f5'), [0, 1.6, -3]);
  const th = createThermos({ scale: 3.0 }); th.position.set(-0.3, 0, 0); th.rotation.y = -0.25; scene.add(th);
  th.userData.pose({ headTilt: 0.06, arms: { l: [0, 0.3, 0], r: [0, 0.3, 0] }, legs: { l: [0.05, 0], r: [-0.05, 0] } });
  const L = add(th, new THREE.CylinderGeometry(0.146, 0.146, 0.2, 40, 1, true, -0.9, 1.8), new THREE.MeshStandardMaterial({ map: labelTex(), roughness: 0.5, side: THREE.DoubleSide }), [0, 0.43, 0]);
  L.castShadow = false;
  const r = testTubeRack(); r.position.set(2.5, 0, 0.3); r.rotation.y = -0.4; r.scale.setScalar(1.3); scene.add(r);
  finishScene(stage, [th], [0.3, 1.4, 5.6], [0.4, 1.3, 0]);
});
</script></body></html>
