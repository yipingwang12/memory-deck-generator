<!doctype html>
<html><head><meta charset="utf-8"><title>TFS</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard, canvasTexture, rng } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createThermos } from './thermos.js';
const mat = (c, e = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.65, ...e });
const add = (parent, geo, m, pos = [0, 0, 0], rot = [0, 0, 0], scl = [1, 1, 1]) => {
  const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.rotation.set(...rot); o.scale.set(...scl);
  o.castShadow = o.receiveShadow = true; parent.add(o); return o;
};
const txt = (w, h, draw) => canvasTexture(512, (ctx, s) => { ctx.clearRect(0, 0, s, s); draw(ctx, s); });
function sign(text, w, h, bg, fg, font = 'bold 110px Arial') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = Math.round(1024 * h / w); const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, c.width / 2, c.height / 2); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function setup(ground = '#7fbf5a') {
  const P = new URLSearchParams(location.search); const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: num('el', 35), sunAzimuth: num('az', 150), exposure: num('exp', 1),
    sky: { cover: num('cover', 2), seed: num('seed', 5), towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 },
  });
  add(stage.scene, new THREE.PlaneGeometry(400, 400), mat(ground), [0, 0, 0], [-Math.PI / 2, 0, 0]);
  return { stage, num, scene: stage.scene };
}
function finishScene(stage, chars, cam, look) {
  const pm = new Set(); chars.forEach((c) => c.traverse((o) => pm.add(o)));
  stage.toonify(stage.scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [168, 1300, 200, 2.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9], [252, 900, 80, 1.1]]);
  stage.camera.position.set(...cam); stage.camera.lookAt(...look); stage.finish();
}
function exchange() {
  const g = new THREE.Group(), stone = mat('#e9e3d6');
  add(g, new THREE.BoxGeometry(7.6, 0.3, 3.4), mat('#c9c2b2'), [0, 0.15, 0]);
  add(g, new THREE.BoxGeometry(7.0, 3.9, 1.0), stone, [0, 2.25, -0.9]);
  for (let i = 0; i < 6; i++) add(g, new THREE.CylinderGeometry(0.2, 0.22, 3.3, 20), stone, [-2.75 + i * 1.1, 2.1, 0.5]);
  add(g, new THREE.BoxGeometry(7.2, 0.35, 1.7), stone, [0, 3.95, 0.3]);
  const tri = new THREE.Shape(); tri.moveTo(-3.6, 0); tri.lineTo(3.6, 0); tri.lineTo(0, 1.1); tri.closePath();
  add(g, new THREE.ExtrudeGeometry(tri, { depth: 1.5, bevelEnabled: false }), stone, [0, 4.1, -0.45]);
  add(g, new THREE.BoxGeometry(2.4, 2.4, 0.05), mat('#4a6aa0'), [0, 1.5, -0.38]);
  for (let i = 0; i < 4; i++) add(g, new THREE.BoxGeometry(0.2, 2.4, 0.07), mat('#c9a040'), [-0.9 + i * 0.6, 1.5, -0.36]);
  return g;
}
function ticker() {
  const g = new THREE.Group(), c = document.createElement('canvas'); c.width = 1024; c.height = 400; const x = c.getContext('2d');
  x.fillStyle = '#0a0a10'; x.fillRect(0, 0, 1024, 400); x.fillStyle = '#ff9a1a'; x.font = 'bold 300px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('TMO', 512, 205);
  x.fillStyle = '#3cff6a'; x.beginPath(); x.moveTo(930, 330); x.lineTo(980, 330); x.lineTo(955, 285); x.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  add(g, new THREE.BoxGeometry(3.4, 1.38, 0.2), mat('#1c1c24'));
  add(g, new THREE.PlaneGeometry(3.2, 1.25), new THREE.MeshBasicMaterial({ map: t }), [0, 0, 0.101]);
  return g;
}
guard(() => {
  const { stage, scene } = setup('#9ac878');
  const ex = exchange(); ex.position.set(0, 0, -2.5); scene.add(ex);
  add(scene, new THREE.BoxGeometry(5, 0.1, 6), mat('#c9c2b2'), [0, 0.05, 1.5]);
  const tk = ticker(); tk.position.set(0, 3.3, -1.0); scene.add(tk);
  const flag = add(scene, new THREE.CylinderGeometry(0.03, 0.03, 4, 8), mat('#9aa0a8'), [-3.6, 2, -1.2]);
  const th = createThermos({ scale: 2.9 }); th.position.set(-2.0, 0.1, 1.9); th.rotation.y = 0.25; scene.add(th);
  th.userData.pose({ lean: 0.05, headTilt: 0.08, arms: { r: [0, 0.3, 0] }, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  th.updateMatrixWorld(true); const t = th.worldToLocal(new THREE.Vector3(-0.6, 3.1, 1.5)); th.userData.reach('l', [t.x, t.y, t.z]);
  finishScene(stage, [th], [0.3, 2.2, 9.2], [0, 2.3, 0]);
});
</script></body></html>
