<html><head><meta charset="utf-8"><title>TFS</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { guard, canvasTexture, rng } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createThermos } from './thermos.js';
const mat = (c, e = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.65, ...e });
const add = (parent, geo, m, pos = [0, 0, 0], rot = [0, 0, 0], scl = [1, 1, 1]) => {
  const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.rotation.set(...rot); o.scale.set(...scl);
  o.castShadow = o.receiveShadow = true; parent.add(o); return o;
};
const txt = (w, h, draw) => canvasTexture(512, (ctx, s) => { ctx.clearRect(0, 0, s, s); draw(ctx, s); });
function sign(text, w, h, bg, fg, font = 'bold 110px Arial') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = Math.round(1024 * h / w); const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, c.width / 2, c.height / 2); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function setup(ground = '#7fbf5a') {
  const P = new URLSearchParams(location.search); const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: num('el', 35), sunAzimuth: num('az', 150), exposure: num('exp', 1),
    sky: { cover: num('cover', 2), seed: num('seed', 5), towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 },
  });
  add(stage.scene, new THREE.PlaneGeometry(400, 400), mat(ground), [0, 0, 0], [-Math.PI / 2, 0, 0]);
  return { stage, num, scene: stage.scene };
}
function finishScene(stage, chars, cam, look) {
  const pm = new Set(); chars.forEach((c) => c.traverse((o) => pm.add(o)));
  stage.toonify(stage.scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [168, 1300, 200, 2.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9], [252, 900, 80, 1.1]]);
  stage.camera.position.set(...cam); stage.camera.lookAt(...look); stage.finish();
}
function brickTex() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#b8553a'; x.fillRect(0, 0, 512, 512);
  for (let r = 0; r < 24; r++) for (let k = 0; k < 12; k++) { x.fillStyle = `hsl(12,${45 + (r * 7 + k * 13) % 15}%,${40 + (r * 5 + k * 11) % 10}%)`; x.fillRect(k * 44 + (r % 2) * 22 - 22, r * 21.3 + 1, 42, 19); }
  for (let r = 1; r < 5; r++) for (let k = 0; k < 6; k++) { x.fillStyle = '#fff3c4'; x.fillRect(20 + k * 82, r * 96 - 50, 44, 62); x.fillStyle = '#7a4a2a'; x.fillRect(20 + k * 82, r * 96 - 50 + 29, 44, 4); x.fillRect(20 + k * 82 + 20, r * 96 - 50, 4, 62); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function pocketWatch(R) {
  const g = new THREE.Group(), gold = mat('#f0b52c', { metalness: 0.6, roughness: 0.3 });
  const body = add(g, new THREE.CylinderGeometry(R, R, 0.16, 56), gold, [0, 0, 0], [Math.PI / 2, 0, 0]);
  add(g, new THREE.TorusGeometry(R, 0.055, 16, 56), gold, [0, 0, 0.08]);
  add(g, new THREE.CylinderGeometry(R * 0.92, R * 0.92, 0.02, 56), mat('#fffaf0'), [0, 0, 0.085], [Math.PI / 2, 0, 0]);
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, big = i % 3 === 0;
    add(g, new THREE.BoxGeometry(big ? 0.07 : 0.04, big ? 0.2 : 0.12, 0.02), mat('#2a2a35'), [Math.sin(a) * R * 0.78, Math.cos(a) * R * 0.78, 0.1], [0, 0, -a]); }
  const hand = (len, w, a, c) => { const h = new THREE.Group(); h.rotation.z = -a; add(h, new THREE.BoxGeometry(w, len, 0.03), mat(c), [0, len / 2 - 0.05, 0.12]); g.add(h); };
  hand(R * 0.55, 0.07, 2.4, '#1a1a25'); hand(R * 0.8, 0.045, 0.4, '#1a1a25'); hand(R * 0.85, 0.015, 3.9, '#c8283a');
  add(g, new THREE.SphereGeometry(0.06, 16, 12), gold, [0, 0, 0.14]);
  add(g, new THREE.CylinderGeometry(0.1, 0.1, 0.16, 20), gold, [0, R + 0.1, 0]);
  add(g, new THREE.TorusGeometry(0.18, 0.04, 12, 28), gold, [0, R + 0.3, 0]);
  const chain = new THREE.CatmullRomCurve3([new THREE.Vector3(0, R + 0.48, 0), new THREE.Vector3(0.3, R + 0.75, 0.05), new THREE.Vector3(0.8, R + 0.5, 0.1), new THREE.Vector3(1.1, R * 0.2, 0.2)]);
  add(g, new THREE.TubeGeometry(chain, 40, 0.025, 8), gold);

guard(() => {
  const { stage, num, scene } = setup('#86c25e');
  const fac = add(scene, new THREE.BoxGeometry(5, 2.8, 1.2), new THREE.MeshStandardMaterial({ map: brickTex(), roughness: 0.9 }), [1.2, 1.4, -4.5]);
  add(scene, new THREE.CylinderGeometry(0.2, 0.25, 2, 14), mat('#a04a32'), [-0.9, 3.4, -4.5]);
  add(scene, new THREE.BoxGeometry(5.2, 0.2, 1.4), mat('#6b4a3a'), [1.2, 2.9, -4.5]);
  const w = pocketWatch(0.85); w.position.set(1.0, 1.0, -0.4); w.rotation.set(-0.12, -0.35, 0); scene.add(w);
  add(scene, new THREE.BoxGeometry(0.5, 0.12, 0.45), mat('#6b4a3a'), [1.0, 0.08, -0.35]);
  const th = createThermos({ scale: 2.0 }); th.position.set(-1.05, 0, 0.4); th.rotation.y = 0.45; scene.add(th);
  th.userData.pose({ lean: 0.05, headTilt: 0.08, arms: { r: [0, 0.2, 0] }, legs: { l: [0.2, 0], r: [-0.15, 0] } });
  th.updateMatrixWorld(true); const t = th.worldToLocal(new THREE.Vector3(0.0, 1.2, 0.2)); th.userData.reach('l', [t.x, t.y, t.z]);
  finishScene(stage, [th], [0.2, 1.0, 5.0], [0.1, 0.95, 0]);
});
