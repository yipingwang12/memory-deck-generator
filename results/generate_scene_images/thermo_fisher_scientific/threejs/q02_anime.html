<!doctype html>
<html><head><meta charset="utf-8"><title>TFS</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard, canvasTexture, rng } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createThermos } from './thermos.js';
const mat = (c, e = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.65, ...e });
const add = (parent, geo, m, pos = [0, 0, 0], rot = [0, 0, 0], scl = [1, 1, 1]) => {
  const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.rotation.set(...rot); o.scale.set(...scl);
  o.castShadow = o.receiveShadow = true; parent.add(o); return o;
};
const txt = (w, h, draw) => canvasTexture(512, (ctx, s) => { ctx.clearRect(0, 0, s, s); draw(ctx, s); });
function sign(text, w, h, bg, fg, font = 'bold 110px Arial') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = Math.round(1024 * h / w); const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, c.width / 2, c.height / 2); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function setup(ground = '#7fbf5a') {
  const P = new URLSearchParams(location.search); const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: num('el', 35), sunAzimuth: num('az', 150), exposure: num('exp', 1),
    sky: { cover: num('cover', 2), seed: num('seed', 5), towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 },
  });
  add(stage.scene, new THREE.PlaneGeometry(400, 400), mat(ground), [0, 0, 0], [-Math.PI / 2, 0, 0]);
  return { stage, num, scene: stage.scene };
}
function finishScene(stage, chars, cam, look) {
  const pm = new Set(); chars.forEach((c) => c.traverse((o) => pm.add(o)));
  stage.toonify(stage.scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [168, 1300, 200, 2.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9], [252, 900, 80, 1.1]]);
  stage.camera.position.set(...cam); stage.camera.lookAt(...look); stage.finish();
}
function stethoscope() {
  const g = new THREE.Group(), steel = mat('#c5ccd4', { metalness: 0.6, roughness: 0.3 }), tube = mat('#22262e');
  const curve = new THREE.CatmullRomCurve3([[-0.13, 0.0, 0], [-0.14, -0.2, 0.02], [-0.08, -0.4, 0.04], [0, -0.45, 0.05], [0.08, -0.4, 0.04], [0.14, -0.2, 0.02], [0.13, 0.0, 0]].map((p) => new THREE.Vector3(...p)));
  add(g, new THREE.TubeGeometry(curve, 30, 0.012, 8), tube);
  add(g, new THREE.CylinderGeometry(0.04, 0.04, 0.02, 20), steel, [0, -0.5, 0.06], [Math.PI / 2, 0, 0]);
  add(g, new THREE.TorusGeometry(0.04, 0.008, 8, 20), tube, [0, -0.5, 0.07]);
  return g;
}
function syringe() {
  const g = new THREE.Group();
  add(g, new THREE.CylinderGeometry(0.07, 0.07, 0.5, 20), mat('#e9f6ff', { transparent: true, opacity: 0.85 }));
  add(g, new THREE.CylinderGeometry(0.058, 0.058, 0.28, 20), mat('#3fb8e0'), [0, -0.1, 0]);
  add(g, new THREE.CylinderGeometry(0.012, 0.012, 0.3, 8), mat('#d0d6dc', { metalness: 0.7 }), [0, -0.4, 0]);
  add(g, new THREE.CylinderGeometry(0.02, 0.02, 0.35, 10), mat('#bfc6cc'), [0, 0.38, 0]);
  add(g, new THREE.CylinderGeometry(0.1, 0.1, 0.03, 20), mat('#e9f6ff'), [0, 0.57, 0]);
  add(g, new THREE.BoxGeometry(0.2, 0.03, 0.05), mat('#e9f6ff'), [0, 0.2, 0]);
  return g;
}
function monitor() {
  const g = new THREE.Group(), c = document.createElement('canvas'); c.width = 512; c.height = 320; const x = c.getContext('2d');
  x.fillStyle = '#06210f'; x.fillRect(0, 0, 512, 320); x.strokeStyle = '#4dff7a'; x.lineWidth = 8; x.beginPath(); x.moveTo(10, 170);
  for (let i = 0; i < 3; i++) { const o = i * 165; x.lineTo(o + 40, 170); x.lineTo(o + 70, 170); x.lineTo(o + 90, 60); x.lineTo(o + 115, 260); x.lineTo(o + 135, 170); x.lineTo(o + 165, 170); } x.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  add(g, new THREE.BoxGeometry(0.9, 0.62, 0.2), mat('#e8edf2'), [0, 0.7, 0]);
  add(g, new THREE.PlaneGeometry(0.78, 0.5), new THREE.MeshBasicMaterial({ map: t }), [0, 0.7, 0.101]);
  add(g, new THREE.BoxGeometry(0.1, 0.4, 0.1), mat('#aab3bd'), [0, 0.2, 0]); add(g, new THREE.BoxGeometry(0.5, 0.06, 0.3), mat('#aab3bd'), [0, 0.03, 0]);
  return g;
}
function medBox() {
  const g = new THREE.Group(); add(g, new THREE.BoxGeometry(0.6, 0.45, 0.4), mat('#f4f4f0'), [0, 0.225, 0]);
  add(g, new THREE.BoxGeometry(0.28, 0.08, 0.01), mat('#d8262e'), [0, 0.225, 0.205]); add(g, new THREE.BoxGeometry(0.08, 0.28, 0.01), mat('#d8262e'), [0, 0.225, 0.205]);
  return g;
}
guard(() => {
  const { stage, scene } = setup('#9fcf7c');
  const th = createThermos({ scale: 3.6 }); th.position.set(0.2, 0, -0.2); th.rotation.y = -0.15; scene.add(th);
  th.userData.pose({ headTilt: 0.05, arms: { l: [0, 0.25, 0], r: [0, 0.25, 0] }, legs: { l: [0.05, 0], r: [-0.05, 0] } });
  const st = stethoscope(); st.position.set(0, 0.86, 0.1); th.add(st);
  const m = monitor(); m.position.set(-2.4, 0, 1.4); m.rotation.y = 0.5; scene.add(m);
  const b = medBox(); b.position.set(-1.5, 0, 2.0); b.rotation.y = 0.2; scene.add(b);
  const s = syringe(); s.position.set(2.5, 0.08, 1.8); s.rotation.set(0, 0.4, Math.PI / 2); scene.add(s);
  const b2 = medBox(); b2.position.set(2.2, 0, 0.6); b2.scale.setScalar(0.8); b2.rotation.y = -0.4; scene.add(b2);
  const lab = (() => { const c = document.createElement('canvas'); return c; })();
  finishScene(stage, [th], [0, 1.8, 6.6], [0.1, 1.6, 0]);
});
</script></body></html>
