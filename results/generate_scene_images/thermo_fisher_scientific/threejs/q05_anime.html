<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { guard, canvasTexture, rng } from './kit.js';
import { createAnimeStage } from './kit_anime.js';

const mat = (c, e = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.65, ...e });
const add = (parent, geo, m, pos = [0, 0, 0], rot = [0, 0, 0], scl = [1, 1, 1]) => {
  const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.rotation.set(...rot); o.scale.set(...scl);
  o.castShadow = o.receiveShadow = true; parent.add(o); return o;
};
const txt = (w, h, draw) => canvasTexture(512, (ctx, s) => { ctx.clearRect(0, 0, s, s); draw(ctx, s); });
function sign(text, w, h, bg, fg, font = 'bold 110px Arial') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = Math.round(1024 * h / w); const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, c.width / 2, c.height / 2); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function setup(ground = '#7fbf5a') {
  const P = new URLSearchParams(location.search); const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: num('el', 35), sunAzimuth: num('az', 150), exposure: num('exp', 1),
    sky: { cover: num('cover', 2), seed: num('seed', 5), towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 },

  add(stage.scene, new THREE.PlaneGeometry(400, 400), mat(ground), [0, 0, 0], [-Math.PI / 2, 0, 0]);

}
function finishScene(stage, chars, cam, look) {
  const pm = new Set(); chars.forEach((c) => c.traverse((o) => pm.add(o)));
  stage.toonify(stage.scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [168, 1300, 200, 2.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9], [252, 900, 80, 1.1]]);

}
function franklin() {
  const g = new THREE.Group(), skin = mat('#f3cba5'), coat = mat('#6a4a8a'), hair = mat('#d8d8dc');
  [-1, 1].forEach((s) => { add(g, new THREE.CylinderGeometry(0.06, 0.07, 0.4, 14), mat('#ece4d0'), [s * 0.09, 0.2, 0]); add(g, new THREE.SphereGeometry(1, 14, 10), mat('#2a2018'), [s * 0.09, 0.03, 0.05], [0, 0, 0], [0.08, 0.05, 0.13]); });
  add(g, new THREE.CylinderGeometry(0.17, 0.24, 0.6, 24), coat, [0, 0.68, 0]);
  add(g, new THREE.SphereGeometry(0.17, 20, 14), mat('#f6f2e8'), [0, 0.98, 0.1], [0, 0, 0], [0.6, 0.5, 0.5]);
  add(g, new THREE.SphereGeometry(0.17, 24, 18), skin, [0, 1.2, 0]);
  add(g, new THREE.SphereGeometry(0.175, 24, 18, 0, Math.PI * 2, Math.PI * 0.52, Math.PI * 0.35), hair, [0, 1.2, -0.02], [0.3, 0, 0]);
  [-1, 1].forEach((s) => { add(g, new THREE.SphereGeometry(0.1, 14, 10), hair, [s * 0.15, 1.08, -0.02], [0, 0, 0], [0.8, 1.9, 0.8]);
    add(g, new THREE.SphereGeometry(1, 14, 10), mat('#ffffff'), [s * 0.065, 1.22, 0.15], [0, 0, 0], [0.04, 0.04, 0.02]);
    add(g, new THREE.TorusGeometry(0.05, 0.007, 8, 24), mat('#c9a040'), [s * 0.065, 1.22, 0.16]); add(g, new THREE.SphereGeometry(1, 12, 8), mat('#1a1010'), [s * 0.065, 1.22, 0.162], [0, 0, 0], [0.018, 0.022, 0.01]); });
  add(g, new THREE.TorusGeometry(0.05, 0.02, 8, 12, Math.PI), mat('#a02a3a'), [0, 1.14, 0.16], [0, 0, Math.PI]);
  add(g, new THREE.CylinderGeometry(0.04, 0.04, 0.5, 10), coat, [-0.26, 0.8, 0.08], [0, 0, 0.6]);
  add(g, new THREE.CylinderGeometry(0.04, 0.04, 0.4, 10), coat, [0.3, 0.9, 0.1], [0, 0, -0.9]);
  return g;
}
function kite() {
  const g = new THREE.Group(), cloth = mat('#ffcf3a', { side: THREE.DoubleSide });
  const sh = new THREE.Shape(); sh.moveTo(0, 0.7); sh.lineTo(0.45, 0); sh.lineTo(0, -0.9); sh.lineTo(-0.45, 0); sh.closePath();
  add(g, new THREE.ShapeGeometry(sh), cloth);
  add(g, new THREE.BoxGeometry(0.03, 1.6, 0.03), mat('#6a4a2a'), [0, -0.1, 0.01]); add(g, new THREE.BoxGeometry(0.9, 0.03, 0.03), mat('#6a4a2a'), [0, 0, 0.01]);
  [0, 1, 2, 3].forEach((i) => add(g, new THREE.SphereGeometry(0.06, 10, 8), mat(i % 2 ? '#d8262e' : '#2b6ad8'), [0.02 * (i % 2 ? 1 : -1), -1.1 - i * 0.2, 0.0], [0, 0, 0], [1.2, 0.8, 0.4]));
  return g;
}
function key() {
  const g = new THREE.Group(), gold = mat('#e8b52c', { metalness: 0.7, roughness: 0.3 });
  add(g, new THREE.TorusGeometry(0.09, 0.025, 10, 24), gold, [0, 0.22, 0]); add(g, new THREE.CylinderGeometry(0.018, 0.018, 0.4, 10), gold);
  add(g, new THREE.BoxGeometry(0.1, 0.04, 0.025), gold, [0.05, -0.15, 0]); return g;
}
function anvil() {
  const g = new THREE.Group(), m = mat('#3c4048', { metalness: 0.5, roughness: 0.4 });
  add(g, new THREE.BoxGeometry(0.4, 0.3, 0.3), mat('#7a5a38'), [0, 0.15, 0]); add(g, new THREE.BoxGeometry(0.7, 0.14, 0.34), m, [0, 0.37, 0]);
  add(g, new THREE.ConeGeometry(0.1, 0.3, 14), m, [0.5, 0.37, 0], [0, 0, -Math.PI / 2]); return g;
}
guard(() => {
  const { stage, scene } = setup('#e4eef6');
  // gate with chain and padlock
  const iron = mat('#2f3238', { metalness: 0.4, roughness: 0.5 });
  for (let i = -3; i <= 3; i++) add(scene, new THREE.BoxGeometry(0.1, 2.4, 0.1), iron, [i * 0.38 + 0.4, 1.2, -1.5]);
  add(scene, new THREE.BoxGeometry(2.9, 0.1, 0.1), iron, [0.4, 0.4, -1.5]); add(scene, new THREE.BoxGeometry(2.9, 0.1, 0.1), iron, [0.4, 2.0, -1.5]);
  [-1.4, 2.2].forEach((x) => add(scene, new THREE.BoxGeometry(0.25, 2.8, 0.25), mat('#8a5a38'), [x, 1.4, -1.5]));
  const lock = new THREE.Group(); lock.position.set(0.4, 1.2, -1.38); scene.add(lock);
  add(lock, new THREE.BoxGeometry(0.34, 0.28, 0.12), mat('#e8b52c', { metalness: 0.6, roughness: 0.3 }), [0, 0, 0]); add(lock, new THREE.TorusGeometry(0.1, 0.03, 8, 20, Math.PI), mat('#c8ccd2', { metalness: 0.8 }), [0, 0.15, 0]);
  add(lock, new THREE.TorusGeometry(0.12, 0.03, 8, 16), mat('#c8ccd2', { metalness: 0.8 }), [-0.3, 0, 0], [0, Math.PI / 2, 0]);
  const plq = add(scene, new THREE.PlaneGeometry(0.9, 0.5), new THREE.MeshBasicMaterial({ map: sign('27', 0.9, 0.5, '#1b3f9a', '#ffffff', 'bold 330px Arial') }), [1.8, 2.6, -1.35]);
  const cl = add(scene, new THREE.PlaneGeometry(1.2, 0.4), new THREE.MeshBasicMaterial({ map: sign('CLOSED', 1.2, 0.4, '#d8262e', '#ffffff', 'bold 220px Arial') }), [0.55, 2.6, -1.35]);
  const an = anvil(); an.position.set(-2.4, 0, -0.9); an.scale.setScalar(1.4); an.rotation.y = 0.4; scene.add(an);
  const f = franklin(); f.scale.setScalar(1.45); f.position.set(2.5, 0, 0.5); f.rotation.y = -0.4; scene.add(f);
  const k = kite(); k.scale.setScalar(1.6); k.position.set(2.6, 4.1, -0.6); k.rotation.set(0.1, -0.2, -0.35); scene.add(k);
  const line = new THREE.CatmullRomCurve3([new THREE.Vector3(2.4, 2.0, 0.6), new THREE.Vector3(2.5, 2.7, 0.2), new THREE.Vector3(2.6, 3.1, -0.4)]);
  add(scene, new THREE.TubeGeometry(line, 20, 0.012, 6), mat('#6a4a2a'));
  const ky = key(); ky.position.set(2.55, 2.9, 0.0); ky.scale.setScalar(1.3); scene.add(ky);

  th.userData.pose({ lean: 0.05, headTilt: 0.05, arms: { r: [0, 0.3, 0] }, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  th.updateMatrixWorld(true); const t = th.worldToLocal(new THREE.Vector3(0.0, 1.8, -1.2)); th.userData.reach('l', [t.x, t.y, t.z]);

});
