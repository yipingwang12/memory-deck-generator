<!doctype html>
<html><head><meta charset="utf-8"><title>Editas q06 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — "EDIT-401 erases three blood fats from the PENCIL's page: LDL-C, Lp(a) and ApoB."
import * as THREE from 'three';
import { guard, canvasTexture, rng } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createPencil } from './pencil.js';

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...extra });
const shadowed = (m) => { m.castShadow = m.receiveShadow = true; return m; };

/** Canvas text plane (transparent bg). */
function label(text, w, h, { color = '#2a2230', font = 'bold 150px Arial Black, Arial, sans-serif', px = 512 } = {}) {
  const tex = canvasTexture(px, (ctx, s) => {
    ctx.clearRect(0, 0, s, s); ctx.fillStyle = color; ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let f = 150; while (ctx.measureText(text).width > s * 0.94 && f > 20) { f -= 6; ctx.font = font.replace('150px', f + 'px'); }
    ctx.fillText(text, s / 2, s / 2);
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  m.material.toneMapped = false; return m;
}

/** Standing teardrop of grease. */
function drop(r, h, color = '#ffe23a') {
  const pts = [];
  for (let i = 0; i <= 28; i++) {
    const t = i / 28, a = t * Math.PI;                       // base to tip
    const rad = r * Math.sin(a) * Math.pow(1 - t, 0.55) * 1.35;
    pts.push(new THREE.Vector2(Math.max(rad, 0.0001), h * (1 - Math.cos(a)) / 2 * (0.55 + 0.45 * t)));
  }
  return shadowed(new THREE.Mesh(new THREE.LatheGeometry(pts, 40), mat(color, { roughness: 0.25 })));
}

guard(() => {
  const P = new URLSearchParams(location.search);
  const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: 48, sunAzimuth: num('az', 150), shadowSize: 4,
    sky: { cover: 0.3, seed: 3 }, sunIntensity: 2.4, ambient: { color: '#fff0e0', intensity: 2.2 },
    rim: { color: '#fff3dc', strength: 1.2, width: 0.55 }, ink: { width: 1.3, strength: 0.85, fadeFar: 60 },
  });
  const scene = stage.scene;

  const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshBasicMaterial({ color: '#9fd3d6' })); wall.position.set(0, 6, -4.4); scene.add(wall);
  // Desk + paper
  const desk = shadowed(new THREE.Mesh(new THREE.BoxGeometry(14, 0.4, 9), mat('#6b4330')));
  desk.position.y = -0.2; scene.add(desk);
  const paperTex = canvasTexture(512, (c, s) => { c.fillStyle = '#fffaf0'; c.fillRect(0, 0, s, s); c.strokeStyle = '#cfdcf0'; c.lineWidth = 3;
    for (let y = 40; y < s; y += 48) { c.beginPath(); c.moveTo(0, y); c.lineTo(s, y); c.stroke(); } });
  const paper = shadowed(new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.03, 2.6), new THREE.MeshStandardMaterial({ map: paperTex, roughness: 0.9 })));
  paper.position.set(0, 0.015, 0.1); paper.rotation.y = 0.0; scene.add(paper);
  const top = 0.03;

  const X = [-1.35, 0, 1.35], BZ = 0.15;
  // LDL-C: already erased -> faint smudge
  const smudge = new THREE.Mesh(new THREE.CircleGeometry(0.34, 32), new THREE.MeshBasicMaterial({ color: '#f1e3a0', transparent: true, opacity: 0.7 }));
  smudge.rotation.x = -Math.PI / 2; smudge.scale.set(1, 0.8, 1); smudge.position.set(X[0], top + 0.002, BZ); scene.add(smudge);
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.05), new THREE.MeshBasicMaterial({ color: '#e8d9b0', transparent: true, opacity: 0.45 }));
    s.rotation.set(-Math.PI / 2, 0, -0.5 + i * 0.1); s.position.set(X[0] + (i - 1.5) * 0.06, top + 0.003, BZ + (i - 1.5) * 0.07); scene.add(s);
  }
  // Lp(a): half erased -> short stump of drop + smear toward the eraser
  const half = drop(0.34, 0.55); half.scale.set(1, 0.55, 1); half.position.set(X[1] + 0.15, top, BZ + 0.2); scene.add(half);
  const smear = new THREE.Mesh(new THREE.CircleGeometry(0.3, 32), new THREE.MeshBasicMaterial({ color: '#f0dc86', transparent: true, opacity: 0.55 }));
  smear.rotation.x = -Math.PI / 2; smear.scale.set(1.1, 0.7, 1); smear.position.set(X[1] - 0.25, top + 0.002, BZ + 0.2); scene.add(smear);
  // ApoB: intact
  const intact = drop(0.34, 0.75); intact.position.set(X[2], top, BZ); scene.add(intact);
  // highlight blobs
  for (const [d, k] of [[intact, 1], [half, 0.5]]) {
    const sh = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), new THREE.MeshBasicMaterial({ color: '#fffbe0' }));
    sh.scale.set(0.8, 1.6, 0.6); sh.position.copy(d.position).add(new THREE.Vector3(-0.15, 0.2 * k, 0.28)); scene.add(sh);
  }

  // Labels on the paper
  [['LDL-C', 0], ['Lp(a)', 1], ['ApoB', 2]].forEach(([t, i]) => {
    const l = label(t, 1.15, 1.15); l.rotation.x = -Math.PI / 2; l.position.set(X[i], top + 0.004, BZ + 0.78); scene.add(l);
  });

  // Eraser crumbs
  const rnd = rng(6);
  for (let i = 0; i < 16; i++) {
    const cr = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.025, 0.03), mat('#f4909c', { roughness: 0.9 })));
    const a = rnd() * Math.PI * 2, d = 0.15 + rnd() * 0.5;
    cr.position.set(X[1] - 0.3 + Math.cos(a) * d * 1.2, top + 0.014, BZ + 0.2 + Math.sin(a) * d * 0.6); cr.rotation.y = rnd() * 3; scene.add(cr);
  }
  for (let i = 0; i < 5; i++) {
    const cr = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.022, 0.03), mat('#f4909c', { roughness: 0.9 })));
    cr.position.set(X[0] + (rnd() - 0.5) * 0.7, top + 0.012, BZ + (rnd() - 0.5) * 0.4); cr.rotation.y = rnd() * 3; scene.add(cr);
  }

  // Upside-down pencil, eraser pressed on the Lp(a) smear
  const S = num('ps', 1.7);
  const pencil = createPencil({ scale: S });
  const TH = Math.PI + num('lean', 0.42);            // flipped (eraser down, face toward camera), leaning left
  pencil.rotation.z = TH;
  const contact = new THREE.Vector3(X[1] - 0.3, top + 0.03, BZ + 0.2);
  const off = new THREE.Vector3(0, 1.0 * S, 0).applyEuler(new THREE.Euler(0, 0, TH));
  pencil.position.copy(contact).sub(off);
  pencil.userData.pose({ arms: { l: [0, 0.6, 0.5], r: [0, 0.6, 0.5] }, legs: { l: [0, 0.15], r: [0, 0.15] } });
  const tag = label('EDIT-401', 0.2, 0.2, { color: '#1c3f8a' });
  tag.scale.setScalar(1); tag.rotation.z = Math.PI; tag.position.set(0, 0.55, 0.14 * Math.cos(Math.PI / 6) + 0.004);
  const tagBg = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.07), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
  tagBg.rotation.z = Math.PI; tagBg.position.set(0, 0.55, 0.14 * Math.cos(Math.PI / 6) + 0.002);
  tag.geometry = new THREE.PlaneGeometry(0.2, 0.2); tag.position.y = 0.55;
  pencil.add(tagBg, tag);
  scene.add(pencil);
  const pm = new Set(); pencil.traverse((o) => pm.add(o));
  stage.toonify(scene, (m) => pm.has(m));

  stage.camera.position.set(num('cx', 0), num('cy', 2.9), num('cz', 3.3));
  stage.camera.lookAt(num('tx', 0), num('ty', 0.6), num('tz', 0.0));
  stage.finish();
});
</script></body></html>
