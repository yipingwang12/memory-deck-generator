<!doctype html>
<html><head><meta charset="utf-8"><title>Editas q07 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — "The PENCIL drops RENI-CEL when nobody will buy it: no commercial partner."
import { guard, canvasTexture } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createPencil } from './pencil.js';

guard(() => {
  const P = new URLSearchParams(location.search);
  const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 38), sunElevation: num('el', 9), sunAzimuth: num('az', 150), exposure: num('exp', 1),
    sky: { zenith: '#6a4a9a', horizon: '#ffb070', cover: 0.05, puffCover: 0.05, towerTop: 0.02, cloudLit: '#ffd0a0', cloudShade: '#c88aa8' },
    sunColor: '#ffb070', sunIntensity: num('sun', 2.4), ambient: { color: '#ffd8c0', intensity: num('amb', 1.8) },
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 },
  });
  const THREE = stage.THREE, scene = stage.scene;
  const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...o });
  const add = (geo, mat, x, y, z, parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
  const box = (w, h, d, c, x, y, z, p) => add(new THREE.BoxGeometry(w, h, d), M(c), x, y, z, p);
  const cyl = (rt, rb, h, c, x, y, z, p, seg = 24) => add(new THREE.CylinderGeometry(rt, rb, h, seg), M(c), x, y, z, p);

  // cobbled street + far buildings (empty street)
  const road = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M('#b98a68'));
  road.rotation.x = -Math.PI / 2; road.receiveShadow = true; scene.add(road);
  for (let i = -6; i <= 6; i++) box(1.6, 2 + (i * 7 % 3 + 3) % 3, 1.5, ['#c98a6a', '#b6728a', '#d9a36e'][(i + 6) % 3], i * 1.9, 1.6, -9);
  for (const x of [-4, 4.2]) { cyl(0.04, 0.05, 2.2, '#4a3a4a', x, 1.1, -3.5); add(new THREE.SphereGeometry(0.14, 16, 12), M('#ffd890', { emissive: '#ffb050', emissiveIntensity: 1.2 }), x, 2.3, -3.5); }

  // market stall (left/back)
  const sx = -1.1, sz = -1.5;
  box(2.6, 0.7, 0.8, '#b0703c', sx, 0.35, sz);
  box(2.8, 0.06, 0.95, '#e0b070', sx, 0.73, sz);
  for (const dx of [-1.3, 1.3]) cyl(0.04, 0.04, 1.9, '#7a4a28', sx + dx, 0.95, sz - 0.35);
  const stripe = canvasTexture(256, (g, s) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#fff0d8' : '#e8483c'; g.fillRect(i * s / 8, 0, s / 8, s); } });
  const awn = add(new THREE.BoxGeometry(3.0, 0.07, 1.3), new THREE.MeshStandardMaterial({ map: stripe, roughness: 0.8 }), sx, 1.95, sz - 0.1); awn.rotation.x = 0.1;
  // price sign hanging on the counter front
  const sign = canvasTexture(256, (g, s) => { g.fillStyle = '#fff4d8'; g.fillRect(0, 0, s, s); g.strokeStyle = '#7a3a1c'; g.lineWidth = 14; g.strokeRect(7, 7, s - 14, s - 14); g.fillStyle = '#c0281c'; g.font = 'bold 74px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('PRICE', s / 2, s * 0.38); g.font = 'bold 80px sans-serif'; g.fillText('$$$', s / 2, s * 0.72); });
  add(new THREE.BoxGeometry(0.62, 0.42, 0.04), new THREE.MeshStandardMaterial({ map: sign }), sx - 0.2, 0.42, sz + 0.43);
  for (const dx of [-0.5, 0.1]) cyl(0.012, 0.012, 0.3, '#4a3a2a', sx + dx, 0.58, sz + 0.43);
  // empty stools in front of counter
  for (const dx of [-1.9, -1.1, -0.1]) { cyl(0.2, 0.2, 0.06, '#d86a3a', sx + dx, 0.48, -0.55); for (const a of [0, 2.1, 4.2]) cyl(0.02, 0.02, 0.46, '#5a3a2a', sx + dx + Math.cos(a) * 0.13, 0.23, -0.55 + Math.sin(a) * 0.13, scene, 8); }
  // dust-bin right
  const bin = cyl(0.3, 0.24, 0.62, '#4f8a8a', 0.55, 0.31, 0.3); 
  cyl(0.33, 0.33, 0.05, '#3a6a6a', 0.55, 0.64, 0.3);
  add(new THREE.CylinderGeometry(0.24, 0.24, 0.02, 24), M('#1a1a22'), 0.55, 0.665, 0.3);

  // pencil
  const pencil = createPencil({ scale: 1 }); pencil.position.set(-0.3, 0, 0.3);
  pencil.userData.pose({ lean: 0.08, headTilt: -0.1 });
  pencil.userData.reach('l', [0.28, 0.8, 0.22]);
  scene.add(pencil);
  const pset = new Set(); pencil.traverse((o) => pset.add(o));

  // falling vial
  const vial = new THREE.Group();
  const glass = M('#ff4040', { transparent: true, opacity: 0.55, roughness: 0.1 });
  add(new THREE.CylinderGeometry(0.07, 0.07, 0.22, 20), glass, 0, 0, 0, vial);
  add(new THREE.CylinderGeometry(0.058, 0.058, 0.17, 20), M('#ff1a1a', { emissive: '#ff2010', emissiveIntensity: 1.6 }), 0, -0.02, 0, vial);
  add(new THREE.CylinderGeometry(0.035, 0.05, 0.05, 16), M('#303038'), 0, 0.135, 0, vial);
  const lab = canvasTexture(256, (g, s) => { g.fillStyle = '#fffaf0'; g.fillRect(0, 0, s, s); g.fillStyle = '#b01010'; g.font = 'bold 56px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('RENI-', s / 2, s * 0.33); g.fillText('CEL', s / 2, s * 0.68); });
  add(new THREE.PlaneGeometry(0.115, 0.115), new THREE.MeshStandardMaterial({ map: lab, roughness: 0.6 }), 0, -0.02, 0.0735, vial);
  const glow = new THREE.PointLight('#ff3020', 0.6, 1.5); vial.add(glow);
  vial.scale.setScalar(num('vs', 1.7));
  vial.position.set(num('vx', 0.25), num('vy', 0.82), num('vz', 0.55)); vial.rotation.set(0.1, 0, num('vr', 0.55));
  scene.add(vial);
  // motion streaks above vial
  for (const dx of [-0.04, 0.02, 0.07]) add(new THREE.BoxGeometry(0.012, 0.22, 0.01), M('#ffe0d0', { emissive: '#ffd0c0', emissiveIntensity: 0.8 }), vial.position.x + dx + 0.12, vial.position.y + 0.3, vial.position.z - 0.05);

  stage.toonify(scene, (m) => pset.has(m));
  stage.camera.position.set(num('cx', 0.2), num('cy', 0.85), num('cz', 3.0));
  stage.camera.lookAt(num('tx', 0.1), num('ty', 0.55), 0);
  stage.finish();
});
</script></body></html>
