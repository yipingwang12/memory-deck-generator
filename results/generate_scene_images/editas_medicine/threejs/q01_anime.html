<!doctype html>
<html><head><meta charset="utf-8"><title>Editas q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — "The PENCIL is first sharpened on the BROADSWORD."
import * as THREE from 'three';
import { guard, rng } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createPencil } from './pencil.js';

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.45, ...o });
const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; return o; };

/** Broadsword lying flat along +x (guard at x=0, point at x=L); returns group + blade top height. */
function broadsword(L = 3.1, W = 0.36, T = 0.05) {
  const g = new THREE.Group(), steel = std('#cfd8e3', { metalness: 0.55, roughness: 0.3 }), gold = std('#f2c441', { metalness: 0.6, roughness: 0.35 });
  const s = new THREE.Shape(), h = W / 2;
  s.moveTo(0, -h); s.lineTo(L * 0.72, -h); s.lineTo(L, 0); s.lineTo(L * 0.72, h); s.lineTo(0, h); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: T, bevelEnabled: true, bevelSize: 0.025, bevelThickness: 0.02, bevelSegments: 2 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, 0.02, 0);
  g.add(mesh(geo, steel));
  g.add(mesh(new THREE.BoxGeometry(L * 0.8, 0.012, 0.05), std('#8fa0b6', { metalness: 0.5 }), L * 0.4, T + 0.045, 0)); // fuller
  g.add(mesh(new THREE.BoxGeometry(0.14, 0.12, 1.15), gold, -0.07, 0.07, 0)); // crossguard
  for (const s2 of [-1, 1]) g.add(mesh(new THREE.SphereGeometry(0.09, 16, 12), gold, -0.07, 0.07, s2 * 0.58));
  const grip = mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 16), std('#5b2f1c', { roughness: 0.8 }), -0.5, 0.07, 0); grip.rotation.z = Math.PI / 2; g.add(grip);
  for (let i = 0; i < 7; i++) { const r = mesh(new THREE.TorusGeometry(0.063, 0.014, 8, 20), std('#caa45a'), -0.2 - i * 0.1, 0.07, 0); r.rotation.y = Math.PI / 2; g.add(r); }
  g.add(mesh(new THREE.SphereGeometry(0.13, 20, 16), gold, -0.93, 0.07, 0));
  return { group: g, top: T + 0.04 };
}

/** Curled wood shaving: a short open torus arc. */
function shaving(rand, color) {
  const arc = mesh(new THREE.TorusGeometry(0.035, 0.008, 6, 14, Math.PI * (1.2 + rand() * 0.6)), std(color, { roughness: 0.7 }));
  arc.scale.set(1, 1, 3); arc.rotation.set(rand() * 6, rand() * 6, rand() * 6); return arc;
}

guard(() => {
  const P = new URLSearchParams(location.search);
  const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: num('el', 14), sunAzimuth: num('az', 150), exposure: num('exp', 1),
    sky: { cover: 1.2, seed: 5, towerTop: 0.5, puffCover: 1.2, zenith: '#2a62c8', horizon: '#ffd9a8' },
    rim: { color: '#ffe2b0', strength: 1.5, width: 0.55 },
    sunColor: '#ffc880', sunIntensity: num('sun', 2.8), ambient: { color: '#ffe6d0', intensity: 2.0 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.9, fog: { near: 40, far: 400 },
  });
  const scene = stage.scene, rand = rng(7);

  const ground = mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2), std('#8aa84a', { roughness: 0.95 }));
  scene.add(ground);
  // Sword: hilt end propped on a stone, point sloping down to the grass.
  const { group: sword, top } = broadsword();
  const slope = num('slope', 0.1);
  sword.position.set(-1.2, 0.3, 0); sword.rotation.z = -slope;
  scene.add(sword);
  const stone = mesh(new THREE.IcosahedronGeometry(0.42, 1), std('#8d8a86', { roughness: 0.9 }), -1.45, 0.05, 0.05);
  stone.scale.set(1.3, 0.75, 1.1); scene.add(stone);
  const stone2 = mesh(new THREE.IcosahedronGeometry(0.3, 1), std('#9a968f', { roughness: 0.9 }), 2.2, 0.0, -0.9); stone2.scale.set(1.2, 0.7, 1); scene.add(stone2);

  // Pencil stands on the blade, tip scraping it, leaning in.
  const px = num('px', 0.5);
  const surfY = 0.3 + (px + 1.2) * -Math.tan(slope) + top;
  const pencil = createPencil({ scale: num('ps', 1.9) });
  pencil.position.set(px - 1.2 + 1.2, surfY, 0.0); pencil.rotation.y = num('ry', 0.25);
  pencil.userData.pose({ lean: 0.18, headTilt: 0.12, arms: { l: [0.2, 0.9, 0.6], r: [-0.4, 0.3, 0.9] }, legs: { l: [0.35, 0.1], r: [-0.3, -0.1] } });
  scene.add(pencil);
  pencil.updateMatrixWorld(true);
  const tipW = new THREE.Vector3(); pencil.userData.parts.tip.getWorldPosition(tipW);

  // Graphite scrape marks on the blade + falling shavings.
  for (let i = 0; i < 3; i++) { const m = mesh(new THREE.BoxGeometry(0.22, 0.004, 0.012), std('#2b2b30'), tipW.x - 0.12 - i * 0.1, surfY + 0.004, tipW.z + 0.06 - i * 0.05); scene.add(m); }
  for (let i = 0; i < 12; i++) {
    const sh = shaving(rand, i % 3 ? '#efc58a' : '#f7c820');
    const t = i / 12;
    sh.position.set(tipW.x + 0.25 + t * 0.7 + rand() * 0.15, surfY + 0.04 + (1 - t) * 0.45 + rand() * 0.2, tipW.z + 0.3 + rand() * 0.4);
    sh.scale.multiplyScalar(1.6); scene.add(sh);
  }

  const chars = new Set(); pencil.traverse((o) => chars.add(o));
  stage.toonify(scene, (m) => chars.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [185, 1200, 160, 1.8], [215, 1000, 80, 1.2], [250, 1100, 150, 1.6], [120, 1000, 100, 1.1]]);

  stage.camera.position.set(num('cx', 0.5), num('cy', 1.7), num('cz', 3.9));
  stage.camera.lookAt(num('tx', 0.2), num('ty', 0.95), num('tz', 0));
  stage.finish();
});
</script></body></html>
