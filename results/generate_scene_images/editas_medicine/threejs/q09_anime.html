<!doctype html>
<html><head><meta charset="utf-8"><title>Editas q09 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q09 — "The PENCIL's ticker reads EDIT."
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createPencil } from './pencil.js';

guard(() => {
  const P = new URLSearchParams(location.search);
  const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: 35, sunAzimuth: 200, exposure: num('exp', 1),
    sky: { cover: 0, seed: 3, towerTop: 0.5, puffCover: 0 },
    rim: { color: '#fff3dc', strength: 1.2, width: 0.55 },
    sunIntensity: 2.2, ambient: { color: '#e8e2ff', intensity: 2.0 }, triBumpScale: 0.2,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 },
    flare: 0, fog: { near: 120, far: 1500 },
  });
  const S = stage.scene, std = (c, e = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, ...e });
  const add = (g, m, x, y, z) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; S.add(o); return o; };

  // floor + back wall
  add(new THREE.BoxGeometry(12, 0.1, 8), std('#c9a27a'), 0, -0.05, 0);
  add(new THREE.BoxGeometry(12, 5, 0.1), std('#3b4a78'), 0, 2.5, -1.3);

  // ticker board
  const BX = 0.7, BY = 1.35, BW = 2.5, BH = 1.1, BZ = -0.9;
  add(new THREE.BoxGeometry(BW + 0.16, BH + 0.16, 0.14), std('#8a8f99', { metalness: 0.6, roughness: 0.35 }), BX, BY, BZ - 0.04);
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 448;
  const g = cv.getContext('2d');
  g.fillStyle = '#0b0d12'; g.fillRect(0, 0, 1024, 448);
  const glyph = {
    E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'],
    D: ['11110', '10001', '10001', '10001', '10001', '10001', '11110'],
    I: ['11111', '00100', '00100', '00100', '00100', '00100', '11111'],
    T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'],
  };
  const pitch = 31, dot = 11.5, ox = 20, oy = 85;
  const lit = (cx, cy, col) => { g.shadowColor = col; g.shadowBlur = 16; g.fillStyle = col; g.beginPath(); g.arc(cx, cy, dot, 0, 7); g.fill(); g.shadowBlur = 0; };
  // dim unlit grid
  for (let y = 0; y < 18; y++) for (let x = 0; x < 42; x++) { g.fillStyle = '#1a1d26'; g.beginPath(); g.arc(30 + x * 22.7, 24 + y * 22.7, 3.5, 0, 7); g.fill(); }
  let x0 = 0;
  [...'EDIT'].forEach((ch, i) => {
    glyph[ch].forEach((row, r) => [...row].forEach((v, c) => { if (v === '1') lit(ox + (i * 6 + c) * pitch + 20, oy + r * pitch * 1.15 + 20, '#ffb520'); }));
  });
  // up arrow (green)
  const arrow = ['00100', '01110', '11111', '00100', '00100', '00100', '00100'];
  arrow.forEach((row, r) => [...row].forEach((v, c) => { if (v === '1') lit(ox + (25 + c) * pitch + 20, oy + r * pitch * 1.15 + 20, '#39e26a'); }));
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  add(new THREE.PlaneGeometry(BW, BH), new THREE.MeshBasicMaterial({ map: tex }), BX, BY, BZ + 0.04);
  // legs / stand
  for (const sx of [-1, 1]) add(new THREE.CylinderGeometry(0.05, 0.06, 0.8, 16), std('#555b66', { metalness: 0.6 }), BX + sx * 0.9, 0.4 - 0.05, BZ - 0.05);

  // pencil, proudly pointing up at the board
  const pencil = createPencil({ scale: num('ps', 1.75) });
  pencil.position.set(num('px', -1.3), 0, num('pz', 0.35)); pencil.rotation.y = 0.35;
  pencil.userData.pose({ lean: -0.08, headTilt: 0.08, arms: { r: [0, 0.35, 0.1] } });
  S.add(pencil);
  pencil.updateMatrixWorld(true);
  // l arm reaches up and toward board (pencil-local target)
  pencil.userData.reach('l', [0.42, 0.95, 0.12]);
  S.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });

  const pset = new Set(); pencil.traverse((o) => pset.add(o));
  stage.toonify(S, (m) => pset.has(m));
  stage.camera.position.set(num('cx', 0.25), num('cy', 1.15), num('cz', 3.6));
  stage.camera.lookAt(num('tx', 0.15), num('ty', 1.1), 0);
  stage.finish();
});
</script></body></html>
