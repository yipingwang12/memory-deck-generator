<!doctype html>
<html><head><meta charset="utf-8"><title>Editas q04 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q04 — PENCIL edits inside the body marrow; chemo drip is OFF (red no-ring). Realistic-anime style.
import { guard, rng } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createPencil } from './pencil.js';

guard(() => {
  const P = new URLSearchParams(location.search);
  const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 40), sunElevation: num('el', 35), sunAzimuth: num('az', 200), exposure: num('exp', 1),
    sky: { zenith: '#f3b0b0', horizon: '#f8c8c0', cover: 0.02, puffCover: 0.02, towerTop: 0.02 },
    rim: { color: '#fff3dc', strength: 1.2, width: 0.55 },
    sunIntensity: num('sun', 2.4), ambient: { color: '#ffe6e0', intensity: num('amb', 2.3) },
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 },
    flare: 0, shadowSize: 8,
  });
  const THREE = stage.THREE, scene = stage.scene, R = rng(7);
  const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...o });
  const add = (g, m, x, y, z, parent = scene) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o; };

  // --- tissue tunnel: pink walls around the view axis + back wall
  const tunnel = add(new THREE.CylinderGeometry(9, 9, 30, 48, 1, true), M('#f2a1a6', { side: THREE.BackSide }), 0, 1.5, 0);
  tunnel.rotation.x = Math.PI / 2;
  add(new THREE.PlaneGeometry(40, 30), M('#e98a94'), 0, 1.5, -6);
  for (let i = 0; i < 26; i++) { // lumpy tissue cells on the walls
    const a = R() * Math.PI * 2, r = 8.4, s = 0.6 + R() * 1.1, z = -5 + R() * 8;
    const b = add(new THREE.SphereGeometry(s, 24, 16), M(i % 3 ? '#f7b4b6' : '#ea8f9a'), Math.cos(a) * r, 1.5 + Math.sin(a) * r, z);
    b.scale.z = 0.8;
  }
  for (let i = 0; i < 6; i++) { // blood-vessel arcs on back wall
    const x = -9 + i * 1.4 + R(), pts = [new THREE.Vector3(x, -6, -5.8), new THREE.Vector3(x + R() * 2 - 1, 0, -5.8), new THREE.Vector3(x + R() * 2 - 1, 8, -5.8)];
    add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, 0.07, 8), M('#c9455a'), 0, 0, 0);
  }

  // --- bone cross-section (wall facing camera)
  const BX = 2.6, BY = 0.9, BR = 2.7, bone = new THREE.Group(); bone.position.set(BX, BY, 0); scene.add(bone);
  const cyl = (r, h, m) => { const o = add(new THREE.CylinderGeometry(r, r, h, 64), m, 0, 0, 0, bone); o.rotation.x = Math.PI / 2; return o; };
  cyl(BR, 0.7, M('#f2e4c4'));                                   // cortical bone
  const inner = cyl(BR * 0.78, 0.8, M('#d83a48', { roughness: 0.5 })); // red marrow, proud of the face
  const rimT = add(new THREE.TorusGeometry(BR * 0.78, 0.07, 12, 64), M('#e8d4a8'), 0, 0, 0.4, bone);
  for (let i = 0; i < 70; i++) { // trabeculae + marrow cells
    const a = R() * Math.PI * 2, d = Math.sqrt(R()) * BR * 0.72, x = Math.cos(a) * d, y = Math.sin(a) * d;
    if (i % 4 === 0) { const t = add(new THREE.CapsuleGeometry(0.05, 0.25 + R() * 0.3, 4, 8), M('#f2e4c4'), x, y, 0.42, bone); t.rotation.z = R() * 3; }
    else { const s = 0.09 + R() * 0.12; add(new THREE.SphereGeometry(s, 16, 12), M(i % 3 ? '#ff6b6b' : '#b3243a'), x, y, 0.42 + R() * 0.05, bone).scale.z = 0.45; }
  }

  // --- pencil flying tilted, tip down onto the marrow
  const pencil = createPencil({ scale: num('ps', 3.4) });
  pencil.userData.pose({ arms: { l: [0, 0.9, 0.2], r: [0, 0.9, 0.2] }, legs: { l: [0.2, 0.2], r: [-0.1, -0.2] } });
  pencil.rotation.z = num('rz', 0.95);
  scene.add(pencil); pencil.updateMatrixWorld(true);
  const tipW = new THREE.Vector3(); pencil.userData.parts.tip.getWorldPosition(tipW);
  const target = new THREE.Vector3(num('tx', 1.6), num('ty', 1.0), 0.5);
  pencil.position.add(target.clone().sub(tipW).setZ(0)); pencil.position.z = target.z - tipW.z;

  // --- edit marks: bright teal squiggle written on the marrow, with base-pair ticks
  const edit = new THREE.Group(); scene.add(edit);
  const pts = []; for (let i = 0; i <= 24; i++) pts.push(new THREE.Vector3(target.x + 0.15 + i * 0.1, target.y - 0.18 + Math.sin(i * 0.9) * 0.2 - i * 0.012, 0.58));
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, 0.035, 8), M('#2fe0c0', { emissive: '#1fa08c', emissiveIntensity: 0.6 }), 0, 0, 0, edit);
  for (let i = 1; i < 24; i += 2) { const p = pts[i], q = pts[i + 0 > 23 ? 23 : i + 1]; add(new THREE.CylinderGeometry(0.018, 0.018, 0.2, 6), M(i % 4 === 1 ? '#ffd23c' : '#fff'), p.x, p.y - 0.0, 0.57, edit).rotation.z = Math.PI / 2 * 0 + 0.3; }

  // --- chemo drip: cold, capped, switched OFF, with red no-ring
  const drip = new THREE.Group(); drip.position.set(-4.4, 0, 0.3); scene.add(drip);
  add(new THREE.CylinderGeometry(0.05, 0.05, 4.2, 12), M('#9aa4b4', { metalness: 0.5 }), 0, 0.9, 0, drip);
  add(new THREE.CylinderGeometry(0.5, 0.6, 0.12, 24), M('#7e8898', { metalness: 0.5 }), 0, -1.2, 0, drip);
  add(new THREE.BoxGeometry(1.1, 0.05, 0.05), M('#9aa4b4', { metalness: 0.5 }), 0, 2.95, 0, drip);
  const bag = new THREE.Group(); bag.position.set(0, 1.75, 0.1); drip.add(bag);
  const bagBody = add(new THREE.SphereGeometry(0.62, 32, 24), M('#8fb4d8', { roughness: 0.3 }), 0, 0, 0, bag); bagBody.scale.set(0.8, 1.15, 0.38);
  const fluid = add(new THREE.SphereGeometry(0.55, 32, 24), M('#4f78a8', { roughness: 0.3 }), 0, -0.12, 0.02, bag); fluid.scale.set(0.72, 0.95, 0.38);
  add(new THREE.CylinderGeometry(0.1, 0.12, 0.18, 16), M('#3a4a62'), 0, -0.85, 0, bag);     // port cap
  add(new THREE.CylinderGeometry(0.1, 0.1, 0.12, 16), M('#cfd6e0'), 0, 0.82, 0, bag);       // hanging hole cap
  add(new THREE.TorusGeometry(0.14, 0.015, 8, 20), M('#9aa4b4'), 0, 1.0, 0, bag);
  add(new THREE.CylinderGeometry(0.07, 0.07, 0.4, 12), M('#dfe9f4', { transparent: true, opacity: 0.8 }), 0, -1.12, 0, bag); // drip chamber, dry
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0, -1.3, 0), new THREE.Vector3(0.1, -2, 0.1), new THREE.Vector3(0.5, -2.5, 0.3), new THREE.Vector3(0.9, -2.7, 0.35)]), 30, 0.03, 8), M('#dfe9f4'), 0, 0, 0, bag);
  // frost sparkles = cold
  for (let i = 0; i < 7; i++) add(new THREE.OctahedronGeometry(0.06), M('#e6f6ff', { emissive: '#bfe6ff', emissiveIntensity: 0.5 }), -0.55 + R() * 1.1, -0.6 + R() * 1.6, 0.3, bag);
  const noRing = new THREE.Group(); noRing.position.set(0, 1.7, 0.7); drip.add(noRing);
  const red = M('#e0202c', { emissive: '#901018', emissiveIntensity: 0.3 });
  add(new THREE.TorusGeometry(1.45, 0.11, 16, 64), red, 0, 0, 0, noRing);
  const bar = add(new THREE.BoxGeometry(2.9, 0.22, 0.14), red, 0, 0, 0, noRing); bar.rotation.z = -Math.PI / 4;

  const pset = new Set(); pencil.traverse((o) => pset.add(o));
  stage.toonify(scene, (m) => pset.has(m));
  stage.camera.position.set(num('cx', -1.1), num('cy', 1.4), num('cz', 8.6));
  stage.camera.lookAt(num('lx', -1.1), num('ly', 1.2), 0);
  stage.finish();
});
</script></body></html>
