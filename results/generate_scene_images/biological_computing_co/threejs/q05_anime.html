<!doctype html>
<html><head><meta charset="utf-8"><title>BioComputing q05 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, box, cyl, textTex, setup, finish, flag, brain, penguin, heart, createCalculator } from './common.js';
import { guard } from './kit.js';
guard(() => {
// q05 — CALCULATOR writes data into LIVING NEURONS, feeds replies to AI.
const { stage, scene, num, cam } = setup(new URLSearchParams(location.search), { ground: '#e3d6f0', zenith: '#8fb6ea', horizon: '#ffe3d0' });
const calc = createCalculator({ scale: 1.8 }); calc.position.set(-2.0, 0, 0.5); calc.rotation.y = 0.5; scene.add(calc);
calc.userData.pose({ arms: { r: [0, 0.3, 0] } }); calc.updateMatrixWorld(true);
const N = new THREE.Group(); N.position.set(0.1, 0.95, 0); scene.add(N);
const glow = mat('#ff7ab8', { emissive: '#ff3d90', emissiveIntensity: 0.55, roughness: 0.4 });
const somas = [[0, 0, 0, 0.26], [0.95, 0.35, 0.1, 0.22], [-0.7, -0.45, 0.1, 0.2]];
somas.forEach(([x, y, z, r]) => blob(N, glow, [x, y, z], [r, r, r]));
const branch = (a, b, r = 0.04) => { const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A), c = add(N, new THREE.CylinderGeometry(r * 0.6, r, d.length(), 10), glow);
  c.position.copy(A.clone().add(B).multiplyScalar(0.5)); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); };
branch([0, 0, 0], [0.95, 0.35, 0.1], 0.05); branch([0, 0, 0], [-0.7, -0.45, 0.1], 0.05);
[[0, 0, 0, -0.5, 0.65], [0, 0, 0, 0.35, 0.8], [0, 0, 0, -0.2, -0.8], [0.95, 0.35, 0.1, 1.45, 0.8], [0.95, 0.35, 0.1, 1.55, 0.0], [-0.7, -0.45, 0.1, -1.1, 0.1], [-0.7, -0.45, 0.1, -1.0, -0.95]].forEach(([x, y, z, tx, ty]) => {
  branch([x, y, z], [tx, ty, z], 0.03); blob(N, glow, [tx, ty, z], [0.07, 0.07, 0.07]); branch([tx, ty, z], [tx + 0.2, ty + (ty > 0 ? 0.2 : -0.2), z], 0.015); });
// petri dish under neurons
cyl(scene, mat('#cfe8f5', { transparent: true, opacity: 0.55 }), [0.1, 0.07, 0], 1.5, 0.14); cyl(scene, mat('#ffd9ec'), [0.1, 0.09, 0], 1.38, 0.1);
// calculator writes: hand to neuron
const t = calc.worldToLocal(new THREE.Vector3(-0.9, 1.4, 0.6)); calc.userData.reach('r', [t.x, t.y, t.z]);
// data bits arrows left->neurons
for (let i = 0; i < 5; i++) { const b = box(scene, mat(i % 2 ? '#2ee0f0' : '#3ecf6a', { emissive: i % 2 ? '#1aa8c0' : '#2ba04c', emissiveIntensity: 0.6 }), [-1.3 + i * 0.16, 1.9 + (i % 2) * 0.12, 0.6], [0.09, 0.09, 0.09], [0.4, 0.4, 0]); }
// AI robot head
const R = new THREE.Group(); R.position.set(3.0, 0, 0.1); R.scale.setScalar(0.9); R.rotation.y = -0.35; scene.add(R);
box(R, mat('#9aa6b8', { metalness: 0.3, roughness: 0.4 }), [0, 0.5, 0], [0.8, 0.7, 0.2]); box(R, mat('#9aa6b8'), [0, 0.15, 0], [0.7, 0.2, 0.7]);
box(R, mat('#17242e', { roughness: 0.2 }), [0, 1.4, 0], [1.3, 0.8, 0.9]);
box(R, mat('#bfc9d8'), [0, 1.4, 0.0], [1.4, 0.88, 0.8]);
box(R, mat('#10202a', { roughness: 0.2 }), [0, 1.42, 0.41], [1.1, 0.5, 0.06]);
for (const x of [-0.28, 0.28]) { blob(R, mat('#40e6ff', { emissive: '#40e6ff', emissiveIntensity: 1.5 }), [x, 1.45, 0.45], [0.12, 0.14, 0.03]); blob(R, mat('#fff'), [x - 0.04, 1.5, 0.47], [0.03, 0.03, 0.01]); }
cyl(R, mat('#9aa6b8'), [0, 1.98, 0], 0.025, 0.2); blob(R, mat('#ff4f7a', { emissive: '#ff4f7a', emissiveIntensity: 1 }), [0, 2.12, 0], [0.07, 0.07, 0.07]);
for (const x of [-0.75, 0.75]) cyl(R, mat('#e8a02a'), [x, 1.4, 0], 0.12, 0.2, [0, 0, Math.PI / 2]);
// return cable from neurons to AI
const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(1.6, 1.0, 0.2), new THREE.Vector3(2.0, 0.55, 0.5), new THREE.Vector3(2.4, 0.9, 0.4), new THREE.Vector3(2.55, 1.3, 0.35)]);
add(scene, new THREE.TubeGeometry(curve, 30, 0.035, 8), mat('#2ee0f0', { emissive: '#1aa8c0', emissiveIntensity: 0.8 }));
cam(0.3, 1.5, 6.3, 0.3, 1.2); finish(stage, [calc]);
});
</script></body></html>
