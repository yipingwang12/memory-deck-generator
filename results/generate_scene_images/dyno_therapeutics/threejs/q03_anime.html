import { egg, dove, church, capsid, helix, kelp, brain, bean, muscleArm, rocket, waterTower, monkey, puppy, person } from './props.js';

  const rock = (x, y, z, s, m = ice) => { const o = add(sc, new THREE.IcosahedronGeometry(1, 1), m, [x, y, z], [rk() * 3, rk() * 3, 0], [s * 1.0, s * 1.1, s]); return o; };

  const cap3 = capsid(0.24, '#ffb12b'); cap3.position.set(-0.9, 0, -0.9); sc.add(cap3);

}, { ground: '#e8f4fb', dpos: [-0.5, 0, 0.7], dry: 0.2, scl: 1.6, cam: [0.2, 1.7, 5.4], look: [0.2, 1.3, 0], el: 30 });
