  const hx = helix(2.2, 0.32, 3); hx.position.set(2.3, 0, -0.5); hx.scale.setScalar(0.95); sc.add(hx);

  x.strokeStyle = '#c0392b'; x.lineWidth = 12; x.setLineDash([26, 20]); x.beginPath(); x.moveTo(110, 460); x.bezierCurveTo(240, 220, 430, 520, 560, 310); x.stroke(); x.setLineDash([]);
