</head><body><script type="module">
import { scene, THREE, mat, add, blob, box, cyl, sign, label, rng, createDinosaur, V3, reachW, strut } from './common.js';
import { egg, dove, church, capsid, helix, kelp, brain, bean, muscleArm, rocket, waterTower, monkey, puppy, person } from './props.js';

scene(({ sc, d }) => {
  const e = egg(1.5); e.position.set(0.85, 0, 0.1); sc.add(e);
  const zig = mat('#4a3a2a'), pts = [[0.0, 0.72], [0.1, 0.8], [-0.02, 0.88], [0.1, 0.97], [0.0, 1.06], [0.08, 1.14]];
  pts.forEach(([x, y], i) => { if (!i) return; const [px, py] = pts[i - 1], zz = 0.45 * Math.sqrt(Math.max(1 - ((y - 0.6) / 0.6) ** 2, 0.05)) + 0.01; box(e, zig, [(x + px) / 2, (y + py) / 2, zz], [0.03, 0.17, 0.02], [0, 0, Math.atan2(px - x, y - py)]); });
  add(sc, new THREE.TorusGeometry(0.5, 0.12, 12, 30), mat('#b98a4a'), [0.85, 0.08, 0.1], [Math.PI/2,0,0]);
  const dv = dove(1.7); dv.position.set(0.85, 1.08, 0.1); dv.rotation.y = -0.9; sc.add(dv);
  for (let i=0;i<5;i++) blob(sc, mat('#ffffff'), [0.5+ i*0.18, 1.0+ (i%2)*0.1, 0.6], [0.025,0.025,0.025]);
  for (const [x,y,z,r] of [[1.35,0.12,0.5,0.1],[0.3,0.1,0.6,0.08],[1.2,0.1,0.75,0.07]]) blob(sc, mat('#fbf4e2'), [x,y,z], [r*1.6,r,r]);
}, { dpos: [-0.9, 0, 0.3], dry: 0.55, scl: 1.45, cam: [0, 1.0, 4.6], look: [0, 0.85, 0],
  pose: (d) => d.userData.pose({ headTilt: 0.1, headYaw: 0.2, arms: { l: [0.2, 0.5, 0], r: [0, 0.4, 0] } }) });

</script></body></html>
