<!doctype html><html><head><meta charset="utf-8"><title>Dyno anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import { scene, THREE, createDinosaur } from './common.js';
scene(({ sc, d, chars }) => {
  d.visible = false;
  [[-1.3, 0], [0, 0.7], [1.3, Math.PI / 2]].forEach(([x, ry]) => {
    const g = createDinosaur({ scale: 1.5 }); g.position.set(x, 0, 0); g.rotation.y = ry; sc.add(g);
    g.userData.pose({ arms: { l: [0.2, 0.3, 0], r: [0, 0.3, 0] } });
    chars.push(g);
  });
}, { cam: [0, 1.0, 5.2], look: [0, 0.7, 0], fov: 38 });
</script></body></html>
