<html><head><meta charset="utf-8"><title>J&J q12 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q12 — A CAVALRY rider takes charge of the JACKS' Innovative Medicine.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, blob, cyl, rng, makeStage, placeJack, finishScene, textPlane, createJacks } from './common.js';
guard(() => {

  const stage = makeStage({ ground: '#8fc05a' }); const sc = stage.scene;
  const horse = new THREE.Group(); horse.position.set(0, 0, 0); sc.add(horse);
  const coat = mat('#8a4a24'), dark = mat('#2b1a12'), pale = mat('#f1e6d4');
  blob(horse, coat, [0, 1.15, 0], [1.05, 0.5, 0.45]); blob(horse, coat, [0.85, 1.3, 0], [0.5, 0.52, 0.4]); blob(horse, coat, [-0.85, 1.2, 0], [0.5, 0.5, 0.42]);
  add(horse, new THREE.CylinderGeometry(0.2, 0.32, 0.9, 20), coat, [1.2, 1.7, 0], [0, 0, -0.7]);
  const head = new THREE.Group(); head.position.set(1.6, 2.05, 0); head.rotation.z = -0.8; horse.add(head);
  blob(head, coat, [0, 0, 0], [0.45, 0.22, 0.2]); blob(head, pale, [0.38, -0.02, 0], [0.22, 0.17, 0.17]); blob(head, dark, [0.6, 0, 0], [0.05, 0.08, 0.1]);
  for (const s of [-1, 1]) { blob(head, mat('#111'), [0.1, 0.09, s * 0.19], [0.05, 0.06, 0.03]); blob(head, mat('#fff'), [0.12, 0.11, s * 0.21], [0.015, 0.015, 0.012]); add(head, new THREE.ConeGeometry(0.07, 0.3, 12), coat, [-0.18, 0.28, s * 0.1]); }
  for (let i = 0; i < 6; i++) blob(horse, dark, [1.1 - i * 0.06 + 0.0, 2.1 - i * 0.14, 0], [0.09, 0.16, 0.06], [0, 0, -0.7]);
  for (const [x, z] of [[1.0, 0.25], [1.0, -0.25], [-0.95, 0.25], [-0.95, -0.25]]) { add(horse, new THREE.CylinderGeometry(0.1, 0.07, 1.0, 14), coat, [x, 0.55, z]); cyl(horse, mat('#f1e6d4'), [x, 0.1, z], 0.09, 0.2); cyl(horse, dark, [x, 0.03, z], 0.1, 0.07); }
  add(horse, new THREE.CylinderGeometry(0.05, 0.1, 0.9, 10), dark, [-1.5, 1.0, 0], [0, 0, 0.5]);
  box(horse, mat('#c01f2f'), [0, 1.62, 0], [0.9, 0.08, 0.7]); // saddle blanket
  const J = placeJack(stage, { x: 0.0, z: 0.0, s: 2.1, ry: 0.0, pose: {} }); J.position.set(0.0, 1.95, 0); J.rotation.y = 0.45;
  J.userData.aim('l', new THREE.Vector3(1.0, 3.2, 0.5));
  const hp = J.userData.handPos('l'); const pole = new THREE.Group(); pole.position.copy(hp); sc.add(pole);
  cyl(pole, mat('#c9a14a'), [0, 0.2, 0], 0.03, 1.6); const fl = textPlane('', 0.8, 0.5, { bg: '#2f6fd6' }); fl.position.set(0.4, 0.75, 0); pole.add(fl);
  blob(pole, mat('#ffd23f'), [0, 1.05, 0], [0.07, 0.07, 0.07]);
  // plumed helmet on jack
  const top = new THREE.Box3().setFromObject(J).max.y;
  finishScene(stage, J, { cam: [0.2, 2.5, 6.6], look: [0.1, 2.2, 0] });

});
</script></body></html>
