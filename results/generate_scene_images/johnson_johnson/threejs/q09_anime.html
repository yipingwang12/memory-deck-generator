<html><head><meta charset="utf-8"><title>J&J q09 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q09 — The JACKS' ABIOMED pumps are made in DANVERS, Massachusetts.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, blob, cyl, rng, makeStage, placeJack, finishScene, textPlane, createJacks } from './common.js';
guard(() => {

  const stage = makeStage({ ground: '#a9b39a' }); const sc = stage.scene;
  // factory with sawtooth roof + sign
  box(sc, mat('#c9544a'), [1.0, 1.1, -1.2], [4.8, 2.2, 1.4]);
  for (let i = 0; i < 3; i++) add(sc, new THREE.CylinderGeometry(0.01, 0.01, 0.01), mat('#fff'), [0, 0, 0]);
  for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 1.4), mat('#8a2f2a')); r.position.set(-0.1 + i * 1.6, 2.5, -1.2); r.castShadow = true; sc.add(r); }
  cyl(sc, mat('#777'), [3.0, 2.4, -1.6], 0.2, 1.8);
  const sg = textPlane('ABIOMED', 3.4, 0.6, { bg: '#fff', fg: '#c01f2f', px: 200 }); sg.position.set(1.0, 1.75, -0.49); sc.add(sg);
  const ds = textPlane('DANVERS', 1.8, 0.4, { bg: '#2f6f4a', fg: '#fff', px: 160 }); ds.position.set(2.3, 0.95, 0.9); sc.add(ds); cyl(sc, mat('#6b4a37'), [0.5, 0.2, 1.38], 0.04, 0.4); cyl(sc, mat('#6b4a37'), [1.7, 0.2, 1.38], 0.04, 0.4); ds.position.set(1.1, 0.48, 1.4);
  // conveyor + pumps
  box(sc, mat('#444a55'), [1.0, 0.45, 0.6], [4.2, 0.18, 0.8]);
  for (const x of [-0.9, 0.1, 1.1, 2.1]) { cyl(sc, mat('#555'), [x, 0.25, 0.6], 0.2, 0.5); }
  const pump = (x) => { const g = new THREE.Group(); g.position.set(x, 0.85, 0.6); sc.add(g); cyl(g, mat('#e2483c'), [0, 0, 0], 0.17, 0.62, [0, 0, Math.PI / 2]); blob(g, mat('#f2b233'), [-0.4, 0, 0], [0.2, 0.2, 0.2]); add(g, new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8), mat('#d6dbe0', { metalness: 0.6 }), [0.5, 0, 0], [0, 0, Math.PI / 2]); };
  pump(0.0); pump(1.1); pump(2.2);
  const J = placeJack(stage, { x: -1.6, z: 1.2, s: 1.5, ry: 0.35 }); J.userData.aim('l', new THREE.Vector3(-0.2, 1.4, 0.6));
  finishScene(stage, J, { cam: [0.1, 2.0, 7.0], look: [0.2, 1.5, 0] });

});
