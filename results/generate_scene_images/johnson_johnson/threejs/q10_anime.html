<!doctype html>
<html><head><meta charset="utf-8"><title>J&J q10 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q10 — ABIOMED's IMPELLER spins inside a heart for the JACKS: Impella heart pumps.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, blob, cyl, rng, makeStage, placeJack, finishScene, textPlane, createJacks } from './common.js';
guard(() => {

  const stage = makeStage({ ground: '#f0d9c8', sky: { cover: 1 } }); const sc = stage.scene;
  const sh = new THREE.Shape(); sh.moveTo(0, -1); sh.bezierCurveTo(-1.6, 0.1, -1.1, 1.2, 0, 0.55); sh.bezierCurveTo(1.1, 1.2, 1.6, 0.1, 0, -1);
  const hg = new THREE.ExtrudeGeometry(sh, { depth: 0.9, bevelEnabled: true, bevelSize: 0.12, bevelThickness: 0.16, bevelSegments: 5, curveSegments: 32 }); hg.center();
  const heart = new THREE.Mesh(hg, mat('#e8274a', { transparent: true, opacity: 0.62, roughness: 0.3 })); heart.position.set(1.0, 1.55, 0); heart.scale.setScalar(1.35); heart.castShadow = true; sc.add(heart);
  // impella pump: tube + spinning impeller inside
  const pump = new THREE.Group(); pump.position.set(1.0, 1.55, 1.3); pump.rotation.z = 0.5; pump.scale.setScalar(1.8); sc.add(pump);
  cyl(pump, mat('#cfd6dd', { metalness: 0.5, roughness: 0.3 }), [0, 0, 0], 0.17, 1.4);
  cyl(pump, mat('#2f6fd6'), [0, 0.55, 0], 0.19, 0.4);
  for (let i = 0; i < 4; i++) { const b = new THREE.Group(); b.rotation.y = i * Math.PI / 2; b.position.y = 0.55; pump.add(b); add(b, new THREE.BoxGeometry(0.4, 0.04, 0.17), mat('#ffd23f', { metalness: 0.4 }), [0.3, 0, 0], [0.5, 0, 0]); }
  add(pump, new THREE.TorusGeometry(0.28, 0.025, 8, 30), mat('#ffd23f'), [0, 0.55, 0], [Math.PI / 2, 0, 0]);
  const pigtail = add(pump, new THREE.TorusGeometry(0.2, 0.03, 8, 20, Math.PI * 1.6), mat('#cfd6dd'), [0, -0.8, 0], [0, 0, 0]);
  // motion arcs
  for (const r of [0.55, 0.7]) add(sc, new THREE.TorusGeometry(r, 0.02, 8, 40, 4.0), mat('#fff'), [1.0 - 0.45, 1.55 + 0.9, 0.9], [0, 0, 0.4]);
  const J = placeJack(stage, { x: -1.9, z: 0.8, s: 1.5, ry: 0.3 }); J.userData.aim('l', new THREE.Vector3(-0.2, 2.2, 0.8));
  finishScene(stage, J, { cam: [0, 1.8, 6.2], look: [0.1, 1.5, 0] });

});
</script></body></html>
