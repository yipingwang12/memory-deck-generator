// q08 — The JACKS sell the nippy antibody under a new name: IMAAVY.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, blob, cyl, rng, makeStage, placeJack, finishScene, textPlane, createJacks } from './common.js';
guard(() => {

  const stage = makeStage({ ground: '#c8e6a0' }); const sc = stage.scene;
  // big name sign
  const sg = new THREE.Group(); sg.position.set(1.1, 0, -0.2); sc.add(sg);
  box(sg, mat('#f3f3f0'), [0, 1.8, 0], [3.4, 1.3, 0.12]); box(sg, mat('#c01f2f'), [0, 2.35, 0.07], [3.4, 0.35, 0.03]);
  const nm = textPlane('IMAAVY', 3.0, 0.9, { bg: '#f3f3f0', fg: '#1a3f8f', px: 280 }); nm.position.set(0, 1.62, 0.075); sg.add(nm);

  for (const x of [-1.4, 1.4]) cyl(sg, mat('#6b4a37'), [x, 0.55, 0], 0.07, 1.1);
  // antibody product vial
  const tc = mat('#34c3a0'); const ab = new THREE.Group(); ab.position.set(0.6, 0.0, 1.3); sc.add(ab);

  for (let i = 0; i < 4; i++) blob(ab, mat('#fff'), [0, 0.2 + i * 0.01, 0.3], [0.001, 0.001, 0.001]);

  finishScene(stage, J, { cam: [0, 1.7, 5.8], look: [0.1, 1.45, 0] });

});
