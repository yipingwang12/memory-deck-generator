<!doctype html>
<html><head><meta charset="utf-8"><title>J&J q02 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q02 — A singing DUET wears the JACKS' CEO crown.
import { guard } from './kit.js';
import { THREE, num, mat, add, box, blob, cyl, rng, makeStage, placeJack, finishScene, textPlane, createJacks } from './common.js';
guard(() => {

  const stage = makeStage({ ground: '#e6c78a', sky: { cover: 1.5 } }); const sc = stage.scene;
  box(sc, mat('#7c2a3a'), [0, 0.1, -0.2], [6.5, 0.2, 3.5]); // stage
  const J = placeJack(stage, { x: 0, z: 0.4, s: 1.6, ry: 0, pose: { arms: { l: [0, 0.5], r: [0, -0.2] } } }); J.position.y += 0.2; J.userData.mouth(1);
  const top = new THREE.Box3().setFromObject(J).max.y;
  // crown on top
  const crown = new THREE.Group(); const gold = mat('#ffc933', { metalness: 0.6, roughness: 0.3 });
  cyl(crown, gold, [0, 0, 0], 0.3, 0.18, [0, 0, 0], 0.24);
  for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; add(crown, new THREE.ConeGeometry(0.075, 0.28, 12), gold, [Math.sin(a) * 0.27, 0.2, Math.cos(a) * 0.27]); blob(crown, mat('#e8263c', { roughness: 0.2 }), [Math.sin(a) * 0.27, 0.36, Math.cos(a) * 0.27], [0.045, 0.045, 0.045]); }
  blob(crown, mat('#3a7cf0', { roughness: 0.2 }), [0, 0, 0.3], [0.06, 0.06, 0.04]);
  crown.position.set(0, top - 0.02, 0.4); crown.scale.setScalar(1.6); sc.add(crown);
  // two mics on stands (duet)
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(s * 2.0, 0.2, 0.7); sc.add(g);
    cyl(g, mat('#333'), [0, 0.02, 0], 0.22, 0.04); cyl(g, mat('#555'), [0, 0.8, 0], 0.025, 1.6);
    const head = blob(g, mat('#c8ced4', { metalness: 0.5, roughness: 0.3 }), [-s * 0.1, 1.65, 0], [0.13, 0.17, 0.13], [0, 0, s * 0.4]);
    blob(g, mat('#222'), [-s * 0.1, 1.62, 0], [0.07, 0.1, 0.07], [0, 0, s * 0.4]);
  }
  // music notes
  const note = (x, y, c, sc2 = 1) => { const g = new THREE.Group(); blob(g, mat(c), [0, 0, 0], [0.17, 0.12, 0.1], [0, 0, 0.4]); cyl(g, mat(c), [0.15, 0.3, 0], 0.025, 0.6); add(g, new THREE.BoxGeometry(0.28, 0.1, 0.04), mat(c), [0.27, 0.58, 0], [0, 0, -0.4]); g.position.set(x, y, 0.8); g.scale.setScalar(sc2); sc.add(g); };
  note(-1.6, 2.2, '#ff5d8f', 1.2); note(1.6, 2.4, '#3a7cf0', 1.3); note(-2.3, 1.2, '#ffd23f', 1.0); note(2.4, 1.2, '#32c48d', 1.0);
  finishScene(stage, J, { cam: [0, 1.7, 6.2], look: [0, 1.4, 0] });

});
</script></body></html>
