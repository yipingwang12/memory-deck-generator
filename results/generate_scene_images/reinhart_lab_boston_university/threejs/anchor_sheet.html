<!doctype html>
<html><head><meta charset="utf-8"><title>Raincoat anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createRaincoat } from './raincoat.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 } });
  const scene = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: '#6fae45', roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  [[-0.9, 0], [0, 0.6], [0.9, 1.57]].forEach(([x, ry], i) => {
    const c = createRaincoat({ scale: 1.4 }); c.position.x = x; c.rotation.y = ry; scene.add(c);
    c.userData.pose({ headTilt: i === 1 ? 0.08 : 0, arms: { l: [0, 0.35, 0], r: [0, 0.35, 0] } });
  });
  const pm = new Set(); scene.traverse((o) => { if (o.isMesh && o !== g) pm.add(o); });
  stage.toonify(scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [200, 1000, 120, 1.6]]);
  stage.camera.position.set(0, 0.9, 4.2); stage.camera.lookAt(0, 0.75, 0);
  stage.finish();
});
</script></body></html>
