<!doctype html>
<html><head><meta charset="utf-8"><title>Sonde q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, add, mat, blob, box, cyl, ground, makeStage, wrapUp, rng, textPlane } from "./common.js";
import { createBalloon } from "./balloon.js";
import { createPerson } from "./people.js";
// q03 — The BALLOON holds 1.2 million voice samples from over 85 thousand people.
guard(() => {
  const { stage, scene, num } = makeStage({ sunAzimuth: 120 });
  ground(scene, '#6fae45');
  const r = rng(11), cols = ['#e8343f', '#3a7ab8', '#f2b630', '#8e5ac8', '#2fa86a', '#ff7a2a', '#d0508a'];
  // crowd of tiny people (85K)
  for (let i = 0; i < 160; i++) {
    const x = -9 + (i % 20) * 0.95 + (r() - 0.5) * 0.3, z = -2.5 - Math.floor(i / 20) * 0.9, c = mat(cols[i % 7]);
    const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
    blob(g, c, [0, 0.35, 0], [0.17, 0.3, 0.14]); blob(g, mat('#f2c9a5'), [0, 0.78, 0], [0.13, 0.14, 0.13]); blob(g, mat('#3a2a1c'), [0, 0.84, -0.02], [0.14, 0.12, 0.13]);
    if (i % 3 === 0) add(g, new THREE.TorusGeometry(0.2, 0.012, 6, 20, 1.6), mat('#ff9a2a'), [0.1, 0.9, 0.1], [0, 0.9, 0.8]);
  }
  // swirl of voice-record discs (1.2M)
  for (let i = 0; i < 110; i++) {
    const a = i * 0.45, rad = 2.3 + (i % 11) * 0.13, y = 0.6 + i * 0.035;
    const d = add(scene, new THREE.CylinderGeometry(0.14, 0.14, 0.02, 20), mat(cols[i % 7], { roughness: 0.3 }), [1.0 + Math.cos(a) * rad * 1.4, y, Math.sin(a) * rad * 0.9 - 1.0], [r() * 3, 0, r() * 3]);
    cyl(d, mat('#222'), [0, 0.012, 0], 0.03, 0.03, 0.01);
  }
  const bal = createBalloon({ scale: 1.7, string: 0.5 }); bal.position.set(1.0, 1.1, 0.5); bal.rotation.y = -0.2; scene.add(bal);
  bal.userData.pose({ arms: { l: [0, 2.4, 0], r: [0, 2.4, 0] } });
  const sign = textPlane('1.2M', 2.6, 1.4, { bg: '#fff6e0', fg: '#c8321e', border: '#c8321e' }); sign.position.set(-3.2, 2.9, 0); sign.rotation.y = 0.25; scene.add(sign);
  cyl(scene, mat('#6b4a2a'), [-3.5, 1.1, -0.1], 0.05, 0.05, 2.2); cyl(scene, mat('#6b4a2a'), [-2.2, 1.1, 0.2], 0.05, 0.05, 2.2);
  const s2 = textPlane('85K', 1.5, 0.8, { bg: '#e3f0ff', fg: '#1d4f91', border: '#1d4f91' }); s2.position.set(-3.2, 1.45, 0.05); s2.rotation.y = 0.25; scene.add(s2);
  wrapUp(stage, num, [bal], [-0.3, 2.5, 8.0], [-0.4, 2.3, 0]);
});
</script></body></html>
