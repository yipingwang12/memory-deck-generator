<!doctype html>
<html><head><meta charset="utf-8"><title>Sonde q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — The PURITAN launches the BALLOON over Boston.
import { THREE, guard, add, mat, blob, box, cyl, ground, makeStage, wrapUp, rng } from './common.js';
import { createBalloon } from './balloon.js';
import { createPerson } from './people.js';
guard(() => {
  const { stage, scene, num } = makeStage({ sunAzimuth: 140 });
  ground(scene, '#8a8f7a');
  add(scene, new THREE.PlaneGeometry(400, 3), mat('#b9a58a'), [0, 0.003, -1], [-Math.PI / 2, 0, 0]);
  // cobbles + distant brick row and steeple
  const r = rng(3);
  for (let i = 0; i < 80; i++) blob(scene, mat('#7c7468'), [(r() - 0.5) * 14, 0.01, -2 + r() * 4], [0.12, 0.02, 0.1]);
  for (let i = 0; i < 9; i++) {
    const h = 2.5 + r() * 2, x = -12 + i * 3.1; box(scene, mat(['#b5503c', '#a8442f', '#c06048'][i % 3]), [x, h / 2, -14], [2.8, h, 2.5]);
    box(scene, mat('#3a2f2a'), [x, h + 0.3, -14], [3, 0.6, 2.7]);
    for (let w = 0; w < 3; w++) box(scene, mat('#ffe9a0'), [x - 0.8 + w * 0.8, h * 0.6, -12.7], [0.4, 0.6, 0.05]);
  }
  box(scene, mat('#f2ece0'), [-7, 4.5, -16], [1.5, 9, 1.5]); add(scene, new THREE.ConeGeometry(1.2, 4, 4), mat('#444a58'), [-7, 11, -16], [0, Math.PI / 4, 0]);

  const pur = createPerson({ coat: '#1c1c22', pants: '#1c1c22', hat: 'puritan', collar: true, stern: true });
  pur.position.set(0.15, 0, 0.3); pur.rotation.y = 0.5; scene.add(pur);
  const bal = createBalloon({ scale: 1.3, string: 1.0 }); bal.position.set(0.9, 1.9, 0); bal.rotation.z = -0.1;
  bal.userData.pose({ arms: { l: [0, 0.9, 0], r: [0, 0.9, 0] } }); scene.add(bal);
  pur.userData.pose({ arms: { r: [0.1, 0.2] }, lean: 0.03 });
  pur.updateMatrixWorld(true);
  const w = bal.localToWorld(new THREE.Vector3(0.0, -0.45, 0.05));
  const t = pur.worldToLocal(w.clone());
  pur.userData.reach('l', [t.x, t.y, t.z]);
  wrapUp(stage, num, [pur, bal], [0.3, 2.0, 6.0], [0.3, 1.9, 0]);
});
</script></body></html>
