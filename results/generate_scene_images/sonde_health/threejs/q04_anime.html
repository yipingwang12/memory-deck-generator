<!doctype html>
<html><head><meta charset="utf-8"><title>Sonde q04</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, add, mat, blob, box, cyl, ground, makeStage, wrapUp, rng, textPlane } from "./common.js";
import { createBalloon } from "./balloon.js";
import { createPerson } from "./people.js";
// q04 — The BALLOON hears wheezing lungs and sad, nervous voices: asthma, COPD, depression, anxiety.
guard(() => {
  const { stage, scene, num } = makeStage({ sunAzimuth: 120, sky: { cover: 3, seed: 8, towerTop: 0.5, puffCover: 2 } });
  ground(scene, '#6fae45');
  const pink = mat('#f08a98', { roughness: 0.5 }), pink2 = mat('#d6667a');
  const lungs = new THREE.Group(); lungs.position.set(-2.6, 2.0, 0); lungs.rotation.y = 0.4; scene.add(lungs);
  for (const s of [-1, 1]) { blob(lungs, pink, [s * 0.55, 0, 0], [0.5, 0.85, 0.35], [0, 0, s * -0.12]); blob(lungs, pink2, [s * 0.3, -0.2, 0.2], [0.18, 0.55, 0.15]); }
  cyl(lungs, mat('#f4d7c8'), [0, 0.8, 0], 0.09, 0.09, 0.9);
  for (const s of [-1, 1]) add(lungs, new THREE.CylinderGeometry(0.06, 0.06, 0.7, 12), mat('#f4d7c8'), [s * 0.28, 0.3, 0.05], [0, 0, s * 1.0]);
  // wheeze squiggles
  const sq = []; for (let i = 0; i <= 40; i++) sq.push(new THREE.Vector3(i * 0.032, Math.sin(i * 1.1) * 0.1 * (1 + i / 20), 0));
  for (let k = 0; k < 3; k++) add(scene, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(sq), 120, 0.03, 8), mat('#6b7078'), [-1.9, 1.6 + k * 0.4, 0.4]);
  // inhaler (asthma)
  const inh = new THREE.Group(); inh.position.set(-2.7, 0.35, 1.0); inh.rotation.y = 0.6; scene.add(inh);
  box(inh, mat('#3a7ab8'), [0, 0.3, 0], [0.22, 0.6, 0.3]); box(inh, mat('#e8343f'), [0.14, 0.05, 0], [0.34, 0.18, 0.26]);
  // sad rain cloud + anxious sweat
  const cloud = new THREE.Group(); cloud.position.set(3.0, 3.4, 0); scene.add(cloud);
  [[0, 0, 0.7], [0.7, 0.1, 0.55], [-0.7, 0.05, 0.55], [0.35, 0.4, 0.5], [-0.3, 0.4, 0.5]].forEach(([x, y, s]) => blob(cloud, mat('#5d6676'), [x, y, 0], [s, s * 0.8, s * 0.8]));
  const r = rng(5);
  for (let i = 0; i < 18; i++) add(scene, new THREE.ConeGeometry(0.07, 0.3, 10), mat('#4aa8ff', { emissive: '#2a78d0', emissiveIntensity: 0.4 }), [2.2 + (i % 6) * 0.35, 2.7 - Math.floor(i / 6) * 0.55 + r() * 0.1, 0.15 + r() * 0.2]);
  const face = new THREE.Group(); face.position.set(3.0, 0.9, 0.5); scene.add(face);
  blob(face, mat('#f2c9a5'), [0, 0, 0], [0.55, 0.6, 0.5]); for (const s of [-1, 1]) { blob(face, mat('#2a1a12'), [s * 0.2, 0.08, 0.45], [0.06, 0.08, 0.05]); box(face, mat('#2a1a12'), [s * 0.2, 0.3, 0.46], [0.22, 0.04, 0.03], [0, 0, s * 0.4]); }
  add(face, new THREE.TorusGeometry(0.15, 0.025, 8, 16, Math.PI), mat('#7a2a2a'), [0, -0.2, 0.46]);
  add(face, new THREE.SphereGeometry(0.06, 10, 8), mat('#4aa8ff'), [0.5, 0.25, 0.3], [0, 0, 0], [1, 1.6, 1]);
  for (let k = 0; k < 2; k++) add(face, new THREE.TorusGeometry(0.7 + k * 0.1, 0.02, 6, 24, 0.7), mat('#a58aff'), [0, 0, 0.3], [0, 0, 2.3 + k * 3.1]);
  const bal = createBalloon({ scale: 1.45, mood: 'sad' }); bal.position.set(0.7, 0.7, 0.3); scene.add(bal);
  bal.userData.pose({ arms: { r: [0, 0.6, 0] } }); bal.userData.reach('l', [0.58, 1.02, 0.12]);
  wrapUp(stage, num, [bal], [0.2, 2.2, 8.0], [0.1, 2.1, 0]);
});
</script></body></html>
