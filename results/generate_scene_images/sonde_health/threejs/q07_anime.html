<!doctype html>
<html><head><meta charset="utf-8"><title>Sonde q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, add, mat, blob, box, cyl, ground, makeStage, wrapUp, rng, textPlane } from "./common.js";
import { createBalloon } from "./balloon.js";
import { createPerson } from "./people.js";
// q07 — The BALLOON rises from a TEA chest in Boston.
guard(() => {
  const { stage, scene, num } = makeStage({ sunAzimuth: 130 });
  ground(scene, '#b08a5a');
  for (let i = 0; i < 14; i++) add(scene, new THREE.BoxGeometry(400, 0.02, 0.02), mat('#6b4a2a'), [0, 0.01, -3 + i * 0.5]);
  add(scene, new THREE.PlaneGeometry(400, 120), mat('#2f7fb8', { roughness: 0.3 }), [0, 0.02, -75], [-Math.PI / 2, 0, 0]);
  const r = rng(2);
  for (let i = 0; i < 8; i++) { const h = 3 + r() * 2; box(scene, mat(['#b5503c', '#a8442f', '#c06048'][i % 3]), [-14 + i * 3.4, h / 2, -12], [3, h, 2.6]); box(scene, mat('#3a2f2a'), [-14 + i * 3.4, h + 0.3, -12], [3.2, 0.6, 2.8]); }
  // tall ship on the harbour
  const ship = new THREE.Group(); ship.position.set(5, 0, -22); scene.add(ship);
  add(ship, new THREE.BoxGeometry(9, 1.6, 2.6), mat('#4a2e1c'), [0, 0.8, 0]);
  for (const x of [-2.5, 0, 2.5]) { cyl(ship, mat('#5a3a22'), [x, 5, 0], 0.1, 0.12, 8); box(ship, mat('#fff3dc'), [x, 5.2, 0.2], [2, 4, 0.05]); }
  // chest
  const chest = new THREE.Group(); chest.position.set(0, 0, 0.2); scene.add(chest);
  const wood = mat('#8a5a2c'), band = mat('#2e2a2a', { metalness: 0.5, roughness: 0.4 });
  box(chest, wood, [0, 0.35, 0], [1.5, 0.7, 0.95]);
  for (const x of [-0.6, 0.6]) box(chest, band, [x, 0.35, 0], [0.09, 0.72, 0.98]);
  box(chest, mat('#2d6a30'), [0, 0.7, 0], [1.4, 0.04, 0.85]);
  for (let i = 0; i < 60; i++) blob(chest, mat(['#3f8f3a', '#5aa84a', '#2d7a30'][i % 3]), [(r() - 0.5) * 1.3, 0.74 + r() * 0.12, (r() - 0.5) * 0.75], [0.1, 0.03, 0.05], [r(), r(), r()]);
  const lid = new THREE.Group(); lid.position.set(0, 0.7, -0.47); lid.rotation.x = -2.4; chest.add(lid);
  add(lid, new THREE.BoxGeometry(1.5, 0.1, 0.95), wood, [0, 0.0, 0.47]);
  const label = textPlane('TEA', 1.1, 0.5, { bg: '#f6e9c8', fg: '#7a1d12', border: '#7a1d12' }); label.position.set(0, 0.36, 0.485); chest.add(label);
  // cup with steam
  const cup = new THREE.Group(); cup.position.set(1.4, 0, 0.9); scene.add(cup);
  cyl(cup, mat('#ffffff', { roughness: 0.3 }), [0, 0.18, 0], 0.17, 0.11, 0.3); cyl(cup, mat('#7a3b14'), [0, 0.32, 0], 0.15, 0.15, 0.01);
  add(cup, new THREE.TorusGeometry(0.09, 0.025, 8, 16), mat('#ffffff'), [0.2, 0.2, 0]);
  add(cup, new THREE.CylinderGeometry(0.28, 0.28, 0.02, 24), mat('#ffffff'), [0, 0.01, 0]);
  const bal = createBalloon({ scale: 1.35, string: 0.9 }); bal.position.set(0, 1.25, 0.2); bal.rotation.z = 0.05;
  bal.userData.pose({ arms: { l: [0, 2.3, 0], r: [0, 2.3, 0] } }); scene.add(bal);
  wrapUp(stage, num, [bal], [0.3, 1.8, 5.0], [0.2, 1.6, 0]);
});
</script></body></html>
