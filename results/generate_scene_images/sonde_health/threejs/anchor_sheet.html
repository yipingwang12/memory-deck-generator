<!doctype html>
<html><head><meta charset="utf-8"><title>Balloon anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, add, mat, ground, makeStage, wrapUp } from './common.js';
import { createBalloon } from './balloon.js';
guard(() => {
  const { stage, scene, num } = makeStage();
  ground(scene, '#6fae45');
  const chars = [];
  [[-1.5, 0.6], [0, 0], [1.5, -0.6]].forEach(([x, ry], i) => {
    const b = createBalloon({ scale: 0.95 }); b.position.set(x * 1.35, 0.75, 0); b.rotation.y = [0.7, 0, -0.9][i];
    b.userData.pose({ arms: { l: [0, 0.6, 0], r: [0, 0.6, 0] } });
    if (i === 1) b.userData.reach('l', [0.55, 1.35, 0.2]);
    scene.add(b); chars.push(b);
  });
  wrapUp(stage, num, chars, [0, 1.2, 5.2], [0, 1.1, 0]);
});
</script></body></html>
