<!doctype html>
<html><head><meta charset="utf-8"><title>Agios q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// The AEGIS shield drops its cancer CRAB (oncology) to guard the blood alone.
import { THREE, guard, mat, add, blob, box, cyl, rbc, textPlane, makeScene } from './common.js';
import { createAegis } from './aegis.js';
import { createPirateKing, createCrab, createPivotDoor, sickle, platelet } from './props.js';
// shield helper: place + pose + optional reach {hand:'l', to:[x,y,z] world}
function place(scene, S, x, z, ry, sc, reach) {
  const a = createAegis({ scale: sc }); a.position.set(x, 0, z); a.rotation.y = ry; scene.add(a);
  a.userData.pose({ legs: { l: [0.2, 0], r: [-0.15, 0] } });
  if (reach) { a.updateMatrixWorld(true); const t = a.worldToLocal(new THREE.Vector3(...reach.to)); a.userData.reach(reach.hand, [t.x / sc, t.y / sc, t.z / sc]); }
  S.mark(a); return a;
}
guard(() => {
  const S = makeScene({ ground: '#b8453f', cover: 1 }); const { scene } = S;
  add(scene, new THREE.CylinderGeometry(2.6, 2.6, 0.02, 48), mat('#8f1d2c', { roughness: 0.3 }), [0, 0.01, 0]);
  for (let i = 0; i < 12; i++) { const c = rbc(0.2, '#d8283a'); const a = i * 2.1; c.position.set(Math.cos(a) * (1.1 + (i % 4) * 0.3) , 0.08, Math.sin(a) * 0.7 - 1.0); c.rotation.set(0.2 * (i % 3), a, 0.15); scene.add(c); }
  const crab = createCrab(); crab.position.set(1.6, 0.9, 0.2); crab.scale.setScalar(1.4); crab.rotation.set(0.5, -0.6, 0.6); scene.add(crab); S.mark(crab);
  // motion lines: crab tumbling away
  for (let i = 0; i < 3; i++) add(scene, new THREE.CylinderGeometry(0.012, 0.012, 0.35, 6), mat('#fff'), [1.0 + i * 0.1, 1.25 - i * 0.2, 0.3], [0, 0, 1.0]);
  place(scene, S, -0.4, 0.4, 0.2, 1.5, { hand: 'l', to: [0.7, 0.8, 0.7] });
  S.finish([0.5, 1.0, 4.4], [0.6, 0.7, 0]);

});
</script></body></html>
