<!doctype html>
<html><head><meta charset="utf-8"><title>Aegis anchor sheet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createAegis } from './aegis.js';
guard(() => {
  const stage = createAnimeStage({
    fov: 28, sunElevation: 38, sunAzimuth: 200,
    sky: { zenith: '#f3c98a', horizon: '#ffe8c2', cover: 0.02, puffCover: 0.02, towerTop: 0.02, cloudLit: '#fff3dc', cloudShade: '#f3d3a0' },
    ambient: { color: '#fff0e0', intensity: 2.2 },
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 },
  });
  const THREE = stage.THREE;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(300, 64), new THREE.MeshStandardMaterial({ color: '#f1d9b0', roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; stage.scene.add(floor);
  const views = [[-1.1, 0.0, {}], [0, 0.7, {}], [1.1, Math.PI / 2, {}]];
  const set = new Set();
  views.forEach(([x, ry], i) => {
    const p = createAegis(); p.position.x = x; p.rotation.y = ry;
    if (i === 1) { p.userData.reach('l', [0.3, 0.75, 0.3]); p.userData.pose({ legs: { l: [0.3, 0], r: [-0.2, 0] } }); p.userData.reach('l', [0.3, 0.75, 0.3]); }
    stage.scene.add(p); p.traverse((m) => set.add(m));
  });
  stage.toonify(stage.scene, (m) => set.has(m));
  stage.camera.position.set(0, 0.7, 4.2); stage.camera.lookAt(0, 0.48, 0);
  stage.finish();
});
</script></body></html>
