<!doctype html>
<html><head><meta charset="utf-8"><title>Agios q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// For thalassaemia, the AEGIS shield sells the MIGHTY PIVOT in an AQUA VEST (AQVESME).
import { THREE, guard, mat, add, blob, box, cyl, rbc, textPlane, makeScene } from './common.js';
import { createAegis } from './aegis.js';
import { createPirateKing, createCrab, createPivotDoor, sickle, platelet } from './props.js';
// shield helper: place + pose + optional reach {hand:'l', to:[x,y,z] world}
function place(scene, S, x, z, ry, sc, reach) {
  const a = createAegis({ scale: sc }); a.position.set(x, 0, z); a.rotation.y = ry; scene.add(a);
  a.userData.pose({ legs: { l: [0.2, 0], r: [-0.15, 0] } });
  if (reach) { a.updateMatrixWorld(true); const t = a.worldToLocal(new THREE.Vector3(...reach.to)); a.userData.reach(reach.hand, [t.x / sc, t.y / sc, t.z / sc]); }
  S.mark(a); return a;
}
guard(() => {
  const S = makeScene({ ground: '#e8cf9a', cover: 1.5 }); const { scene } = S;
  // market stall
  box(scene, mat('#9b6a3a'), [0.3, 0.5, -0.3], [3.0, 0.1, 1.0]); for (const x of [-1.1, 1.7]) { box(scene, mat('#7a4f2a'), [x, 0.25, -0.3], [0.1, 0.5, 0.9]); cyl(scene, mat('#7a4f2a'), [x, 1.3, -0.75], 0.04, 2.6); }
  for (let i = 0; i < 8; i++) box(scene, mat(i % 2 ? '#ffffff' : '#ef5a4a'), [-1.3 + i * 0.45, 2.45, -0.5], [0.45, 0.05, 1.0], [0.35, 0, 0]);
  const door = createPivotDoor({ open: 0.4 }); door.position.set(0.9, 0.55, -0.3); door.scale.setScalar(0.85); scene.add(door); S.mark(door);
  const door2 = createPivotDoor({ open: -0.3 }); door2.position.set(1.8, 0.55, -0.3); door2.scale.setScalar(0.6); scene.add(door2); S.mark(door2);
  for (let i = 0; i < 4; i++) { const c = rbc(0.12, '#f0a0a8'); c.position.set(-0.8 + i * 0.3, 0.6, 0.0); c.rotation.x = 0.3; scene.add(c); }
  const a = place(scene, S, -0.4, 0.9, 0.35, 1.5, { hand: 'l', to: [0.6, 1.0, 0.7] });
  // aqua vest over the lower half
  const vest = new THREE.Group(); const aq = mat('#25c6d2', { roughness: 0.5 });
  const half = new THREE.Mesh(new THREE.CircleGeometry(0.325, 40, Math.PI, Math.PI), aq); half.position.z = 0.05; vest.add(half);
  for (const s of [-1, 1]) add(vest, new THREE.CylinderGeometry(0.02, 0.02, 0.2, 6), aq, [s * 0.13, -0.05, 0.06], [0, 0, s * 0.5]);
  for (let i = 0; i < 3; i++) blob(vest, mat('#fff3c0'), [0, -0.1 - i * 0.07, 0.06], [0.018, 0.018, 0.01]);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.325, 0.02, 8, 30, Math.PI), mat('#1a9aa6')); rim.rotation.z = Math.PI; rim.position.z = 0.05; vest.add(rim);
  a.userData.parts.shield.add(vest);
  S.finish([0.5, 1.2, 5.2], [0.5, 1.0, 0]);

});
</script></body></html>
