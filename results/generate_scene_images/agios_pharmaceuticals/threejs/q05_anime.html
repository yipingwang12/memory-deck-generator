<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Behind the AEGIS shield, the MIGHTY PIVOT first heals people who lack the PIRATE KING: pyruvate kinase deficiency.
import { THREE, guard, mat, add, blob, box, cyl, rbc, textPlane, makeScene } from './common.js';
import { createAegis } from './aegis.js';
import { createPirateKing, createCrab, createPivotDoor, sickle, platelet } from './props.js';
// shield helper: place + pose + optional reach {hand:'l', to:[x,y,z] world}
function place(scene, S, x, z, ry, sc, reach) {
  const a = createAegis({ scale: sc }); a.position.set(x, 0, z); a.rotation.y = ry; scene.add(a);
  a.userData.pose({ legs: { l: [0.2, 0], r: [-0.15, 0] } });
  if (reach) { a.updateMatrixWorld(true); const t = a.worldToLocal(new THREE.Vector3(...reach.to)); a.userData.reach(reach.hand, [t.x / sc, t.y / sc, t.z / sc]); }
  S.mark(a); return a;
}
guard(() => {
  const S = makeScene({ ground: '#e8d9c0', cover: 1.5 }); const { scene } = S;
  const sh = place(scene, S, 0.0, 0.8, 0.0, 1.0, null); // front shield, small
  sh.scale.setScalar(1.2);
  const door = createPivotDoor({ open: 0.35 }); door.position.set(-1.1, 0, -0.6); door.scale.setScalar(1.6); scene.add(door); S.mark(door);
  // empty throne, hat+crown+eyepatch left on seat
  const th = new THREE.Group(); box(th, mat('#7a1e2a'), [0, 0.3, 0], [0.8, 0.12, 0.7]); box(th, mat('#7a1e2a'), [0, 0.35, -0.3], [0.8, 0.14, 0.1]);
  box(th, mat('#7a1e2a'), [0, 0.85, -0.32], [0.8, 1.0, 0.1]); for (const x of [-0.4, 0.4]) { box(th, mat('#f2b632', { metalness: 0.6 }), [x, 0.55, 0], [0.08, 0.5, 0.7]); blob(th, mat('#f2b632'), [x, 0.85, -0.3], [0.06, 0.06, 0.06]); }
  const hat = new THREE.Group(); add(hat, new THREE.CylinderGeometry(0.25, 0.25, 0.03, 3), mat('#1d1a20'), [0, 0, 0], [0, Math.PI / 6, 0]); add(hat, new THREE.CylinderGeometry(0.12, 0.15, 0.1, 20), mat('#1d1a20'), [0, 0.06, 0]);
  add(hat, new THREE.CylinderGeometry(0.13, 0.115, 0.07, 20), mat('#f2b632', { metalness: 0.6 }), [0, 0.14, 0]); blob(hat, mat('#f5f5ee'), [0, 0.07, 0.14], [0.04, 0.04, 0.015]);
  hat.position.set(0, 0.4, 0.05); hat.rotation.x = -0.2; th.add(hat);
  th.position.set(1.5, 0, -0.4); th.scale.setScalar(1.3); th.rotation.y = -0.4; scene.add(th);
  // sick red-cell patient, bandaged, thermometer, sad
  const p = new THREE.Group(); blob(p, mat('#d8283a'), [0, 0.35, 0], [0.34, 0.34, 0.3]);
  for (const s of [-1, 1]) { blob(p, mat('#fff', { roughness: 0.3 }), [s * 0.12, 0.42, 0.26], [0.065, 0.07, 0.03]); blob(p, mat('#111'), [s * 0.12, 0.40, 0.285], [0.035, 0.045, 0.015]); }
  add(p, new THREE.TorusGeometry(0.05, 0.01, 6, 12, Math.PI), mat('#411'), [0, 0.25, 0.3]);
  box(p, mat('#fff'), [0, 0.6, 0.12], [0.36, 0.07, 0.3], [0.2, 0, 0.1]); box(p, mat('#fff'), [-0.1, 0.3, 0.3], [0.14, 0.04, 0.02], [0, 0, 0.7]); box(p, mat('#fff'), [-0.1, 0.3, 0.3], [0.14, 0.04, 0.02], [0, 0, -0.7]);
  cyl(p, mat('#cfe8ff'), [0.1, 0.2, 0.32], 0.012, 0.2, [0, 0, 1.3]); blob(p, mat('#ff4a4a'), [0.2, 0.17, 0.32], [0.03, 0.03, 0.03]);
  p.position.set(0.55, 0, 1.4); p.scale.setScalar(1.1); p.rotation.y = -0.2; scene.add(p); S.mark(p);
  // healing sparkles from door
  for (let i = 0; i < 5; i++) add(scene, new THREE.OctahedronGeometry(0.07), mat('#7dffb0', { emissive: '#3cd98a', emissiveIntensity: 0.6 }), [-0.5 + i * 0.2, 1.4 - Math.abs(i - 2) * 0.15, 0.3 + i * 0.1]);
  S.finish([0.2, 1.3, 5.2], [0.2, 0.8, 0]);

});
