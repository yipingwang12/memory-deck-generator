<!doctype html>
<html><head><meta charset="utf-8"><title>Agios q10</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// The AEGIS shield's AG-236 thins blood packed with too many red cells: polycythaemia vera.
import { THREE, guard, mat, add, blob, box, cyl, rbc, textPlane, makeScene } from './common.js';
import { createAegis } from './aegis.js';
import { createPirateKing, createCrab, createPivotDoor, sickle, platelet } from './props.js';
// shield helper: place + pose + optional reach {hand:'l', to:[x,y,z] world}
function place(scene, S, x, z, ry, sc, reach) {
  const a = createAegis({ scale: sc }); a.position.set(x, 0, z); a.rotation.y = ry; scene.add(a);
  a.userData.pose({ legs: { l: [0.2, 0], r: [-0.15, 0] } });
  if (reach) { a.updateMatrixWorld(true); const t = a.worldToLocal(new THREE.Vector3(...reach.to)); a.userData.reach(reach.hand, [t.x / sc, t.y / sc, t.z / sc]); }
  S.mark(a); return a;
}
guard(() => {
  const S = makeScene({ ground: '#d9b9a0', cover: 1.5 }); const { scene } = S;
  // vessel: pale trough with cells on its front face; packed left, thinned right
  box(scene, mat('#e9bfc0'), [0.1, 0.9, -0.05], [3.5, 0.85, 0.4]);
  box(scene, mat('#9fb6d6'), [0.1, 1.36, 0.05], [3.6, 0.07, 0.5]); box(scene, mat('#9fb6d6'), [0.1, 0.44, 0.05], [3.6, 0.07, 0.5]);
  for (const x of [-1.7, 1.9]) box(scene, mat('#9fb6d6'), [x, 0.9, 0.05], [0.1, 1.0, 0.5]);
  for (let ix = 0; ix < 12; ix++) for (let iy = 0; iy < 4; iy++) { const c = rbc(0.16, iy % 2 ? '#d8283a' : '#e5384a'); c.position.set(-1.55 + ix * 0.17 + (iy % 2) * 0.08, 0.6 + iy * 0.2, 0.17); c.rotation.set(Math.PI / 2 + 0.15 * ((ix + iy) % 3), 0, 0.3 * ix); scene.add(c); }
  for (let ix = 0; ix < 4; ix++) { const c = rbc(0.16, '#e5384a'); c.position.set(0.8 + ix * 0.32, 0.8 + (ix % 2 ? 0.14 : -0.14), 0.17); c.rotation.set(Math.PI / 2, 0, 0.3 * ix); scene.add(c); }
  // vial of AG-236 with dropper above the tube
  const v = new THREE.Group(); cyl(v, mat('#cfe8ff', { transparent: true, opacity: 0.55 }), [0, 0, 0], 0.17, 0.5); cyl(v, mat('#39c1d0'), [0, 0.16, 0], 0.175, 0.2);
  cyl(v, mat('#222'), [0, 0.32, 0], 0.12, 0.1); cyl(v, mat('#39c1d0', { transparent: true, opacity: 0.8 }), [0, -0.05, 0], 0.15, 0.38);
  textPlane(v, 'AG-236', 0.3, 0.15, [0, 0.16, 0.18], { color: '#fff', font: 'bold 100px sans-serif', w: 512, h: 256 });
  v.position.set(0.5, 2.15, 0.1); v.rotation.z = 2.6; v.scale.setScalar(1.4); scene.add(v);
  for (let i = 0; i < 3; i++) blob(scene, mat('#39c1d0'), [0.55 + 0.02 * i, 1.55 - i * 0.2, 0.1], [0.04, 0.06, 0.04]);
  place(scene, S, 2.8, 1.3, -0.3, 1.2, { hand: 'r', to: [1.6, 1.9, 1.0] });
  S.finish([0.1, 1.4, 6.0], [0.1, 1.0, 0]);

});
</script></body></html>
