<html><head><meta charset="utf-8"><title>Agios q08</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// A TEA BAG PIVOT (tebapivat) is the AEGIS shield's next PIRATE KING waker.
import { THREE, guard, mat, add, blob, box, cyl, rbc, textPlane, makeScene } from './common.js';
import { createAegis } from './aegis.js';
import { createPirateKing, createCrab, createPivotDoor, sickle, platelet } from './props.js';
// shield helper: place + pose + optional reach {hand:'l', to:[x,y,z] world}
function place(scene, S, x, z, ry, sc, reach) {
  const a = createAegis({ scale: sc }); a.position.set(x, 0, z); a.rotation.y = ry; scene.add(a);
  a.userData.pose({ legs: { l: [0.2, 0], r: [-0.15, 0] } });
  if (reach) { a.updateMatrixWorld(true); const t = a.worldToLocal(new THREE.Vector3(...reach.to)); a.userData.reach(reach.hand, [t.x / sc, t.y / sc, t.z / sc]); }
  S.mark(a); return a;
}
guard(() => {
  const S = makeScene({ ground: '#e8c9a0', cover: 1.5 }); const { scene } = S;
  // mug + giant tea bag on a pivot pin
  cyl(scene, mat('#f4f1ea'), [0.3, 0.3, 0], 0.4, 0.6); add(scene, new THREE.TorusGeometry(0.17, 0.05, 10, 20, Math.PI * 1.2), mat('#f4f1ea'), [0.72, 0.3, 0], [0, 0, -Math.PI * 0.6]);
  add(scene, new THREE.CircleGeometry(0.37, 28), mat('#a8561f'), [0.3, 0.6, 0], [-Math.PI / 2, 0, 0]);
  const bag = new THREE.Group(); box(bag, mat('#f1e3bf'), [0, 0, 0], [0.55, 0.6, 0.05]); for (const y of [0.3, -0.3]) box(bag, mat('#d3bf8f'), [0, y, 0], [0.57, 0.03, 0.06]);
  box(bag, mat('#c2ab78'), [0, 0, 0.03], [0.4, 0.4, 0.005]); blob(bag, mat('#8bbf5a'), [0, -0.05, 0.04], [0.12, 0.12, 0.01]);
  cyl(bag, mat('#c8ced6', { metalness: 0.7, roughness: 0.3 }), [0, 0, 0.0], 0.07, 0.3, [Math.PI / 2, 0, 0]);
  const tag = box(bag, mat('#e44a4a'), [0.45, 0.62, 0.02], [0.2, 0.26, 0.015], [0, 0, 0.3]); add(bag, new THREE.CylinderGeometry(0.006, 0.006, 0.4, 5), mat('#fff'), [0.25, 0.5, 0.02], [0, 0, -0.9]);
  bag.position.set(0.3, 1.5, 0.1); bag.rotation.z = 0.35; bag.scale.setScalar(1.6); scene.add(bag);
  // pivot swing arc marks
  add(scene, new THREE.TorusGeometry(0.75, 0.02, 6, 30, 1.2), mat('#ffd24a'), [0.3, 1.5, 0.1], [0, 0, 0.3]);
  const king = createPirateKing(); king.position.set(-1.4, 0, 0.5); king.scale.setScalar(1.3); king.rotation.y = 0.6; scene.add(king); S.mark(king);
  for (let i = 0; i < 3; i++) add(scene, new THREE.ConeGeometry(0.03, 0.14, 4), mat('#ffe14a'), [-1.4 + (i - 1) * 0.3, 1.9 + (i === 1 ? 0.1 : 0), 0.5], [0, 0, (i - 1) * 0.5]);
  place(scene, S, -0.4, 1.2, 0.2, 1.3, { hand: 'l', to: [0.0, 1.5, 0.9] });
  S.finish([0, 1.3, 5.4], [0, 1.0, 0]);

});
</script></body></html>
