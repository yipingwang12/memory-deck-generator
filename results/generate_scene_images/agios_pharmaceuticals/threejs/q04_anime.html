<!doctype html>
<html><head><meta charset="utf-8"><title>Agios q04</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// A MIGHTY PIVOT door (mitapivat) is the AEGIS shield's medicine; it wakes the PIRATE KING.
import { THREE, guard, mat, add, blob, box, cyl, rbc, textPlane, makeScene } from './common.js';
import { createAegis } from './aegis.js';
import { createPirateKing, createCrab, createPivotDoor, sickle, platelet } from './props.js';
// shield helper: place + pose + optional reach {hand:'l', to:[x,y,z] world}
function place(scene, S, x, z, ry, sc, reach) {
  const a = createAegis({ scale: sc }); a.position.set(x, 0, z); a.rotation.y = ry; scene.add(a);
  a.userData.pose({ legs: { l: [0.2, 0], r: [-0.15, 0] } });
  if (reach) { a.updateMatrixWorld(true); const t = a.worldToLocal(new THREE.Vector3(...reach.to)); a.userData.reach(reach.hand, [t.x / sc, t.y / sc, t.z / sc]); }
  S.mark(a); return a;
}
guard(() => {
  const S = makeScene({ ground: '#c9a56b', cover: 1.5 }); const { scene } = S;
  const door = createPivotDoor({ open: 0.35 }); door.position.set(1.2, 0, 0); door.scale.setScalar(1.5); scene.add(door); S.mark(door);
  const king = createPirateKing(); king.position.set(-1.1, 0, 0.2); king.scale.setScalar(1.4); king.rotation.y = 0.7; scene.add(king); S.mark(king);
  for (let i = 0; i < 3; i++) add(scene, new THREE.ConeGeometry(0.03, 0.14, 4), mat('#ffe14a'), [-1.1 + (i - 1) * 0.3, 1.95 + (i === 1 ? 0.1 : 0), 0.2], [0, 0, (i - 1) * 0.5]);
  place(scene, S, -0.1, 1.0, 0.3, 1.3, { hand: 'l', to: [0.7, 0.85, 1.0] });
  S.finish([0, 1.1, 5.2], [0, 0.85, 0]);

});
</script></body></html>
