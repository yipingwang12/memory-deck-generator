<html><head><meta charset="utf-8"><title>Zander q01 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q01 - The ZANDER swims between a COT on a BUS (Cottbus) and a blue DELFT plate.
import * as K from './props.js';
const { THREE, guard, rng, mat, add, blob, box, cyl, limbBetween, textPlane, canvasTexture, createZander, setup, ground, finish, camera, buildBus, buildCot, buildDelftPlate, buildEEGCap, buildBrain, wave, sineWave, buildMicroscope, buildJaguar, buildCrown, buildRobot, buildCoin, buildMouse, buildFrau, buildHay } = K;
guard(() => {
  const P = new URLSearchParams(location.search);
  const { stage, scene, num } = setup(P, {});
  ground(scene, '#78b05a');
  add(scene, new THREE.PlaneGeometry(400, 3), mat('#6b6f7a'), [0, 0.002, -1.1], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(9.5, 2.6), mat('#3fa5e8', { roughness: 0.2 }), [0, 0.004, 1.0], [-Math.PI / 2, 0, 0]);
  const bus = buildBus(); bus.position.set(-3.0, 0, -0.7); bus.rotation.y = 0.12; scene.add(bus);
  const cot = buildCot(); cot.position.set(-3.0, 1.15, -0.7); cot.rotation.y = 0.12; cot.scale.setScalar(1.8); scene.add(cot);
  const plate = buildDelftPlate(); plate.scale.setScalar(1.5); plate.position.set(3.0, 1.2, -0.4); plate.rotation.y = -0.3; scene.add(plate);
  box(scene, '#8a5a2c', [3.1, 0.05, -0.45], [1.1, 0.1, 0.5]);
  box(scene, '#8a5a2c', [3.35, 0.7, -0.75], [0.08, 1.4, 0.08], [0.3, 0, 0]);
  const wrap = new THREE.Group(); wrap.position.set(num('zx', 0.1), num('zy', 1.35), 0.5); scene.add(wrap);
  const z = createZander({ scale: 2.1 }); z.position.y = -1.05; wrap.add(z); wrap.rotation.z = -1.25;
  z.userData.pose({ headTilt: 1.2, arms: { l: [0.2, 1.0, 0.3], r: [0.2, -1.0, 0.3] }, legs: { l: [0.2, 0.5], r: [-0.1, -0.4] } });
  const r = rng(2); for (let i = 0; i < 9; i++) blob(scene, mat('#d9f2ff', { transparent: true, opacity: 0.7 }), [-1.4 + r() * 2.8, 0.5 + r() * 1.3, 0.9 + r() * 0.8], [0.06, 0.06, 0.06].map((v) => v * (0.5 + r())));
  camera(stage, num, { c: [0, 1.5, 6.4], t: [0, 1.05, 0] });
  finish(stage, [z]);

});
</script></body></html>
