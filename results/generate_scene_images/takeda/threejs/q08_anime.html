<!doctype html>
<html><head><meta charset="utf-8"><title>Takeda q08</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q08 — 247 TACO workers lose their jobs in Cambridge.
import { THREE, guard, createTaco, mat, add, box, cyl, ball, textPlane, setup, wrap } from './common.js';
guard(() => {
  const { stage, scene, num } = setup({ ground: '#b9b2a6', sky: { cover: 2 } });
  add(scene, new THREE.PlaneGeometry(400, 4), mat('#4a4d55'), [0, 0.004, 1.5], [-Math.PI / 2, 0, 0]);
  // brick building with door + sign
  box(scene, 6.2, 4.6, 2.4, '#b8573a', [-3.6, 2.3, -3.5]);
  for (let r = 0.4; r < 4.6; r += 0.4) box(scene, 6.25, 0.04, 2.45, '#8f3f2a', [-3.6, r, -3.5]);
  for (const x of [-5.6, -4.4, -2.8, -1.6]) for (const y of [1.6, 3.4]) box(scene, 0.8, 0.9, 0.06, '#bfe2f5', [x, y, -2.28]);
  box(scene, 1.0, 1.6, 0.08, '#4b2e1f', [-3.6, 0.8, -2.26]);
  // big 247 sign
  cyl(scene, 0.05, 0.05, 3.0, '#555', [2.3, 1.5, -1.0]);
  box(scene, 2.6, 1.3, 0.1, '#d8321f', [2.3, 3.2, -1.0]);
  const t = textPlane('247', 2.4, 1.2, { bg: '#d8321f', fg: '#ffffff', px: 340 }); t.position.set(2.3, 3.2, -0.94); scene.add(t);
  // line of mini tacos carrying boxes toward the right
  const chars = [];
  for (let i = 0; i < 9; i++) {
    const m = createTaco({ scale: 0.7 }); m.position.set(-3.8 + i * 0.55, 0, 0.6 + (i % 3) * 0.28); m.rotation.y = 0.3;
    m.userData.setFilling(false); m.userData.pose({ arms: { l: [0, 2.4, 0.4], r: [0, 2.4, 0.4] } }); scene.add(m); chars.push(m);
    box(m.userData.parts.torso.children[0], 0.5, 0.28, 0.36, '#c9a06a', [0, 0.88, 0]);
  }
  // flying pink slips
  for (let i = 0; i < 12; i++) add(scene, new THREE.PlaneGeometry(0.28, 0.2), new THREE.MeshStandardMaterial({ color: '#ff9fb5', side: THREE.DoubleSide }), [-3 + i * 0.7, 1.9 + (i % 4) * 0.45, 0.2 + (i % 3) * 0.4], [0.8 * i, 0.6 * i, 0.3 * i]);
  // main sad taco
  const taco = createTaco({ scale: 2.0 }); taco.position.set(1.9, 0, 1.6); taco.rotation.y = -0.3; scene.add(taco); chars.push(taco);
  taco.userData.pose({ lean: 0.1, headTilt: -0.1, arms: { l: [0, 0.5, 0.3], r: [0, 0.5, 0.3] } });
  wrap(stage, chars, [num('cx', 0), num('cy', 2.3), num('cz', 10)], [num('tx', -0.2), num('ty', 1.7), 0]);
});
</script></body></html>
