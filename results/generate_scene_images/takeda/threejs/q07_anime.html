<!doctype html>
<html><head><meta charset="utf-8"><title>Takeda q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — The TACO throws out its CELL THERAPY filling.
import { THREE, guard, createTaco, mat, add, box, cyl, ball, setup, wrap } from './common.js';
guard(() => {
  const { stage, scene, num } = setup({ ground: '#cfd8e8' });
  // trash bin with open lid
  const bin = new THREE.Group(); bin.position.set(2.6, 0, 0); scene.add(bin);
  cyl(bin, 0.62, 0.5, 1.3, '#5a6b7c', [0, 0.65, 0]); for (const y of [0.3, 0.65, 1.0]) cyl(bin, 0.6 + (y - 0.3) * 0.1, 0.6 + (y - 0.3) * 0.1, 0.05, '#46566a', [0, y, 0]);
  cyl(bin, 0.55, 0.55, 0.04, '#1b1f27', [0, 1.3, 0]);
  const lid = cyl(bin, 0.66, 0.66, 0.07, '#46566a', [0.55, 1.6, 0], [0, 0, 1.2]); lid.position.set(0.7, 1.55, 0);
  // cell: translucent pink body, nucleus, organelles, syringe
  const cell = new THREE.Group(); cell.position.set(0.9, 2.5, 0.2); scene.add(cell);
  add(cell, new THREE.SphereGeometry(0.55, 40, 24), new THREE.MeshStandardMaterial({ color: '#ff8fb8', transparent: true, opacity: 0.85, roughness: 0.3 }));
  ball(cell, 0.22, '#7a3fbf', [0.08, 0.05, 0.25]); ball(cell, 0.07, '#ffe36b', [-0.25, -0.15, 0.35]); ball(cell, 0.06, '#7fe0c0', [-0.15, 0.25, 0.38]); ball(cell, 0.05, '#ffe36b', [0.3, -0.25, 0.3]);
  const syr = new THREE.Group(); syr.position.set(-0.45, 0.35, 0.2); syr.rotation.z = 0.9; cell.add(syr);
  cyl(syr, 0.07, 0.07, 0.5, '#e9f6ff', [0, 0.45, 0]); cyl(syr, 0.01, 0.01, 0.35, '#ccc', [0, 0.05, 0]); cyl(syr, 0.03, 0.03, 0.25, '#d8321f', [0, 0.82, 0]); box(syr, 0.28, 0.03, 0.05, '#e9f6ff', [0, 0.7, 0]);
  // motion trail
  [[-0.2, 1.7, 0.4, 0.14], [-0.8, 1.55, 0.5, 0.1], [-1.3, 1.3, 0.5, 0.07]].forEach(([x, y, z, r]) => ball(scene, r, '#ffb3cf', [x + 0.5, y + 0.6, z]));
  // taco, filling left behind in lettuce only
  const taco = createTaco({ scale: 2.2 }); taco.position.set(-2.6, 0, 0.4); taco.rotation.y = 0.2; scene.add(taco);
  taco.userData.pose({ lean: -0.12, arms: { l: [0, 2.7, 0.2] } }); taco.userData.reach('r', [0.6, 0.9, 0.2]);
  taco.userData.pose({ lean: -0.12, arms: { l: [0, 2.6, 0.2] } });
  taco.updateMatrixWorld(true); const p = taco.worldToLocal(new THREE.Vector3(-1.4, 2.6, 0.9)); taco.userData.reach('r', [p.x, p.y, p.z]);
  wrap(stage, [taco], [num('cx', 0), num('cy', 2.3), num('cz', 9)], [num('tx', 0), num('ty', 1.9), 0]);
});
</script></body></html>
