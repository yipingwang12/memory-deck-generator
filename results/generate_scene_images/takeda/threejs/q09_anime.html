<!doctype html>
<html><head><meta charset="utf-8"><title>Takeda q09</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q09 — A NUN announces the TACO's new campus.
import { THREE, guard, createTaco, mat, add, box, cyl, ball, eyes, setup, wrap } from './common.js';
guard(() => {
  const { stage, scene, num } = setup({ ground: '#a8d476' });
  // nun: black habit, white coif, big cross, megaphone
  const nun = new THREE.Group(); const black = mat('#1d1d24'), white = mat('#ffffff');
  cyl(nun, 0.14, 0.38, 0.85, black, [0, 0.43, 0]); cyl(nun, 0.2, 0.2, 0.06, white, [0, 0.78, 0.0]);
  ball(nun, 0.2, white, [0, 0.98, -0.02], [1.05, 1.1, 1.0]); ball(nun, 0.17, '#ffd9b8', [0, 0.97, 0.05], [0.95, 1.0, 0.9]);
  eyes(nun, 0.98, 0.2, 0.065, 0.028);
  ball(nun, 0.215, black, [0, 1.05, -0.06], [1.05, 0.95, 1]); box(nun, 0.34, 0.06, 0.05, white, [0, 1.12, 0.14]);
  box(nun, 0.05, 0.22, 0.03, '#f2c230', [0, 0.65, 0.3]); box(nun, 0.14, 0.05, 0.03, '#f2c230', [0, 0.69, 0.3]);
  const arms = {};
  for (const s of [-1, 1]) { const a = new THREE.Group(); a.position.set(s * 0.17, 0.75, 0); cyl(a, 0.045, 0.04, 0.3, black, [0, -0.15, 0]); ball(a, 0.045, '#ffd9b8', [0, -0.32, 0]); nun.add(a); arms[s > 0 ? 'l' : 'r'] = a; }
  arms.l.rotation.z = -1.0; arms.r.rotation.set(-0.6, 0, 0.5);
  const mega = new THREE.Group(); mega.position.set(-0.34, 0.97, 0.22); mega.rotation.set(0, 0, Math.PI / 2 + 0.25); nun.add(mega);
  cyl(mega, 0.2, 0.06, 0.34, '#e6392b', [0, 0.1, 0]); cyl(mega, 0.06, 0.06, 0.12, '#555', [0, -0.12, 0]);
  nun.scale.setScalar(2.3); nun.position.set(-2.3, 0, 0.4); nun.rotation.y = 0.35; scene.add(nun);
  // campus model on a pedestal with ribbon + sparkle stars
  const ped = new THREE.Group(); ped.position.set(2.7, 0, -0.5); scene.add(ped);
  cyl(ped, 1.2, 1.3, 0.5, '#d9d2c3', [0, 0.25, 0]);
  const glass = mat('#7fc8ee', { metalness: 0.3, roughness: 0.2 });
  box(ped, 0.8, 0.7, 0.6, glass, [-0.4, 0.85, 0]); box(ped, 0.7, 1.1, 0.6, '#c8603f', [0.4, 1.05, 0]); box(ped, 0.5, 0.45, 0.5, glass, [0, 0.72, 0.5]);
  for (const x of [-0.6, 0.2, 0.6]) box(ped, 0.12, 0.12, 0.02, '#fff', [x, 1.0 + (x > 0 ? 0.3 : 0), 0.32]);
  cyl(ped, 0.02, 0.02, 0.9, '#ccc', [0.95, 1.0, 0.6]); box(ped, 0.5, 0.25, 0.02, '#e6392b', [1.2, 1.35, 0.6]);
  for (let i = 0; i < 6; i++) add(scene, new THREE.OctahedronGeometry(0.09), mat('#ffd84a', { emissive: '#ffb300', emissiveIntensity: 0.5 }), [0 + i * 0.55 - 0.3, 3.1 + (i % 2) * 0.4, -0.2]);
  const taco = createTaco({ scale: 2.0 }); taco.position.set(0.1, 0, 1.8); taco.rotation.y = -0.1; scene.add(taco);
  taco.userData.pose({ arms: { l: [0, 2.3, 0.3], r: [0, 0.5, 0] } });
  wrap(stage, [nun, taco], [num('cx', 0), num('cy', 2.2), num('cz', 9.5)], [num('tx', 0.3), num('ty', 1.7), 0]);
});
</script></body></html>
