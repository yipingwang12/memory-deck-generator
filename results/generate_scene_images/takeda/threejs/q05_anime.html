<!doctype html>
<html><head><meta charset="utf-8"><title>Takeda q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — A BIOMED REALTY agent builds the TACO's campus.
import { THREE, guard, createTaco, mat, add, box, cyl, ball, textPlane, person, setup, wrap } from './common.js';
guard(() => {
  const { stage, scene, num } = setup({ ground: '#a8d476' });
  // campus under construction
  const glass = mat('#7fc8ee', { metalness: 0.3, roughness: 0.2 });
  box(scene, 3.4, 2.2, 2.2, glass, [1.8, 1.1, -3.5]); box(scene, 3.4, 1.0, 2.2, '#cfd8e0', [1.8, 2.7, -3.5]);
  for (let x = 0.3; x < 3.4; x += 0.9) cyl(scene, 0.04, 0.04, 3.4, '#f5c400', [x, 1.7, -2.3]);
  box(scene, 3.4, 0.06, 0.06, '#f5c400', [1.8, 3.4, -2.3]); box(scene, 3.4, 0.06, 0.06, '#f5c400', [1.8, 2.0, -2.3]);
  // bio-med sign: board with DNA helix + red cross + house
  cyl(scene, 0.05, 0.05, 2.2, '#555', [-2.9, 1.1, -0.5]); cyl(scene, 0.05, 0.05, 2.2, '#555', [-0.9, 1.1, -0.5]);
  box(scene, 2.6, 1.6, 0.1, '#ffffff', [-1.9, 2.3, -0.5]);
  const helix = new THREE.Group(); helix.position.set(-2.6, 2.3, -0.4); scene.add(helix);
  for (let i = 0; i < 24; i++) { const t = i / 23 * 4 * Math.PI, y = (i / 23 - 0.5) * 1.3; ball(helix, 0.06, '#e63b8a', [Math.cos(t) * 0.18, y, Math.sin(t) * 0.12]); ball(helix, 0.06, '#2a7fe0', [-Math.cos(t) * 0.18, y, -Math.sin(t) * 0.12]); if (i % 2 === 0) cyl(helix, 0.015, 0.015, 0.36, '#ddd', [0, y, 0], [0, 0, Math.PI / 2]); }
  box(scene, 0.8, 0.26, 0.06, '#e0262d', [-1.55, 2.4, -0.4]); box(scene, 0.26, 0.8, 0.06, '#e0262d', [-1.55, 2.4, -0.4]);
  box(scene, 0.55, 0.4, 0.06, '#f3c14a', [-1.55, 1.85, -0.4]); add(scene, new THREE.ConeGeometry(0.42, 0.28, 4), mat('#c8603f'), [-1.55, 2.2 - 0.0 - 0.0, -0.4], [0, Math.PI / 4, 0], [1, 1, 0.1]).position.y = 2.06;
  // agent: suit, tie, hard hat, key + trowel
  const agent = person({ body: '#26324f', scale: 1.9, hair: null }); agent.position.set(-0.2, 0, 1.4); agent.rotation.y = 0.2; scene.add(agent);
  const hat = ball(agent, 0.19, '#ffd21a', [0, 0.97, 0], [1, 0.8, 1]); cyl(agent, 0.23, 0.23, 0.03, '#ffd21a', [0, 0.92, 0.03]);
  box(agent, 0.05, 0.28, 0.02, '#d8321f', [0, 0.58, 0.17]);
  agent.userData.arms.l.rotation.z = -2.3; agent.userData.arms.r.rotation.set(-0.8, 0, 0.2);
  box(agent.userData.arms.r, 0.14, 0.1, 0.07, '#c8603f', [0, -0.4, 0.03]);
  const taco = createTaco({ scale: 1.8 }); taco.position.set(2.8, 0, 1.2); taco.rotation.y = -0.35; scene.add(taco);
  taco.userData.pose({ arms: { l: [0, 2.2, 0.2], r: [0, 0.6, 0] } });
  wrap(stage, [agent, taco], [num('cx', 0.6), num('cy', 2.5), num('cz', 10)], [num('tx', 0.4), num('ty', 1.8), 0]);
});
</script></body></html>
