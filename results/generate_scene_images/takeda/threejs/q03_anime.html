<!doctype html>
<html><head><meta charset="utf-8"><title>Takeda q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q03 — The TACO builds ONE CAMBRIDGE CAMPUS.
import { THREE, guard, createTaco, mat, add, box, cyl, ball, textPlane, setup, wrap } from './common.js';
guard(() => {
  const { stage, scene, num } = setup({ ground: '#9ed27a' });
  // campus buildings: glass + brick
  const glass = mat('#7fc8ee', { metalness: 0.3, roughness: 0.2 }), brick = mat('#c8603f');
  const bld = (x, z, w, h, d, c) => { box(scene, w, h, d, c, [x, h / 2, z]); for (let r = 1; r < h; r += 0.9) box(scene, w + 0.02, 0.07, d + 0.02, '#ffffff', [x, r, z]); };
  bld(-3.6, -3, 2.6, 3.2, 2, glass); bld(0.6, -4.5, 3, 4.5, 2.2, brick); bld(4.2, -3, 2.4, 2.4, 2, glass);
  // giant "1" built from boxes
  const one = mat('#ffb800', { roughness: 0.4 });
  box(scene, 0.55, 2.6, 0.5, one, [2.0, 1.3, 0.2]); box(scene, 0.95, 0.5, 0.5, one, [2.0, 0.25, 0.2]);
  box(scene, 0.55, 0.9, 0.5, one, [1.7, 2.35, 0.2], [0, 0, 0.9]);
  // scaffold + crane
  cyl(scene, 0.08, 0.08, 6.5, '#f5c400', [-6, 3.25, -2]); box(scene, 5, 0.12, 0.12, '#f5c400', [-3.8, 6.4, -2]);
  cyl(scene, 0.015, 0.015, 2.6, '#333', [-2.2, 5.1, -2]); box(scene, 0.8, 0.8, 0.8, '#c8603f', [-2.2, 3.7, -2]);
  // brick stack
  for (let i = 0; i < 6; i++) box(scene, 0.5, 0.2, 0.25, '#c8603f', [-1.2 + (i % 3) * 0.52, 0.1 + Math.floor(i / 3) * 0.21, 0.8]);
  // taco with hard hat
  const taco = createTaco({ scale: 2.2 }); taco.position.set(-0.2, 0, 1.2); scene.add(taco);
  const hat = new THREE.Group(); const hy = 0.78;
  ball(hat, 0.3, '#ffd21a', [0, hy - 0.02, 0], [1, 0.75, 1]); cyl(hat, 0.36, 0.36, 0.04, '#ffd21a', [0, hy - 0.08, 0.04]);
  taco.userData.parts.torso.children[0].add(hat);
  taco.userData.pose({ arms: { l: [0, 2.0, 0.3] } }); taco.userData.reach('r', [-0.5, 0.2, 0.5]);
  wrap(stage, [taco], [num('cx', 0), num('cy', 2.6), num('cz', 10.5)], [num('tx', 0), num('ty', 2.2), 0]);
});
</script></body></html>
