<html><head><meta charset="utf-8"><title>Piramidal q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as C from './common.js';
const { THREE, mat, add, blob, box, cyl, rod, tube, boot, look, ground, room, textTex, flag, createPiranha, createDoctor, createBed, createMonitor, createBrain, chibiHead, eegTexture, rng } = C;
// q07: the PIRANHA's first job: a COPILOT that helps doctors diagnose epilepsy.
boot({ clouds: [[150, 900, 90, 1.2], [168, 1300, 200, 2.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9], [252, 900, 80, 1.1]] }, ({ stage, scene, num, mark }) => {
  const dk = mat('#566176'), seat = mat('#3a5a9a');
  box(scene, dk, [0, .3, .5], [4.6, .6, .6]); box(scene, mat('#7a859a'), [0, .65, .5], [4.6, .12, .7]);
  box(scene, mat('#2b3446'), [0, -.1, 0], [5, .2, 2]);
  for (const x of [-.95, .95]) { box(scene, seat, [x, 1.3, -.45], [.9, 1.6, .2]); box(scene, seat, [x, .45, 0], [.9, .2, .9]); }
  for (const s of [-1, 1]) { box(scene, dk, [s * 2.45, 1.8, .0], [.14, 3.8, .14], [0, 0, s * -.08]); }
  box(scene, dk, [0, 3.8, 0], [5.1, .14, .14]);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.1, .45), new THREE.MeshBasicMaterial({ map: eegTexture() })); scr.position.set(0, .42, .81); scene.add(scr);
  box(scene, mat('#14181f'), [0, .3, .8], [1.2, .5, .02]);
  const br = createBrain({ scale: 1.5 }); br.position.set(0, 1.45, .45); scene.add(br); mark(br);
  const yoke = (x) => { const g = new THREE.Group(); g.position.set(x, 1.25, .33); scene.add(g); cyl(g, dk, [0, -.15, 0], .03, .3); add(g, new THREE.TorusGeometry(.17, .025, 10, 28), mat('#14181f'), [0, .08, 0]); box(g, mat('#14181f'), [0, .08, 0], [.34, .03, .03]); };
  yoke(-.95); yoke(.95);
  const doc = createDoctor({ scale: 1.5, glasses: true }); doc.position.set(-.95, .6, 0); scene.add(doc); mark(doc);
  doc.userData.arms.l.rotation.set(-1.4, 0, -.1); doc.userData.arms.r.rotation.set(-1.4, 0, .1);
  const p = createPiranha({ scale: 1.55 }); p.position.set(.95, .6, 0); scene.add(p); mark(p);
  p.userData.pose({ jaw: .05 }); p.updateMatrixWorld(true);
  const hand = (v) => { const t = p.worldToLocal(new THREE.Vector3(...v)); return [t.x, t.y, t.z]; };
  p.userData.reach('l', hand([1.12, 1.4, .38])); p.userData.reach('r', hand([.78, 1.4, .38]));
  const dm = mat('#1d1d26'), pp = p.userData.parts.head;
  add(pp, new THREE.TorusGeometry(.35, .02, 8, 28, Math.PI), dm, [0, .52, 0]);
  for (const s of [-1, 1]) { cyl(pp, dm, [s * .35, .56, 0], .07, .08, [0, 0, Math.PI / 2]); cyl(pp, mat('#e8492f'), [s * .385, .56, 0], .05, .03, [0, 0, Math.PI / 2]); }
  C.tube(pp, [[.38, .56, 0], [.36, .5, .2], [.22, .42, .3]], .008, dm, 20);
  blob(pp, mat('#e8492f'), [.2, .42, .31], [.025, .025, .025]);
  const pl = new THREE.Mesh(new THREE.PlaneGeometry(1.0, .26), new THREE.MeshBasicMaterial({ map: textTex('COPILOT', { w: 768, h: 200, bg: '#f2b632', fg: '#1d1d26', size: 120 }) }));
  pl.position.set(1.4, .3, .83); scene.add(pl);
  look(stage, num, [0, 1.8, 4.6], [0, 1.45, 0]);
});

</script></body></html>
