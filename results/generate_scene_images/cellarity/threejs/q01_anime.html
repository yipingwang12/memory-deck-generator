// q01 - A DOG digs the CELLAR inside Flagship's lab.
import * as C from './common.js';
const { THREE, mat, add, blob, cyl, box, put, arrow, guard } = C;
guard(() => {

const S = C.makeScene({ room: 'cellar' }); const sc = S.scene;
box(sc, mat('#6a4a30'), 6, 0.9, 0.6, [0.5, 0.45, -2.5]);
for (const [x, s] of [[-1.2, 0.8], [0, 1.0], [1.3, 0.8], [2.3, 0.7]]) put(sc, C.flask(), x, 0.9, -2.5, s);
S.cellar({ pos: [-1.9, 0, 0.2], scale: 1.6, ry: 0.4, pose: { arms: { l: [0, 0.5], r: [-0.4, 0.3] } } });
const d = C.dog({ coat: '#d99a55', snout: 0.0 }); put(sc, d, 1.2, 0, 0.5, 1.8, Math.PI + 0.25); d.userData.head.rotation.z = -0.7; d.userData.tail.rotation.z = 0.4;
put(sc, C.dirt(18, 4, 0.7), -0.2, 0, 0.9, 1);
put(sc, C.dirt(10, 8, 0.5), 2.1, 0.5, 0.4, 1);
blob(sc, mat('#2a1a10'), [0.3, 0.01, 0.8], [0.6, 0.01, 0.4]);
S.done({ cam: [0, 1.2, 5.0], look: [0, 0.75, 0] });
});
