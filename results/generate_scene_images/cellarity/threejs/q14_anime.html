</head><body><script type="module">
// q14 - A TONGUE licks coins into the CELLAR's Series C crate.
import * as C from './common.js';
const { THREE, mat, add, blob, cyl, box, put, arrow, guard } = C;
guard(() => {

const S = C.makeScene({ room: 'cellar' }); const sc = S.scene;
S.cellar({ pos: [-2.5, 0, 0.1], scale: 1.6, ry: 0.4, pose: { arms: { l: [0, 0.5], r: [-0.6, 0.3] } } });
put(sc, C.tongue(), -1.0, 0.7, 0.3, 1.0, 0);
put(sc, C.crate('C'), 1.7, 0, 0.3, 1.3, -0.1);
for (const [x, y, z, r] of [[0.0, 1.7, 0.6, 0.2], [0.5, 1.7, 0.7, 0.3], [0.95, 1.85, 0.7, 0.8], [1.2, 1.5, 0.7, 1.2], [1.6, 1.25, 0.6, 0.4]]) { const c = C.coin(0.16); c.position.set(x, y, z); c.rotation.set(1.2, r, 0.3); sc.add(c); }
for (let i = 0; i < 6; i++) { const c = C.coin(0.15); c.position.set(1.3 + (i % 3) * 0.28, 1.06 + Math.floor(i / 3) * 0.05, 0.5 + (i % 2) * 0.2); c.rotation.set(0.1, i, 0); sc.add(c); }
S.done({ cam: [0, 1.25, 5.6], look: [0, 0.9, 0] });
});
