<!doctype html>
<html><head><meta charset="utf-8"><title>Cellar anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createCellar } from './cellar.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.4, fog: { near: 120, far: 1500 } });
  const g = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#6fae45' })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; stage.scene.add(g);
  const views = [[-1.1, 0.9], [0, 0], [1.1, 2.4]];
  views.forEach(([x, ry], i) => {
    const c = createCellar({ scale: 1.5 }); c.position.set(x * 1.6 + (i - 1) * 0.0, 0, 0); c.rotation.y = ry;
    c.userData.pose({ arms: { l: [-0.6, 0.5], r: [0, 0.3] } });
    stage.scene.add(c); const s = new Set(); c.traverse((o) => s.add(o)); stage.toonify(stage.scene, (m) => s.has(m));
  });
  stage.camera.position.set(0, 1.0, 6.5); stage.camera.lookAt(0, 0.8, 0); stage.finish();
});
</script></body></html>
