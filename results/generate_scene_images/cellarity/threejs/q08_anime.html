<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q08 - One cell at a time, the CELLAR reads every RNA transcript.
import * as C from './common.js';
const { THREE, mat, add, blob, cyl, box, put, arrow, guard } = C;
guard(() => {

const S = C.makeScene({ room: 'cellar' }); const sc = S.scene;
S.cellar({ pos: [-2.0, 0, 0.2], scale: 1.6, ry: 0.4, pose: { arms: { l: [0, 0.5], r: [-0.6, 0.4] } } });
put(sc, C.cell({ r: 0.55 }), 0.2, 0.55, 0.2, 1);
const m = C.magnifier(2.1); m.position.set(0.2, 1.3, 0.9); sc.add(m);
const cols = ['#ffd23a', '#ff7a5a', '#6ad0ff'];
for (let i = 0; i < 3; i++) { const s = C.rnaStrand(1.3, i + 1, cols[i]); s.position.set(1.95, 0.6 + i * 0.5, 0.2); s.scale.setScalar(1.0); sc.add(s); }
S.done({ cam: [0, 1.2, 5.0], look: [0, 0.9, 0] });
});
</script></body></html>
