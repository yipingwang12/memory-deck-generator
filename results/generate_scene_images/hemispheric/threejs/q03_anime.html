<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { THREE, makeScene, mat, add, blob, cyl, rng, canvasTexture, sign, createDescartes, createClock, createCoinPile, reachWorld } from "./common.js";
import { guard } from "./kit.js";
import { createGlobe } from "./globe.js";
guard(() => {
  // q03 — The GLOBE's CTO once built a REAL FACE mask company: RealFace.
  const S = makeScene({ ground: '#c9c3d6', sky: { cover: 1 } }), scene = S.scene;
  const wall = add(scene, new THREE.PlaneGeometry(14, 5), mat('#f4efe6'), [0, 2.4, -1.4]);
  const mask = (c = '#f0c7a0') => {
    const m = new THREE.Group(), skin = mat(c, { roughness: 0.5 });
    blob(m, skin, [0, 0, 0], [0.2, 0.27, 0.07]);
    for (const s of [-1, 1]) { blob(m, mat('#2a1a14'), [s * 0.075, 0.06, 0.055], [0.04, 0.025, 0.02]); add(m, new THREE.BoxGeometry(0.08, 0.012, 0.01), mat('#4a2e1c'), [s * 0.075, 0.115, 0.06], [0, 0, -s * 0.18]); blob(m, mat('#ff9aa5'), [s * 0.12, -0.05, 0.055], [0.04, 0.025, 0.012]); }
    blob(m, skin, [0, -0.02, 0.09], [0.028, 0.06, 0.03]); blob(m, mat('#b84a55'), [0, -0.12, 0.065], [0.06, 0.018, 0.02]);
    return m;
  };
  const masks = ['#f0c7a0', '#e0a97c', '#c98c5e', '#f7d9bd', '#a96f45'];
  masks.forEach((c, i) => { const m = mask(c); m.position.set(-2.1 + i * 1.05, 1.55 + (i % 2) * 0.05, -1.3); m.scale.setScalar(1.15); scene.add(m); });
  add(scene, new THREE.BoxGeometry(5.6, 0.05, 0.25), mat('#8a5a34'), [0, 1.27, -1.27]);
  const board = sign('RealFace', 2.6, 0.6, '#1d2a4a', '#ffffff', 0.5); board.position.set(0, 2.05, -1.35); scene.add(board);
  const globe = createGlobe({ scale: 1.5 }); globe.position.set(-0.55, 0, 0.3); globe.rotation.y = 0.25; scene.add(S.character(globe));
  const held = mask('#f0c7a0'); held.scale.setScalar(1.7); held.position.set(0.6, 0.72, 0.65); held.rotation.y = -0.25; scene.add(held);
  globe.userData.pose({ arms: { r: [0, 0.5, 0] } }); reachWorld(globe, 'l', [0.1, 0.72, 0.62]);
  const CAM = { ty: 0.8 };
  const C = { cx: 0.2, cy: 0.85, cz: 3.6, tx: 0.2, ty: 0.55, ...(typeof CAM !== 'undefined' ? CAM : {}) };
  S.finish([S.num('cx', C.cx), S.num('cy', C.cy), S.num('cz', C.cz)], [S.num('tx', C.tx), S.num('ty', C.ty), 0]);
});
