<html><head><meta charset="utf-8"><title>Hemispheric q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { THREE, makeScene, mat, add, blob, cyl, rng, canvasTexture, sign, createDescartes, createClock, createCoinPile, reachWorld } from "./common.js";
import { guard } from "./kit.js";
import { createGlobe } from "./globe.js";
guard(() => {
  // q07 — A DOLL wears the GLOBE's dry EEG headset for about fifteen minutes.
  const S = makeScene({ ground: '#e8c9a0', sky: { cover: 1 } }), scene = S.scene;
  const doll = new THREE.Group(), porc = mat('#fde4d0', { roughness: 0.35 }), dress = mat('#4a7fe0');
  add(doll, new THREE.LatheGeometry([[0, 0], [0.26, 0], [0.2, 0.2], [0.09, 0.42], [0, 0.43]].map(([x, y]) => new THREE.Vector2(x, y)), 28), dress, [0, 0.2, 0]);
  add(doll, new THREE.TorusGeometry(0.1, 0.03, 8, 24), mat('#fff'), [0, 0.62, 0], [Math.PI / 2, 0, 0]);
  for (const s of [-1, 1]) { cyl(doll, mat('#fdf2e4'), 0.04, 0.04, 0.22, [s * 0.08, 0.1, 0.02]); blob(doll, mat('#c8283c'), [s * 0.08, 0.0, 0.06], [0.06, 0.04, 0.09]); cyl(doll, dress, 0.035, 0.03, 0.2, [s * 0.18, 0.5, 0.03], [0, 0, s * 0.3]); blob(doll, porc, [s * 0.215, 0.39, 0.03], [0.035, 0.035, 0.035]); }
  const head = new THREE.Group(); head.position.y = 0.82; doll.add(head);
  blob(head, porc, [0, 0, 0], [0.2, 0.2, 0.19]);
  const hair = mat('#b8541f'); blob(head, hair, [0, 0.07, -0.05], [0.215, 0.18, 0.19]);
  for (const s of [-1, 1]) {
    blob(head, hair, [s * 0.22, -0.12, -0.02], [0.06, 0.18, 0.06]); blob(head, mat('#e0245e'), [s * 0.2, 0.1, 0.02], [0.07, 0.05, 0.04]);
    blob(head, mat('#fff'), [s * 0.075, -0.01, 0.17], [0.05, 0.065, 0.015]); blob(head, mat('#2a6fd6'), [s * 0.075, -0.015, 0.183], [0.036, 0.05, 0.012]); blob(head, mat('#fff'), [s * 0.068, 0.012, 0.196], [0.012, 0.012, 0.006]);
    blob(head, mat('#ff8fa0'), [s * 0.12, -0.08, 0.165], [0.04, 0.024, 0.01]);
  }
  blob(head, mat('#d83a56'), [0, -0.11, 0.18], [0.03, 0.018, 0.012]);
  // dry EEG headset: band over the crown, spring-pin electrodes, ear pads, cable to a box
  const band = mat('#222a38'), gold = mat('#f4c430', { metalness: 0.7, roughness: 0.3 });
  const arc = add(head, new THREE.TorusGeometry(0.235, 0.014, 8, 40, Math.PI), band, [0, 0, 0], [0, Math.PI / 2, 0]); arc.rotation.set(0, 0, 0); arc.rotation.y = Math.PI / 2;
  for (let i = 0; i < 5; i++) {
    const a = (i / 4) * Math.PI * 0.8 + Math.PI * 0.1, p = new THREE.Vector3(0, Math.sin(a), Math.cos(a));
    for (const dx of [-0.07, 0.07]) { const pin = add(head, new THREE.CylinderGeometry(0.012, 0.012, 0.07, 8), gold, [dx, p.y * 0.2, p.z * 0.2 - 0.03]); pin.position.set(dx, p.y * 0.215, p.z * 0.215); pin.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p); blob(head, mat('#fff'), [dx, p.y * 0.255, p.z * 0.255], [0.014, 0.014, 0.014]); }
  }
  for (const s of [-1, 1]) blob(head, mat('#2a6fd6'), [s * 0.235, -0.02, 0], [0.05, 0.08, 0.07]);
  const box = add(doll, new THREE.BoxGeometry(0.16, 0.1, 0.07), mat('#27e0ff', { emissive: '#27e0ff', emissiveIntensity: 0.35 }), [0.14, 0.42, 0.2]);
  add(doll, new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0.235, 0.78, 0), new THREE.Vector3(0.3, 0.6, 0.1), new THREE.Vector3(0.18, 0.46, 0.18)]), 20, 0.01, 6), band);
  doll.position.set(-0.85, 0.0, 0.5); doll.scale.setScalar(1.75); doll.rotation.y = 0.35; scene.add(S.character(doll));
  const globe = createGlobe({ scale: 1.3 }); globe.position.set(0.4, 0, 0.3); globe.rotation.y = -0.45; scene.add(S.character(globe));
  globe.userData.pose({ arms: { l: [0, 0.9, 0], r: [0, 0.5, 0] } });
  // fifteen minutes: big clock with the quarter lit
  const clock = createClock(0.42, 12, 15); clock.position.set(1.65, 0.95, 0); scene.add(clock);
  const wedge = new THREE.Mesh(new THREE.CircleGeometry(0.36, 24, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#ff3b5c' })); wedge.position.z = 0.0215; clock.add(wedge);
  add(scene, new THREE.CylinderGeometry(0.06, 0.1, 0.55, 12), mat('#8a5a34'), [1.65, 0.3, -0.02]);
  const CAM = { cy: 1.0, ty: 0.8, cz: 4.0, tx: 0.2 };
  const C = { cx: 0.2, cy: 0.85, cz: 3.6, tx: 0.2, ty: 0.55, ...(typeof CAM !== 'undefined' ? CAM : {}) };
  S.finish([S.num('cx', C.cx), S.num('cy', C.cy), S.num('cz', C.cz)], [S.num('tx', C.tx), S.num('ty', C.ty), 0]);
});
