<script type="module">
// q04 — The VORTEX builds drugs from the target's 3D structure, piece by rational piece.
import * as C from './common.js';
const { THREE, mat, add, blob, rbox, reachWorld } = C;
C.guard(() => {

const { scene, vortex, done } = C.setup({ vx: -1.25, vs: 1.3, vry: 0.55, ground: '#d8d0e8' });
const m = C.molecule(1.8); m.position.set(0.9, 0.1, 0.2); scene.add(m);
add(scene, new THREE.CylinderGeometry(0.7, 0.8, 0.12, 32), mat('#7a6aa8'), [0.9, 0.06, 0.2]);
const cols = ['#ff4a5a', '#3a8cff', '#ffd23a', '#40c46a'];
cols.forEach((c, i) => { const b = C.brick(c, 0.28); b.position.set(-0.25 + i * 0.0, 0.0 + i * 0.28, 0.9); b.rotation.y = 0.15 * i; scene.add(b); });
const b5 = C.brick('#b45cff', 0.32); b5.position.set(-0.3, 1.75, 0.8); b5.rotation.set(0.2, 0.5, 0.3); scene.add(b5);
reachWorld(vortex, 'l', [-0.2, 1.55, 0.7]);
done({ cam: [0, 1.0, 4.6], look: [0, 0.95, 0] });
});
