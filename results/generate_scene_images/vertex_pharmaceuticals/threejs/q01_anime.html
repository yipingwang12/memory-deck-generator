<script type="module">
// q01 — A key FOB spins into the first VORTEX.
import * as C from './common.js';
const { THREE, mat, add, blob, rbox, reachWorld } = C;
C.guard(() => {

const { scene, vortex, done } = C.setup({ vx: -0.5, vs: 1.35, vry: 0.3, ground: '#6fb0d8' });
const f = C.fob(); f.scale.setScalar(1.6); f.position.set(0.95, 0.45, 0.3); f.rotation.set(0.3, 0.6, -0.5); scene.add(f);
reachWorld(vortex, 'l', [0.4, 1.4, 0.5]);
for (let i = 1; i <= 4; i++) { const a = add(scene, new THREE.TorusGeometry(0.5 + i * 0.22, 0.02, 8, 48, 1.6), mat('#ffffff'), [-0.5, 1.5 - i * 0.05, 0], [Math.PI / 2.4, 0, 0.3 * i]); }
for (let i = 0; i < 14; i++) { const a = i * 0.9; blob(scene, mat('#bfe8ff'), [-0.5 + Math.cos(a) * (0.8 + i * 0.04), 0.15 + i * 0.04, Math.sin(a) * 0.9 + 0.5], Array(3).fill(0.05)); }
done({ cam: [0, 1.0, 4.4], look: [0, 0.95, 0] });
});
