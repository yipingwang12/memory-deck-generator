<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q11 — The VORTEX spins by the LIGHTHOUSE at Fan Pier in the Seaport.
import * as C from './common.js';
const { THREE, mat, add, blob, rbox, reachWorld } = C;
C.guard(() => {

const { scene, vortex, done } = C.setup({ vx: -0.9, vs: 1.5, vry: 0.4, ground: '#b08a5a', az: 120 });
add(scene, new THREE.PlaneGeometry(400, 400), mat('#2a78c8', { roughness: 0.3 }), [0, 0.001, -9.5 - 200], [-Math.PI / 2, 0, 0]);
add(scene, new THREE.PlaneGeometry(400, 400), mat('#2a78c8', { roughness: 0.3 }), [0, 0.02, -209.5], [-Math.PI / 2, 0, 0]);
for (let i = 0; i < 30; i++) add(scene, new THREE.BoxGeometry(8, 0.02, 0.06), mat('#7a5a30'), [0, 0.01, 2.5 - i * 0.28]);
const lh = C.lighthouse(); lh.scale.setScalar(1.15); lh.position.set(1.6, 0, 0.2); scene.add(lh);
const rr = C.rng(11); for (let i = 0; i < 9; i++) { const h = 1 + rr() * 3; add(scene, new THREE.BoxGeometry(1 + rr(), h, 1), mat(['#c9d4e4', '#a8b8d0', '#e0e6f0'][i % 3]), [-8 + i * 2, h / 2, -12 - rr() * 3]); }
const bo = new THREE.Group(); add(bo, new THREE.BoxGeometry(1.2, 0.25, 0.4), mat('#fff'), [0, 0.12, 0]); add(bo, new THREE.ConeGeometry(0.4, 0.9, 3), mat('#e8322e'), [0, 0.7, 0]); bo.position.set(-2.2, 0, -5); scene.add(bo);
done({ cam: [0, 1.15, 4.6], look: [0.4, 1.05, 0] });
});
