<!doctype html>
<html><head><title>q04</title><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// Bowling ALLEY years at a MURKY pond
import { THREE, guard, mat, add, blob, box, cyl, textTex, createPerson, createGenerator, setupScene, rng } from './common.js';
import * as K from './props.js';
guard(() => {
  const S = setupScene(new URLSearchParams(location.search), { ground: '#86b84a', sky: { cover: 3 } });
  const scene = S.scene, num = S.num, chars = [];
  const gen = (x, z, ry, sc = 1.35) => { const g = createGenerator({ scale: sc }); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); chars.push(g); return g; };
  const person = (p, x, z, ry) => { p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); chars.push(p); return p; };
  const reachTo = (g, k, w) => { g.updateMatrixWorld(true); const l = g.worldToLocal(new THREE.Vector3(...w)); g.userData.reach(k, [l.x, l.y, l.z]); };
  const spark = (x, y, z, s = 1, c = '#ffe44a') => { const m = add(scene, new THREE.OctahedronGeometry(0.06 * s), new THREE.MeshBasicMaterial({ color: c }), [x, y, z]); m.scale.set(1, 1.6, 0.5); m.castShadow = false; return m; };
  const grass = (n, seed, w, d, z0, cols) => { const r = rng(seed); for (let i = 0; i < n; i++) blob(scene, mat(cols[i % cols.length]), [(r() - 0.5) * w, 0.03, z0 - r() * d], [0.04, 0.04, 0.04]); };

  const pond = add(scene, new THREE.CircleGeometry(9, 48), mat('#6a5a24', { roughness: 0.2 }), [0, 0.02, -8.5], [-Math.PI / 2, 0, 0]);
  const lane = K.lane(2.6, 1.3); lane.position.set(0, 0, 0.6); lane.rotation.y = 0; scene.add(lane);
  const pins = K.pins(3); pins.position.set(0.4, 0.06, -1.6); pins.scale.setScalar(1.5); scene.add(pins);
  const b = K.ball('#2a46c8'); b.position.set(-1.5, -0.12, -2.2); b.scale.setScalar(1.6); scene.add(b);
  const r = rng(9);
  for (let i = 0; i < 26; i++) { const x = (r() - 0.5) * 10, z = -2 - r() * 7; blob(scene, mat(i % 3 ? '#3f8a35' : '#2a6a2a'), [x, 0.03, z], [0.35, 0.02, 0.3]); }
  for (let i = 0; i < 30; i++) { const x = (r() - 0.5) * 11, z = -2.5 - r() * 3.5; cyl(scene, mat('#6a7a2a'), [x, 0.5, z], 0.02, 1.0, [0, 0, (r() - 0.5) * 0.2]); blob(scene, mat('#7a4a22'), [x, 1.0, z], [0.04, 0.13, 0.04]); }
  for (let i = 0; i < 12; i++) blob(scene, mat('#8a9a3a', { transparent: true, opacity: 0.7 }), [(r() - 0.5) * 3 - 1, 0.05, -2 - r() * 2], [0.07, 0.07, 0.07]);
  const g = gen(1.3, 0.9, -0.4, 1.6); g.userData.pose({ arms: { l: [0, 0.3, 0], r: [0, 0.6, 0] } });
  S.done(chars, { pos: [0, 1.4, 4.4], at: [0, 0.6, -1.5] });

});
</script></body></html>
