<!doctype html>
<html><head><title>q01</title><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// The ADMIRAL switches on the GENERATOR
import { THREE, guard, mat, add, blob, box, cyl, textTex, createPerson, createGenerator, setupScene, rng } from './common.js';
import * as K from './props.js';
guard(() => {
  const S = setupScene(new URLSearchParams(location.search), { ground: '#8f6b3c', sky: { cover: 1.5 } });
  const scene = S.scene, num = S.num, chars = [];
  const gen = (x, z, ry, sc = 1.35) => { const g = createGenerator({ scale: sc }); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); chars.push(g); return g; };
  const person = (p, x, z, ry) => { p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); chars.push(p); return p; };
  const reachTo = (g, k, w) => { g.updateMatrixWorld(true); const l = g.worldToLocal(new THREE.Vector3(...w)); g.userData.reach(k, [l.x, l.y, l.z]); };
  const spark = (x, y, z, s = 1, c = '#ffe44a') => { const m = add(scene, new THREE.OctahedronGeometry(0.06 * s), new THREE.MeshBasicMaterial({ color: c }), [x, y, z]); m.scale.set(1, 1.6, 0.5); m.castShadow = false; return m; };
  const grass = (n, seed, w, d, z0, cols) => { const r = rng(seed); for (let i = 0; i < n; i++) blob(scene, mat(cols[i % cols.length]), [(r() - 0.5) * w, 0.03, z0 - r() * d], [0.04, 0.04, 0.04]); };

  K.water(scene, '#2b86c8', 120, 0.01).position.z = -36;
  const ship = K.ship(1.6); ship.position.set(3.2, 0.1, -9); ship.rotation.y = -0.3; scene.add(ship);
  const ship2 = K.ship(1.0); ship2.position.set(-4.5, 0.1, -16); scene.add(ship2);
  for (let i = -6; i <= 6; i++) box(scene, mat(i % 2 ? '#a07a48' : '#8f6b3c'), [i * 0.7, 0.01, 0], [0.66, 0.02, 12]).position.z = -0.0;
  for (const x of [-4, -2.6, 2.6, 4]) cyl(scene, mat('#5a3a1e'), [x, 0.4, -5.5], 0.12, 0.8);
  const g = gen(0.9, 0, -0.35, 1.6); g.userData.pose({ arms: { l: [0, 0.5, 0], r: [0, 0.2, 0] } });
  // switch post with big knife lever
  const post = new THREE.Group(); post.position.set(-0.4, 0, 0.7); scene.add(post);
  cyl(post, mat('#5a5f68', { metalness: 0.5 }), [0, 0.4, 0], 0.05, 0.8); box(post, mat('#c8c8c0'), [0, 0.85, 0], [0.34, 0.34, 0.08]);
  const lever = new THREE.Group(); lever.position.set(0, 0.85, 0.06); lever.rotation.z = -0.9; post.add(lever);
  cyl(lever, mat('#d0242e'), [0, 0.15, 0], 0.025, 0.3); blob(lever, mat('#d0242e'), [0, 0.32, 0], [0.05, 0.05, 0.05]);
  for (const x of [-0.1, 0.1]) cyl(post, mat('#d9a43a', { metalness: 0.6 }), [x, 0.85, 0.07], 0.02, 0.06, [Math.PI / 2, 0, 0]);
  const adm = K.admiral(); person(adm, -1.3, 0.5, 0.5); adm.userData.arms.l.rotation.z = 2.0; adm.userData.arms.r.rotation.z = -0.3;
  // glow + sparks
  const L = new THREE.PointLight('#ffd84a', 1.5, 5); L.position.set(0.9, 1.6, 0.8); scene.add(L);
  [[0.4, 2.1, 0.6, 1.4], [1.6, 2.2, 0.5, 1.2], [0.9, 2.5, 0.3, 1.6], [1.9, 1.5, 0.8, 1], [0.2, 1.7, 1, 1]].forEach(([x, y, z, s]) => spark(x, y, z, s));
  S.done(chars, { pos: [0.2, 1.25, 4.0], at: [0, 0.95, 0] });

});
</script></body></html>
