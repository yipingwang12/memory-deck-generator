<!doctype html>
<html><head><meta charset="utf-8"><title>Superhero anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createSuperhero } from './superhero.js';
guard(() => {
  const stage = createAnimeStage({
    fov: 30, sunElevation: 40, sunAzimuth: 150, exposure: 1,
    sky: { cover: 1, seed: 5, towerTop: 0.5, puffCover: 1 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 },
    sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 },
    flare: 0.5, fog: { near: 120, far: 1500 },
  });
  const scene = stage.scene;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#7fb85a', roughness: 0.9 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const pm = new Set();
  [[-0.9, 0.5], [0, 0], [0.9, -0.5 - Math.PI]].forEach(([x, yaw], i) => {
    const h = createSuperhero({ scale: 1.3 }); h.position.set(x, 0, 0); h.rotation.y = i === 1 ? 0.0 : (i === 0 ? 0.9 : Math.PI * 1.0 + 0.5);
    h.userData.pose({ arms: { l: [0, 0.35, 0], r: [0, 0.35, 0] }, legs: { l: [0, 0.05], r: [0, 0.05] } });
    scene.add(h); h.traverse((o) => pm.add(o));
  });
  stage.toonify(scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [200, 1000, 120, 1.6]]);
  stage.camera.position.set(0, 0.8, 4.2); stage.camera.lookAt(0, 0.68, 0);
  stage.finish();
});
</script></body></html>
