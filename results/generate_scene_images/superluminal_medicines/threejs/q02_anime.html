<!doctype html>
<html><head><meta charset="utf-8"><title>Superluminal q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// A MUMMY launches the SUPERHERO with a seed bag of coins.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const m = P.mummy({ hands: { l: [0.55, 0.75, 0.5], r: [-0.2, 0.95, 0.55] } }); ctx.char(m); place(m, -2.3, 0, 0.3, 0.6, 1.7);
  const sack = new THREE.Group(); ctx.scene.add(sack); place(sack, -1.0, 1.55, 0.7, 0.2, 1);
  const burlap = mat('#c9a46a', { roughness: 0.95 });
  blob(sack, burlap, [0, 0, 0], [0.62, 0.7, 0.55]); cyl(sack, burlap, [0, 0.75, 0], 0.22, 0.4, [0, 0, 0], 0.3);
  add(sack, new THREE.TorusGeometry(0.28, 0.045, 8, 20), mat('#8a3a2a'), [0, 0.58, 0], [Math.PI / 2, 0, 0]);
  const c0 = coin(0.4); c0.position.set(0, 0.0, 0.5); sack.add(c0);
  for (const [x, y, z, r] of [[0.1, 1.15, 0.0, 0.3], [-0.3, 1.0, 0.1, 0.25], [0.3, 0.95, 0.1, 0.25]]) { const c = coin(r); c.position.set(x, y, z); c.rotation.set(0.3, 0.5, 0); sack.add(c); }
  const h = ctx.hero({ x: 1.5, y: 1.7, z: 0.2, ry: 0.0, scale: 1.6, pose: { arms: { l: [0, 2.6, 0], r: [0, -2.6, 0] }, legs: { l: [0, 0.15], r: [0, -0.15] } } });
  h.rotation.z = -0.5;
  for (const [x, y, r] of [[-0.1, 2.3, 0.2], [0.3, 2.7, 0.18], [2.9, 1.4, 0.2], [3.1, 2.9, 0.2], [0.7, 1.2, 0.18]]) coinAt(ctx, x, y, 0.6, r, 0.6 + x, 0.2);
  ctx.cam([0.2, 1.8, 7.0], [0.1, 1.7, 0]);
});
</script></body></html>
