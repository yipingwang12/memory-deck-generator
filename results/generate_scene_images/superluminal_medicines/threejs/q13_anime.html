<script type="module">
// The SUPERHERO lands on a TEA chest in Boston.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const g = ctx.scene;
  const w = add(g, new THREE.PlaneGeometry(200, 60), mat('#3f86b8', { roughness: 0.3 }), [0, 0.01, -35], [-Math.PI / 2, 0, 0]);
  let a = 7; const rnd = () => (a = (a * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 18; i++) { const hh = 5 + rnd() * 9; box(g, mat(['#a8c4dc', '#c9a58a', '#8fb0cc', '#d8d0c4'][i % 4]), [-26 + i * 3, hh / 2, -20 - rnd() * 3], [2.6, hh, 2.4]); }
  box(g, mat('#7ab6e8', { metalness: 0.4, roughness: 0.2 }), [8, 8, -22], [3.2, 16, 2.4]); box(g, mat('#b98a6a'), [-6, 9, -22], [2.0, 18, 2.0]); cyl(g, mat('#c8d0d8'), [-6, 19, -22], 0.1, 3);
  const c = P.chest(); g.add(c); place(c, 0, 0, 0.3, 0.25, 1.35);
  const crate = (x, z, s, ry) => { box(g, mat('#a5683a'), [x, s / 2, z], [s, s, s], [0, ry, 0]); const t = P.textPlane('TEA', s * 0.8, s * 0.35, { fg: '#fff', bg: '#2e6b3a' }); t.position.set(x + Math.sin(ry) * s * 0.51, s / 2, z + Math.cos(ry) * s * 0.51); t.rotation.y = ry; g.add(t); };
  crate(-3.2, -1.0, 0.9, 0.3); crate(3.3, -1.2, 0.9, -0.3);
  const h = ctx.hero({ x: 0, y: 1.78, z: 0.3, ry: 0.15, scale: 1.75, pose: { lean: 0.1, legs: { l: [-0.3, 0.1], r: [0.2, -0.1] }, arms: { l: [0, 1.5, 0.3], r: [0, -1.5, 0.3] } } });
  ctx.cam([0.2, 2.1, 7.0], [0, 2.0, 0]);
}, { ground: '#b8a68a' });
