<!doctype html>
<html><head><meta charset="utf-8"><title>Superluminal q09</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// The SUPERHERO gently nudges an MC4R switch.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const g = ctx.scene;
  box(g, mat('#f0e6d2'), [1.3, 1.9, -0.2], [2.4, 3.6, 0.2]);
  const lb = P.textPlane('MC4R', 2.0, 0.7, { fg: '#1d3a8a', bg: '#fffdf5', border: '#1d3a8a' }); lb.position.set(1.3, 3.2, -0.09); g.add(lb);
  box(g, mat('#c9bfae'), [1.3, 1.7, -0.08], [1.2, 1.8, 0.06]);
  const lever = new THREE.Group(); g.add(lever); lever.position.set(1.3, 1.7, 0.0); lever.rotation.x = 0.28;
  box(lever, mat('#e0262d', { roughness: 0.4 }), [0, 0, 0.0], [0.7, 1.15, 0.3]);
  for (const sx of [-1, 1]) box(g, mat('#9a8f7c'), [1.3 + sx * 0.0, 1.7 + sx * 1.1, -0.06], [0.4, 0.05, 0.03]);
  const h = ctx.hero({ x: -1.1, z: 0.7, ry: 0.7, scale: 2.0, pose: { lean: 0.12 } });
  ctx.reach(h, 'l', [0.95, 1.6, 0.4]);
  ctx.cam([0.2, 1.8, 6.4], [0.2, 1.7, 0]);
}, { ground: '#d8c7a8' });
</script></body></html>
