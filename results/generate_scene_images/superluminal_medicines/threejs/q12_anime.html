<!doctype html>
<html><head><meta charset="utf-8"><title>Superluminal q12</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// A LOLLIPOP TONGUE licks coins into the SUPERHERO Series A.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const l = P.lollipop({ tongue: true, hands: { l: [0.7, 0.8, 0.1], r: [-0.7, 0.8, 0.1] } }); ctx.char(l); place(l, -2.4, 0, 0.3, 0.6, 1.9);
  const jar = new THREE.Group(); ctx.scene.add(jar); place(jar, 2.4, 0, 0.8, -0.2, 1);
  add(jar, new THREE.CylinderGeometry(0.85, 0.85, 1.7, 36, 1, true), mat('#cfe9ff', { transparent: true, opacity: 0.35, side: THREE.DoubleSide }), [0, 0.85, 0]);
  cyl(jar, mat('#cfe9ff', { transparent: true, opacity: 0.5 }), [0, 0.02, 0], 0.85, 0.04); add(jar, new THREE.TorusGeometry(0.85, 0.05, 8, 36), mat('#e8edf2'), [0, 1.7, 0], [Math.PI / 2, 0, 0]);
  for (let i = 0; i < 9; i++) { const c = coin(0.3); c.position.set(Math.cos(i * 2.1) * 0.35, 0.18 + (i % 3) * 0.13, Math.sin(i * 2.1) * 0.3); c.rotation.set(1.2 + 0.1 * i, i, 0.3); jar.add(c); }
  const lb = P.textPlane('A', 0.9, 0.9, { fg: '#fff', bg: '#c0392b', border: '#f5b81c' }); lb.position.set(0, 1.0, 0.87); jar.add(lb);
  const h = ctx.hero({ x: 0.7, z: -0.2, ry: -0.2, scale: 1.9, pose: { arms: { l: [0, 1.0, 0.3], r: [0, -1.0, 0.3] } } });
  for (const [x, y, z] of [[-0.2, 2.4, 0.9], [0.6, 2.9, 0.8], [1.5, 3.0, 0.9], [2.2, 2.7, 0.8], [2.5, 2.35, 0.9]]) coinAt(ctx, x, y, z, 0.3, 0.2, 0.2);
  ctx.cam([0.1, 1.7, 7.4], [0, 1.45, 0]);
});
</script></body></html>
