<!doctype html>
<html><head><meta charset="utf-8"><title>Superluminal q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// An RA ram shouts SUPERLUMINAL at the SUPERHERO.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const r = P.ram(); ctx.char(r); place(r, -2.3, 0, 0.3, 0.7, 1.8);
  const tag = P.textPlane('RA', 0.7, 0.5, { fg: '#fff', bg: '#c0392b', border: '#fff' }); tag.position.set(0, 0.5, 0.58); r.add(tag);
  const b = P.textPlane('SUPERLUMINAL', 4.2, 0.95, { fg: '#c0392b', bg: '#fffdf5', border: '#c0392b' }); b.position.set(0.1, 3.2, 0.5); ctx.scene.add(b);
  box(ctx.scene, mat('#fffdf5'), [-0.3, 2.55, 0.5], [0.25, 0.4, 0.02], [0, 0, 0.5]);
  const h = ctx.hero({ x: 1.8, ry: -0.5, scale: 1.95, pose: { lean: -0.15, arms: { l: [0, 1.4, 0.5], r: [0, -1.4, 0.5] } } });
  for (const [k, s] of [[0.5, 0], [0.9, 1], [1.3, 2]]) add(ctx.scene, new THREE.TorusGeometry(0.4 + k * 0.3, 0.03, 8, 24, 1.0), mat('#c0392b'), [-1.2 + k * 0.5, 1.3, 0.9], [0, 0, -0.5]);
  ctx.cam([0, 1.7, 7.2], [-0.1, 1.45, 0]);
});
</script></body></html>
