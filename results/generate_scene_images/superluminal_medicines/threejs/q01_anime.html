<!doctype html>
<html><head><meta charset="utf-8"><title>Superluminal q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// A NUN sews the SUPERHERO first cape.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const n = P.nun({ hands: { l: [0.6, 1.25, 0.55], r: [-0.55, 1.25, 0.5] } }); ctx.char(n); place(n, -1.6, 0, 0.2, 0.5, 1.8);
  // red cape cloth held up by the nun, gold star, needle + thread to a spool
  const cl = new THREE.Group(); ctx.scene.add(cl); place(cl, -0.7, 2.05, 0.95, 0.35, 1);
  const cloth = add(cl, new THREE.CylinderGeometry(0.55, 1.0, 1.7, 24, 1, true, Math.PI * 0.1, Math.PI * 0.8), mat('#e0262d', { side: THREE.DoubleSide, roughness: 0.7 }), [0, -0.85, -0.9], [0, Math.PI, 0]);
  cloth.position.set(0, -0.85, 0.0); cloth.rotation.y = 0;
  const st = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? 0.1 : 0.26; st[i ? 'lineTo' : 'moveTo'](q * Math.cos(a), q * Math.sin(a)); }
  add(cl, new THREE.ShapeGeometry(st), mat('#f5b81c', { side: THREE.DoubleSide }), [0, -0.9, 0.78]);
  cyl(ctx.scene, mat('#e8edf2', { metalness: 0.8, roughness: 0.2 }), [0.15, 1.1, 1.25], 0.025, 1.1, [0, 0, -0.9]);
  const pts = [[0.5, 1.4, 1.25], [0.9, 2.0, 1.4], [1.5, 1.2, 1.3], [1.7, 0.5, 1.2]].map((p) => new THREE.Vector3(...p));
  add(ctx.scene, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.02, 8), mat('#ffd23f'));
  cyl(ctx.scene, mat('#ffd23f'), [1.7, 0.3, 1.2], 0.35, 0.5); cyl(ctx.scene, mat('#d8b070'), [1.7, 0.03, 1.2], 0.4, 0.06); cyl(ctx.scene, mat('#d8b070'), [1.7, 0.57, 1.2], 0.4, 0.06);
  const h = ctx.hero({ x: 2.4, z: 0.2, ry: -0.35, scale: 1.9, pose: { arms: { l: [0, 0.5, 0], r: [0, 0.4, 0] } } });
  ctx.cam([0.1, 1.7, 6.6], [0.1, 1.45, 0]);
});
</script></body></html>
