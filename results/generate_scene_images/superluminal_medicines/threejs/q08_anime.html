<!doctype html>
<html><head><meta charset="utf-8"><title>Superluminal q08</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// The SUPERHERO opens a GPCR door that crosses the cell wall seven times.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const g = ctx.scene, pink = mat('#f4a0b4', { roughness: 0.4 }), tail = mat('#ffe08a');
  for (let i = -16; i <= 16; i++) for (const [y, z] of [[2.6, -1.4], [1.3, -1.4]]) { blob(g, pink, [i * 0.34, y, z], [0.15, 0.15, 0.15]); }
  for (let i = -16; i <= 16; i++) cyl(g, tail, [i * 0.34, 1.95, -1.4], 0.035, 1.1);
  const cols = ['#e0562d', '#f5b81c', '#7ccf4a', '#2ac0c0', '#2a6fd6', '#8a4ad6', '#e0409a'];
  cols.forEach((c, i) => { const x = (i - 3) * 0.52; const hx = P.helix(2.7, c); hx.position.set(x, 1.95, -1.5); g.add(hx); });
  // door frame + open leaf
  const fr = mat('#6b3f1d'); box(g, fr, [-1.3, 1.15, 0.9], [0.16, 2.3, 0.16]); box(g, fr, [1.3, 1.15, 0.9], [0.16, 2.3, 0.16]); box(g, fr, [0, 2.3, 0.9], [2.76, 0.18, 0.16]);
  const d = P.door(1.2, 2.2); d.position.set(1.22, 0.0, 0.95); d.rotation.y = -1.25; g.add(d);
  const h = ctx.hero({ x: 2.4, z: 1.6, ry: -0.5, scale: 2.0 });
  ctx.reach(h, 'l', [1.95, 1.2, 1.85]);
  ctx.cam([0, 1.8, 7.4], [0, 1.5, 0]);
}, { ground: '#b9d3e8' });
</script></body></html>
