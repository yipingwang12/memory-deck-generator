<script type="module">
// A LOLLIPOP hands the SUPERHERO a 1.3 billion check.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const l = P.lollipop({ hands: { l: [0.75, 0.7, 0.2], r: [-0.85, 1.0, 0.6] } }); ctx.char(l); place(l, 2.1, 0, 0.2, 0, 1.9);
  const c = P.check('$1.3B'); ctx.scene.add(c); place(c, -0.45, 1.75, 1.0, -0.15, 1.0);
  const h = ctx.hero({ x: -2.1, ry: 0.45, scale: 2.0 });
  ctx.reach(h, 'l', [-1.45, 1.55, 1.0]);
  ctx.cam([0.2, 1.8, 6.6], [0.2, 1.6, 0]);
});
