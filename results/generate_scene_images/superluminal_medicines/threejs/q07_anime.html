<html><head><meta charset="utf-8"><title>Superluminal q07</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// Robot AGENTS drive the SUPERHERO cryo-EM microscope.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const c = P.cryoEM(); ctx.scene.add(c); place(c, 0.5, 0, -0.3, 0, 1.15);
  const r1 = P.robot({ hands: { l: [0.35, 0.95, 0.3], r: [-0.45, 0.5, 0.4] } }); ctx.char(r1); place(r1, 2.3, 0, 1.0, -0.6, 1.5);
  r1.userData.x = 0;
  const r2 = P.robot({ hands: { l: [0.2, 0.9, 0.5], r: [-0.3, 0.75, 0.5] } }); ctx.char(r2); place(r2, -1.5, 0, 1.2, 0.5, 1.4);
  const r3 = P.robot({ hands: { l: [0.3, 1.0, 0.4], r: [-0.3, 1.0, 0.4] } }); ctx.char(r3); place(r3, 1.0, 0, 1.9, 0.0, 1.0);
  const h = ctx.hero({ x: -2.6, z: 1.3, ry: 0.6, scale: 1.95, pose: { arms: { l: [0, 0.4, 0], r: [0, 0.3, 0] } } });
  ctx.cam([0.1, 2.0, 7.6], [0.0, 1.7, 0]);
});
</script></body></html>
