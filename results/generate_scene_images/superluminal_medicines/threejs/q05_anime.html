<!doctype html>
<html><head><meta charset="utf-8"><title>Superluminal q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// A YAK holds the SUPERHERO microscope.
import * as THREE from 'three';
import { boot } from './common.js';
import * as P from './props.js';
const { add, blob, box, cyl, mat, coin, limbBetween } = P;
const place = (o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const coinAt = (ctx, x, y, z, r = 0.2, ry = 0, rx = 0) => { const c = coin(r); c.position.set(x, y, z); c.rotation.set(rx, ry, 0); ctx.scene.add(c); return c; };

boot((ctx) => {
  const t = new THREE.Group(); ctx.scene.add(t);
  box(t, mat('#b98550'), [0.4, 0.62, 0.7], [2.6, 0.1, 1.3]); for (const x of [-0.7, 1.5]) for (const z of [0.2, 1.2]) cyl(t, mat('#8a5f35'), [x, 0.3, z], 0.07, 0.6);
  const m = P.microscope(); ctx.scene.add(m); place(m, 0.3, 0.67, 0.7, 0.3, 1.25);
  const y = P.yak({ hands: { l: [0.55, 0.75, 0.55], r: [-0.1, 1.0, 0.7] } }); ctx.char(y); place(y, 2.0, 0, -0.1, -0.5, 2.0);
  const h = ctx.hero({ x: -2.0, ry: 0.5, scale: 1.95, pose: { lean: 0.1 } });
  ctx.reach(h, 'l', [-0.45, 1.5, 0.8]);
  ctx.cam([0, 1.7, 6.8], [0, 1.4, 0]);
});
</script></body></html>
