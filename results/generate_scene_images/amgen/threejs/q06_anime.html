<!doctype html>
<html><head><meta charset="utf-8"><title>Amgen scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — The GENIE puts out its BRAIN lamp in Cambridge: no more neuroscience.
import { THREE, run, mat, add, blob, lamp, smoke, rng } from './common.js';
function brain(s) {
  const g = new THREE.Group(), r = rng(8), pink = ['#f08aa6', '#e8789a', '#f6a0b8'];
  add(g, new THREE.SphereGeometry(1, 20, 14), mat('#8a2a52'), [0, 0, 0], [0, 0, 0], [0.12, 0.74, 0.8]);
  for (const sx of [-1, 1]) {
    blob(g, mat('#f08aa6', { roughness: 0.5 }), [sx * 0.4, 0, 0], [0.46, 0.7, 0.8]);
    for (let i = 0; i < 40; i++) {
      const u = r() * Math.PI * 2, v = Math.acos(r() * 1.6 - 0.9), n = V3(Math.sin(v) * Math.cos(u), Math.cos(v), Math.sin(v) * Math.sin(u));
      if (n.x * sx < -0.1) continue;
      blob(g, mat(pink[i % 3], { roughness: 0.5 }), [sx * 0.4 + n.x * 0.42, n.y * 0.66, n.z * 0.75], [0.17, 0.17, 0.17]);
    }
  }
  g.scale.setScalar(s); return g;
}
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
run({
  ground: '#8b7db8', el: 14, az: 160, frame: { x: 0.2, y: 2.0, H: 5.2 }, ambient: 2.0,
  genie: { x: 2.2, z: 0.4, scale: 1.7, ry: -1.0, pose: { lean: 0.15, headTilt: 0.05, arms: { l: [0, 0.4, 0.3], r: [0, -0.4, 0.3] } }, mouth: 0.75 },
  build({ scene }) {
    add(scene, new THREE.BoxGeometry(2.6, 0.9, 1.6), mat('#a9a2b8'), [-0.5, 0.45, 0]);
    const l = lamp({ scale: 1.8, lit: false }); l.position.set(-1.3, 0.9, 0); scene.add(l);
    const b = brain(1.0); b.position.set(-1.3, 2.35, 0.1); scene.add(b);
    const tip = [-1.3 + 0.92 * 1.8, 0.9 + 0.58 * 1.8, 0];
    blob(scene, new THREE.MeshBasicMaterial({ color: '#ff8a1e' }), [tip[0] + 0.05, tip[1] + 0.03, 0], [0.07, 0.05, 0.07]);
    smoke(scene, [[tip[0] + 0.1, tip[1] + 0.25, 0.1, 0.1], [tip[0] - 0.1, tip[1] + 0.5, 0.1, 0.13], [tip[0] + 0.1, tip[1] + 0.78, 0.1, 0.16], [tip[0] - 0.05, tip[1] + 1.1, 0.1, 0.2]], '#bdb8c8', 0.75);
  },
});
</script></body></html>
