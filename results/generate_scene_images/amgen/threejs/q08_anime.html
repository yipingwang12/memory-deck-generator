<!doctype html>
<html><head><meta charset="utf-8"><title>Amgen scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q08 — The GENIE gathers its research under the OAKS and on the GOLDEN GATE bridge (San Francisco).
import { THREE, run, mat, add, blob, oak, V, rng } from './common.js';
function bridge() {
  const g = new THREE.Group(), orange = mat('#e2432a', { roughness: 0.5 });
  const mainY = (x) => 1.9 + 3.2 * (x / 4.5) ** 2;
  add(g, new THREE.BoxGeometry(24, 0.25, 1.9), mat('#c9503a'), [0, 1.2, 0]);
  add(g, new THREE.BoxGeometry(24, 0.5, 0.1), mat('#b8b4b0'), [0, 0.9, 0.9]);
  for (const tx of [-4.5, 4.5]) {
    for (const z of [-0.8, 0.8]) add(g, new THREE.BoxGeometry(0.42, 5.4, 0.42), orange, [tx, 2.7, z]);
    for (const y of [2.0, 3.4, 4.6, 5.3]) add(g, new THREE.BoxGeometry(0.34, 0.3, 2.0), orange, [tx, y, 0]);
  }
  for (const z of [-0.8, 0.8]) {
    const pts = [];
    for (let x = -12; x <= 12; x += 0.5) {
      const a = Math.abs(x); const y = a <= 4.5 ? mainY(x) : 5.1 - (a - 4.5) / 7.5 * 3.4 + Math.sin((a - 4.5) / 7.5 * Math.PI) * -0.9;
      pts.push(V(x, y, z));
    }
    add(g, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, 0.07, 8), orange);
    for (let x = -4.0; x <= 4.0; x += 0.5) add(g, new THREE.CylinderGeometry(0.02, 0.02, mainY(x) - 1.3, 5), orange, [x, 1.3 + (mainY(x) - 1.3) / 2, z]);
  }
  return g;
}
function flask(c) {
  const g = new THREE.Group();
  const prof = [[0.001, 0], [0.34, 0], [0.12, 0.62], [0.12, 0.85], [0.17, 0.88]].map(([x, y]) => new THREE.Vector2(x, y));
  add(g, new THREE.LatheGeometry(prof, 28), new THREE.MeshStandardMaterial({ color: '#dff4ff', transparent: true, opacity: 0.45, roughness: 0.1, side: THREE.DoubleSide }));
  add(g, new THREE.CylinderGeometry(0.2, 0.3, 0.22, 24), mat(c, { roughness: 0.3 }), [0, 0.12, 0]);
  return g;
}
run({
  ground: '#8fb04f', frame: { x: 0, y: 2.0, H: 5.2 }, el: 45,
  genie: { x: 0, z: 1.0, scale: 1.65, pose: { headTilt: 0.05, arms: { l: [0, 0.6, 0.5], r: [0, -0.6, 0.5] } }, mouth: 0.2 },
  build({ scene, reachTo }) {
    add(scene, new THREE.PlaneGeometry(400, 120), mat('#3f93c8', { roughness: 0.3 }), [0, 0.02, -64], [-Math.PI / 2, 0, 0]);
    add(scene, new THREE.PlaneGeometry(400, 2), mat('#e8d9a8'), [0, 0.03, -3.0], [-Math.PI / 2, 0, 0]);
    const b = bridge(); b.position.set(2.5, 0, -7); b.rotation.y = 0.35; scene.add(b);
    for (const [x, s] of [[-24, 9], [-8, 6], [20, 11]]) blob(scene, mat('#7fa6c6'), [x, 0, -60], [s * 3, s, s * 2]);
    const l = oak(1.7, 3); l.position.set(-3.6, 0, 0.4); scene.add(l);
    const r = oak(1.5, 5); r.position.set(3.7, 0, -0.2); scene.add(r);
    const f1 = flask('#3bd06a'); f1.position.set(-1.0, 0.7, 1.9); f1.scale.setScalar(1.3); scene.add(f1);
    const f2 = flask('#e0483a'); f2.position.set(1.0, 0.7, 1.9); f2.scale.setScalar(1.3); scene.add(f2);
    reachTo('r', [-0.85, 1.0, 1.6]); reachTo('l', [0.85, 1.0, 1.6]);
  },
});
</script></body></html>
