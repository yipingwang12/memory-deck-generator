<!doctype html>
<html><head><meta charset="utf-8"><title>Amgen scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q13 — Out of the HORIZON come a TEPID PIZZA (Tepezza), a CRYSTAL axe (Krystexxa) and an UP-LIZARD (Uplizna) for the GENIE.
import { THREE, run, mat, add, blob, glow, smoke, tex, rng, noInk, halo } from './common.js';
function pizza() {
  const g = new THREE.Group(), r = rng(6);
  add(g, new THREE.CylinderGeometry(0.85, 0.85, 0.14, 40), mat('#d8964a'), [0, 0, 0], [Math.PI / 2, 0, 0]);
  add(g, new THREE.TorusGeometry(0.82, 0.08, 10, 40), mat('#d8964a'), [0, 0, 0.07]);
  add(g, new THREE.CylinderGeometry(0.76, 0.76, 0.04, 40), mat('#f6c23a'), [0, 0, 0.08], [Math.PI / 2, 0, 0]);
  [[0.0, 0.0], [0.35, 0.3], [-0.38, 0.28], [0.1, -0.45], [-0.4, -0.3], [0.45, -0.25], [0.0, 0.58]].forEach(([x, y]) => add(g, new THREE.CylinderGeometry(0.15, 0.15, 0.05, 20), mat('#c8302e'), [x, y, 0.11], [Math.PI / 2, 0, 0]));
  [[-0.2, 0.3], [0.25, -0.1], [0.5, 0.05]].forEach(([x, y]) => blob(g, mat('#3f8f3a'), [x, y, 0.12], [0.06, 0.04, 0.03]));
  g.rotation.set(-0.15, -0.3, 0); return g;
}
function axe() {
  const g = new THREE.Group(), cry = new THREE.MeshStandardMaterial({ color: '#8fe8ff', emissive: '#2aa8d8', emissiveIntensity: 0.5, roughness: 0.1, transparent: true, opacity: 0.88 });
  add(g, new THREE.CylinderGeometry(0.07, 0.08, 2.2, 12), mat('#7a4a22'), [0, 0, 0]);
  add(g, new THREE.OctahedronGeometry(1, 0), cry, [0.55, 0.65, 0], [0, 0, 0.1], [0.72, 0.62, 0.14]);
  add(g, new THREE.ConeGeometry(0.2, 0.7, 5), cry, [-0.25, 0.85, 0], [0, 0, 0.9]);
  add(g, new THREE.ConeGeometry(0.12, 0.5, 5), cry, [-0.15, 0.55, 0], [0, 0, 1.4]);
  add(g, new THREE.ConeGeometry(0.15, 0.55, 5), cry, [1.05, 0.95, 0], [0, 0, -0.6]);
  add(g, new THREE.CylinderGeometry(0.1, 0.1, 0.12, 12), mat('#2b2523'), [0, -1.1, 0]);
  g.rotation.z = -0.3; return g;
}
function lizard() {
  const g = new THREE.Group(), c = mat('#4fc25a'), d = mat('#2f8f3e');
  for (let i = 0; i < 9; i++) { const t = i / 8; blob(g, i % 2 ? c : d, [-0.2 - t * 1.5, 0.15 * Math.sin(t * 5) - t * 0.1, 0], [0.3 - t * 0.22, 0.26 - t * 0.19, 0.24 - t * 0.17]); }
  blob(g, c, [0.2, 0, 0], [0.55, 0.38, 0.34]); blob(g, mat('#c8f0a0'), [0.25, -0.12, 0.12], [0.45, 0.22, 0.2]);
  blob(g, c, [0.85, 0.12, 0], [0.38, 0.28, 0.3]);
  for (const z of [-1, 1]) { blob(g, mat('#fff', { roughness: 0.3 }), [1.02, 0.28, z * 0.14], [0.11, 0.13, 0.05]); blob(g, mat('#1a1030'), [1.06, 0.27, z * 0.17], [0.07, 0.1, 0.04]); blob(g, mat('#fff'), [1.08, 0.32, z * 0.19], [0.025, 0.025, 0.02]); }
  for (const [x, z] of [[0.4, 0.3], [0.4, -0.3], [-0.3, 0.3], [-0.3, -0.3]]) { add(g, new THREE.CylinderGeometry(0.06, 0.05, 0.6, 8), c, [x, -0.35, z], [z * 0.5, 0, 0.3]); blob(g, d, [x - 0.08, -0.65, z * 1.2], [0.14, 0.05, 0.1]); }
  for (let i = 0; i < 6; i++) add(g, new THREE.ConeGeometry(0.07, 0.2, 6), mat('#f0a020'), [0.5 - i * 0.28, 0.38 - i * 0.02, 0]);
  const up = new THREE.Group(); up.position.set(0.1, 1.15, 0); g.add(up);
  add(up, new THREE.BoxGeometry(0.3, 0.7, 0.14), mat('#ffd21f'), [0, -0.1, 0]);
  add(up, new THREE.ConeGeometry(0.42, 0.55, 3), mat('#ffd21f'), [0, 0.5, 0], [0, 0, 0]);
  g.rotation.z = 0.12; return g;
}
run({
  ground: '#2f86b8', el: 20, frame: { x: 0.9, y: 2.0, H: 5.2 },
  genie: { x: -2.1, z: 0.3, scale: 1.55, ry: 0.35, pose: { headTilt: 0.1, arms: { l: [0, 1.7, 0.2], r: [0, -1.5, 0.2] } }, mouth: 0.4 },
  build({ scene }) {
    noInk(add(scene, new THREE.BoxGeometry(800, 1.4, 2), glow('#fff2b0'), [0, 1.9, -150]));
    const hl = halo(8, '255,240,170', 0.9); hl.position.set(2.2, 1.9, -8); scene.add(hl);
    const p = pizza(); p.position.set(0.5, 1.7, 0.4); p.scale.setScalar(1.1); scene.add(p);
    smoke(scene, [[0.3, 2.85, 0.3, 0.1], [0.45, 3.1, 0.3, 0.12], [0.65, 3.4, 0.3, 0.14]], '#fff', 0.55);
    const a = axe(); a.position.set(2.5, 3.0, 0.3); a.scale.setScalar(1.0); scene.add(a);
    const l = lizard(); l.position.set(3.9, 1.0, 0.5); l.scale.setScalar(0.95); scene.add(l);
  },
});
</script></body></html>
