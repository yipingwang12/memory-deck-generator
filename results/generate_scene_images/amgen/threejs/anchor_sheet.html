<!doctype html>
<html><head><meta charset="utf-8"><title>Amgen anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createGenie } from './genie.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, sky: { cover: 1.5, seed: 5, towerTop: 0.5, puffCover: 2 }, shadowSize: 4, ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, ambient: { color: '#e8e2ff', intensity: 2.3 }, sunIntensity: 2.6 });
  const scene = stage.scene;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#e8d8a8' }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const gm = new Set();
  [[-1.7, 0.75], [0, 0], [1.7, -0.9]].forEach(([x, ry]) => {
    const g = createGenie(); g.position.set(x, 0, 0); g.rotation.y = ry;
    g.userData.pose({ headTilt: 0.06, arms: { l: [0, 0.5, 0.2], r: [0, 0.5, 0.2] } });
    g.traverse((o) => gm.add(o)); scene.add(g);
  });
  stage.toonify(scene, (m) => gm.has(m));
  stage.camera.position.set(0, 0.8, 5.0); stage.camera.lookAt(0, 0.75, 0);
  stage.finish();
});
</script></body></html>
