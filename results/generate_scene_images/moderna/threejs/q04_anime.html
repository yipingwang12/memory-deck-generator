<!doctype html>
<html><head><meta charset="utf-8"><title>Moderna q04</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q04 — The MODEM promises up to eight more approvals within three years.
import { THREE, mat, add, rbox, blob, num, makeStage, finishScene, createModem, canvasTexture } from './common.js';
import { guard } from './kit.js';
const checkTex = canvasTexture(256, (ctx, s) => {
  ctx.fillStyle = '#fbf7ea'; ctx.fillRect(0, 0, s, s);
  ctx.strokeStyle = '#d4b56a'; ctx.lineWidth = 10; ctx.strokeRect(12, 12, s - 24, s - 24);
  ctx.fillStyle = '#2ebd59'; ctx.beginPath(); ctx.arc(s / 2, s / 2, 78, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(s / 2 - 40, s / 2 + 2); ctx.lineTo(s / 2 - 8, s / 2 + 34); ctx.lineTo(s / 2 + 44, s / 2 - 30); ctx.stroke();
});
const calTex = canvasTexture(256, (ctx, s) => {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = '#e24b3b'; ctx.fillRect(0, 0, s, 70);
  ctx.fillStyle = '#c8ccd4';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) ctx.fillRect(22 + c * 44, 92 + r * 38, 32, 26);
});
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { ground: '#e8dcc0' });
  const scene = stage.scene;
  // back wall + board
  add(scene, new THREE.BoxGeometry(14, 7, 0.2), mat("#7fb4d8"), [0, 3.4, -0.6]);
  rbox(scene, mat('#8a5a2e'), 4.6, 2.2, 0.12, [0.7, 2.8, -0.45], [0, 0, 0], 0.04);
  for (let i = 0; i < 8; i++) {
    const c = i % 4, r = Math.floor(i / 4);
    const m = new THREE.MeshStandardMaterial({ map: checkTex, roughness: 0.6 });
    add(scene, new THREE.BoxGeometry(0.95, 0.95, 0.04), m, [0.7 + (c - 1.5) * 1.1, 3.2 - r * 1.05, -0.36]);
  }
  // three calendars on left
  for (let i = 0; i < 3; i++) {
    const m = new THREE.MeshStandardMaterial({ map: calTex, roughness: 0.6 });
    add(scene, new THREE.BoxGeometry(0.8, 0.8, 0.04), m, [3.9, 3.8 - i * 0.95, -0.4], [0, 0, (i - 1) * 0.05]);
  }
  const modem = createModem({ scale: 2.0 }); modem.position.set(-1.0, 0, 1.4); modem.rotation.y = 0.25; scene.add(modem);
  modem.userData.pose({ arms: { l: [0, 0.5, 0], r: [0, 0.4, 0] } });
  modem.userData.reach("l", [0.5, 1.0, 0.2]);
  finishScene(stage, P, [modem], [0.5, 2.0, 6.2, 0.5, 1.9, 0]);
});
</script></body></html>
