<!doctype html>
<html><head><meta charset="utf-8"><title>Modem anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createModem } from './modem.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, exposure: 1,
    sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 }, rim: { color: '#fff3dc', strength: 1.4, width: 0.55 },
    sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 } });
  const scene = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#f1d9a8', roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const views = [[-0.9, 'front-left'], [0, 'front'], [2.4, 'back-right']];
  const pm = new Set();
  views.forEach(([ry, _], i) => {
    const m = createModem({ scale: 1.6 }); m.position.set((i - 1) * 1.5, 0, 0); m.rotation.y = ry; scene.add(m);
    m.userData.pose({ arms: { l: [0, 0.5, 0], r: [0, 0.2, 0] } });
    m.userData.reach('l', [0.55, 0.85, 0.25]); m.traverse((o) => pm.add(o));
  });
  stage.toonify(scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [190, 1100, 150, 1.8]]);
  stage.camera.position.set(0, 1.0, 5.2); stage.camera.lookAt(0, 0.75, 0);
  stage.finish();
});
</script></body></html>
