<!doctype html>
<html><head><meta charset="utf-8"><title>Moderna q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — For each cancer patient, the MODEM reads the tumour and sends a personal message.
import { THREE, mat, add, blob, num, makeStage, finishScene, createModem, createPerson, lipidBubble, aimArm } from './common.js';
import { guard } from './kit.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { ground: '#f4f1ea' });
  const scene = stage.scene;
  add(scene, new THREE.PlaneGeometry(14, 6), mat('#cfe6ee'), [0, 3, -2], [0, 0, 0]);
  // patient with a tumour
  const pat = createPerson({ coat: '#eaf4fb', trim: '#9ec8e0', hair: '#4a3020', scale: 2.0 });
  pat.position.set(1.9, 0, 0); pat.rotation.y = -0.55; scene.add(pat);
  const tum = new THREE.Group(); tum.position.set(0, 0.62, 0.21); pat.add(tum);
  blob(tum, mat('#7a2f8a', { roughness: 0.5 }), [0, 0, 0], [0.17, 0.15, 0.1]);
  blob(tum, mat('#8e3aa0'), [0.1, 0.06, 0.02], [0.09, 0.08, 0.07]);
  blob(tum, mat('#6a2578'), [-0.09, -0.05, 0.02], [0.08, 0.08, 0.07]);
  // neoantigens: unique coloured spikes
  ['#ffe03a', '#3affb0', '#ff5a5a', '#4aa8ff', '#ff9a2a', '#fff'].forEach((c, i) => {
    const a = i * 1.05, cone = add(tum, new THREE.ConeGeometry(0.03, 0.09, 10), mat(c), [Math.cos(a) * 0.15, Math.sin(a) * 0.13, 0.08], [0, 0, 0]);
    cone.rotation.set(Math.sin(a) * -0.9 + 0.8 * 0, 0, 0); cone.lookAt(new THREE.Vector3(0, 0, 0).add(new THREE.Vector3(Math.cos(a) * 3, Math.sin(a) * 3, 2).applyMatrix4(tum.matrixWorld)));
  });
  // modem scanning
  const modem = createModem({ scale: 1.8 }); modem.position.set(-1.6, 0, 0.6); modem.rotation.y = -0.2; scene.add(modem);
  modem.userData.pose({ arms: { l: [0, 0.5, 0], r: [0, 0.5, 0] }, antenna: [0.15, -0.15] });
  // scanning beam from the modem's screen to the tumour
  scene.updateMatrixWorld(true);
  const a = modem.localToWorld(new THREE.Vector3(0.1, 0.57, 0.2)), b = tum.getWorldPosition(new THREE.Vector3());
  const beam = add(scene, new THREE.ConeGeometry(0.18, a.distanceTo(b) - 0.3, 24, 1, true), new THREE.MeshBasicMaterial({ color: '#7dffe8', transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }));
  beam.castShadow = false;
  const e = b.clone().sub(a).setLength(a.distanceTo(b) - 0.3).add(a); beam.position.copy(a.clone().add(e).multiplyScalar(0.5)); beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), e.clone().sub(a).normalize());
  // personal message bubble heading back to patient, above the beam
  const bub = lipidBubble(0.24, '#4aa8ff'); bub.position.set(0.1, 2.4, 0.9); scene.add(bub);
  const tag = lipidBubble(0.16, '#ffe03a'); tag.position.set(0.9, 2.1, 0.9); scene.add(tag);
  finishScene(stage, P, [modem, pat], [0.2, 1.5, 5.4, 0.2, 1.3, 0]);
});
</script></body></html>
