<!doctype html>
<html><head><meta charset="utf-8"><title>Moderna q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — The MODEM's ticker reads MRNA.
import { THREE, mat, add, rbox, num, makeStage, finishScene, createModem, textSprite } from './common.js';
import { guard } from './kit.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { ground: '#d8d2c4' });
  const scene = stage.scene;
  add(scene, new THREE.BoxGeometry(14, 7, 0.2), mat('#2a3550'), [0, 3.4, -1.0]);
  // big LED ticker board
  rbox(scene, mat('#1c2230'), 5.4, 2.0, 0.2, [0.9, 2.9, -0.7], [0, 0, 0], 0.08);
  const tex = textSprite('MRNA', { fg: '#5dff8a', font: 'bold 170px monospace' });
  const face = add(scene, new THREE.PlaneGeometry(5.0, 1.6), new THREE.MeshBasicMaterial({ map: tex }), [0.9, 2.9, -0.58]);
  face.material.map.repeat.set(1, 0.5); face.material.map.offset.set(0, 0.25); face.castShadow = false;
  // green up arrow + candle chart
  const arrow = new THREE.Group(); arrow.position.set(-2.4, 2.9, -0.5); scene.add(arrow);
  add(arrow, new THREE.ConeGeometry(0.32, 0.5, 4), mat('#2ee06a', { emissive: '#1fa04c', emissiveIntensity: 0.6 }), [0, 0.35, 0], [0, Math.PI / 4, 0]);
  add(arrow, new THREE.BoxGeometry(0.2, 0.6, 0.12), mat('#2ee06a', { emissive: '#1fa04c', emissiveIntensity: 0.6 }), [0, -0.2, 0]);
  [0.5, 0.8, 0.65, 1.1, 1.0, 1.5].forEach((h, i) => add(scene, new THREE.BoxGeometry(0.22, h * 0.5, 0.12), mat('#2ee06a'), [3.6 + (i - 2.5) * 0.0 - 0.0 + i * 0.0 - 0.0, 0, 0]).position.set(1.6 + i * 0.5, 1.25 + h * 0.25 - 0.1 - 0.0, -0.9 + 0.0));
  const modem = createModem({ scale: 2.0 }); modem.position.set(-0.4, 0, 1.0); scene.add(modem);
  modem.userData.pose({ arms: { l: [0, 0.8, 0], r: [0, 0.3, 0] }, antenna: [0.3, -0.3] });
  modem.userData.reach('r', [-0.6, 1.2, 0.2]);
  // little blinking ticker lights on the modem: all on
  finishScene(stage, P, [modem], [0.5, 2.0, 5.8, 0.5, 1.9, 0]);
});
</script></body></html>
