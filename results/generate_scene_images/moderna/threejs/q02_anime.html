<!doctype html>
<html><head><meta charset="utf-8"><title>Moderna q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — The MODEM sends mRNA messages wrapped in tiny fat bubbles: lipid nanoparticles.
import { THREE, mat, add, rbox, blob, num, makeStage, finishScene, createModem, lipidBubble, strand } from './common.js';
import { guard } from './kit.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { ground: '#8fd1a0' });
  const scene = stage.scene;
  add(scene, new THREE.CylinderGeometry(1.1, 1.2, 0.12, 40), mat('#f4efe3'), [-1.2, 0.06, 0]);
  const modem = createModem({ scale: 1.6 }); modem.position.set(-1.4, 0.12, 0); modem.rotation.y = 0.45; scene.add(modem);
  modem.userData.pose({ arms: { l: [0, 0.9, 0], r: [0, 0.5, 0] }, antenna: [0.3, -0.3] });
  // bubbles streaming out toward +x, rising
  const sizes = [0.26, 0.2, 0.3, 0.22, 0.17, 0.12];
  sizes.forEach((R, i) => {
    const b = lipidBubble(R, ['#ff5fa2', '#ff7a3c', '#c04fff'][i % 3]);
    const t = i / (sizes.length - 1);
    b.position.set(-0.4 + i * 0.6, 1.0 + Math.sin(i * 1.3) * 0.25 + t * 0.2, 0.2 + (i % 2) * 0.35);
    b.rotation.set(i, i * 0.7, 0); scene.add(b);
  });
  // a spare strand floating out of the port
  const s = strand({ len: 0.35, amp: 0.06, color: '#ff5fa2', r: 0.016 }); s.position.set(-0.55, 0.68, 0.7); s.rotation.z = 0.3; scene.add(s);
  finishScene(stage, P, [modem], [0.4, 1.25, 4.6, 0.5, 0.95, 0]);
});
</script></body></html>
