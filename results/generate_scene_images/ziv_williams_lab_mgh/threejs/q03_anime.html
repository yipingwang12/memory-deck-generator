<!doctype html>
<html><head><meta charset="utf-8"><title>q03_anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import { THREE, guard, mat, add, blob, box, textTex, makeStage, buildOR, brain, scalpel, neuron, probe, setupSieve, finishScene } from "./props.js";
guard(() => {
  const P = new URLSearchParams(location.search); const { stage, num } = makeStage(P); const scene = stage.scene;
  const lamp = buildOR(scene);
  // brain (left) and language-model robot (right), linked by matched glowing threads that the sieve holds
  const bx = -1.9, rx = 1.9;
  add(scene, new THREE.CylinderGeometry(0.1, 0.2, 0.8, 20), mat('#aeb7c0', { metalness: 0.6 }), [bx, 0.4, -0.8]);
  const b = brain(2.0); b.position.set(bx, 1.15, -0.8); scene.add(b);
  // LLM: robot head with layered node columns inside a glowing screen
  const bot = new THREE.Group(); bot.position.set(rx, 1.3, -0.8); scene.add(bot);
  box(bot, mat('#e9eef5', { metalness: 0.3 }), [0, 0, 0], [1.1, 0.95, 0.8]);
  box(bot, mat('#1c2340'), [0, 0.02, 0.41], [0.9, 0.7, 0.02]);
  add(bot, new THREE.CylinderGeometry(0.03, 0.03, 0.3, 8), mat('#c9ced4'), [0, 0.62, 0]); blob(bot, mat('#ff5a7a', { emissive: '#ff5a7a', emissiveIntensity: 0.8 }), [0, 0.8, 0], [0.07, 0.07, 0.07]);
  add(bot, new THREE.CylinderGeometry(0.1, 0.1, 0.5, 12), mat('#aab4c0'), [0, -0.7, 0]);
  const cols = [3, 4, 4, 3], nodes = [];
  cols.forEach((n, ci) => { for (let i = 0; i < n; i++) { const p = [-0.33 + ci * 0.22, (i - (n - 1) / 2) * 0.15, 0.43];
    blob(bot, mat('#7fe3ff', { emissive: '#4cd0ff', emissiveIntensity: 1.2 }), p, [0.045, 0.045, 0.02]); nodes.push(p); } });
  // threads brain -> model, passing near the sieve
  const link = (a, c, col) => { const mid = new THREE.Vector3((a.x + c.x) / 2, Math.max(a.y, c.y) + 0.9, (a.z + c.z) / 2);
    const curve = new THREE.QuadraticBezierCurve3(a, mid, c); const t = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.018, 8), mat(col, { emissive: col, emissiveIntensity: 0.9 })); scene.add(t); return t; };
  link(new THREE.Vector3(bx + 0.2, 1.4, -0.7), new THREE.Vector3(rx - 0.3, 1.45, -0.4), '#ffd24a');
  link(new THREE.Vector3(bx + 0.3, 1.25, -0.6), new THREE.Vector3(rx - 0.3, 1.2, -0.4), '#ff8fb0');
  link(new THREE.Vector3(bx + 0.1, 1.15, -0.5), new THREE.Vector3(rx - 0.3, 1.32, -0.4), '#7fe3ff');
  [[bx + 0.3, 2.1, -1.2, 1.0], [rx - 0.6, 2.4, -1.2, 0.9]].forEach(([x, y, z, s], i) => { const n = neuron(i ? '#7fe3ff' : '#ffd24a', s); n.position.set(x, y, z); scene.add(n); });
  const sieve = setupSieve(scene, stage, { pos: [0, 0, 0.6], ry: 0, scale: 1.4, pose: { headTilt: 0.05, arms: { l: [0, 1.3, 0.2], r: [0, 1.3, 0.2] } }, reach: { l: [0.5, 1.9, 0.5], r: [-0.5, 1.9, 0.5] } });
  stage.camera.position.set(num("cx", 0), num("cy", 1.1), num("cz", 4.6)); stage.camera.lookAt(num("tx", 0), num("ty", 1.0), 0);
  finishScene(scene, stage, sieve, false);
});
</script></body></html>
