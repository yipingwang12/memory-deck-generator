<!doctype html>
<html><head><meta charset="utf-8"><title>q01_anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import { THREE, guard, mat, add, blob, box, textTex, makeStage, buildOR, brain, scalpel, neuron, setupSieve, finishScene } from "./props.js";
guard(() => {
  const P = new URLSearchParams(location.search); const { stage, num } = makeStage(P); const scene = stage.scene;
  const lamp = buildOR(scene);
  // operating table + patient head draped, brain model on tray
  const tbl = new THREE.Group(); scene.add(tbl); tbl.position.set(1.7, 0, -0.6);
  add(tbl, new THREE.CylinderGeometry(0.12, 0.2, 0.7, 16), mat('#aeb7c0', { metalness: 0.6 }), [0, 0.35, 0]);
  box(tbl, mat('#dfe6ec', { metalness: 0.3 }), [0, 0.76, 0], [1.9, 0.12, 0.8]);
  box(tbl, mat('#5bb8a8'), [0.15, 0.86, 0], [1.3, 0.1, 0.7]);
  
  const b = brain(1.3); b.position.set(-0.55, 1.12, 0.05); tbl.add(b);
  const tray = new THREE.Group(); scene.add(tray); tray.position.set(-2.3, 0, -0.6);
  add(tray, new THREE.CylinderGeometry(0.05, 0.08, 0.9, 12), mat('#aeb7c0', { metalness: 0.6 }), [0, 0.45, 0]);
  box(tray, mat('#dfe6ec', { metalness: 0.4 }), [0, 0.92, 0], [0.8, 0.05, 0.5]);
  const sc = scalpel(0.35); sc.rotation.z = Math.PI / 2; sc.position.set(0, 0.97, 0.05); tray.add(sc);
  const sieve = setupSieve(scene, stage, { pos: [-0.7, 0, 0.5], ry: 0.3, scale: 1.4, pose: { headTilt: 0.05, arms: { r: [0, 0.5, 0.2] } }, reach: { l: [0.15, 0.95, 1.0] } });
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.325, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2.5), mat('#2fa58f')); cap.scale.set(1, 1, 0.55); cap.position.set(0, 0.6, -0.02); sieve.add(cap);
  const mask = box(sieve, mat('#e8f4f2'), [0, 0.43, 0.097], [0.2, 0.1, 0.01]);
  const s2 = scalpel(0.55); sieve.userData.parts.hands.l.add(s2); s2.position.set(0, 0.02, 0.03); s2.rotation.set(0.1, 0, 2.2); s2.scale.setScalar(1.1);
  stage.camera.position.set(num("cx", 0.3), num("cy", 1.1), num("cz", 3.6)); stage.camera.lookAt(num("tx", 0.3), num("ty", 0.75), 0);
  finishScene(scene, stage, sieve, false);
});
</script></body></html>
