<!doctype html>
<html><head><meta charset="utf-8"><title>Arrakis anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createSandworm } from './sandworm.js';
const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 });
guard(() => {
  const stage = createAnimeStage({ fov: 36, sunElevation: 35, sunAzimuth: 150, sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#ffe8d0', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 } });
  const s = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat('#e8b86b')); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; s.add(g);
  const ws = [];
  [[-2.2, -0.9], [0, 0], [2.2, 0.9]].forEach(([x, ry]) => {
    const w = createSandworm({ tilt: 1.25 }); w.position.set(x, 0, 0); w.rotation.y = ry; s.add(w); ws.push(w);
  });
  const pm = new Set(); ws.forEach((w) => w.traverse((o) => pm.add(o)));
  stage.toonify(s, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9]]);
  stage.camera.position.set(0, 1.1, 5.0); stage.camera.lookAt(0, 0.8, 0);
  stage.finish();
});
</script></body></html>
