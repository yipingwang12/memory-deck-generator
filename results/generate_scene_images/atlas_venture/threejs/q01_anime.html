<!doctype html>
<html><head><meta charset="utf-8"><title>Atlas Venture q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { guard } from "./kit.js";
import { THREE, mat, add, blob, box, cyl, makeStage, finishScene, placeTitan, coin, coinHeap, bag, horse, owl, house, sapling, rails, railwayCar } from "./props.js";
guard(() => {
  const ctx = makeStage(), { scene, num } = ctx;
  const shell = mat('#f7efe0', { roughness: 0.5 }), inner = mat('#e9d9b8');
  const egg = new THREE.Group(); egg.position.set(0.95, 0, 0.3); scene.add(egg);
  const bot = add(egg, new THREE.SphereGeometry(1, 32, 20, 0, Math.PI * 2, Math.PI * 0.42, Math.PI * 0.58), shell, [0, 0.62, 0], [0, 0, 0], [0.6, 0.85, 0.6]);
  bot.material.side = THREE.DoubleSide;
  // zigzag crack rim
  for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283; add(egg, new THREE.ConeGeometry(0.1, 0.22, 4), shell, [Math.cos(a) * 0.5, 0.78 + (i % 2) * 0.0, Math.sin(a) * 0.5], [0, -a, 0], [1, 1, 0.6]); }
  const o = owl(1.7); o.position.set(0.95, 0.35, 0.3); egg.parent.add(o);
  const cap = add(scene, new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.38), shell, [1.55, 0.25, 0.9], [0.5, 0, -1.1], [0.42, 0.6, 0.42]); cap.material.side = THREE.DoubleSide;
  for (let i = 0; i < 6; i++) box(scene, shell, [0.4 + i * 0.28, 0.03, 1.0 + (i % 3) * 0.2], [0.14, 0.03, 0.1], [0, i, 0]);
  const t = placeTitan(scene, { pos: [-0.9, 0, 0.1], yaw: 0.55, scale: 1.7, armLen: 1.25, pose: { lean: 0.12, headTilt: 0.15, headYaw: 0.2, legs: { l: [0.1, 0], r: [-0.1, 0] } }, hands: { l: [0.15, 1.2, 0.9], r: [0.45, 1.0, 0.9] }, poles: { l: [1, -0.2, 0.2], r: [-1, -0.3, 0.2] } });
  finishScene(ctx, [t, o], { pos: [0.2, 1.0, 4.7], look: [0.2, 0.95, 0] });
});
</script></body></html>
