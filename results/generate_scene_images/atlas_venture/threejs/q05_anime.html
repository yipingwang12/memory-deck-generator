<script type="module">
import { guard } from "./kit.js";
import { THREE, mat, add, blob, box, cyl, makeStage, finishScene, placeTitan, coin, coinHeap, bag, horse, owl, house, sapling, rails, railwayCar } from "./props.js";
guard(() => {
  const ctx = makeStage(), { scene, num } = ctx;
