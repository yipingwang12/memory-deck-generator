<!doctype html>
<html><head><meta charset="utf-8"><title>Atlas Venture q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { guard } from "./kit.js";
import { THREE, mat, add, blob, box, cyl, makeStage, finishScene, placeTitan, coin, coinHeap, bag, horse, owl, house, sapling, rails, railwayCar } from "./props.js";
guard(() => {
  const ctx = makeStage(), { scene, num } = ctx;
  // river + far bank
  box(scene, mat('#3d8fd0', { roughness: 0.3 }), [0, 0.02, -6], [60, 0.04, 5]);
  box(scene, mat('#c9b48a'), [0, 0.03, -3.2], [60, 0.05, 0.6]);
  const bricks = ['#b5533c', '#a64b36', '#c46a48', '#9c4a38'];
  for (let i = 0; i < 9; i++) { const h = 1.6 + (i * 37 % 5) * 0.5, x = -9 + i * 2.3;
    box(scene, mat(bricks[i % 4]), [x, h / 2, -10], [1.9, h, 1.6]);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) box(scene, mat('#fff3b0', { emissive: '#ffcf50', emissiveIntensity: 0.5 }), [x - 0.4 + c * 0.8, 0.8 + r * 0.7, -9.18], [0.3, 0.38, 0.03]); }
  blob(scene, mat('#d8d2c4'), [3.5, 4.2, -10], [1.1, 1.0, 1.1]); cyl(scene, mat('#b9b2a4'), [3.5, 2.8, -10], 0.9, 2.2);
  for (const x of [-5, 5.5, -7.5]) { cyl(scene, mat('#6b4426'), [x, 0.5, -3.6], 0.1, 1, [0, 0, 0]); blob(scene, mat('#5aa83a'), [x, 1.5, -3.6], [0.7, 0.7, 0.7]); }
  // BRIDGE held overhead
  const br = new THREE.Group(); scene.add(br);
  const stone = mat('#e6dcc2'), brick = mat('#e6dcc2');
  box(br, stone, [0, 2.08, 0], [3.6, 0.26, 1.0]);
  box(br, mat('#4b4e57'), [0, 2.22, 0], [3.5, 0.04, 0.7]);
  for (const s of [-1, 1]) { box(br, stone, [0, 2.45, s * 0.44], [3.6, 0.22, 0.12]);
    for (let i = -4; i <= 4; i++) cyl(br, stone, [i * 0.4, 2.3, s * 0.44], 0.04, 0.16);
    for (const x of [-1.7, 1.7]) { box(br, brick, [x, 2.7, s * 0.44], [0.28, 0.6, 0.28]); blob(br, mat('#fff3b0', { emissive: '#ffcf50', emissiveIntensity: 0.8 }), [x, 3.08, s * 0.44], [0.12, 0.12, 0.12]); } }
  for (const x of [-1.9, 1.9]) box(br, brick, [x, 1.85, 0], [0.34, 0.6, 1.0]);
  for (const x of [-1.2, 0, 1.2]) box(br, stone, [x, 1.88, 0], [0.5, 0.12, 0.98]);
  const t = placeTitan(scene, { pos: [0, 0, 0], scale: 1.5, armLen: 1.8, pose: { headTilt: -0.1, legs: { l: [0.1, 0], r: [-0.1, 0] } }, hands: { l: [0.62, 1.94, 0.0], r: [-0.62, 1.94, 0.0] }, poles: { l: [1, -0.2, -0.4], r: [-1, -0.2, -0.4] } });
  finishScene(ctx, [t], { pos: [0, 1.6, 5.6], look: [0, 1.5, 0] });
});
</script></body></html>
