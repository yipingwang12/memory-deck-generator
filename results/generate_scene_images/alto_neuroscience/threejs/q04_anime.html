<!doctype html>
<html><head><meta charset="utf-8"><title>Alto q04 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q04 - ALTO-300 on the SAXOPHONE plays to lift major depressive disorder.
import { THREE, guard, makeStage, ground, finish, createSax, add, mat, blob, box, cyl, label, note, wave, playPose, noteTrail, oak, rng } from './common.js';
guard(() => {

  const { stage, num } = makeStage({ shadowSize: 5 }); const scene = stage.scene;
  ground(scene, '#7d8fa8');
  const sax = createSax({ scale: 1.8 }); sax.position.set(-1.5, 0, 0.7); sax.rotation.y = 0.3; scene.add(sax); playPose(sax, 0.05);
  // ALTO-300 banner on a pole
  const pole = new THREE.Group(); pole.position.set(0.0, 0, 0.1); scene.add(pole);
  cyl(pole, mat('#6b4a2b'), [0, 0.8, 0], 0.03, 1.6);
  const b = label('ALTO-300', 1.5, 0.45, { fg: '#ffffff', bg: '#e8590c', border: '#ffd23f' }); b.position.set(0.78, 1.35, 0.0); pole.add(b);
  noteTrail(scene, [-1.9, 1.3, 0.5], { n: 5, step: [0.4, 0.3, 0.0], scale: 1.6 });
  // sad cloud lifted by balloons toward the sun
  const cl = new THREE.Group(); cl.position.set(2.0, 1.8, -0.4); scene.add(cl);
  const cm = mat('#8d97a8', { roughness: 1 });
  [[0, 0, 0, 0.45], [-0.45, -0.05, 0, 0.33], [0.45, -0.05, 0, 0.35], [0.1, 0.3, 0, 0.32], [-0.2, 0.2, 0, 0.3]].forEach(([x, y, z, r]) => blob(cl, cm, [x, y, z], [r, r * 0.8, r * 0.8]));
  for (const s of [-1, 1]) { blob(cl, mat('#fff'), [s * 0.17, 0.0, 0.34], [0.07, 0.085, 0.03]); blob(cl, mat('#1a2540'), [s * 0.17, -0.02, 0.36], [0.04, 0.055, 0.03]);
    add(cl, new THREE.BoxGeometry(0.16, 0.025, 0.02), mat('#3a3f50'), [s * 0.17, 0.12, 0.35], [0, 0, -s * 0.35]); }
  add(cl, new THREE.TorusGeometry(0.07, 0.015, 8, 16, Math.PI), mat('#3a3f50'), [0, -0.2, 0.36]);
  blob(cl, mat('#7ec8ff'), [0.2, -0.12, 0.38], [0.025, 0.05, 0.02]);
  const bl = ['#ffd23f', '#ff7a59', '#ffe066', '#ffb703'];
  [[-0.5, 1.4], [-0.15, 1.65], [0.25, 1.5], [0.6, 1.35]].forEach(([x, h], i) => {
    blob(cl, mat(bl[i], { roughness: 0.3 }), [x, 0.95 + h * 0.2 + 0.2, 0.1], [0.19, 0.23, 0.19]);
    add(cl, new THREE.CylinderGeometry(0.004, 0.004, 0.75, 4), mat('#444'), [x * 0.6, 0.55, 0.05], [0, 0, -x * 0.25]);
  });
  const r = rng(3); for (let i = 0; i < 14; i++) add(scene, new THREE.CylinderGeometry(0.008, 0.008, 0.18, 4), mat('#8fc6ff'), [0.6 + r() * 2, 1.4 + r() * 1.0, -0.3 + r() * 0.6], [0, 0, 0.1]);
  // sun
  const sun = blob(scene, new THREE.MeshBasicMaterial({ color: '#ffe36b' }), [4.6, 3.7, -3], [0.7, 0.7, 0.7]);
  finish(stage, [sax], { cam: [0.2, 1.9, 5.6], look: [0.4, 1.95, 0], clouds: null });

});
</script></body></html>
