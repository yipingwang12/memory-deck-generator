<html><head><meta charset="utf-8"><title>Alto q06 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 - For ALTO-203, the SAXOPHONE compares THETA and BETA waves in people who feel no joy.
import { THREE, guard, makeStage, ground, finish, createSax, add, mat, blob, box, cyl, label, note, wave, playPose, noteTrail, oak, rng } from './common.js';
guard(() => {

  const { stage, num } = makeStage({ shadowSize: 5 }); const scene = stage.scene;
  ground(scene, '#b6c3dd');
  const frame = mat('#232a3d');
  const scr = (x, title, color, amp, cy, tc) => {
    const g = new THREE.Group(); g.position.set(x, 0, -0.8); scene.add(g);
    for (const s of [-0.5, 0.5]) cyl(g, frame, [s, 0.5, 0], 0.04, 1.0);
    box(g, frame, [0, 1.55, 0], [1.9, 1.35, 0.1]); box(g, mat('#07111f'), [0, 1.55, 0.055], [1.75, 1.2, 0.02]);
    const w = wave(color, 1.5, amp, cy, 0.03); w.position.set(0, 1.5, 0.075); g.add(w);
    const t = label(title, 1.6, 0.36, { fg: '#fff', bg: tc }); t.position.set(0, 2.43, 0.0); g.add(t);
  };
  scr(-1.7, 'THETA', '#ffb703', 0.38, 1.5, '#d9480f'); scr(1.7, 'BETA', '#39e6ff', 0.1, 9, '#0b7285');
  const b = label('ALTO-203', 1.6, 0.4, { fg: '#fff', bg: '#e8590c', border: '#ffd23f' }); b.position.set(0, 3.0, -0.8); scene.add(b);
  const sax = createSax({ scale: 1.7 }); sax.position.set(0, 0, 0.9); sax.rotation.y = 0.0; scene.add(sax);
  sax.userData.pose({ legs: { l: [0.08, 0], r: [-0.08, 0] } });
  sax.userData.reach('l', [0.9, 1.0, 0.15]); sax.userData.reach('r', [-0.9, 1.0, 0.15]);
  // joyless person: grey face, flat mouth, slumped
  const gp = new THREE.Group(); gp.position.set(2.0, 0, 1.3); gp.rotation.y = -0.35; gp.scale.setScalar(1.0); scene.add(gp);
  const gm = mat('#aeb4c0');
  blob(gp, gm, [0, 0.32, 0], [0.3, 0.32, 0.26]); blob(gp, gm, [0.02, 0.8, 0.05], [0.26, 0.26, 0.24]);
  for (const s of [-1, 1]) { blob(gp, mat('#fff'), [s * 0.09, 0.8, 0.23], [0.055, 0.06, 0.02]); blob(gp, mat('#444a5c'), [s * 0.09, 0.78, 0.245], [0.03, 0.035, 0.02]);
    add(gp, new THREE.BoxGeometry(0.1, 0.018, 0.01), mat('#444a5c'), [s * 0.09, 0.87, 0.245], [0, 0, s * 0.2]); }
  add(gp, new THREE.BoxGeometry(0.15, 0.02, 0.01), mat('#444a5c'), [0.02, 0.69, 0.255]);
  finish(stage, [sax], { cam: [0, 1.7, 5.4], look: [0.2, 1.35, 0], chars: [] });

});
</script></body></html>
