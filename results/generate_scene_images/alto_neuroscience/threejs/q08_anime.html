<!doctype html>
<html><head><meta charset="utf-8"><title>Alto q08 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q08 - The SAXOPHONE plays in LOS ALTOS, California.
import { THREE, guard, makeStage, ground, finish, createSax, add, mat, blob, box, cyl, label, note, wave, playPose, noteTrail, oak, rng } from './common.js';
guard(() => {

  const { stage, num } = makeStage({ shadowSize: 6, el: 9, az: 200, sky: { cover: 1.5 } }); const scene = stage.scene;
  ground(scene, '#d9a441');
  const hill = mat('#d6a23d'), hill2 = mat('#b8872e');
  [[-6, -12, 6], [6, -16, 8], [0, -24, 12], [-14, -20, 9]].forEach(([x, z, r], i) => blob(scene, i % 2 ? hill2 : hill, [x, -r * 0.45, z], [r * 1.6, r, r]));
  oak(scene, -3.2, -2.5, 1.3); oak(scene, 4.0, -4, 1.6); oak(scene, 2.6, -1.8, 0.9);
  const r = rng(6); for (let i = 0; i < 70; i++) blob(scene, mat('#ff8c1a'), [(r() - 0.5) * 9, 0.03, -1 + r() * 4], [0.04, 0.03, 0.04]);
  // town sign
  const sg = new THREE.Group(); sg.position.set(1.25, 0, 0.2); sg.rotation.y = -0.15; scene.add(sg);
  for (const x of [-0.9, 0.9]) box(sg, mat('#6b4a2b'), [x, 0.7, -0.1], [0.12, 1.4, 0.12]);
  box(sg, mat('#8a5a2f'), [0, 1.2, 0], [2.2, 0.7, 0.1]);
  const t = label('LOS ALTOS', 2.0, 0.55, { fg: '#fff3cc', bg: '#3f2a14', border: '#ffd23f' }); t.position.set(0, 1.2, 0.055); sg.add(t);
  const sax = createSax({ scale: 1.5 }); sax.position.set(-0.9, 0, 1.2); sax.rotation.y = 0.3; scene.add(sax); playPose(sax, 0.05);
  noteTrail(scene, [-1.3, 1.35, 1.2], { n: 6, step: [-0.3, 0.28, 0.0], scale: 1.6 });
  finish(stage, [sax], { cam: [0, 1.4, 5.2], look: [0.1, 1.2, 0], clouds: [[100, 700, 80, 1.0], [140, 900, 100, 1.4], [210, 800, 80, 1]] });

});
</script></body></html>
