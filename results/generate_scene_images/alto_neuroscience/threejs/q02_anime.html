<html><head><meta charset="utf-8"><title>Alto q02 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 - The SAXOPHONE picks each patient's drug by EEG, thinking tests and a WEARABLE on the wrist.
import { THREE, guard, makeStage, ground, finish, createSax, add, mat, blob, box, cyl, label, note, wave, playPose, noteTrail, oak, rng } from './common.js';
guard(() => {

  const { stage, num } = makeStage({ shadowSize: 5 }); const scene = stage.scene;
  ground(scene, '#c9d6e2');
  // clinic wall
  box(scene, mat('#eaf2f7'), [0, 2, -1.6], [10, 4, 0.1]);
  // EEG monitor
  const frame = mat('#232a3d'); const mon = new THREE.Group(); mon.position.set(-2.2, 0, -0.9); scene.add(mon);
  cyl(mon, frame, [0, 0.55, 0], 0.05, 1.1); box(mon, frame, [0, 1.65, 0], [1.7, 1.1, 0.1]);
  box(mon, mat('#07111f'), [0, 1.65, 0.055], [1.55, 0.95, 0.02]);
  [['#39ff7a', 0.28, 2.5, 0.25], ['#4fd5ff', 0.2, 4, 0.0], ['#ffd23f', 0.16, 6, 0.0]].forEach(([c, a, cy, y], i) => { const w = wave(c, 1.35, a * 0.5, cy, 0.016, i); w.position.set(0, 1.65 + 0.3 - i * 0.3, 0.075); mon.add(w); });
  // thinking test: jigsaw puzzle tablet
  const pz = new THREE.Group(); pz.position.set(1.4, 0.0, -1.0); scene.add(pz);
  cyl(pz, frame, [0, 0.3, 0], 0.05, 0.6); box(pz, frame, [0, 1.0, 0], [1.2, 0.9, 0.08]);
  box(pz, mat('#fff'), [0, 1.0, 0.045], [1.1, 0.8, 0.02]);
  [['#ff6b6b', -0.28, 0.2], ['#4fb3ff', 0.28, 0.2], ['#ffd23f', -0.28, -0.2], ['#58c97a', 0.28, -0.2]].forEach(([c, x, y], i) => { const p = box(pz, mat(c, { roughness: 0.5 }), [x - (i === 3 ? -0.04 : 0), 1.0 + y, 0.1], [0.5, 0.36, 0.06]); });
  const bulb = blob(pz, mat('#ffd23f'), [0, 1.0, 0.16], [0.07, 0.07, 0.04]);
  const sax = createSax({ scale: 2.0 }); sax.position.set(-0.4, 0, 0.8); sax.rotation.y = -0.1; scene.add(sax);
  sax.userData.pose({ legs: { l: [0.08, 0], r: [-0.08, 0] } });
  sax.userData.reach('l', [0.15, 1.0, 0.3]); sax.userData.reach('r', [-0.12, 0.62, 0.1]);
  // WEARABLE: smartwatch on a wrist, big
  const wr = new THREE.Group(); wr.position.set(1.7, 0, 1.0); wr.rotation.y = -0.3; scene.add(wr);
  const skin = mat('#ffd9b8');
  cyl(wr, skin, [0, 0.55, 0], 0.17, 1.1, [0, 0, 0], 0.2); blob(wr, skin, [0, 1.25, 0], [0.26, 0.3, 0.17]);
  add(wr, new THREE.TorusGeometry(0.19, 0.06, 12, 32), mat('#ff5d73', { roughness: 0.4 }), [0, 0.62, 0], [Math.PI / 2, 0, 0], [1, 0.85, 0.9]);
  box(wr, mat('#20232c'), [0, 0.62, 0.19], [0.36, 0.36, 0.08]);
  const wface = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.3), new THREE.MeshBasicMaterial({ color: '#39ff7a' })); wface.position.set(0, 0.62, 0.235); wr.add(wface);
  const hb = wave('#0a2a14', 0.26, 0.05, 2, 0.01); hb.position.set(0, 0.62, 0.24); wr.add(hb);
  // a capsule on the table
  const cap = new THREE.Group(); cap.position.set(0.9, 0.06, 1.8); cap.rotation.set(0, 0.5, 0.3); scene.add(cap);
  cyl(cap, mat('#ff5d73'), [-0.09, 0, 0], 0.05, 0.18, [0, 0, Math.PI / 2]); cyl(cap, mat('#fff'), [0.09, 0, 0], 0.05, 0.18, [0, 0, Math.PI / 2]);
  blob(cap, mat('#ff5d73'), [-0.18, 0, 0], [0.05, 0.05, 0.05]); blob(cap, mat('#fff'), [0.18, 0, 0], [0.05, 0.05, 0.05]);
  finish(stage, [sax], { cam: [0, 1.6, 5.2], look: [0, 1.3, 0], clouds: null });

});
</script></body></html>
