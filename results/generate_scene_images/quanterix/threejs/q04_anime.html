<script type="module">
// q04 — A CUNNING fox wears the QUARTER's new CEO crown.
import { THREE, guard, canvasTexture, mat, add, blob, box, cyl, label, reachTo, rng, createQuarter, setup, finishScene } from './scene_common.js';
import { buildFox, buildKoala, hardHat, dropMesh, protein, brickMat, buildWall, buildBrain, eye } from './props.js';
guard(() => {

const ctx = setup({ ground: '#c9b68a', sky: { cover: 0.7 } }), { scene } = ctx;
const fox = buildFox(); fox.scale.setScalar(1.7); fox.position.set(-1.3, 0, 0.2); fox.rotation.y = 0.3; scene.add(fox);
// crown on the fox's head
const crown = new THREE.Group(); crown.position.set(0, 0.28, 0.0); fox.userData.head.add(crown);
const gold = mat('#ffc933', { metalness: 0.5, roughness: 0.25 });
cyl(crown, gold, [0, 0, 0], 0.2, 0.14);
for (let i = 0; i < 5; i++) { const a = i * 2 * Math.PI / 5; add(crown, new THREE.ConeGeometry(0.05, 0.16, 12), gold, [Math.sin(a) * 0.19, 0.14, Math.cos(a) * 0.19]); blob(crown, mat('#e0245e', { emissive: '#600020', emissiveIntensity: 0.4 }), [Math.sin(a) * 0.19, 0.24, Math.cos(a) * 0.19], [0.03, 0.03, 0.03]); }
label(crown, 'CEO', [0, 0, 0.202], [0.24, 0.1], { bg: '#7a1a24', fg: '#ffe9a0' });
const q = createQuarter({ scale: 1.9 }); q.position.set(1.8, 0, 0.5); q.rotation.y = -0.3; scene.add(q);
q.userData.pose({ arms: { l: [0, 0.6], r: [0, -2.3] }, legs: { l: [0, 0], r: [0, 0] } });
finishScene(ctx, q, { cam: [0, 1.7, 6.0], look: [0, 1.5, 0] });

});
