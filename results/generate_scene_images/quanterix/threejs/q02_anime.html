<!doctype html>
<html><head><meta charset="utf-8"><title>Quanterix q02 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — WALL and NAIL-CLIPPER plant flags on the QUARTER.
import { THREE, guard, canvasTexture, mat, add, blob, box, cyl, label, reachTo, rng, createQuarter, setup, finishScene } from './scene_common.js';
import { buildFox, buildKoala, hardHat, dropMesh, protein, brickMat, buildWall, buildBrain, eye } from './props.js';
guard(() => {

const ctx = setup({ ground: '#8fcf6a' }), { scene } = ctx;
const q = createQuarter({ scale: 1.9 }); q.position.set(0, 0, 0.3); scene.add(q);
q.userData.pose({ arms: { l: [0, 0.6], r: [0, -0.6] } });
const pole = mat('#8a5a2e');
for (const [s, c] of [[-1, '#e53935'], [1, '#2457d6']]) {
  const g = new THREE.Group(); g.position.set(s * 0.15, 1.0, 0); g.rotation.z = -s * 0.25; q.add(g);
  cyl(g, pole, [0, 0.3, 0], 0.02, 0.9);
  box(g, mat(c), [s * 0.2, 0.68, 0], [0.4, 0.28, 0.015]);
  blob(g, mat('#ffd24a'), [0, 0.76, 0], [0.04, 0.04, 0.04]);
}
const wall = buildWall({ scale: 1.25 }); wall.position.set(-2.7, 0, 0); wall.rotation.y = 0.35; scene.add(wall);
// nail clipper (upright, side view)
const nc = new THREE.Group(); nc.position.set(2.7, 0, 0.1); nc.scale.setScalar(1.3); nc.rotation.y = -0.4; scene.add(nc);
const steel = mat('#cfd6e0', { metalness: 0.5, roughness: 0.3 });
box(nc, steel, [0, 0.8, 0], [0.45, 1.6, 0.22]);
const lever = box(nc, mat('#e9edf3', { metalness: 0.5, roughness: 0.25 }), [0.08, 1.0, 0.16], [0.38, 1.7, 0.14], [0, 0, -0.06]);
blob(nc, mat('#9aa5b5', { metalness: 0.6 }), [0, 0.1, 0.1], [0.14, 0.14, 0.14]);
box(nc, steel, [0.12, 1.7, 0], [0.3, 0.12, 0.14], [0, 0, 0.5]);
box(nc, mat('#8a94a4', { metalness: 0.6 }), [-0.1, 1.72, 0], [0.22, 0.1, 0.14], [0, 0, -0.5]);
for (const s of [-1, 1]) eye(nc, s * 0.1, 1.2, 0.24, { s: 2.2 });
finishScene(ctx, q, { cam: [0, 1.7, 6.8], look: [0, 1.6, 0] });

});
</script></body></html>
