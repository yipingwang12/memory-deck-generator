<script type="module">
// q09 — The KOALA brings the QUARTER a map of proteins in tissue: spatial proteomics.
import { THREE, guard, canvasTexture, mat, add, blob, box, cyl, label, reachTo, rng, createQuarter, setup, finishScene } from './scene_common.js';
import { buildFox, buildKoala, hardHat, dropMesh, protein, brickMat, buildWall, buildBrain, eye } from './props.js';
guard(() => {

const ctx = setup({ ground: '#a9d889', sky: { cover: 0.9 } }), { scene } = ctx;
const k = buildKoala({ scale: 2.0 }); k.position.set(-2.3, 0, 0); k.rotation.y = 0.35; scene.add(k);
// map
const mp = new THREE.Group(); mp.position.set(-0.7, 0.95, 1.1); mp.rotation.set(-0.12, 0.2, 0.03); scene.add(mp);
const tex = canvasTexture(1024, (c, s) => {
  c.fillStyle = '#f3e3b8'; c.fillRect(0, 0, s, s);
  c.fillStyle = '#e88aa8'; c.beginPath(); c.ellipse(s / 2, s / 2, s * 0.4, s * 0.32, 0.3, 0, 7); c.fill();
  c.fillStyle = '#c85a82'; c.beginPath(); c.ellipse(s / 2 + 40, s / 2 + 10, s * 0.2, s * 0.14, 0.3, 0, 7); c.fill();
  const R = rng(5), cols = ['#ffd21f', '#25c4a0', '#2f6df0', '#7a3be0', '#ffffff'];
  for (let i = 0; i < 110; i++) { const a = R() * 6.28, r = Math.sqrt(R()) * 0.9; c.fillStyle = cols[i % 5]; c.beginPath(); c.arc(s / 2 + Math.cos(a) * r * s * 0.36, s / 2 + Math.sin(a) * r * s * 0.28, 15, 0, 7); c.fill(); c.lineWidth = 3; c.strokeStyle = '#4a2230'; c.stroke(); }
  c.strokeStyle = '#8a5a2e'; c.lineWidth = 12; c.strokeRect(10, 10, s - 20, s - 20);
});
add(mp, new THREE.PlaneGeometry(1.4, 1.4), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 }));
cyl(mp, mat('#8a5a2e'), [0, 0.74, 0.0], 0.05, 1.5, [0, 0, Math.PI / 2]); cyl(mp, mat('#8a5a2e'), [0, -0.74, 0.0], 0.05, 1.5, [0, 0, Math.PI / 2]);
for (const s of [-1, 1]) blob(scene, mat('#9aa0ab'), [-0.7 + s * 0.68, 0.75, 1.2], [0.13, 0.13, 0.13]);
const q = createQuarter({ scale: 1.9 }); q.position.set(1.9, 0, 0.6); q.rotation.y = -0.35; scene.add(q);
q.userData.pose({ arms: { l: [0, 0.6] } });
reachTo(q, 'r', [1.0, 1.2, 1.2]);
finishScene(ctx, q, { cam: [0, 1.5, 6.0], look: [-0.1, 1.3, 0] });

});
