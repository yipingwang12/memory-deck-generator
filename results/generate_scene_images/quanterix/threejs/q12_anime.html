<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q12 — A light NEURO-thread, neurofilament light chain, hangs from the QUARTER.
import { THREE, guard, canvasTexture, mat, add, blob, box, cyl, label, reachTo, rng, createQuarter, setup, finishScene } from './scene_common.js';
import { buildFox, buildKoala, hardHat, dropMesh, protein, brickMat, buildWall, buildBrain, eye } from './props.js';
guard(() => {

const ctx = setup({ ground: '#2b2a5e', sky: { cover: 0.3, zenith: '#1c1a58', horizon: '#8a74d0' }, el: 28 }), { scene } = ctx;
const q = createQuarter({ scale: 1.9 }); q.position.set(-1.8, 0, 0.3); q.rotation.y = 0.2; scene.add(q);
q.userData.pose({ arms: { r: [0, -0.7] } });
reachTo(q, 'l', [-0.9, 1.9, 0.5]);
const pts = [[-0.9, 1.9, 0.5], [-0.5, 1.5, 0.55], [0.0, 1.2, 0.6], [-0.2, 0.8, 0.6], [0.4, 0.5, 0.6], [0.9, 0.4, 0.6], [1.4, 0.35, 0.55]].map((p) => new THREE.Vector3(...p));
const curve = new THREE.CatmullRomCurve3(pts);
const glow = new THREE.MeshStandardMaterial({ color: '#7de8ff', emissive: '#3ac4ff', emissiveIntensity: 1.1, roughness: 0.3 });
add(scene, new THREE.TubeGeometry(curve, 80, 0.035, 10), glow);
for (let i = 0; i <= 9; i++) blob(scene, glow, curve.getPoint(i / 9).toArray(), [0.075, 0.075, 0.075]);
// neuron at the end
const nr = new THREE.Group(); nr.position.set(2.2, 0.55, 0.5); nr.scale.setScalar(1.3); scene.add(nr);
const sm = new THREE.MeshStandardMaterial({ color: '#ff9ad0', emissive: '#c0307a', emissiveIntensity: 0.7 });
blob(nr, sm, [0, 0, 0], [0.32, 0.32, 0.32]); blob(nr, mat('#fff2a0', { emissive: '#ffe070', emissiveIntensity: 1 }), [0, 0, 0.2], [0.12, 0.12, 0.12]);
for (let i = 0; i < 6; i++) { const a = -1.2 + i * 0.5; add(nr, new THREE.CylinderGeometry(0.02, 0.05, 0.55, 8), sm, [Math.cos(a) * 0.5, Math.sin(a) * 0.5 + 0.1, 0], [0, 0, a - Math.PI / 2 + 0.0]); blob(nr, sm, [Math.cos(a) * 0.78, Math.sin(a) * 0.78 + 0.1, 0], [0.07, 0.07, 0.07]); }
finishScene(ctx, q, { cam: [0.2, 1.5, 6.2], look: [0.2, 1.3, 0] });

});
