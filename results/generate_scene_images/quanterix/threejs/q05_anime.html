<html><head><meta charset="utf-8"><title>Quanterix q05 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — The QUARTER sees through a SIMOA single-molecule lens.
import { THREE, guard, canvasTexture, mat, add, blob, box, cyl, label, reachTo, rng, createQuarter, setup, finishScene } from './scene_common.js';
import { buildFox, buildKoala, hardHat, dropMesh, protein, brickMat, buildWall, buildBrain, eye } from './props.js';
guard(() => {

const ctx = setup({ ground: '#e8d6f0', sky: { cover: 0.6 } }), { scene } = ctx;
const q = createQuarter({ scale: 1.9 }); q.position.set(0.8, 0, 0); scene.add(q);
q.userData.pose({ arms: { l: [0, 0.6] } });
// lens in front of the face (screen-left eye side), held by right hand
const lens = new THREE.Group(); lens.position.set(-0.8, 1.45, 1.0); scene.add(lens);
add(lens, new THREE.TorusGeometry(0.62, 0.07, 16, 48), mat('#ffc933', { metalness: 0.5, roughness: 0.25 }));
add(lens, new THREE.CircleGeometry(0.62, 48), new THREE.MeshStandardMaterial({ color: '#bfe6ff', transparent: true, opacity: 0.28, roughness: 0.1 }), [0, 0, 0.0]);
const glowM = new THREE.MeshStandardMaterial({ color: '#ffe14a', emissive: '#ffb800', emissiveIntensity: 0.8 });
const prot = new THREE.Group(); prot.position.set(0, 0.05, 0.12); lens.add(prot);
blob(prot, glowM, [0, 0, 0], [0.17, 0.17, 0.17]);
[[0.3, 0.12], [-0.28, 0.16], [0.05, -0.3], [-0.2, -0.2]].forEach(([x, y]) => { blob(prot, mat('#ff7ab0', { emissive: '#c02060', emissiveIntensity: 0.6 }), [x, y, 0], [0.07, 0.07, 0.07]); const d = Math.hypot(x, y); cyl(prot, glowM, [x / 2, y / 2, 0], 0.02, d, [0, 0, Math.atan2(y, x) - Math.PI / 2]); });
add(lens, new THREE.TorusGeometry(0.34, 0.02, 8, 40), new THREE.MeshBasicMaterial({ color: '#fff7b0' }), [0, 0.05, 0.1]);
const handle = cyl(lens, mat('#7a4b25'), [0.55, -0.82, 0], 0.07, 0.7, [0, 0, -0.7]);
label(lens, 'SIMOA', [0, -0.78, 0.07], [0.8, 0.2], { bg: '#1d3a6b', fg: '#ffffff' });
reachTo(q, 'r', [-0.05, 1.0, 0.9]);
// tiny dots = proteins outside the lens
finishScene(ctx, q, { cam: [0, 1.5, 5.4], look: [0, 1.3, 0] });

});
</script></body></html>
