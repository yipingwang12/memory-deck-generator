<script type="module">
import { guard, rng } from './kit.js';
import * as B from './base.js';
const { THREE, mat, add, blob, box, cyl, textPlane, kitchenStage, frame, toon, createMixer, nose, tank, drop, ribbon, bib } = B;
guard(() => {

const m = createMixer({ scale: 1.4 }); m.position.set(-1.0, 0, 0); m.rotation.y = 0.35; scene.add(m);

toon(stage, scene, [m]); frame(stage, num, { cx: 0.3, cz: 3.7, tx: 0.3, ty: 0.65 });
