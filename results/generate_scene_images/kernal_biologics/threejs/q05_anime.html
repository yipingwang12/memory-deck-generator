<!doctype html>
<html><head><meta charset="utf-8"><title>Kernal q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q05 — KERNEL's soldiers fight MULTIPLE SCARS on the nerves (multiple sclerosis)
import { THREE, guard, mat, add, blob, box, cyl, rng, tcell, makeStage } from './common.js';
guard(() => {
  const S = makeStage({ seed: 21, sky: { zenith: '#5a3fa0', horizon: '#f0b0c8', cover: 0.02, puffCover: 0.02, towerTop: 0.02, cloudLit: '#ffe0e8', cloudShade: '#d6a0c8' } });
  const { scene } = S;
  S.ground('#f1c9d6');
  // giant nerve cable lying along x: thin axon with golden myelin segments, several scarred
  const nerve = new THREE.Group(); nerve.position.set(0.9, 1.9, -0.3); scene.add(nerve);
  cyl(nerve, mat('#f4f0e6'), [0, 0, 0], 0.14, 6.5, [0, 0, Math.PI / 2]);
  const scarAt = [1, 3];
  for (let i = 0; i < 5; i++) {
    const x = -2.2 + i * 1.1, scarred = scarAt.includes(i);
    const seg = blob(nerve, mat(scarred ? '#d9a56a' : '#ffd24a', { roughness: 0.4 }), [x, 0, 0], [0.5, 0.42, 0.42]);
    if (scarred) {
      blob(nerve, mat('#b5304a'), [x, 0.05, 0.38], [0.3, 0.1, 0.08], [0, 0, 0.5]);
      blob(nerve, mat('#b5304a'), [x, 0.05, 0.38], [0.3, 0.1, 0.08], [0, 0, -0.5]);
      box(nerve, mat('#ffe3cc'), [x, 0.02, 0.4], [0.44, 0.14, 0.03], [0, 0, 0.5]);
      box(nerve, mat('#ffe3cc'), [x, 0.02, 0.4], [0.44, 0.14, 0.03], [0, 0, -0.5]);
    }
  }
  // scar patches on ground too: big crossed bandages (MULTIPLE SCARS)
  for (const [x, z] of [[-0.2, 1.8], [3.4, 1.4]]) {
    add(scene, new THREE.CircleGeometry(0.45, 24), mat('#b5304a'), [x, 0.01, z], [-Math.PI / 2, 0, 0]);
    box(scene, mat('#ffe3cc'), [x, 0.03, z], [0.9, 0.02, 0.22], [0, 0.6, 0]); box(scene, mat('#ffe3cc'), [x, 0.035, z], [0.9, 0.02, 0.22], [0, -0.6, 0]);
  }
  // soldiers pointing spears at the scars
  const t1 = tcell({ scale: 1.5 }); t1.position.set(0.6, 0, 1.0); t1.rotation.y = -0.2; scene.add(t1); S.toon(t1);
  const t2 = tcell({ scale: 1.5, color: '#7fd0a0' }); t2.position.set(2.5, 0, 1.0); t2.rotation.y = -0.6; scene.add(t2); S.toon(t2);
  const k = S.kernel({ scale: 1.6 }); k.position.set(-1.1, 0, 1.0); k.rotation.y = 0.5; scene.add(k);
  k.userData.pose({ legs: { l: [0.1, 0.05], r: [-0.1, -0.05] } });
  k.userData.reach('l', [0.5, 1.0, 0.5]); k.userData.reach('r', [-0.45, 0.5, 0.3]);
  S.toon(k);
  S.finish({ x: 0.9, y: 1.4, z: 5.8, tx: 0.9, ty: 1.0 });
});
</script></body></html>
