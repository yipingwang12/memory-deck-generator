<!doctype html>
<html><head><meta charset="utf-8"><title>Kernal q04</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q04 — the KERNEL's lead soldier wears its own letters, K and R: KR-402
import { THREE, guard, mat, add, blob, box, cyl, sign, tcell, makeStage } from './common.js';
guard(() => {
  const S = makeStage({ seed: 12 }); const { scene } = S;
  S.ground('#79b455');
  add(scene, new THREE.CircleGeometry(2.6, 48), mat('#d9bd86'), [0.6, 0.004, 0.3], [-Math.PI / 2, 0, 0]);
  // lead soldier, big, with a K R breastplate and banner
  const t = tcell({ scale: 2.5, shield: false, spear: false, plume: '#ffcf3a' }); t.position.set(1.0, 0, 0.5); t.rotation.y = -0.2; scene.add(t); S.toon(t);
  // breastplate sign on the soldier belly
  sign(scene, 'KR', [1.0, 0.45, 1.64], [0.9, 0.5], { bg: '#e2453c', fg: '#fff6d8', w: 512, h: 280, font: 'bold 220px sans-serif' });
  // banner pole with KR-402
  cyl(scene, mat('#8a5a2b'), [2.55, 1.5, 0.3], 0.04, 3.0);
  sign(scene, 'KR-402', [2.1, 2.5, 0.3], [1.0, 0.5], { bg: '#2a4f9e', fg: '#ffffff', w: 512, h: 256, font: 'bold 130px sans-serif' });
  box(scene, mat('#d9a42e'), [2.1, 2.78, 0.28], [1.04, 0.05, 0.03]);
  // kernel saluting at left
  const k = S.kernel({ scale: 1.9 }); k.position.set(-1.1, 0, 1.2); k.rotation.y = 0.5; scene.add(k);
  k.userData.pose({ legs: { l: [0.1, 0.05], r: [-0.1, -0.05] } });
  k.userData.reach('l', [0.15, 1.0, 0.55]); k.userData.reach('r', [-0.45, 0.5, 0.3]);
  S.toon(k);
  S.finish({ x: 0.8, y: 1.3, z: 5.6, tx: 0.8, ty: 1.1 });
});
</script></body></html>
