<!doctype html>
<html><head><meta charset="utf-8"><title>Kernal q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q06 — a HARP plays, a REEF of coins grows around the KERNEL up to its full height
import { THREE, guard, mat, add, blob, box, cyl, rng, coin, harp, note, makeStage } from './common.js';
guard(() => {
  const S = makeStage({ seed: 4, sky: { zenith: '#1a7fd0', horizon: '#a8ecf0' } }); const { scene } = S;
  S.ground('#f0d9a0');
  const r = rng(8);
  const K = 1.55; // kernel scale/height
  const k = S.kernel({ scale: K }); k.position.set(0.5, 0, 0.2); k.rotation.y = -0.15; scene.add(k);
  k.userData.pose({ arms: { l: [0, 2.2, 0], r: [0, 2.2, 0] } }); S.toon(k);
  // coin reef: stacked, leaning coin columns ringing the kernel, tallest ~ kernel height
  const ring = [[-0.8, 0, 1.45], [-0.5, -0.5, 1.4], [0.0, -0.75, 1.5], [0.9, -0.7, 1.45], [1.55, -0.2, 1.35], [1.5, 0.45, 1.0], [-0.7, 0.5, 0.75], [1.0, 0.8, 0.35], [-0.2, 0.9, 0.25], [0.3, 1.0, 0.2]];
  ring.forEach(([dx, dz, h], i) => {
    const n = Math.round(h / 0.085), lean = (r() - 0.5) * 0.25;
    for (let j = 0; j < n; j++) coin(scene, [0.5 + dx + lean * j * 0.09 + (r() - 0.5) * 0.03, 0.04 + j * 0.085, 0.2 + dz + (r() - 0.5) * 0.03], 0.2 - j * 0.0012, [0, r() * 3, (r() - 0.5) * 0.12]);
    if (h > 0.9) for (const s of [-1, 1]) for (let j = 0; j < Math.round(h * 0.6 / 0.085); j++) coin(scene, [0.5 + dx + s * (0.12 + j * 0.02), 0.5 + j * 0.085, 0.2 + dz], 0.13, [0, r() * 3, s * 0.5]);
  });
  const hp = harp(); hp.position.set(-2.0, 0, 0.3); hp.rotation.y = 0.35; hp.scale.setScalar(1.0); scene.add(hp);
  [[-1.3, 2.2, 0.1], [-0.6, 2.35, 0.0], [0.1, 2.5, 0.0], [0.9, 2.4, 0.0]].forEach(([x, y, z], i) => note(scene, [x, y, z], ['#ffffff', '#ffe27a', '#ffb0d0', '#b8f0ff'][i], 1.8));
  S.finish({ x: 0.0, y: 1.5, z: 5.0, tx: 0.0, ty: 1.45 });
});
</script></body></html>
