<!doctype html>
<html><head><meta charset="utf-8"><title>Kernal q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q03 — each KERNEL letter rides to the T cells inside a tiny drop of popcorn BUTTER (lipid nanoparticle)
import { THREE, guard, mat, add, blob, box, cyl, rng, letter, tcell, makeStage } from './common.js';
guard(() => {
  const S = makeStage({ seed: 7 }); const { scene } = S;
  S.ground('#7fb85a');
  // cinema-style striped tent floor mat
  add(scene, new THREE.CircleGeometry(2.8, 48), mat('#c93a3a'), [0.6, 0.004, 0.2], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.RingGeometry(1.6, 2.0, 48), mat('#fff4d8'), [0.6, 0.006, 0.2], [-Math.PI / 2, 0, 0]);
  // big butter drop (teardrop lathe)
  const pts = []; for (let i = 0; i <= 40; i++) { const t = i / 40, y = t * 1.5; const r = t < 0.6 ? 0.62 * Math.sin(Math.PI * Math.pow(t / 0.6, 0.7) / 2 * 1.0) : 0.62 * Math.pow(1 - (t - 0.6) / 0.4, 1.6) * 1; pts.push(new THREE.Vector2(Math.max(r, 0.002), y)); }
  const drop = new THREE.Group(); drop.position.set(0.7, 0.0, 0.3); scene.add(drop);
  add(drop, new THREE.LatheGeometry(pts, 40), mat('#ffd84a', { transparent: true, opacity: 0.5, roughness: 0.15, depthWrite: false }));
  blob(drop, mat('#fff5b0', { transparent: true, opacity: 0.9 }), [-0.2, 0.7, 0.4], [0.07, 0.17, 0.04], [0, 0, 0.3]);
  letter(drop, [0, 0.62, 0.52], [0, 0, 0.15], 1.9);
  // popcorn pile
  const r = rng(5);
  for (let i = 0; i < 30; i++) {
    const a = r() * 6.28, d = 0.7 + r() * 1.0, p = new THREE.Group(); p.position.set(0.7 + Math.cos(a) * d, 0.1, 0.3 + Math.sin(a) * d * 0.8); scene.add(p);
    for (let j = 0; j < 4; j++) blob(p, mat('#fffaf0'), [(r() - 0.5) * 0.14, 0.05 + r() * 0.1, (r() - 0.5) * 0.14], [0.09, 0.08, 0.09]);
    blob(p, mat('#ffd24a'), [0.04, 0.1, 0.05], [0.04, 0.04, 0.04]);
  }
  // butter pat on a plate
  cyl(scene, mat('#ffffff'), [-0.2, 0.03, 1.5], 0.5, 0.05); box(scene, mat('#ffe066'), [-0.2, 0.18, 1.5], [0.5, 0.26, 0.34]); box(scene, mat('#fff1a0'), [-0.2, 0.32, 1.5], [0.5, 0.03, 0.34]);
  // T cell receiving, right
  const t = tcell({ scale: 1.5 }); t.position.set(2.35, 0, 0.7); t.rotation.y = -0.5; scene.add(t); S.toon(t);
  // kernel left, pushing the drop
  const k = S.kernel({ scale: 1.3 }); k.position.set(-1.05, 0, 1.0); k.rotation.y = 0.5; scene.add(k);
  k.userData.pose({ legs: { l: [0.15, 0.05], r: [-0.15, -0.05] } });
  k.userData.reach('l', [0.5, 0.95, 0.5]); k.userData.reach('r', [-0.4, 0.5, 0.3]);
  S.toon(k);
  S.finish({ x: 0.7, y: 1.2, z: 5.2, tx: 0.7, ty: 0.85 });
});
</script></body></html>
