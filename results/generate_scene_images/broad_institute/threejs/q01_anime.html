<!doctype html>
<html><head><meta charset="utf-8"><title>Broad q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, mat, add, blob, box, cyl, sign, textMat, setup, grab, makeDome, makeShield, makeTelescope, makeCell, makeMouse, makeSumo, makeLander, makeRiver, makeNose, sparks, rng } from './common.js';
guard(() => {
const P = new URLSearchParams(location.search);
const st = setup(P, { cam: [0, 1.6, 5.4], look: [0, 1.15, 0], ground: '#d9c08a' });
const sc = st.scene;
cyl(sc, mat('#c9a56b'), [0, 0.04, 0], 3.2, 0.08); add(sc, new THREE.TorusGeometry(3.0, 0.07, 8, 60), mat('#f4eede'), [0, 0.09, 0], [Math.PI / 2, 0, 0]);
const sumo = makeSumo(1.3); sumo.position.set(1.7, 0, -0.3); sumo.rotation.y = -0.5; sc.add(sumo);
const sw = st.sword({ scale: 1.15, pos: [-1.0, 0, 0.6], ry: 0.5 });
sw.userData.pose({ lean: 0.0, legs: { l: [0.3, 0], r: [-0.3, 0] }, arms: { l: [0, 0.6, 0.3] } });
// sumo grips the sword by the grip with both hands; arms drawn as skin cylinders
const skin = mat('#f0b88a');
const gripW = new THREE.Vector3(-1.0 + 0.0, 0.0, 0).set(0, 0.52 * 1.15, 0); sw.localToWorld(gripW);
for (const z of [-0.12, 0.12]) { const a = new THREE.Vector3(1.35, 1.55, 0.05 + z), b = gripW.clone().add(new THREE.Vector3(0.12, 0, z));
  const d = b.clone().sub(a), m = add(sc, new THREE.CylinderGeometry(0.11, 0.1, d.length(), 14), skin, a.clone().add(b).multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); blob(sc, skin, b.toArray(), [0.13, 0.13, 0.13]); }
// swing arc
for (let i = 0; i < 5; i++) add(sc, new THREE.TorusGeometry(1.7 + i * 0.05, 0.035, 6, 40, 1.2), mat('#ffffff', { transparent: true, opacity: 0.8 - i * 0.14 }), [-0.2, 1.6, 0.2], [0, 0, 0.5]);
st.finishScene();
});
</script></body></html>
