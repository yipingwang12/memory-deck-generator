<script type="module">
import { THREE, guard, mat, add, blob, box, cyl, sign, textMat, setup, grab, makeDome, makeShield, makeTelescope, makeCell, makeMouse, makeSumo, makeLander, makeRiver, makeNose, sparks, rng } from './common.js';
guard(() => {
const P = new URLSearchParams(location.search);
const st = setup(P, { cam: [0, 1.7, 7.4], look: [0, 1.5, 0], ground: '#9ab07a' });
const sc = st.scene;
const sw = st.sword({ scale: 1.6, pos: [-0.9, 0, 0.0], ry: 0 });
sw.userData.pose({ arms: { l: [0, 0.6, 0.3] }, legs: { l: [0.2, 0], r: [-0.2, 0] } });

const fig = (x, color, prop, z = 1.2) => { const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(1.1); sc.add(g);
  blob(g, mat(color), [0, 0.4, 0], [0.4, 0.4, 0.36]); blob(g, mat('#ffe0c0'), [0, 1.0, 0], [0.3, 0.3, 0.3]);
  for (const s of [-1, 1]) { blob(g, mat('#fff'), [s * 0.1, 1.03, 0.26], [0.07, 0.09, 0.03]); blob(g, mat('#222'), [s * 0.1, 1.03, 0.285], [0.04, 0.06, 0.02]); }
  prop(g); return g; };
fig(-3.0, '#c9b9a0', (g) => { box(g, mat('#8a8f98', { roughness: 0.9 }), [0, 1.45, 0], [0.8, 0.28, 0.5]); box(g, mat('#b0b5bd'), [0, 1.72, 0], [0.55, 0.26, 0.4]); });

for (let i = 0; i < 3; i++) add(sc, new THREE.TorusGeometry(0.4, 0.03, 6, 20), mat('#ffd84a', { emissive: '#ffb020', emissiveIntensity: 0.6 }), [[-3.0, 1.4, 3.1][i], 2.6 + (i === 1 ? 0.5 : 0), [1.2, 1.6, 1.2][i]], [Math.PI / 2, 0, 0]);
st.finishScene();
});
