<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { THREE, guard, mat, add, blob, box, cyl, sign, textMat, setup, grab, makeDome, makeShield, makeTelescope, makeCell, makeMouse, makeSumo, makeLander, makeRiver, makeNose, sparks, rng } from './common.js';
guard(() => {
const P = new URLSearchParams(location.search);
const st = setup(P, { cam: [0, 2.0, 6.4], look: [0, 1.7, 0], ground: '#7fae6a' });
const sc = st.scene;
const cols = ['#e8d6b0', '#d9a86a', '#9ac0e0', '#c9e0b0'];
cols.forEach((c, i) => { const s = box(sc, mat(c), [2.0 + (i % 2 ? 0.25 : -0.25), 0.3 + i * 0.75, -0.8], [2.6, 0.55, 1.6]); box(sc, mat('#fff', { emissive: '#bde', emissiveIntensity: 0.3 }), [s.position.x, s.position.y, 0.02], [2.0, 0.18, 0.04]); });
const sw = st.sword({ scale: 1.3, pos: [-1.8, 0, 0.8], ry: 0.4 });
sw.userData.pose({ lean: 0.1, arms: { l: [0, 0.8, 0.2], r: [0, -0.8, 0.2] }, legs: { l: [0.3, 0], r: [-0.3, 0] } });
for (let i = 0; i < 5; i++) add(sc, new THREE.TorusGeometry(2.3 + i * 0.05, 0.04, 6, 40, 1.0), mat('#fff', { transparent: true, opacity: 0.85 - i * 0.15 }), [-0.9, 1.2, 0.8], [0, 0, 0.4]);
// two tiers drifting apart: arrows
for (const [y, d] of [[0.3, -1], [3.1, 1]]) add(sc, new THREE.ConeGeometry(0.18, 0.5, 12), mat('#e8473c'), [4.1, y + 0.4, -0.8], [0, 0, d * Math.PI / 2]);
st.finishScene();
});
