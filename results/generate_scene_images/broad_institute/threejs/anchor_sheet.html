<!doctype html>
<html><head><meta charset="utf-8"><title>Broadsword anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createBroadsword } from './broadsword.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 } });
  const scene = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#6fae45' })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const views = [[-0.9, -1.3], [0, 0], [0.9, 1.3]];
  const all = new Set();
  views.forEach(([ry, x], i) => {
    const s = createBroadsword({ scale: 1 }); s.position.set((i - 1) * 1.5, 0, 0); s.rotation.y = ry;
    s.userData.pose({ arms: { l: [0.2, 0.5, 0.5], r: [-0.2, -0.5, 0.2] }, legs: { l: [0.2, 0], r: [-0.2, 0] } });
    scene.add(s); s.traverse((o) => all.add(o));
  });
  stage.toonify(scene, (m) => all.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9]]);
  stage.camera.position.set(0, 0.85, 5.2); stage.camera.lookAt(0, 0.8, 0);
  stage.finish();
});
</script></body></html>
