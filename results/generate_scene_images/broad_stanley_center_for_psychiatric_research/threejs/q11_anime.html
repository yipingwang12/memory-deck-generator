<html><head><meta charset="utf-8"><title>Stanley q11 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import * as C from './common.js';
const { THREE, add, mat, place, makeScene, wave } = C;
makeScene({ trophyAt:[-0.8,0,0.3], ts:1.15, pose: wave, cam:{ty:1.0,x:0.1}, build: ({scene,ts}) => {
  const s=place(scene, C.sack(), [0.7,1.3,0.3], 0, 0.6); s.rotation.z=0.9;
  const k=C.knife(); k.position.set(1.25,1.2,0.7); k.rotation.z=Math.PI/2; k.scale.setScalar(0.9); scene.add(k);
  const h=C.coinHeap(14,0.2,0.12,0.09); h.position.set(-0.8,1.2*ts*0.88,0.3); scene.add(h);
  for(let i=0;i<8;i++){ const t=i/7, c=C.coin(0.09); c.position.set(0.4-t*1.0, 1.8-t*0.5-0.5*t*(1-t), 0.4); c.rotation.set(i,i*2,i); scene.add(c); }
}});
