<!doctype html>
<html><head><meta charset="utf-8"><title>Cradle anchor sheet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createCradle } from './cradle.js';
guard(() => {
  const stage = createAnimeStage({
    fov: 34, sunElevation: 35, sunAzimuth: 150, exposure: 1, sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 },
  });
  const scene = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#6fae45', roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const cs = [];
  [[-1.6, 0.0], [0, 0.6], [1.6, 1.571]].forEach(([x, yaw]) => {
    const c = createCradle({ scale: 1.1 }); c.position.set(x, 0, 0); c.rotation.y = yaw; scene.add(c); cs.push(c);
    c.userData.pose({ arms: { l: [0, 1.25, 0.5], r: [0, 1.25, 0.5] } });
  });
  const pm = new Set(); cs.forEach((c) => c.traverse((o) => pm.add(o)));
  stage.toonify(scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [168, 1300, 200, 2.2], [187, 1000, 120, 1.6]]);
  stage.camera.position.set(0, 1.0, 5.6); stage.camera.lookAt(0, 0.55, 0);
  stage.finish();
});
</script></body></html>
