import { boot, THREE, mat, add, blob, box, cyl, textPlane, sword, scribe, reachWorld } from './props.js';

  const sw = sword('DPTX3186', 3.0); sw.position.set(-0.4, 1.35, 0.75); sw.rotation.z = -Math.PI / 2 + 0.18; sw.scale.set(1.25, 1, 1.25); scene.add(sw);

  reachWorld(dd, 'l', [-0.45, 1.3, 0.8]);
}, { dd: { pos: [-1.4, 0, 0.8], ry: 0.4, scale: 1.5 }, cam: [1.1, 1.7, 6.4], look: [1.1, 1.5, 0] });
