<!doctype html>
<html><head><meta charset="utf-8"><title>Dewpoint q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — the DEWDROP watches proteins gather into droplets, like steam on cold glass: condensates.
import { boot, THREE, mat, add, blob, box, cyl, droplet, reachWorld } from './props.js';

boot(({ scene, dd }) => {
  // cell interior: warm pink wall + floor
  add(scene, new THREE.PlaneGeometry(60, 30), mat('#f2a7b8'), [0, 8, -4]);
  add(scene, new THREE.CylinderGeometry(1, 1, 1, 32), mat('#d9708f'), [3.5, 0.8, -2.5], [0, 0, 0], [1.3, 1.6, 1.3]); // nucleus-ish blob
  // cold glass pane with condensed steam beads
  box(scene, mat('#e6f6ff', { roughness: 0.2 }), 5.2, 3.4, 0.08, [1.5, 1.8, -1.0]);
  const r = (i) => Math.sin(i * 12.9898) * 0.5 + 0.5;
  for (let i = 0; i < 26; i++) blob(scene, mat('#ffffff', { roughness: 0.3 }), [-0.9 + r(i) * 4.8, 0.3 + r(i + 40) * 3.0, -0.9], [0.07 + r(i + 7) * 0.05, 0.08 + r(i + 7) * 0.06, 0.05]);
  // big condensates + loose proteins gathering
  const spots = [[0.9, 1.05, 0.6, 0.55], [2.6, 0.7, 0.2, 0.42], [3.3, 1.7, 0.2, 0.5], [1.9, 2.1, 0.0, 0.34], [0.5, 2.3, -0.2, 0.28]];
  spots.forEach(([x, y, z, rr], i) => { const d = droplet(rr, ['#ffe9a8', '#c9f0ff', '#e8d4ff', '#ffd5b0', '#d4ffd0'][i], 10); d.position.set(x, y, z); scene.add(d); });
  const cols = ['#e8483c', '#3a7be0', '#3fae4f', '#f2a21c'];
  for (let i = 0; i < 40; i++) blob(scene, mat(cols[i % 4]), [-0.2 + r(i + 90) * 5, 0.2 + r(i + 20) * 2.4, 0.2 + r(i + 55) * 1.6], [0.07, 0.07, 0.07]);
  reachWorld(dd, 'l', [-0.2, 1.4, 0.9]);
}, { dd: { pos: [-1.5, 0, 0.8], ry: 0.45, scale: 1.45, pose: { tilt: 0.05 } }, ground: '#e98fa6', cam: [0.9, 1.7, 6.4], look: [0.9, 1.15, 0], clouds: false });
</script></body></html>
