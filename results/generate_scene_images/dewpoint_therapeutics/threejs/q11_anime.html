<script type="module">

function building(w, h, color) {
  const g = new THREE.Group(); box(g, mat(color), w, h, 1.2, [0, h / 2, 0]);
  for (let i = 0; i < Math.floor(h / 0.9); i++) for (let j = 0; j < Math.floor(w / 0.8); j++) box(g, mat('#f4e4a0'), 0.3, 0.45, 0.03, [-w / 2 + 0.5 + j * 0.8, 0.8 + i * 0.9, 0.62]);
  box(g, mat('#5a3a2a'), w + 0.1, 0.15, 1.3, [0, h + 0.07, 0]); return g;
}
boot(({ scene, dd }) => {
  add(scene, new THREE.PlaneGeometry(400, 400), mat('#2f6aa8'), [0, 0.005, -12], [-Math.PI / 2, 0, 0]);
  [[-6, 3.6, '#a8503a'], [-3.4, 4.4, '#b85c40'], [3.8, 4.0, '#a8503a'], [6.4, 3.4, '#b85c40']].forEach(([x, h, c]) => { const b = building(2.4, h, c); b.position.set(x, 0, -5); scene.add(b); });

  // tea chest

  box(c, mat('#a8742e'), 2.2, 1.4, 1.3, [0, 0.7, 0]);

  for (const y of [0.15, 1.25]) box(c, mat('#4a3a28'), 2.3, 0.12, 1.35, [0, y, 0]);

  reachWorld(dd, 'l', [0.9, 1.6, 0.9]);
