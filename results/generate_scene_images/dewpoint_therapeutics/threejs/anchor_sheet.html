<!doctype html>
<html><head><meta charset="utf-8"><title>Dewdrop anchor sheet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createDewdrop } from './dewdrop.js';
guard(() => {
  const stage = createAnimeStage({
    fov: 28, sunElevation: 38, sunAzimuth: 200,
    sky: { zenith: '#9fd8f5', horizon: '#e6f6ff', cover: 0.02, puffCover: 0.02, towerTop: 0.02 },
    ambient: { color: '#f0f4ff', intensity: 2.2 },
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 },
  });
  const THREE = stage.THREE;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(300, 64), new THREE.MeshStandardMaterial({ color: '#bfe6a8', roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; stage.scene.add(floor);
  const set = new Set();
  [[-1.1, 0, 0], [0, 0.7, 1], [1.1, Math.PI / 2, 0]].forEach(([x, ry, reach]) => {
    const d = createDewdrop(); d.position.x = x; d.rotation.y = ry;
    if (reach) { d.userData.pose({ tilt: 0.05 }); d.userData.reach('l', [0.42, 0.85, 0.3]); }
    stage.scene.add(d); d.traverse((m) => set.add(m));
  });
  stage.toonify(stage.scene, (m) => set.has(m));
  stage.camera.position.set(0, 0.8, 4.4); stage.camera.lookAt(0, 0.62, 0);
  stage.finish();
});
</script></body></html>
