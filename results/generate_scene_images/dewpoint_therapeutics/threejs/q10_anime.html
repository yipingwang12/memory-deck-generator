<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q10 — the DEWDROP hammers a NAIL into two German doors; FRANK and his DRESS are locked out.
import { boot, THREE, mat, add, blob, box, cyl, eyes, bone, reachWorld } from './props.js';
const basic = (c) => new THREE.MeshBasicMaterial({ color: c });
function door(x) {
  const g = new THREE.Group(); g.position.set(x, 0, -0.9);
  box(g, mat('#8a5a2e'), 1.4, 3.0, 0.15, [0, 1.5, 0]);
  for (let i = 0; i < 4; i++) box(g, mat('#6a421f'), 0.03, 2.9, 0.02, [-0.5 + i * 0.33, 1.5, 0.09]);
  for (const y of [0.6, 2.4]) box(g, mat('#2b2b30'), 1.4, 0.12, 0.05, [0, y, 0.1]);
  blob(g, mat('#e2b13c', { metalness: 0.6 }), [x < 0 ? 0.55 : -0.55, 1.4, 0.15], [0.07, 0.07, 0.07]);
  return g;
}
function frank() {
  const g = new THREE.Group(), bun = mat('#e8b878'), sau = mat('#c85a3a');
  cyl(g, bun, 0.3, 1.2, [0, 0.85, 0]); cyl(g, sau, 0.2, 1.4, [0, 0.9, 0.12]);
  for (const s of [-1, 1]) { blob(g, mat('#f6d8a0'), [0, 1.55, 0.1], [0.22, 0.22, 0.2]); }
  blob(g, mat('#e0b13a'), [0, 1.1, 0.34], [0.22, 0.04, 0.03]);
  eyes(g, 0.3, 1.2 - 0, 0.4, 0.2); 
  for (const s of [-1, 1]) { bone(g, sau, [s * 0.3, 0.9, 0], [s * 0.55, 0.55, 0.2], 0.05); bone(g, sau, [s * 0.12, 0.25, 0], [s * 0.12, 0.05, 0], 0.05); box(g, mat('#3a2a20'), 0.16, 0.08, 0.26, [s * 0.12, 0.04, 0.05]); }
  return g;
}
function dress() {
  const g = new THREE.Group(), m = mat('#e0243a');
  add(g, new THREE.ConeGeometry(0.62, 1.1, 28), m, [0, 0.55, 0], [Math.PI, 0, 0]).position.y = 0.55; // flared skirt: wide at floor
  g.children[0].rotation.set(0, 0, 0);
  add(g, new THREE.CylinderGeometry(0.2, 0.25, 0.5, 20), m, [0, 1.35, 0]);
  box(g, mat('#f4ecd8'), 0.55, 0.08, 0.04, [0, 1.0, 0.3]);
  for (const s of [-1, 1]) { bone(g, m, [s * 0.22, 1.55, 0], [s * 0.45, 1.15, 0.1], 0.06); blob(g, mat('#ffd9b8'), [s * 0.48, 1.08, 0.1], [0.06, 0.06, 0.06]); bone(g, mat('#ffd9b8'), [s * 0.1, 0.0, 0], [s * 0.1, 0.0, 0], 0.01); }
  blob(g, mat('#ffd9b8'), [0, 1.85, 0], [0.2, 0.2, 0.2]); const f = new THREE.Group(); f.position.set(0, 1.85, 0); g.add(f); eyes(f, 0.2, 0.0, 0.4, 0.2);
  blob(g, mat('#7a3a1a'), [0, 1.95, -0.05], [0.23, 0.2, 0.2]);
  return g;
}
boot(({ scene, dd }) => {
  box(scene, mat('#b9b09a'), 9, 4.6, 0.6, [0.3, 2.3, -1.2]);
  const d1 = door(-0.7 + 0.3), d2 = door(0.7 + 0.3); scene.add(d1, d2); box(scene, mat('#1a0f08'), 0.06, 3.0, 0.2, [0.3, 1.5, -0.8]);
  box(scene, mat('#7a4f27'), 2.9, 0.3, 0.2, [0.3, 1.45, -0.72]);                       // plank across both doors
  const flag = new THREE.Group(); flag.position.set(0.3, 3.9, -0.9); scene.add(flag);
  [['#111111', 0.4], ['#dd0000', 0], ['#ffce00', -0.4]].forEach(([c, y]) => box(flag, basic(c), 1.8, 0.4, 0.03, [0, y, 0]));
  const nail = new THREE.Group(); nail.position.set(0.3, 1.45, -0.55); scene.add(nail);
  cyl(nail, mat('#555b66', { metalness: 0.7 }), 0.1, 0.8, [0, 0, 0.0], [Math.PI / 2, 0, 0]); cyl(nail, new THREE.MeshBasicMaterial({ color: '#e4e9f2' }), 0.34, 0.14, [0, 0, 0.45], [Math.PI / 2, 0, 0]);
  const ham = new THREE.Group(); ham.position.set(1.3, 1.75, 0.6); ham.rotation.z = 0.8; scene.add(ham);
  cyl(ham, mat('#8a5a2e'), 0.06, 1.2, [0, 0.3, 0]); box(ham, mat('#6f7684', { metalness: 0.6 }), 0.7, 0.35, 0.35, [0, 0.95, 0]);
  const fr = frank(); fr.position.set(-3.7, 0, 0.5); fr.rotation.y = 0.5; fr.scale.setScalar(1.25); scene.add(fr);
  const dr = dress(); dr.position.set(-2.3, 0, 0.7); dr.rotation.y = 0.3; dr.scale.setScalar(1.1); scene.add(dr);
  reachWorld(dd, 'r', [1.25, 1.7, 0.6]);
}, { dd: { pos: [2.3, 0, 1.5], ry: -0.5, scale: 1.8 }, ground: '#8a8f77', cam: [-0.3, 2.0, 7.6], look: [-0.3, 2.0, 0] });
</script></body></html>
