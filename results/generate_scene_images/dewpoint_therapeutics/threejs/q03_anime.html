<html><head><meta charset="utf-8"><title>Dewpoint q03 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q03 — the droplets catch slippery SCRIBES (transcription factors); they have no handles.
import { boot, THREE, mat, add, blob, box, cyl, droplet, scribe, reachWorld } from './props.js';
boot(({ scene, dd }) => {
  add(scene, new THREE.CircleGeometry(3.6, 48), mat('#bfeaff', { roughness: 0.1 }), [2.2, 0.012, 0.2], [-Math.PI / 2, 0, 0]); // slick ice patch
  const d = droplet(1.0, '#ffe9a8', 8); d.position.set(2.0, 1.0, -0.4); scene.add(d);
  const Y = new THREE.Vector3(0, 1, 0);
  // two scribes stuck on the droplet's surface
  [[0.6, 0.9, 0.45], [-0.8, 0.5, 0.2]].forEach((n, i) => { const v = new THREE.Vector3(...n).normalize(); const s = scribe(['#7a46c8', '#c84a8a'][i], 1.35); s.position.copy(d.position).addScaledVector(v, 1.0); s.quaternion.setFromUnitVectors(Y, v); scene.add(s);
    for (let k = 0; k < 3; k++) { const dr = blob(scene, mat('#ffe9a8'), d.position.clone().addScaledVector(v, 0.98).add(new THREE.Vector3(0.1 * k - 0.1, -0.12 - 0.08 * k, 0.04)), [0.04, 0.09, 0.04]); } });
  // scribes sliding on the ice
  [[3.7, 0.6, -0.3], [0.3, 0.9, 1.1], [3.2, -0.5, 1.2]].forEach(([x, ry, z], i) => { const s = scribe(['#3b8ed8', '#e08a2e', '#3fae4f'][i], 1.5); s.position.set(x, 0, z); s.rotation.set(0.0, ry, i === 1 ? 0.3 : -0.2); scene.add(s); });
  reachWorld(dd, 'l', [0.9, 1.5, 0.6]);
}, { dd: { pos: [-1.6, 0, 1.0], ry: 0.45, scale: 1.5 }, cam: [1.2, 1.7, 6.6], look: [1.1, 1.1, 0] });
</script></body></html>
