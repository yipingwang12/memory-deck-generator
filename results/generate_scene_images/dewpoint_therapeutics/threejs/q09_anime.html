<html><head><meta charset="utf-8"><title>Dewpoint q09 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q09 — in January, MURK and FIZZ take their coats off the HANGER and leave.
import { boot, THREE, mat, add, blob, box, cyl, eyes, bone, textPlane, wall, snow } from './props.js';
const basic = (c) => new THREE.MeshBasicMaterial({ color: c });
function coat(color) {
  const g = new THREE.Group(), m = mat(color);
  add(g, new THREE.CylinderGeometry(0.34, 0.4, 0.95, 20), m, [0, 0, 0], [0, 0, 0], [1, 1, 0.55]);
  for (const s of [-1, 1]) bone(g, m, [s * 0.3, 0.38, 0], [s * 0.5, -0.1, 0.05], 0.1);
  for (let i = 0; i < 3; i++) blob(g, mat('#f4ecd8'), [0, 0.25 - i * 0.28, 0.23], [0.045, 0.045, 0.03]);
  return g;
}
function hanger() { // big wire hanger on a wall hook
  const g = new THREE.Group(), m = mat('#b9c2d0', { metalness: 0.6, roughness: 0.3 });
  const pts = [[-0.9, -0.5], [0, 0.3], [0.9, -0.5], [-0.9, -0.5]].map(([x, y]) => new THREE.Vector3(x, y, 0));
  add(g, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.01), 40, 0.035, 8), m);
  add(g, new THREE.TorusGeometry(0.14, 0.035, 8, 20, Math.PI * 1.5), m, [0.02, 0.45, 0], [0, 0, 0.8]);
  cyl(g, mat('#6a3b1c'), 0.07, 0.2, [0, 0.78, -0.05], [Math.PI / 2, 0, 0]);
  return g;
}
function murk() {
  const g = new THREE.Group(), m = mat('#5d6070', { roughness: 0.9 });
  [[0, 0, 0, 0.55], [-0.5, -0.1, 0, 0.4], [0.5, -0.08, 0, 0.42], [-0.25, 0.3, 0, 0.38], [0.28, 0.3, 0, 0.36]].forEach(([x, y, z, r]) => blob(g, m, [x, y, z], [r, r * 0.85, r * 0.8]));
  const f = new THREE.Group(); f.position.set(0, 0, 0.3); g.add(f); eyes(f, 0.5, 0.05, 0.35, 0.16);
  for (const x of [-0.28, 0.28]) add(f, new THREE.BoxGeometry(0.2, 0.04, 0.02), basic('#10131f'), [x, 0.3, 0.45], [0, 0, x > 0 ? -0.4 : 0.4]);
  return g;
}
function fizz() {
  const g = new THREE.Group(), m = mat('#ffb12a', { roughness: 0.3 });
  const prof = [[0.0, 0], [0.3, 0], [0.34, 0.1], [0.34, 0.7], [0.2, 0.95], [0.12, 1.1], [0.12, 1.4], [0.14, 1.45], [0, 1.45]].map(([x, y]) => new THREE.Vector2(x, y));
  add(g, new THREE.LatheGeometry(prof, 28), m);
  cyl(g, mat('#e0392f'), 0.15, 0.1, [0, 1.5, 0]);
  const f = new THREE.Group(); f.position.set(0, 0.45, 0.04); g.add(f); eyes(f, 0.34, 0.1, 0.4, 0.2);
  for (let i = 0; i < 9; i++) blob(g, mat('#fff8c0', { roughness: 0.2 }), [Math.sin(i * 2.1) * 0.35, 1.7 + (i % 4) * 0.22, Math.cos(i * 1.3) * 0.12], [0.07 + (i % 3) * 0.02, 0.07 + (i % 3) * 0.02, 0.06]);
  return g;
}
boot(({ scene, dd }) => {
  wall(scene, '#e8d7b8', -2.0); add(scene, new THREE.PlaneGeometry(40, 3), mat('#a9764a'), [0, 1.3, -1.99]);
  const h = hanger(); h.position.set(-0.3, 3.0, -1.9); h.scale.setScalar(1.4); scene.add(h);
  const jan = new THREE.Group(); jan.position.set(-3.1, 3.7, -1.9); scene.add(jan);
  box(jan, mat('#ffffff'), 1.5, 1.6, 0.05, [0, 0, 0]); box(jan, mat('#e0392f'), 1.5, 0.5, 0.06, [0, 0.55, 0]);
  const t = textPlane('JAN', 1.3, 0.45, { fg: '#fff' }); t.position.set(0, 0.55, 0.04); jan.add(t);
  const t2 = textPlane('1', 0.8, 0.8, { fg: '#222' }); t2.position.set(0, -0.2, 0.04); jan.add(t2);
  const win = box(scene, mat('#9fd0f2'), 2.4, 2.4, 0.05, [5.2, 3.6, -1.95]); snow(scene, 20, [2, 2, 0.1], [5.2, 3.6, -1.9]);
  const m = murk(); m.position.set(1.7, 2.1, 0.2); m.scale.setScalar(1.1); scene.add(m);
  const c1 = coat('#d8402f'); c1.position.set(1.7, 1.2, 0.9); c1.rotation.z = 0.15; c1.scale.setScalar(1.0); scene.add(c1);
  const f = fizz(); f.position.set(4.1, 0, 0.2); f.rotation.y = -0.5; f.scale.setScalar(1.3); scene.add(f);
  const c2 = coat('#2f8f4a'); c2.position.set(3.4, 1.2, 0.9); c2.rotation.z = -0.15; scene.add(c2);
}, { dd: { pos: [-1.6, 0, 1.0], ry: 0.5, scale: 1.7, pose: { tilt: -0.05 } }, ground: '#7a5a3a', cam: [1.2, 1.9, 7.4], look: [1.2, 1.8, 0], clouds: false });
</script></body></html>
