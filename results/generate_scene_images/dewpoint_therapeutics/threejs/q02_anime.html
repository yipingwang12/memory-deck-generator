<html><head><meta charset="utf-8"><title>Dewpoint q02 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — a tiny SEA captain in each droplet turns a MOD dial.
import { boot, THREE, mat, add, blob, box, cyl, droplet, textPlane, reachWorld, eyes, bone } from './props.js';

function captain() {
  const g = new THREE.Group(), coat = mat('#1f3f8c'), skin = mat('#ffd9b8');
  cyl(g, coat, 0.2, 0.5, [0, 0.3, 0], [0, 0, 0], 0.16);
  for (const x of [-0.07, 0.07]) cyl(g, mat('#2b2b3a'), 0.05, 0.12, [x, 0.04, 0]);
  const head = new THREE.Group(); head.position.y = 0.72; g.add(head);
  blob(head, skin, [0, 0, 0], [0.17, 0.17, 0.17]); eyes(head, 0.17, 0.02, 0.4, 0.2);
  blob(head, mat('#ffffff'), [0, -0.1, 0.07], [0.15, 0.13, 0.1]);                       // white beard
  cyl(head, mat('#ffffff'), 0.2, 0.08, [0, 0.16, 0], [0, 0, 0], 0.2); cyl(head, mat('#f4f4f4'), 0.17, 0.12, [0, 0.22, 0], [0, 0, 0], 0.15);
  box(head, mat('#e2b13c'), 0.1, 0.04, 0.02, [0, 0.2, 0.2]);
  bone(g, coat, [0.15, 0.5, 0], [0.38, 0.42, 0.18], 0.04); bone(g, coat, [-0.15, 0.5, 0], [-0.38, 0.42, 0.18], 0.04);
  return g;
}
function dial(r) {
  const g = new THREE.Group();
  cyl(g, mat('#3a3f52'), r, 0.16, [0, 0, 0], [Math.PI / 2, 0, 0]);
  cyl(g, mat('#f4f1e6'), r * 0.86, 0.04, [0, 0, 0.1], [Math.PI / 2, 0, 0]);
  for (let i = 0; i < 11; i++) { const a = -2.4 + i * 0.48; const t = box(g, mat('#222'), 0.04, 0.14, 0.03, [Math.sin(a) * r * 0.7, Math.cos(a) * r * 0.7, 0.13]); t.rotation.z = -a; }
  const n = box(g, mat('#e0392f'), 0.06, r * 0.75, 0.05, [0, 0, 0.15]); n.geometry.translate(0, r * 0.3, 0); n.rotation.z = -0.7;
  blob(g, mat('#222'), [0, 0, 0.17], [0.09, 0.09, 0.05]);
  const t = textPlane('MOD', r * 0.9, r * 0.38, { fg: '#0d2b6b' }); t.position.set(0, -r * 0.4, 0.125); g.add(t);
  return g;
}
boot(({ scene, dd }) => {
  const sea = add(scene, new THREE.PlaneGeometry(400, 400), mat('#1f86d0'), [0, 0.01, 0], [-Math.PI / 2, 0, 0]);
  for (let i = 0; i < 14; i++) { const t = add(scene, new THREE.TorusGeometry(0.5 + (i % 4) * 0.25, 0.03, 6, 30, 2.2), mat('#ffffff'), [-4 + i * 0.8, 0.03, -1.5 - (i % 5) * 0.9], [-Math.PI / 2, 0, i]); }
  const d = droplet(0.85, '#ffe9a8', 6); d.position.set(1.5, 0.45, 0); scene.add(d);
  const c = captain(); c.position.set(1.5, 1.28, 0.15); c.scale.setScalar(1.15); scene.add(c);
  const dl = dial(0.8); dl.position.set(3.4, 1.3, 0.2); dl.rotation.y = -0.4; scene.add(dl);
  cyl(scene, mat('#7a5a3a'), 0.12, 1.1, [3.4, 0.55, 0.0]);
  reachWorld(dd, 'l', [2.7, 1.55, 0.5]);
}, { dd: { pos: [-1.1, 0, 0.9], ry: 0.5, scale: 1.45 }, ground: '#1f86d0', cam: [1.1, 1.7, 6.2], look: [1.0, 1.2, 0] });
</script></body></html>
