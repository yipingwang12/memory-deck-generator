<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q06 — the fish chain ends in a stomach where CRABS grow; the DEWDROP starves them.
import { boot, THREE, mat, add, blob, box, cyl, fish, crab, reachWorld, bone } from './props.js';
boot(({ scene, dd }) => {
  const pink = mat('#f29aa7', { roughness: 0.5 });
  const st = new THREE.Group(); st.position.set(3.0, 1.7, -0.5); scene.add(st);
  blob(st, pink, [0, 0, 0], [1.7, 1.55, 0.9], [0, 0, 0.2]);
  blob(st, mat('#c9566c'), [0, -0.05, 0.62], [1.35, 1.2, 0.5], [0, 0, 0.2]);            // cut-open lining
  [[-0.6, 0.15], [0.1, 0.55], [0.7, -0.15], [-0.15, -0.5], [0.55, 0.65], [-0.8, -0.35]].forEach(([x, y], i) => { const c = crab(1.6); c.position.set(x, y - 0.35, 1.0); c.rotation.y = (i - 2.5) * 0.12; st.add(c); });
  const gullet = new THREE.CatmullRomCurve3([[-1.3, 3.2, -0.5], [-0.2, 3.0, -0.5], [1.2, 2.9, -0.5], [2.3, 2.6, -0.5]].map((p) => new THREE.Vector3(...p)));
  add(scene, new THREE.TubeGeometry(gullet, 24, 0.28, 10), pink);
  [[-1.6, 3.3], [0.1, 3.15]].forEach(([x, y], i) => { const f = fish('#2f9bd8', 1.2); f.position.set(x, y + 0.4, 0); f.rotation.z = -0.15; scene.add(f); });
  for (const k of [0, 1]) add(scene, new THREE.TorusGeometry(0.17, 0.05, 8, 18), mat('#7d8696', { metalness: 0.5 }), [-0.55 + k * 0.2, 3.62, 0.1], [k ? 0 : Math.PI / 2, 0, 0]);
  // empty bowl: nothing to eat
  const bowl = new THREE.Group(); bowl.position.set(0.6, 0.95, 1.3); scene.add(bowl);
  add(bowl, new THREE.SphereGeometry(0.5, 24, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat('#e9edf5', { side: THREE.DoubleSide }), [0, 0.25, 0]);
  cyl(bowl, mat('#c9ced9'), 0.2, 0.06, [0, -0.2, 0]);
  reachWorld(dd, 'l', [0.2, 1.1, 1.3]);
}, { dd: { pos: [-1.2, 0, 1.0], ry: 0.45, scale: 1.75 }, ground: '#e3a98e', cam: [1.4, 2.0, 7.8], look: [1.4, 2.0, 0] });
