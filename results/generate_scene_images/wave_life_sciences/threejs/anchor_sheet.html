<!doctype html>
<html><head><meta charset="utf-8"><title>Surfer anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createSurfer } from './surfer.js';
guard(() => {
  const stage = createAnimeStage({
    fov: 40, sunElevation: 35, sunAzimuth: 150, exposure: 1, sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 },
  });
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#f0cf94', roughness: 1 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; stage.scene.add(g);
  const views = [[-1.5, -0.6], [0, 0], [1.5, 0.9]];
  views.forEach(([x, ry]) => {
    const s = createSurfer({ scale: 1.5 }); s.position.set(x, 0, 0); s.rotation.y = ry; stage.scene.add(s);
    s.userData.pose({ lean: 0.05, headTilt: 0.06, arms: { r: [0.1, 0.25, 0.2] }, legs: { l: [0.1, 0], r: [-0.08, 0] } });
    s.userData.holdBoard();
    const pm = new Set(); s.traverse((o) => pm.add(o)); stage.toonify(stage.scene, (m) => pm.has(m));
  });
  stage.addClouds([[150, 900, 90, 1.2], [190, 1100, 120, 1.6], [230, 950, 70, 0.9]]);
  stage.camera.position.set(0, 0.95, 4.6); stage.camera.lookAt(0, 0.85, 0);
  stage.finish();
});
</script></body></html>
