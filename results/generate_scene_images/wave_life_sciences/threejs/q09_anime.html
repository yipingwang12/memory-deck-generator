<html><head><meta charset="utf-8"><title>Wave q09</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, mat, add, blob, labelTex, textPanel, makeStage, beach, wave, addSurfer, finish, pill, vial, labelBoard, num } from './common.js';
guard(() => {
  const P = new URLSearchParams(location.search), stage = makeStage(P), scene = stage.scene;
  // q09 — WVE-N531 on the SURFER rebuilds Duchenne muscle: flexing surfer + half-built muscle on scaffold.
  beach(scene, { seaZ: 5 });
  const s = addSurfer(stage, P, { x: -1.4, z: 0.3, ry: 0.35, scale: 1.8 });
  const b = s.userData.parts.board; labelBoard(b, 'WVE-N531', { len: 1.05 }); b.position.set(-0.6, 0.65, -0.1); b.rotation.set(0, 0, 0.1);
  s.userData.pose({ lean: 0, headTilt: 0.05 });
  s.userData.reach('l', [0.3, 0.98, 0.05]); s.userData.reach('r', [-0.3, 0.98, 0.05]);
  // muscle
  const Mu = new THREE.Group(); Mu.position.set(1.3, 0.0, 0.0); scene.add(Mu);
  const prof = []; for (let i = 0; i <= 20; i++) { const t = i / 20; prof.push(new THREE.Vector2(0.06 + 0.5 * Math.sin(Math.PI * Math.pow(t, 0.85)), t * 2.6)); }
  const red = mat('#d6403a', { roughness: 0.35 });
  blob(Mu, red, [0, 2.0, 0], [0.62, 1.0, 0.55]); add(Mu, new THREE.ConeGeometry(0.2, 0.7, 14), mat('#f0e6d0'), [0, 3.3, 0]); blob(Mu, mat('#e8564a'), [0.2, 2.2, 0.35], [0.25, 0.3, 0.2]);
  for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, r = 0.32; add(Mu, new THREE.CylinderGeometry(0.1, 0.1, 1.4, 12), mat(i % 2 ? '#f0877a' : '#e86a5a', { roughness: 0.4 }), [Math.cos(a) * r, 0.8, Math.sin(a) * r]); }
  add(Mu, new THREE.CylinderGeometry(0.2, 0.2, 1.4, 12), mat('#f6b0a4'), [0, 0.8, 0]);
  for (let k = 0; k < 4; k++) add(Mu, new THREE.TorusGeometry(0.66 - Math.abs(k - 1.5) * 0.05, 0.025, 6, 30), mat('#a82a2a'), [0, 1.65 + k * 0.3, 0], [Math.PI / 2, 0, 0], [1, 0.92, 1]);
  const ye = mat('#f4c020');
  for (const [x, z] of [[-0.8, 0.7], [0.8, 0.7], [-0.8, -0.6], [0.8, -0.6]]) add(Mu, new THREE.CylinderGeometry(0.035, 0.035, 2.2, 8), ye, [x, 1.1, z]);
  for (const y of [0.6, 1.3, 2.0]) { add(Mu, new THREE.BoxGeometry(1.7, 0.04, 0.04), ye, [0, y, 0.7]); add(Mu, new THREE.BoxGeometry(0.04, 0.04, 1.3), ye, [0.8, y, 0.05]); }
  add(Mu, new THREE.BoxGeometry(1.5, 0.06, 0.4), mat('#c9a56b'), [0, 1.3, 0.7]);
  // falling fibre bricks
  [[-0.5, 3.0, 0.5, 0.4], [0.9, 2.5, 0.5, -0.3]].forEach(([x, y, z, r]) => { const f = add(Mu, new THREE.CapsuleGeometry(0.1, 0.4, 6, 12), mat('#e86a5a'), [x, y, z], [0, 0, r + 1.5]); });
  finish(stage, P, s, [0.3, 1.7, 6.4], [0.3, 1.5, 0], [b]);
});
</script></body></html>
