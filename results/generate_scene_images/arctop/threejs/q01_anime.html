<!doctype html>
<html><head><meta charset="utf-8"><title>Arctop q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — "A spinning TOP first whirls on a DISH."
import { THREE, guard, makeStage, mat, add, blob, num, placeTop, wrap, canvasTexture } from './common.js';
guard(() => {
  const { stage, scene } = makeStage({ ground: '#d9b98a', sky: { cover: 1.2 } });
  // wooden table top
  add(scene, new THREE.CylinderGeometry(3.5, 3.5, 0.1, 48), mat('#a9703c'), [0, -0.05, 0]);
  // big plate (the DISH)
  const pts = [[0, 0], [0.5, 0.0], [1.1, 0.04], [1.45, 0.13], [1.55, 0.14], [1.55, 0.17], [1.42, 0.17], [1.05, 0.08], [0.5, 0.05], [0, 0.05]].map(([x, y]) => new THREE.Vector2(x, y));
  const dish = add(scene, new THREE.LatheGeometry(pts, 64), mat('#f7f2ea', { roughness: 0.3 }));
  add(scene, new THREE.TorusGeometry(1.3, 0.03, 8, 64), mat('#2f6fd0'), [0, 0.14, 0], [Math.PI / 2, 0, 0]);
  add(scene, new THREE.TorusGeometry(1.0, 0.02, 8, 64), mat('#2f6fd0'), [0, 0.09, 0], [Math.PI / 2, 0, 0]);
  // spin trails
  for (const [r, y] of [[0.55, 0.12], [0.8, 0.12], [1.05, 0.12]]) add(scene, new THREE.TorusGeometry(r, 0.012, 6, 64), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.8 }), [0, y, 0], [Math.PI / 2, 0, 0]);
  const top = placeTop(scene, { y: 0.06, s: 1.35, tilt: 0.12, arms: { l: [0, 1.9], r: [0, 1.9] } });
  wrap(stage, scene, top, { cam: [0.3, 1.5, 3.6], look: [0, 0.55, 0] });
});
</script></body></html>
