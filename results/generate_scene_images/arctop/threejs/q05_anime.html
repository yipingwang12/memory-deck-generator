<!doctype html>
<html><head><meta charset="utf-8"><title>Arctop q05 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, makeStage, mat, add, blob, num, placeTop, wrap, basic, textTex } from './common.js';
import * as PR from './props.js';
guard(() => {
  const { stage, scene } = makeStage({ ground: '#bfc8d4' });
  const bear = PR.buildBear(); bear.position.set(-1.7, 0, 0); bear.rotation.y = 0.5; bear.scale.setScalar(1.15); scene.add(bear);
  const arm = bear.userData.arms[1]; arm.rotation.set(0, 0, 0); arm.rotation.z = -1.9;
  const w = PR.buildWrench(); w.scale.setScalar(1.8); w.position.set(0, -1.1, 0); w.rotation.z = 0.3; arm.add(w);
  const top = placeTop(scene, { x: 0.5, s: 2.3, tilt: 0.1 });
  // lesson board: slides with bars + a jet pictogram
  const board = add(scene, new THREE.BoxGeometry(3.2, 1.9, 0.1), mat('#26496f'), [1.2, 2.2, -1.2], [0, -0.2, 0]);
  const c = document.createElement('canvas'); c.width = 640; c.height = 380; const x = c.getContext('2d');
  x.fillStyle = '#f7f3e6'; x.fillRect(0, 0, 640, 380);
  ['#e8453c', '#ffc933', '#2fa7a0', '#3c8ce8'].forEach((col, i) => { x.fillStyle = col; x.fillRect(40, 40 + i * 80, 120 + i * 110 + (i % 2) * 90, 50); x.fillRect(560, 40 + i * 80, 30, 50); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.78), new THREE.MeshBasicMaterial({ map: t })); face.position.z = 0.055; board.add(face);
  const jet = PR.buildJet(); jet.scale.setScalar(0.7); jet.position.set(0.75, 0.55, 0.12); jet.rotation.set(0, -1.57, 0.1); board.add(jet);
  wrap(stage, scene, [top, bear], { cam: [0, 1.7, 6.3], look: [0, 1.3, 0] });
});
</script></body></html>
