<!doctype html>
<html><head><meta charset="utf-8"><title>Top anchor sheet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, makeStage, mat, add, num, createTop, wrap } from './common.js';
guard(() => {
  const { stage, scene } = makeStage({ ground: '#f1d9b0', fov: 28 });
  const tops = [];
  [[-1.2, 0], [-0.4, 0.8], [0.4, Math.PI / 2], [1.2, -0.5]].forEach(([x, ry], i) => {
    const t = createTop({ scale: 1.3 }); t.position.x = x; t.rotation.y = ry; t.userData.spin(0.5 * i);
    t.userData.pose(i === 3 ? { arms: { l: [0, 2.4], r: [0, 0.9] }, tilt: 0.1 } : { arms: { l: [0, 0.9], r: [0, 0.9] } });
    scene.add(t); tops.push(t);
  });
  wrap(stage, scene, tops, { cam: [0, 0.8, 5], look: [0, 0.5, 0], clouds: false });
});
</script></body></html>
