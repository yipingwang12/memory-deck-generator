<!doctype html>
<html><head><meta charset="utf-8"><title>Sarepta q08</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q08 — The SERAPE hangs on a BRIDGE in Cambridge.
import { THREE, guard, createSerape, mat, add, box, cyl, num, makeStage, finishScene } from './common.js';
guard(() => {
  const stage = makeStage({ sunAzimuth: 120 }), scene = stage.scene;
  const water = add(scene, new THREE.PlaneGeometry(400, 400), mat('#2d86b8', { roughness: 0.25 }), [0, -1.6, 0], [-Math.PI / 2, 0, 0]);
  const stone = mat('#c9b79a'), dark = mat('#4b5563');
  // bridge deck + stone arches, long along x
  box(scene, stone, [12, 0.35, 2.2], [0, 0, -0.4]);
  for (const x of [-4, 0, 4]) { const a = add(scene, new THREE.TorusGeometry(1.5, 0.3, 12, 32, Math.PI), stone, [x, -0.2, -0.4], [0, 0, 0]); a.scale.z = 3.4; }
  for (const x of [-6, -2, 2, 6]) box(scene, stone, [0.5, 1.6, 2.2], [x, -0.95, -0.4]);
  box(scene, stone, [12, 0.12, 0.2], [0, 1.3, 0.62]);                                        // top rail
  for (let i = -11; i <= 11; i++) cyl(scene, stone, 0.05, 0.05, 1.0, [i * 0.5, 0.8, 0.62]);   // balusters
  for (const x of [-6, 6]) cyl(scene, mat('#8a6d4a'), 0.2, 0.25, 2.3, [x, 1.1, 0.62]);
  // lamps
  for (const x of [-3, 3]) { cyl(scene, dark, 0.04, 0.05, 1.7, [x, 2.15, 0.62]); add(scene, new THREE.SphereGeometry(0.16, 16, 12), mat('#fff0b0', { emissive: '#ffe08a', emissiveIntensity: 0.6 }), [x, 3.1, 0.62]); }
  // far shore: Cambridge brick buildings
  const r = [0.8, 1.3, 1.0, 1.6, 0.9, 1.2, 1.5, 1.0];
  r.forEach((h, i) => { const x = -20 + i * 5.5; box(scene, mat(i % 2 ? '#b5523a' : '#c9704a'), [4.6, h * 4, 3], [x, h * 2 - 1.6, -14]); box(scene, mat('#7a3a2a'), [4.8, 0.3, 3.2], [x, h * 4 - 1.5, -14]); });
  const s = createSerape({ scale: 1.5 }); s.position.set(0, -0.05, 1.1);
  s.userData.pose({ lean: 0.1, headTilt: 0.06 });
  s.userData.reach('l', [0.45, 0.75, -0.15]); s.userData.reach('r', [-0.45, 0.75, -0.15]);
  s.userData.pose({ lean: 0.1, headTilt: 0.06 });
  s.userData.reach('l', [0.45, 0.75, -0.15]); s.userData.reach('r', [-0.45, 0.75, -0.15]);
  s.position.set(0, 0.3, 1.1); scene.add(s);
  finishScene(stage, s, [num('cx', 1.2), num('cy', 1.4), num('cz', 6.2)], [num('tx', 0), num('ty', 1.2), 0]);
});
</script></body></html>
