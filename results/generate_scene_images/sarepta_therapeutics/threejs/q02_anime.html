<!doctype html>
<html><head><meta charset="utf-8"><title>Sarepta scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, createSerape, mat, add, box, blob, cyl, num, makeStage, finishScene, ground, textPlane, helix, elevator } from './common.js';
// q02 — The SERAPE's gene therapy rides an ELEVATOR (Elevidys).
guard(() => {
  const stage = makeStage({ sunAzimuth: 160 }), scene = stage.scene;
  ground(scene, '#c9bfae');
  box(scene, mat('#d7cdbb'), [14, 7, 0.4], [0, 3.5, -1.4]);
  const e = elevator(); e.position.set(0.9, 0, 0); scene.add(e);
  const s = createSerape({ scale: 1.3 }); s.position.set(0.9, 0.05, 0.0); scene.add(s);
  s.userData.pose({ arms: { l: [0, 0.3, 0] } });
  const gene = helix(0.7, 0.13); gene.position.set(1.42, 1.38, 0.55); gene.rotation.z = 0.0; scene.add(gene);
  s.userData.reach('l', [0.4, 1.0, 0.3]);
  // glow ring
  add(scene, new THREE.TorusGeometry(0.4, 0.015, 8, 40), new THREE.MeshBasicMaterial({ color: '#fff3a0' }), [1.42, 1.38, 0.55]);
  finishScene(stage, s, [num('cx', 1.2), num('cy', 1.6), num('cz', 5.6)], [num('tx', 0.9), num('ty', 1.55), 0], false);
});
</script></body></html>
