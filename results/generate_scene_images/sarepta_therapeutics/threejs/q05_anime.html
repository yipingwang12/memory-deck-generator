<!doctype html>
<html><head><meta charset="utf-8"><title>Sarepta scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, createSerape, mat, add, box, blob, cyl, num, makeStage, finishScene, ground, textPlane, helix, elevator } from './common.js';
// q05 — A MATCH burns a third of the SERAPE away, and staff leave.
guard(() => {
  const stage = makeStage({ sunAzimuth: 140 }), scene = stage.scene; ground(scene, '#b9a57a');
  const s = createSerape({ scale: 1.9 }); s.position.set(-0.4, 0, 0.5); scene.add(s);
  s.userData.pose({ arms: { l: [0, 0.4, 0.1], r: [0, -0.5, 0] } });
  // charred right third (serape-local x -0.26..-0.087), jagged edge
  const ch = mat('#1d1410', { roughness: 1 });
  box(s, ch, [0.18, 0.5, 0.115], [-0.17, 0.57, 0]);
  for (let i = 0; i < 4; i++) add(s, new THREE.ConeGeometry(0.045, 0.1, 4), ch, [-0.23 + i * 0.045, 0.85, 0], [0, 0.4, Math.PI], [1, 1, 0.9]);
  const fl = [['#ff6a1f', 0.2], ['#ffb02f', 0.14], ['#ffe27a', 0.09]];
  for (let i = 0; i < 5; i++) fl.forEach(([c, h], k) => add(s, new THREE.ConeGeometry(0.05 - k * 0.012, h * 1.6, 12), new THREE.MeshBasicMaterial({ color: c }), [-0.23 + i * 0.05, 0.93 + h * 0.4, 0.04 + k * 0.004], [0, 0, (i - 2) * 0.12]));
  // giant match
  const m = new THREE.Group(); m.position.set(-3.55, 0.0, 0.9); m.rotation.z = -1.0; scene.add(m);
  cyl(m, mat('#e2b073'), 0.07, 0.07, 3.0, [0, 1.5, 0]);
  blob(m, mat('#d12a2a', { roughness: 0.35 }), [0, 3.05, 0], [0.14, 0.2, 0.14]);
  for (const [c, r, h] of [['#ff6a1f', 0.3, 0.8], ['#ffb02f', 0.2, 0.6], ['#fff0a0', 0.11, 0.38]]) add(m, new THREE.ConeGeometry(r, h, 16), new THREE.MeshBasicMaterial({ color: c }), [0, 3.35 + (0.55 - h) * 0.3 + h * 0.2, 0]);
  // staff leaving with boxes
  const person = (x, z, c) => {
    const p = new THREE.Group(); p.position.set(x, 0, z); p.rotation.y = 1.3; scene.add(p);
    cyl(p, mat(c), 0.1, 0.13, 0.5, [0, 0.55, 0]); blob(p, mat('#ffd9b3'), [0, 0.98, 0], [0.11, 0.12, 0.11]);
    for (const sx of [-1, 1]) cyl(p, mat('#394150'), 0.035, 0.035, 0.32, [sx * 0.05, 0.16, 0.0]);
    box(p, mat('#c89b5a'), [0.3, 0.26, 0.26], [0, 0.6, 0.2]);
  };
  person(1.7, 0.3, '#3a6fd1'); person(2.5, -0.5, '#2fa37a'); person(3.3, 0.2, '#b84a8a');
  finishScene(stage, s, [num('cx', 0.6), num('cy', 1.7), num('cz', 7.0)], [num('tx', 0.5), num('ty', 1.6), 0]);
});
</script></body></html>
