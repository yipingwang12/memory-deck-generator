<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// A GNOME announces the HEN new nest.
import { THREE, guard, mat, add, blob, box, cyl, makeScene, nest, coin, egg, die, sign, tree, person, rng } from './common.js';
import * as X from './props2.js';
const { placeHen, placePerson, placeNest, aimAt } = X;
guard(() => {

  const S = makeScene({ ground: '#7ab34c' }); const { scene, mark } = S;
  placeNest(S, -0.7, 0, 1.55);
  const hen = placeHen(S, { x: -0.7, y: 0.13, z: 0, ry: 0.3, scale: 1.4, sit: true });
  const g = placePerson(S, { skin: '#ffd9b8', shirt: '#2f6fd0', pants: '#35508a', hat: 'gnome', hair: '#f4f4f4', beard: '#f6f6f6' }, { x: 1.9, z: 0.4, ry: -0.5, scale: 1.3 });
  const mp = X.megaphone(0.8); mp.position.set(1.2, 1.25, 0.85); mp.rotation.z = Math.PI / 2 + 0.1; scene.add(mp);
  aimAt(g, g.userData.aim, 'l', [1.45, 1.25, 0.8]); aimAt(g, g.userData.aim, 'r', [1.7, 1.2, 0.8]);
  for (let i = 0; i < 2; i++) { const w = add(scene, new THREE.TorusGeometry(0.25 + i * 0.22, 0.03, 8, 32, 1.4), mat('#ffd23a', { emissive: '#ffb000', emissiveIntensity: 0.5 }), [1.0 - i * 0.4, 1.35, 0.8], [0, 0, Math.PI - 0.7]); }
  const rib = mat('#e0262e'); for (const x of [-1.9, 0.5]) { cyl(scene, mat('#8a5a2b'), [x, 0.2, 1.7], 0.04, 0.4); }
  add(scene, new THREE.BoxGeometry(2.4, 0.12, 0.03), rib, [-0.7, 0.4, 1.7]); for (const k of [-1, 1]) blob(scene, rib, [-0.7 + k * 0.15, 0.4, 1.72], [0.17, 0.12, 0.05], [0, 0, k * 0.5]);
  const sp = mat('#fff7c0', { emissive: '#ffe680', emissiveIntensity: 0.8 }); [[-1.5, 1.6], [0.0, 1.9], [-1.9, 0.9], [0.1, 1.2]].forEach(([x, y]) => add(scene, new THREE.OctahedronGeometry(0.11), sp, [x, y, 0.6], [0, 0.5, 0.5], [0.6, 1.2, 0.6]));
  S.finish([0.2, 1.2, 5.3], [0.2, 0.95, 0]);
});
