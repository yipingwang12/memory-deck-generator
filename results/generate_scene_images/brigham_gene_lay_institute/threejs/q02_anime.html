<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// A pair of DICE rolls one hundred million coins into the HEN nest.
import { THREE, guard, mat, add, blob, box, cyl, makeScene, nest, coin, egg, die, sign, tree, person, rng } from './common.js';
import * as X from './props2.js';
const { placeHen, placePerson, placeNest, aimAt } = X;
guard(() => {

  const S = makeScene({ ground: '#7ab34c' }); const { scene, mark } = S;
  placeNest(S, -0.5, 0, 1.6);
  const hen = placeHen(S, { x: -0.5, y: 0.13, z: 0, ry: 0.15, scale: 1.45, sit: true });
  const d1 = die(0.7); d1.position.set(1.55, 1.3, 0.9); d1.rotation.set(0.6, 0.5, 0.3); scene.add(d1);
  const d2 = die(0.7); d2.position.set(1.6, 0.36, 1.3); d2.rotation.set(0, 0.5, 0); scene.add(d2);
  for (let i = 0; i < 7; i++) { const t = i / 8, c = coin(0.16); c.position.set(1.4 - t * 1.9, 1.3 + Math.sin(t * Math.PI) * 0.7 - t * 0.2, 0.6 - t * 0.3); c.rotation.set(t * 3, t * 2, 0); scene.add(c); }
  for (let i = 0; i < 9; i++) { const a = Math.PI + i / 8 * Math.PI, c = coin(0.15); c.position.set(-0.5 + Math.cos(a) * 0.9, 0.3, -Math.sin(a) * 0.5 * -1 - 0.1); c.rotation.set(1.2, a, 0); scene.add(c); }
  for (let i = 0; i < 8; i++) { const c = coin(0.16); c.position.set(0.5 + i * 0.2, 0.04, 1.9 + (i % 3) * 0.25); c.rotation.set(Math.PI / 2 + (i % 2) * 0.4, 0, i); scene.add(c); }
  S.finish([0.3, 1.2, 5.2], [0.3, 0.9, 0]);
});
</script></body></html>
