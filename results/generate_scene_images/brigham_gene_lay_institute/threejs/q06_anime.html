<script type="module">
// Three farmers share the HEN: BRIGHAM, MGH and HARVARD.
import { THREE, guard, mat, add, blob, box, cyl, makeScene, nest, coin, egg, die, sign, tree, person, rng } from './common.js';
import * as X from './props2.js';
const { placeHen, placePerson, placeNest, aimAt } = X;
guard(() => {

  const S = makeScene({ ground: '#7ab34c' }); const { scene, mark } = S;
  const hen = placeHen(S, { x: 0, z: 2.2, ry: 0, scale: 1.3 });
  const cfg = [[-2.3, 'BRIGHAM', '#2f6fd0', '#2a5ea8'], [2.3, 'HARVARD', '#a51c30', '#ffffff'], [0, 'MGH', '#1f8a5a', '#ffffff']];
  cfg.forEach(([x, label, shirt, bg], i) => {
    const z = i === 2 ? -2.8 : 0.2, sc = i === 2 ? 2.2 : 1.4;
    const p = placePerson(S, { shirt, pants: '#4a3a2a', hat: 'straw', hair: ['#4a2d1a', '#222', '#8a5a2a'][i] }, { x, z, ry: (i === 0 ? 0.45 : i === 1 ? -0.45 : 0), scale: sc });
    const s = sign(label, 1.45, 0.55, { bg: i === 0 ? '#ffffff' : bg === '#ffffff' ? '#a51c30' : '#1f8a5a', fg: i === 0 ? '#1f3f8a' : '#ffffff' });
    const ang = (i === 0 ? 0.45 : i === 1 ? -0.45 : 0); s.position.set(x + (i === 0 ? 0.35 : i === 1 ? -0.35 : 0), z === 0.2 ? 0.95 : 1.65, z + (i === 2 ? 0.55 : 0.55)); s.rotation.y = ang * 0.5; scene.add(s);
    aimAt(p, p.userData.aim, 'l', [s.position.x + 0.4, s.position.y - 0.05, s.position.z]); aimAt(p, p.userData.aim, 'r', [s.position.x - 0.4, s.position.y - 0.05, s.position.z]);
  });
  S.finish([0, 2.0, 6.4], [0, 0.95, 0]);
});
