<!doctype html>
<html><head><meta charset="utf-8"><title>Sanofi q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q02 — Next to the SUNFLOWER at the crossing swims the SQUID.
import { THREE, guard, mat, add, box, cyl, blob, num, makeStage, placeSunflower, finish } from './common.js';
guard(() => {
  const stage = makeStage({ ground: '#78b04a' }), sc = stage.scene;
  // river with a zebra footbridge
  const water = add(sc, new THREE.BoxGeometry(60, 0.5, 5), mat('#2a86c8', { roughness: 0.2, metalness: 0.1 }), [0, -0.2, -1.2]);
  add(sc, new THREE.BoxGeometry(60, 0.02, 5), mat('#5cc0ec', { roughness: 0.15, transparent: true, opacity: 0.8 }), [0, 0.06, -1.2]);
  for (let i = -5; i <= 5; i++) box(sc, mat('#fff'), [i * 0.6 - 3.2, 0.12, 2.6 - 3.8], [0.35, 0.02, 0.01]);
  box(sc, mat('#d9d4c8'), [-3.4, 0.12, -1.2], [1.8, 0.14, 5.2]); for (let i = 0; i < 5; i++) box(sc, mat('#fff'), [-3.4, 0.2, -3.0 + i * 0.9], [1.6, 0.02, 0.45]);
  box(sc, mat('#d9d4c8'), [0, 0.04, 1.8], [60, 0.1, 1.6]);
  // SQUID
  const sq = new THREE.Group(); sq.position.set(1.4, 0.35, -0.9); sq.rotation.set(0.25, -0.5, 0.15); sc.add(sq);
  const skin = mat('#e8506a'), pale = mat('#ffb7c0');
  blob(sq, skin, [0, 0.55, 0], [0.38, 0.62, 0.38]);                 // mantle
  add(sq, new THREE.ConeGeometry(0.34, 0.5, 20), skin, [0, 1.15, 0]);   // tip
  for (const s of [-1, 1]) blob(sq, skin, [s * 0.38, 0.95, 0], [0.22, 0.14, 0.03], [0, 0, s * 0.6]);
  blob(sq, skin, [0, 0, 0.0], [0.34, 0.2, 0.34]);
  for (const s of [-1, 1]) {
    blob(sq, mat('#fff'), [s * 0.2, 0.1, 0.28], [0.1, 0.12, 0.05]);
    blob(sq, mat('#111'), [s * 0.2, 0.1, 0.32], [0.06, 0.08, 0.03]);
    blob(sq, mat('#fff'), [s * 0.19, 0.14, 0.345], [0.02, 0.02, 0.01]);
  }
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; const l = 0.5 + (i % 2) * 0.18;
    for (let k = 0; k < 6; k++) blob(sq, i % 2 ? skin : pale, [Math.cos(a) * (0.15 + k * 0.035), -0.1 - k * 0.1, Math.sin(a) * (0.15 + k * 0.035) + Math.sin(k * 1.3 + i) * 0.05], [0.055 - k * 0.005, 0.07, 0.055 - k * 0.005]);
  }
  // bubbles
  for (let i = 0; i < 8; i++) blob(sc, mat('#dff6ff', { transparent: true, opacity: 0.7 }), [0.4 + i * 0.1, 0.5 + i * 0.2, -0.3], [0.05, 0.05, 0.05]);
  const f = placeSunflower(stage, { pos: [-1.0, 0, 1.4], ry: 0.45, scale: 1.8, pose: { headTilt: 0.08 }, reach: { r: [0.1, 0.9, 1.2] } });
  finish(stage, f, { pos: [0, 1.5, 6.0], at: [0.2, 1.2, 0] });
});
</script></body></html>
