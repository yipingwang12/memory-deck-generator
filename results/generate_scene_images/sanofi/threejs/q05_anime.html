<!doctype html>
<html><head><meta charset="utf-8"><title>Sanofi q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q05 — The SUNFLOWER's best-selling petals calm an overactive IMMUNE system: immunology.
import { THREE, guard, mat, add, box, cyl, blob, num, makeStage, placeSunflower, finish, rng } from './common.js';
guard(() => {
  const stage = makeStage({ ground: '#e69a9a', sky: { cover: 0.5 } }), sc = stage.scene;
  const r = rng(3);
  // angry red immune cells (spiky) calming down into blue glow + antibodies (Y)
  const Y = (x, y, z, s, c) => { const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s); g.rotation.set(r() * 3, r() * 3, r() * 3); sc.add(g);
    const m = mat(c, { roughness: 0.4 }); cyl(g, m, [0, -0.2, 0], 0.07, 0.4);
    for (const k of [-1, 1]) cyl(g, m, [k * 0.17, 0.12, 0], 0.07, 0.42, [0, 0, k * 0.8]); for (const k of [-1, 1]) blob(g, m, [k * 0.31, 0.27, 0], [0.09, 0.09, 0.09]); };
  for (let i = 0; i < 14; i++) Y((r() - 0.5) * 7, 0.6 + r() * 3.2, -1.5 - r() * 3, 1.8, i % 2 ? '#3a82e0' : '#8ac2ff');
  for (let i = 0; i < 9; i++) { const x = (r() - 0.5) * 8, y = 0.8 + r() * 3.2, z = -1 - r() * 3.5, g = new THREE.Group(); g.position.set(x, y, z); sc.add(g);
    blob(g, mat('#f5f2ee'), [0, 0, 0], [0.32, 0.32, 0.32]); blob(g, mat('#8a5fd0'), [0.05, 0.03, 0.22], [0.2, 0.17, 0.12]);
    for (const k of [-1, 1]) { blob(g, mat('#111'), [k * 0.1, 0.1, 0.3], [0.03, 0.04, 0.02]); } }
  // calming shield behind
  const sh = new THREE.Shape(); sh.moveTo(0, 1.2); sh.quadraticCurveTo(1, 1.1, 1, 0.3); sh.quadraticCurveTo(0.9, -0.8, 0, -1.2); sh.quadraticCurveTo(-0.9, -0.8, -1, 0.3); sh.quadraticCurveTo(-1, 1.1, 0, 1.2);
  const shield = add(sc, new THREE.ExtrudeGeometry(sh, { depth: 0.1, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 3 }), mat('#4a90e0'), [-1.7, 2.2, -2.2], [0, 0.2, 0], [1.2, 1.2, 1]);
  box(sc, mat('#fff'), [-1.7, 2.2, -2.0], [0.2, 0.9, 0.05]); box(sc, mat('#fff'), [-1.7, 2.3, -2.0], [0.9, 0.2, 0.05]);
  // blue calm halo around petals
  const halo = add(sc, new THREE.TorusGeometry(0.8, 0.04, 8, 40), mat('#9fd4ff', { emissive: '#4a9cf0', emissiveIntensity: 0.6 }), [0.0, 2.5, 1.25], [0, 0, 0]);
  const f = placeSunflower(stage, { pos: [0, 0, 1.2], ry: 0, scale: 1.8, pose: { headTilt: 0.08 } });
  halo.position.set(0, 0.8 * 1.8 + 0.12 * 1.8 + 0.0, 1.2);
  halo.scale.set(1.0, 1.0, 1.0);
  finish(stage, f, { pos: [0, 2.0, 6.4], at: [0, 1.9, 0] }, false);
});
</script></body></html>
