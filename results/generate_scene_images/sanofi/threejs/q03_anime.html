<!doctype html>
<html><head><meta charset="utf-8"><title>Sanofi q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q03 — BEES lay floor tiles across two SUNFLOWER buildings.
import { THREE, guard, mat, add, box, cyl, blob, num, makeStage, placeSunflower, finish, bee, tiles, createSunflower } from './common.js';
guard(() => {
  const stage = makeStage({ ground: '#a8c9a0' }), sc = stage.scene;
  // two buildings with sunflower emblems
  for (const x of [-3.2, 3.2]) {
    box(sc, mat('#e9e3d6'), [x, 1.8, -2.5], [2.4, 3.6, 2.2]);
    box(sc, mat('#6fa8d8'), [x, 2.2, -1.38], [1.9, 2.0, 0.04]);
    const em = createSunflower({ scale: 1.0 }); em.position.set(x, 0.1, -1.2); sc.add(em); em.userData.pose({ arms: { l: [0, 0.5, 0], r: [0, 0.5, 0] } });
    em.userData.parts.head.scale.setScalar(1.0);
  }
  // tile path between buildings, half laid
  const t = tiles(18, 0.25, '#f2f0ea', '#2f7fd0'); t.position.set(-2.1, 0.02, -0.2); t.scale.set(1, 1, 1); t.rotation.y = 0; sc.add(t);
  t.children.forEach((c, i) => { c.castShadow = c.receiveShadow = true; if (Math.floor(i / 18) > 11) c.visible = false; });
  // lay-in-progress tile held by bees
  const bees = [[0.9, 1.3, 0.8], [-0.6, 1.7, 0.9], [1.9, 1.1, 0.4], [0.2, 1.0, 1.7], [-1.5, 1.4, 0.2]];
  const held = mat('#2f7fd0');
  bees.forEach(([x, y, z], i) => { const b = bee(2.2); b.position.set(x, y, z); b.rotation.y = -0.6 + i * 0.4; sc.add(b); });
  box(sc, held, [0.9, 1.05, 0.95], [0.4, 0.04, 0.4], [0.2, 0.3, 0.1]);
  box(sc, mat('#f2f0ea'), [-0.6, 1.45, 1.05], [0.4, 0.04, 0.4], [0.1, 0.3, -0.1]);
  const f = placeSunflower(stage, { pos: [-0.1, 0, 1.9], ry: 0.1, scale: 1.6, pose: { headTilt: 0.05 } });
  finish(stage, f, { pos: [0, 1.5, 6.2], at: [0, 1.1, 0] });
});
</script></body></html>
