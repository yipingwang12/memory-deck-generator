<!doctype html>
<html><head><meta charset="utf-8"><title>Sanofi q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q06 — The SUNFLOWER swallows the BLUEPRINT.
import { THREE, guard, mat, add, box, cyl, blob, num, makeStage, placeSunflower, finish, canvasTexture } from './common.js';
guard(() => {
  const stage = makeStage({ ground: '#78b04a' }), sc = stage.scene;
  const bp = canvasTexture(512, (ctx, s) => {
    ctx.fillStyle = '#1b4fa8'; ctx.fillRect(0, 0, s, s); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    for (let i = 0; i <= s; i += 32) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, s); ctx.moveTo(0, i); ctx.lineTo(s, i); ctx.stroke(); }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.strokeRect(80, 120, 350, 280); ctx.strokeRect(80, 120, 150, 120); ctx.beginPath(); ctx.moveTo(230, 400); ctx.lineTo(230, 300); ctx.lineTo(340, 300); ctx.lineTo(340, 400); ctx.stroke();
    ctx.beginPath(); ctx.arc(330, 190, 40, 0, 7); ctx.stroke();
  });
  const bpm = new THREE.MeshStandardMaterial({ map: bp, roughness: 0.8, side: THREE.DoubleSide });
  // unrolled blueprint on the ground, curling up into the flower
  box(sc, bpm, [1.0, 0.03, 1.8], [2.6, 0.04, 1.8], [0, -0.4, 0]);
  // rolled blueprint tube in hand, tilted at the mouth
  const roll = new THREE.Group(); roll.position.set(0.3, 1.5, 1.45); roll.rotation.set(0, 0, 0.85); sc.add(roll);
  add(roll, new THREE.CylinderGeometry(0.09, 0.09, 0.9, 24), bpm);
  add(roll, new THREE.CylinderGeometry(0.095, 0.095, 0.05, 24), mat('#e8e2d0'), [0, 0.45, 0]);
  cyl(roll, mat('#dfe9f5'), [0, 0.46, 0], 0.075, 0.02);
  const f = placeSunflower(stage, { pos: [-0.1, 0, 1.2], ry: 0.1, scale: 2.0, pose: { headTilt: -0.12 }, reach: { l: [0.75, 1.2, 1.3] } });
  // open mouth over the smile
  const head = f.userData.parts.head; const mouth = new THREE.Mesh(new THREE.CircleGeometry(1, 30), mat('#5a1420')); mouth.scale.set(0.07, 0.085, 1); mouth.position.set(0, -0.058, 0.056); head.add(mouth);
  const tongue = new THREE.Mesh(new THREE.CircleGeometry(1, 20), mat('#e8667a')); tongue.scale.set(0.04, 0.03, 1); tongue.position.set(0, -0.085, 0.057); head.add(tongue);
  finish(stage, f, { pos: [0, 2.0, 6.0], at: [0.3, 1.7, 0] });
});
</script></body></html>
