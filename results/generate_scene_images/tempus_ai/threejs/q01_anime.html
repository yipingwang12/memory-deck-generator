<!doctype html>
<html><head><meta charset="utf-8"><title>Tempus scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">

// q01 — "The HOURGLASS stands under CHICAGO's big silver BEAN."
import { THREE, guard, rng, num, mat, add, box, cyl, ball, makeStage, ground, hero, finish, label } from './common.js';

function bean() {
  const g = new THREE.Group();
  const geo = new THREE.SphereGeometry(1, 96, 64); const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const lift = 0.5 * Math.exp(-(x * x) / 0.5);
    const yy = (y < 0 ? y * 0.18 : y * 0.9) + lift;
    p.setXYZ(i, x * 3.4, yy * 1.8, z * 1.5);
  }
  geo.computeVertexNormals();
  add(g, geo, mat('#8fa6c4', { metalness: 0.5, roughness: 0.15 }));
  return g;
}
function skyline(scene) {
  const r = rng(3), cols = ['#8fa4bd', '#7b92ae', '#a3b5c9', '#6f869f'];
  for (let i = 0; i < 26; i++) {
    const x = -34 + i * 2.7 + r(), h = 5 + r() * 12, w = 1.6 + r() * 1.4;
    box(scene, w, h, w, mat(cols[i % 4], { roughness: 0.5 }), [x, h / 2, -26 - r() * 5]);
  }
  box(scene, 2.4, 30, 2.4, '#5d6f87', [8, 15, -24]); box(scene, 1.6, 6, 1.6, '#5d6f87', [8, 33, -24]);
  for (const dx of [-1.2, 1.2]) cyl(scene, 0.12, 0.12, 4, '#222', [8 + dx, 38, -24]);
}
guard(() => {
  const stage = makeStage({ sky: { cover: 1.2 } }); const scene = stage.scene;
  ground(scene, '#b9b4a8');
  box(scene, 14, 0.12, 9, '#d8d2c4', [0, 0.06, 0]);
  skyline(scene);
  const b = bean(); b.position.set(0, 0.0, -0.6); b.scale.setScalar(1.0); scene.add(b);
  const h = hero(scene, { scale: num('ps', 1.9), pos: [0, 0.12, 0.5], ry: 0.15, pose: { arms: { l: [0, 0.9, 0.3], r: [0, 0.4, 0] } } });
  h.userData.reach('l', [0.25, 0.95, 0.2]);
  finish(stage, [h], { cam: [0.5, 1.1, 5.4], look: [0, 1.5, 0] });
});
</script></body></html>
