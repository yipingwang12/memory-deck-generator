<html><head><meta charset="utf-8"><title>scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, box, cyl, textPlane, heraldicShield, makeStage, meadow, createGuardsman, finishScene, holdAt, helix, cancerCell, bloodCell, magnifier, rng, canvasTexture } from "./common.js";
import { guard } from "./kit.js";
// q03 — GUARDSMAN raises a SHIELD over the colon.
guard(() => {
  const P = new URLSearchParams(location.search); const stage = makeStage(P); const scene = stage.scene;
  meadow(scene, '#5f9e3f');
  const plinth = cyl(scene, mat('#cfc8b8'), 0.75, 0.85, 0.35, [0.95, 0.175, -0.1]);
  const colon = new THREE.Group(); colon.position.set(0.95, 0.35, -0.1); colon.scale.setScalar(1.35); scene.add(colon);
  const pts = [[0.45, 0.05], [0.5, 0.3], [0.5, 0.65], [0.42, 0.88], [0.15, 0.95], [-0.15, 0.95], [-0.42, 0.88], [-0.5, 0.65], [-0.5, 0.3], [-0.38, 0.12], [-0.12, 0.2], [0.1, 0.1]].map(([x, y]) => new THREE.Vector3(x, y, 0));
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.4);
  add(colon, new THREE.TubeGeometry(curve, 120, 0.1, 16), mat('#ee9a8e', { roughness: 0.5 }));
  for (let i = 0; i < 46; i++) { const p = curve.getPoint(i / 46); const q = curve.getTangent(i / 46); const t = add(colon, new THREE.TorusGeometry(0.1, 0.018, 8, 20), mat('#d97a70'), p.toArray()); t.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), q); }
  const g = createGuardsman({ scale: 1.5 }); g.position.set(-0.55, 0, 0.6); g.rotation.y = 0.2; scene.add(g);
  const sh = heraldicShield(); sh.scale.setScalar(1.25); sh.position.set(0.62, 1.95, 0.55); sh.rotation.set(0, -0.2, 0.1); scene.add(sh);
  holdAt(g, 'l', [0.34, 1.42, 0.7]); holdAt(g, 'r', [0.0, 1.55, 0.72]);
  g.userData.pose({ headYaw: -0.2 });
  holdAt(g, 'l', [0.34, 1.5, 0.7]); holdAt(g, 'r', [-0.05, 1.5, 0.72]);
  finishScene(stage, g, P, { cx: 0.35, cy: 1.3, cz: 5.3, tx: 0.4, ty: 1.15 });
});
</script></body></html>
