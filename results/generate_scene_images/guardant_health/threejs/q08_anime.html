<html><head><meta charset="utf-8"><title>scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { THREE, mat, add, blob, box, cyl, textPlane, heraldicShield, makeStage, meadow, createGuardsman, finishScene, holdAt, helix, cancerCell, bloodCell, magnifier, rng, canvasTexture } from "./common.js";
import { guard } from "./kit.js";
// q08 — GUARDSMAN guards three gates: therapy, MRD, screening.
guard(() => {
  const P = new URLSearchParams(location.search); const stage = makeStage(P); const scene = stage.scene;
  meadow(scene, '#5f9e3f');
  const stone = mat('#c9b99a', { roughness: 0.9 });
  const gate = (x, accent) => {
    const gt = new THREE.Group(); gt.position.set(x, 0, -1.4); scene.add(gt);
    for (const s of [-1, 1]) box(gt, stone, [s * 0.62, 1.1, 0], [0.3, 2.2, 0.4]);
    add(gt, new THREE.TorusGeometry(0.62, 0.15, 12, 30, Math.PI), stone, [0, 2.2, 0]);
    add(gt, new THREE.CircleGeometry(0.62, 30, 0, Math.PI), mat(accent, { side: THREE.DoubleSide }), [0, 2.2, -0.05]); box(gt, mat(accent), [0, 1.1, -0.05], [1.24, 2.2, 0.04]);
    return gt;
  };
  const colors = ['#ffb347', '#a97fe0', '#6fd0a0'];
  const gs = [-2.6, 0, 2.6].map((x, i) => gate(x, colors[i]));
  // gate 1: pill
  const pill = new THREE.Group(); pill.position.set(0, 1.4, 0.2); pill.rotation.z = 0.6; gs[0].add(pill);
  cyl(pill, mat('#e33a3a', { roughness: 0.3 }), 0.14, 0.14, 0.34, [0, 0.17, 0]); blob(pill, mat('#e33a3a', { roughness: 0.3 }), [0, 0.34, 0], [0.14, 0.14, 0.14]);
  cyl(pill, mat('#fafafa', { roughness: 0.3 }), 0.14, 0.14, 0.34, [0, -0.17, 0]); blob(pill, mat('#fafafa', { roughness: 0.3 }), [0, -0.34, 0], [0.14, 0.14, 0.14]);
  // gate 2: magnifier over cancer cell
  const c = cancerCell(2.4, '#7a2aa8'); c.position.set(0.1, 1.15, 0.2); gs[1].add(c);
  const m = magnifier(); m.scale.setScalar(3.2); m.position.set(-0.15, 1.5, 0.6); gs[1].add(m);
  // gate 3: clipboard with check
  const cb = new THREE.Group(); cb.position.set(0, 1.3, 0.2); gs[2].add(cb);
  box(cb, mat('#8a5a2c'), [0, 0, 0], [0.65, 0.85, 0.04]); box(cb, mat('#ffffff'), [0, -0.02, 0.025], [0.55, 0.74, 0.01]); box(cb, mat('#9aa0aa'), [0, 0.45, 0.03], [0.22, 0.08, 0.03]);
  box(cb, mat('#2fb060'), [-0.08, -0.07, 0.04], [0.09, 0.3, 0.02], [0, 0, 0.7]); box(cb, mat('#2fb060'), [0.07, 0.0, 0.04], [0.09, 0.5, 0.02], [0, 0, -0.7]);
  const g = createGuardsman({ scale: 1.5 }); g.position.set(-1.3, 0, 1.0); scene.add(g);
  g.userData.pose({}); holdAt(g, 'l', [-0.7, 1.5, 1.0]); holdAt(g, 'r', [-1.9, 1.5, 1.0]);
  finishScene(stage, g, P, { cx: 0, cy: 1.3, cz: 7.0, tx: 0, ty: 1.3 });
});
</script></body></html>
