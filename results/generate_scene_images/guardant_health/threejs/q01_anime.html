<!doctype html>
<html><head><meta charset="utf-8"><title>scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, box, cyl, textPlane, heraldicShield, makeStage, meadow, createGuardsman, finishScene, holdAt, helix, cancerCell, bloodCell, magnifier, rng, canvasTexture } from "./common.js";
import { guard } from "./kit.js";
// q01 — GUARDSMAN stands under a tall PALO ALTO redwood.
guard(() => {
  const P = new URLSearchParams(location.search); const stage = makeStage(P); const scene = stage.scene;
  meadow(scene, '#5f9e3f');
  const tree = new THREE.Group(); tree.position.set(0.5, 0, -0.9); scene.add(tree);
  const bark = mat('#8a3f22', { roughness: 0.95 });
  add(tree, new THREE.CylinderGeometry(0.28, 0.55, 9, 24), bark, [0, 4.5, 0]);
  for (let i = 0; i < 10; i++) { const a = i * 0.63; add(tree, new THREE.CylinderGeometry(0.03, 0.04, 8, 6), mat('#6a2c18'), [Math.cos(a) * 0.43, 4.0, Math.sin(a) * 0.43]); }
  const leaf = mat('#2c6a3a', { roughness: 0.9 });
  for (let i = 0; i < 9; i++) { const y = 3.2 + i * 0.85, r = 1.5 - i * 0.14; add(tree, new THREE.ConeGeometry(r, 1.3, 20), leaf, [0, y + 0.5, 0]); }
  add(tree, new THREE.ConeGeometry(0.3, 1.0, 16), leaf, [0, 11.2, 0]);
  // signpost
  const post = new THREE.Group(); post.position.set(-1.5, 0, 1.2); post.rotation.y = 0.3; scene.add(post);
  box(post, mat('#7a4a22'), [0, 0.6, 0], [0.09, 1.2, 0.09]);
  const sign = textPlane('', 1.0, 0.42, { bg: '#7a4a22', fg: '#fff1c8', lines: ['PALO', 'ALTO'], px: 0.7 }); sign.position.set(0, 1.1, 0.06); post.add(sign);
  box(post, mat('#4a2a10'), [0, 1.1, 0.0], [1.08, 0.5, 0.05]);
  const g = createGuardsman({ scale: 2.1 }); g.position.set(-0.4, 0, 0.7); g.rotation.y = 0.1; scene.add(g);
  g.userData.pose({ headTilt: 0, headYaw: 0.25, arms: { r: [0, 0.05, 0] } }); holdAt(g, 'l', [0.45, 1.9, 0.9]);
  stage.camera.fov = 40;
  finishScene(stage, g, P, { cx: 0.2, cy: 1.5, cz: 7.2, tx: 0.1, ty: 2.0 });
});
</script></body></html>
