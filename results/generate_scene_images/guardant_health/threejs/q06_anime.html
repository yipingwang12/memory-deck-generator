<html><head><meta charset="utf-8"><title>scene</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, box, cyl, textPlane, heraldicShield, makeStage, meadow, createGuardsman, finishScene, holdAt, helix, cancerCell, bloodCell, magnifier, rng, canvasTexture } from "./common.js";
import { guard } from "./kit.js";
// q06 — A UNITED HEALTH umbrella pays for the GUARDSMAN's SHIELD.
guard(() => {
  const P = new URLSearchParams(location.search); const stage = makeStage(P); const scene = stage.scene;
  meadow(scene, '#5f9e3f');
  const g = createGuardsman({ scale: 1.5 }); g.position.set(-0.9, 0, 0.5); g.rotation.y = 0.25; scene.add(g);
  const sh = heraldicShield(); sh.scale.setScalar(1.2); sh.position.set(-0.15, 0.95, 0.85); sh.rotation.y = 0.1; scene.add(sh);
  g.userData.pose({ headYaw: 0.2 }); holdAt(g, 'l', [-0.2, 1.05, 0.86]);
  const um = new THREE.Group(); um.position.set(0.9, 0, 0.1); um.rotation.z = -0.25; scene.add(um);
  cyl(um, mat('#d8d8e0', { metalness: 0.6, roughness: 0.3 }), 0.025, 0.025, 2.7, [0, 1.35, 0]);
  for (let i = 0; i < 8; i++) {
    const a = add(um, new THREE.SphereGeometry(1.2, 6, 10, i * Math.PI / 4, Math.PI / 4, 0, Math.PI / 2), mat(i % 2 ? '#ff7a1a' : '#1f5fd0', { side: THREE.DoubleSide, roughness: 0.5 }), [0, 2.0, 0], [0, 0, 0], [1, 0.55, 1]);
  }
  blob(um, mat('#d8d8e0', { metalness: 0.6 }), [0, 2.67, 0], [0.05, 0.06, 0.05]);
  const t = textPlane('', 1.5, 0.5, { bg: '#fff7e6', fg: '#1d4fa0', lines: ['UNITED', 'HEALTH'], px: 0.75 }); t.position.set(0.05, 1.68, 0.55); t.rotation.z = 0.1; um.add(t);
  const gold = mat('#ffcf3a', { metalness: 0.6, roughness: 0.25 }); const r = rng(5);
  for (let i = 0; i < 16; i++) { const c = cyl(scene, gold, 0.11, 0.11, 0.025, [-0.3 + r() * 1.5, 1.5 - (i / 16) * 1.35 + 0.1, 0.5 + r() * 0.5], [r() * 1.5, 0, r() * 1.5]); }
  finishScene(stage, g, P, { cx: 0.3, cy: 1.4, cz: 5.2, tx: 0.25, ty: 1.3 });
});
