<!doctype html>
<html><head><meta charset="utf-8"><title>scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, box, cyl, textPlane, heraldicShield, makeStage, meadow, createGuardsman, finishScene, holdAt, helix, cancerCell, bloodCell, magnifier, rng, canvasTexture } from "./common.js";
import { guard } from "./kit.js";
// q02 — GUARDSMAN reads cell-free DNA floating in the blood.
guard(() => {
  const P = new URLSearchParams(location.search); const stage = makeStage(P); const scene = stage.scene;
  meadow(scene, '#5f9e3f');
  const river = add(scene, new THREE.BoxGeometry(40, 0.1, 3), mat('#a8111f', { roughness: 0.2, metalness: 0.2 }), [0, 0.02, -2.2]);
  add(scene, new THREE.BoxGeometry(40, 0.14, 0.12), mat('#6a5a48'), [0, 0.05, -0.65]);
  const r = rng(11);
  for (let i = 0; i < 22; i++) { const c = bloodCell(1.5 + r()); c.position.set(-3 + r() * 6.5, 0.5 + r() * 1.5, -1.0 - r() * 2.4); c.rotation.set(r() * 3, r() * 3, r() * 3); scene.add(c); }
  for (let i = 0; i < 12; i++) { const c = bloodCell(2); c.position.set(-3 + r() * 6, 0.12, -1.2 - r() * 2); c.rotation.x = -Math.PI / 2; scene.add(c); }
  const dna = helix(1.2, 0.2, 2.5); dna.position.set(0.75, 1.15, 0.0); dna.rotation.z = 0.25; scene.add(dna);
  const g = createGuardsman({ scale: 1.5 }); g.position.set(-0.45, 0, 0.3); g.rotation.y = 0.35; scene.add(g);
  g.userData.pose({ headYaw: 0.2 });
  const m = magnifier(); m.scale.setScalar(2.2); m.position.set(0.28, 1.2, 0.5); m.rotation.y = -0.2; scene.add(m);
  holdAt(g, 'l', [0.12, 1.1, 0.45]);
  finishScene(stage, g, P, { cx: 0.1, cy: 1.2, cz: 3.9, tx: 0.2, ty: 1.0 });
});
</script></body></html>
