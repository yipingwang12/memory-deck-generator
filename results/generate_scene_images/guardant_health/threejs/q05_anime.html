<!doctype html>
<html><head><meta charset="utf-8"><title>scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, box, cyl, textPlane, heraldicShield, makeStage, meadow, createGuardsman, finishScene, holdAt, helix, cancerCell, bloodCell, magnifier, rng, canvasTexture } from "./common.js";
import { guard } from "./kit.js";
// q05 — The AMERICAN CANCER SOCIETY writes the GUARDSMAN's SHIELD into its screening rules.
guard(() => {
  const P = new URLSearchParams(location.search); const stage = makeStage(P); const scene = stage.scene;
  meadow(scene, '#5f9e3f');
  const ban = new THREE.Group(); ban.position.set(0, 0, -1.6); scene.add(ban);
  for (const x of [-1.7, 1.7]) cyl(ban, mat('#6a4a2a'), 0.05, 0.05, 3.2, [x, 1.6, 0]);
  box(ban, mat('#f4efe4'), [0, 2.45, 0], [3.4, 1.2, 0.05]);
  const t = textPlane('', 3.3, 1.1, { bg: '#fff7e6', fg: '#1d4fa0', lines: ['AMERICAN', 'CANCER SOCIETY'], px: 0.8 }); t.position.set(0, 2.45, 0.04); ban.add(t);
  const lect = new THREE.Group(); lect.position.set(1.1, 0, 0.2); scene.add(lect);
  box(lect, mat('#7a4a22'), [0, 0.45, 0], [0.5, 0.9, 0.4]);
  const top = box(lect, mat('#8a5a2c'), [0, 0.95, 0.02], [0.8, 0.05, 0.55], [-0.5, 0, 0]);
  const book = new THREE.Group(); book.position.set(0, 1.0, 0.06); book.rotation.x = -0.5; lect.add(book);
  box(book, mat('#fffdf4'), [-0.18, 0.02, 0], [0.34, 0.03, 0.46]); box(book, mat('#fffdf4'), [0.18, 0.02, 0], [0.34, 0.03, 0.46]);
  for (let i = 0; i < 4; i++) box(book, mat('#b9b9c4'), [-0.18, 0.04, -0.15 + i * 0.1], [0.24, 0.005, 0.015]);
  const mini = heraldicShield(); mini.scale.setScalar(0.4); mini.rotation.x = -Math.PI / 2; mini.position.set(0.18, 0.045, 0.06); book.add(mini);
  const quill = new THREE.Group(); quill.position.set(0.15, 1.2, 0.15); quill.rotation.z = 0.9; lect.add(quill);
  add(quill, new THREE.ConeGeometry(0.06, 0.8, 12), mat('#ffffff'), [0, 0.4, 0], [0, 0, 0], [0.5, 1, 0.2]); cyl(quill, mat('#2a2a30'), 0.005, 0.018, 0.15, [0, -0.04, 0]);
  const g = createGuardsman({ scale: 1.5 }); g.position.set(-1.0, 0, 0.5); g.rotation.y = 0.3; scene.add(g);
  const sh = heraldicShield(); sh.scale.setScalar(1.3); sh.position.set(-0.1, 0.85, 0.85); sh.rotation.set(0, 0.15, 0); scene.add(sh);
  g.userData.pose({ headYaw: 0.3 }); holdAt(g, 'l', [-0.35, 1.0, 0.85]);
  finishScene(stage, g, P, { cx: 0.1, cy: 1.5, cz: 5.8, tx: 0.1, ty: 1.2 });
});
</script></body></html>
