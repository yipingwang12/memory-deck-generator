<!doctype html>
<html><head><meta charset="utf-8"><title>Guardsman sheet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, makeStage, meadow, createGuardsman, finishScene } from './common.js';
import { guard } from './kit.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P); const scene = stage.scene;
  meadow(scene);
  const group = new THREE.Group(); scene.add(group);
  const views = [[-0.9, 0.0, 0], [0, 0.5, 0], [0.9, 2.6, 0]];
  const gs = views.map(([x, ry]) => { const g = createGuardsman({ scale: 1.6 }); g.position.set(x, 0, 0); g.rotation.y = ry; group.add(g); return g; });
  gs[0].userData.pose({ arms: { l: [0, 0.1, 0] } });
  gs[1].userData.pose({ arms: { r: [0, 0.2, 0] } }); gs[1].userData.reach('l', [0.2, 0.85, 0.25]);
  const wrap = new THREE.Group(); gs.forEach((g) => wrap.add(g)); scene.add(wrap);
  const pm = new Set(); gs.forEach((g) => g.traverse((o) => pm.add(o)));
  stage.toonify(scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [187, 1000, 120, 1.6]]);
  stage.camera.position.set(0, 1.0, 4.4); stage.camera.lookAt(0, 0.85, 0);
  stage.finish();
});
</script></body></html>
