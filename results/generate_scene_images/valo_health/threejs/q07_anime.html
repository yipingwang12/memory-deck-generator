<!doctype html>
<html><head><meta charset="utf-8"><title>Valo q07 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — "The NOVO egg and the VIOLA aim at obesity, type 2 diabetes and heart disease." (three archery targets with icons)
import { THREE, guard, mat, add, box, cyl, blob, makeStage, finishScene, placeViola, buildEgg, pointArm, heart, canvasTexture, arrow } from './common.js';

const targetTex = () => canvasTexture(512, (ctx, s) => { ['#ffffff', '#e8284a', '#ffffff', '#e8284a', '#ffffff'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2 - i * 48, 0, 7); ctx.fill(); }); });
function target() {
  const g = new THREE.Group();
  add(g, new THREE.CylinderGeometry(0.85, 0.85, 0.1, 40), new THREE.MeshStandardMaterial({ color: '#d9a35a' }), [0, 1.3, 0], [Math.PI / 2, 0, 0]);
  add(g, new THREE.CircleGeometry(0.8, 40), new THREE.MeshStandardMaterial({ map: targetTex(), roughness: 0.8 }), [0, 1.3, 0.06]);
  for (const s of [-1, 1]) cyl(g, mat('#6a4a2a'), [s * 0.5, 0.65, -0.1], 0.04, 1.35, [0.1, 0, s * 0.3]);
  return g;
}
function bathroomScale() {
  const g = new THREE.Group();
  box(g, mat('#2a5ac0'), [0, 0, 0], [0.8, 0.8, 0.08]); box(g, mat('#1a3a80'), [0, -0.18, 0.045], [0.66, 0.34, 0.01]);
  add(g, new THREE.CircleGeometry(0.22, 32), mat('#ffffff'), [0, 0.2, 0.045]);
  add(g, new THREE.RingGeometry(0.19, 0.22, 32), mat('#2b2b30'), [0, 0.2, 0.05]);
  box(g, mat('#e8284a'), [0.05, 0.25, 0.055], [0.04, 0.17, 0.01], [0, 0, -0.9]);
  return g;
}
function glucose() {
  const g = new THREE.Group();
  const drop = new THREE.Mesh(new THREE.SphereGeometry(0.26, 28, 20), mat('#e8284a', { roughness: 0.2 })); drop.position.set(-0.05, -0.1, 0.1); g.add(drop);
  add(g, new THREE.ConeGeometry(0.22, 0.45, 28), mat('#e8284a', { roughness: 0.2 }), [-0.05, 0.2, 0.1]);
  blob(g, mat('#ffffff', { transparent: true, opacity: 0.7 }), [-0.14, -0.05, 0.34], [0.05, 0.09, 0.03]);
  for (const [x, y, z] of [[0.4, -0.35, 0.2], [0.55, -0.35, 0.05], [0.47, -0.2, 0.15]]) box(g, mat('#ffd24a'), [x, y, z], [0.18, 0.18, 0.18], [0.3, 0.5, 0]);
  return g;
}
function brokenHeart() {
  const g = new THREE.Group(); const h = heart('#e8284a', 0.95, 0.4); g.add(h);
  const crack = new THREE.Mesh(new THREE.ExtrudeGeometry(new THREE.Shape([[0.0, 0.32], [-0.06, 0.12], [0.07, 0.02], [-0.07, -0.1], [0.04, -0.28], [0.02, -0.1], [0.12, 0.02], [-0.0, 0.12]].map(([x, y]) => new THREE.Vector2(x, y))), { depth: 0.05, bevelEnabled: false }), mat('#1a0a10'));
  crack.position.z = 0.22; g.add(crack); return g;
}
guard(() => {
  const S = makeStage({ ground: '#8fcf6a', el: 40, az: 150 }), { scene } = S;
  const xs = [1.0, 2.6, 4.2], icons = [bathroomScale(), glucose(), brokenHeart()];
  xs.forEach((x, i) => { const t = target(); t.position.set(x, 0, -2.2); scene.add(t); const ic = icons[i]; ic.position.set(x, 1.3, -1.85); ic.scale.setScalar(1.25); scene.add(ic); });
  const vs = S.num('vs', 2.2), viola = placeViola(scene, { x: -1.7, z: 0.3, scale: vs, ry: 0.35 });
  viola.userData.pose({ arms: { l: [0, 1.5, 0], r: [0, -0.9, 0] } });
  const egg = buildEgg(); egg.scale.setScalar(S.num('es', 1.55)); egg.position.set(-0.1, 0, 1.0); egg.rotation.y = 0.35; scene.add(egg);
  pointArm(egg, 'l', [1.3, 1.5, 0.5]); egg.userData.arms.r.rotation.z = -0.5;
  // bow in the viola's hand + arrow in flight
  scene.updateMatrixWorld(true);
  const hp = new THREE.Vector3(); viola.userData.parts.hands.l.getWorldPosition(hp);
  const bow = new THREE.Group(); bow.position.copy(hp); scene.add(bow);
  add(bow, new THREE.TorusGeometry(0.6, 0.04, 8, 30, Math.PI * 0.8), mat('#7a4a22'), [0, 0, 0], [0, 0, Math.PI / 2 - Math.PI * 0.4]);
  const ar = arrow(1.6); ar.position.set(hp.x + 0.1, hp.y + 0.05, hp.z); ar.rotation.z = 0.05; ar.rotation.y = 0.1; ar.scale.setScalar(1.3); scene.add(ar);
  
  finishScene(S, [viola, egg], [1.0, 1.9, 6.4], [0.9, 1.3, 0]);
});
</script></body></html>
