<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q06 — "The NOVO egg's deal with the VIOLA covers up to twenty programmes." (4x5 = 20 folders + a big 20)
import { THREE, guard, mat, add, box, cyl, blob, makeStage, finishScene, placeViola, buildEgg, pointArm, labelTexture } from './common.js';
guard(() => {
  const S = makeStage({ ground: '#d8c8a8', el: 40, az: 150, sky: { cover: 0.8 } }), { scene } = S;
  box(scene, mat('#e8eef5'), [1.2, 2, -1.5], [16, 6, 0.1]);
  // board with 20 folders
  const bx = 2.15, by = 1.75;
  box(scene, mat('#5a3a22'), [bx, by, -1.2], [3.6, 3.0, 0.1]);
  box(scene, mat('#f3ead6'), [bx, by, -1.14], [3.4, 2.8, 0.04]);
  const cols = ['#e8284a', '#2a7fff', '#27c06a', '#ffa030', '#9a5aff'];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) {
    const x = bx + (c - 2) * 0.64, y = by + (1.5 - r) * 0.64 - 0.1, g = new THREE.Group(); g.position.set(x, y, -1.08); scene.add(g);
    box(g, mat(cols[(c + r) % 5]), [0, 0, 0], [0.52, 0.5, 0.05]); box(g, mat(cols[(c + r) % 5]), [-0.1, 0.27, 0], [0.22, 0.05, 0.05]);
    box(g, mat('#ffffff'), [0, -0.02, 0.03], [0.34, 0.2, 0.01]); box(g, mat('#2b2b30'), [0, 0.04, 0.04], [0.26, 0.025, 0.01]); box(g, mat('#2b2b30'), [0, -0.04, 0.04], [0.2, 0.025, 0.01]);
  }
  const badge = add(scene, new THREE.CylinderGeometry(0.55, 0.55, 0.1, 40), mat('#1d3fb0'), [bx + 0.0, by + 1.75, -1.0], [Math.PI / 2, 0, 0]);
  add(scene, new THREE.CircleGeometry(0.5, 40), new THREE.MeshBasicMaterial({ map: labelTexture('20', '#1d3fb0', '#ffffff', 512, 'bold 330px sans-serif') }), [bx, by + 1.75, -0.945]);
  const vs = S.num('vs', 2.15), viola = placeViola(scene, { x: -2.25, scale: vs, ry: 0.35 });
  const egg = buildEgg(); egg.scale.setScalar(S.num('es', 1.8)); egg.position.set(-0.2, 0, 0.3); egg.rotation.y = 0.15; scene.add(egg);
  viola.userData.pose({ arms: { l: [0, 0.9, 0], r: [0, -0.5, 0] } });
  pointArm(egg, 'l', [1.4, 1.9, -0.5]); egg.userData.arms.r.rotation.z = -0.5;
  finishScene(S, [viola, egg], [0.3, 1.9, 6.4], [0.2, 1.6, 0], false);
});
