<!doctype html>
<html><head><meta charset="utf-8"><title>Valo q03 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q03 — "An OPAL is set in the VIOLA's body: its drug-discovery platform."
import { THREE, guard, mat, add, box, cyl, blob, makeStage, finishScene, placeViola, canvasTexture } from './common.js';

export function opalTexture() {
  return canvasTexture(512, (ctx, s) => {
    ctx.fillStyle = '#f4f0ff'; ctx.fillRect(0, 0, s, s);
    const cols = ['#27d6a0', '#2a7fff', '#ff5fa8', '#ffa030', '#9a5aff', '#41e8ff'];
    for (let i = 0; i < 60; i++) { const x = (i * 97 % 100) / 100 * s, y = (i * 53 % 100) / 100 * s, r = 30 + (i * 31 % 70);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, cols[i % 6] + 'dd'); g.addColorStop(1, cols[i % 6] + '00'); ctx.fillStyle = g; ctx.fillRect(0, 0, s, s); }
  });
}
export function buildOpal(r = 0.14) {
  const g = new THREE.Group();
  const stone = add(g, new THREE.SphereGeometry(1, 40, 24), new THREE.MeshStandardMaterial({ map: opalTexture(), emissiveMap: opalTexture(), emissive: '#ffffff', emissiveIntensity: 0.45, roughness: 0.25 }), [0, 0, 0], [0, 0, 0], [r, r * 1.2, r * 0.55]);
  const gold = mat('#f6c21c', { metalness: 0.7, roughness: 0.3 });
  add(g, new THREE.TorusGeometry(r * 1.02, r * 0.14, 12, 40), gold, [0, 0, -r * 0.02], [0, 0, 0], [1, 1.2, 1]);
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; blob(g, gold, [Math.cos(a) * r * 1.12, Math.sin(a) * r * 1.35, r * 0.05], [r * 0.12, r * 0.12, r * 0.12]); }
  return g;
}
export function sparkle(parent, x, y, z, s = 0.1, color = '#fffbd0') {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  const m = new THREE.MeshBasicMaterial({ color });
  for (const r of [0, Math.PI / 2]) { const t = new THREE.Mesh(new THREE.ConeGeometry(s * 0.18, s, 4), m); t.rotation.z = r; g.add(t); const u = new THREE.Mesh(new THREE.ConeGeometry(s * 0.18, s, 4), m); u.rotation.z = r + Math.PI; u.position.y = 0; g.add(u); }
  return g;
}

guard(() => {
  const S = makeStage({ ground: '#f0d9b0', el: 40, az: 150, sky: { cover: 0.6 } }), { scene } = S;
  box(scene, mat('#4a2f8a'), [0, 1.8, -2.4], [16, 5, 0.1]);
  for (let i = -3; i <= 3; i++) cyl(scene, mat('#5a3aa0'), [i * 2.2, 1.8, -2.3], 0.28, 5);
  const viola = placeViola(scene, { x: 0, z: 0, scale: S.num('vs', 1.85) });
  viola.userData.pose({ arms: { l: [0, 0.9, 0] } });
  viola.userData.reach('r', [-0.075, 0.36, 0.17]);
  const opal = buildOpal(0.092); opal.position.set(0, 0.325 * viola.scale.x, 0.125 * viola.scale.x); opal.scale.setScalar(viola.scale.x); opal.position.set(0, 0.335 * 1.85, 0.135 * 1.85); scene.add(opal);
  for (const [x, y, z, s] of [[0.5, 0.75, 0.4, 0.2], [-0.5, 0.45, 0.4, 0.15], [0.3, 0.3, 0.45, 0.12], [-0.2, 0.9, 0.35, 0.1]]) sparkle(scene, x, y, z + 0.1, s);
  // jeweller's tray with loose opals and a loupe
  box(scene, mat('#7a1f5a'), [1.7, 0.08, 0.5], [1.1, 0.16, 0.7]);
  for (const [x, z] of [[1.45, 0.4], [1.75, 0.6], [1.95, 0.35]]) { const o = buildOpal(0.07); o.position.set(x, 0.24, z); o.rotation.x = -1.0; scene.add(o); }
  cyl(scene, mat('#2b2b30'), [-1.9, 0.3, 0.6], 0.03, 0.6, [0, 0, 0.5]); add(scene, new THREE.TorusGeometry(0.2, 0.03, 8, 28), mat('#c9a040', { metalness: 0.7 }), [-1.75, 0.65, 0.6]);
  add(scene, new THREE.CircleGeometry(0.19, 28), new THREE.MeshStandardMaterial({ color: '#cfe8ff', transparent: true, opacity: 0.4 }), [-1.75, 0.65, 0.6]);
  finishScene(S, [viola], [0.0, 1.2, 4.9], [0.0, 1.0, 0], false);
});
</script></body></html>
