<!doctype html>
<html><head><meta charset="utf-8"><title>Valo q02 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — "A BERRY (David Berry) plants a flag on the VIOLA and wears its CEO crown."
import { THREE, guard, mat, add, box, cyl, blob, disc, eyes, smile, makeStage, finishScene, createViola, pointArm, buildCrown, canvasTexture } from './common.js';

function buildBerry() {
  const g = new THREE.Group(), R = 0.36, cy = 0.5;
  const red = mat('#d6203f', { roughness: 0.4 }), light = mat('#ee3a58', { roughness: 0.4 });
  blob(g, red, [0, cy, 0], [R, R * 1.05, R]);
  const N = 70, ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, rr = Math.sqrt(1 - y * y), th = i * ga, d = new THREE.Vector3(Math.cos(th) * rr, y, Math.sin(th) * rr);
    if (d.dot(new THREE.Vector3(0, 0.1, 1)) > 0.62 || y < -0.8) continue;
    blob(g, light, [d.x * R * 0.96, cy + d.y * R, d.z * R * 0.96], [0.07, 0.07, 0.07]);
  }
  const zf = (x, y) => Math.sqrt(Math.max(0.01, R * R - x * x - (y - cy) ** 2 / 1.1)) ;
  for (const s of [-1, 1]) { const e = new THREE.Group(); e.position.set(s * 0.12, cy + 0.06, zf(s * 0.12, cy + 0.06) + 0.01); e.rotation.y = s * 0.35; g.add(e); eyes(e, { y: 0, z: 0, dx: 0, rw: 0.065, rh: 0.085, iris: '#7a2a1a' });
    const b = disc(g, '#ff9fb0', s * 0.23, cy - 0.06, zf(s * 0.23, cy - 0.06) + 0.008, 0.045, 0.025); b.rotation.y = s * 0.6; }
  smile(g, 0, cy - 0.12, zf(0, cy - 0.12) + 0.012, 0.05);
  // green calyx
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; add(g, new THREE.ConeGeometry(0.07, 0.24, 8), mat('#3fa04a'), [Math.cos(a) * 0.14, cy + R * 1.02, Math.sin(a) * 0.14], [Math.sin(a) * 1.0, 0, -Math.cos(a) * 1.0]); }
  const crown = buildCrown(0.2); crown.position.set(0, cy + R * 1.0 + 0.05, 0); crown.rotation.z = 0.1; g.add(crown);
  const arms = {};
  for (const [k, s] of [['l', 1], ['r', -1]]) {
    const sh = new THREE.Group(); sh.position.set(s * R * 0.95, cy - 0.02, 0); g.add(sh);
    cyl(sh, red, [0, -0.17, 0], 0.035, 0.36); blob(sh, mat('#ffffff'), [0, -0.37, 0], [0.06, 0.065, 0.06]);
    sh.rotation.z = s * 0.4; arms[k] = sh;
    cyl(g, red, [s * 0.12, 0.09, 0], 0.04, 0.2); blob(g, mat('#2a7a3a'), [s * 0.12, 0.03, 0.05], [0.08, 0.045, 0.11]);
  }
  g.userData.arms = arms; return g;
}

guard(() => {
  const S = makeStage({ ground: '#7cb84a', el: 38, az: 150 }), { scene } = S;
  const vs = S.num('vs', 1.55), viola = createViola({ scale: vs }); scene.add(viola);
  viola.userData.pose({ arms: { l: [0, 1.2, 0], r: [0, -0.6, 0] } });
  const top = 1.13 * vs - 0.02;
  const berry = buildBerry(); berry.scale.setScalar(S.num('bs', 1.0)); berry.position.set(-0.05, top, 0.0); scene.add(berry);
  const pole = new THREE.Group(); pole.position.set(0.3, top - 0.1, 0.0); scene.add(pole);
  cyl(pole, mat('#e8e0d0', { metalness: 0.4 }), [0, 0.65, 0], 0.025, 1.3); blob(pole, mat('#f6c21c'), [0, 1.32, 0], [0.06, 0.06, 0.06]);
  const flagTex = canvasTexture(256, (ctx, s) => { ctx.fillStyle = '#1d5fd0'; ctx.fillRect(0, 0, s, s); ctx.fillStyle = '#ffffff'; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 40 : 100; ctx.lineTo(s / 2 + Math.cos(a) * r, s / 2 + Math.sin(a) * r); } ctx.fill(); });
  add(pole, new THREE.PlaneGeometry(1.0, 0.7), new THREE.MeshStandardMaterial({ map: flagTex, side: THREE.DoubleSide, roughness: 0.8 }), [0.52, 1.0, 0]);
  berry.updateMatrixWorld(true);
  pointArm(berry, 'l', [0.3, top + 0.45, 0.0]);
  berry.userData.arms.r.rotation.z = -1.6;
  finishScene(S, [viola, berry], [0.3, 1.6, 5.2], [0.3, 1.55, 0]);
});
</script></body></html>
