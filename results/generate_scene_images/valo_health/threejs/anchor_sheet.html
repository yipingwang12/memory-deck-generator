<!doctype html>
<html><head><meta charset="utf-8"><title>Valo viola anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createViola } from './viola.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 } });
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#8fc45a', roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; stage.scene.add(g);
  [[-0.85, 0], [0, 0.7], [0.85, -1.5707]].forEach(([x, ry], i) => {
    const v = createViola({ scale: 1.15 }); v.position.set(x, 0, 0); v.rotation.y = ry; stage.scene.add(v);
    if (i === 1) v.userData.pose({ tilt: 0.05, arms: { l: [0, 0.9, -0.3], r: [0, -0.5, 0] } });
  });
  const all = new Set(); stage.scene.traverse((o) => { if (o !== g) all.add(o); });
  stage.toonify(stage.scene, (m) => all.has(m) && m !== g);
  stage.camera.position.set(0, 0.8, 4.4); stage.camera.lookAt(0, 0.65, 0);
  stage.finish();
});
</script></body></html>
