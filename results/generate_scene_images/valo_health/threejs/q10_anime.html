<!doctype html>
<html><head><meta charset="utf-8"><title>Valo q10 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q10 — "A COACH (Koch Disruptive Technologies) puts a bag of money in the VIOLA's case."
import { THREE, guard, mat, add, box, cyl, blob, makeStage, finishScene, placeViola, buildPerson, buildCase, moneyBag, pointArm, coin } from './common.js';
guard(() => {
  const S = makeStage({ ground: '#7dbf4a', el: 40, az: 150, sky: { cover: 1.2 } }), { scene } = S;
  // sports field lines + goal post
  for (const z of [-2.6]) box(scene, mat('#ffffff'), [0, 0.004, z], [20, 0.01, 0.12]);
  for (const x of [-3.2, 3.2]) cyl(scene, mat('#ffffff'), [x, 1.0, -3.0], 0.05, 2.0);
  box(scene, mat('#ffffff'), [0, 2.0, -3.0], [6.5, 0.1, 0.1]);
  const vs = S.num('vs', 1.8), viola = placeViola(scene, { x: -1.75, z: 0.1, scale: vs, ry: 0.3, pose: { arms: { l: [0, 1.0, 0], r: [0, -0.5, 0] } } });
  const cs = buildCase(); cs.position.set(0.3, 0, 0.6); cs.scale.setScalar(1.15); cs.rotation.y = 0.1; scene.add(cs);
  const coach = buildPerson('coach'); coach.scale.setScalar(S.num('cs', 1.3)); coach.position.set(1.9, 0, 0.5); coach.rotation.y = -0.35; scene.add(coach);
  const bagPos = [0.55, 1.15, 0.7];
  pointArm(coach, 'r', [bagPos[0] + 0.15, bagPos[1] + 0.3, bagPos[2]]);
  const sh = coach.userData.arms.r; coach.updateMatrixWorld(true);
  const hand = sh.localToWorld(new THREE.Vector3(0, -0.5, 0));
  pointArm(coach, 'l', [2.6, 0.8, 0.9]);
  const bag = moneyBag(0.3); bag.scale.setScalar(1.2); bag.position.set(hand.x - 0.05, hand.y - 0.9, hand.z); scene.add(bag);
  for (const [x, y, z] of [[0.1, 0.25, 0.6], [0.4, 0.22, 0.7], [0.6, 0.24, 0.55]]) coin(scene, x, y, z, 0.1, [Math.PI / 2 + 0.3, 0.4, 0]);
  // football at coach's feet
  blob(scene, mat('#ffffff'), [2.9, 0.24, 1.2], [0.24, 0.24, 0.24]); for (const [x, y, z] of [[0, 1, 0], [0.9, 0.3, 0.3], [-0.8, 0.3, 0.5], [0.2, 0.2, 1]]) { const d = new THREE.Vector3(x, y, z).normalize().multiplyScalar(0.235); blob(scene, mat('#1a1a1a'), [2.9 + d.x, 0.24 + d.y, 1.2 + d.z], [0.08, 0.08, 0.08]); }
  finishScene(S, [viola, coach], [0.6, 1.5, 6.2], [0.5, 1.15, 0]);
});
</script></body></html>
