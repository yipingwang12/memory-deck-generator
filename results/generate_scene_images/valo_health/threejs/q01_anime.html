<!doctype html>
<html><head><meta charset="utf-8"><title>Valo q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — "The ADMIRAL tunes the VIOLA." (harbour dock, admiral turns a peg)
import { THREE, guard, mat, add, box, cyl, blob, makeStage, finishScene, placeViola, buildPerson, pointArm, buildShip } from './common.js';
guard(() => {
  const S = makeStage({ ground: '#2f8ccf', el: 30, az: 140, sky: { cover: 1.5 } }), { scene } = S;
  // dock
  add(scene, new THREE.BoxGeometry(9, 0.2, 3.6), mat('#a97a4c'), [0, -0.1, 0.4]);
  for (let i = -4; i <= 4; i++) box(scene, mat('#6e4a2a'), [i * 1.0, 0.002, 0.4], [0.03, 0.01, 3.6]);
  for (const x of [-3.6, 3.6]) cyl(scene, mat('#5a3a20'), [x, 0.2, -1.2], 0.1, 0.8);
  const ship = buildShip(); ship.position.set(3.2, 0, -6); ship.scale.setScalar(1.5); scene.add(ship);
  const ship2 = buildShip(); ship2.position.set(-5, 0, -11); ship2.rotation.y = 0.2; ship2.scale.setScalar(1.8); scene.add(ship2);

  const viola = placeViola(scene, { x: 0.55, z: 0, scale: S.num('vs', 1.5), ry: -0.25, pose: { arms: { r: [0, -0.35, 0], l: [0, 0.6, 0] } } });
  const adm = buildPerson('admiral'); adm.scale.setScalar(S.num('as', 1.2)); adm.position.set(-0.5, 0, 0.1); adm.rotation.y = 0.35; scene.add(adm);
  // tuning peg is on the viola's scroll, left side of the picture
  const peg = new THREE.Vector3(0.55 - 0.1 * 1.5, 1.7, 0.1);
  pointArm(adm, 'l', peg.toArray());
  adm.userData.arms.r.rotation.set(-1.3, 0, -0.25);
  // gold tuning fork in the right hand
  adm.updateMatrixWorld(true);
  const fork = new THREE.Group(); const silver = mat('#e6eaf0', { metalness: 0.8, roughness: 0.25 });
  cyl(fork, silver, [0, 0.0, 0], 0.012, 0.16); for (const s of [-1, 1]) box(fork, silver, [s * 0.022, 0.15, 0], [0.012, 0.16, 0.012]);
  fork.position.set(0, -0.48, 0.05); fork.rotation.z = 0.0; adm.userData.arms.r.add(fork);
  // music notes
  for (const [x, y, z] of [[1.5, 1.7, 0.3], [1.2, 2.0, 0.2], [-0.9, 2.2, 0.2]]) { blob(scene, mat('#ffe27a', { emissive: '#ffd040', emissiveIntensity: 0.6 }), [x, y, z], [0.07, 0.055, 0.04], [0, 0, 0.4]); cyl(scene, mat('#ffe27a'), [x + 0.06, y + 0.12, z], 0.01, 0.24); }
  finishScene(S, [viola, adm], [0.1, 1.2, 4.6], [0.0, 0.95, 0]);
});
</script></body></html>
