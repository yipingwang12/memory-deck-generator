<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q03 — A DIVER heading WEST builds the SQUID's tank.
import * as K from './common.js';
Object.assign(globalThis, K);
const put = (S, o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.multiplyScalar(s); S.add(o); return o; };
const screen = (w, h, draw) => { const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w); draw(c.getContext('2d'), c.width, c.height); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t })); };
const note = (S, x, y, z, col = '#2a2a3a', s = 1) => { const g = grp(S, [x, y, z]); blob(g, mat(col), [0, 0, 0], [0.07 * s, 0.05 * s, 0.03 * s], [0, 0, 0.4]); cyl(g, mat(col), 0.01 * s, 0.01 * s, 0.25 * s, [0.06 * s, 0.12 * s, 0]); box(g, mat(col), [0.1 * s, 0.04 * s, 0.01], [0.1 * s, 0.24 * s, 0]); };
guard(() => {

const C = makeScene({ ground: '#d8c79a', fov: 38 }), S = C.scene;
const tk = grp(S, [-1.3, 0, 0]); tk.scale.set(1, 1.3, 1);
add(tk, new THREE.BoxGeometry(2.0, 1.5, 0.03), glass('#bfe9ff', 0.3), [0, 0.8, -0.6]); for (const x of [-1, 1]) add(tk, new THREE.BoxGeometry(0.03, 1.5, 1.2), glass('#bfe9ff', 0.3), [x, 0.8, 0]); add(tk, new THREE.BoxGeometry(1.95, 0.03, 1.15), mat('#3fa7e6', { transparent: true, opacity: 0.45, depthWrite: false }), [0, 0.95, 0]);
box(tk, mat('#8a929c'), [2.15, 0.1, 1.35], [0, 0.04, 0]); for (const x of [-1, 1]) for (const z of [-0.6, 0.6]) box(tk, mat('#8a929c'), [0.08, 1.55, 0.08], [x * 1.0, 0.8, z]);
box(tk, mat('#8a929c'), [2.1, 0.08, 1.3], [0, 1.58, 0]);
const q = addSquid(C, { x: -1.3, y: 0.14, z: 0, s: 1.25, ry: 0.2 });
for (let i = 0; i < 5; i++) for (let j = 0; j < 2 - (i > 2 ? 1 : 0); j++) box(S, mat(['#c4553a', '#b84a30'][(i + j) % 2]), [0.4, 0.2, 0.2], [0.1 + (i % 2) * 0.2 + 0, 0.1 + 0.2 * j, 0.7 - i * 0.0 + 0.0]).position.x = -0.3 + i * 0.0;
const dv = grp(S, [0.6, 0, 0.5], [0, -0.2, 0]); dv.scale.setScalar(1.7);
const d = human({ shirt: '#1d6fb8', pants: '#1d6fb8', skin: '#ffd9bd', hair: '#2a1a10' }); dv.add(d);
for (const x of [-0.075, 0.075]) box(dv, mat('#f08a24'), [0.11, 0.03, 0.34], [x, 0.015, 0.1]);
cyl(dv, mat('#f08a24', { metalness: 0.4 }), 0.1, 0.1, 0.5, [0, 0.62, -0.2]); cyl(dv, mat('#444'), 0.015, 0.015, 0.2, [0.12, 0.85, -0.2]);
for (const x of [-0.075, 0.075]) add(dv, new THREE.TorusGeometry(0.065, 0.017, 8, 20), mat('#222a36'), [x, 0.85, 0.185]); add(dv, new THREE.TorusGeometry(0.2, 0.02, 8, 28), mat('#222a36'), [0, 0.88, 0], [Math.PI / 2, 0, 0]); const helm = grp(dv);
d.userData.armR.rotation.set(-1.9, 0, -0.3); box(d.userData.armR, mat('#c4553a'), [0.14, 0.08, 0.08], [0, -0.38, 0.05]);
toon(C, dv); C.chars.delete(helm); 
const sp = grp(S, [2.15, 0, 0.3]); cyl(sp, mat('#6b4a2a'), 0.05, 0.05, 2.0, [0, 1.0, 0]);
const pl = grp(sp, [-0.5, 1.75, 0.06]); box(pl, mat('#f2e2b0'), [1.3, 0.42, 0.06]); add(pl, new THREE.ConeGeometry(0.21, 0.35, 3), mat('#f2e2b0'), [-0.78, 0, 0], [0, 0, Math.PI / 2], [1, 1, 0.3]);
const lw = label('WEST', { w: 1.1, h: 0.34, bg: '#f2e2b0', fg: '#b3261e', size: 0.7 }); lw.position.set(0.05, 0, 0.04); pl.add(lw);
finish(C, { pos: [0, 1.2, 5.2], look: [0, 0.85, 0] });

});
