<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q02 — The SQUID swims in WATER at two-fifty Water Street.
import * as K from './common.js';
Object.assign(globalThis, K);
const put = (S, o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.multiplyScalar(s); S.add(o); return o; };
const screen = (w, h, draw) => { const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w); draw(c.getContext('2d'), c.width, c.height); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t })); };
const note = (S, x, y, z, col = '#2a2a3a', s = 1) => { const g = grp(S, [x, y, z]); blob(g, mat(col), [0, 0, 0], [0.07 * s, 0.05 * s, 0.03 * s], [0, 0, 0.4]); cyl(g, mat(col), 0.01 * s, 0.01 * s, 0.25 * s, [0.06 * s, 0.12 * s, 0]); box(g, mat(col), [0.1 * s, 0.04 * s, 0.01], [0.1 * s, 0.24 * s, 0]); };
guard(() => {

const C = makeScene({ ground: '#e3d2a8', fov: 36 }), S = C.scene;
put(S, water({ w: 4.8, d: 2.6, h: 0.6 }), 0, 0, -0.2);
const q = addSquid(C, { x: -0.4, y: 0.35, z: 0, s: 1.7, ry: 0.15, lean: 0.05 }); reachW(q, 'l', [0.9, 1.5, 0.4]);
for (const [x, z, r] of [[-0.4, 0.3, 0.8], [-0.4, 0.3, 1.1], [1.6, 0.4, 0.3], [-1.9, 0.2, 0.25]]) add(S, new THREE.TorusGeometry(r, 0.012, 6, 48), mat('#ffffff'), [x, 0.62, z], [Math.PI / 2, 0, 0]);
for (const [x, y, z, r] of [[1.0, 1.7, 0.4, 0.07], [1.15, 1.45, 0.4, 0.05], [0.8, 1.9, 0.3, 0.05]]) blob(S, mat('#7cc8ff', { transparent: true, opacity: 0.8 }), [x, y, z], [r, r * 1.3, r]);
add(S, new THREE.CylinderGeometry(0.04, 0.04, 3.2, 12), mat('#555'), [1.6, 1.6, -1.0]);
const s1 = label('WATER ST', { w: 1.7, h: 0.48, bg: '#1f7a4a', fg: '#ffffff', size: 0.52, border: '#ffffff' }); s1.position.set(1.6, 2.7, -0.95); S.add(s1);
const s2 = label('250', { w: 1.1, h: 0.6, bg: '#ffffff', fg: '#1d2a44', size: 0.8, border: '#1d2a44' }); s2.position.set(1.6, 2.1, -0.95); S.add(s2);
finish(C, { pos: [0, 1.5, 5.0], look: [0, 1.15, 0] });

});
