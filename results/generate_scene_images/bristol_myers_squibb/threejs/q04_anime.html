<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q04 — The SQUID pulls in staff from the MIT DOME and from an ALE-drinking WIFE.
import * as K from './common.js';
Object.assign(globalThis, K);
const put = (S, o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.multiplyScalar(s); S.add(o); return o; };
const screen = (w, h, draw) => { const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w); draw(c.getContext('2d'), c.width, c.height); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t })); };
const note = (S, x, y, z, col = '#2a2a3a', s = 1) => { const g = grp(S, [x, y, z]); blob(g, mat(col), [0, 0, 0], [0.07 * s, 0.05 * s, 0.03 * s], [0, 0, 0.4]); cyl(g, mat(col), 0.01 * s, 0.01 * s, 0.25 * s, [0.06 * s, 0.12 * s, 0]); box(g, mat(col), [0.1 * s, 0.04 * s, 0.01], [0.1 * s, 0.24 * s, 0]); };
guard(() => {

const C = makeScene({ ground: '#8fbf6a', fov: 38 }), S = C.scene;
const dm = put(S, dome(), -1.75, 0, -0.8, 0.25, 0.62);
const mit = label('MIT', { w: 0.9, h: 0.3, bg: '#e8e2d4', fg: '#8a1f2b', size: 0.8 }); mit.position.set(0, 1.9, 0.62); dm.add(mit);
const q = addSquid(C, { x: 0.05, z: 0.4, s: 1.4, ry: 0.0 });
const st = human({ shirt: '#c75a3a', pants: '#35405e', hair: '#222' }); put(S, st, -1.0, 0, 0.9, 0.6, 0.9); toon(C, st);
box(st, mat('#fff'), [0.1, 0.13, 0.02], [0.1, 0.6, 0.15]);
const w = human({ shirt: '#e0a02a', dress: true, hair: '#7a3a1a', hairLong: true, iris: '#2f8a5a' }); put(S, w, 1.8, 0, 0.5, -0.4, 1.5); toon(C, w);
const arm = w.userData.armL; arm.rotation.set(-1.6, 0, 0.25);
const mg = grp(arm, [0, -0.36, 0.02], [1.6, 0, 0]); mg.scale.setScalar(1.3);
cyl(mg, mat('#e8a21c', { roughness: 0.3 }), 0.1, 0.1, 0.24, [0, 0.1, 0]); cyl(mg, mat('#fff6df'), 0.108, 0.1, 0.07, [0, 0.24, 0]); blob(mg, mat('#fff6df'), [0, 0.28, 0], [0.1, 0.05, 0.1]);
add(mg, new THREE.TorusGeometry(0.07, 0.018, 8, 16), mat('#e8a21c'), [0.12, 0.1, 0], [0, 0, 0]);
reachW(q, 'r', [-1.0, 0.55, 1.1]); reachW(q, 'l', [1.35, 0.9, 0.9]);
finish(C, { pos: [0, 1.25, 5.0], look: [0, 0.9, 0] });

});
