<script type="module">
// q01 — The SQUID crosses the road at Cambridge CROSSING.
import * as K from './common.js';
Object.assign(globalThis, K);
const put = (S, o, x, y, z, ry = 0, s = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.scale.multiplyScalar(s); S.add(o); return o; };
const screen = (w, h, draw) => { const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w); draw(c.getContext('2d'), c.width, c.height); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t })); };
const note = (S, x, y, z, col = '#2a2a3a', s = 1) => { const g = grp(S, [x, y, z]); blob(g, mat(col), [0, 0, 0], [0.07 * s, 0.05 * s, 0.03 * s], [0, 0, 0.4]); cyl(g, mat(col), 0.01 * s, 0.01 * s, 0.25 * s, [0.06 * s, 0.12 * s, 0]); box(g, mat(col), [0.1 * s, 0.04 * s, 0.01], [0.1 * s, 0.24 * s, 0]); };
guard(() => {

const C = makeScene({ ground: '#8fbf6a', fov: 36 }), S = C.scene;
add(S, new THREE.PlaneGeometry(4.2, 80), mat('#4a4d57', { roughness: 1 }), [0, 0.004, -20], [-Math.PI / 2, 0, 0]);
for (const x of [-1, 1]) add(S, new THREE.PlaneGeometry(1.3, 80), mat('#cfc9ba', { roughness: 1 }), [x * 2.75, 0.006, -20], [-Math.PI / 2, 0, 0]);
for (let i = 0; i < 10; i++) box(S, mat('#f6f6f0'), [0.26, 0.01, 1.7], [-1.85 + i * 0.41, 0.012, 0.0]);
for (let i = 0; i < 6; i++) box(S, mat('#e8c53a'), [0.08, 0.01, 0.9], [0, 0.012, -2 - i * 2.2]);
const pole = cyl(S, mat('#555'), 0.04, 0.04, 2.2, [-1.6, 1.1, -0.45]);
const sg = grp(S, [-1.6, 1.95, -0.3]); box(sg, mat('#f2c230'), [1.9, 0.62, 0.05], [0, 0, -0.01]); const lb = label('CROSSING', { w: 1.8, h: 0.52, bg: '#f2c230', fg: '#1a1a1a', size: 0.5 }); lb.position.z = 0.02; sg.add(lb);
put(S, car(), -0.9, 0, -2.6, -Math.PI / 2, 1.0);
const q = addSquid(C, { x: 0.35, z: 0.3, ry: 0.9, s: 1.5, lean: 0.1 }); reachW(q, 'l', [1.6, 1.5, 0.3]);
finish(C, { pos: [0.2, 1.3, 4.9], look: [0, 0.8, 0] });

});
