<!doctype html>
<html><head><meta charset="utf-8"><title>Scholar Rock anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { guard, makeScene, wrapUp } from './common.js';
import { createMortarboard } from './mortarboard.js';

guard(() => {
  const { stage, scene, num } = makeScene({ ground: '#f1d9b0', fov: 28, sky: { cover: 0.02, puffCover: 0.02, towerTop: 0.02 } });
  const chars = [];
  for (const [x, ry, reach] of [[-1.3, 0, 0], [-0.45, 0.8, 0], [0.45, Math.PI / 2, 0], [1.3, -0.45, 1]]) {
    const m = createMortarboard(); m.position.x = x; m.rotation.y = ry;
    if (reach) { m.userData.pose({ tilt: 0.05 }); m.userData.reach('l', [0.4, 0.75, 0.3]); }
    scene.add(m); chars.push(m);
  }
  wrapUp(stage, num, chars, [0, 0.8, 5.2], [0, 0.45, 0], false);
});
</script></body></html>
