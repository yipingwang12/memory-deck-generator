<!doctype html>
<html><head><meta charset="utf-8"><title>Scholar Rock q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — "The FDA's letter blames the MORTARBOARD's vial-filling factory: fill-finish manufacturing observations."
import { THREE, guard, mat, add, box, cyl, blob, sign, makeScene, wrapUp } from './common.js';
import { createMortarboard } from './mortarboard.js';

function vial(parent, x, y, z, fill) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  cyl(g, new THREE.MeshStandardMaterial({ color: '#cfeeff', transparent: true, opacity: 0.55, roughness: 0.1 }), [0, 0.14, 0], 0.07, 0.28);
  if (fill) cyl(g, mat('#4fb8ff'), [0, 0.09, 0], 0.06, 0.16);
  cyl(g, mat('#d6443a'), [0, 0.3, 0], 0.055, 0.05);
  return g;
}

guard(() => {
  const { stage, scene, num } = makeScene({ ground: '#b9bfc7' });
  // factory
  const f = new THREE.Group(); f.position.set(0.9, 0, -1.8); scene.add(f);
  box(f, mat('#c9674a'), [0, 1.2, 0], [5.4, 2.4, 1.6]);
  box(f, mat('#6d7480'), [0, 2.5, 0], [5.6, 0.2, 1.8]);
  for (const x of [-1.9, -0.3, 1.3]) add(f, new THREE.CylinderGeometry(0.22, 0.28, 1.7), mat('#a8553d'), [x, 3.3, -0.2]);
  for (const x of [-1.9, -0.3, 1.3]) blob(f, mat('#f1f1f4'), [x + 0.1, 4.4, -0.2], [0.45, 0.3, 0.35]);
  const fs = sign('VIALS', 1.8, 0.5, { bg: '#2b3a55', fg: '#ffffff', border: '#ffffff' }); fs.position.set(0, 1.95, 0.82); f.add(fs);
  // conveyor with vials + filling nozzles
  box(scene, mat('#3a3f4a'), [1.2, 0.35, 0.6], [5.2, 0.2, 0.9]);
  for (let i = 0; i < 9; i++) vial(scene, -1.1 + i * 0.6, 0.45, 0.6, i > 3);
  box(scene, mat('#7d8aa0'), [1.1, 1.3, 0.35], [2.8, 0.18, 0.3]);
  for (const x of [0.1, 0.7, 1.3]) { cyl(scene, mat('#9aa6bb', { metalness: 0.6 }), [x + 0.8 - 0.3, 1.0, 0.35], 0.04, 0.5); cyl(scene, mat('#4fb8ff'), [x + 0.5, 0.7, 0.35], 0.015, 0.12); }
  // the FDA letter, blaming the factory
  const letter = new THREE.Group(); letter.position.set(-1.35, 2.1, 1.3); letter.rotation.set(0, 0.2, 0.06); scene.add(letter);
  box(letter, mat('#fffdf4'), [0, 0, 0], [1.5, 1.0, 0.04]);
  const fda = sign('FDA', 1.2, 0.45, { bg: '#fffdf4', fg: '#18356b', border: null }); fda.position.set(0, 0.22, 0.025); letter.add(fda);
  for (const y of [-0.1, -0.22, -0.34]) box(letter, mat('#8a8f9a'), [0, y, 0.025], [1.1, 0.04, 0.005]);
  const warn = sign('!', 0.34, 0.4, { bg: '#e0302a', fg: '#ffffff', border: null }); warn.position.set(0.55, -0.25, 0.03); letter.add(warn);

  const m = createMortarboard({ scale: 1.9 }); m.position.set(-2.4, 0, 1.4); m.rotation.y = 0.5; scene.add(m);
  m.userData.pose({ tilt: -0.08, arms: { r: [0, 0.35, 0] }, legs: { l: [0.2, 0], r: [-0.2, 0] } });
  scene.updateMatrixWorld(true);
  const t = m.worldToLocal(letter.localToWorld(new THREE.Vector3(-0.7, -0.3, 0.05))); m.userData.reach('l', [t.x, t.y, t.z]);
  const t2 = m.worldToLocal(letter.localToWorld(new THREE.Vector3(-0.7, 0.3, 0.05))); m.userData.reach('r', [t2.x, t2.y, t2.z]);
  wrapUp(stage, num, [m], [0.3, 2.3, 8.0], [0.3, 1.9, 0]);
});
</script></body></html>
