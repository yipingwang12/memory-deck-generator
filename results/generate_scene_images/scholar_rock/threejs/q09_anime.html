<!doctype html>
<html><head><meta charset="utf-8"><title>Scholar Rock q09</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q09 — "In Europe, the MORTARBOARD's APE TIGER is I-ASSEMBLED (Isembyld)."
import { THREE, guard, mat, add, box, cyl, blob, makeScene, wrapUp } from './common.js';
import { createMortarboard } from './mortarboard.js';
import { createApeTiger } from './apetiger.js';

function euFlag() {
  const c = document.createElement('canvas'); c.width = 768; c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#1f4ea8'; x.fillRect(0, 0, 768, 512); x.fillStyle = '#ffd400';
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2, cx = 384 + Math.sin(a) * 160, cy = 256 - Math.cos(a) * 160;
    x.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 14 : 34, b = k / 10 * Math.PI * 2; x.lineTo(cx + Math.sin(b) * r, cy - Math.cos(b) * r); } x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.6), new THREE.MeshStandardMaterial({ map: t, roughness: 0.8, side: THREE.DoubleSide }));
}

guard(() => {
  const { stage, scene, num } = makeScene({ ground: '#c8b48a' });
  // EU flag on a pole
  cyl(scene, mat('#cfd3da', { metalness: 0.5 }), [2.9, 1.9, -1.2], 0.04, 3.8);
  const flag = euFlag(); flag.position.set(1.7, 3.0, -1.2); scene.add(flag);
  // half-assembled flat-pack shelf
  const wood = mat('#d9a566'), sh = new THREE.Group(); sh.position.set(0.9, 0, 0); scene.add(sh);
  for (const x of [-0.7, 0.7]) box(sh, wood, [x, 1.0, 0], [0.12, 2.0, 0.5]);
  for (const y of [0.1, 0.85, 1.6]) box(sh, wood, [0, y, 0], [1.5, 0.1, 0.5]);
  // loose planks + screws + instruction sheet
  box(scene, wood, [2.2, 0.8, 0.3], [0.12, 1.6, 0.5], [0, 0.3, 0.25]);
  box(scene, wood, [-1.3, 0.05, 0.9], [1.4, 0.1, 0.5], [0, 0.5, 0]);
  for (let i = 0; i < 8; i++) cyl(scene, mat('#c9ccd2', { metalness: 0.6 }), [-0.6 + i * 0.12, 0.03, 1.4 + (i % 3) * 0.08], 0.018, 0.1, [0, 0, Math.PI / 2]);
  box(scene, mat('#fffdf4'), [0.3, 0.01, 1.5], [0.7, 0.02, 0.9], [0, 0.2, 0]);
  const ape = createApeTiger({ scale: 1.4 }); ape.position.set(-1.0, 0, 0.5); ape.rotation.y = 0.55; scene.add(ape);
  const m = createMortarboard({ scale: 0.7 }); const ht = ape.userData.headTop; m.position.set(ht.x, ht.y - 0.25 * 0.7 - 0.03, ht.z);
  m.userData.pose({ arms: { l: [0, 0.9, 0], r: [0, 0.9, 0] } }); ape.add(m);
  scene.updateMatrixWorld(true);
  const L = ape.worldToLocal(new THREE.Vector3(0.45, 1.25, 0.35)); ape.userData.reach('l', [L.x, L.y, L.z]);
  const R = ape.worldToLocal(new THREE.Vector3(0.3, 1.0, 0.4)); ape.userData.reach('r', [R.x, R.y, R.z]);
  // big wrench in the left hand
  const hand = ape.userData.parts.hands.l, wr = new THREE.Group(); hand.add(wr);
  cyl(wr, mat('#9aa6bb', { metalness: 0.6 }), [0, 0.05, 0.0], 0.03, 0.7); add(wr, new THREE.TorusGeometry(0.1, 0.035, 8, 20, Math.PI * 1.6), mat('#9aa6bb', { metalness: 0.6 }), [0, 0.45, 0]);
  wr.rotation.z = 1.2; wr.position.y = -0.02;
  wrapUp(stage, num, [ape, m], [0.9, 2.0, 7.0], [0.9, 1.6, 0]);
});
</script></body></html>
