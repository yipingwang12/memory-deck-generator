<!doctype html>
<html><head><meta charset="utf-8"><title>Scholar Rock q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — "The MORTARBOARD stops a growth factor at the moment it is SWITCHED ON: the activation step."
import { THREE, guard, mat, add, box, cyl, blob, sign, makeScene, wrapUp } from './common.js';
import { createMortarboard } from './mortarboard.js';

guard(() => {
  const { stage, scene, num } = makeScene({ ground: '#78b84e' });
  const sw = new THREE.Group(); sw.position.set(1.0, 0, 0); scene.add(sw);
  cyl(sw, mat('#7d7f86'), [0, 0.5, -0.1], 0.18, 1.0);
  box(sw, mat('#f4f1ea'), [0, 1.45, 0], [1.5, 2.3, 0.16]);
  box(sw, mat('#2b2f3a'), [0, 1.45, 0.1], [0.5, 1.5, 0.08]);
  const on = sign('ON', 0.9, 0.42, { bg: '#2fbf5a', fg: '#ffffff', border: '#146b30' }); on.position.set(0, 2.37, 0.09); sw.add(on);
  const off = sign('OFF', 0.9, 0.42, { bg: '#d6443a', fg: '#ffffff', border: '#7a1a14' }); off.position.set(0, 0.55, 0.09); sw.add(off);
  const lever = new THREE.Group(); lever.position.set(0, 1.45, 0.16); lever.rotation.x = 1.0; sw.add(lever);
  box(lever, mat('#ffcc33', { metalness: 0.2 }), [0, 0.45, 0], [0.3, 0.9, 0.2]);
  blob(lever, mat('#ffcc33'), [0, 0.9, 0], [0.19, 0.1, 0.13]);
  // growth factor: a glowing sprout orb that lights when switched on
  const orb = blob(scene, mat('#9dff7a', { emissive: '#6aff3a', emissiveIntensity: 0.8 }), [2.3, 1.2, 0.3], [0.38, 0.38, 0.38]);
  cyl(scene, mat('#3c9a3c'), [2.3, 0.45, 0.3], 0.03, 0.5);
  blob(scene, mat('#58c25a'), [2.2, 0.55, 0.3], [0.16, 0.05, 0.08], [0, 0, 0.5]); blob(scene, mat('#58c25a'), [2.4, 0.62, 0.3], [0.16, 0.05, 0.08], [0, 0, -0.5]);

  const m = createMortarboard({ scale: 2.0 }); m.position.set(-0.45, 0, 1.3); m.rotation.y = 0.45; scene.add(m);
  m.userData.pose({ lean: 0.12, tilt: 0.08, arms: { r: [0, 0.3, 0] }, legs: { l: [0.3, 0], r: [-0.25, 0] } });
  scene.updateMatrixWorld(true);
  const tip = lever.localToWorld(new THREE.Vector3(0, 0.78, 0.0));
  // left hand blocks the lever; right hand held up as a stop palm
  const t = m.worldToLocal(tip.clone()); m.userData.reach('l', [t.x, t.y, t.z]);
  const p = m.worldToLocal(new THREE.Vector3(-1.1, 1.9, 2.0)); m.userData.reach('r', [p.x, p.y, p.z]);
  wrapUp(stage, num, [m], [0.5, 1.7, 6.6], [0.5, 1.3, 0]);
});
</script></body></html>
