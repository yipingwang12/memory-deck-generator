<!doctype html>
<html><head><meta charset="utf-8"><title>Scholar Rock q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — "The MORTARBOARD's big trial shines like a SAPPHIRE."
import { THREE, guard, mat, add, box, cyl, blob, makeScene, wrapUp } from './common.js';
import { createMortarboard } from './mortarboard.js';

function sapphire() {
  const pts = [[0, -0.9], [0.55, -0.1], [0.85, 0.15], [0.7, 0.45], [0.35, 0.6], [0, 0.6]].map(([x, y]) => new THREE.Vector2(x, y));
  const g = new THREE.LatheGeometry(pts, 8);
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: '#1e5cff', emissive: '#1030c0', emissiveIntensity: 0.5, roughness: 0.15, metalness: 0.2, flatShading: true }));
}
function star(parent, pos, s) {
  const m = new THREE.MeshBasicMaterial({ color: '#fffbd0' });
  for (const r of [0, Math.PI / 2]) add(parent, new THREE.ConeGeometry(0.05 * s, 0.5 * s, 4), m, pos, [0, 0, r]);
  for (const r of [0, Math.PI / 2]) add(parent, new THREE.ConeGeometry(0.05 * s, 0.5 * s, 4), m, pos, [0, 0, r + Math.PI]);
}

guard(() => {
  const { stage, scene, num } = makeScene({ ground: '#d8c9a8' });
  // pedestal + big sapphire
  cyl(scene, mat('#e9e4d8'), [0.9, 0.3, 0], 0.7, 0.6, [0, 0, 0], 0.85);
  const gem = sapphire(); gem.position.set(0.9, 1.6, 0); gem.scale.setScalar(1.25); gem.castShadow = true; scene.add(gem);
  for (const [x, y, z, s] of [[0.2, 2.9, 0.4, 1.4], [1.9, 2.6, 0.4, 1.0], [1.7, 1.2, 0.8, 0.8], [0.0, 1.4, 0.9, 0.7], [0.9, 3.2, 0.2, 0.7]]) star(scene, [x, y, z], s);
  // the big trial: rows of tiny participants behind
  for (let r = 0; r < 4; r++) for (let i = 0; i < 16; i++) {
    const x = -7 + i * 0.95 + (r % 2) * 0.4, z = -2 - r * 1.3, col = ['#ff8b5c', '#ffd35c', '#7dd3a8', '#9fb4ff'][(i + r) % 4];
    cyl(scene, mat(col), [x, 0.25, z], 0.18, 0.5); blob(scene, mat('#ffe0c0'), [x, 0.65, z], [0.14, 0.14, 0.14]);
  }
  const m = createMortarboard({ scale: 1.9 }); m.position.set(-0.9, 0, 1.0); m.rotation.y = 0.4; scene.add(m);
  m.userData.pose({ tilt: 0.06, arms: { r: [0, 0.4, 0] }, legs: { l: [0.2, 0], r: [-0.2, 0] } });
  scene.updateMatrixWorld(true);
  const t = m.worldToLocal(new THREE.Vector3(0.1, 2.0, 0.9)); m.userData.reach('l', [t.x, t.y, t.z]);
  wrapUp(stage, num, [m], [0.2, 1.9, 7.2], [0.2, 1.6, 0]);
});
</script></body></html>
