<!doctype html>
<html><head><meta charset="utf-8"><title>Scholar Rock q08</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q08 — "For FSHD, the MORTARBOARD heats a FORGE."
import { THREE, guard, mat, add, box, cyl, blob, sign, rng, makeScene, wrapUp } from './common.js';
import { createMortarboard } from './mortarboard.js';

guard(() => {
  const { stage, scene, num } = makeScene({ ground: '#8a7458', sky: { zenith: '#3a5fb8', horizon: '#f3c98a' }, sun: { el: 22 } });
  const stone = mat('#8d8a86'), dark = mat('#2c2a2c');
  // forge: stone hearth, glowing mouth, hood + chimney
  const fg = new THREE.Group(); fg.position.set(1.4, 0, -0.6); scene.add(fg);
  box(fg, stone, [0, 0.55, 0], [2.4, 1.1, 1.4]);
  box(fg, dark, [0, 0.8, 0.5], [1.4, 0.5, 0.5]);
  const glow = new THREE.MeshBasicMaterial({ color: '#ff8a1e' });
  add(fg, new THREE.PlaneGeometry(1.3, 0.4), glow, [0, 0.8, 0.76]);
  for (let i = 0; i < 5; i++) add(fg, new THREE.ConeGeometry(0.11, 0.35, 8), new THREE.MeshBasicMaterial({ color: i % 2 ? '#ffd23a' : '#ff5a1a' }), [-0.5 + i * 0.25, 1.08, 0.5 + (i % 2) * 0.05]);
  add(fg, new THREE.ConeGeometry(1.1, 1.0, 4), stone, [0, 1.6, -0.2], [0, Math.PI / 4, 0], [1, 1, 0.6]);
  box(fg, stone, [0, 2.4, -0.3], [0.6, 1.0, 0.6]);
  for (let i = 0; i < 4; i++) blob(fg, mat('#6b6b72'), [0.05 * i, 3.1 + i * 0.35, -0.3], [0.25 + i * 0.07, 0.2, 0.25]);
  const label = sign('FSHD', 1.5, 0.45, { bg: '#2b2f3a', fg: '#ffb02e', border: '#ffb02e' }); label.position.set(0, 1.35, 0.73); fg.add(label);
  // anvil
  const an = new THREE.Group(); an.position.set(-0.6, 0, -0.2); scene.add(an);
  cyl(an, mat('#6a4a2a'), [0, 0.3, 0], 0.32, 0.6);
  box(an, mat('#4a4d58', { metalness: 0.5 }), [0, 0.68, 0], [0.5, 0.16, 0.9]);
  box(an, mat('#4a4d58', { metalness: 0.5 }), [0, 0.86, 0], [1.0, 0.22, 0.45]);
  add(an, new THREE.ConeGeometry(0.2, 0.5, 12), mat('#4a4d58', { metalness: 0.5 }), [0.72, 0.86, 0], [0, 0, -Math.PI / 2]);
  // glowing bar on the anvil, held in tongs
  add(an, new THREE.CylinderGeometry(0.05, 0.05, 1.0, 12), new THREE.MeshBasicMaterial({ color: '#ff7a1a' }), [0.1, 1.03, 0.1], [0, 0, Math.PI / 2]);
  const r = rng(3);
  for (let i = 0; i < 26; i++) blob(scene, new THREE.MeshBasicMaterial({ color: '#ffd23a' }), [-0.7 + (r() - 0.2) * 1.8, 1.2 + r() * 1.0, 0.1 + (r() - 0.5) * 1.0], [0.025, 0.025, 0.025]);

  const m = createMortarboard({ scale: 2.0 }); m.position.set(-1.7, 0, 0.9); m.rotation.y = 0.65; scene.add(m);
  m.userData.pose({ lean: 0.1, legs: { l: [0.25, 0], r: [-0.2, 0] } });
  scene.updateMatrixWorld(true);
  const t = m.worldToLocal(new THREE.Vector3(-0.25, 1.15, 0.2)); m.userData.reach('l', [t.x, t.y, t.z]);
  // hammer raised in the other hand
  const hp = m.userData.parts.hands.r, hammer = new THREE.Group(); hp.add(hammer);
  cyl(hammer, mat('#8a5a30'), [0, 0.06, 0], 0.012, 0.3); box(hammer, mat('#8a8d96', { metalness: 0.5 }), [0, 0.22, 0], [0.1, 0.07, 0.07]);
  const t2 = m.worldToLocal(new THREE.Vector3(-1.3, 2.3, 1.1)); m.userData.reach('r', [t2.x, t2.y, t2.z]);
  hammer.rotation.z = 0.3; hammer.scale.setScalar(1.9);
  wrapUp(stage, num, [m], [0.4, 2.0, 7.4], [0.4, 1.6, 0]);
});
</script></body></html>
