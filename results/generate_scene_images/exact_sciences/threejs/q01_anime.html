<!doctype html>
<html><head><meta charset="utf-8"><title>Exact Sciences q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — "The RULER measures a MAD SON (Madison) in Wisconsin."
import { THREE, guard, mat, add, blob, box, num, makeStage, wrapUp, createRuler, person, cheese, faceOn } from './props.js';

function capitol() {
  const g = new THREE.Group(), white = mat('#f4efe4');
  add(g, new THREE.BoxGeometry(14, 3, 4), white, [0, 1.5, 0]);
  add(g, new THREE.BoxGeometry(5, 2, 4.4), white, [0, 4, 0]);
  add(g, new THREE.CylinderGeometry(2.4, 2.6, 1.2, 32), white, [0, 5.6, 0]);
  add(g, new THREE.SphereGeometry(2.4, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), mat('#e9e3d2'), [0, 6.2, 0]);
  add(g, new THREE.CylinderGeometry(0.15, 0.15, 1.4, 12), mat('#d8a82c'), [0, 9.2, 0]);
  for (let i = -5; i <= 5; i++) add(g, new THREE.CylinderGeometry(0.17, 0.17, 3, 12), mat('#fff'), [i * 0.55 - (i > 0 ? 0 : 0), 1.5, 2.3]);
  add(g, new THREE.BoxGeometry(6.4, 0.3, 0.6), white, [0, 3.1, 2.3]);
  return g;
}
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P), scene = stage.scene;
  const cap = capitol(); cap.position.set(0, 0, -14); scene.add(cap);
  add(scene, new THREE.PlaneGeometry(400, 3), mat('#d9c8a0'), [0, 0.004, -4.5], [-Math.PI / 2, 0, 0]);

  // mad son: red face, cheesehead hat, steam
  const boy = person({ skin: '#f06a52', shirt: '#2f6f3a' }); boy.scale.setScalar(1.45); boy.position.set(0.55, 0, 0); boy.rotation.y = -0.25; scene.add(boy);
  faceOn(boy, { angry: true });
  const hat = cheese(0.42); hat.position.set(0, 1.0, 0); hat.rotation.set(0, 0.3, 0.1); boy.add(hat);
  for (const s of [-1, 1]) {
    const puff = blob(boy, mat('#ffffff', { roughness: 1 }), [s * 0.3, 1.0, 0], [0.07, 0.07, 0.07]); blob(boy, mat('#fff'), [s * 0.37, 1.1, 0], [0.05, 0.05, 0.05]);
  }
  // fists
  for (const s of [-1, 1]) blob(boy, mat('#f06a52'), [s * 0.22, 0.34, 0.06], [0.05, 0.05, 0.05]);

  const ruler = createRuler({ scale: 1.75 }); ruler.position.set(-0.55, 0, 0.3); ruler.rotation.y = 0.35; scene.add(ruler);
  ruler.userData.pose({ headTilt: 0.05, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  ruler.updateMatrixWorld(true);
  const tgt = ruler.worldToLocal(new THREE.Vector3(0.2, 1.8, 0.35)); ruler.userData.reach('l', [tgt.x, tgt.y, tgt.z]);

  const cow = new THREE.Group(); blob(cow, mat('#fff'), [0, 0.45, 0], [0.5, 0.28, 0.25]); blob(cow, mat('#222'), [0.1, 0.55, 0.14], [0.2, 0.13, 0.1]);
  blob(cow, mat('#fff'), [0.55, 0.62, 0], [0.2, 0.17, 0.16]); blob(cow, mat('#f5b9b0'), [0.7, 0.58, 0], [0.09, 0.09, 0.12]);
  for (const x of [-0.3, 0.3]) for (const z of [-0.15, 0.15]) add(cow, new THREE.CylinderGeometry(0.04, 0.04, 0.3, 8), mat('#fff'), [x, 0.15, z]);
  cow.position.set(-3.2, 0, -3); cow.rotation.y = 0.6; cow.scale.setScalar(1.1); scene.add(cow);
  for (const [x, z, r] of [[3.2, -1.2, 0.5], [3.7, -2.4, -0.3]]) { const c = cheese(0.8); c.position.set(x, 0.01, z); c.rotation.y = r; scene.add(c); }

  wrapUp(stage, P, [ruler], { pos: [0.1, 1.2, 4.2], look: [0, 1.1, 0] });
  stage.toonify(scene, (m) => { let o = m; while (o) { if (o === boy) return true; o = o.parent; } return false; });
});
</script></body></html>
