<!doctype html>
<html><head><meta charset="utf-8"><title>Exact Sciences q04</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q04 — "Knights on a QUEST draw the blood for the RULER's CANCER GUARD."
import { THREE, guard, mat, add, blob, box, num, makeStage, wrapUp, guardRuler, knight, syringe, vial, holdAt, limbBetween } from './props.js';
function banner(color) {
  const g = new THREE.Group();
  add(g, new THREE.CylinderGeometry(0.02, 0.02, 2.6, 8), mat('#6a3b1c'), [0, 1.3, 0]);
  const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(0.8, 0); s.lineTo(0.8, -0.8); s.lineTo(0.4, -0.55); s.lineTo(0, -0.8); s.lineTo(0, 0);
  add(g, new THREE.ExtrudeGeometry(s, { depth: 0.02, bevelEnabled: false }), mat(color), [0.02, 2.55, 0]);
  const star = add(g, new THREE.OctahedronGeometry(0.15), mat('#ffd54a', { metalness: 0.6 }), [0.42, 2.25, 0.03], [0, 0, 0], [1, 1, 0.2]);
  blob(g, mat('#ffd54a', { metalness: 0.6 }), [0, 2.63, 0], [0.045, 0.045, 0.045]);
  return g;
}
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P), scene = stage.scene;
  add(scene, new THREE.PlaneGeometry(400, 2.2), mat('#c9a56b'), [0, 0.003, -3], [-Math.PI / 2, 0, 0]);
  // distant castle on the quest road
  const stone = mat('#b9b4aa'); const cas = new THREE.Group(); cas.position.set(3, 0, -14); scene.add(cas);
  add(cas, new THREE.BoxGeometry(8, 3, 2), stone, [0, 1.5, 0]);
  for (const x of [-4, 4, 0]) { add(cas, new THREE.CylinderGeometry(0.9, 1, 6, 16), stone, [x, 3, 0]); add(cas, new THREE.ConeGeometry(1.2, 1.8, 16), mat('#c8312e'), [x, 6.9, 0]); }
  // ruler offers arm; knight pushes a big syringe into it
  const r = guardRuler(2.1); r.position.set(0.1, 0, 0); r.rotation.y = 0.3; scene.add(r);
  r.userData.reach('r', [-0.55, 0.62, 0.38]);
  r.updateMatrixWorld(true); const hp = new THREE.Vector3(); r.userData.parts.hands.r.getWorldPosition(hp);
  const S = 0.8, syr = syringe(S); syr.rotation.z = -Math.PI / 2; syr.position.set(hp.x - 0.65 * S - 0.03, hp.y, hp.z + 0.05); scene.add(syr);
  const k1 = knight('#c8312e'); k1.scale.setScalar(1.7); k1.position.set(hp.x - 1.5, 0, hp.z + 0.1); k1.rotation.y = 0.5; scene.add(k1);
  const shoulder = new THREE.Vector3(hp.x - 1.5 + 0.3, 1.05, hp.z + 0.15), grip = new THREE.Vector3(hp.x - 0.9 * S, hp.y, hp.z + 0.05);
  scene.add(limbBetween(shoulder, grip, 0.06, mat('#aeb8c4', { metalness: 0.7, roughness: 0.3 })));
  // second knight with banner + vial rack
  const k2 = knight('#2c5fb8'); k2.scale.setScalar(1.6); k2.position.set(2.2, 0, 0.2); k2.rotation.y = -0.4; scene.add(k2);
  const b = banner('#c8312e'); b.position.set(3.1, 0, 0.1); scene.add(b);
  const rack = add(scene, new THREE.BoxGeometry(1.2, 0.08, 0.3), mat('#6a3b1c'), [0.4, 0.5, 1.5]);
  add(scene, new THREE.BoxGeometry(1.0, 0.5, 0.25), mat('#6a3b1c'), [0.4, 0.25, 1.5]);
  for (let i = 0; i < 5; i++) { const v = vial(0.32, 0.04, 0.8); v.position.set(0.0 + i * 0.2, 0.54, 1.5); scene.add(v); }
  wrapUp(stage, P, [r], { pos: [0.0, 1.3, 5.0], look: [0.0, 1.1, 0] });
  stage.toonify(scene, (m) => { let o = m; while (o) { if (o === k1 || o === k2) return true; o = o.parent; } return false; });
});
</script></body></html>
