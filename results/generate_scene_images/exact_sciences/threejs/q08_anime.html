<html><head><meta charset="utf-8"><title>Exact Sciences q08</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q08 — "The RULER's ticker reads EXAS."
import { THREE, guard, mat, add, blob, box, makeStage, wrapUp, createRuler, textPlane, canvasTexture, rng } from './props.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P), scene = stage.scene;
  const bx = 0.8, by = 2.35;
  add(scene, new THREE.BoxGeometry(4.8, 1.9, 0.2), mat('#1a2133'), [bx, by, -0.6]);
  add(scene, new THREE.BoxGeometry(4.95, 0.08, 0.26), mat('#d8a82c', { metalness: 0.6 }), [bx, by + 0.99, -0.6]);
  add(scene, new THREE.BoxGeometry(4.95, 0.08, 0.26), mat('#d8a82c', { metalness: 0.6 }), [bx, by - 0.99, -0.6]);
  for (const x of [-1.0, 2.6]) add(scene, new THREE.BoxGeometry(0.15, 1.5, 0.15), mat('#2a2f3c'), [x, 0.75, -0.65]);
  // LED dot backdrop
  const led = canvasTexture(512, (ctx, s) => { ctx.fillStyle = '#0c1220'; ctx.fillRect(0, 0, s, s); ctx.save(); ctx.scale(1, 4.6 / 1.7); ctx.fillStyle = '#39ff7a'; ctx.font = 'bold 112px Arial Black, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('EXAS', 222, 94); ctx.restore(); ctx.fillStyle = 'rgba(10,24,16,0.55)'; for (let y = 6; y < s; y += 12) for (let x = 6; x < s; x += 12) { ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill(); } });
  const bg = add(scene, new THREE.PlaneGeometry(4.6, 1.7), new THREE.MeshBasicMaterial({ map: led }), [bx, by, -0.49]);
  // green up arrow
  const a = new THREE.Shape(); a.moveTo(0, 0.5); a.lineTo(0.42, 0); a.lineTo(0.16, 0); a.lineTo(0.16, -0.5); a.lineTo(-0.16, -0.5); a.lineTo(-0.16, 0); a.lineTo(-0.42, 0); a.lineTo(0, 0.5);
  const am = new THREE.Mesh(new THREE.ShapeGeometry(a), new THREE.MeshBasicMaterial({ color: '#39ff7a' })); am.position.set(bx + 1.75, by, -0.47); scene.add(am);
  const r = createRuler({ scale: 2.2 }); r.position.set(-1.3, 0, 0.9); r.rotation.y = 0.35; scene.add(r);
  r.userData.pose({ headTilt: 0.05, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  r.updateMatrixWorld(true);
  const tg = r.worldToLocal(new THREE.Vector3(0.2, 2.2, -0.2)); r.userData.reach('r', [tg.x, tg.y, tg.z]);
  wrapUp(stage, P, [r], { pos: [0.8, 1.9, 6.0], look: [0.5, 1.7, 0] });
});
</script></body></html>
