<!doctype html>
<html><head><meta charset="utf-8"><title>Exact Sciences q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — "The RULER's daily bread is checking the colon: colorectal screening."
import { THREE, guard, mat, add, blob, box, makeStage, wrapUp, createRuler } from './props.js';
function colon() {
  const g = new THREE.Group(), pink = mat('#f08a8f', { roughness: 0.5 }), dk = mat('#d9666e');
  const pts = [[0.65, 0.1], [0.68, 0.7], [0.65, 1.3], [0.55, 1.6], [0.2, 1.72], [-0.3, 1.72], [-0.6, 1.6], [-0.68, 1.3], [-0.68, 0.8], [-0.62, 0.45], [-0.35, 0.28], [-0.1, 0.4], [0.1, 0.25], [0.0, 0.05]].map(([x, y]) => new THREE.Vector3(x, y, 0));
  const curve = new THREE.CatmullRomCurve3(pts);
  for (let i = 0; i <= 70; i++) { const p = curve.getPoint(i / 70); blob(g, i % 2 ? pink : dk, [p.x, p.y, 0], [0.13, 0.13, 0.12]); }
  blob(g, pink, [0.65, 0.05, 0], [0.17, 0.1, 0.13]);
  add(g, new THREE.CapsuleGeometry(0.035, 0.18, 4, 8), dk, [0.8, 0.0, 0], [0, 0, 0.6]);
  blob(g, pink, [0.0, 0.0, 0], [0.07, 0.07, 0.07]);
  return g;
}
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P), scene = stage.scene;
  // anatomy board
  add(scene, new THREE.BoxGeometry(2.6, 2.5, 0.08), mat('#f7f1e1'), [1.3, 1.75, -0.4]);
  add(scene, new THREE.BoxGeometry(2.72, 0.1, 0.12), mat('#4a77c9'), [1.3, 3.05, -0.4]);
  for (const x of [0.2, 2.4]) add(scene, new THREE.BoxGeometry(0.1, 0.6, 0.08), mat('#6a3b1c'), [x, 0.3, -0.4]);
  const c = colon(); c.position.set(1.3, 0.75, -0.3); c.scale.setScalar(1.15); scene.add(c);
  // ruler measuring the colon
  const r = createRuler({ scale: 2.2 }); r.position.set(-0.6, 0, 0.5); r.rotation.y = 0.45; scene.add(r);
  r.userData.pose({ headTilt: -0.04, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  r.updateMatrixWorld(true);
  const t = r.worldToLocal(new THREE.Vector3(0.75, 1.75, -0.2)); r.userData.reach('l', [t.x, t.y, t.z]);
  // daily bread: loaf + baguettes
  const crust = mat('#c68a3c'), crumb = mat('#e8c27a');
  const loaf = new THREE.Group(); loaf.position.set(-1.7, 0, 1.0); loaf.rotation.y = 0.5; scene.add(loaf);
  blob(loaf, crust, [0, 0.25, 0], [0.55, 0.28, 0.3]);
  for (const x of [-0.25, 0, 0.25]) box(loaf, crumb, [x, 0.45, 0], [0.06, 0.02, 0.28], [0, 0, 0.3]);
  const bag = new THREE.Group(); bag.position.set(-2.4, 0, 0.2); scene.add(bag);
  add(bag, new THREE.CylinderGeometry(0.28, 0.2, 0.4, 20), mat('#8a5a30'), [0, 0.2, 0]);
  for (const [x, z, rz] of [[-0.08, 0, 0.18], [0.08, 0.04, -0.12], [0, -0.06, 0.02]]) add(bag, new THREE.CylinderGeometry(0.05, 0.05, 1.0, 14), crust, [x, 0.8, z], [0, 0, rz]);
  wrapUp(stage, P, [r], { pos: [0.2, 1.7, 5.4], look: [0.0, 1.4, 0] });
});
</script></body></html>
