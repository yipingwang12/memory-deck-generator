<!doctype html>
<html><head><meta charset="utf-8"><title>Ultima q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, mat, add, blob, sign, wafer, coin, palm, flask, dna, solarPanel, sun, build, cam, reachW, climber } from './props.js';
guard(() => {

const B = build({ summit: { scale: 1.8, pos: [0, 0, 0.3], ry: 0 } }); const { scene, s, num } = B;
s.userData.pose({ arms: { l: [0, 1.0, 0], r: [0, -1.0, 0] } });
const sn = sun(0.6); sn.position.set(0.2, 4.1, -3); scene.add(sn);
// faces for the sun
for (const sx of [-1, 1]) blob(sn, mat('#3a2410'), [sx * 0.2, 0.08, 0.6], [0.05, 0.08, 0.02]);
for (const [x, ry] of [[-3.0, 0.6], [-1.9, 0.35], [1.9, -0.35], [3.0, -0.6]]) {
  const p = solarPanel(1.3, 0.9), g = new THREE.Group(); g.position.set(x, 0, -0.6); g.rotation.y = ry; scene.add(g);
  p.position.y = 0.82; p.rotation.x = -0.45; g.add(p);
  add(g, new THREE.CylinderGeometry(0.05, 0.07, 0.8, 10), mat('#8a93a3'), [0, 0.4, -0.06]);
}
// chemistry flasks glowing beside the summit
const f1 = flask(0.75, '#38e0a0'); f1.position.set(-1.35, 0, 1.2); scene.add(f1);
const f2 = flask(0.6, '#ff6fa8'); f2.position.set(1.4, 0, 1.2); scene.add(f2);
// cables
for (const [x0, x1] of [[-1.9, -1.35], [1.9, 1.4]]) { const c = new THREE.CatmullRomCurve3([new THREE.Vector3(x0, 0.5, -0.4), new THREE.Vector3((x0 + x1) / 2, 0.03, 0.4), new THREE.Vector3(x1, 0.12, 1.1)]);
  add(scene, new THREE.TubeGeometry(c, 20, 0.025, 8), mat('#ffcf2a', { emissive: '#ffb000', emissiveIntensity: .6 })); }
cam(B.stage, num, [0, 1.6, 7.0], [0, 1.5, 0]); B.finish();

});
</script></body></html>
