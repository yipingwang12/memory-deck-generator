<!doctype html>
<html><head><meta charset="utf-8"><title>Summit anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createSummit } from './summit.js';
guard(() => {
  const stage = createAnimeStage({ fov: 36, sunElevation: 35, sunAzimuth: 150, sky: { cover: 1.5, seed: 5 },
    sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.5, fog: { near: 120, far: 1500 } });
  const scene = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#6fae45', roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const pm = new Set();
  [[-1.5, 0.7, -0.15], [0, 0, 0.0], [1.5, -0.8, 0.1]].forEach(([x, ry, lean], i) => {
    const s = createSummit(); s.position.set(x, 0, 0); s.rotation.y = ry;
    if (i === 1) s.userData.pose({ arms: { l: [0, 0.9, 0], r: [0, 0.3, 0] } });
    if (i === 0) s.userData.reach('l', [0.3, 1.0, 0.3]);
    scene.add(s); s.traverse((o) => pm.add(o));
  });
  stage.toonify(scene, (m) => pm.has(m));
  stage.camera.position.set(0, 0.7, 4.6); stage.camera.lookAt(0, 0.5, 0);
  stage.finish();
});
</script></body></html>
