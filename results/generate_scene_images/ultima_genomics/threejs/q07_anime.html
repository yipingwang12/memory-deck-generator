<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, mat, add, blob, sign, wafer, coin, palm, flask, dna, solarPanel, sun, build, cam, reachW, climber } from './props.js';
guard(() => {

const B = build({ ground: '#7cc46a', summit: { scale: 2.1, pos: [0, 0, 0.3], ry: 0 } }); const { scene, s, num } = B;
s.userData.pose({ arms: { l: [0, 1.3, 0], r: [0, -1.3, 0] } });
// two wafers flanking
for (const [x, ry] of [[-2.4, 0.4], [2.4, -0.4]]) { const w = wafer(0.85); w.position.set(x, 1.5, 0.1); w.rotation.y = ry; scene.add(w); add(scene, new THREE.BoxGeometry(0.9, 0.08, 0.4), mat('#aab4cc', { metalness: .5 }), [x, 0.04, 0.1], [0, ry, 0]); add(scene, new THREE.CylinderGeometry(0.05, 0.05, 0.55, 10), mat('#aab4cc', { metalness: .5 }), [x, 0.35, 0.05]); }
// ULTRA banner + glow
sign(scene, 'ULTRA', 4.2, 1.2, [0, 3.55, -0.4], { bg: '#ffcf2a', fg: '#c4125a', border: '#c4125a', font: 'bold 300px Arial Black, Arial' });
add(scene, new THREE.BoxGeometry(4.3, 1.3, 0.06), mat('#7a1040'), [0, 3.55, -0.46]);
const glow = add(scene, new THREE.SphereGeometry(1.9, 32, 20), new THREE.MeshBasicMaterial({ color: '#ffe27a', transparent: true, opacity: 0.45, depthWrite: false }), [0, 1.3, -2.6]);
for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; add(scene, new THREE.ConeGeometry(0.1, 0.5, 4), new THREE.MeshBasicMaterial({ color: '#fff3a0' }), [Math.cos(a) * 2.6, 1.6 + Math.sin(a) * 1.8, -0.9], [0, 0, a - Math.PI / 2]); }
cam(B.stage, num, [0, 1.9, 8.0], [0, 1.8, 0]); B.finish();

});
</script></body></html>
