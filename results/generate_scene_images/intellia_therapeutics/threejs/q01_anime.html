<html><head><meta charset="utf-8"><title>Intellia q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — The OWL hatches on top of a TOWER.
import { THREE, guard, rng, createOwl, mat, add, blob, cyl, cone, box, makeStage, finish, textPlane, flag, caribou, fox, bear, globe, bubble, halo, vial } from './common.js';
guard(() => {

  const ctx = makeStage({ ground: null }); const { scene, num } = ctx;
  add(scene, new THREE.PlaneGeometry(2000, 2000), mat('#6fae45'), [0, -14, 0], [-Math.PI / 2, 0, 0]);
  const stone = mat('#b9a58a', { roughness: 0.9 }), dk = mat('#8e7a62', { roughness: 0.9 });
  const tower = new THREE.Group(); scene.add(tower);
  cyl(tower, stone, 1.15, 1.35, 14, [0, -7.2, 0]);
  cyl(tower, dk, 1.7, 1.5, 0.35, [0, -0.17, 0]);
  cyl(tower, stone, 1.55, 1.55, 0.12, [0, 0.0, 0]);
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; if (Math.abs(Math.sin(a / 2 - 0)) > 0.0 && Math.cos(a) > 0.2 || Math.abs(Math.sin(a)) < 0.3) continue; box(tower, stone, 0.26, 0.3, 0.24, [Math.sin(a) * 1.55, 0.26, Math.cos(a) * 1.55], [0, a, 0]); }
  for (let i = 0; i < 9; i++) box(tower, dk, 0.1, 0.2, 0.03, [Math.sin(i * 0.5 - 0.6) * 1.18, -1.1 - (i % 3) * 1.6, Math.cos(i * 0.5 - 0.6) * 1.18], [0, i * 0.5 - 0.6, 0]);
  const owl = createOwl({ scale: num('os', 1.5) }); owl.position.set(0, 0.02, 0.25); scene.add(owl);
  owl.userData.pose({ headTilt: 0.1, wings: { l: [0, 0.5], r: [0, 0.5] } });
  const shell = new THREE.MeshStandardMaterial({ color: '#fff6e2', roughness: 0.6, side: THREE.DoubleSide });
  const eg = new THREE.Group(); eg.scale.setScalar(1.45); eg.position.set(0, 0.45, 0.25); scene.add(eg);
  add(eg, new THREE.SphereGeometry(0.62, 40, 24, 0, Math.PI * 2, 1.95, 1.2), shell, [0, 0, 0]);
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; const r = 0.62 * Math.sin(1.95); cone(eg, shell, 0.09, 0.2, [Math.sin(a) * r, 0.62 * Math.cos(1.95) + 0.09, Math.cos(a) * r], [Math.cos(a) * 0.2, 0, -Math.sin(a) * 0.2]); }
  for (const [x, z, s] of [[-1.0, 1.0, 0.26], [1.05, 0.9, 0.2], [0.6, 1.2, 0.14]]) add(scene, new THREE.SphereGeometry(s, 12, 8, 0, Math.PI * 2, 0, 1.3), shell, [x, 0.08, z], [0.3, 0, 0.2]);
  finish(ctx, [owl], [0, 0.2, 5.3], [0, 0.4, 0]);

});
</script></body></html>
