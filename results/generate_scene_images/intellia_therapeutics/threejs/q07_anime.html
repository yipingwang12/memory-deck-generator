<html><head><meta charset="utf-8"><title>Intellia q07</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q07 — A HALO (HAELO) rings the OWL's Phase 3 trial.
import { THREE, guard, rng, createOwl, mat, add, blob, cyl, cone, box, makeStage, finish, textPlane, flag, caribou, fox, bear, globe, bubble, halo, vial, attacker } from './common.js';
guard(() => {

  const ctx = makeStage({ ground: '#e9dcc0' }); const { scene, num } = ctx;
  const owl = createOwl({ scale: 1.3 }); owl.position.set(-0.85, 0, 0.3); owl.rotation.y = 0.3; scene.add(owl);
  owl.userData.pose({ wings: { l: [0, 0.35], r: [0, 0.35] } });
  halo(scene, [-0.85, 1.72, 0.3], 0.4).scale.setScalar(1.0);
  for (let i = 0; i < 6; i++) { const a = i * 1.05; blob(scene, '#fff6b0', [-0.85 + Math.cos(a) * 0.62, 1.72 + Math.sin(a) * 0.12, 0.3 + Math.sin(a) * 0.4], [0.03, 0.03, 0.03], undefined, { emissive: '#fff0a0', emissiveIntensity: 1 }); }
  // trial sign: post + board with PHASE 3
  const sg = new THREE.Group(); sg.position.set(1.35, 0, 0.2); sg.rotation.y = -0.3; scene.add(sg);
  cyl(sg, '#7a5230', 0.05, 0.05, 0.95, [0, 0.475, 0]); box(sg, '#2a3a5a', 1.3, 0.85, 0.06, [0, 1.35, 0]);
  const t = textPlane('PHASE 3', 1.18, 0.7, { bg: '#f4f1e8', fg: '#c42a2a', font: 'bold 120px Arial', border: '#2a3a5a' }); t.position.set(0, 1.35, 0.035); sg.add(t);
  halo(sg, [0, 1.35, 0.1], 0.82).rotation.set(0.15, 0, 0);
  sg.children[sg.children.length - 1].material = mat('#ffd23a', { emissive: '#ffb800', emissiveIntensity: 0.6, metalness: 0.5, roughness: 0.25 });
  finish(ctx, [owl], [0.2, 1.1, 5.0], [0.2, 0.95, 0]);

});
</script></body></html>
