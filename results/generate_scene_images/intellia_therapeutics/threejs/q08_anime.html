<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q08 — A FOX chases away most of the OWL's attacks after one infusion.
import { THREE, guard, rng, createOwl, mat, add, blob, cyl, cone, box, makeStage, finish, textPlane, flag, caribou, fox, bear, globe, bubble, halo, vial, attacker } from './common.js';
guard(() => {

  const ctx = makeStage({ ground: '#8dc060' }); const { scene, num } = ctx;
  const owl = createOwl({ scale: 1.15 }); owl.position.set(-1.9, 0, 0.3); owl.rotation.y = 0.45; scene.add(owl);
  // IV pole with bag marked 1
  const pole = new THREE.Group(); pole.position.set(-0.95, 0, 0.1); pole.scale.setScalar(1.3); scene.add(pole);
  cyl(pole, '#c9d2dc', 0.025, 0.025, 1.7, [0, 0.85, 0]); cyl(pole, '#c9d2dc', 0.2, 0.2, 0.04, [0, 0.02, 0]); box(pole, '#c9d2dc', 0.4, 0.03, 0.03, [0, 1.7, 0]);
  box(pole, mat('#cfeaff', { transparent: true, opacity: 0.75 }), 0.36, 0.5, 0.1, [0, 1.38, 0.06]);
  const one = textPlane('1', 0.3, 0.4, { bg: null, fg: '#1a4fb0', font: 'bold 260px Arial' }); one.position.set(0, 1.38, 0.115); pole.add(one);
  
  owl.userData.reach('l', [0.95, 0.9, 0.2]);
  const fx = fox(); fx.position.set(0.8, 0.15, 0.5); fx.rotation.set(0, -0.3, 0.12); fx.scale.setScalar(1.7); scene.add(fx);
  const rs = [[1.8, 0.55, 0.0, 0.8], [2.3, 1.05, -0.5, 0.6], [2.6, 0.35, 0.3, 0.5]];
  rs.forEach(([x, y, z, s], i) => { const a = attacker(); a.position.set(x, y + 0.15, z); a.scale.setScalar(s * 1.5); a.rotation.y = 0.9; scene.add(a);
    for (let k = 0; k < 3; k++) box(scene, '#ffffff', 0.35, 0.02, 0.02, [x + 0.55 * s * 1.5 + 0.1, y + 0.1 + k * 0.1, z]); });
  finish(ctx, [owl, fx], [0.4, 1.0, 5.8], [0.5, 0.85, 0]);

});
</script></body></html>
