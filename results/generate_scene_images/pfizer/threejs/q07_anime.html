<!doctype html>
<html><head><meta charset="utf-8"><title>Pfizer q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — The VISOR's ticker on the NYSE reads PFE.
import { THREE, guard, createVisor, setup, ground, box, cyl, blob, add, mat, sign, prism, tex, finish } from './common.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const { stage, scene, num } = setup(P);
  ground(scene, '#b8b2a4');
  add(scene, new THREE.PlaneGeometry(400, 6), mat('#6a6e78'), [0, 0.004, 3.5], [-Math.PI / 2, 0, 0]);
  // NYSE: colonnade + pediment
  const n = new THREE.Group(); n.position.set(0, 0, -5); scene.add(n);
  box(n, 14, 5.5, 2.5, '#efe9dc', [0, 2.75, 0]); box(n, 15, 0.4, 3.4, '#d9d2c0', [0, 0.2, 1.4]);
  for (let i = 0; i < 6; i++) cyl(n, 0.34, 0.38, 4.6, '#f8f3e6', [-5.6 + i * 2.24, 2.7, 2.3]);
  box(n, 13, 0.5, 3.2, '#d9d2c0', [0, 5.2, 1.5]); prism(n, 13, 1.8, 3.4, '#e9e2d0', [0, 5.45, 1.5]);
  for (const x of [-4.2, 0, 4.2]) { cyl(n, 0.04, 0.04, 2.2, '#888', [x, 7.0, 3.0]); box(n, 0.9, 0.55, 0.03, x === 0 ? '#e83a3a' : '#2a4aa8', [x + 0.47, 7.8, 3.0]); }
  // LED ticker board
  const board = new THREE.Group(); board.position.set(0, 3.1, 3.35); n.add(board);
  box(board, 6.6, 1.7, 0.2, '#111218', [0, 0, 0]);
  const t = tex(1024, 256, (c, W, H) => {
    c.fillStyle = '#050608'; c.fillRect(0, 0, W, H);
    c.font = 'bold 190px "Courier New", monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.shadowColor = '#40ff90'; c.shadowBlur = 30; c.fillStyle = '#5dff9a'; c.fillText('PFE', W / 2, H / 2 + 8);
  });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 1.55), new THREE.MeshBasicMaterial({ map: t })); face.position.z = 0.11; board.add(face);
  const v = createVisor({ scale: num('vs', 3.2) }); v.position.set(num('vx', 3.3), 0, 3.4); v.rotation.y = -0.45; scene.add(v);
  v.userData.pose({ arms: { r: [0, 0.4, 0] } }); v.updateMatrixWorld(true);
  const tg = v.worldToLocal(new THREE.Vector3(0.8, 2.3, 3.6)); v.userData.reach('r', tg.toArray());
  finish(stage, scene, [v], [num('cx', 0.4), num('cy', 2.6), num('cz', 10.5)], [0.4, 3.1, 0]);
});
</script></body></html>
