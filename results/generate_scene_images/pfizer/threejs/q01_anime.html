<!doctype html>
<html><head><meta charset="utf-8"><title>Pfizer q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — The VISOR shades six-ten MAIN Street, close to the MIT DOME.
import { THREE, guard, createVisor, setup, ground, road, box, cyl, add, mat, sign, dome, finish } from './common.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const { stage, scene, num } = setup(P);
  ground(scene, '#8cbf68'); road(scene, 2.2, 3.2);
  add(scene, new THREE.PlaneGeometry(400, 1.6), mat('#d9d2c0'), [0, 0.003, 0.4], [-Math.PI / 2, 0, 0]);
  const d = dome(); d.scale.setScalar(2.4); d.position.set(5.5, 0, -9); scene.add(d);
  // building number 610 on a red-brick building
  const b = new THREE.Group(); b.position.set(-1.6, 0, -2.4); scene.add(b);
  box(b, 4.2, 2.6, 1.8, '#b5563f', [0, 1.3, 0]); box(b, 4.4, 0.18, 2.0, '#d9d2c0', [0, 2.69, 0]);
  for (const x of [-1.4, 1.4]) for (const y of [0.8, 1.9]) box(b, 0.7, 0.7, 0.05, '#bfe4ff', [x, y, 0.92]);
  box(b, 0.8, 1.5, 0.06, '#5a3a2a', [0, 0.75, 0.92]);
  const num610 = sign('610', 1.5, 0.6, { bg: '#fff7e0', fg: '#1a2a5a', border: '#1a2a5a' }); num610.position.set(0, 1.9, 0.95); b.add(num610);
  // MAIN St sign post
  cyl(scene, 0.04, 0.04, 2.4, '#4a4f58', [2.3, 1.2, 0.8]);
  const st = sign('MAIN ST', 1.5, 0.4, { bg: '#1f7a3a', fg: '#fff', border: '#fff' }); st.position.set(2.3, 2.45, 0.85); scene.add(st);
  const v = createVisor({ scale: num('vs', 2.8) }); v.position.set(num('vx', 0.9), 0, 0.9); v.rotation.y = -0.35; scene.add(v);
  v.userData.pose({ arms: { l: [0, 0.5, 0], r: [0, 0.4, 0] } });
  finish(stage, scene, [v], [num('cx', 1.0), num('cy', 1.7), num('cz', 6.8)], [num('tx', 1.2), num('ty', 1.3), 0]);
});
</script></body></html>
