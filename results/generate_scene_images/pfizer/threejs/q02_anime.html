<!doctype html>
<html><head><meta charset="utf-8"><title>Pfizer q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — The VISOR rents its house from a small child of the MIT DOME.
import { THREE, guard, createVisor, setup, ground, box, cyl, blob, add, mat, house, dome, finish } from './common.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const { stage, scene, num } = setup(P);
  ground(scene, '#8cbf68');
  const big = dome(); big.scale.setScalar(2.6); big.position.set(-1.5, 0, -10); scene.add(big);
  const h = house({ w: 2.2, h: 1.5, d: 1.6, wall: '#f0c98a', roof: '#c0463a' }); h.position.set(-3.2, 0, -1.2); h.rotation.y = 0.3; scene.add(h);
  const child = dome({ face: true }); child.scale.setScalar(0.8); child.position.set(2.0, 0.6, 0.4); child.rotation.y = -0.45; scene.add(child);
  for (const s of [-1, 1]) { cyl(scene, 0.07, 0.07, 0.6, '#d6ccb2', [2.0 + s * 0.3, 0.3, 0.55]); blob(scene, '#e8483c', [2.0 + s * 0.3, 0.03, 0.65], [0.13, 0.06, 0.2]); }
  const v = createVisor({ scale: num('vs', 2.1) }); v.position.set(-1.0, 0, 1.2); v.rotation.y = 0.5; scene.add(v);
  v.userData.pose({ arms: { l: [0, 0.3, 0] } });
  v.updateMatrixWorld(true);
  // golden house key passed from the child to the visor
  const key = new THREE.Group(); key.position.set(0.55, 1.0, 1.05);
  add(key, new THREE.TorusGeometry(0.12, 0.035, 10, 24), mat('#ffd23a', { metalness: 0.6, roughness: 0.3 }), [0, 0.2, 0]);
  cyl(key, 0.03, 0.03, 0.4, '#ffd23a', [0, -0.05, 0]); box(key, 0.12, 0.05, 0.04, '#ffd23a', [0.07, -0.18, 0]); box(key, 0.09, 0.05, 0.04, '#ffd23a', [0.06, -0.08, 0]);
  key.scale.setScalar(1.6); scene.add(key);
  const t = v.worldToLocal(new THREE.Vector3(0.5, 0.9, 1.1)); v.userData.reach('l', [t.x, t.y, t.z]);
  cyl(scene, 0.05, 0.05, 0.9, '#f2c9a0', [1.3, 1.0, 0.9], [0, 0, 1.25]); blob(scene, '#f2c9a0', [0.9, 1.12, 0.95], [0.07, 0.07, 0.07]);
  finish(stage, scene, [v], [num('cx', 0.6), num('cy', 1.5), num('cz', 6.2)], [num('tx', 0.2), num('ty', 1.1), 0]);
});
</script></body></html>
