<!doctype html>
<html><head><meta charset="utf-8"><title>Visor sheet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createVisor } from './visor.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 40, sunAzimuth: 150, sky: { cover: 1, seed: 5 },
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, fog: { near: 120, far: 1500 } });
  const scene = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: '#8fc66a', roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const vs = [];
  [[-1.3, 0.7], [0, 0], [1.3, -0.9]].forEach(([x, ry], i) => {
    const v = createVisor(); v.position.set(x, 0, 0); v.rotation.y = ry; scene.add(v); vs.push(v);
    v.userData.pose({ arms: { l: [0, 0.3, 0], r: [0, 0.3, 0] } });
  });
  const pm = new Set(); vs.forEach((v) => v.traverse((o) => pm.add(o)));
  stage.toonify(scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [200, 1000, 120, 1.6]]);
  stage.camera.position.set(0, 0.9, 4.2); stage.camera.lookAt(0, 0.5, 0);
  stage.finish();
});
</script></body></html>
