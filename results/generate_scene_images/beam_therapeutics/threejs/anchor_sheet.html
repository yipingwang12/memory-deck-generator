<!doctype html>
<html><head><meta charset="utf-8"><title>Beam anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createGirder } from './girder.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, exposure: 1, sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.7, fog: { near: 120, far: 1500 } });
  const sc = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#c9b79a', roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2; sc.add(g);
  const poses = [[-1.0, 0, { arms: { l: [0, 0.3, 0], r: [0, 0.3, 0] } }], [0, 0.7, { arms: { l: [0, 1.0, 0.0], r: [-0.4, 0.3, 0.6] }, headTilt: 0.08 }], [1.0, Math.PI / 2, { arms: { l: [0, 0.3, 0], r: [0, 0.3, 0] } }]];
  const set = new Set();
  for (const [x, ry, p] of poses) { const a = createGirder({ scale: 1.3 }); a.position.set(x * 1.0, 0, 0); a.rotation.y = ry; sc.add(a); a.userData.pose(p); a.traverse((o) => set.add(o)); }
  stage.toonify(sc, (m) => set.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [190, 1000, 120, 1.6]]);
  stage.camera.position.set(0, 0.8, 4.2); stage.camera.lookAt(0, 0.7, 0);
  stage.finish();
});
</script></body></html>
