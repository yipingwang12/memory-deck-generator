<!doctype html>
<html><head><meta charset="utf-8"><title>Beam scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, run, mat, glow, add, blob, cyl, box, cone, group, label, eyes, coin, bubble, sack, flag, liver, animal } from "./common.js";
// q03 — Before the GIRDER, the three built an EDIT pencil: Editas.
run({ gAt: [-1.8, 0, 0.5], gRot: 0.6, gScale: 1.4, pose: { arms: { l: [0, 0.4, 0], r: [0, 0.4, 0] } }, cam: [0.1, 1.0, 4.4], look: [0.2, 0.85, 0],
  build({ scene, reach }) {
    const pc = group(scene, [0.7, 0, 0], [0, 0.35, 0.12], 0.82);
    // body: hexagon prism
    const body = add(pc, new THREE.CylinderGeometry(0.26, 0.26, 1.5, 6), mat('#ffc928'), [0, 1.05, 0], [0, 0.5, 0]);
    add(pc, new THREE.CylinderGeometry(0.265, 0.265, 0.12, 6), mat('#2b6fd6'), [0, 0.45, 0], [0, 0.5, 0]);
    add(pc, new THREE.CylinderGeometry(0.265, 0.265, 0.12, 6), mat('#2b6fd6'), [0, 1.65, 0], [0, 0.5, 0]);
    cone(pc, mat('#f1c58b'), 0.26, 0.5, [0, 2.05 + 0.2, 0], [0, 0.5, 0]).scale.set(1, 1, 1);
    cone(pc, mat('#3a3d44', { roughness: 0.3 }), 0.07, 0.18, [0, 2.45, 0]);
    // eraser + ferrule at foot
    cyl(pc, mat('#bfc7d0', { metalness: 0.6, roughness: 0.3 }), 0.27, 0.22, [0, 0.19, 0]); cyl(pc, mat('#ff7b9c'), 0.24, 0.16, [0, 0.03, 0]);
    const l = label('EDIT', 0.5, 0.2, { bg: '#ffc928', fg: '#c01f1f' }); l.position.set(0.0, 1.15, 0.29 * 0.87); l.rotation.y = 0; l.rotation.set(0, 0, 0); pc.add(l);
    // three friends, little blob people
    [['#e5322d', 0.35, 0.95], ['#2fb24a', 1.15, 0.8], ['#7a4ad6', 1.55, 0.45]].forEach(([c, x, z]) => {
      const f = group(scene, [x, 0, z], [0, -0.3, 0], 1.0); blob(f, mat(c), [0, 0.3, 0], [0.24, 0.3, 0.22]); blob(f, mat('#f4c8a0'), [0, 0.7, 0], [0.2, 0.2, 0.19]);
      eyes(f, { y: 0.72, z: 0.17, gap: 0.075, r: 0.045 }); box(f, mat('#fff'), 0.12, 0.02, 0.02, [0, 0.62, 0.19]);
      cyl(f, mat('#f4c8a0'), 0.04, 0.3, [0.28, 0.45, 0.05], [0, 0, -0.9]);
    });
    reach('l', [-0.4, 1.0, 0.4]);
  } });
</script></body></html>
