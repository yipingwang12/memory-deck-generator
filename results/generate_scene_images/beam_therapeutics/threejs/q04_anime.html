<!doctype html>
<html><head><meta charset="utf-8"><title>Beam scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, run, mat, glow, add, blob, cyl, box, cone, group, label, eyes, coin, bubble, sack, flag, liver, animal } from "./common.js";
// q04 — Two postdocs, a COMMA (Komor) and a GAUDY clown (Gaudelli), invent base editing on the GIRDER.
run({ gAt: [-0.1, 0, -0.1], gRot: 0.0, gScale: 1.4, pose: { arms: { l: [0, 0.5, 0], r: [0, 0.5, 0] } }, cam: [0.1, 0.95, 4.2], look: [0.1, 0.72, 0],
  build({ scene }) {
    // COMMA person: a dark sphere head with a swooping tail
    const cm = group(scene, [-1.7, 0, 0.45], [0, 0.4, 0]);
    const ink = mat('#2d2a4a', { roughness: 0.4 });
    blob(cm, ink, [0, 1.0, 0], [0.38, 0.38, 0.34]);
    for (let i = 1; i <= 16; i++) { const t = i / 16; blob(cm, ink, [-0.08 - 0.28 * t * t - 0.05 * t, 0.85 - t * 0.78, 0], [0.3 - 0.2 * t, 0.12, 0.2 - 0.1 * t], [0, 0, 0.3 * t]); }
    eyes(cm, { x: 0, y: 1.02, z: 0.32, gap: 0.13, r: 0.07 }); const mo = add(cm, new THREE.TorusGeometry(0.06, 0.015, 8, 16, Math.PI), mat('#ffb0b0'), [0, 0.88, 0.34], [0, 0, Math.PI]);
    const lab = label(',', 0.3, 0.3, { bg: '#ffd21f', fg: '#2d2a4a' }); lab.position.set(0, 0.5, 0.2); lab.visible = false;
    // GAUDY clown
    const cl = group(scene, [1.35, 0, 0.35], [0, -0.45, 0], 1.25);
    add(cl, new THREE.ConeGeometry(0.34, 0.7, 28), mat('#ff3b6b'), [0, 0.5, 0]);
    for (const [x, y, c] of [[-0.1, 0.35, '#ffe14a'], [0.12, 0.5, '#2fa8ff'], [-0.03, 0.62, '#4adb7a'], [0.1, 0.28, '#ffe14a']]) blob(cl, mat(c), [x, y, 0.2], [0.06, 0.06, 0.06]);
    add(cl, new THREE.TorusGeometry(0.2, 0.06, 12, 28), mat('#ffffff'), [0, 0.86, 0], [Math.PI / 2, 0, 0]);
    blob(cl, mat('#fff5ee'), [0, 1.08, 0], [0.24, 0.25, 0.22]); blob(cl, mat('#e5322d'), [0, 1.04, 0.22], [0.06, 0.06, 0.06]);
    eyes(cl, { y: 1.13, z: 0.2, gap: 0.09, r: 0.05 }); add(cl, new THREE.TorusGeometry(0.1, 0.015, 8, 16, Math.PI), mat('#e5322d'), [0, 0.98, 0.2], [0, 0, Math.PI]);
    ['#ff3b6b', '#2fa8ff', '#ffe14a', '#4adb7a', '#ff8a1e', '#b04aff'].forEach((c, i) => { const a = (i / 6) * Math.PI * 2; blob(cl, mat(c), [Math.cos(a) * 0.3, 1.2 + Math.sin(a) * 0.1 + (i % 2) * 0.05, Math.sin(a) * 0.1 - 0.02], [0.14, 0.14, 0.14]); });
    cone(cl, mat('#2fa8ff'), 0.12, 0.28, [0, 1.5, 0]); blob(cl, mat('#ffe14a'), [0, 1.66, 0], [0.05, 0.05, 0.05]);
    for (const s of [-1, 1]) blob(cl, mat('#ffe14a'), [s * 0.14, 0.04, 0.12], [0.16, 0.06, 0.24]);
    // little wrenches, one each, aimed at the girder
    for (const [g, x, y, s] of [[cm, 0.4, 0.5, -1], [cl, -0.3, 0.45, 1]]) { cyl(g, mat('#9aa3ad', { metalness: 0.6 }), 0.03, 0.4, [x, y, 0.2], [0, 0, 0.9 * s]); }
    // sparkles of invention
    for (const [x, y] of [[-0.9, 1.9], [0.8, 1.95], [0.1, 2.0]]) blob(scene, glow('#fff176', 2), [x, y, -0.3], [0.06, 0.06, 0.06]);
  } });
</script></body></html>
