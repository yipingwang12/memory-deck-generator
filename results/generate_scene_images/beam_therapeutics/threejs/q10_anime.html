<!doctype html>
<html><head><meta charset="utf-8"><title>Beam scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, run, mat, glow, add, blob, cyl, box, cone, group, label, eyes, coin, bubble, sack, flag, liver, animal } from "./common.js";
// q10 — A FOX drags a sack of coins to buy the GIRDER's Series A.
run({ gAt: [-2.0, 0, 0.3], gRot: 0.35, gScale: 1.4, pose: { arms: { r: [0, 0.4, 0] } }, cam: [0.4, 1.0, 5.0], look: [0.4, 0.8, 0],
  build({ scene, reach }) {
    const fx = animal('fox'); fx.scale.setScalar(1.25); fx.position.set(0.4, 0, 0.5); fx.rotation.y = Math.PI; fx.rotation.z = 0; scene.add(fx);
    // rope from the fox's chest back to the sack
    cyl(scene, mat('#b0884a'), 0.025, 1.2, [1.7, 0.4, 0.5], [0, 0, Math.PI / 2 + 0.25], 8);
    const s = sack(scene, [2.5, 0, 0.5], 1.25, '$'); s.rotation.y = -0.3;
    for (const [x, z] of [[1.9, 0.9], [2.15, 1.1], [1.55, 1.0], [2.8, 1.0], [1.1, 1.2]]) coin(scene, [x, 0.03 + 0.001 * x, z], 0.13, [-Math.PI / 2 + 0.05, 0, 0]);
    coin(scene, [2.4, 1.3, 0.55], 0.16, [0, 0.5, 0]);
    // Series A banner on a pole by the girder
    const p = group(scene, [-0.95, 0, 0.3]); cyl(p, mat('#e8e2d6'), 0.025, 1.9, [0, 0.95, 0], [0, 0, 0], 8); box(p, mat('#2f7fe0'), 0.8, 0.95, 0.03, [0.42, 1.45, -0.02]); const b1 = label('SERIES', 0.72, 0.24, { bg: '#2f7fe0', fg: '#ffd21f' }); b1.position.set(0.42, 1.76, 0); p.add(b1); const b2 = label('A', 0.6, 0.6, { bg: '#2f7fe0', fg: '#ffffff' }); b2.position.set(0.42, 1.3, 0); p.add(b2);
    reach('l', [-0.4, 0.9, 0.45]);
  } });
</script></body></html>
