<!doctype html>
<html><head><meta charset="utf-8"><title>Beam scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, run, mat, glow, add, blob, cyl, box, cone, group, label, eyes, coin, bubble, sack, flag, liver, animal } from "./common.js";
// q07 — BEAM-302 on the GIRDER fixes alpha-1 antitrypsin deficiency.
run({ gAt: [-1.35, 0, 0.5], gRot: 0.45, gScale: 1.4, pose: { arms: { r: [0, 0.4, 0] } }, cam: [0.3, 1.0, 4.5], look: [0.4, 0.85, 0],
  build({ scene, reach, girder }) {
    const t = label('BEAM-302', 0.62, 0.2, { bg: '#ffffff', fg: '#c8401a', border: '#c8401a' }); t.position.set(0, 0.55, 0.285); t.scale.setScalar(0.95); girder.userData.parts.body.parent.add(t); t.position.y = 0.55;
    // stretcher + liver + big sign
    box(scene, mat('#f2f2f2'), 1.9, 0.12, 1.0, [1.2, 0.5, 0.2]); for (const x of [0.4, 2.0]) for (const z of [-0.2, 0.6]) cyl(scene, mat('#cfd6dd', { metalness: 0.5 }), 0.04, 0.5, [x, 0.25, z]);
    liver(scene, [1.2, 0.56, 0.2], 1.3);
    const sg = label('α1-AT', 1.6, 0.6, { bg: '#2f7fe0', fg: '#fff', border: '#fff' }); sg.position.set(1.4, 2.1, -0.4); scene.add(sg); for (const x of [0.7, 2.1]) cyl(scene, mat('#9aa3ad'), 0.03, 1.0, [x, 1.6, -0.42]);
    // wrench in the girder's hand touching the liver; fix sparkles + green check
    const w = group(scene, [0.1, 0.95, 0.6], [0, 0, -0.9]); cyl(w, mat('#9aa3ad', { metalness: 0.6 }), 0.035, 0.55, [0, 0, 0]); add(w, new THREE.TorusGeometry(0.09, 0.035, 8, 16, 4.6), mat('#9aa3ad', { metalness: 0.6 }), [0, 0.32, 0]);
    reach('l', [0.05, 0.85, 0.6]);
    for (const [x, y, z] of [[0.75, 1.5, 0.5], [1.5, 1.6, 0.6], [1.9, 1.35, 0.5], [0.95, 1.7, 0.2]]) blob(scene, glow('#fff176', 2), [x, y, z], [0.05, 0.05, 0.05]);
    const ck = label('OK', 0.5, 0.35, { bg: '#2fb24a', fg: '#fff' }); ck.position.set(1.9, 1.05, 0.62); scene.add(ck);
  } });
</script></body></html>
