<!doctype html>
<html><head><meta charset="utf-8"><title>Beam scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, run, mat, glow, add, blob, cyl, box, cone, group, label, eyes, coin, bubble, sack, flag, liver, animal } from "./common.js";
// q12 — The GIRDER holds up a BRIDGE in Cambridge.
run({ gAt: [0, 0, 0.05], gRot: 0.0, gScale: 1.4, pose: { arms: { l: [0, 2.9, 0], r: [0, 2.9, 0] } }, cam: [0.0, 1.4, 4.9], look: [0, 1.45, 0],
  build({ scene, reach }) {
    // river
    box(scene, mat('#3aa4e0', { emissive: '#1a78c0', emissiveIntensity: 0.3 }), 40, 0.02, 3.2, [0, 0.015, 0.3]);
    // deck, arch, rails, hangers
    box(scene, mat('#7b838c'), 4.8, 0.2, 1.1, [0, 1.74, 0]); box(scene, mat('#ffd21f'), 4.6, 0.012, 0.05, [0, 1.85, 0]);
    for (const z of [-0.5, 0.5]) { box(scene, mat('#3a4a5a'), 4.8, 0.06, 0.06, [0, 2.1, z]); for (let x = -2.2; x <= 2.21; x += 0.4) cyl(scene, mat('#3a4a5a'), 0.015, 0.22, [x, 2.0, z], [0, 0, 0], 8); }
    for (const z of [-0.5, 0.5]) add(scene, new THREE.TorusGeometry(2.1, 0.06, 10, 48, Math.PI), mat('#e5322d'), [0, 1.85, z], [0, 0, 0], [1, 0.45, 1]);
    for (const z of [-0.5, 0.5]) for (let x = -1.8; x <= 1.81; x += 0.45) { const h = 0.45 * Math.sqrt(2.1 * 2.1 - x * x); cyl(scene, mat('#9aa3ad'), 0.012, h - 0.05, [x, 1.85 + (h - 0.05) / 2, z], [0, 0, 0], 6); }
    // brick abutments + riverside buildings
    for (const s of [-1, 1]) { box(scene, mat('#a3472f'), 1.2, 1.55, 1.0, [s * 3.0, 0.78, 0]); box(scene, mat('#c96a43'), 1.5, 2.3, 1.2, [s * 3.9, 1.15, -1.3]); for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) box(scene, mat('#ffe9a8', { emissive: '#ffd27a', emissiveIntensity: 0.4 }), 0.18, 0.28, 0.02, [s * 3.9 + (i - 1) * 0.4, 0.6 + j * 0.7, -0.69]); }
    const cs = label('CAMBRIDGE', 1.9, 0.38, { bg: '#1f3a8a', fg: '#fff' }); cs.position.set(-1.35, 0.78, 1.2); scene.add(cs); for (const x of [-1.95, -0.75]) cyl(scene, mat('#9aa3ad'), 0.03, 0.7, [x, 0.35, 1.18]);
    // girder holds the deck up
    reach('l', [0.35, 1.62, 0.05]); reach('r', [-0.35, 1.62, 0.05]);
    for (const x of [-0.5, 0.5]) coin;
  } });
</script></body></html>
