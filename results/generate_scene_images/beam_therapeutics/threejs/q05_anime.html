<!doctype html>
<html><head><meta charset="utf-8"><title>Beam scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, run, mat, glow, add, blob, cyl, box, cone, group, label, eyes, coin, bubble, sack, flag, liver, animal } from "./common.js";
// q05 — The GIRDER swaps one DNA letter for another without cutting both strands.
const LET = { A: '#e5322d', T: '#2f7fe0', G: '#2fb24a', C: '#ffc21f' };
const block = (p, ch, pos, rot = [0, 0, 0]) => { const g = group(p, pos, rot); box(g, mat(LET[ch]), 0.26, 0.26, 0.26); const l = label(ch, 0.2, 0.2, { bg: LET[ch], fg: '#fff' }); l.position.z = 0.135; g.add(l); return g; };
run({ gAt: [-0.95, 0, 0.5], gRot: 0.5, gScale: 1.4, pose: { arms: { r: [0, 0.4, 0] } }, cam: [0.3, 1.1, 4.5], look: [0.4, 1.0, 0],
  build({ scene, reach }) {
    const h = group(scene, [0.55, 0, 0]), R = 0.42, K = 2 * Math.PI / 1.2, nt = '#9aa3ad';
    const pos = (y, s) => [s * R * Math.sin(K * y), y, s * R * Math.cos(K * y)];
    for (let y = 0.05; y < 2.15; y += 0.025) for (const s of [-1, 1]) blob(h, mat(s > 0 ? '#8a5ad6' : '#e86aa8'), pos(y, s), [0.045, 0.045, 0.045]);
    const seq = ['A', 'T', 'C', 'G', 'T', 'A'];
    [0.3, 0.6, 1.2, 1.5, 1.8].forEach((y, i) => { const a = new THREE.Vector3(...pos(y, 1)), b = new THREE.Vector3(...pos(y, -1)), m = a.clone().lerp(b, 0.5);
      for (const [from, ch] of [[a, seq[i]], [b, 'ATCG'['TAGC'.indexOf(seq[i])]]]) { const mid = from.clone().lerp(m, 0.5); const q = new THREE.Mesh(new THREE.BoxGeometry(from.distanceTo(m), 0.09, 0.09), mat(LET[ch])); q.position.copy(mid); q.lookAt(b); q.rotateY(Math.PI / 2); q.rotation.set(0, Math.atan2(-(from.z - m.z), from.x - m.x) * -1 + 0, 0); q.castShadow = true; h.add(q); } });
    // the swapped rung at y = 0.9 (strands at x = +-R, edge-on to the camera): old A popped out, new G slotted in, backbone intact
    cyl(h, mat(LET.T), 0.045, R * 0.9, [-R * 0.5, 0.9, 0], [0, 0, Math.PI / 2]); const g2 = block(h, 'G', [R * 0.5, 0.9, 0.0]); g2.scale.setScalar(1.35);
    const old = block(h, 'A', [1.05, 1.35, 0.5], [0.3, 0.4, 0.5]); old.scale.setScalar(1.5);
    for (const [x, y, z] of [[0.7, 0.95, 0.4], [0.85, 1.15, 0.45], [0.95, 1.3, 0.2]]) blob(h, glow('#fff176', 2), [x, y, z], [0.035, 0.035, 0.035]);
    h.updateMatrixWorld(true); reach('l', h.localToWorld(new THREE.Vector3(0.1, 0.8, 0.4)).toArray());
  } });
</script></body></html>
