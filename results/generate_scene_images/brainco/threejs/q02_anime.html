<!doctype html>
<html><head><meta charset="utf-8"><title>Brainco q02 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — The COCONUT falls from a HARVARD innovation tree.
import { THREE, guard, rng, canvasTexture, mat, glow, add, blob, box, cyl, plane, textPlane, makeStage, placeCoconut, reachWorld, finish, palmTree, skyline, junk } from './common.js';
guard(() => {
  const { stage, num, scene } = makeStage({ sky: { cover: 1.2 } });
  plane(scene, mat('#6fae45'), [0, 0, 0], 400, 400);
  plane(scene, mat('#d9c9a0'), [0, 0.004, 1.5], 400, 1.4);
  // old brick school with crimson banner
  const brick = canvasTexture(256, (ctx, s) => { ctx.fillStyle = '#a4423a'; ctx.fillRect(0, 0, s, s); ctx.fillStyle = '#7e2e28'; for (let y = 0; y < s; y += 16) { ctx.fillRect(0, y, s, 2); for (let x = (y / 16 % 2) * 16; x < s; x += 32) ctx.fillRect(x, y, 2, 16); } });
  const school = new THREE.Mesh(new THREE.BoxGeometry(9, 3, 2), new THREE.MeshStandardMaterial({ map: brick, roughness: 0.8 })); school.position.set(1.5, 1.5, -6); school.castShadow = true; scene.add(school);
  box(scene, mat('#f2efe6'), [1.5, 3.05, -6], [9.4, 0.15, 2.4]);
  add(scene, new THREE.ConeGeometry(0.9, 1.2, 4), mat('#f2efe6'), [1.5, 3.8, -6], [0, Math.PI / 4, 0]);
  for (let i = 0; i < 6; i++) box(scene, mat('#f6e7a8'), [-1.8 + i * 1.3, 1.6, -4.95], [0.6, 0.9, 0.05]);
  // innovation tree: leafy tree hung with light bulbs
  const tree = new THREE.Group(); tree.position.set(-1.9, 0, -1.2); scene.add(tree);
  cyl(tree, mat('#8a5a34'), [0, 1.3, 0], 0.3, 2.6, [0, 0, 0], 0.2);
  for (const [x, y, z, s] of [[0, 3.1, 0, 1.3], [-0.9, 2.7, 0.2, 0.9], [0.9, 2.8, -0.1, 1.0], [0.2, 3.8, 0, 0.8]]) blob(tree, mat('#4f9d3b'), [x, y, z], [s, s * 0.8, s]);
  for (const [x, y, z] of [[-0.9, 2.1, 0.8], [0.6, 2.3, 0.9], [1.4, 2.5, 0.4], [-1.5, 2.6, 0.5], [0.1, 2.0, 1.0]]) {
    cyl(tree, mat('#333'), [x, y + 0.2, z], 0.005, 0.4);
    blob(tree, glow('#ffe650', 2.5), [x, y, z], [0.22, 0.28, 0.22]); cyl(tree, mat('#8a8f99'), [x, y - 0.28, z], 0.08, 0.12);
  }
  // crimson HARVARD sign nailed to the trunk
  const sign = textPlane('HARVARD', 1.5, 0.5, { bg: '#a51c30', fg: '#fff', font: 'bold 190px serif' }); sign.position.set(-1.9, 1.5, -0.88); scene.add(sign);
  const c = placeCoconut(scene, { scale: 1.45, x: 0.5, y: 0.9, z: 0.3, ry: -0.3 });
  c.rotation.z = 0.35; c.userData.pose({ arms: { l: [0, 2.6, 0], r: [0, 2.6, 0] }, legs: { l: [0.5, 0.4], r: [-0.4, -0.4] } });
  for (let i = 0; i < 4; i++) box(scene, mat('#ffffff'), [0.2 + i * 0.28, 2.75, 0.1], [0.04, 0.45, 0.02]);
  finish(stage, scene, num, [c], { cam: [-0.2, 1.7, 5.0], look: [-0.2, 1.7, 0] });
});
</script></body></html>
