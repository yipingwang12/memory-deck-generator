<!doctype html>
<html><head><meta charset="utf-8"><title>Brainco q03 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q03 — The COCONUT floats to HANGZHOU's West Lake.
import { THREE, guard, rng, canvasTexture, mat, glow, add, blob, box, cyl, plane, textPlane, makeStage, placeCoconut, reachWorld, finish, palmTree, skyline, junk } from './common.js';
guard(() => {
  const { stage, num, scene } = makeStage({ sky: { cover: 0.8 }, });
  plane(scene, mat('#6fae45'), [0, 0, -30], 400, 100);
  const lake = plane(scene, mat('#4fb3a8', { roughness: 0.2, metalness: 0.2 }), [0, 0.02, 0], 400, 400);
  // Leifeng-style pagoda on a hill
  const hill = blob(scene, mat('#5b9a4a'), [-3.6, 0, -9], [6, 3.2, 4]);
  const pg = new THREE.Group(); pg.position.set(-3.6, 3.0, -9); scene.add(pg);
  for (let i = 0; i < 5; i++) {
    const w = 1.5 - i * 0.2;
    box(pg, mat('#b5462f'), [0, i * 0.85 + 0.4, 0], [w, 0.7, w]);
    add(pg, new THREE.ConeGeometry(w * 0.95, 0.3, 4), mat('#3a3a40'), [0, i * 0.85 + 0.9, 0], [0, Math.PI / 4, 0]);
  }
  cyl(pg, mat('#e0b040'), [0, 4.7, 0], 0.04, 0.8);
  // arched stone bridge
  const bridge = new THREE.Group(); bridge.position.set(3.0, 0, -4); scene.add(bridge);
  const stone = mat('#d8d3c6');
  add(bridge, new THREE.TorusGeometry(1.1, 0.25, 12, 28, Math.PI), stone, [0, 0.35, 0], [0, 0, 0], [1.6, 0.8, 1.4]);
  box(bridge, stone, [0, 1.25, 0], [3.8, 0.12, 1.2]);
  for (const x of [-1.8, 1.8]) box(bridge, stone, [x, 0.6, 0], [0.4, 1.2, 1.1]);
  // willows
  const r = rng(6);
  for (const [x, z] of [[-1.6, -3.5], [1.2, -5], [5.5, -3], [-5.5, -2]]) {
    cyl(scene, mat('#6a4a2a'), [x, 1.0, z], 0.14, 2.0, [0, 0, 0], 0.1);
    blob(scene, mat('#7cb84a'), [x, 2.2, z], [0.9, 0.5, 0.9]);
    for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28; cyl(scene, mat('#8fc860'), [x + Math.sin(a) * 0.85, 1.5, z + Math.cos(a) * 0.85], 0.025, 1.3); }
  }
  // wooden sign
  cyl(scene, mat('#6a4a2a'), [-1.9, 0.5, 1.2], 0.06, 1.0);
  const sign = textPlane('HANGZHOU', 1.5, 0.45, { bg: '#e8d5a8', fg: '#7a1d1d', font: 'bold 160px serif' }); sign.position.set(-1.9, 1.05, 1.25); scene.add(sign);
  // coconut floating on lotus leaf with lotus
  const c = placeCoconut(scene, { scale: 1.9, x: 0.2, y: 0.1, z: 0.9, ry: -0.2 });
  c.userData.pose({ arms: { l: [0, 1.6, 0.2], r: [0, 1.0, 0] }, legs: { l: [0.9, 0.2], r: [0.9, -0.2] } });
  cyl(scene, mat('#3f9b5a'), [0.2, 0.05, 0.9], 1.0, 0.04);
  for (const [x, z] of [[-1.0, 1.6], [1.5, 1.3], [-0.4, 2.0], [1.6, 2.1]]) { cyl(scene, mat('#3f9b5a'), [x, 0.04, z], 0.4, 0.03); blob(scene, mat('#ff9ec4'), [x + 0.1, 0.12, z], [0.14, 0.1, 0.14]); }
  // ripples
  for (const s of [1.3, 1.7, 2.2]) add(scene, new THREE.RingGeometry(s, s + 0.03, 40), mat('#d8f4ef'), [0.2, 0.035, 0.9], [-Math.PI / 2, 0, 0]);
  finish(stage, scene, num, [c], { cam: [0.4, 2.2, 6.6], look: [0.1, 2.1, 0] });
});
</script></body></html>
