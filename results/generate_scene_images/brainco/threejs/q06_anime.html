<!doctype html>
<html><head><meta charset="utf-8"><title>Brainco q06 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — An ID card (IDG) and a WALDEN pond lead the COCONUT's huge private round.
import { THREE, guard, rng, canvasTexture, mat, glow, add, blob, box, cyl, plane, textPlane, makeStage, placeCoconut, reachWorld, finish, palmTree, skyline, junk } from './common.js';
guard(() => {
  const { stage, num, scene } = makeStage({ sky: { cover: 1.0 } });
  plane(scene, mat('#6fae45'), [0, 0, 0], 400, 400);
  // WALDEN pond with Thoreau cabin and pines
  plane(scene, mat('#3a9fc0', { roughness: 0.2 }), [2.4, 0.02, -3.0], 9, 4.5).geometry = new THREE.CircleGeometry(3.2, 48);
  scene.children[scene.children.length - 1].scale.set(1.4, 0.8, 1);
  const cabin = new THREE.Group(); cabin.position.set(-0.9, 0, -5.4); scene.add(cabin);
  box(cabin, mat('#a8723c'), [0, 0.5, 0], [1.6, 1.0, 1.2]);
  add(cabin, new THREE.ConeGeometry(1.2, 0.7, 4), mat('#6a3e22'), [0, 1.35, 0], [0, Math.PI / 4, 0], [1, 1, 0.8]);
  box(cabin, mat('#4a2a14'), [0, 0.35, 0.61], [0.35, 0.7, 0.03]);
  for (const [x, z, h] of [[-3.8, -4.5, 3.2], [5.6, -4.5, 3.6], [4.4, -6.5, 3], [-2.6, -6.8, 3.4]]) { cyl(scene, mat('#5a3a20'), [x, 0.4, z], 0.12, 0.8); for (let i = 0; i < 3; i++) add(scene, new THREE.ConeGeometry(0.9 - i * 0.22, h / 2.2, 10), mat('#2f7a42'), [x, 1.0 + i * h * 0.27, z]); }
  // giant ID card standing on the left
  const idc = new THREE.Group(); idc.position.set(-2.5, 1.35, 0.3); idc.rotation.y = 0.35; scene.add(idc);
  box(idc, mat('#f4f7ff'), [0, 0, 0], [1.9, 1.2, 0.06]);
  box(idc, mat('#3358c4'), [0, 0.5, 0.035], [1.9, 0.2, 0.01]);
  blob(idc, mat('#e8b890'), [-0.55, 0.0, 0.04], [0.28, 0.32, 0.02]); blob(idc, mat('#3358c4'), [-0.55, -0.4, 0.04], [0.4, 0.2, 0.02]);
  const idg = textPlane('IDG', 0.8, 0.4, { bg: '#f4f7ff', fg: '#1b2f7a', font: 'bold 340px sans-serif' }); idg.position.set(0.4, 0.0, 0.04); idc.add(idg);
  for (const y of [-0.3, -0.45]) box(idc, mat('#b9c3dc'), [0.4, y, 0.04], [0.8, 0.07, 0.01]);
  const hole = box(idc, mat('#999'), [0, 0.5, 0.04], [0.3, 0.05, 0.01]);
  cyl(scene, mat('#777'), [-2.5, 0.4, 0.2], 0.05, 0.8);
  // huge private round: ring of gold coins + velvet rope
  const gold = mat('#ffcf3a', { metalness: 0.5, roughness: 0.3 });
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; cyl(scene, gold, [Math.sin(a) * 1.3, 0.12 + (i % 2) * 0.0, 1.0 + Math.cos(a) * 0.5 * 1.3 - 0.0], 0.32, 0.07, [0.3, 0, 0]); }
  for (let i = 0; i < 6; i++) cyl(scene, gold, [1.9 + (i % 2) * 0.03, 0.1 + Math.floor(i / 2) * 0.08, 0.2 + (i % 2) * 0.1], 0.25, 0.07);
  for (const x of [-1.9, 1.9]) { cyl(scene, mat('#d4a62a', { metalness: 0.6 }), [x, 0.45, 2.1], 0.04, 0.9); blob(scene, gold, [x, 0.92, 2.1], [0.08, 0.08, 0.08]); }
  add(scene, new THREE.TorusGeometry(1.9, 0.03, 8, 40, Math.PI * 0.4), mat('#b01e2c'), [0, 0.8, 2.1], [0, 0, Math.PI * 1.3], [1, 0.3, 1]);
  cyl(scene, mat('#6a4a2a'), [3.0, 0.5, -1.2], 0.05, 1.0);
  const wal = textPlane('WALDEN', 1.4, 0.42, { bg: '#e8d5a8', fg: '#3a2a14', font: 'bold 170px serif' }); wal.position.set(3.0, 1.05, -1.15); scene.add(wal);
  const c = placeCoconut(scene, { scale: 1.6, x: 0.1, z: 1.0, ry: -0.1 });
  c.userData.pose({ arms: { l: [0, 1.7, 0], r: [0, 1.7, 0] }, legs: { l: [0, 0.1], r: [0, -0.1] } });
  finish(stage, scene, num, [c], { cam: [-0.2, 1.6, 6.2], look: [-0.2, 1.4, 0] });
});
</script></body></html>
