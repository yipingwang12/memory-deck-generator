<!doctype html>
<html><head><meta charset="utf-8"><title>Brainco q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — A BEACH HAND plants a flag on the COCONUT.
import { THREE, guard, rng, canvasTexture, mat, glow, add, blob, box, cyl, plane, textPlane, makeStage, placeCoconut, reachWorld, finish, palmTree, skyline, junk } from './common.js';
guard(() => {
  const { stage, num, scene } = makeStage({ sky: { cover: 1.2 } });
  plane(scene, mat('#f0d596'), [0, 0, 0], 400, 400);
  plane(scene, mat('#3aa7c9', { roughness: 0.3 }), [0, 0.004, -22], 400, 40);
  plane(scene, mat('#bfeaf0'), [0, 0.006, -3.2], 400, 0.5);
  const r = rng(3);
  for (let i = 0; i < 40; i++) blob(scene, mat(['#fff', '#f5b8c8', '#f8e0b0'][i % 3]), [(r() - 0.5) * 9, 0.03, -2 + r() * 3], [0.06, 0.03, 0.05]);
  const p = palmTree(3.4, 0.25); p.position.set(-2.6, 0, -1.5); scene.add(p);
  const p2 = palmTree(2.8, -0.2); p2.position.set(3.2, 0, -2.5); scene.add(p2);
  // beach umbrella + ball
  cyl(scene, mat('#eee'), [2.2, 0.7, -0.8], 0.02, 1.4);
  add(scene, new THREE.ConeGeometry(0.9, 0.35, 24), mat('#e8453c'), [2.2, 1.5, -0.8]);
  blob(scene, mat('#ffcf3a'), [-1.2, 0.18, 0.8], [0.18, 0.18, 0.18]);
  const c = placeCoconut(scene, { scale: 1.45, x: 1.5 - 1.95 * Math.sin(0.55), z: -0.1, ry: 0.3 });
  c.userData.pose({ arms: { l: [0, 1.9, 0.3], r: [0, 1.9, 0.3] }, legs: { l: [0, 0.1], r: [0, -0.1] } });
  // giant HAND rising from the sand, gripping the flagpole planted in the coconut's top
  const skin = mat('#f2c39a'), hand = new THREE.Group(); hand.position.set(1.5, 0, -0.1); hand.rotation.z = 0.55; scene.add(hand);
  cyl(hand, skin, [0, 0.9, 0], 0.2, 1.8, [0, 0, 0], 0.15);
  blob(hand, skin, [0, 1.95, 0], [0.27, 0.27, 0.24]);
  for (let i = 0; i < 4; i++) blob(hand, skin, [0, 1.84 + i * 0.1, 0.2], [0.1, 0.055, 0.07]);
  blob(hand, skin, [-0.2, 2.0, 0.12], [0.09, 0.11, 0.08]);
  const px = 1.5 - 1.95 * Math.sin(0.55);
  cyl(scene, mat('#f4f4f4'), [px, 1.95, -0.1], 0.02, 1.4);
  box(scene, mat('#e0242c'), [px - 0.42, 2.35, -0.1], [0.8, 0.5, 0.03]);
  blob(scene, mat('#ffd93a'), [px - 0.42, 2.35, -0.07], [0.1, 0.1, 0.01]);
  finish(stage, scene, num, [c], { cam: [0.3, 1.25, 3.6], look: [0.3, 1.25, 0] });
});
</script></body></html>
