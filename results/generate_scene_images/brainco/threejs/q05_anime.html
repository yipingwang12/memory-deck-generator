<html><head><meta charset="utf-8"><title>Brainco q05 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — Brain signals move the COCONUT's BIONIC hand.
import { THREE, guard, rng, canvasTexture, mat, glow, add, blob, box, cyl, plane, textPlane, makeStage, placeCoconut, reachWorld, finish, palmTree, skyline, junk } from './common.js';
guard(() => {
  const { stage, num, scene } = makeStage({ sky: { cover: 0.6 } });
  plane(scene, mat('#f3e3c4'), [0, 0, 0], 400, 400);
  box(scene, mat('#fbf3e2'), [0, 2.0, -3.5], [14, 6, 0.2]);
  const c = placeCoconut(scene, { scale: 1.7, x: -0.8, z: 0.2, ry: 0.15 });
  c.userData.pose({ arms: { l: [0, 2.3, 0], r: [0, 0.5, 0] }, legs: { l: [0, 0.1], r: [0, -0.1] } });
  // bionic hand replacing the left mitten: metal palm, jointed fingers, glowing seams
  const el = c.userData.parts.elbows.l; c.userData.parts.hands.l.visible = false;
  const metal = mat('#c9d4e0', { metalness: 0.7, roughness: 0.3 }), dark = mat('#2d3a52', { metalness: 0.5 });
  const hand = new THREE.Group(); hand.position.y = -0.13; hand.scale.setScalar(2.4); el.add(hand);
  box(hand, metal, [0, -0.05, 0], [0.13, 0.1, 0.05]); box(hand, glow('#38e8ff', 2), [0, -0.005, 0.027], [0.12, 0.012, 0.004]);
  for (let i = 0; i < 4; i++) { const x = (i - 1.5) * 0.034, len = 0.07 - (i === 0 || i === 3 ? 0.01 : 0);
    for (let k = 0; k < 2; k++) { cyl(hand, metal, [x, -0.1 - k * (len + 0.004) - len / 2, 0.01 * k], 0.013, len); blob(hand, glow('#38e8ff', 2), [x, -0.1 - k * (len + 0.004), 0.01 * k], [0.014, 0.014, 0.014]); } }
  cyl(hand, metal, [0.085, -0.04, 0.0], 0.014, 0.07, [0, 0, -0.9]);
  // brain with glowing signal arcs down to the hand
  const brain = new THREE.Group(); brain.position.set(0.9, 2.5, -0.2); scene.add(brain);
  const pink = mat('#f08fa6', { roughness: 0.55 });
  for (const sx of [-1, 1]) { blob(brain, pink, [sx * 0.2, 0, 0], [0.38, 0.32, 0.45]); for (let i = 0; i < 9; i++) blob(brain, pink, [sx * (0.1 + 0.2 * Math.cos(i)), 0.2 * Math.sin(i * 2.1) , 0.3 * Math.cos(i * 1.3)], [0.1, 0.1, 0.1]); }
  blob(brain, mat('#d46c88'), [0, -0.3, -0.05], [0.12, 0.16, 0.12]);
  const sig = glow('#38e8ff', 2.2);
  for (let i = 0; i < 14; i++) { const t = i / 13; const x = 0.9 + (0.5 - 0.9) * t + Math.sin(t * 9) * 0.1, y = 2.2 + (1.7 - 2.2) * t, z = -0.1 + (0.5 + 0.1) * t; blob(scene, sig, [x, y, z], [0.045 - t * 0.01, 0.045 - t * 0.01, 0.045 - t * 0.01]); }
  for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28; box(brain, sig, [Math.cos(a) * 0.7, Math.sin(a) * 0.55, 0.1], [0.12, 0.025, 0.025], [0, 0, a]); }
  // ball being grabbed
  blob(scene, mat('#ffcf3a'), [1.3, 2.0, 0.5], [0.17, 0.17, 0.17]);
  finish(stage, scene, num, [c], { cam: [0.1, 1.5, 5.0], look: [0.1, 1.5, 0] });
});
</script></body></html>
