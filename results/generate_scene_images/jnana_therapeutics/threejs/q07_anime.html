<html><head><meta charset="utf-8"><title>Jnana q07 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — BANANA's pill is the first small molecule to block that ferry in human trials.
import { guard, rng } from './kit.js';
import { THREE, mat, add, blob, cyl, box, textPlane, makeStage, ground, finishScene, createBanana } from './common.js';

function ferry(len = 1.5) {
  const g = new THREE.Group();
  const hull = mat('#2c6fd1'), white = mat('#fff7ea'), red = mat('#e0463c');
  const sh = new THREE.Shape(); sh.moveTo(-len / 2, 0); sh.lineTo(len / 2 - 0.2, 0); sh.quadraticCurveTo(len / 2 + 0.25, 0.1, len / 2 + 0.3, 0.32); sh.lineTo(-len / 2 - 0.05, 0.32); sh.lineTo(-len / 2, 0);
  const hg = new THREE.ExtrudeGeometry(sh, { depth: 0.5, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 2 }); hg.translate(0, 0, -0.25);
  add(g, hg, hull);
  box(g, red, [0, 0.33, 0], [len + 0.1, 0.04, 0.52]);
  box(g, white, [-0.15, 0.58, 0], [len * 0.55, 0.38, 0.42]);
  for (let i = 0; i < 4; i++) for (const s of [-1, 1]) blob(g, mat('#7fd0ff', { roughness: 0.2 }), [-0.4 + i * 0.22, 0.62, s * 0.215], [0.05, 0.06, 0.012]);
  cyl(g, red, [-0.25, 0.95, 0], 0.1, 0.35); cyl(g, mat('#222'), [-0.25, 1.14, 0], 0.105, 0.05);
  // cargo crates: salt (white cubes) + sugar (pink cubes)
  box(g, mat('#ffffff'), [0.5, 0.45, 0.1], [0.2, 0.2, 0.2]); box(g, mat('#ffc2d4'), [0.5, 0.45, -0.12], [0.2, 0.2, 0.2]); box(g, mat('#f5f5f5'), [0.5, 0.65, 0], [0.18, 0.18, 0.18]);
  // flag
  cyl(g, mat('#555'), [-0.55, 1.0, 0], 0.01, 0.5); box(g, mat('#ffd51f'), [-0.46, 1.17, 0], [0.18, 0.1, 0.01]);
  return g;
}


function pill(len = 1.3, r = 0.38) {
  const g = new THREE.Group(), a = mat('#e8433c', { roughness: 0.25 }), b = mat('#fafafa', { roughness: 0.25 });
  cyl(g, a, [len / 4, 0, 0], r, len / 2, [0, 0, Math.PI / 2]); cyl(g, b, [-len / 4, 0, 0], r, len / 2, [0, 0, Math.PI / 2]);
  blob(g, a, [len / 2, 0, 0], [r, r, r]); blob(g, b, [-len / 2, 0, 0], [r, r, r]);
  blob(g, mat('#ffffff', { roughness: 0.1, transparent: true, opacity: 0.8 }), [len / 4, r * 0.65, r * 0.5], [0.3, 0.05, 0.05]);
  return g;
}
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { fov: 38 }); const scene = stage.scene;
  ground(scene, '#e6cf9d');
  add(scene, new THREE.PlaneGeometry(400, 12), mat('#2e9fd6', { roughness: 0.15 }), [0, 0.02, -9], [-Math.PI / 2, 0, 0]);
  const f = ferry(2.4); f.scale.setScalar(1.7); f.position.set(2.8, 0.05, -5.2); f.rotation.y = -0.2; scene.add(f);
  for (let i = 0; i < 6; i++) box(scene, mat(i % 2 ? '#fff' : '#e0302c'), [0.7 + i * 0.4, 1.0, -4.0], [0.4, 0.16, 0.1]);
  for (const x of [0.5, 3.1]) cyl(scene, mat('#e0302c'), [x, 0.5, -4.0], 0.1, 1.0);
  // winner's podium
  const pod = new THREE.Group(); pod.position.set(-1.4, 0, 0.2); scene.add(pod);
  box(pod, mat('#f4c430'), [0, 0.45, 0], [2.2, 0.9, 1.2]); box(pod, mat('#d9a920'), [0, 0.92, 0], [2.3, 0.06, 1.3]);
  const one = textPlane('1', 0.8, 0.8, { fg: '#ffffff' }); one.position.set(0, 0.45, 0.61); pod.add(one);
  box(pod, mat('#c0c8d8'), [-2.0, 0.3, 0.0], [1.8, 0.6, 1.1]); box(pod, mat('#c98a50'), [2.0, 0.22, 0.0], [1.8, 0.44, 1.1]);
  const pl = pill(); pl.position.set(-1.4, 3.75, 0.3); pl.rotation.set(0, 0, 0.25); pl.scale.setScalar(1.0); scene.add(pl);
  const banana = createBanana({ scale: 2.4 }); banana.position.set(-1.4, 0.95, 0.2); banana.rotation.y = 0.0; scene.add(banana);
  banana.userData.pose({ lean: -0.05, legs: { l: [0.0, 0.1], r: [0, -0.1] } });
  banana.updateMatrixWorld(true);
  const h = banana.worldToLocal(new THREE.Vector3(-1.85, 3.3, 0.35)); banana.userData.reach('l', [h.x, h.y, h.z]);
  const h2 = banana.worldToLocal(new THREE.Vector3(-0.95, 3.3, 0.4)); banana.userData.reach('r', [h2.x, h2.y, h2.z]);
  finishScene(stage, P, banana, { pos: [-0.2, 2.8, 7.5], look: [0.0, 2.15] });
});
</script></body></html>
