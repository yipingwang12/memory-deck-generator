<!doctype html>
<html><head><meta charset="utf-8"><title>Jnana q09 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q09 — The BANANA ripens in a TEA chest in Boston.
import { guard, rng } from './kit.js';
import { THREE, mat, add, blob, cyl, box, textPlane, makeStage, ground, finishScene, createBanana } from './common.js';

function ship() {
  const g = new THREE.Group(), wood = mat('#7a4a28'), sail = mat('#f6efd8');
  const sh = new THREE.Shape(); sh.moveTo(-1.6, 0.6); sh.lineTo(-1.3, 0); sh.lineTo(1.2, 0); sh.lineTo(1.9, 0.6); sh.lineTo(-1.6, 0.6);
  const hg = new THREE.ExtrudeGeometry(sh, { depth: 0.8, bevelEnabled: false }); hg.translate(0, 0, -0.4); add(g, hg, wood);
  for (const [x, h] of [[-0.8, 3.6], [0.2, 4.2], [1.0, 3.2]]) {
    cyl(g, wood, [x, 0.6 + h / 2, 0], 0.05, h);
    box(g, sail, [x, 0.6 + h * 0.62, 0.05], [0.9 + h * 0.05, h * 0.5, 0.04]);
  }
  return g;
}
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { fov: 38, el: 20, az: 170, sky: { zenith: '#5b8fd6', horizon: '#ffd9a8', cover: 1.2, seed: 4, towerTop: 0.4, puffCover: 1.2 } }); const scene = stage.scene;
  ground(scene, '#b8a07a');
  add(scene, new THREE.PlaneGeometry(400, 60), mat('#2a7fb8', { roughness: 0.15 }), [0, 0.02, -34], [-Math.PI / 2, 0, 0]);
  const sh = ship(); sh.position.set(4.5, 0.05, -9); sh.scale.setScalar(1.4); sh.rotation.y = -0.3; scene.add(sh);
  // Boston skyline: brick blocks + gold-domed State House
  const r = rng(8);
  for (let i = 0; i < 9; i++) { const h = 2 + r() * 3.5; box(scene, mat(['#b5503c', '#c8654a', '#a04632'][i % 3]), [-9 + i * 2.0, h / 2, -14], [1.6, h, 1.4]); }
  box(scene, mat('#b5503c'), [-4.0, 1.5, -13], [3, 3, 1.5]); blob(scene, mat('#ffcf3a', { metalness: 0.6, roughness: 0.3 }), [-4.0, 3.3, -13], [0.8, 0.7, 0.8]);
  // tea chest, open, with tea leaves
  const ch = new THREE.Group(); ch.position.set(0.1, 0, 0.2); scene.add(ch);
  const wood = mat('#a8703a'), dark = mat('#6a3f1d');
  box(ch, wood, [0, 0.6, 0.0], [2.2, 1.2, 1.4]);
  for (const y of [0.3, 0.9]) box(ch, dark, [0, y, 0.715], [2.24, 0.08, 0.04]);
  for (const x of [-1.0, 1.0]) box(ch, dark, [x, 0.6, 0.715], [0.1, 1.24, 0.04]);
  box(ch, mat('#4a8a3a'), [0, 1.2, 0], [2.0, 0.08, 1.2]); // tea leaves heap
  const lab = textPlane('TEA', 1.4, 0.5, { fg: '#fff2c0' }); lab.position.set(0, 0.62, 0.74); ch.add(lab);
  const banana = createBanana({ scale: 2.1, green: 0.3 }); banana.position.set(0.1, 1.0, 0.0); scene.add(banana);
  banana.userData.pose({ lean: 0.03, tilt: -0.03 });
  banana.userData.reach('l', [0.45, 0.9, 0.3]); banana.userData.reach('r', [-0.45, 0.9, 0.3]);
  finishScene(stage, P, banana, { pos: [0.0, 2.0, 5.7], look: [0.0, 1.55] });
});
</script></body></html>
