<!doctype html>
<html><head><meta charset="utf-8"><title>Jnana q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — BANANA dips chemical hooks into a soup of proteins to see where they bite (chemoproteomics).
import { guard, rng } from './kit.js';
import { THREE, mat, add, blob, cyl, box, makeStage, ground, finishScene, createBanana } from './common.js';

guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P); const scene = stage.scene;
  ground(scene, '#e9c98f');
  // big soup pot
  const pot = new THREE.Group(); pot.position.set(0.7, 0, -0.2); scene.add(pot);
  const iron = mat('#3b3f4a', { metalness: 0.5, roughness: 0.4 });
  const pts = [[0, 0], [0.55, 0.0], [0.7, 0.1], [0.78, 0.5], [0.8, 0.9], [0.76, 0.93], [0.7, 0.9]].map(([x, y]) => new THREE.Vector2(x, y));
  add(pot, new THREE.LatheGeometry(pts, 40), iron).material.side = THREE.DoubleSide;
  add(pot, new THREE.TorusGeometry(0.78, 0.04, 10, 40), iron, [0, 0.92, 0], [Math.PI / 2, 0, 0]);
  add(pot, new THREE.CircleGeometry(0.74, 40), mat('#2fb8a8', { roughness: 0.25 }), [0, 0.8, 0], [-Math.PI / 2, 0, 0]);
  for (const s of [-1, 1]) add(pot, new THREE.TorusGeometry(0.09, 0.025, 8, 20), iron, [s * 0.86, 0.7, 0], [0, 0, 0]);
  // protein blobs in soup (lumpy coloured shapes)
  const r = rng(11), cols = ['#ff6f91', '#7a6cff', '#ffb347', '#6fd16f', '#ff5c5c', '#4fc3f7'];
  for (let i = 0; i < 14; i++) {
    const a = r() * 6.28, d = r() * 0.55;
    const g = new THREE.Group(); g.position.set(Math.cos(a) * d, 0.84, Math.sin(a) * d * 0.9); pot.add(g);
    const c = mat(cols[i % 6], { roughness: 0.4 }), s = 0.1 + r() * 0.06;
    blob(g, c, [0, 0, 0], [s, s * 0.9, s]); blob(g, c, [s * 0.8, s * 0.2, 0], [s * 0.6, s * 0.6, s * 0.6]); blob(g, c, [-s * 0.3, s * 0.3, s * 0.7], [s * 0.5, s * 0.5, s * 0.5]);
  }
  // the protein that bites: big, hooked, with eyes-free open mouth sensation -> just a bigger pink blob on the hook
  const bite = new THREE.Group(); bite.position.set(0.75, 1.0, 0.38); bite.scale.setScalar(1.5); pot.add(bite);
  blob(bite, mat('#ff6f91', { roughness: 0.4 }), [0, 0, 0], [0.2, 0.17, 0.2]); blob(bite, mat('#ff6f91'), [0.17, 0.05, 0], [0.12, 0.12, 0.12]);
  blob(bite, mat('#ffd1dc'), [0.04, 0.1, 0.17], [0.07, 0.05, 0.03]);
  // steam-less ladle rim: bubbles
  for (let i = 0; i < 6; i++) blob(pot, mat('#bdf3ea', { roughness: 0.2 }), [(r() - 0.5) * 1.2, 0.82, (r() - 0.5) * 1.0], [0.04, 0.03, 0.04]);
  // fishing rod + line + chemical hook (hook carries a hexagon molecule)
  const rod = new THREE.Group(); scene.add(rod);
  cyl(rod, mat('#8a5a2b'), [-0.35, 1.5, 0.45], 0.022, 2.2, [0, 0, -0.52], 0.012);
  const line = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 1, 6), mat('#ffffff'));
  const A = new THREE.Vector3(0.2, 2.46, 0.45), Bp = new THREE.Vector3(0.62, 1.55, 0.38);
  line.position.copy(A).add(Bp).multiplyScalar(0.5); line.scale.y = A.distanceTo(Bp);
  line.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), A.clone().sub(Bp).normalize()); scene.add(line);
  const hook = new THREE.Group(); hook.position.set(0.62, 1.2, 0.38); hook.scale.setScalar(1.6); scene.add(hook);
  const steel = mat('#d8dde4', { metalness: 0.7, roughness: 0.25 });
  add(hook, new THREE.TorusGeometry(0.13, 0.022, 10, 28, Math.PI * 1.5), steel, [0, -0.1, 0], [0, 0, Math.PI * 0.75]);
  cyl(hook, steel, [0, 0.1, 0], 0.022, 0.22);
  add(hook, new THREE.ConeGeometry(0.03, 0.08, 10), steel, [-0.095, -0.17, 0], [0, 0, -2.4]);
  // chemical hexagon on hook
  const hex = new THREE.Group(); hex.position.set(0.18, 0.14, 0); hook.add(hex);
  for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28; blob(hex, mat(i % 2 ? '#ff7a3c' : '#4a86ff'), [Math.cos(a) * 0.1, Math.sin(a) * 0.1, 0], [0.04, 0.04, 0.04]); }
  add(hex, new THREE.TorusGeometry(0.1, 0.012, 6, 24), mat('#ffffff'));
  // more hooks hanging around pot rim
  for (const [x, z] of [[1.05, 0.55], [1.2, -0.3]]) {
    const h2 = hook.clone(); h2.position.set(x, 1.0, z); h2.scale.setScalar(0.8); scene.add(h2);
  }

  const banana = createBanana({ scale: 1.9 }); banana.position.set(-0.75, 0, 0.7); banana.rotation.y = 0.35; scene.add(banana);
  banana.userData.pose({ lean: 0.08, legs: { l: [0.25, 0], r: [-0.2, 0] } });
  banana.userData.reach('r', [-0.1, 0.5, 0.45]); banana.userData.reach('l', [0.1, 0.65, 0.4]);
  banana.updateMatrixWorld(true);
  finishScene(stage, P, banana, { pos: [0.2, 2.8, 4.5], look: [0.1, 1.0] });
});
</script></body></html>
