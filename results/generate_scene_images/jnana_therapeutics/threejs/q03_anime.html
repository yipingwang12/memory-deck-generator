<!doctype html>
<html><head><meta charset="utf-8"><title>Jnana q03 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q03 — BANANA's lead weapon wears Jnana's letters: JNT-517.
import { guard, rng } from './kit.js';
import { THREE, mat, add, blob, cyl, box, textPlane, makeStage, ground, finishScene, createBanana } from './common.js';

guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { fov: 36, el: 18, az: 200, sky: { zenith: '#3b4fa8', horizon: '#ffb36b', cover: 1.2, seed: 9, towerTop: 0.4, puffCover: 1.2 } }); const scene = stage.scene;
  ground(scene, '#7c5a8a');
  // stone plinth
  cyl(scene, mat('#9a93a8'), [0.8, 0.15, 0], 1.7, 0.3);
  cyl(scene, mat('#b5aec2'), [0.8, 0.35, 0], 1.45, 0.1);
  // the sword lies across, held by banana: hilt near banana, blade to the right, wide flat face to camera
  const sword = new THREE.Group(); sword.position.set(-0.9, 1.25, 0.5); sword.rotation.z = 0.12; scene.add(sword);
  const steel = mat('#dfe6ef', { metalness: 0.75, roughness: 0.22 }), gold = mat('#ffc83a', { metalness: 0.8, roughness: 0.3 });
  const bladeLen = 2.3, bladeH = 0.55;
  const shp = new THREE.Shape(); shp.moveTo(0, -bladeH / 2); shp.lineTo(bladeLen, -bladeH / 2); shp.lineTo(bladeLen + 0.5, 0); shp.lineTo(bladeLen, bladeH / 2); shp.lineTo(0, bladeH / 2);
  const bg = new THREE.ExtrudeGeometry(shp, { depth: 0.05, bevelEnabled: true, bevelSize: 0.015, bevelThickness: 0.015, bevelSegments: 2 }); bg.translate(0, 0, -0.025);
  add(sword, bg, steel, [0.35, 0, 0]);
  const lab = textPlane('JNT-517', 1.95, 0.38, { fg: '#c4201c' }); lab.position.set(0.35 + 1.15, 0, 0.045); sword.add(lab);
  // glow strip
  box(sword, mat('#8fd4ff', { emissive: '#4db4ff', emissiveIntensity: 0.6 }), [0.35 + 1.15, 0.255, 0.03], [2.3, 0.03, 0.04]);
  box(sword, mat('#8fd4ff', { emissive: '#4db4ff', emissiveIntensity: 0.6 }), [0.35 + 1.15, -0.255, 0.03], [2.3, 0.03, 0.04]);
  // guard + grip + pommel
  box(sword, gold, [0.3, 0, 0], [0.1, 1.0, 0.16]);
  cyl(sword, mat('#5a2a1a'), [-0.2, 0, 0], 0.06, 0.55, [0, 0, Math.PI / 2]);
  blob(sword, gold, [-0.5, 0, 0], [0.11, 0.11, 0.11]);
  const banana = createBanana({ scale: 2.2 }); banana.position.set(-2.2, 0, 0.4); banana.rotation.y = 0.3; scene.add(banana);
  banana.userData.pose({ lean: 0.04, legs: { l: [0.2, 0.05], r: [-0.15, 0] } });
  banana.updateMatrixWorld(true);
  const gl = banana.worldToLocal(new THREE.Vector3(-1.3, 1.25, 0.6)), gr = banana.worldToLocal(new THREE.Vector3(-1.1, 1.2, 0.6));
  banana.userData.reach('l', [gl.x, gl.y, gl.z]); banana.userData.reach('r', [gr.x, gr.y, gr.z]);
  finishScene(stage, P, banana, { pos: [0.0, 1.8, 6.4], look: [-0.1, 1.2] });
});
</script></body></html>
