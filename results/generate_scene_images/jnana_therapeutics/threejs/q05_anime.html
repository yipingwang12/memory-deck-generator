<!doctype html>
<html><head><meta charset="utf-8"><title>Jnana q05 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — FENNEL from a KETTLE fills the blood (phenylketonuria); the BANANA wants it out.
import { guard, rng } from './kit.js';
import { THREE, mat, add, blob, cyl, box, makeStage, ground, finishScene, createBanana } from './common.js';

function fennel() {
  const g = new THREE.Group(), bulb = mat('#e9f2c4'), stalk = mat('#9ccc65'), fr = mat('#6fb04a');
  blob(g, bulb, [0, 0.14, 0], [0.17, 0.15, 0.17]);
  for (const a of [0, 1.3, 2.6, 3.9, 5.2]) {
    const x = Math.cos(a) * 0.05, z = Math.sin(a) * 0.05;
    add(g, new THREE.CylinderGeometry(0.012, 0.02, 0.3, 8), stalk, [x, 0.38, z], [Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35]);
    for (let k = 0; k < 3; k++) add(g, new THREE.ConeGeometry(0.03, 0.2, 6), fr, [x * 3, 0.55 + k * 0.03, z * 3], [Math.sin(a) * 0.6 + k * 0.3, 0, -Math.cos(a) * 0.6]);
  }
  return g;
}
function kettle() {
  const g = new THREE.Group(), red = mat('#d6382f', { roughness: 0.3 }), steel = mat('#cfd5dc', { metalness: 0.7, roughness: 0.3 });
  blob(g, red, [0, 0.6, 0], [0.75, 0.62, 0.75]);
  cyl(g, red, [0, 1.17, 0], 0.3, 0.14, [0, 0, 0], 0.4); blob(g, steel, [0, 1.3, 0], [0.1, 0.1, 0.1]);
  add(g, new THREE.CylinderGeometry(0.1, 0.2, 0.9, 20), red, [0.85, 0.8, 0], [0, 0, -0.9]);
  add(g, new THREE.TorusGeometry(0.55, 0.05, 10, 30, Math.PI), steel, [0, 1.2, 0], [0, 0, 0]);
  blob(g, mat('#fff', { roughness: 0.3 }), [0.25, 0.8, 0.7], [0.15, 0.2, 0.05]);
  return g;
}
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { fov: 38 }); const scene = stage.scene;
  ground(scene, '#e9cf9f');
  // blood channel (glass trough of red) running left-to-right in front
  const tr = new THREE.Group(); tr.position.set(0.3, 0, 0.3); scene.add(tr);
  box(tr, mat('#e9dcc8'), [0, 0.1, 0], [8, 0.2, 1.9]);
  box(tr, mat('#c01c2a', { roughness: 0.2 }), [0, 0.28, 0], [7.6, 0.3, 1.5]);
  for (let i = 0; i < 9; i++) cyl(tr, mat('#ff5a5a'), [-3.2 + i * 0.8, 0.45, (i % 2 - 0.5) * 0.7], 0.14, 0.05, [0.4, 0, 0.3 * (i % 3)]);
  // fennel flood
  const r = rng(3);
  for (let i = 0; i < 7; i++) { const f = fennel(); f.position.set(-2.5 + i * 0.75, 0.4, (r() - 0.5) * 0.8); f.rotation.set(0, r() * 6, 0.6 * (r() - 0.5)); f.scale.setScalar(1.3); tr.add(f); }
  // kettle upper-right pouring a stream of fennel
  const k = kettle(); k.position.set(2.5, 1.75, -0.4); k.rotation.set(0, Math.PI, -0.55); k.scale.setScalar(1.0); scene.add(k);
  box(scene, mat('#8a6a4a'), [2.1, 0.9, -0.6], [1.6, 1.8, 1.2]);
  box(scene, mat('#8a6a4a'), [2.1, 0.9, -0.6], [1.6, 1.8, 1.2]);
  for (let i = 0; i < 4; i++) { const f = fennel(); f.position.set(1.45 - i * 0.12, 1.5 - i * 0.28, -0.3); f.rotation.set(0.3 * i, i, 0.8); f.scale.setScalar(1.3); scene.add(f); }
  const banana = createBanana({ scale: 1.9 }); banana.position.set(-2.0, 0.2, 1.4); banana.rotation.y = 0.5; scene.add(banana);
  banana.userData.pose({ lean: 0.1, legs: { l: [0.2, 0], r: [-0.1, 0] } });
  // net: banana scoops fennel out
  const net = new THREE.Group(); net.position.set(-1.0, 1.0, 1.2); scene.add(net);
  cyl(net, mat('#8a5a2b'), [-0.5, -0.1, 0], 0.03, 1.8, [0, 0, 1.3]);
  add(net, new THREE.TorusGeometry(0.45, 0.04, 10, 30), mat('#d8dde4', { metalness: 0.6 }), [0.35, 0.2, 0], [0, 0.0, 0]);
  add(net, new THREE.SphereGeometry(0.45, 20, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat('#bfe3ff', { transparent: true, opacity: 0.5, side: THREE.DoubleSide }), [0.35, 0.2, 0]);
  const f2 = fennel(); f2.position.set(0.3, 0.15, 0); f2.scale.setScalar(0.9); net.add(f2);
  banana.updateMatrixWorld(true);
  const h = banana.worldToLocal(new THREE.Vector3(-1.35, 0.75, 1.2)); banana.userData.reach('l', [h.x, h.y, h.z]);
  const h2 = banana.worldToLocal(new THREE.Vector3(-1.5, 0.7, 1.4)); banana.userData.reach('r', [h2.x, h2.y, h2.z]);
  finishScene(stage, P, banana, { pos: [0.2, 2.5, 6.8], look: [0.3, 1.2] });
});
</script></body></html>
