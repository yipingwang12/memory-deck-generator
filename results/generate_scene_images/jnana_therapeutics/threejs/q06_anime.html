<!doctype html>
<html><head><meta charset="utf-8"><title>Jnana q06 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — With the ferry blocked, the BANANA lets the kidneys flush the fennel out in urine.
import { guard, rng } from './kit.js';
import { THREE, mat, add, blob, cyl, box, makeStage, ground, finishScene, createBanana } from './common.js';

function fennel() {
  const g = new THREE.Group(), bulb = mat('#e9f2c4'), stalk = mat('#9ccc65'), fr = mat('#6fb04a');
  blob(g, bulb, [0, 0.14, 0], [0.17, 0.15, 0.17]);
  for (const a of [0, 1.3, 2.6, 3.9, 5.2]) {
    const x = Math.cos(a) * 0.05, z = Math.sin(a) * 0.05;
    add(g, new THREE.CylinderGeometry(0.012, 0.02, 0.3, 8), stalk, [x, 0.38, z], [Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35]);
    for (let k = 0; k < 3; k++) add(g, new THREE.ConeGeometry(0.03, 0.2, 6), fr, [x * 3, 0.55 + k * 0.03, z * 3], [Math.sin(a) * 0.6 + k * 0.3, 0, -Math.cos(a) * 0.6]);
  }
  return g;
}
function tube(p, a, b, r, color) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), m = add(p, new THREE.CylinderGeometry(r, r, 1, 16), mat(color, { roughness: 0.35 }));
  m.position.copy(A).add(B).multiplyScalar(0.5); m.scale.y = A.distanceTo(B); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize()); return m;
}

function kidney() {
  const g = new THREE.Group(), red = mat('#c8483e', { roughness: 0.35 });
  blob(g, red, [0, 0, 0], [0.5, 0.8, 0.38]);
  blob(g, mat('#e87b6a'), [-0.4, 0, 0.08], [0.2, 0.3, 0.3]);       // hilum notch
  blob(g, mat('#a63a34'), [0.2, 0.3, 0.3], [0.2, 0.3, 0.1]);       // highlight lobes
  blob(g, mat('#a63a34'), [0.2, -0.3, 0.3], [0.2, 0.3, 0.1]);
  return g;
}
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { fov: 38 }); const scene = stage.scene;
  ground(scene, '#f0d9a8');
  box(scene, mat('#f4ece0'), [0.6, 2.9, -1.2], [5.4, 0.2, 1.2]); // shelf
  for (const x of [-1.9, 3.1]) cyl(scene, mat('#d8cdb8'), [x, 1.45, -1.2], 0.12, 2.8);
  const kl = kidney(); kl.position.set(-0.3, 3.7, -1.1); kl.scale.setScalar(1.25); scene.add(kl);
  const kr = kidney(); kr.position.set(1.7, 3.7, -1.1); kr.scale.set(-1.25, 1.25, 1.25); scene.add(kr);
  // ureter pipes to beaker
  const yel = '#ffd34d';
  tube(scene, [-0.3, 3.0, -0.9], [-0.3, 1.9, -0.9], 0.09, yel); tube(scene, [-0.3, 1.9, -0.9], [0.8, 1.5, -0.4], 0.09, yel);
  tube(scene, [1.7, 3.0, -0.9], [1.7, 1.9, -0.9], 0.09, yel); tube(scene, [1.7, 1.9, -0.9], [0.9, 1.5, -0.4], 0.09, yel);
  // beaker of urine
  const bk = new THREE.Group(); bk.position.set(0.85, 0, -0.2); scene.add(bk);
  cyl(bk, mat('#ffd21f', { roughness: 0.2 }), [0, 0.6, 0], 0.8, 1.2);
  const glass = cyl(bk, mat('#ffe27a', { transparent: true, opacity: 0.3, roughness: 0.05 }), [0, 0.8, 0], 0.84, 1.6);
  const r = rng(5);
  for (let i = 0; i < 4; i++) { const f = fennel(); f.position.set(-0.45 + i * 0.3, 1.2 + (i % 2) * 0.05, (r() - 0.5) * 0.5); f.rotation.set(0.2, i * 1.5, 0.5 - i * 0.3); f.scale.setScalar(1.5); bk.add(f); }
  for (let i = 0; i < 3; i++) { const f = fennel(); f.position.set(0.85 + (i - 1) * 0.1, 1.45 - i * 0.2, -0.3); f.scale.setScalar(0.9); f.rotation.set(0, i, 0.4 * i); scene.add(f); }
  // valve wheel (banana lets it flow)
  const wheel = new THREE.Group(); wheel.position.set(-0.3, 2.3, -0.5); scene.add(wheel);
  const redM = mat('#d6382f'); add(wheel, new THREE.TorusGeometry(0.3, 0.05, 10, 30), redM);
  for (let i = 0; i < 3; i++) add(wheel, new THREE.CylinderGeometry(0.03, 0.03, 0.6, 8), redM, [0, 0, 0], [0, 0, i * Math.PI / 3]);
  blob(wheel, redM, [0, 0, 0.0], [0.08, 0.08, 0.08]);
  const banana = createBanana({ scale: 2.8 }); banana.position.set(-2.0, 0, 1.3); banana.rotation.y = 0.35; scene.add(banana);
  banana.userData.pose({ lean: 0.06, legs: { l: [0.15, 0], r: [-0.1, 0] } });
  banana.updateMatrixWorld(true);
  const h = banana.worldToLocal(new THREE.Vector3(-0.5, 2.4, -0.2)); banana.userData.reach('l', [h.x, h.y, h.z]);
  const h2 = banana.worldToLocal(new THREE.Vector3(-1.5, 1.4, 1.2)); banana.userData.reach('r', [h2.x, h2.y, h2.z]);
  finishScene(stage, P, banana, { pos: [0.2, 2.4, 8.6], look: [0.0, 2.1] });
});
</script></body></html>
