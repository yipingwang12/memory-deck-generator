<!doctype html>
<html><head><meta charset="utf-8"><title>q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — The LAMPLIGHTER rolls DICE and cuts one hundred million coins of spending (scissors snip a coin hoard).
import { THREE, mat, add, blob, num, makeStage, clouds, ground, handWorld, toon, coin, dice, glow, rng } from './common.js';
import { guard } from './kit.js';
import { createLamplighter } from './lamplighter.js';

function scissors() {
  const g = new THREE.Group(), steel = mat('#c9d0d8', { metalness: 0.8, roughness: 0.25 }), red = mat('#d8312f');
  for (const s of [-1, 1]) {
    const arm = new THREE.Group(); arm.rotation.z = s * 0.22; g.add(arm);
    add(arm, new THREE.BoxGeometry(0.07, 0.9, 0.025), steel, [0, 0.45, 0]); // blade
    add(arm, new THREE.TorusGeometry(0.13, 0.035, 10, 24), red, [0, -0.17, 0], [0, 0, 0], [0.85, 1.15, 1]);
  }
  add(g, new THREE.SphereGeometry(0.05, 12, 8), mat('#555'), [0, 0.02, 0.02]);
  return g;
}

guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage(P, { fov: 40, az: 140 }); const scene = stage.scene;
  ground(scene, '#78b24a'); add(scene, new THREE.PlaneGeometry(400, 4), mat('#c9a56b'), [0, 0.003, 0.5], [-Math.PI / 2, 0, 0]);
  // coin hoard (right): heap with a snipped-off stack
  const r = rng(5), heap = new THREE.Group(); heap.position.set(1.9, 0, -0.2); scene.add(heap);
  for (let i = 0; i < 110; i++) {
    const a = r() * 6.28, d = Math.sqrt(r()) * 0.95, h = Math.max(0, 0.75 - d * 0.7) * (0.6 + r() * 0.5);
    const c = coin(0.14); c.position.set(Math.cos(a) * d, h * 0.9 + 0.03, Math.sin(a) * d * 0.8); c.rotation.set((r() - 0.5) * 1.3, r() * 6, (r() - 0.5) * 1.3); heap.add(c);
  }
  for (let i = 0; i < 12; i++) { const c = coin(0.15); c.position.set(0, 0.04 + i * 0.026, 0.7); c.rotation.y = i * 0.5; heap.add(c); }
  // scissors cutting the heap
  const sc = scissors(); sc.scale.setScalar(1.3); sc.position.set(1.15, 1.0, 0.6); sc.rotation.set(0.0, 0.2, -1.35); scene.add(sc);
  // lamplighter throws dice
  const ll = createLamplighter({ scale: 1.7 }); ll.position.set(-1.7, 0, 0.3); ll.rotation.y = 0.45; scene.add(ll);
  ll.userData.pose({ headTilt: 0.08, headYaw: 0.4, headPitch: -0.1, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  ll.userData.reach('l', [0.4, 1.15, 0.45]); ll.userData.reach('r', [-0.3, 0.5, 0.1]);
  const d1 = dice(0.42); d1.position.set(-0.55, 1.5, 0.95); d1.rotation.set(0.5, 0.6, 0.3); scene.add(d1);
  const d2 = dice(0.42); d2.position.set(0.15, 0.9, 1.25); d2.rotation.set(0.2, 1.0, 0.5); scene.add(d2);
  const d3 = dice(0.42); d3.position.set(-0.4, 0.21, 1.6); d3.rotation.set(0, 0.5, 0); scene.add(d3);
  for (const [x, y, z] of [[-0.9, 1.35, 0.7], [-0.75, 1.42, 0.8]]) blob(scene, glow('#fff'), [x, y, z], [0.03, 0.03, 0.03]);
  toon(stage, scene, [ll]);
  clouds(stage);
  stage.camera.position.set(num(P, 'cx', 0.1), num(P, 'cy', 1.4), num(P, 'cz', 5.6)); stage.camera.lookAt(num(P, 'tx', 0.1), num(P, 'ty', 1.0), 0);
  stage.finish();
});
</script></body></html>
