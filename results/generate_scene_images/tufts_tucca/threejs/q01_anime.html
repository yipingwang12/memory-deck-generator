<!doctype html>
<html><head><meta charset="utf-8"><title>Tufts TUCCA q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — The TOUCAN perches on the Tufts University Center for Cellular Agriculture.
import { THREE, guard, rng, mat, add, blob, cyl, box, canvasPlane, labelPlane, setup, frame, meadow, createFlask } from './common.js';
import { createToucan } from './toucan.js';

function facade(w, h) {
  return canvasPlane(w, h, 1024, (ctx, W, H) => {
    const r = rng(2); ctx.fillStyle = '#b4563c'; ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < H; y += 18) for (let x = (y / 18 % 2) * 20; x < W; x += 40) { const l = 150 + r() * 40; ctx.fillStyle = `rgb(${l + 30},${l - 70},${l - 100})`; ctx.fillRect(x + 1, y + 1, 38, 16); }
    for (let row = 0; row < 2; row++) for (let c = 0; c < 7; c++) {
      if (c === 3) continue; const x = 60 + c * 135, y = 60 + row * 200;
      ctx.fillStyle = '#f4efe6'; ctx.fillRect(x - 8, y - 8, 86, 136); ctx.fillStyle = '#7fb4e6'; ctx.fillRect(x, y, 70, 120);
      ctx.fillStyle = '#f4efe6'; ctx.fillRect(x + 33, y, 4, 120); ctx.fillRect(x, y + 58, 70, 4);
    }
  });
}
guard(() => {
  const S = setup({ el: 30, az: 160 }); const { scene, num } = S;
  meadow(scene);
  add(scene, new THREE.PlaneGeometry(6, 1.4), mat('#d9c8a0'), [0, 0.004, 1.5], [-Math.PI / 2, 0, 0]);
  const B = new THREE.Group(); scene.add(B);
  const white = mat('#f4efe6');
  box(B, mat('#b4563c'), 4.0, 1.7, 1.4, [0, 0.85, 0]);
  const f = facade(4.0, 1.7); f.position.set(0, 0.85, 0.705); B.add(f);
  box(B, white, 4.1, 0.1, 1.5, [0, 1.75, 0]); box(B, white, 4.1, 0.1, 1.5, [0, 0.05, 0]);
  // portico
  for (let i = 0; i < 4; i++) cyl(B, white, 0.07, 0.08, 1.6, [-0.52 + i * 0.35, 0.85, 1.0]);
  box(B, white, 1.4, 0.1, 0.7, [0, 1.7, 0.9]); box(B, white, 1.5, 0.08, 0.8, [0, 0.04, 0.95]);
  const ped = new THREE.Shape(); ped.moveTo(-0.75, 0); ped.lineTo(0.75, 0); ped.lineTo(0, 0.42); ped.closePath();
  add(B, new THREE.ExtrudeGeometry(ped, { depth: 0.6, bevelEnabled: false }), white, [0, 1.76, 0.6]);
  // cupola
  box(B, white, 0.5, 0.3, 0.5, [0, 2.02, -0.1]); cyl(B, mat('#3a6aa8'), 0.0, 0.34, 0.4, [0, 2.37, -0.1]);
  // banner
  const bn = labelPlane('TUFTS', 0.7, 0.32, '#3a6ab0', '#ffffff'); bn.position.set(1.45, 1.35, 0.72); B.add(bn);
  // greenhouse wing + bioreactors
  const gl = new THREE.MeshStandardMaterial({ color: '#cfeeff', transparent: true, opacity: 0.1, roughness: 0.1, depthWrite: false });
  const G = new THREE.Group(); G.position.set(-3.3, 0, 0.5); B.add(G);
  box(G, mat('#9fd0ee'), 2.6, 0.06, 1.2, [0, 1.3, 0]); box(G, mat('#e8f4fa'), 2.7, 0.05, 0.05, [0, 0.03, 0.6]);
  for (const x of [-1.3, 1.3]) for (const z of [-0.6, 0.6]) box(G, mat('#f4efe6'), 0.05, 1.3, 0.05, [x, 0.65, z], [0, 0, 0], 0.01);
  const fr = mat('#f4efe6'); for (let i = 1; i < 4; i++) box(G, fr, 0.04, 1.3, 0.04, [-1.3 + i * 0.65, 0.65, 0.6], [0, 0, 0], 0.01);
  box(G, mat('#f4efe6'), 0.04, 1.3, 1.2, [-1.3, 0.65, 0]);
  for (const [x, c] of [[-0.8, '#ff8fa8'], [0, '#ff6f8a'], [0.8, '#ff9fb0']]) {
    cyl(G, mat('#c9d0d8', { metalness: 0.6, roughness: 0.35 }), 0.27, 0.27, 1.05, [x, 0.5, 0]);
    cyl(G, mat(c, { emissive: c, emissiveIntensity: 0.3 }), 0.215, 0.215, 0.8, [x, 0.5, 0.2]);
    cyl(G, mat('#8e98a4', { metalness: 0.6 }), 0.26, 0.26, 0.05, [x, 1.0, 0]);
  }
  // cow + chicken outside (cellular agriculture)
  const cow = new THREE.Group(); const cw = mat('#fafafa'), cb = mat('#2a2a2e');
  blob(cow, cw, [0, 0.45, 0], [0.5, 0.28, 0.25]); blob(cow, cb, [-0.1, 0.55, 0.12], [0.18, 0.12, 0.14]); blob(cow, cb, [0.2, 0.4, -0.15], [0.14, 0.11, 0.1]);
  blob(cow, cw, [0.55, 0.62, 0], [0.2, 0.17, 0.16]); blob(cow, mat('#ffb6c0'), [0.72, 0.58, 0], [0.09, 0.09, 0.12]);
  for (const s of [-1, 1]) { blob(cow, mat('#111'), [0.62, 0.68, s * 0.12], [0.03, 0.035, 0.02]); blob(cow, cb, [0.45, 0.72, s * 0.15], [0.06, 0.03, 0.03]); }
  for (const [x, z] of [[0.3, 0.12], [0.3, -0.12], [-0.3, 0.12], [-0.3, -0.12]]) cyl(cow, cw, 0.05, 0.045, 0.34, [x, 0.17, z]);
  cow.position.set(1.8, 0, 2.6); cow.rotation.y = 0.5; scene.add(cow);
  // toucan on roof peak
  const t = createToucan({ scale: num('ts', 2.0) }); t.position.set(0, 2.18, 0.9); t.rotation.y = 0.2; scene.add(t);
  t.userData.pose({ headTilt: 0.06, wings: { l: [0, 0.2], r: [0, 0.2] } });
  frame(S, [t, cow], [-0.9, 1.5, 8.0], [-0.9, 1.9, 0]);
});
</script></body></html>
