<html><head><meta charset="utf-8"><title>Tufts TUCCA q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — An ANT brings the TOUCAN news of its USDA award.
import { THREE, guard, rng, mat, add, blob, cyl, box, canvasPlane, labelPlane, setup, frame, meadow, animeEye } from './common.js';
import { createToucan } from './toucan.js';

function seg(parent, m, a, b, r) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A), len = d.length();
  const o = add(parent, new THREE.CylinderGeometry(r, r, len, 8), m, A.clone().add(B).multiplyScalar(0.5));
  o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); return o;
}
function createAnt() {
  const g = new THREE.Group(), body = mat('#8a2a1c', { roughness: 0.45 }), dark = mat('#5a1a12');
  blob(g, body, [0, 0.42, 0.02], [0.12, 0.11, 0.17]); blob(g, body, [0, 0.4, -0.34], [0.17, 0.16, 0.26]); blob(g, dark, [0, 0.41, -0.18], [0.06, 0.06, 0.07]);
  const head = new THREE.Group(); head.position.set(0, 0.5, 0.26); g.add(head);
  blob(head, body, [0, 0, 0], [0.15, 0.14, 0.14]);
  for (const s of [-1, 1]) { animeEye(head, s * 0.06, 0.02, 0.125, 1.7, '#2a1208'); seg(head, dark, [s * 0.05, 0.1, 0.06], [s * 0.12, 0.3, 0.14], 0.01); blob(head, dark, [s * 0.12, 0.31, 0.14], [0.02, 0.02, 0.02]); seg(head, dark, [s * 0.03, -0.06, 0.12], [s * 0.07, -0.1, 0.19], 0.014); }
  for (const s of [-1, 1]) for (const [i, z] of [[1, 0.0], [2, -0.1]]) { const x0 = s * 0.1, y0 = 0.38;
    seg(g, dark, [x0, y0, z], [s * 0.3, y0 + 0.1, z], 0.012); seg(g, dark, [s * 0.3, y0 + 0.1, z], [s * 0.38, 0.0, z + 0.04 * i], 0.011); }
  // front arms raised, holding the letter
  for (const s of [-1, 1]) { seg(g, dark, [s * 0.1, 0.46, 0.15], [s * 0.26, 0.66, 0.2], 0.012); seg(g, dark, [s * 0.26, 0.66, 0.2], [s * 0.27, 0.95, 0.22], 0.011); }
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; }); return g;
}
function letter() {
  const g = new THREE.Group();
  box(g, mat('#f6f1e4'), 0.7, 0.46, 0.04, [0, 0, 0]);
  const tag = labelPlane('USDA', 0.56, 0.2, '#2c7a3c', '#ffffff'); tag.position.set(0, 0.03, 0.025); g.add(tag);
  // blue award rosette with ribbon tails
  const R = new THREE.Group(); R.position.set(0.27, -0.2, 0.05); g.add(R);
  for (const s of [-1, 1]) box(R, mat('#2f5fd0'), 0.07, 0.24, 0.01, [s * 0.05, -0.15, 0], [0, 0, s * 0.25]);
  cyl(R, mat('#2f5fd0'), 0.12, 0.12, 0.03, [0, 0, 0], [Math.PI / 2, 0, 0]); cyl(R, mat('#f2b822', { metalness: 0.5 }), 0.07, 0.07, 0.04, [0, 0, 0.005], [Math.PI / 2, 0, 0]);
  return g;
}
guard(() => {
  const S = setup({ el: 32, az: 140 }); const { scene, num } = S;
  meadow(scene, '#74b84a'); const r = rng(6);
  for (let i = 0; i < 120; i++) { const x = (r() - 0.5) * 10, z = -3 + r() * 6; cyl(scene, mat('#4f9a35'), 0.004, 0.01, 0.12, [x, 0.06, z]); }
  const t = createToucan({ scale: num('ts', 2.0) }); t.position.set(1.2, 0, 0); t.rotation.y = -0.5; scene.add(t);
  t.userData.pose({ lean: 0.12, headTilt: -0.1, wings: { l: [0.1, 0.2], r: [0, 0.15] } });
  const a = createAnt(); a.scale.setScalar(num('as', 1.9)); a.position.set(-1.35, 0, 0.9); a.rotation.y = 0.55; scene.add(a);
  const L = letter(); L.position.set(0, 1.0, 0.22); L.rotation.set(-0.15, 0, 0.05); L.scale.setScalar(0.72); a.add(L);
  frame(S, [t, a], [0, 1.1, 5.9], [0, 1.15, 0]);
});
</script></body></html>
