<!doctype html>
<html><head><meta charset="utf-8"><title>Tufts TUCCA q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — The TOUCAN nests by a MEADOW FORD (Medford).
import { THREE, guard, rng, mat, add, blob, cyl, box, setup, frame, meadow, createNest } from './common.js';
import { createToucan } from './toucan.js';

guard(() => {
  const S = setup({ el: 32, az: 140 }); const { scene, num } = S;
  meadow(scene, '#74b84a'); const r = rng(4);
  // stream across the scene with a ford (shallow gravel crossing + stepping stones)
  const water = mat('#4aa8e8', { roughness: 0.15, metalness: 0.1 });
  add(scene, new THREE.PlaneGeometry(400, 2.6), water, [0, 0.01, -1.0], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(400, 0.18), mat('#e8f6ff'), [0, 0.014, -2.18], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(400, 0.18), mat('#e8f6ff'), [0, 0.014, 0.18], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(1.5, 2.9), mat('#d1b378'), [-1.5, 0.02, -1.0], [-Math.PI / 2, 0, 0]);
  for (let i = 0; i < 40; i++) blob(scene, mat(['#9a9aa0', '#bdb7aa', '#8a8470'][i % 3]), [-2.1 + r() * 1.2, 0.03, -2.2 + r() * 2.6], [0.06 + r() * 0.05, 0.03, 0.05 + r() * 0.04]);
  for (let i = 0; i < 4; i++) blob(scene, mat('#8f949c'), [-0.9 + i * 0.0, 0.05, 0]).scale.set(0, 0, 0);
  for (const [x, z] of [[1.4, -1.5], [2.0, -0.7], [2.8, -1.2]]) blob(scene, mat('#a0a2a8'), [x, 0.05, z], [0.26, 0.12, 0.2]);
  // signpost-style ford marker poles with depth stripes
  for (const x of [-0.5, -2.5]) { cyl(scene, mat('#f4efe6'), 0.04, 0.04, 0.7, [x, 0.35, -2.1]); for (let k = 0; k < 3; k++) cyl(scene, mat('#d83a3a'), 0.042, 0.042, 0.1, [x, 0.12 + k * 0.2, -2.1]); }
  // wildflowers
  for (let i = 0; i < 160; i++) { const x = (r() - 0.5) * 14, z = 0.6 + r() * 6; add(scene, new THREE.SphereGeometry(0.035, 8, 6), mat(['#ffd84a', '#ffffff', '#ff8fa8', '#c79bff'][i % 4]), [x, 0.05, z]); cyl(scene, mat('#4f9a35'), 0.006, 0.006, 0.08, [x, 0.03, z]); }
  // tree with nest
  const tree = new THREE.Group(); tree.position.set(2.7, 0, 0.3); scene.add(tree);
  cyl(tree, mat('#7a5230'), 0.17, 0.28, 3.6, [0, 1.8, 0]);
  for (const [x, y, z, s] of [[0.3, 3.9, -0.3, 1.1], [1.1, 3.6, -0.5, 0.8], [-0.4, 3.6, -0.6, 0.8], [0.3, 4.6, -0.3, 0.8]]) blob(tree, mat('#4f9a35'), [x, y, z], [s * 1.1, s * 0.9, s]);
  box(tree, mat('#7a5230'), 1.4, 0.12, 0.2, [-0.7, 1.75, 0.2], [0, 0, 0.1]);
  const nest = createNest(0.52); nest.position.set(-0.8, 1.82, 0.35); tree.add(nest);
  const t = createToucan({ scale: 1.7 }); t.userData.crouch(0.1); t.position.set(1.9, 2.0, 0.65); t.rotation.y = -0.35; scene.add(t);
  t.userData.pose({ headTilt: -0.06, wings: { l: [0, 0.1], r: [0, 0.1] } });
  frame(S, [t], [0.3, 2.3, 6.2], [1.2, 2.1, 0]);
});
</script></body></html>
