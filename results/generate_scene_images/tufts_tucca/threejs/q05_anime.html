<!doctype html>
<html><head><meta charset="utf-8"><title>Tufts TUCCA q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — DICE roll ten million coins to the TOUCAN, and a SEAL guards them for five years.
import { THREE, guard, rng, mat, add, blob, cyl, box, canvasPlane, setup, frame, meadow, createCoin, coinPile, animeEye } from './common.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { createToucan } from './toucan.js';

const PIPS = { 1: [[0.5, 0.5]], 2: [[0.25, 0.25], [0.75, 0.75]], 3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]], 4: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]],
  5: [[0.25, 0.25], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.75, 0.75]], 6: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.5], [0.75, 0.5], [0.25, 0.75], [0.75, 0.75]] };
function createDice(size, body = '#d8283c', pip = '#ffffff') {
  const g = new THREE.Group(); box(g, mat(body, { roughness: 0.4 }), size, size, size, [0, 0, 0], [0, 0, 0], size * 0.1);
  const faces = [[0, 0, 1, 1, 0, 0, 0], [0, 0, -1, 6, Math.PI, 0, 0], [1, 0, 0, 2, 0, Math.PI / 2, 0], [-1, 0, 0, 5, 0, -Math.PI / 2, 0], [0, 1, 0, 3, -Math.PI / 2, 0, 0], [0, -1, 0, 4, Math.PI / 2, 0, 0]];
  for (const [nx, ny, nz, n, rx, ry] of faces) {
    const f = new THREE.Group(); f.position.set(nx, ny, nz).multiplyScalar(size / 2 + 0.002); f.rotation.set(rx, ry, 0); g.add(f);
    for (const [u, v] of PIPS[n]) { const d = new THREE.Mesh(new THREE.CircleGeometry(size * 0.085, 20), mat(pip, { roughness: 0.4 })); d.position.set((u - 0.5) * size * 0.8, (0.5 - v) * size * 0.8, 0); f.add(d); }
  }
  return g;
}
function createSeal() {
  const g = new THREE.Group(), fur = mat('#8693a8'), belly = mat('#dfe3ea'), dark = mat('#252a35');
  const body = blob(g, fur, [0, 0.3, -0.05], [0.24, 0.24, 0.55], [-0.55, 0, 0]); blob(g, belly, [0, 0.27, 0.04], [0.2, 0.2, 0.5], [-0.55, 0, 0]);
  const head = new THREE.Group(); head.position.set(0, 0.78, 0.38); g.add(head);
  blob(head, fur, [0, 0, 0], [0.18, 0.17, 0.18]); blob(head, belly, [0, -0.06, 0.13], [0.11, 0.08, 0.1]); blob(head, dark, [0, -0.015, 0.22], [0.045, 0.03, 0.03]);
  for (const s of [-1, 1]) { animeEye(head, s * 0.075, 0.03, 0.15, 1.6, '#1a1a22');
    for (let k = -1; k <= 1; k++) cyl(head, mat('#fff'), 0.003, 0.003, 0.15, [s * 0.13, -0.06 + k * 0.025, 0.2], [0.1 * k, 0, s * (Math.PI / 2 + 0.1 * k)]); }
  for (const s of [-1, 1]) { blob(g, fur, [s * 0.22, 0.38, 0.22], [0.06, 0.2, 0.1], [0, 0, s * 0.4]); blob(g, fur, [s * 0.14, 0.03, -0.55], [0.12, 0.03, 0.18], [0, s * 0.4, 0]); }
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; }); return g;
}

guard(() => {
  const S = setup({ el: 30, az: 140 }); const { scene, num } = S;
  meadow(scene, '#e9d29c');
  // coins: big heap under the toucan, loose stream from the dice
  const heap = coinPile(scene, [0, 0, 0], 750, 1.5, 0.13, 3);
  const t = createToucan({ scale: num('ts', 1.9) }); t.position.set(0.05, 0.72, 0.1); t.rotation.y = -0.15; scene.add(t);
  t.userData.pose({ headTilt: 0.06, wings: { l: [0, 0.25], r: [0, 0.25] } });
  // dice tumbling in, trailing coins
  const d1 = createDice(0.7); d1.position.set(-2.1, 1.6, 0.9); d1.rotation.set(0.5, 0.7, 0.3); scene.add(d1);
  const d2 = createDice(0.6, '#f4f0e6', '#c81e32'); d2.position.set(-1.4, 0.42, 1.8); d2.rotation.set(0.1, 0.5, 0.0); scene.add(d2);
  const r = rng(5);
  for (let i = 0; i < 16; i++) { const f = i / 16, c = createCoin(0.1); c.position.set(-1.7 + f * 1.1 + (r() - 0.5) * 0.2, 1.4 - f * 0.9 + Math.sin(f * 3) * 0.3 + (r() - 0.5) * 0.15, 0.7 + (r() - 0.5) * 0.4); c.rotation.set(r() * 3, r() * 3, r() * 3); scene.add(c); }
  const seal = createSeal(); seal.scale.setScalar(num('ss', 1.5)); seal.position.set(2.1, 0, 1.2); seal.rotation.y = -0.6; scene.add(seal);
  frame(S, [t, seal], [0.3, 1.7, 6.6], [0.2, 1.3, 0]);
});
</script></body></html>
