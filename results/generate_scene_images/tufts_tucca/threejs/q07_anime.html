<!doctype html>
<html><head><meta charset="utf-8"><title>Tufts TUCCA q07</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — The TOUCAN's grant is the first US public money for lab-grown protein.
import { THREE, guard, rng, mat, add, blob, cyl, box, canvasPlane, labelPlane, setup, frame, meadow, createCoin, coinPile, createFlag } from './common.js';
import { createToucan } from './toucan.js';

function labSteak() {
  const g = new THREE.Group();
  cyl(g, mat('#f2f8fc'), 0.55, 0.5, 0.06, [0, 0.03, 0]); add(g, new THREE.TorusGeometry(0.55, 0.03, 8, 40), mat('#dbeaf4'), [0, 0.07, 0], [Math.PI / 2, 0, 0]);
  const m = mat('#c9455a'), fat = mat('#ffd6dc');
  box(g, m, 0.7, 0.16, 0.46, [0, 0.16, 0], [0, 0.3, 0], 0.07);
  for (const [x, z, w] of [[-0.15, 0.05, 0.3], [0.12, -0.08, 0.34], [0.0, 0.15, 0.2]]) box(g, fat, w, 0.02, 0.035, [x, 0.245, z], [0, 0.3, 0.0], 0.01);
  for (let i = 0; i < 7; i++) blob(g, mat('#ff7f95', { emissive: '#ff5f78', emissiveIntensity: 0.3 }), [Math.cos(i * 0.9) * 0.5, 0.45 + (i % 3) * 0.1, Math.sin(i * 0.9) * 0.35 + 0.1], [0.05, 0.05, 0.05]);
  return g;
}
guard(() => {
  const S = setup({ el: 32, az: 150 }); const { scene, num } = S;
  meadow(scene, '#e9d29c'); const r = rng(3);
  add(scene, new THREE.PlaneGeometry(9, 4.5), mat('#f2f4f6'), [0, 0.004, 0.5], [-Math.PI / 2, 0, 0]);
  const fg = createFlag(1.5, 0.9, 3.4); fg.position.set(-0.2, 0, -1.6); scene.add(fg);
  const t = createToucan({ scale: num('ts', 1.85) }); t.position.set(0.0, 0, 0.8); t.rotation.y = 0.1; scene.add(t);
  t.userData.pose({ headTilt: 0.06, wings: { l: [0, 0.35], r: [0, 0.35] } });
  // lab-grown steak on the left
  const st = labSteak(); st.scale.setScalar(1.3); st.position.set(-2.1, 0, 1.4); scene.add(st);
  // public money on the right: bundles, coins, gold "1" medal
  const green = mat('#4f9a4a'), band = mat('#f4efe6');
  const bundles = new THREE.Group(); bundles.position.set(2.1, 0, 1.2); scene.add(bundles);
  for (let k = 0; k < 6; k++) { const x = (k % 3 - 1) * 0.62, y = 0.17 + Math.floor(k / 3) * 0.34 + 0.01, rot = (r() - 0.5) * 0.2;
    box(bundles, green, 0.6, 0.32, 0.9, [x, y, 0], [0, rot, 0], 0.03); box(bundles, band, 0.1, 0.34, 0.92, [x, y, 0], [0, rot, 0], 0.01); }
  coinPile(bundles, [0, 0.7, 0], 90, 0.55, 0.1, 4);
  const med = new THREE.Group(); med.position.set(2.1, 1.75, 0.9); scene.add(med);
  cyl(med, mat('#f2b822', { metalness: 0.6, roughness: 0.3 }), 0.45, 0.45, 0.07, [0, 0, 0], [Math.PI / 2, 0, 0]);
  const one = labelPlane('1', 0.6, 0.6, '#f9d34a', '#a22a2a'); one.position.set(0, 0, 0.045); med.add(one);
  for (const s of [-1, 1]) box(med, mat('#2f5fd0'), 0.16, 0.5, 0.02, [s * 0.14, -0.55, -0.02], [0, 0, -s * 0.2]);
  frame(S, [t], [0, 1.8, 7.4], [0, 1.4, 0]);
});
</script></body></html>
