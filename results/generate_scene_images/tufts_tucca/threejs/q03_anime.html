<!doctype html>
<html><head><meta charset="utf-8"><title>Tufts TUCCA q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q03 — The TOUCAN hosts a NATIONAL nest: the National Institute for Cellular Agriculture.
import { THREE, guard, rng, mat, add, blob, cyl, box, canvasPlane, setup, frame, meadow, createNest, createFlag, createFlask } from './common.js';
import { createToucan } from './toucan.js';

guard(() => {
  const S = setup({ el: 30, az: 155 }); const { scene, num } = S;
  meadow(scene, '#6fae45');
  add(scene, new THREE.PlaneGeometry(9, 3), mat('#d9d3c4'), [0, 0.004, 2.6], [-Math.PI / 2, 0, 0]);
  const white = mat('#f6f3ec'), shade = mat('#d9d4c8');
  const B = new THREE.Group(); scene.add(B);
  box(B, white, 6.0, 1.6, 1.8, [0, 0.8, 0]); box(B, shade, 6.2, 0.12, 2.0, [0, 0.06, 0]); box(B, shade, 6.2, 0.1, 2.0, [0, 1.65, 0]);
  for (let i = 0; i < 12; i++) cyl(B, white, 0.065, 0.075, 1.4, [-2.75 + i * 0.5, 0.82, 1.0]);
  box(B, shade, 6.0, 0.08, 0.3, [0, 0.12, 1.15]); box(B, shade, 6.1, 0.1, 0.3, [0, 1.58, 1.0]);
  for (let i = 0; i < 8; i++) { const w = box(B, mat('#7fb4e6'), 0.3, 0.7, 0.02, [-2.45 + i * 0.7, 0.85, 0.91], [0, 0, 0], 0.01); }
  // drum + dome
  cyl(B, white, 1.15, 1.25, 0.9, [0, 2.15, 0]);
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; cyl(B, shade, 0.05, 0.05, 0.75, [Math.cos(a) * 1.18, 2.15, Math.sin(a) * 1.18]); }
  add(B, new THREE.SphereGeometry(1, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), white, [0, 2.6, 0], [0, 0, 0], [1.15, 1.0, 1.15]);
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; add(B, new THREE.TorusGeometry(1.15, 0.012, 6, 30, Math.PI / 2), shade, [0, 2.6, 0], [0, -a, 0], [1, 1, 1]).rotation.set(0, -a, 0); }
  // emblem: flask on the pediment
  const em = new THREE.Group(); em.position.set(0, 1.18, 1.4); B.add(em);
  add(em, new THREE.CircleGeometry(0.34, 32), mat('#26307a'), [0, 0, 0]); const fl = createFlask(0.46, '#ff8fa8', 0.6); fl.position.set(0, -0.22, 0.02); em.add(fl);
  // nest on top
  const nest = createNest(0.7, 5); nest.position.set(0, 3.57, 0); B.add(nest);
  const t = createToucan({ scale: num('ts', 2.2) }); t.userData.crouch(0.1); t.position.set(0, 3.74, 0.05); t.rotation.y = 0.15; scene.add(t);
  t.userData.pose({ headTilt: 0.05, wings: { l: [0, 0.1], r: [0, 0.1] } });
  // flags either side + bunting
  for (const [x, f] of [[-3.7, 1], [3.7, -1]]) { const fg = createFlag(1.1, 0.66, 2.6); fg.position.set(x, 0, 1.6); if (f < 0) fg.scale.x = -1; scene.add(fg); }
  frame(S, [t], [0, 2.4, 9.8], [0, 2.7, 0]);
});
</script></body></html>
