<html><head><meta charset="utf-8"><title>q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q01 — PURITAN builds a ship with one big PORTHOLE and pushes it into the sea.
import { THREE, guard, makeStage, createPorthole, makeShip, makePerson, mat, add, blob, box, cyl, frame, toon } from './stage.js';
guard(() => {
  const stage = makeStage({ dock: false }), s = stage.scene;
  // sand slipway sloping into sea, left
  add(s, new THREE.BoxGeometry(9, 0.6, 3.4), mat('#e6c48a'), [-4.6, -0.3, 0.2]);
  for (let i = 0; i < 5; i++) cyl(s, '#6b4423', [-2.2 + i * 0.35, 0.02, 0.3], 0.07, 1.4, [Math.PI / 2, 0, 0]);
  const ship = makeShip(); ship.position.set(0.4, 0.28, 0); s.add(ship);
  add(ship, new THREE.PlaneGeometry(1.5, 1.9), mat('#fff6e4', { side: THREE.DoubleSide }), [0.55, 1.5, 0], [0, 0, 0]);
  const p = createPorthole({ scale: 1.8 }); p.position.set(0.5, 0.3, 0.3); p.userData.setMood('open');
  p.userData.pose({ arms: { l: [0, 0.8, 0], r: [0, -0.8, 0] } }); s.add(p);
  const pur = makePerson({ coat: '#16161c', pants: '#16161c', hair: '#6b4a2a', scale: 0.95 }); pur.position.set(-2.3, 0, 0.9); pur.rotation.y = 0.7; s.add(pur);
  const pa = pur.userData.arms; pa.l.rotation.x = -1.35; pa.r.rotation.x = -1.35;
  const H = (y) => { const h = new THREE.Group(); h.position.set(0, 1.62 + y, 0); pur.add(h); return h; };
  const hat = H(0); cyl(hat, '#111', [0, 0.32, 0], 0.2, 0.5, [0, 0, 0], 0.24); cyl(hat, '#111', [0, 0.07, 0], 0.4, 0.05);
  cyl(hat, '#f2c230', [0, 0.17, 0.02], 0.215, 0.09, [0, 0, 0], 0.255).scale.set(1, 1, 1);
  box(hat, '#f2c230', [0, 0.17, 0.25], [0.16, 0.12, 0.03]); box(hat, '#111', [0, 0.17, 0.27], [0.09, 0.07, 0.03]);
  const collar = add(pur, new THREE.TorusGeometry(0.22, 0.07, 8, 28), mat('#fff'), [0, 1.36, 0], [Math.PI / 2, 0, 0], [1, 1, 0.8]);
  box(pur, '#fff', [0, 1.1, 0.25], [0.18, 0.42, 0.03]);
  toon(stage, p, pur);
  frame(stage, { cam: [-0.4, 1.4, 5.6], look: [-0.3, 1.0, 0] });
});
</script></body></html>
