</head><body><script type="module">
// ZORRO planted a flag on a KANGAROO that sells COBWEBS.
import { THREE, guard, canvasTexture, rng, makeStage, createPorthole, makeShip, makePerson, makeZorro, makeCapsule, makeGlyph, textPlane, mat, add, blob, box, cyl, frame, toon } from './stage.js';
guard(() => {
  const stage = makeStage({}), s = stage.scene;
  const makeWeb = () => { const g = new THREE.Group(); const seg = (x1, y1, x2, y2) => { const l = Math.hypot(x2 - x1, y2 - y1); box(g, '#ffffff', [(x1 + x2) / 2, (y1 + y2) / 2, 0], [l, 0.025, 0.025], [0, 0, Math.atan2(y2 - y1, x2 - x1)]); };
    for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283; seg(0, 0, Math.cos(a) * 0.65, Math.sin(a) * 0.65); }
    for (let r = 0.16; r <= 0.65; r += 0.16) for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283, b = (i + 1) / 10 * 6.283; seg(Math.cos(a) * r, Math.sin(a) * r, Math.cos(b) * r, Math.sin(b) * r); } return g; };
  for (const x of [-3.4, 3.4]) cyl(s, '#6b4423', [x, 1.5, -0.6], 0.07, 3);
  cyl(s, '#6b4423', [0, 2.7, -0.6], 0.03, 6.8, [0, 0, Math.PI / 2]);
  for (const x of [-2.4, -0.4, 1.6, 2.9]) { const m = makeWeb(); m.position.set(x, 2.0, -0.55); s.add(m); blob(s, '#2b2230', [x + 0.1, 1.55, -0.5], [0.09, 0.08, 0.08]); }
  const k = new THREE.Group(); k.position.set(0.3, 0, 0.6); k.rotation.y = -0.5; s.add(k);
  const fur = '#c48a4e', pale = '#ecd3a8';
  blob(k, fur, [0, 1.0, 0], [0.45, 0.65, 0.38], [0, 0, -0.15]); blob(k, pale, [0.12, 0.95, 0.12], [0.3, 0.45, 0.3], [0, 0, -0.15]);
  blob(k, fur, [0.12, 1.85, 0], [0.26, 0.28, 0.24]); blob(k, pale, [0.34, 1.77, 0], [0.16, 0.12, 0.13]); blob(k, '#2a1a14', [0.48, 1.8, 0], [0.04, 0.035, 0.04]);
  for (const sz of [-1, 1]) { blob(k, fur, [0.0, 2.2, sz * 0.12], [0.07, 0.27, 0.05], [sz * 0.2, 0, 0.1]); blob(k, '#fff', [0.28, 1.9, sz * 0.19], [0.06, 0.07, 0.03]); blob(k, '#1a1010', [0.31, 1.9, sz * 0.215], [0.035, 0.05, 0.02]); blob(k, fur, [0.0, 0.5, sz * 0.28], [0.3, 0.38, 0.17], [0, 0, 0.3]); box(k, '#a8693a', [0.2, 0.06, sz * 0.28], [0.6, 0.12, 0.16]); blob(k, fur, [0.3, 1.2, sz * 0.4], [0.07, 0.25, 0.07], [0.5 * sz, 0, -0.5]); }
  add(k, new THREE.ConeGeometry(0.2, 1.3, 20), mat(fur), [-0.75, 0.25, 0], [0, 0, 1.3]);
  blob(k, '#6a4528', [0.3, 0.9, 0.0], [0.2, 0.2, 0.3]); blob(k, fur, [0.32, 1.02, 0.0], [0.1, 0.12, 0.1]);
  cyl(k, '#8a5a2a', [-0.1, 2.3, -0.1], 0.03, 2.4); // flagpole planted in back
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.65), new THREE.MeshStandardMaterial({ color: '#d92a35', side: THREE.DoubleSide })); fl.position.set(0.4, 3.2, -0.1); k.add(fl);
  const z = makeZorro(1.0); z.position.set(1.45, 0, 0.85); z.rotation.y = -0.5; s.add(z); z.userData.arms.l.rotation.set(-1.7, 0, 0.5);
  const p = createPorthole({ scale: 1.5 }); p.position.set(-2.1, 0, 1.0); p.rotation.y = 0.45; p.userData.setMood('smile'); p.userData.pose({ arms: { l: [0, 0.7, 0], r: [0, -0.8, 0] } }); s.add(p);
  toon(stage, p, z);
  frame(stage, { cam: [0, 1.7, 6.2], look: [0, 1.5, 0] });});
