<!doctype html>
<html><head><meta charset="utf-8"><title>Alnylam q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — "Under a hot SUN, the LAMB signs its incorporation papers." Realistic-anime style.
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { buildQ01 } from './q01_scene.js';

guard(() => {
  const P = new URLSearchParams(location.search);
  const num = (k, d) => Number(P.get(k) ?? d);
  const stage = createAnimeStage({
    fov: num('fov', 46), sunElevation: num('el', 27), sunAzimuth: num('az', 196), exposure: num('exp', 1),
    sky: { cover: num('cover', 2), seed: num('seed', 3), towerTop: num('top', 0.5), puffCover: num('puff', 2) },
    rim: { color: '#fff3dc', strength: num('rim', 1.4), width: num('rimw', 0.55) },
    sunIntensity: num('sun', 2.6), ambient: { color: '#e8e2ff', intensity: num('amb', 2.3) }, triBumpScale: num('tbump', 0.3),
    ink: { width: num('inkw', 1.2), strength: num('ink', 0.85), normalThresh: num('nth', 0.45), normalStrength: num('nstr', 0.45), fadeFar: num('fade', 60) },
    flare: num('flare', 0.9),
    fog: { near: 120, far: 1500 },
  });
  // Writing surface leans toward the low camera so the papers read.
  const { lamb } = buildQ01(stage.scene, (k, d) => num(k, { tilt: 0.55, tiltdrop: 0.04 }[k] ?? d));
  const lambMeshes = new Set();
  lamb.traverse((o) => lambMeshes.add(o));
  stage.toonify(stage.scene, (m) => lambMeshes.has(m));

  stage.addClouds([[150, 900, 90, 1.2], [168, 1300, 200, 2.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9], [232, 1250, 230, 2.4], [252, 900, 80, 1.1], [130, 1100, 110, 1.3], [270, 1200, 160, 1.8]]);

  stage.camera.position.set(num('cx', 0.3), num('cy', 0.36), num('cz', 2.45));
  stage.camera.lookAt(num('tx', 0.12), num('ty', 0.88), num('tz', 0));
  stage.finish();
});
</script></body></html>
