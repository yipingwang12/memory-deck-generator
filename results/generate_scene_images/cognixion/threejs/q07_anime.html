<!doctype html>
<html><head><meta charset="utf-8"><title>Cognixion</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, rbox, cyl, textPlane, visor, gnome, star, start } from './props.js';
import { createCog } from './cog.js';
start(({ scene }) => {
  add(scene, new THREE.PlaneGeometry(400, 400), mat('#e9edf2'), [0, 0.001, 0], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(40, 14), mat('#ffe9c4'), [0, 5.5, -2.3]);
  textPlane(scene, 'BREAKTHROUGH', { w: 3.2, h: 0.5, bg: '#d4422b', pos: [0, 2.5, -2.25] });
  const c = createCog({ scale: 1.6 }); c.position.set(-0.6, 0, 0); c.rotation.y = 0.1; scene.add(c);
  c.userData.pose({ arms: { l: [0, 0.4, 0], r: [0, 0.4, 0] } });
  const v = visor({ body: '#f3f4f8', glass: '#1c2a4a' }); v.position.set(0, 0.68, 0.095); c.add(v);
  textPlane(c, '1', { w: 0.14, h: 0.14, bg: '#ff5a2a', pos: [-0.17, 0.68, 0.17] });
  // badge on visor
  const b = star('#ffcc1a', 0.1, 0.03); b.position.set(0.18, 0.64, 0.17); c.add(b);
  for (const s of [-1, 1]) rbox(c, mat('#e03030'), [0.04, 0.14, 0.01], [0.18 + s * 0.035, 0.52, 0.16], [0, 0, s * 0.2], 0.005);
  // gnome on a stool, pinning
  rbox(scene, mat('#8a5a34'), [0.6, 0.45, 0.6], [0.5, 0.225, 0.4], [0, 0, 0], 0.03);
  const g = gnome({ scale: 1.9 }); g.position.set(0.5, 0.45, 0.4); g.rotation.y = -0.6; scene.add(g);
  g.userData.arm.l.rotation.set(-1.6, 0, 0.5); g.userData.arm.r.rotation.set(-0.3, 0, -0.35);
  return [c, g];
}, { fov: 38, cam: [0.2, 1.2, 4.0], look: [0.2, 1.1, 0], clouds: false });
</script></body></html>
