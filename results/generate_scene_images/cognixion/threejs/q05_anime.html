<!doctype html>
<html><head><meta charset="utf-8"><title>Cognixion</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, rbox, cyl, textPlane, visor, start } from './props.js';
import { createCog } from './cog.js';
start(({ scene }) => {
  add(scene, new THREE.PlaneGeometry(400, 400), mat('#e9edf2'), [0, 0.001, 0], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(40, 14), mat('#f5ecd9'), [0, 5.5, -2.3]);
  const c = createCog({ scale: 1.6, color: '#4f9bff' }); c.position.set(-0.9, 0, 0); c.rotation.y = 0.25; scene.add(c);
  c.userData.pose({ arms: { l: [0.3, 0.5, 0], r: [-0.3, 0.5, 0] }, legs: { l: [0.45, 0], r: [-0.45, 0] } });
  const v = visor({ body: '#c9ced6', glass: '#14161f', strap: '#8a8f99', w: 0.58 }); v.position.set(0, 0.68, 0.095); c.add(v);
  textPlane(c, 'AXON-R', { w: 0.34, h: 0.1, bg: '#2a6fd0', pos: [0, 1.06, 0.1] });
  // big apple
  const A = new THREE.Group(), red = mat('#e8262b', { roughness: 0.35 });
  blob(A, red, [-0.2, 0, 0], [0.45, 0.42, 0.42]); blob(A, red, [0.2, 0, 0], [0.45, 0.42, 0.42]);
  cyl(A, mat('#5a3a22'), 0.025, 0.03, 0.2, [0, 0.45, 0], [0, 0, 0.2]);
  const leaf = blob(A, mat('#4cc24a'), [0.17, 0.58, 0], [0.17, 0.07, 0.05], [0, 0, 0.4]);
  const bite = blob(A, mat('#f5ecd9'), [0.62, 0.18, 0.1], [0.2, 0.2, 0.3]);
  A.position.set(1.5, 0.95, -0.4); A.scale.setScalar(1.1); scene.add(A);
  rbox(scene, mat('#e9e4da'), [1.3, 0.5, 1.0], [1.5, 0.25, -0.4], [0, 0, 0], 0.03);
  textPlane(scene, 'VISION PRO', { w: 1.3, h: 0.3, bg: '#222733', pos: [1.5, 0.25, 0.115] });
  return [c];
}, { fov: 38, cam: [0.3, 1.0, 4.2], look: [0.4, 1.0, 0], clouds: false });
</script></body></html>
