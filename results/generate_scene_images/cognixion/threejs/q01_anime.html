<html><head><meta charset="utf-8"><title>Cognixion q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 - The COG turns on a SANTA's BARBER chair (Santa Barbara), California coast.
import { THREE, mat, add, blob, rbox, cyl, start } from './props.js';
import { createCog } from './cog.js';

function barberChair() {
  const g = new THREE.Group(), red = mat('#c8283a', { roughness: 0.35 }), chrome = mat('#cfd6de', { metalness: 0.8, roughness: 0.25 });
  cyl(g, chrome, 0.38, 0.42, 0.06, [0, 0.03, 0]); cyl(g, chrome, 0.07, 0.09, 0.3, [0, 0.21, 0]);
  rbox(g, red, [0.8, 0.14, 0.7], [0, 0.42, 0], [0, 0, 0], 0.06);
  rbox(g, red, [0.8, 0.9, 0.14], [0, 0.95, -0.32], [-0.1, 0, 0], 0.06);
  rbox(g, red, [0.42, 0.2, 0.12], [0, 1.52, -0.38], [-0.1, 0, 0], 0.05);
  for (const s of [-1, 1]) { rbox(g, chrome, [0.07, 0.07, 0.6], [s * 0.46, 0.62, 0.0], [0, 0, 0], 0.03); rbox(g, red, [0.1, 0.1, 0.36], [s * 0.46, 0.66, 0.1], [0, 0, 0], 0.04); cyl(g, chrome, 0.025, 0.025, 0.2, [s * 0.46, 0.52, -0.2]); }
  rbox(g, chrome, [0.5, 0.06, 0.3], [0, 0.07, 0.5], [0.2, 0, 0], 0.02);
  return g;
}
function santaHat() {
  const g = new THREE.Group();
  add(g, new THREE.ConeGeometry(0.2, 0.5, 28), mat('#d22b2b'), [0, 0.25, 0], [0, 0, 0.0]);
  add(g, new THREE.TorusGeometry(0.2, 0.06, 12, 32), mat('#fbfaf5', { roughness: 0.9 }), [0, 0, 0], [Math.PI / 2, 0, 0]);
  blob(g, mat('#fbfaf5', { roughness: 0.9 }), [0.0, 0.52, 0], [0.07, 0.07, 0.07]);
  return g;
}
function palm(x, z, h = 2.6) {
  const g = new THREE.Group(), trunk = mat('#8a6238'), leaf = mat('#2f9a4a');
  for (let i = 0; i < 9; i++) cyl(g, trunk, 0.07 - i * 0.003, 0.08 - i * 0.003, h / 9, [Math.sin(i * 0.2) * 0.1 * i * 0.2, (i + 0.5) * h / 9, 0], [0, 0, -0.04 * i]);
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; const f = add(g, new THREE.ConeGeometry(0.13, 1.3, 8), leaf, [Math.cos(a) * 0.55, h + 0.02, Math.sin(a) * 0.55], [Math.sin(a) * 1.2, 0, -Math.cos(a) * 1.2], [1, 1, 0.25]); }
  g.position.set(x, 0, z); return g;
}

start(({ scene }) => {
  const sea = add(scene, new THREE.PlaneGeometry(400, 200), mat('#2aa6d8', { roughness: 0.3 }), [0, 0.01, -60], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(400, 20), mat('#f6f1e4'), [0, 0.015, -4], [-Math.PI / 2, 0, 0]);
  for (let i = 0; i < 9; i++) add(scene, new THREE.PlaneGeometry(14, 0.3), mat('#ffffff'), [-24 + i * 6, 0.02, -14 - (i % 3) * 3], [-Math.PI / 2, 0, 0]);
  scene.add(palm(-2.4, -1.5), palm(2.7, -2.4, 3));
  const chair = barberChair(); chair.position.set(0.5, 0, 0); chair.rotation.y = -0.15; scene.add(chair);
  const hat = santaHat(); hat.position.set(0.5, 1.58, -0.4); hat.rotation.set(-0.1, -0.15, 0.0); hat.scale.setScalar(0.9); scene.add(hat);
  // barber pole
  const pole = new THREE.Group(); cyl(pole, mat('#cfd6de', { metalness: 0.7, roughness: 0.3 }), 0.1, 0.1, 0.06, [0, 0.03, 0]);
  const stripes = new THREE.CanvasTexture((() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 64, 256); x.fillStyle = '#d02a3a'; x.fillRect(0, 0, 64, 256); x.fillStyle = '#fff'; for (let i = -4; i < 8; i++) { x.beginPath(); x.moveTo(0, i * 64); x.lineTo(64, i * 64 + 32); x.lineTo(64, i * 64 + 64); x.lineTo(0, i * 64 + 32); x.fill(); } x.fillStyle = '#2a4fb8'; for (let i = -4; i < 8; i++) { x.beginPath(); x.moveTo(0, i * 64 + 32); x.lineTo(64, i * 64 + 64); x.lineTo(64, i * 64 + 80); x.lineTo(0, i * 64 + 48); x.fill(); } return c; })());
  add(pole, new THREE.CylinderGeometry(0.11, 0.11, 1.0, 24), new THREE.MeshStandardMaterial({ map: stripes, roughness: 0.3 }), [0, 0.58, 0]);
  blob(pole, mat('#cfd6de', { metalness: 0.7 }), [0, 1.12, 0], [0.12, 0.08, 0.12]);
  pole.position.set(-1.35, 0, 0.4); scene.add(pole);

  const cog = createCog({ scale: 1.0 });
  cog.position.set(0.5, 0.5, 0.15); cog.rotation.y = -0.15; scene.add(cog);
  cog.userData.pose({ spin: 0.5, arms: { l: [0, 0.5, 0], r: [0, 0.5, 0] }, legs: { l: [-1.2, 0], r: [-1.2, 0] } });
  // spin arcs
  for (const [a0, a1] of [[0.3, 1.1], [3.4, 4.2]]) { const arc = add(cog, new THREE.TorusGeometry(0.46, 0.012, 6, 24, a1 - a0), mat('#ffffff', { emissive: '#ffffff', emissiveIntensity: 0.5 }), [0, 0.64, 0.02], [0, 0, a0]); arc.castShadow = false; }
  return [cog];
}, { ground: '#f0e2bd', fov: 38, cam: [0.2, 1.1, 4.6], look: [0.25, 0.95, 0], sky: { cover: 0.8 } });
</script></body></html>
