<!doctype html>
<html><head><meta charset="utf-8"><title>Cognixion</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, rbox, cyl, textPlane, visor, start } from './props.js';
import { createCog } from './cog.js';
start(({ scene }) => {
  add(scene, new THREE.PlaneGeometry(400, 400), mat('#e9edf2'), [0, 0.001, 0], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(40, 14), mat('#d6e6f5'), [0, 5.5, -2.3]);
  const c = createCog({ scale: 1.5 }); c.position.set(0, 0, 0); scene.add(c);
  c.userData.pose({ arms: { l: [0, 0.6, 0], r: [0, 0.6, 0] } });
  const v = visor({ body: '#f3f4f8', glass: '#2a1a55' }); v.position.set(0, 0.68, 0.095); c.add(v);
  // EEG electrodes on rim + cables to a brain-wave line
  const green = mat('#3de08a', { emissive: '#1fa860', emissiveIntensity: 0.5 });
  const pts = [];
  for (let i = 0; i <= 60; i++) { const x = -1.3 + i * 2.6 / 60; pts.push(new THREE.Vector3(x, 2.35 + 0.22 * Math.sin(i * 0.55) * (0.6 + 0.4 * Math.sin(i * 0.13)), -0.3)); }
  add(scene, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 160, 0.035, 8), mat('#27d8ff', { emissive: '#27d8ff', emissiveIntensity: 0.9 }));
  for (let i = 0; i < 5; i++) {
    const a = (30 + i * 30) * Math.PI / 180, p = new THREE.Vector3(0.37 * Math.cos(a), 0.64 + 0.37 * Math.sin(a), 0);
    blob(c, green, p.toArray(), [0.04, 0.04, 0.04]);
    const top = new THREE.Vector3(-0.5 + i * 0.25, 1.55, -0.1), s = c.localToWorld(p.clone());
    const d = top.clone().multiplyScalar(0).add(new THREE.Vector3(0.75 - i * 0.375, 2.3, -0.3)).sub(s);
    const m = add(scene, new THREE.CylinderGeometry(0.01, 0.01, d.length(), 6), mat('#1c1c26'), s.clone().add(d.clone().multiplyScalar(0.5)).toArray());
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  }
  // AR glasses hologram (right)
  const g = new THREE.Group(), gm = mat('#ff5ad2', { emissive: '#ff3ac0', emissiveIntensity: 0.8 });
  for (const s of [-1, 1]) add(g, new THREE.TorusGeometry(0.33, 0.045, 12, 40), gm, [s * 0.4, 0, 0]);
  add(g, new THREE.CylinderGeometry(0.03, 0.03, 0.2, 8), gm, [0, 0.08, 0], [0, 0, Math.PI / 2]);
  g.position.set(1.9, 1.3, -0.2); g.rotation.y = -0.25; scene.add(g);
  // predictive AI chip (left)
  const chip = new THREE.Group();
  rbox(chip, mat('#33384a', { metalness: 0.4 }), [0.8, 0.8, 0.1], [0, 0, 0], [0, 0, 0], 0.06);
  for (let i = -2; i <= 2; i++) for (const s of [-1, 1]) { rbox(chip, mat('#d8b24a', { metalness: 0.7 }), [0.12, 0.04, 0.04], [s * 0.46, i * 0.15, 0], [0, 0, 0], 0.01); rbox(chip, mat('#d8b24a', { metalness: 0.7 }), [0.04, 0.12, 0.04], [i * 0.15, s * 0.46, 0], [0, 0, 0], 0.01); }
  textPlane(chip, 'AI', { w: 0.55, h: 0.45, bg: '#7a4dff', pos: [0, 0, 0.056] });
  chip.position.set(-1.9, 1.3, -0.2); chip.rotation.y = 0.25; scene.add(chip);
  return [c];
}, { fov: 38, cam: [0, 1.3, 4.6], look: [0, 1.3, 0], clouds: false });
</script></body></html>
