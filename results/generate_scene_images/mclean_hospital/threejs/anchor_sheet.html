<!doctype html><html><head><title>McLean anchor</title><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
import { THREE, mat, add, makeStage, finishScene, guard } from './stage_common.js';
import { createBroom } from './broom.js';
guard(() => {
  const stage = makeStage(), scene = stage.scene;
  add(scene, new THREE.PlaneGeometry(400, 400), mat('#6fae45'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
  const bs = [];
  [[-1.0, 0.0, 0], [0, 0.55, 0.15], [1.0, -1.2, 0]].forEach(([x, ry, lean], i) => {
    const b = createBroom({ scale: 1.2 }); b.position.set(x, 0, 0); b.rotation.y = ry; scene.add(b);
    b.userData.pose({ headTilt: 0.06 * (i - 1), arms: { l: [0, 0.5 + 0.4 * i, 0.3], r: [0, 0.5, 0.3] } }); bs.push(b);
  });
  finishScene(stage, scene, bs, [0, 1.0, 4.3], [0, 0.8, 0]);
});
</script></body></html>
