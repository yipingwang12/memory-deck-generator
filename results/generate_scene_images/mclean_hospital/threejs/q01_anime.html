<!doctype html><html><head><title>McLean q01</title><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
import { THREE, mat, add, blob, num, rng, makeStage, finishScene, guard, HEAD } from './stage_common.js';
import { createBroom } from './broom.js';
import * as P from './props.js';
guard(() => {
  const stage = makeStage(), scene = stage.scene;
  const ground = (c, y = 0) => add(scene, new THREE.PlaneGeometry(400, 400), mat(c), [0, y, 0], [-Math.PI / 2, 0, 0]);

  ground('#6fae45');
  const m = P.buildMountain(3.0, 3.6, '#8a7a9a'); m.position.set(-0.6, 0, -2.2); scene.add(m);
  const m2 = P.buildMountain(2.0, 2.6, '#9a8aa8', 8); m2.position.set(-3.8, 0, -3.5); scene.add(m2);
  const bell = new THREE.Group(); bell.position.set(-0.6, 3.5, -2.2); scene.add(bell);
  const gold = mat('#f2c230', { metalness: 0.6, roughness: 0.3 });
  const pts = [[0.0,0.0],[0.4,0.0],[0.36,0.1],[0.28,0.3],[0.2,0.5],[0.14,0.62],[0.0,0.66]].map(([x,y]) => new THREE.Vector2(x,y));
  add(bell, new THREE.LatheGeometry(pts, 32), gold, [0, 0.4, 0]);
  blob(bell, gold, [0, 0.22, 0], [0.09, 0.09, 0.09]); add(bell, new THREE.TorusGeometry(0.09, 0.02, 8, 16), gold, [0, 1.12, 0]);
  
  for (const [x,y] of [[-0.62,0.9],[0.62,1.0],[-0.5,1.5],[0.5,1.55]]) P.sparkle(bell, [x,y,0.2], 0.07);
  for (const [x,z,h] of [[-3.6,-0.8,1.4],[-2.9,-1.4,1.0],[3.2,-1.5,1.2],[2.6,-2.4,1.6],[-1.6,-1.0,0.9]]) { const t = P.buildPine(h); t.position.set(x,0,z); scene.add(t); }
  const b = createBroom({ scale: 1.9 }); b.position.set(0.8, 0.1, 1.0); b.rotation.set(0, -0.25, 0.28, 'YXZ'); scene.add(b);
  b.userData.pose({ headTilt: -0.08 }); b.userData.reach('l',[0.04,1.02,0.05]); b.userData.reach('r',[-0.04,0.9,0.05]);
  for (const [x,y,z,s] of [[-0.1,0.12,0.6,0.16],[0.2,0.3,0.7,0.12],[-0.4,0.2,0.4,0.1],[-0.7,0.35,0.5,0.08]]) P.dust(scene,[x+0.2,y,z],s);
  for (const [x,z] of [[1.9,1.0],[-0.4,1.3],[2.6,0.2],[-1.8,0.7]]) for (let i=0;i<5;i++) blob(scene, mat(['#ffd84a','#fff','#ff8fa8','#c9a0ff','#ff8fa8'][i]), [x+i*0.12,0.05,z+(i%2)*0.1],[0.05,0.05,0.05]);
  finishScene(stage, scene, [b], [0.3, 1.9, 7.2], [-0.2, 2.1, 0]);

});
</script></body></html>
