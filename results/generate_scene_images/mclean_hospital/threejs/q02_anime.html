<!doctype html><html><head><title>McLean q02</title><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
import { THREE, mat, add, blob, num, rng, makeStage, finishScene, guard, HEAD } from './stage_common.js';
import { createBroom } from './broom.js';
import * as P from './props.js';
guard(() => {
  const stage = makeStage(), scene = stage.scene;
  const ground = (c, y = 0) => add(scene, new THREE.PlaneGeometry(400, 400), mat(c), [0, y, 0], [-Math.PI / 2, 0, 0]);

  ground('#d8d4c6'); add(scene, new THREE.PlaneGeometry(400, 3), mat('#6fae45'), [0, 0.003, 3.2], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.BoxGeometry(5.6, 2.6, 1.6), mat('#f1ead8'), [0, 1.3, -1.6]);
  add(scene, new THREE.BoxGeometry(5.9, 0.16, 1.9), mat('#c9bfa6'), [0, 2.68, -1.6]);
  for (let i = 0; i < 6; i++) add(scene, new THREE.CylinderGeometry(0.14, 0.16, 2.5, 18), mat('#fffaf0'), [-2.2 + i * 0.88, 1.3, -0.65]);
  for (const s of [-1, 1]) add(scene, new THREE.BoxGeometry(1.5, 1.0, 0.1), mat('#7fc3e8', { metalness: 0.3, roughness: 0.2 }), [s * 1.6, 1.45, -0.78]);
  add(scene, new THREE.BoxGeometry(0.9, 1.5, 0.1), mat('#6b4a2f'), [0, 0.75, -0.78]);
  for (let i = 0; i < 4; i++) add(scene, new THREE.BoxGeometry(4.4 - i * 0.2, 0.12, 1.0), mat('#e6dfcd'), [0, 0.06 + i * 0.12, -0.2 + (3 - i) * 0.2 - 0.2]);
  const gear = P.buildGear(0.75); gear.position.set(0, 3.95, -1.0); scene.add(gear);
  const g2 = P.buildGear(0.38, '#e8642c', 8); g2.position.set(1.0, 3.55, -1.0); g2.rotation.z = 0.2; scene.add(g2);
  const dome = add(scene, new THREE.SphereGeometry(0.95, 32, 20, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#bfe9ff', transparent: true, opacity: 0.18, roughness: 0.1 }), [-3.1, 1.0, 0.9]);
  add(scene, new THREE.CylinderGeometry(1.05, 1.1, 1.0, 32), mat('#e6dfcd'), [-3.1, 0.5, 0.9]);
  const brain = P.buildBrain(0.75); brain.position.set(-3.1, 1.4, 0.9); scene.add(brain);
  const chip = new THREE.Group(); chip.position.set(3.1, 1.0, 0.9); chip.rotation.y = -0.3; scene.add(chip);
  add(chip, new THREE.BoxGeometry(1.3, 1.3, 0.16), mat('#1f7a4d'));
  add(chip, new THREE.BoxGeometry(0.7, 0.7, 0.05), mat('#5a5a66', { metalness: 0.4 }), [0, 0, 0.1]);
  for (let i = 0; i < 6; i++) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) add(chip, new THREE.BoxGeometry(dx ? 0.22 : 0.09, dy ? 0.22 : 0.09, 0.04), mat('#e2b13c', { metalness: 0.6 }), [dx * 0.72 + (dy ? (i - 2.5) * 0.18 : 0), dy * 0.72 + (dx ? (i - 2.5) * 0.18 : 0), 0]);
  add(chip, new THREE.CylinderGeometry(0.5, 0.6, 0.5, 4), mat('#d9d4c4'), [0, -1.05, -0.05]).position.y = -1.0;
  const b = createBroom({ scale: 1.9 }); b.position.set(0.3, 0.48, 2.4); b.rotation.set(0, -0.2, 0.3, 'YXZ'); scene.add(b);
  b.userData.pose({ headTilt: -0.07 }); b.userData.reach('l',[0.04,1.02,0.05]); b.userData.reach('r',[-0.04,0.9,0.05]);
  for (const [x,y,z,s] of [[-0.3,0.55,2.0,0.14],[0.0,0.6,2.2,0.1],[-0.6,0.6,1.9,0.09]]) P.dust(scene,[x,y,z],s);
  finishScene(stage, scene, [b], [0, 2.0, 8.6], [0, 1.8, 0]);

});
</script></body></html>
