// q02 - The CAMPER parks among ALL the STONES
import { run, THREE, mat, add, blob, box, cyl, panel, bigText, person, rng } from './world.js';
import { brain, robotHead, coinPile, sugarCubes, gear, tree } from './props.js';

run({ ground: '#8aa86a', camper: { ry: 0.5 }, cam: [0.2, 1.3, 4.8], look: [0, 0.8, 0],
  build: ({ scene, van }) => {
    const r = rng(9), cols = ['#8c8a86', '#a39d92', '#767a80', '#b3a58c', '#6f6b66'];
    const rock = (x, z, s) => { const m = add(scene, new THREE.DodecahedronGeometry(1, 1), mat(cols[Math.floor(r() * 5)], { roughness: 0.95 }), [x, s * 0.6, z], [r(), r() * 3, r()], [s, s * 0.75, s * 0.9]); return m; };
    [[-2.3, -0.6, 1.0], [2.4, -0.7, 1.2], [-3.4, -2, 1.5], [3.6, -2.2, 1.7], [-1.2, -2.6, 1.3], [1.3, -2.8, 1.5], [0, -4, 2], [-2.4, 0.9, 0.55], [2.5, 0.9, 0.6], [-1.5, 1.8, 0.35], [1.7, 1.9, 0.38], [-0.9, -1.2, 0.5], [0.95, -1.3, 0.45], [-3.0, 0.3, 0.5], [3.2, 0.4, 0.45], [0.2, 2.3, 0.3]].forEach(([x, z, s]) => rock(x, z, s));
    van.userData.pose({ arms: { l: [0, 1.0, 0.2], r: [0, 1.0, 0.2] } });
  } });
