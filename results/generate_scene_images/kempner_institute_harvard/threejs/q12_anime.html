<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q12 - A CACKLING CAKE (Kakade) and a SABRE (Sabatini) drive the CAMPER together
import { run, THREE, mat, add, blob, box, cyl, panel, bigText, person, rng } from './world.js';
import { brain, robotHead, coinPile, sugarCubes, gear, tree } from './props.js';

run({ camper: { pos: [0, 0, 0.2], ry: 0.0 }, cam: [0, 1.5, 5.6], look: [0, 1.2, 0],
  build: ({ scene, van, toon }) => {
    const wh = new THREE.Group(); add(wh, new THREE.TorusGeometry(1.05, 0.12, 14, 44), mat('#2a2a30')); add(wh, new THREE.TorusGeometry(0.3, 0.2, 12, 24), mat('#2a2a30'), [0, 0, 0], [0, 0, 0], [1, 1, 0.8]);
    for (let i = 0; i < 3; i++) add(wh, new THREE.CylinderGeometry(0.07, 0.07, 1.9, 10), mat('#2a2a30'), [0, 0, 0], [0, 0, i * 1.047]);
    add(wh, new THREE.TorusGeometry(1.05, 0.05, 8, 44), mat('#c9a84a', { metalness: 0.6 }), [0, 0, 0.1]);
    wh.position.set(0, 1.6, -1.3); wh.scale.setScalar(1.15); scene.add(wh);
    const ck = new THREE.Group(), cr = '#ffd0e0';
    cyl(ck, 0.62, 0.62, 0.5, '#f6e2b6', [0, 0.25, 0]); cyl(ck, 0.46, 0.46, 0.45, cr, [0, 0.72, 0]);
    add(ck, new THREE.TorusGeometry(0.6, 0.07, 10, 30), mat('#fff'), [0, 0.52, 0], [Math.PI / 2, 0, 0]); add(ck, new THREE.TorusGeometry(0.45, 0.06, 10, 30), mat('#fff'), [0, 0.95, 0], [Math.PI / 2, 0, 0]);
    for (const x of [-0.2, 0, 0.2]) blob(ck, mat('#e02a3a'), [x, 1.12 + (x === 0 ? 0.08 : 0), 0], [0.12, 0.17, 0.08]);
    add(ck, new THREE.ConeGeometry(0.12, 0.3, 12), mat('#ff9a1a'), [0, 0.7, 0.55], [Math.PI / 2, 0, 0]);
    blob(ck, mat('#e02a3a'), [0, 0.46, 0.5], [0.07, 0.12, 0.06]);
    for (const x of [-1, 1]) { blob(ck, mat('#fff'), [x * 0.17, 0.86, 0.43], [0.1, 0.12, 0.04]); blob(ck, mat('#2a1a10'), [x * 0.17, 0.85, 0.46], [0.065, 0.085, 0.03]); blob(ck, mat('#fff'), [x * 0.15, 0.89, 0.49], [0.02, 0.02, 0.01]); }
    ck.position.set(-2.0, 0, 0.7); ck.scale.setScalar(1.2); ck.rotation.y = 0.3; scene.add(ck);
    const sb = new THREE.Group(), steel = { metalness: 0.9, roughness: 0.2 };
    for (let i = 0; i < 14; i++) { const t = i / 13, a = 0.25 * t; box(sb, 0.16 - 0.1 * t * t, 0.18, 0.03, '#e8eef4', [Math.sin(a) * t * 0.55 * 0 + t * t * 0.25, 0.2 + t * 1.6, 0], [0, 0, -a * 1.2], 0.01, steel); }
    box(sb, 0.8, 0.09, 0.14, '#e8b830', [0, 0.17, 0], [0, 0, 0], 0.04, { metalness: 0.7 }); cyl(sb, 0.05, 0.05, 0.3, '#5a2a1a', [0, -0.03, 0]); blob(sb, mat('#e8b830', { metalness: 0.7 }), [0, -0.2, 0], [0.1, 0.1, 0.1]);
    sb.position.set(2.2, 0.35, 0.7); sb.rotation.set(0, 0.5, -0.05); sb.scale.setScalar(1.2); scene.add(sb);
    cyl(scene, 0.35, 0.45, 0.25, '#8c8a86', [2.2, 0.12, 0.7]);
    van.userData.pose({ arms: { l: [0, 1.5, 0.3], r: [0, 1.5, 0.3] } });
  } });
