import { run, THREE, mat, add, blob, box, cyl, panel, bigText, person, rng } from './world.js';

run({ camper: { ry: 0.25 }, cam: [0, 1.15, 4.6], look: [0, 0.85, 0],
  build: ({ scene, van, toon }) => {
    const ped = (x) => { cyl(scene, 0.45, 0.55, 0.6, '#e8e2d6', [x, 0.3, 0]); cyl(scene, 0.5, 0.5, 0.06, '#c9b27a', [x, 0.63, 0]); };

    for (const [x, c] of [[-1.95, '#ff9ac0'], [1.95, '#7fe6ff']]) for (let i = 0; i < 6; i++) { const a = i * 1.05; blob(scene, mat(c, { emissive: c, emissiveIntensity: 0.8 }), [x + Math.cos(a) * 1.0, 1.5 + Math.sin(a) * 0.8, 0.2], [0.05, 0.05, 0.05]); }

  } });
