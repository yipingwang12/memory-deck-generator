    add(eng, new THREE.TorusGeometry(0.03, 0.012, 8, 20), mat('#c0c8d0', { metalness: 0.8 }), [0.27, 0.5, 0.1], [0, 0, 0], [1.6, 1.6, 1]);
    cyl(eng, 0.022, 0.022, 0.45, '#c0c8d0', [0.27, 0.28, 0.1], [0, 0, 0], { metalness: 0.8 });
    for (let i = 0; i < 4; i++) { cyl(scene, 0.4, 0.4, 0.09, '#f5c230', [0.9, 0.05 + i * 0.1, 1.7], [0, 0, 0], { metalness: 0.7 }); }
