<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
// q15 - The CAMPER first cluster: 384 NVIDIA H100 chips
import { run, THREE, mat, add, blob, box, cyl, panel, bigText, person, rng } from './world.js';
import { brain, robotHead, coinPile, sugarCubes, gear, tree } from './props.js';

run({ ground: '#cfd6dd', camper: { pos: [-0.1, 0, 0.9], ry: 0.4, scale: 1.45 }, cam: [0.2, 1.4, 5.8], look: [0.1, 1.25, 0],
  build: ({ scene, van }) => {
    const R = new THREE.Group(); box(R, 1.7, 3.2, 1.0, '#23272e', [0, 1.6, 0], [0, 0, 0], 0.06);
    for (let i = 0; i < 7; i++) { box(R, 1.5, 0.28, 0.06, '#3a414c', [0, 0.35 + i * 0.36, 0.52], [0, 0, 0], 0.02);
      for (let j = 0; j < 4; j++) box(R, 0.28, 0.14, 0.04, '#76b900', [-0.5 + j * 0.33, 0.35 + i * 0.36, 0.56], [0, 0, 0], 0.02, { emissive: '#76b900', emissiveIntensity: 0.9 }); }
    box(R, 1.5, 0.45, 0.06, '#0a0f0a', [0, 3.0, 0.52]);
    panel(R, 1.4, 0.4, (ctx) => { ctx.fillStyle = '#071208'; ctx.fillRect(0, 0, 512, 512); ctx.fillStyle = '#76ff3a'; ctx.font = 'bold 380px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('384', 256, 270); }, [0, 3.0, 0.56]);
    R.position.set(2.2, 0, -0.4); R.rotation.y = -0.35; scene.add(R);
    const C = new THREE.Group(); box(C, 1.7, 1.7, 0.1, '#1d6a2a', [0, 0, 0], [0, 0, 0], 0.05);
    box(C, 1.25, 1.25, 0.14, '#cfd5db', [0, 0, 0.06], [0, 0, 0], 0.05, { metalness: 0.8, roughness: 0.3 });
    box(C, 0.6, 0.6, 0.02, '#4a5058', [0, 0.35, 0.14], [0, 0, 0], 0.01);
    panel(C, 1.1, 0.5, (ctx) => { ctx.fillStyle = '#2a2f36'; ctx.fillRect(0, 0, 512, 512); ctx.fillStyle = '#b6ff3a'; ctx.font = 'bold 190px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('H100', 256, 270); }, [0, -0.3, 0.14]);
    C.children[C.children.length - 1].material.transparent = true; C.children[C.children.length - 1].material.color.set('#2a2f36'); C.children[C.children.length - 1].material.map = C.children[C.children.length - 1].material.map;
    for (let i = 0; i < 12; i++) for (const s of [-1, 1]) { box(C, 0.05, 0.1, 0.03, '#e8c860', [-0.8 + i * 0.145, s * 0.8, 0.03], [0, 0, 0], 0.01, { metalness: 0.8 }); box(C, 0.1, 0.05, 0.03, '#e8c860', [s * 0.8, -0.8 + i * 0.145, 0.03], [0, 0, 0], 0.01, { metalness: 0.8 }); }
    C.position.set(-2.2, 1.45, 0.4); C.scale.setScalar(0.85); C.rotation.set(-0.05, 0.2, 0); scene.add(C);
    van.userData.pose({ arms: { l: [0, 1.3, 0.3] } });
  } });

</script></body></html>
