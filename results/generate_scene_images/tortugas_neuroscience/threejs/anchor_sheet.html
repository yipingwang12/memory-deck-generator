<!doctype html>
<html><head><meta charset="utf-8"><title>Turtle anchor sheet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, makeScene, createTurtle, mat } from './common.js';
makeScene(({ stage, scene }) => {
  const out = [];
  [[-1.1, 0.5, 0], [-0.35, 0, 1], [0.4, Math.PI / 2, 0], [1.1, Math.PI, 0]].forEach(([x, ry, c]) => {
    const t = createTurtle({ crown: false }); t.position.x = x; t.rotation.y = ry; scene.add(t); out.push(t);
    t.userData.pose({ arms: { l: [0, 0.4, 0.3], r: [0, 0.4, 0.3] } });
  });
  return out;
}, { ground: '#f1d9b0', fov: 28, cam: { pos: [0, 0.8, 4.4], look: [0, 0.5, 0] }, sky: { cover: 0.02, puffCover: 0.02, towerTop: 0.02 } });
</script></body></html>
