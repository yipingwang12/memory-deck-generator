<!doctype html>
<html><head><meta charset="utf-8"><title>Tortugas q01 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, makeScene, createTurtle, createShell, mat, add, blob, box, cyl, link, egg, capsule, textMat, rng } from './common.js';
// q01 - The TURTLE crawls out of its shell onto a NACHO.
makeScene(({ scene }) => {
  const table = add(scene, new THREE.CylinderGeometry(6, 6, 0.3, 48), mat('#b0703c'), [0, -0.15, 0]);
  // giant nacho chip (triangle) + cheese + jalapeno
  const chipM = mat('#f2b83a', { roughness: 0.8 });
  const chip = new THREE.Group(); scene.add(chip);
  const tri = add(chip, new THREE.CylinderGeometry(1.25, 1.25, 0.14, 3), chipM, [0, 0.07, 0], [0, Math.PI / 2, 0]);
  const cheese = mat('#ff9a1f', { roughness: 0.3 });
  blob(chip, cheese, [0, 0.15, 0.1], [0.75, 0.07, 0.6]);
  for (const [x, z, r] of [[-0.7, 0.45, 0.1], [0.65, 0.5, 0.12], [0.0, 0.85, 0.11], [-0.35, -0.3, 0.09]]) {
    blob(chip, cheese, [x, 0.12, z], [r * 1.3, 0.06, r * 1.3]);
    cyl(chip, cheese, [x, 0.02, z + 0.05], r * 0.5, 0.16);
  }
  for (const [x, z] of [[-0.5, 0.15], [0.45, 0.2], [0.1, 0.6]]) cyl(chip, mat('#3fa13a'), [x, 0.2, z], 0.09, 0.04);
  // background chips
  for (const [x, z, ry] of [[-2, -1.8, 0.4], [2.1, -1.5, 1.2], [0.2, -2.6, 2.4]]) add(scene, new THREE.CylinderGeometry(1, 1, 0.12, 3), chipM, [x, 0.06, z], [0.15, ry, 0.1]);
  // empty shell behind, opening toward camera
  const shell = createShell(); shell.position.set(0.05, 0.02, -0.55); shell.rotation.x = -Math.PI / 2 * 0.0; shell.scale.setScalar(1.25);
  shell.scale.setScalar(1.6); shell.rotation.set(-1.0, 0.3, 0); shell.position.set(0.6, 0.3, -0.7); scene.add(shell);
  const t = createTurtle({ shell: false, scale: 1.0 });
  t.position.set(-0.15, 0.17, 0.4); t.rotation.y = -0.15; scene.add(t);
  t.userData.pose({ headTilt: 0.12, arms: { l: [-0.9, 0.9, -0.4], r: [-0.9, -0.9, -0.4] }, legs: { l: [0.4, 0.1], r: [-0.3, -0.1] } });
  return [t, shell];
}, { ground: '#8a5a30', cam: { pos: [0.2, 1.15, 3.1], look: [0.05, 0.6, 0] } });
</script></body></html>
