<!doctype html>
<html><head><meta charset="utf-8"><title>Tortugas q06 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, makeScene, createTurtle, createShell, mat, add, blob, box, cyl, link, egg, capsule, textMat, rng } from './common.js';
// q06 - Four eggs reach the TURTLE from EISAI and JIANGSU HANSOH.
makeScene(({ scene }) => {
  box(scene, mat('#e8d3a0'), [0, -0.05, 0], [16, 0.1, 10]);
  const crate = (x, label, color, ry) => {
    const g = new THREE.Group(); g.position.set(x, 0, -0.2); g.rotation.y = ry; scene.add(g);
    const side = mat(color), face = textMat(label, { bg: '#ffffff', fg: color === '#2a63c9' ? '#1d3f8f' : '#b3261e', font: 'bold 120px sans-serif', w: 512, h: 256 });
    box(g, side, [0, 0.5, 0], [1.5, 1.0, 1.0]); box(g, face, [0, 0.5, 0.51], [1.3, 0.65, 0.02]);
    box(g, mat('#fff'), [0, 1.02, 0], [1.56, 0.06, 1.06]);
    return g;
  };
  crate(-2.1, 'EISAI', '#2a63c9', 0.35); crate(2.1, 'HANSOH', '#d6453d', -0.35);
  // eggs: two from each crate rolling along path to the turtle
  [[-1.2, 0.5], [-0.85, 1.1], [1.2, 0.5], [0.85, 1.1]].forEach(([x, z], i) => egg(scene, [x, 0.14, z], 1.35, i % 2 ? '#fff4de' : '#ffe9c2'));
  for (const [x, z, s] of [[-1.5, 0.15, 1], [1.5, 0.15, -1]]) { link(scene, mat('#f2d58a'), [x, 0.01, z], [s * 0.4, 0.01, 1.6], 0.06); }
  const t = createTurtle({ scale: 1.05 }); t.position.set(0, 0, 1.6); scene.add(t);
  t.userData.pose({ headTilt: 0.06, arms: { l: [0, 1.1, 0], r: [0, -1.1, 0] }, legs: { l: [0, 0.1], r: [0, -0.1] } });
  return [t];
}, { ground: null, cam: { pos: [0, 1.5, 5.4], look: [0, 0.55, 0.3] } });
</script></body></html>
