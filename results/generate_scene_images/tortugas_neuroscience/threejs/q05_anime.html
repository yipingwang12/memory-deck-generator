<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { THREE, makeScene, createTurtle, createShell, mat, add, blob, box, cyl, link, egg, capsule, textMat, rng } from './common.js';
// q05 - The TURTLE borrows brain drugs already in trials: in-licensing clinical-stage CNS assets.
makeScene(({ scene }) => {
  box(scene, mat('#cdb68a'), [0, -0.05, 0], [14, 0.1, 6]);
  box(scene, mat('#f2ead6'), [0, 2.2, -2.2], [14, 6, 0.1]);
  // library/pharma shelf behind with stacked pill bottles
  box(scene, mat('#8a5a30'), [0, 1.35, -2.0], [5.5, 0.1, 0.5]); box(scene, mat('#8a5a30'), [0, 2.1, -2.0], [5.5, 0.1, 0.5]);
  const cols = ['#ff7a59', '#ffd23f', '#3bb7a4', '#6c8cff'];
  for (let i = 0; i < 12; i++) { const x = -2.4 + i * 0.44, c = mat(cols[i % 4]); cyl(scene, mat('#ffffff', { roughness: 0.3 }), [x, 1.6, -2.0], 0.13, 0.38); cyl(scene, c, [x, 1.6, -1.87], 0.131, 0.14, [Math.PI / 2, 0, 0]); cyl(scene, c, [x, 1.82, -2.0], 0.14, 0.07); }
  for (let i = 0; i < 12; i++) { const x = -2.4 + i * 0.44; cyl(scene, mat('#fff'), [x, 2.37, -2.0], 0.13, 0.38); cyl(scene, mat(cols[(i + 1) % 4]), [x, 2.6, -2.0], 0.14, 0.07); }

  const pink = mat('#ff9fb5', { roughness: 0.45 }), pink2 = mat('#ff7f9f', { roughness: 0.45 });

  const r = rng(5); for (let i = 0; i < 14; i++) { const a = r() * 6.28, b = (r() - 0.3) * 2.2; blob(brain, pink2, [Math.cos(a) * 0.5 * 0.7, Math.sin(b) * 0.2 + 0.05, 0.26 * Math.cos(b)], [0.1, 0.045, 0.1], [r(), r(), r()]); }

  blob(brain, mat('#ffe27a'), [0.0, 0.2, 0.3], [0.09, 0.07, 0.015]);

  const pill = (x, z, ry) => { const g = new THREE.Group(); g.position.set(x, 0.08, z); g.rotation.y = ry; scene.add(g); capsule(g, mat('#ff4d5a', { roughness: 0.3 }), [0.1, 0, 0], 0.075, 0.1, [0, 0, Math.PI / 2]); capsule(g, mat('#ffffff', { roughness: 0.3 }), [-0.1, 0, 0], 0.075, 0.1, [0, 0, Math.PI / 2]); };
  pill(-1.4, 0.9, 0.5); pill(1.4, 0.8, -0.4); pill(1.0, 1.4, 1.0); pill(-0.9, 1.5, -0.8);

  const t = createTurtle({ scale: 1.0 }); t.position.set(0, 0, 1.1); scene.add(t);
  t.userData.pose({ headTilt: 0.06, legs: { l: [0, 0.1], r: [0, -0.1] } });
