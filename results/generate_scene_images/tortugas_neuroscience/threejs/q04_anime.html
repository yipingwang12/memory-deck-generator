<!doctype html>
<html><head><meta charset="utf-8"><title>Tortugas q04 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, makeScene, createTurtle, createShell, mat, add, blob, box, cyl, link, egg, capsule, textMat, rng } from './common.js';
// q04 - The TURTLE's leaders come from a SAGE herb garden.
makeScene(({ scene }) => {
  const soil = mat('#6b4426'), wood = mat('#b97b43');
  box(scene, soil, [0, 0.14, -0.7], [4.2, 0.28, 1.2]);
  for (const [x, z, w, d] of [[0, -0.1, 4.3, 0.1], [0, -1.3, 4.3, 0.1], [-2.15, -0.7, 0.1, 1.3], [2.15, -0.7, 0.1, 1.3]]) box(scene, wood, [x, 0.17, z], [w, 0.36, d]);
  // sage bushes: fuzzy grey-green oval leaves + purple flower spikes
  const r = rng(11), leafM = [mat('#8fae8f'), mat('#9bbd9b'), mat('#7f9f80')];
  for (let b = 0; b < 7; b++) {
    const bx = -1.8 + b * 0.6, bz = -0.7 + (b % 2 ? 0.12 : -0.12);
    for (let i = 0; i < 16; i++) {
      const a = r() * Math.PI * 2, rad = 0.05 + r() * 0.2, y = 0.38 + r() * 0.3;
      blob(scene, leafM[i % 3], [bx + Math.cos(a) * rad, y, bz + Math.sin(a) * rad], [0.14, 0.04, 0.09], [0.2, a, r() * 0.4]);
    }
    link(scene, mat('#9a7fbf'), [bx, 0.6, bz], [bx + 0.03, 0.95, bz], 0.012);
    for (let k = 0; k < 4; k++) blob(scene, mat('#9b5de5'), [bx + 0.03, 0.78 + k * 0.07, bz], [0.03, 0.04, 0.03]);
  }
  // sign: SAGE
  cyl(scene, wood, [-1.2, 0.5, 0.4], 0.04, 1.0);
  box(scene, textMat('SAGE', { bg: '#fff4d6', fg: '#3a5a3a', w: 512, h: 256 }), [-1.2, 1.15, 0.43], [0.95, 0.5, 0.05]);
  // fence behind
  for (let i = -6; i <= 6; i++) box(scene, wood, [i * 0.45, 0.6, -2.2], [0.28, 1.2, 0.05]);
  const t = createTurtle({ crown: true, scale: 1.05 }); t.position.set(0.7, 0.0, 0.5); t.rotation.y = -0.2; scene.add(t);
  t.userData.pose({ headTilt: 0.1, arms: { l: [0, 0.5, 0], r: [0, -0.4, 0] }, legs: { l: [0, 0.1], r: [0, -0.1] } });
  const sprig = new THREE.Group(); t.add(sprig); t.userData.reach('l', [0.38, 0.62, 0.25]);
  t.updateMatrixWorld(true);
  for (let i = 0; i < 4; i++) blob(t, mat('#8fae8f'), [0.38 + (i % 2 ? 0.04 : -0.04), 0.7 + i * 0.05, 0.27], [0.05, 0.03, 0.035], [0, 0, i % 2 ? 0.5 : -0.5]);
  return [t];
}, { ground: '#78b24a', cam: { pos: [0.2, 1.1, 3.6], look: [0.1, 0.65, -0.2] } });
</script></body></html>
