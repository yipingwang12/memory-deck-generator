<!doctype html>
<html><head><meta charset="utf-8"><title>Life Biosciences q04</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q04 — A needle into the eye's clear gel brings the LIFEBOAT's ER-100: intravitreal injection.
import { guard } from './kit.js';
import * as K from './props.js';
const { THREE, createLifeboat, canvasTexture, rng, mat, add, blob, box, cyl, num, makeStage, finish, water, dock, oar, person, eyeball, nachos, label, cell, rope, syringe, crate } = K;
guard(() => {
  const stage = makeStage(), scene = stage.scene; const chars = [];

  add(scene, new THREE.PlaneGeometry(400, 400), mat('#f1e6d2'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
  const eye = new THREE.Group(); eye.position.set(-0.3, 1.45, 0); scene.add(eye);
  const R = 1.25, half = (r, c, extra = {}) => add(eye, new THREE.SphereGeometry(r, 56, 36, Math.PI, Math.PI), mat(c, { side: THREE.DoubleSide, ...extra }));
  half(R, '#fbfbfb'); half(R - 0.05, '#d8453f', { side: THREE.BackSide });
  add(eye, new THREE.TorusGeometry(R, 0.03, 8, 64, Math.PI), mat('#f3d6d0'), [0, 0, 0], [0, 0, Math.PI]).rotation.set(0, 0, 0);
  half(R - 0.1, '#7fd4ff', { transparent: true, opacity: 0.55, roughness: 0.1 });
  add(eye, new THREE.CircleGeometry(R - 0.1, 56), mat('#9ee0ff', { transparent: true, opacity: 0.4, roughness: 0.1, depthWrite: false }), [0, 0, 0.001]);
  // front: lens + iris at the left
  blob(eye, mat('#c8eaff', { transparent: true, opacity: 0.8 }), [-R * 0.74, 0, 0], [0.22, 0.4, 0.3]);
  const iris = add(eye, new THREE.TorusGeometry(0.4, 0.1, 10, 28), mat('#3b8fd9'), [-R * 0.93, 0, 0], [0, Math.PI / 2, 0]);
  const r = rng(2); for (let i = 0; i < 14; i++) blob(eye, mat('#fff', { transparent: true, opacity: 0.8 }), [(r() - 0.3) * 1.2, (r() - 0.5) * 1.5, 0.02], [0.03, 0.03, 0.03]);
  // syringe from the right, label on barrel, long needle into the gel
  const syr = syringe(0.9, 0.16); syr.position.set(3.0, 1.45, 0.0); syr.rotation.z = -Math.PI / 2; scene.add(syr);
  cyl(scene, mat('#c9ced4', { metalness: 0.6, roughness: 0.3 }), [1.2, 1.45, 0], 0.025, 1.9, [0, 0, Math.PI / 2]);
  const lab = label('ER-100', 0.8, 0.28, { bg: '#ffd23a', fg: '#b01e1e', font: 'bold 150px Arial' }); lab.position.set(2.55, 1.45, 0.17); scene.add(lab);
  const boat = createLifeboat({ scale: 0.42 }); boat.position.set(-0.15, 1.2, 0.1); scene.add(boat); chars.push(boat);
  boat.userData.aim('l', [0.9, 0.8, 0.3]);
  for (let i = 0; i < 5; i++) blob(scene, mat('#ffffff', { transparent: true, opacity: 0.9 }), [0.25 - i * 0.1, 1.55 + (i % 2) * 0.06, 0.1], [0.035, 0.035, 0.035]);
    finish(stage, [0.8, 1.6, 6.2], [0.8, 1.45, 0], chars);
});
</script></body></html>
