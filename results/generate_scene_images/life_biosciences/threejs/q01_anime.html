<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// The LIFEBOAT makes old cells partly young again.
import { guard } from './kit.js';
import * as K from './props.js';
const { THREE, createLifeboat, canvasTexture, rng, mat, add, blob, box, cyl, num, makeStage, finish, water, dock, oar, person, eyeball, nachos, label, cell, rope, syringe, crate } = K;
guard(() => {
  const stage = makeStage(), scene = stage.scene; const chars = [];

  water(scene, '#2f93d6');
  const boat = createLifeboat({ scale: 1.6, flag: 'ER-100' }); boat.position.set(-2.55, 0, 0.8); scene.add(boat); chars.push(boat);
  const wr = (m, r, c) => { for (const [a, y] of [[0.5, 0.05], [0.3, 0.25], [0.45, -0.2]]) add(m, new THREE.TorusGeometry(r * 0.5, r * 0.02, 6, 20, 1.6), mat('#555a62'), [0, y * r * 1.4, r * 0.88], [0, 0, a]); };
  const mk = (x, color, old, young) => {
    const g = new THREE.Group(); g.position.set(x, 1.05, 0); scene.add(g); const r = 0.62;
    if (old && young) {
      for (const [col, ps] of [['#9a9aa4', -Math.PI / 2], ['#ff7fa6', Math.PI / 2]]) add(g, new THREE.SphereGeometry(r, 40, 24, ps, Math.PI), mat(col, { roughness: 0.4, side: THREE.DoubleSide }));
      
    } else blob(g, mat(color, { roughness: 0.4 }), [0, 0, 0], [r, r, r]);
    blob(g, mat('#7a3aa8'), [-r * 0.15, r * 0.35, r * 0.7], [r * 0.18, r * 0.18, r * 0.18]);
    for (const sx of [-1, 1]) { blob(g, mat('#fff'), [sx * r * 0.28, -r * 0.05, r * 0.88], [r * 0.15, r * 0.18, r * 0.05]); blob(g, mat('#1a1020'), [sx * r * 0.28, -r * 0.06, r * 0.93], [r * 0.09, r * 0.12, r * 0.04]); blob(g, mat('#fff'), [sx * r * 0.25, -r * 0.01, r * 0.96], [r * 0.03, r * 0.03, r * 0.02]); }
    return g;
  };
  const oldC = mk(-1.0, '#9a9aa4'); wr(oldC, 0.62);
  for (const sx of [-1, 1]) { add(oldC, new THREE.TorusGeometry(0.1, 0.014, 8, 24), mat('#333'), [sx * 0.17, -0.03, 0.57]); blob(oldC, mat('#f2f2f2'), [sx * 0.17, 0.12, 0.6], [0.11, 0.03, 0.03]); }
  blob(oldC, mat('#f2f2f2'), [0, -0.5, 0.35], [0.28, 0.22, 0.14]);
  const half = mk(0.9, null, true, true);
  const young = mk(2.8, '#ff7fa6');
  for (let i = 0; i < 9; i++) { const a = i * 0.7; const s = add(young, new THREE.OctahedronGeometry(0.07), mat('#fff6a8', { emissive: '#ffd84a', emissiveIntensity: 0.8 }), [Math.cos(a) * 0.95, Math.sin(a * 1.3) * 0.7, 0.3 + Math.sin(a) * 0.2]); }
  for (const sx of [-1, 1]) add(young, new THREE.TorusGeometry(0.1, 0.012, 8, 20), mat('#fff'), [sx * 0.2, 0.0, 0.6]);
  for (let i = 0; i < 7; i++) add(scene, new THREE.OctahedronGeometry(0.06), mat('#fff6a8', { emissive: '#ffd84a', emissiveIntensity: 0.8 }), [-1.9 + i * 0.5, 1.0 + Math.sin(i * 1.4) * 0.35, 0.9]);
  boat.userData.aim('l', [0.95, 0.75, 0.45]);
  finish(stage, [0.1, 1.3, 7.6], [0.1, 0.9, 0], chars);
});
</script></body></html>
