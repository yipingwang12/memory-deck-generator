<html><head><meta charset="utf-8"><title>Life Biosciences q07</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q07 — On the NACHO day, the first patient gets ER-100 from the LIFEBOAT.
import { guard } from './kit.js';
import * as K from './props.js';
const { THREE, createLifeboat, canvasTexture, rng, mat, add, blob, box, cyl, num, makeStage, finish, water, dock, oar, person, eyeball, nachos, label, cell, rope, syringe, crate } = K;
guard(() => {
  const stage = makeStage(), scene = stage.scene; const chars = [];

  water(scene, '#2f93d6');
  dock(scene, -4.5, 0.9, -2, 2.5, 0.28);
  const n = nachos(2.1); n.position.set(-2.6, 0.52, 1.2); scene.add(n);
  const p = person({ sit: true, scale: 1.45, shirt: '#8bd0a4', eyePatch: false }); p.position.set(-0.6, 0.5, 0.3); p.rotation.y = 0.5; scene.add(p);
  const stool = cyl(scene, mat('#8a5a38'), [-0.6, 0.62, 0.3], 0.28, 0.4); stool.position.y = 0.55 - 0.0;
  const bib = label('1', 0.26, 0.26, { bg: '#ffd23a', fg: '#b01e1e', font: 'bold 380px Arial' }); bib.position.set(0, 0.65, 0.17); p.add(bib);
  const boat = createLifeboat({ scale: 1.5, flag: 'ER-100' }); boat.position.set(1.7, 0, 0.9); boat.rotation.y = 0.0; scene.add(boat); chars.push(boat);
  boat.userData.aim('r', [-1.0, 1.0, 0.0]);
  const sy = syringe(0.3, 0.04); boat.userData.parts.hands.r.add(sy); sy.rotation.set(0, 0, 0);
  const sun = add(scene, new THREE.SphereGeometry(0.7, 24, 16), new THREE.MeshBasicMaterial({ color: '#ffe46b' }), [-4, 4.5, -6]);
  finish(stage, [-0.2, 1.8, 6.8], [-0.1, 1.0, 0], chars);
});
</script></body></html>
