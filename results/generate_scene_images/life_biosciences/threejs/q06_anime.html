<html><head><meta charset="utf-8"><title>Life Biosciences q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q06 — ER-100 on the LIFEBOAT saves eyes from GLAUCOMA and NAION, a sudden stroke of the eye nerve.
import { guard } from './kit.js';
import * as K from './props.js';
const { THREE, createLifeboat, canvasTexture, rng, mat, add, blob, box, cyl, num, makeStage, finish, water, dock, oar, person, eyeball, nachos, label, cell, rope, syringe, crate } = K;
guard(() => {
  const stage = makeStage(), scene = stage.scene; const chars = [];

  water(scene, '#2f93d6');
  const e1 = eyeball({ iris: '#2fb89a', r: 0.62 }); e1.position.set(-2.5, 0.35, 0.3); e1.rotation.set(0.1, 0.25, 0.1); scene.add(e1);
  const e2 = eyeball({ iris: '#3b8fd9', r: 0.62 }); e2.position.set(-0.6, 0.35, -0.3); e2.rotation.set(0.05, -0.15, -0.1); scene.add(e2);
  // glaucoma: pressure gauge on a post above eye 1, tunnel-dark ring
  const gt = canvasTexture(256, (c, s) => { c.fillStyle = '#fff'; c.fillRect(0, 0, s, s); c.strokeStyle = '#222'; c.lineWidth = 10; c.beginPath(); c.arc(128, 150, 95, Math.PI, 0); c.stroke(); c.strokeStyle = '#e23b30'; c.lineWidth = 22; c.beginPath(); c.arc(128, 150, 80, -Math.PI / 3, 0); c.stroke(); c.strokeStyle = '#111'; c.lineWidth = 12; c.beginPath(); c.moveTo(128, 150); c.lineTo(190, 82); c.stroke(); });
  const gauge = new THREE.Group(); gauge.position.set(-2.5, 1.9, 0.3); scene.add(gauge);
  cyl(gauge, mat('#444'), [0, -0.5, 0], 0.03, 1.1);
  add(gauge, new THREE.CylinderGeometry(0.42, 0.42, 0.08, 32), mat('#c9ced4', { metalness: 0.5 }), [0, 0, 0], [Math.PI / 2, 0, 0]);
  const gf = new THREE.Mesh(new THREE.CircleGeometry(0.38, 32), new THREE.MeshStandardMaterial({ map: gt })); gf.position.z = 0.05; gauge.add(gf);
  // NAION: snapped optic nerve + lightning
  const nerve = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, -0.55), new THREE.Vector3(0.4, 0.5, -0.9), new THREE.Vector3(0.9, 1.0, -0.8)]), 20, 0.07, 8), mat('#f2d98a')); e2.add(nerve);
  const bolt = new THREE.Shape(); [[0.2, 0.55], [-0.05, 0.1], [0.12, 0.1], [-0.12, -0.45], [0.3, 0.12], [0.1, 0.12], [0.36, 0.55]].forEach(([x, y], i) => bolt[i ? 'lineTo' : 'moveTo'](x, y));
  const bm = add(scene, new THREE.ExtrudeGeometry(bolt, { depth: 0.08, bevelEnabled: false }), mat('#ffe030', { emissive: '#ffd000', emissiveIntensity: 0.9 }), [-0.1, 1.75, -0.1], [0, 0, 0], [1.3, 1.3, 1.3]);
  const buoy = new THREE.Group(); buoy.position.set(0.75, 0.05, 1.0); buoy.rotation.x = Math.PI / 2; scene.add(buoy);
  for (let i = 0; i < 8; i++) { const sg = add(buoy, new THREE.TorusGeometry(0.34, 0.11, 10, 8, Math.PI / 4), mat(i % 2 ? '#fff' : '#e23b30')); sg.rotation.z = i * Math.PI / 4; }
  const boat = createLifeboat({ scale: 1.5, flag: 'ER-100' }); boat.position.set(2.8, 0, 0.7); scene.add(boat); chars.push(boat);
  boat.userData.aim('r', [-0.85, 0.5, 0.35]);
  rope(scene, [2.0, 0.9, 1.0], [1.05, 0.2, 1.0], 0.2, '#d9b878', 0.03);
  finish(stage, [0.1, 1.45, 7.8], [0.3, 0.9, 0], chars);
});
</script></body></html>
