<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q08 — The LIFEBOAT is the first reprogramming boat cleared to carry humans: first in human trials.
import { guard } from './kit.js';
import * as K from './props.js';
const { THREE, createLifeboat, canvasTexture, rng, mat, add, blob, box, cyl, num, makeStage, finish, water, dock, oar, person, eyeball, nachos, label, cell, rope, syringe, crate } = K;
guard(() => {
  const stage = makeStage(), scene = stage.scene; const chars = [];

  water(scene, '#2f93d6');
  dock(scene, -5, -1.2, -2, 2.5, 0.28);
  const boat = createLifeboat({ scale: 1.7 }); boat.position.set(1.4, 0, 0.8); scene.add(boat); chars.push(boat);
  boat.userData.aim('r', [-0.9, 0.8, 0.5]);
  const plank = box(scene, mat('#c8955c'), [-0.3, 0.5, -0.1], [2.4, 0.06, 0.6], [0, 0, 0.22]);
  const p = person({ scale: 1.5, shirt: '#e8a23a' }); p.position.set(-0.8, 0.66, -0.1); p.rotation.y = -0.4; scene.add(p);
  const sign = new THREE.Group(); sign.position.set(-3.3, 0.48, 0.9); scene.add(sign);
  cyl(sign, mat('#444'), [0, 0.9, 0], 0.05, 1.8);
  box(sign, mat('#222'), [0, 1.7, 0], [0.5, 1.2, 0.2]);
  [['#3a0f0f', 1.95], ['#3a2f0f', 1.7], ['#22e060', 1.45]].forEach(([c, y]) => blob(sign, mat(c, y === 1.45 ? { emissive: '#22e060', emissiveIntensity: 1 } : {}), [0, y, 0.12], [0.16, 0.16, 0.06]));
  const gate = new THREE.Group(); gate.position.set(-2.0, 0.5, 1.4); scene.add(gate);
  box(gate, mat('#444'), [0, 0.35, 0], [0.2, 0.7, 0.2]);
  for (let i = 0; i < 6; i++) box(gate, mat(i % 2 ? '#fff' : '#e23b30'), [0.12 + i * 0.15, 0.7 + i * 0.12, 0], [0.16, 0.08, 0.08], [0, 0, 0.6]);
  const ros = new THREE.Group(); ros.position.set(0.1, 0.55, 1.35); boat.add(ros);
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28; blob(ros, mat('#2f6fd0'), [Math.cos(a) * 0.09, Math.sin(a) * 0.09, 0], [0.04, 0.04, 0.02]); }
  const rl = label('1', 0.14, 0.14, { bg: '#ffd23a', fg: '#b01e1e', font: 'bold 380px Arial' }); rl.position.set(0.57, 0.14, 0.31); boat.add(rl);
  finish(stage, [-0.5, 1.7, 6.9], [-0.4, 1.0, 0], chars);
});
