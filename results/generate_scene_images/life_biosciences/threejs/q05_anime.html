<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q05 — ER-100 is the lead programme of the LIFEBOAT.
import { guard } from './kit.js';
import * as K from './props.js';
const { THREE, createLifeboat, canvasTexture, rng, mat, add, blob, box, cyl, num, makeStage, finish, water, dock, oar, person, eyeball, nachos, label, cell, rope, syringe, crate } = K;
guard(() => {
  const stage = makeStage(), scene = stage.scene; const chars = [];

  water(scene, '#2f93d6');
  const lead = createLifeboat({ scale: 1.7, flag: 'ER-100' }); lead.position.set(1.6, 0, 0.7); scene.add(lead); chars.push(lead);
  const fol = [[-0.9, -0.5, 1.05, '#6d8fb5'], [-2.8, -1.7, 0.8, '#7aa88a'], [-4.2, -2.7, 0.6, '#b58a6d']];
  fol.forEach(([x, z, s, h]) => { const b = createLifeboat({ scale: s, hull: h }); b.position.set(x, 0, z); scene.add(b); chars.push(b); });
  rope(scene, [0.55, 0.9, 0.5], [0.1, 0.5, -0.4], 0.1, '#d9b878', 0.03);
  rope(scene, [-1.6, 0.5, -0.5], [-2.0, 0.4, -1.5], 0.08, '#d9b878', 0.025);
  rope(scene, [-3.3, 0.4, -1.7], [-3.7, 0.3, -2.5], 0.06, '#d9b878', 0.02);
  const crown = add(lead, new THREE.ConeGeometry(0.16, 0.2, 5), mat('#ffd23a', { metalness: 0.5, roughness: 0.3 }), [0.6, 0.62, 0.0]);
  lead.userData.aim('l', [0.95, 0.9, 0.3]);
  for (const [x, z, r] of [[-0.3, 0.9, 1.3], [-0.6, 0.9, 2.0]]) add(scene, new THREE.RingGeometry(r, r + 0.07, 40, 1, 2.6, 1.0), mat('#fff', { transparent: true, opacity: 0.8 }), [x, -0.005, z], [-Math.PI / 2, 0, 0]);
  finish(stage, [-0.1, 1.5, 7.6], [-0.4, 0.7, -0.3], chars);
});
</script></body></html>
