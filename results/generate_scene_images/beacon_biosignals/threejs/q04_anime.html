<!doctype html><html><head><meta charset="utf-8"><title>Beacon q04</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><script type="module">
import { THREE, guard, rng, mat, glow, add, blob, box, textPlane, makeCloud, coinStack, makeBed, setup, beacon, wrap } from './common.js';
// q04 — The BEACON reads EEG brain waves by the million.
guard(() => {

  const { stage, scene } = setup({ el: 8, exposure: 0.95 });
  const b = beacon(scene, { x: -1.1, s: 1.25, yaw: 0.35, pose: { arms: { l: [0.1, 1.0, 0.2], r: [0, 0.4, 0] }, mouth: 'open' } });
  const cols = ['#27e0ff', '#ff4fa8', '#ffe03a', '#7dff6a', '#b07aff', '#ff8a2a'];
  const rows = [[0.2, 0.9, 14], [0.55, 1.1, 9], [0.9, 0.7, 18], [1.25, 1.0, 11], [1.6, 0.8, 16], [1.95, 1.1, 8]];
  rows.forEach(([y, amp, fr], k) => {
    const r = rng(k + 2), pts = [];
    for (let i = 0; i <= 140; i++) { const t = i / 140, x = 0.0 + t * 2.8; pts.push(new THREE.Vector3(x, y + 0.14 * Math.sin(t * fr + k) * (0.6 + 0.8 * Math.sin(t * 5 + k * 2) ** 2) * amp, 0.2)); }
    add(scene, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 300, 0.038, 8), glow(cols[k]));
  });
  // wave pulses arriving at the beacon
  for (let i = 0; i < 6; i++) add(scene, new THREE.TorusGeometry(0.3 + i * 0.18, 0.02, 8, 40, 1.6), glow(cols[i]), [-1.1, 0.75, 0.3], [0, 0, -0.8 + i * 0.01]);
  wrap(stage, scene, [b], { pos: [0.5, 1.0, 4.8], look: [0.5, 0.95, 0] });
});
</script></body></html>
