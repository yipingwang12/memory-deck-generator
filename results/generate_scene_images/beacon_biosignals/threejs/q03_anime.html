<!doctype html><html><head><meta charset="utf-8"><title>Beacon q03</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><script type="module">
import { THREE, guard, rng, mat, glow, add, blob, box, textPlane, makeCloud, coinStack, makeBed, setup, beacon, wrap } from './common.js';
// q03 — A WEST wind and CASH coins bring clinic skills to the BEACON.
guard(() => {

  const { stage, scene } = setup();
  const b = beacon(scene, { x: -0.2, s: 1.5, yaw: 0.2, pose: { flame: 1.15, arms: { l: [0.1, 0.9, 0], r: [0, 0.5, 0] } } });
  b.userData.parts.flame.rotation.z = -0.35;
  // west sign (left)
  add(scene, new THREE.CylinderGeometry(0.05, 0.06, 1.7, 10), mat('#7a4a28'), [-1.85, 0.85, -0.2]);
  box(scene, mat('#e9d9b0'), [-1.85, 1.55, -0.2], [1.3, 0.55, 0.06]);
  const w = textPlane('WEST', 1.2, 0.46, { bg: '#d84a2a', fg: '#fff' }); w.position.set(-1.85, 1.55, -0.16); scene.add(w);
  // wind streaks blowing east
  const curves = [[-1.6, 0.6, 0.5, 0], [-1.7, 1.0, 0.9, 1], [-1.4, 1.5, 0.7, 2], [-1.5, 0.3, 0.9, 3]];
  for (const [x0, y0, z0, k] of curves) {
    const pts = []; for (let i = 0; i <= 30; i++) { const t = i / 30; pts.push(new THREE.Vector3(x0 + t * 1.2, y0 + Math.sin(t * 7 + k) * 0.09, -0.6)); }
    add(scene, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.03, 8), glow('#ffffff'));
    const sw = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.025, 8, 20, 4.5), glow('#ffffff')); sw.position.set(x0 + 1.25, y0 + 0.1, -0.6); scene.add(sw);
  }
  // cash: stacks + bills + flying coins
  const c1 = coinStack(8, 0.3); c1.position.set(1.0, 0, 0.3); scene.add(c1); const c2 = coinStack(5, 0.3); c2.position.set(1.65, 0, 0.5); scene.add(c2);
  for (let i = 0; i < 3; i++) { box(scene, mat('#5fb561'), [1.3 + i * 0.05, 0.1 + i * 0.05, 0.95], [0.9, 0.04, 0.45], [0, 0.2 - i * 0.1, 0]); }
  const bill = textPlane('$', 0.3, 0.3, { bg: '#5fb561', fg: '#1d5a26' }); bill.rotation.x = -Math.PI / 2; bill.position.set(1.3, 0.22, 0.95); scene.add(bill);
  for (const [x, y, z] of [[0.3, 1.9, 0.3], [0.7, 1.5, 0.6], [0.1, 1.2, 1.0]]) { const co = add(scene, new THREE.CylinderGeometry(0.2, 0.2, 0.05, 24), mat('#f2b82a', { metalness: 0.6, roughness: 0.3 }), [x, y, z], [Math.PI / 2, 0, 0.4]); const t = textPlane('$', 0.26, 0.26, { bg: null, fg: '#a86a00' }); t.position.set(x, y, z + 0.03); scene.add(t); }
  wrap(stage, scene, [b], { pos: [-0.1, 1.0, 4.4], look: [-0.1, 0.9, 0] });
});
</script></body></html>
