<!doctype html>
<html><head><meta charset="utf-8"><title>ARPA-H q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 — A VENTURE WELL, a wishing well, looks after the HARP in Cambridge.
import { THREE, guard, rng, mat, add, blob, cyl, box, animeEyes, smile, coin, setup } from './common.js';
guard(() => {
  const S = setup({ harpPos: [-0.9, 0, 0], harpRy: 0.25 });
  const { scene, harp, mark } = S;
  // Cambridge: brick row + domed library tower behind
  const brick = ['#b5543c', '#a34a35', '#c4664a'];
  [[-5, 3, 2.2], [-3, 3.6, 2.5], [3.8, 3.2, 2.4], [5.8, 4, 2.6]].forEach(([x, h, w], i) => {
    box(scene, mat(brick[i % 3]), w, h, 1.5, [x, h / 2, -7]);
    for (let r = 0; r < 3; r++) for (let c = -1; c <= 1; c += 2) box(scene, mat('#ffe9a8'), 0.4, 0.5, 0.05, [x + c * 0.5, 1 + r * 1.0, -6.22]);
  });
  box(scene, mat('#d9d2c4'), 3, 3.4, 1.6, [0.3, 1.7, -8]);
  for (let i = -3; i <= 3; i++) cyl(scene, mat('#efe9dc'), 0.1, 3, [0.3 + i * 0.4, 1.6, -7.15]);
  blob(scene, mat('#7fa6a0'), [0.3, 3.4, -8], [1.3, 1.0, 1.3]);
  // the wishing well, big and alive, to the right of the harp
  const well = new THREE.Group(); well.position.set(1.5, 0, 0.1); scene.add(well);
  const stone = mat('#b9b2a6');
  cyl(well, stone, 0.78, 0.75, [0, 0.375, 0]);
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; box(well, mat(i % 2 ? '#a79f92' : '#c8c1b5'), 0.32, 0.18, 0.1, [Math.sin(a) * 0.79, 0.2 + (i % 3) * 0.22, Math.cos(a) * 0.79], [0, a, 0]); }
  add(well, new THREE.TorusGeometry(0.78, 0.07, 10, 40), mat('#d4cdc0'), [0, 0.76, 0], [Math.PI / 2, 0, 0]);
  cyl(well, mat('#2a6a9a', { roughness: 0.2 }), 0.7, 0.02, [0, 0.74, 0]);
  for (const s of [-1, 1]) cyl(well, mat('#8a5a2c'), 0.06, 1.5, [s * 0.78, 1.5, 0]);
  const roof = add(well, new THREE.ConeGeometry(1.25, 0.65, 4), mat('#c0392b'), [0, 2.55, 0], [0, Math.PI / 4, 0], [1, 1, 0.8]);
  cyl(well, mat('#8a5a2c'), 0.04, 1.7, [0, 1.95, 0], [0, 0, Math.PI / 2]);
  // face on the well front
  animeEyes(well, { y: 0.48, z: 0.8, gap: 0.26, r: 0.14, iris: '#2fae7a' }); smile(well, 0, 0.18, 0.8, 0.11);
  for (const s of [-1, 1]) { const b = add(well, new THREE.CircleGeometry(1, 24), mat('#ff6f8f'), [s * 0.5, 0.2, 0.8]); b.scale.set(0.09, 0.05, 1); }
  // little bucket + coins glinting on rim
  cyl(well, mat('#8a5a2c'), 0.14, 0.2, [0.3, 1.0, 0.3], [0, 0, 0], 0.11);
  for (const [x, z] of [[-0.45, 0.45], [0.5, 0.55]]) { const c = coin(0.12); c.position.set(x, 0.86, z); c.rotation.x = 0.4; well.add(c); }
  // well's arm gently patting the harp (care)
  const arm = new THREE.Group(); arm.position.set(-0.78, 0.55, 0.3); well.add(arm);
  cyl(arm, mat('#ffe0c0'), 0.05, 0.75, [-0.37, 0, 0], [0, 0, Math.PI / 2]); blob(arm, mat('#ffe0c0'), [-0.78, 0, 0], [0.09, 0.09, 0.09]);
  mark(well);
  harp.userData.pose({ arms: { l: [0, 0.9, 0.2] }, tilt: 0.04 });
  harp.userData.reach('r', [-0.4, 0.9, 0.3]);
  // flowers
  const r = rng(4); for (let i = 0; i < 70; i++) blob(scene, mat(['#ffd84a', '#fff', '#ff8fa8'][i % 3]), [(r() - 0.5) * 12, 0.04, -3 + r() * 5], [0.05, 0.05, 0.05]);
  S.done(0.3, 1.2, 6.0, 0.3, 1.1);
});
</script></body></html>
