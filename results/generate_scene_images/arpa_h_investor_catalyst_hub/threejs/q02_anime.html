<!doctype html>
<html><head><meta charset="utf-8"><title>ARPA-H q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — A MUMMY drops over three hundred thirty million in coins into the HARP.
import { THREE, guard, rng, mat, add, blob, cyl, box, coin, setup } from './common.js';
import { mummy } from './props.js';
guard(() => {
  const S = setup({ harpPos: [1.1, 0, 0.5], harpRy: -0.2, harpScale: 1.8, ground: '#d9b878' });
  const { scene, harp, mark } = S;
  // desert dunes + pyramid behind
  add(scene, new THREE.ConeGeometry(4, 4, 4), mat('#e8c27a'), [-1, 2, -14], [0, Math.PI / 4, 0]);
  add(scene, new THREE.ConeGeometry(2.6, 2.6, 4), mat('#dcb36c'), [5, 1.3, -11], [0, Math.PI / 4, 0]);
  blob(scene, mat('#e7c982'), [-8, -0.5, -8], [7, 1.6, 4]); blob(scene, mat('#e0be76'), [8, -0.6, -6], [6, 1.4, 3]);
  const mum = mummy([1.5, 3.0, 0.2]); mum.position.set(-1.9, 0, 0.2); mum.scale.setScalar(1.05); scene.add(mum); mark(mum);
  // falling coins from mummy's raised hand into the harp
  const r = rng(7);
  for (let i = 0; i < 16; i++) {
    const t = i / 15, c = coin(0.27); c.position.set(-0.5 + t * 1.5 + (r() - 0.5) * 0.3, 3.2 - t * 1.0 + (r() - 0.5) * 0.25 - (i % 3) * 0.12, 0.3 + (r() - 0.5) * 0.3);
    c.rotation.set(r() * 3, r() * 3, r() * 3); scene.add(c);
  }
  // coin pile at the harp's feet and mummy's feet
  for (let i = 0; i < 42; i++) { const c = coin(0.18); const a = r() * 6.28, rad = r() * 1.5; c.position.set(1.1 + Math.cos(a) * rad * 1.1, 0.05 + (1 - rad / 1.5) * 0.28 + r() * 0.05, 1.2 + Math.sin(a) * rad * 0.45); c.rotation.set(Math.PI / 2 + (r() - 0.5) * 0.8, 0, r() * 3); scene.add(c); }
  harp.userData.pose({ arms: { l: [0, 1.5, 0.3], r: [0, 1.5, 0.3] }, tilt: 0 });
  harp.userData.reach('l', [0.5, 1.1, 0.1]); harp.userData.reach('r', [-0.5, 1.1, 0.1]);
  S.done(0.0, 1.9, 6.4, -0.1, 1.6, 0);
});
</script></body></html>
