<!doctype html>
<html><head><meta charset="utf-8"><title>ARPA-H q04</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q04 — In March, a spokesperson ties the HARP's strings back on: the HARP is staying.
import { THREE, guard, rng, mat, add, blob, cyl, box, person, textPlate, setup } from './common.js';
import { limbTo } from './props.js';
guard(() => {
  const S = setup({ harpPos: [-0.9, 0, 0.3], harpRy: 0.2, harpScale: 2.1 });
  const { scene, harp, mark } = S;
  const r = rng(9);
  // spring tree + blossoms behind
  cyl(scene, mat('#7a5230'), 0.25, 3, [-5, 1.5, -6]); blob(scene, mat('#ffb7c9'), [-5, 3.8, -6], [1.8, 1.4, 1.6]); blob(scene, mat('#ffc9d6'), [-3.8, 3.2, -6.4], [1.2, 1, 1.1]);
  for (let i = 0; i < 90; i++) blob(scene, mat(['#ffd84a', '#fff', '#ff8fa8'][i % 3]), [(r() - 0.5) * 12, 0.05, -3 + r() * 6], [0.06, 0.06, 0.06]);
  // MARCH calendar board
  const board = new THREE.Group(); board.position.set(-3.7, 0, -1.2); scene.add(board);
  cyl(board, mat('#8a5a2c'), 0.07, 2, [-0.8, 1, 0]); cyl(board, mat('#8a5a2c'), 0.07, 2, [0.8, 1, 0]);
  box(board, mat('#ffffff'), 2.0, 1.5, 0.08, [0, 2.15, 0]); box(board, mat('#d33'), 2.0, 0.4, 0.09, [0, 2.7, 0]);
  const t = textPlate('MARCH', 1.9, 1.9, { bg: '#ffffff', fg: '#222', font: 'bold 112px sans-serif' }); t.position.set(0, 2.05, 0.05); board.add(t);
  // spokesperson at a podium with microphone
  const sp = person({ suit: '#2d4f9e', tie: '#c8102e', hair: '#3a2a1a' }); sp.g.scale.setScalar(2.0); sp.g.position.set(1.5, 0, 0.3); sp.g.rotation.y = -0.35; scene.add(sp.g);
  sp.armR.rotation.z = -1.55; sp.armR.rotation.x = -0.5; sp.armL.rotation.z = 0.5;
  mark(sp.g);
  box(scene, mat('#7a4a22'), 1.0, 1.1, 0.7, [1.9, 0.55, 1.0], [0, -0.35, 0]); cyl(scene, mat('#222'), 0.03, 0.35, [1.8, 1.3, 1.0]); blob(scene, mat('#333'), [1.8, 1.55, 1.0], [0.09, 0.09, 0.09]);
  // strings tied back: red bows on every other string + ribbon
  const strs = harp.userData.parts.strings, red = mat('#e22b3d');
  strs.forEach((s, i) => { if (i % 2 === 0) { const p = s.position; const y = p.y + 0.0; for (const sx of [-1, 1]) blob(harp, red, [p.x + sx * 0.035, y + 0.06, 0.02], [0.04, 0.025, 0.02], [0, 0, sx * 0.6]); blob(harp, red, [p.x, y + 0.06, 0.02], [0.018, 0.018, 0.02]); } });
  // sparkles
  for (let i = 0; i < 10; i++) blob(scene, mat('#fff7b0', { emissive: '#ffe680', emissiveIntensity: 0.8 }), [-1.8 + r() * 2, 1.6 + r() * 2, 0.9], [0.05, 0.05, 0.05]);
  harp.userData.pose({ arms: { l: [0, 1.4, 0.3], r: [0, 0.5, 0.3] }, tilt: 0 });
  harp.userData.reach('l', [0.55, 1.0, 0.3]);
  S.done(0.0, 1.9, 7.0, 0.1, 1.7, 0);
});
</script></body></html>
