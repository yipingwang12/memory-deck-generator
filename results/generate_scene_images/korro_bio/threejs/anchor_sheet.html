<!doctype html>
<html><head><meta charset="utf-8"><title>Korro crow sheet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import { THREE, makeStage, finishScene } from './common.js';
import { guard } from './kit.js';
import { createCrow } from './crow.js';
guard(() => {
  const stage = makeStage({ ground: '#e9d8b0' });
  const views = [[0.5, 0, 'front3q'], [0, 0, 'front'], [Math.PI * 0.5, 0, 'side']];
  const crows = views.map(([ry], i) => { const c = createCrow(); c.position.set((i - 1) * 1.3, 0, 0); c.rotation.y = i === 0 ? 0.6 : i === 1 ? 0 : -1.3; stage.scene.add(c); return c; });
  crows[2].userData.pose({ beak: 0.35, headTilt: 0.1, wing: { l: [1.3, 0.2, 0.4], r: [0.2, 0, 0] } });
  crows[0].userData.pose({ beak: 0.1, headTilt: -0.08 });
  const all = new THREE.Group(); crows.forEach((c) => c.traverse(() => {}));
  const set = new Set(); crows.forEach((c) => c.traverse((o) => set.add(o)));
  stage.toonify(stage.scene, (m) => set.has(m));
  stage.camera.position.set(0, 0.85, 4.2); stage.camera.lookAt(0, 0.55, 0); stage.finish();
});
</script></body></html>
