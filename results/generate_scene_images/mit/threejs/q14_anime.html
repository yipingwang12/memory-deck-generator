<script type="module">
// q14 — "The PICOWER tower on the MITTEN first had a plain name: the Center for Learning and Memory."
import { THREE, add, blob, cyl, box, mat, rng, placeMitten, run } from './common.js';
import * as P from './props.js';
run(({ scene }) => {
  const t = P.tower({ h: 1.8 }); t.position.set(3.6, 0, -1.4); scene.add(t);
  const sg = P.board((c, s) => {
    c.fillStyle = '#fff'; c.fillRect(s * 0.1, s * 0.2, s * 0.35, s * 0.55); c.strokeStyle = '#2f6fb5'; c.lineWidth = 12; c.strokeRect(s * 0.1, s * 0.2, s * 0.35, s * 0.55); c.beginPath(); c.moveTo(s * 0.275, s * 0.2); c.lineTo(s * 0.275, s * 0.75); c.stroke();
    c.fillStyle = '#8f8f9a'; c.beginPath(); c.ellipse(s * 0.72, s * 0.5, s * 0.14, s * 0.1, 0, 0, 6.3); c.fill(); c.beginPath(); c.arc(s * 0.6, s * 0.38, s * 0.08, 0, 6.3); c.fill();
    c.fillRect(s * 0.6, s * 0.5, s * 0.04, s * 0.2); c.fillRect(s * 0.78, s * 0.5, s * 0.04, s * 0.2); c.fillRect(s * 0.66, s * 0.5, s * 0.03, s * 0.2); c.fillRect(s * 0.72, s * 0.5, s * 0.03, s * 0.2);
    c.strokeStyle = '#8f8f9a'; c.lineWidth = 16; c.beginPath(); c.moveTo(s * 0.55, s * 0.4); c.quadraticCurveTo(s * 0.5, s * 0.55, s * 0.55, s * 0.65); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(s * 0.59, s * 0.35, 8, 0, 6.3); c.fill(); c.fillStyle = '#222'; c.beginPath(); c.arc(s * 0.59, s * 0.36, 4, 0, 6.3); c.fill();
  }, 2.4, 1.3, { color: '#fff6dc' });
  sg.position.set(1.0, 0, -0.5); sg.scale.setScalar(1.2); scene.add(sg);
  const m = placeMitten(scene, { x: -1.3, z: 1.2, ry: 0.35, s: 2.1, reach: { l: [-0.2, 1.9, 1.0] } });
  return { chars: [m], cam: { pos: [0.9, 2.0, 7.0], look: [0.9, 1.9, 0] } };
});
