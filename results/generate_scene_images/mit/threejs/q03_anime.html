// q03 — "A MANDOLIN in a KILN (Manolis Kellis) heads the MITTEN's computational biology group."
import { THREE, add, blob, cyl, box, mat, rng, placeMitten, run } from './common.js';
import * as P from './props.js';
run(({ scene }) => {
  const k = P.kiln(); k.position.set(1.4, 0, -0.8); k.scale.setScalar(1.25); scene.add(k);
  const md = P.mandolin(); md.position.set(1.4, 0.1, 1.75); md.scale.setScalar(1.15); scene.add(md);
  const m = placeMitten(scene, { x: -1.6, z: 0.8, ry: 0.5, s: 2.0, pose: { arms: { r: [0, 0.5, 0] } }, reach: { l: [0.0, 1.2, 1.7] } });
  return { chars: [m], cam: { pos: [0.1, 1.6, 6.6], look: [0.1, 1.2, 0] } };
});
