<!doctype html>
<html><head><meta charset="utf-8"><title>MIT q05</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — "The MANDOLIN's maps on the MITTEN span eight hundred twenty-three human tissues."
import { THREE, add, blob, cyl, box, mat, rng, placeMitten, run } from './common.js';
import * as P from './props.js';
run(({ scene }) => {
  const heart = (c, x, y, k) => { c.fillStyle = '#d8333b'; c.beginPath(); c.moveTo(x, y + k * 0.9); c.bezierCurveTo(x - k * 1.6, y - k * 0.2, x - k * 0.6, y - k * 1.3, x, y - k * 0.4); c.bezierCurveTo(x + k * 0.6, y - k * 1.3, x + k * 1.6, y - k * 0.2, x, y + k * 0.9); c.fill(); };
  const bd = P.board((c, s) => {
    c.fillStyle = '#d8eaf5'; for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) c.fillRect(i * s / 4 + 14, j * s / 2 + 14, s / 4 - 28, s / 2 - 28);
    const cell = (i, j) => [(i + 0.5) * s / 4, (j + 0.5) * s / 2];
    heart(c, ...cell(0, 0), 90);
    c.fillStyle = '#ff9fb5'; for (const dx of [-45, 45]) { c.beginPath(); c.ellipse(cell(1, 0)[0] + dx, cell(1, 0)[1], 38, 80, 0, 0, 6.3); c.fill(); }
    c.fillStyle = '#ff9fb5'; c.beginPath(); c.ellipse(...cell(2, 0), 90, 70, 0, 0, 6.3); c.fill(); c.strokeStyle = '#c0607a'; c.lineWidth = 8; for (let k = -2; k < 3; k++) { c.beginPath(); c.arc(cell(2, 0)[0] + k * 30, cell(2, 0)[1], 30, 0, 6.3); c.stroke(); }
    c.fillStyle = '#b5452f'; for (const dx of [-45, 45]) { c.beginPath(); c.ellipse(cell(3, 0)[0] + dx, cell(3, 0)[1], 32, 55, 0, 0, 6.3); c.fill(); }
    c.fillStyle = '#e8a25a'; c.beginPath(); c.ellipse(...cell(0, 1), 90, 55, 0.3, 0, 6.3); c.fill();
    c.fillStyle = '#7a3f2a'; c.beginPath(); c.ellipse(...cell(1, 1), 85, 60, 0, 0, 6.3); c.fill();
    c.fillStyle = '#f5e6c8'; c.fillRect(cell(2, 1)[0] - 80, cell(2, 1)[1] - 14, 160, 28); c.fillStyle = '#ffd0a0'; c.beginPath(); c.arc(...cell(3, 1), 70, 0, 6.3); c.fill();
  }, 3.6, 1.9);
  bd.position.set(1.5, 0, -0.9); scene.add(bd);
  const md = P.mandolin(); md.position.set(-1.9, 0, 0.7); md.rotation.set(0, 0.3, -0.12); md.scale.setScalar(1.2); scene.add(md);
  const m = placeMitten(scene, { x: -0.3, z: 1.0, ry: 0.2, s: 1.95, pose: { arms: { l: [0, 0.8, 0] } }, reach: { r: [-1.5, 0.9, 1.1] } });
  return { chars: [m], cam: { pos: [0, 1.7, 6.2], look: [0, 1.5, 0] } };
});
</script></body></html>
