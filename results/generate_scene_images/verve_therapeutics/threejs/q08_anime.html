<html><head><meta charset="utf-8"><title>Verve scene</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as PR from "./props.js";
const { THREE, run, add, mat, blob, bevBox, label, makeStage, createBallerina, lollipop, nail, die, coin, mouse, gene, syringe, hammer, coinStack, canvasTexture } = PR;
run(() => {
const { scene, done, num } = makeStage();
add(scene, new THREE.PlaneGeometry(400, 400), mat('#c8d3de'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
const st = mat('#e0602a', { metalness: 0.4, roughness: 0.45 }), L = 6;
for (const x of [-2.2, 2.2]) bevBox(scene, mat('#7e8794', { metalness: 0.5 }), 0.4, 2.4, 0.4, [x, 1.2, 0], [0, 0, 0], 0.03);
bevBox(scene, st, L, 0.12, 1.0, [0, 2.5, 0], [0, 0, 0], 0.02);
bevBox(scene, st, L, 0.12, 1.0, [0, 2.0, 0], [0, 0, 0], 0.02);
bevBox(scene, st, L, 0.5, 0.14, [0, 2.25, 0], [0, 0, 0], 0.02);
const rv = mat('#b8431a');
for (let i = -12; i <= 12; i++) { blob(scene, rv, [i * 0.23, 2.575, 0.35], [0.04, 0.025, 0.04]); blob(scene, rv, [i * 0.23, 2.575, -0.35], [0.04, 0.025, 0.04]); }
const b = createBallerina({ scale: 1.9 }); b.position.set(0, 2.56, 0.1); b.rotation.y = 0.5; scene.add(b);
b.userData.pose({ lean: 0.5, headTilt: 0.05, arms: { l: [-1.4, 1.3, 0.1], r: [1.0, -1.2, 0.1] }, legs: { l: [0, 0.1], r: [1.4, -0.05] } });
done([0.5, 2.8, 4.8], [0, 3.0, 0], [b]);
});
