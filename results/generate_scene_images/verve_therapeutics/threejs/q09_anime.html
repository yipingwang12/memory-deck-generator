<!doctype html>
<html><head><meta charset="utf-8"><title>Verve scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as PR from "./props.js";
const { THREE, run, add, mat, blob, bevBox, label, makeStage, createBallerina, lollipop, nail, die, coin, mouse, gene, syringe, hammer, coinStack, canvasTexture } = PR;
run(() => {
const { scene, done, num } = makeStage();
add(scene, new THREE.PlaneGeometry(400, 400), mat('#c8e6a8'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
const glass = mat('#e8f6ff', { transparent: true, opacity: 0.35, roughness: 0.1 });
const gx = 2.2;
add(scene, new THREE.CylinderGeometry(0.4, 0.4, 3.4, 32), glass, [gx, 1.7, 0]).castShadow = false;
add(scene, new THREE.CylinderGeometry(0.36, 0.36, 0.9, 32), mat('#ffc928'), [gx, 0.55, 0]);
for (let i = 0; i < 5; i++) add(scene, new THREE.BoxGeometry(0.5, 0.04, 0.05), mat('#334'), [gx + 0.42, 0.5 + i * 0.6, 0.15]);
add(scene, new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32), mat('#d7263d'), [gx, 0.05, 0]);
const ar = add(scene, new THREE.ConeGeometry(0.4, 0.6, 3), mat('#d7263d'), [gx - 0.9, 1.5, 0.2], [0, 0, Math.PI]);
add(scene, new THREE.BoxGeometry(0.22, 1.2, 0.1), mat('#d7263d'), [gx - 0.9, 2.3, 0.2]);
const lk = new THREE.Group(); lk.position.set(gx, 1.5, 0.5); scene.add(lk);
add(lk, new THREE.BoxGeometry(0.36, 0.3, 0.14), mat('#ffc928', { metalness: 0.6 }), [0, 0, 0]);
add(lk, new THREE.TorusGeometry(0.12, 0.035, 8, 20, Math.PI), mat('#ffc928', { metalness: 0.6 }), [0, 0.15, 0]);
const b = createBallerina({ scale: 1.9 }); b.position.set(-1.0, 1.0, 0); b.rotation.y = 0.35; scene.add(b);
b.userData.pose({ lean: 0.1, headTilt: 0.1, arms: { l: [0, 2.5, 0.1], r: [0, -2.5, 0.1] }, legs: { l: [-1.2, 0.5], r: [1.2, -0.5] } });
add(scene, new THREE.CircleGeometry(0.5, 24), mat('#a0c080'), [-1.0, 0.01, 0], [-Math.PI / 2, 0, 0]);
for (const [x, y] of [[0.6, 2.8], [-2.3, 2.5], [-2.0, 0.6]]) blob(scene, mat('#ffe27a'), [x, y, -0.5], [0.05, 0.05, 0.05]);
done([0.3, 1.9, 5.0], [0.4, 1.8, 0], [b]);
});
</script></body></html>
