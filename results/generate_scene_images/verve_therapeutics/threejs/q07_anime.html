<!doctype html>
<html><head><meta charset="utf-8"><title>Verve scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as PR from "./props.js";
const { THREE, run, add, mat, blob, bevBox, label, makeStage, createBallerina, lollipop, nail, die, coin, mouse, gene, syringe, hammer, coinStack, canvasTexture } = PR;
run(() => {
const { scene, done, num } = makeStage();
add(scene, new THREE.PlaneGeometry(400, 400), mat('#bfe3ea'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
bevBox(scene, mat('#ffffff'), 2.6, 0.2, 1.3, [0.9, 0.55, 0]);
for (const [x, z] of [[-0.3, 0.5], [-0.3, -0.5], [2.1, 0.5], [2.1, -0.5]]) add(scene, new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8), mat('#9aa3ad'), [x, 0.25, z]);
bevBox(scene, mat('#fffdf5'), 0.6, 0.15, 0.9, [-0.1, 0.72, 0]);
bevBox(scene, mat('#5fb7e8'), 1.6, 0.14, 1.2, [1.2, 0.72, 0]);
const hd = blob(scene, mat('#ffe0c8'), [-0.1, 0.9, 0], [0.22, 0.22, 0.22]);
blob(scene, mat('#3a2a20'), [-0.1, 0.99, -0.05], [0.23, 0.18, 0.2]);
for (const s of [-1, 1]) add(scene, new THREE.TorusGeometry(0.03, 0.007, 6, 12, Math.PI), mat('#222'), [-0.1 + s * 0.08, 0.92, 0.2], [0, 0, Math.PI]);
const b = createBallerina({ scale: 1.9 }); b.position.set(0.8, 0, 1.0); b.rotation.y = -0.5; scene.add(b);
const sy = syringe(1.4); sy.position.set(0.1, 1.15, 0.65); sy.rotation.set(0.0, 0, 0.9); scene.add(sy);
b.userData.pose({ lean: 0.1, arms: { r: [0, 0.3, 0] }, legs: { l: [0, 0.1], r: [0, -0.1] } });
b.updateMatrixWorld(true);
const w = b.worldToLocal(new THREE.Vector3(0.25, 1.2, 0.7)); b.userData.reach('r', [w.x, w.y, w.z]);
const w2 = b.worldToLocal(new THREE.Vector3(0.35, 1.3, 0.78)); b.userData.reach('l', [w2.x, w2.y, w2.z]);
const d = die(0.6); d.position.set(2.5, 0, 0.5); d.rotation.y = 0.5; scene.add(d);
const cs = coinStack(6, 0.18); cs.position.set(-1.2, 0, 1.0); scene.add(cs);
done([0.9, 1.4, 4.4], [0.9, 0.9, 0.3], [b]);
});
</script></body></html>
