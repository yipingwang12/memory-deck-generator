<!doctype html>
<html><head><meta charset="utf-8"><title>Verve scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as PR from "./props.js";
const { THREE, run, add, mat, blob, bevBox, label, makeStage, createBallerina, lollipop, nail, die, coin, mouse, gene, syringe, hammer, coinStack, canvasTexture } = PR;
run(() => {
const { scene, done, num } = makeStage();
add(scene, new THREE.PlaneGeometry(400, 400), mat('#ffd9a8'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
add(scene, new THREE.PlaneGeometry(400, 400), mat('#f6d98a'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
const b = createBallerina({ scale: 1.8 }); b.position.set(0, 0, 0); scene.add(b);
b.userData.pose({ headTilt: 0.08, arms: { l: [-0.3, 0.9, 0.4], r: [-0.2, -0.5, 0.2] }, legs: { l: [0, 0.1], r: [0, -0.1] } });
const d1 = die(0.8), d2 = die(0.8); d1.rotation.set(0, 0.6, 0); d1.position.set(-1.7, 0, 0.3); d2.rotation.set(0, 0.2, 0); d2.position.set(-1.9, 0.8, 0.1); scene.add(d1, d2);
const cs = coinStack(10, 0.22); cs.position.set(-0.9, 0, 0.7); scene.add(cs);
const m = mouse(); m.scale.setScalar(3.4); m.position.set(2.3, 0, 0.0); m.rotation.y = Math.PI + 0.45; scene.add(m);
for (let i = 0; i < 3; i++) { const c = coin(0.22); c.position.set(0.9 + i * 0.1, 0.22 + i * 0.0, 1.1 - i * 0.0); c.position.x = 1.0 + i * 0.0; c.position.y = 0.22 + i * 0.36; c.position.z = 1.0; c.rotation.y = 0.3; c.rotation.x = 0; scene.add(c); }
const sh = add(scene, new THREE.BoxGeometry(0.4, 0.55, 0.02), mat('#fffdf0'));
sh.position.set(0.0, 0.0, 0.0); b.add(sh); sh.position.set(0.3, 0.55, 0.3); sh.rotation.set(0, -0.3, 0.2); sh.scale.setScalar(0.7);
for (const y of [0.15, 0.04]) add(sh, new THREE.BoxGeometry(0.28, 0.04, 0.025), mat('#2a5db0'), [0, y, 0.01]);
done([0, 1.1, 5.2], [0, 0.85, 0], [b]);
});
</script></body></html>
