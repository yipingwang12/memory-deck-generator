<!doctype html>
<html><head><meta charset="utf-8"><title>Verve scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as PR from "./props.js";
const { THREE, run, add, mat, blob, bevBox, label, makeStage, createBallerina, lollipop, nail, die, coin, mouse, gene, syringe, hammer, coinStack, canvasTexture } = PR;
run(() => {
const { scene, done, num } = makeStage();
add(scene, new THREE.PlaneGeometry(400, 400), mat('#ffd9a8'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
add(scene, new THREE.PlaneGeometry(400, 400), mat('#ffd9a8'), [0, 0, 0], [-Math.PI / 2, 0, 0]);
add(scene, new THREE.CylinderGeometry(0.07, 0.07, 1.0, 14), mat('#f4f0e8'), [0, 0.5, 0]);
const cy = 1.95;
const sp = add(scene, new THREE.SphereGeometry(1.0, 48, 32), mat('#ff4d8a'), [0, cy, 0]); sp.castShadow = false;
const rings = [];
for (const [c, y] of [[ '#ffffff', 0.0], ['#ffd23d', 0.55], ['#7a3dff', -0.55]]) { const t = add(scene, new THREE.TorusGeometry(Math.sqrt(1 - y * y) * 1.0, 0.04, 10, 48), mat(c), [0, cy + y, 0], [Math.PI / 2, 0, 0]); t.castShadow = false; rings.push(t); }
const b = createBallerina({ scale: 1.5 }); b.position.set(0, cy - 0.78, 0); scene.add(b);
b.userData.pose({ headTilt: 0.1, arms: { l: [0, 2.3, 0.3], r: [0, -2.3, 0.3] }, legs: { l: [-0.3, 0.2], r: [0.7, -0.1] } });
done([0.8, 1.9, 3.7], [0, 1.55, 0], [b], () => { sp.material = new THREE.MeshStandardMaterial({ color: '#ff4d8a', transparent: true, opacity: 0.35, roughness: 0.1, depthWrite: false }); sp.renderOrder = 5; for (const t of rings) { t.material = new THREE.MeshStandardMaterial({ color: t.material.color, transparent: true, opacity: 0.6, depthWrite: false }); t.renderOrder = 6; } });
});
</script></body></html>
