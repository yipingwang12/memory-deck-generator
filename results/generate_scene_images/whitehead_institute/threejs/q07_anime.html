<!doctype html>
<html><head><meta charset="utf-8"><title>Whitehead q07 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// The SNOWMAN stands by a BRIDGE in Cambridge.
import { THREE, guard, rng, mat, add, blob, box, cyl, winterStage, clouds, pine, snowfall, person, lamb, hen, egg, pose, openBelly } from './props.js';
import { createSnowman } from './snowman.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const { stage, scene, num } = winterStage(P);

  const r = rng(2);
  add(scene, new THREE.PlaneGeometry(400, 7), mat('#5f9fd0', { roughness: 0.3 }), [0, 0.01, -4.2], [-Math.PI / 2, 0, 0]);
  for (const z of [-0.5, -7.9]) add(scene, new THREE.PlaneGeometry(400, 0.5), mat('#f3f8ff'), [0, 0.02, z + (z < -4 ? -0.1 : 0.1)], [-Math.PI / 2, 0, 0]);
  // stone arch bridge
  const sh = new THREE.Shape(); sh.moveTo(-5, 0); sh.lineTo(5, 0); sh.lineTo(5, 1.5); sh.lineTo(-5, 1.5); sh.closePath();
  for (const cx of [-3.2, 0, 3.2]) { const h = new THREE.Path(); h.moveTo(cx - 1.2, 0); h.absarc(cx, 0, 1.2, Math.PI, 0, true); h.lineTo(cx - 1.2, 0); sh.holes.push(h); }
  const bg = new THREE.ExtrudeGeometry(sh, { depth: 1.4, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.04, bevelSegments: 2 });
  const bridge = add(scene, bg, mat('#b9b2a6'), [0, 0, -4.9]);
  add(scene, new THREE.BoxGeometry(10.2, 0.14, 1.6), mat('#8f887c'), [0, 1.55, -4.2]);
  for (const z of [-4.95, -3.45]) { add(scene, new THREE.BoxGeometry(10.2, 0.35, 0.14), mat('#b9b2a6'), [0, 1.78, z]); add(scene, new THREE.BoxGeometry(10.2, 0.08, 0.2), mat('#fbfdff'), [0, 1.99, z]); }
  for (const x of [-4.5, -1.6, 1.6, 4.5]) { cyl(scene, mat('#2b2f36'), [x, 2.3, -4.95], 0.03, 0.04, 1.2); blob(scene, mat('#ffe9a8', { emissive: '#ffcf60', emissiveIntensity: 0.7 }), [x, 2.95, -4.95], [0.11, 0.13, 0.11]); }
  const hills = mat('#f3f8ff'); [[-9, -14, 5], [6, -16, 7], [14, -12, 4]].forEach(([x, z, s]) => blob(scene, hills, [x, 0, z], [s * 1.8, s * 0.5, s]));
  pine(scene, -3.6, -1.2, 1.7); pine(scene, 4.4, -1.4, 2.0);
  const sm = createSnowman({ scale: 2.0 }); sm.position.set(-0.3, 0, 0.6); sm.rotation.y = 0.25; scene.add(sm);
  sm.userData.pose({ arms: { l: [0, 1.1], r: [0, -2.2, 0] }, headTilt: 0.05 }); sm.userData.reach('r', [-0.12, 0.98, 0.1]);
  stage.toonify(scene, (m) => m.geometry && m.geometry.type !== 'PlaneGeometry');
  clouds(stage);
  stage.camera.position.set(num('cx', 0.4), num('cy', 1.3), num('cz', 5.0));
  stage.camera.lookAt(num('tx', 0.0), num('ty', 1.2), 0);
  stage.finish();
});
</script></body></html>
