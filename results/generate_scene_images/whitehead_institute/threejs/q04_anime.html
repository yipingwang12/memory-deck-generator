<!doctype html>
<html><head><meta charset="utf-8"><title>Whitehead q04 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Inside the SNOWMAN, each Independent Member runs a lab with a free hand.
import { THREE, guard, rng, mat, add, blob, box, cyl, winterStage, clouds, pine, snowfall, person, lamb, hen, egg, pose, openBelly } from './props.js';
import { createSnowman } from './snowman.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const { stage, scene, num } = winterStage(P);

  pine(scene, -5.2, -3.0, 2.0); pine(scene, 5.4, -3.4, 2.2);
  const sm = createSnowman({ scale: 4.2 }); openBelly(sm, 1.5); sm.position.set(0, 0, 0); scene.add(sm);
  sm.userData.pose({ arms: { l: [0, 1.5], r: [0, -1.5] }, headTilt: 0.05 });
  const flask = (p, x, z, c) => { cyl(p, mat(c, { transparent: true, opacity: 0.85 }), [x, 0.12, z], 0.006, 0.02, 0.05, undefined, 16); cyl(p, mat('#e8f4ff', { transparent: true, opacity: 0.6 }), [x, 0.16, z], 0.007, 0.007, 0.04, undefined, 12); };
  for (const [x, c, hair, lc] of [[-0.1, '#2f6bb5', '#3a2a1c', '#44d07a'], [0.1, '#b53a8a', '#d9b25a', '#ff5fa8']]) {
    box(sm, mat('#c9a26a'), [x, 0.095, 0.12], [0.1, 0.03, 0.05]);
    cyl(sm, mat('#8a6a42'), [x - 0.04, 0.05, 0.12], 0.005, 0.005, 0.07, undefined, 6); cyl(sm, mat('#8a6a42'), [x + 0.04, 0.05, 0.12], 0.005, 0.005, 0.07, undefined, 6);
    flask(sm, x - 0.02, 0.12, lc);
    const sc = person({ coat: '#ffffff', hair, h: 0.27, kind: 'plain' }); sc.position.set(x, 0.07, -0.03); sc.rotation.y = x * -3; sm.add(sc);
    pose(sc, 'l', -1.3, 0, -0.2); pose(sc, 'r', 0, 0, -0.2);
  }
  blob(sm, mat('#f2c230', { emissive: '#f2c230', emissiveIntensity: 0.6 }), [0, 0.2, 0.0], [0.014, 0.014, 0.014]);
  stage.toonify(scene, (m) => m.geometry && m.geometry.type !== 'PlaneGeometry');
  clouds(stage);
  stage.camera.position.set(num('cx', 0.0), num('cy', 2.0), num('cz', 6.4));
  stage.camera.lookAt(num('tx', 0.0), num('ty', 2.0), 0);
  stage.finish();
});
</script></body></html>
