<!doctype html>
<html><head><meta charset="utf-8"><title>Whitehead anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import { THREE, guard, winterStage, clouds, pine } from './props.js';
import { createSnowman } from './snowman.js';
guard(() => {
  const { stage, scene, num } = winterStage(new URLSearchParams(location.search));
  const views = [[-0.62, 0.3, 'top', { l: [0, 1.0], r: [0, -1.0] }], [0, 0, 'crown', { l: [0, 2.3], r: [0, -0.9] }], [0.62, -1.45, 'beanie', { l: [0, 0.8], r: [0, -0.8] }]];
  views.forEach(([x, ry, hat, arms]) => {
    const s = createSnowman({ scale: 1.5, hat }); s.position.set(x * 2.3 , 0, 0); s.rotation.y = ry; scene.add(s);
    s.userData.pose({ arms, headTilt: 0.05 });
  });
  pine(scene, -2.9, -1.5, 1.4); pine(scene, 2.9, -1.6, 1.6);
  const pm = new Set(); scene.traverse((o) => { if (o.parent && o.parent.parent) pm.add(o); });
  stage.toonify(scene, (m) => m.geometry && m.geometry.type !== 'PlaneGeometry' && m.geometry.type !== 'ConeGeometry');
  clouds(stage);
  stage.camera.position.set(0, 1.0, 5.2); stage.camera.lookAt(0, 0.85, 0);
  stage.finish();
});
</script></body></html>
