<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// The SNOWMAN's BARTENDER helps found the LAMB (Alnylam).
import { THREE, guard, rng, mat, add, blob, box, cyl, winterStage, clouds, pine, snowfall, person, lamb, hen, egg, pose, openBelly } from './props.js';
import { createSnowman } from './snowman.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const { stage, scene, num } = winterStage(P);

  pine(scene, -5.0, -3.0, 2.0); pine(scene, 5.4, -3.4, 2.2);
  const sm = createSnowman({ scale: 2.1, hat: 'beanie' }); sm.position.set(-1.7, 0, 0.3); sm.rotation.y = 0.45; scene.add(sm);
  sm.userData.pose({ arms: { l: [0, 1.4], r: [0, -1.0] }, headTilt: 0.08 }); sm.userData.reach('r', [-0.25, 0.9, 0.35]);
  box(scene, mat('#6a3a1c'), [1.5, 0.55, -0.9], [3.4, 1.1, 0.7]); box(scene, mat('#c88a4a'), [1.5, 1.13, -0.9], [3.6, 0.07, 0.85]);
  for (const x of [1.5, 2.4, 2.8]) { cyl(scene, mat('#d8323a', { transparent: true, opacity: 0.85 }), [x, 1.3, -0.9], 0.06, 0.08, 0.3, undefined, 14); }
  const bt = person({ coat: '#14141a', kind: 'bartender', h: 1.7 }); bt.position.set(1.9, 0, -0.6); bt.rotation.y = -0.2; scene.add(bt);
  pose(bt, 'l', -1.3, 0.0, 0.2); pose(bt, 'r', 0, 0, -0.3);
  const lb = lamb(); lb.scale.setScalar(2.2); lb.rotation.y = -0.4; lb.position.set(0.7, 1.17, -0.8); scene.add(lb);
  stage.toonify(scene, (m) => m.geometry && m.geometry.type !== 'PlaneGeometry');
  clouds(stage);
  stage.camera.position.set(num('cx', 0.2), num('cy', 1.5), num('cz', 6.0));
  stage.camera.lookAt(num('tx', 0.2), num('ty', 1.2), 0);
  stage.finish();
});
