<!doctype html>
<html><head><meta charset="utf-8"><title>Flourish q05 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q05 — The FLOUR mills AI runs on twenty to fifty watts, like a dim light bulb.
import { THREE, guard, canvasTexture, rng, createFlour, mat, add, blob, box, cyl, textTexture, setup, wrap } from './base.js';
import { buildBrain, buildMill, buildBulb, coin, COIN_MAT, goldBar, flag } from './props.js';
guard(() => {
  const { stage, scene } = setup({ ground: '#caa879' });
  box(scene, mat('#9a6a3e'), [0, 2.2, -2.6], [14, 5, 0.2]);
  for (let i = -6; i <= 6; i++) box(scene, mat('#85572f'), [i * 1.0, 2.2, -2.48], [0.04, 5, 0.04]);
  // dim bulb with a small brain inside, hung from a cord
  const bulb = buildBulb({ r: 0.8, glow: 0.25 }); bulb.position.set(0.7, 3.0, -0.2); scene.add(bulb);
  const bb = buildBrain(); bb.scale.setScalar(0.85); bb.position.set(0.7, 3.0, -0.2); scene.add(bb);
  cyl(scene, mat('#222'), [0.7, 4.5, -0.2], 0.03, 1.4);
  // glowing filament ring under the brain
  add(scene, new THREE.TorusGeometry(0.3, 0.015, 8, 24), mat('#ffb74d', { emissive: '#ff9800', emissiveIntensity: 0.6 }), [0.7, 2.5, -0.2], [Math.PI / 2, 0, 0]);
  // wattage sign
  const sign = new THREE.Group(); sign.position.set(-2.4, 1.3, -0.5); sign.rotation.y = 0.35; scene.add(sign);
  box(sign, mat('#5e3b1d'), [0, 0, 0], [2.4, 1.1, 0.12]);
  add(sign, new THREE.PlaneGeometry(2.2, 0.95), new THREE.MeshBasicMaterial({ map: textTexture('20-50 W', { w: 704, h: 304, bg: '#fff6d6', fg: '#222', font: 'bold 190px sans-serif' }) }), [0, 0, 0.07]);
  cyl(sign, mat('#5e3b1d'), [0, -0.95, 0], 0.07, 1.4);
  const f = createFlour({ scale: 1.5 }); f.position.set(-0.5, 0, 1.3); f.rotation.y = 0.3; scene.add(f);
  f.userData.pose({ arms: { l: [0, 0.6, 0], r: [0, 0.4, 0] }, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  f.updateMatrixWorld(true);
  const tg = f.worldToLocal(new THREE.Vector3(0.3, 2.2, -0.1)); f.userData.reach('l', [tg.x, tg.y, tg.z]);
  wrap(stage, [f], { cam: [0.0, 1.9, 6.6], look: [-0.1, 1.9, 0], clouds: false });
});
</script></body></html>
