<!doctype html>
<html><head><meta charset="utf-8"><title>Flourish q08 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q08 — A LASSO pulls five hundred million coins into the FLOUR sack; a NAIL marks its worth in gold bars.
import { THREE, guard, canvasTexture, rng, createFlour, mat, add, blob, box, cyl, textTexture, setup, wrap } from './base.js';
import { buildBrain, buildMill, buildBulb, coin, COIN_MAT, goldBar, flag } from './props.js';
guard(() => {
  const { stage, scene } = setup({ ground: '#d9b46a', sky: { cover: 1.9 } });
  // coin pile on the right (instanced) and lasso loop around it, rope to the sack's hand
  const cm = COIN_MAT(), r = rng(8), N = 700;
  const im = new THREE.InstancedMesh(coin(0.12), cm, N); im.castShadow = im.receiveShadow = true; scene.add(im);
  const d = new THREE.Object3D();
  for (let i = 0; i < N; i++) {
    const a = r() * 6.28, rad = Math.sqrt(r()) * 1.3, h = Math.max(0, 1.1 - rad * 0.85) * (0.6 + r() * 0.5);
    d.position.set(2.2 + Math.cos(a) * rad, 0.05 + h, -0.2 + Math.sin(a) * rad * 0.8); d.rotation.set(r() * 1.6 - 0.8, r() * 6, r() * 1.6 - 0.8); d.updateMatrix(); im.setMatrixAt(i, d.matrix);
  }
  // the lasso: torus loop around the pile + rope curve to the sack
  const rope = mat('#c8a165');
  const loop = add(scene, new THREE.TorusGeometry(1.7, 0.06, 10, 60), rope, [2.2, 0.55, -0.2], [Math.PI / 2, 0, 0], [1, 0.8, 1]);
  const f = createFlour({ scale: 1.6 }); f.position.set(-1.0, 0, 1.0); f.rotation.y = 0.4; scene.add(f);
  f.userData.pose({ lean: 0.1, arms: { l: [0, 0.6, 0], r: [0, 0.4, 0] }, legs: { l: [0.3, 0], r: [-0.3, 0] } });
  f.updateMatrixWorld(true);
  const hp = new THREE.Vector3(); f.userData.parts.hands.r.getWorldPosition(hp);
  const rc = new THREE.CatmullRomCurve3([hp, new THREE.Vector3(0.2, 0.9, 0.9), new THREE.Vector3(1.0, 0.4, 0.4), new THREE.Vector3(1.9, 0.5, 1.1)]);
  add(scene, new THREE.TubeGeometry(rc, 30, 0.05, 8), rope);
  // coins flying into the sack's mouth
  for (let i = 0; i < 6; i++) add(scene, coin(0.13), cm, [-1.0 + i * 0.12 - 0.3, 2.6 + i * 0.28, 0.9 + (i % 2) * 0.1], [1.0 + i, i, 0.4]);
  // NAIL: huge iron nail in a post, gold bars stacked and hung on it
  const post = new THREE.Group(); post.position.set(-3.6, 0, -0.8); scene.add(post);
  box(post, mat('#8a5a35'), [0, 1.4, 0], [0.7, 2.8, 0.7]);
  const iron = mat('#5b6169', { metalness: 0.8, roughness: 0.35 });
  add(post, new THREE.CylinderGeometry(0.07, 0.07, 1.0, 12), iron, [0, 1.7, 0.7], [Math.PI / 2, 0, 0]);
  add(post, new THREE.ConeGeometry(0.07, 0.25, 12), iron, [0, 1.7, 0.0], [-Math.PI / 2, 0, 0]);
  add(post, new THREE.CylinderGeometry(0.28, 0.28, 0.1, 20), iron, [0, 1.7, 1.28], [Math.PI / 2, 0, 0]);
  for (let i = 0; i < 6; i++) { const b = goldBar(0.7); b.position.set(-1.1 + (i % 3) * 0.78 - 0.3, 0.12 + Math.floor(i / 3) * 0.24, 0.2); b.position.x += 0.0; post.add(b); }
  for (let i = 0; i < 3; i++) { const b = goldBar(0.7); b.position.set(-0.7 + i * 0.78 - 0.2, 0.6, 0.2); post.add(b); }
  const hb = goldBar(0.6); hb.position.set(0, 1.35, 1.28); hb.rotation.z = Math.PI / 2; post.add(hb);
  // sun: heavy summer glare
  wrap(stage, [f], { cam: [-0.4, 1.7, 7.5], look: [-0.5, 1.1, 0] });
});
</script></body></html>
