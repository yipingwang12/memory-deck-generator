<!doctype html>
<html><head><meta charset="utf-8"><title>Flourish q07 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q07 — The FLOUR mill grinds brain science into better AI.
import { THREE, guard, canvasTexture, rng, createFlour, mat, add, blob, box, cyl, textTexture, setup, wrap } from './base.js';
import { buildBrain, buildMill, buildBulb, coin, COIN_MAT, goldBar, flag } from './props.js';
guard(() => {
  const { stage, scene } = setup({ ground: '#caa879' });
  box(scene, mat('#9a6a3e'), [0, 2.2, -2.6], [14, 5, 0.2]);
  for (let i = -6; i <= 6; i++) box(scene, mat('#85572f'), [i * 1.0, 2.2, -2.48], [0.04, 5, 0.04]);
  // grinder: stone base, funnel hopper on top, brain going in, glowing AI chip popping out the side chute
  const G = new THREE.Group(); G.position.set(0.8, 0, -0.5); scene.add(G);
  cyl(G, mat('#9aa0a8'), [0, 0.5, 0], 1.1, 1.0); cyl(G, mat('#b3b9c1'), [0, 1.05, 0], 1.0, 0.12);
  cyl(G, mat('#7a5a3a'), [0, 1.45, 0], 0.9, 0.7, [0, 0, 0], 0.9);
  add(G, new THREE.CylinderGeometry(0.95, 0.35, 0.9, 28, 1, true), mat('#c47a3a', { side: THREE.DoubleSide }), [0, 2.0, 0]);
  const br = buildBrain(); br.scale.setScalar(0.9); br.position.set(0, 2.9, 0); br.rotation.y = -1.2; br.rotation.z = 0.2; G.add(br);
  for (let i = 0; i < 6; i++) blob(G, mat('#fff8e8'), [Math.sin(i * 1.1) * 0.5, 3.5 + i * 0.12, Math.cos(i) * 0.3], [0.1, 0.1, 0.1]);
  const crank = new THREE.Group(); crank.position.set(1.1, 0.9, 0); G.add(crank);
  cyl(crank, mat('#555a63', { metalness: 0.6 }), [0.3, 0, 0], 0.06, 0.7, [0, 0, Math.PI / 2]); cyl(crank, mat('#555a63', { metalness: 0.6 }), [0.6, -0.3, 0], 0.06, 0.6); blob(crank, mat('#c0392b'), [0.6, -0.65, 0], [0.12, 0.12, 0.12]);
  box(G, mat('#7a5a3a'), [-1.3, 0.35, 0.3], [1.0, 0.1, 0.8], [0, 0, -0.35]);
  // the AI chip sliding out
  const chip = new THREE.Group(); chip.scale.setScalar(2.0); chip.position.set(1.9, 1.0, 1.2); chip.rotation.set(1.2, 0, 0); G.add(chip);
  box(chip, mat('#1f2a44', { emissive: '#1b3a7a', emissiveIntensity: 0.4 }), [0, 0, 0], [0.7, 0.14, 0.7]);
  for (let i = 0; i < 4; i++) for (const s of [-1, 1]) { box(chip, mat('#d0d8e6', { metalness: 0.8 }), [s * 0.42, 0, -0.27 + i * 0.18], [0.14, 0.05, 0.06]); }
  add(chip, new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({ map: textTexture('AI', { w: 256, h: 256, bg: '#1f2a44', fg: '#7de3ff', font: 'bold 170px sans-serif' }) }), [0, 0.08, 0], [-Math.PI / 2, 0, 0]);
  // science flask
  const fk = new THREE.Group(); fk.position.set(4.2, 0, 0.2); scene.add(fk);
  add(fk, new THREE.SphereGeometry(0.4, 24, 16), new THREE.MeshStandardMaterial({ color: '#bfe9ff', transparent: true, opacity: 0.5 }), [0, 0.45, 0]);
  cyl(fk, new THREE.MeshStandardMaterial({ color: '#bfe9ff', transparent: true, opacity: 0.5 }), [0, 0.95, 0], 0.13, 0.5);
  blob(fk, mat('#6df0a6', { emissive: '#2bd47a', emissiveIntensity: 0.5 }), [0, 0.38, 0], [0.34, 0.26, 0.34]);
  const f = createFlour({ scale: 1.5 }); f.position.set(-1.5, 0, 1.5); f.rotation.y = 0.5; scene.add(f);
  f.userData.pose({ arms: { l: [0, 0.4, 0], r: [0, 0.4, 0] }, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  f.updateMatrixWorld(true);
  const tg = f.worldToLocal(new THREE.Vector3(1.9, 0.5, -0.4)); f.userData.reach('l', [tg.x, tg.y, tg.z]);
  wrap(stage, [f], { cam: [0.2, 2.0, 7.0], look: [0.2, 1.7, 0], clouds: false });
});
</script></body></html>
