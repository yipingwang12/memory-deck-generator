<html><head><meta charset="utf-8"><title>Flourish q06 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 — A SEAHORSE (hippocampus) keeps the FLOUR mills memories.
import { THREE, guard, canvasTexture, rng, createFlour, mat, add, blob, box, cyl, textTexture, setup, wrap } from './base.js';
import { buildBrain, buildMill, buildBulb, coin, COIN_MAT, goldBar, flag } from './props.js';
guard(() => {
  const { stage, scene } = setup({ ground: '#caa879' });
  box(scene, mat('#9a6a3e'), [0, 2.2, -2.6], [14, 5, 0.2]);
  for (let i = -6; i <= 6; i++) box(scene, mat('#85572f'), [i * 1.0, 2.2, -2.48], [0.04, 5, 0.04]);
  // shelves of memory jars with glowing orbs
  const r = rng(3);
  for (const y of [1.6, 3.0]) {
    box(scene, mat('#5e3b1d'), [3.0, y, -2.0], [3.4, 0.1, 0.8]);
    for (let i = 0; i < 4; i++) {
      const x = 1.8 + i * 0.8, col = ['#ff9ec7', '#9ee6ff', '#ffe27a', '#b9f08a'][(i + (y > 2 ? 1 : 0)) % 4];
      add(scene, new THREE.CylinderGeometry(0.26, 0.26, 0.55, 20), new THREE.MeshStandardMaterial({ color: '#dff3ff', transparent: true, opacity: 0.35, roughness: 0.1 }), [x, y + 0.33, -2.0]);
      blob(scene, mat(col, { emissive: col, emissiveIntensity: 0.7 }), [x, y + 0.32, -2.0], [0.17, 0.17, 0.17]);
      cyl(scene, mat('#8d6e63'), [x, y + 0.64, -2.0], 0.27, 0.07);
    }
  }
  // seahorse: chain of spheres along an S-curve + curled tail, snout, crest, fins
  const sh = new THREE.Group(); sh.position.set(1.0, 0, 0.2); sh.scale.setScalar(0.8); sh.rotation.y = -0.35; scene.add(sh);
  const sc = mat('#ffa726'), sd = mat('#ef6c00');
  const pts = []; for (let i = 0; i <= 40; i++) { const t = i / 40; // head top → tail curl
    const a = t * 3.2; pts.push(t < 0.55 ? [0.05 * Math.sin(t * 9), 3.0 - t * 3.4, 0.0] : [0, 1.1 - (t - 0.55) * 1.2 + 0, 0]); }
  const curve = new THREE.CatmullRomCurve3([[0.0, 3.1, 0], [0.18, 2.6, 0], [0.22, 2.0, 0], [0.1, 1.4, 0], [-0.1, 0.95, 0], [-0.4, 0.7, 0], [-0.55, 0.45, 0], [-0.4, 0.28, 0], [-0.2, 0.35, 0], [-0.22, 0.52, 0]].map((p) => new THREE.Vector3(...p)));
  for (let i = 0; i <= 44; i++) {
    const t = i / 44, p = curve.getPoint(t), rad = 0.34 * Math.pow(1 - t, 0.7) + 0.06;
    blob(sh, i % 2 ? sc : sd, [p.x, p.y, 0], [rad, rad * 1.1, rad]);
  }
  blob(sh, sc, [-0.08, 3.2, 0], [0.34, 0.3, 0.3]);
  add(sh, new THREE.CylinderGeometry(0.07, 0.1, 0.65, 14), sc, [-0.55, 3.15, 0], [0, 0, Math.PI / 2 + 0.2]);
  for (const s of [-1, 1]) { blob(sh, mat('#fff'), [-0.14, 3.28, s * 0.22], [0.1, 0.11, 0.05]); blob(sh, mat('#1a1a40'), [-0.17, 3.28, s * 0.26], [0.06, 0.08, 0.03]); blob(sh, mat('#fff'), [-0.2, 3.31, s * 0.285], [0.02, 0.02, 0.015]); }
  for (let i = 0; i < 5; i++) add(sh, new THREE.ConeGeometry(0.06, 0.28, 6), sd, [0.12 + i * 0.01, 3.4 - i * 0.02 - 0.12 * i * 0, 0], [0, 0, -0.5 - i * 0.18]).position.set(0.15 + i * 0.07, 3.42 - i * 0.1, 0);
  add(sh, new THREE.CircleGeometry(0.25, 20), mat('#ffe0b2', { side: THREE.DoubleSide }), [0.28, 2.3, 0], [0, 0.4, 0.2]);
  // memory orb held in the seahorse's tail? -> glowing orbs floating by its head
  for (const [x, y, z, c] of [[-0.9, 2.5, 0.5, '#ff9ec7'], [-1.2, 3.1, 0.2, '#9ee6ff'], [-0.8, 3.7, 0.3, '#ffe27a']]) blob(sh, mat(c, { emissive: c, emissiveIntensity: 0.8 }), [x, y, z], [0.14, 0.14, 0.14]);
  const f = createFlour({ scale: 1.5 }); f.position.set(-1.1, 0, 1.2); f.rotation.y = 0.4; scene.add(f);
  f.userData.pose({ arms: { l: [0, 0.4, 0], r: [0, 0.4, 0] }, legs: { l: [0.1, 0], r: [-0.1, 0] } });
  f.updateMatrixWorld(true);
  const tg = f.worldToLocal(new THREE.Vector3(-0.3, 1.4, 0.5)); f.userData.reach('r', [tg.x, tg.y, tg.z]);
  wrap(stage, [f], { cam: [0.2, 1.9, 7.4], look: [0.2, 1.7, 0], clouds: false });
});
</script></body></html>
