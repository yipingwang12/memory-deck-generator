<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// The VERY SITE patch on the JEANS gets a HIGH FIVE (Haifa) in Israel.
import { THREE, guard, mat, add, blob, rng, makeStage, meadow, flowers, finishScene, placeJeans, textTexture } from './common.js';
import * as PR from './props.js';
import { pocketTexture } from './jeans.js';
guard(() => {
  const { stage, scene, num } = makeStage({ shadowSize: 7 });
  meadow(scene, '#c9b684');
  add(scene, new THREE.PlaneGeometry(600, 300), mat('#2d8fd0', { roughness: 0.3 }), [0, 0.01, -90], [-Math.PI / 2, 0, 0]);
  add(scene, new THREE.PlaneGeometry(600, 70), mat('#d8c690'), [0, 0.02, -20], [-Math.PI / 2, 0, 0]);

  const hill = blob(scene, mat('#79ad55'), [-4.5, -0.5, -9], [9, 4.5, 5]);
  for (let i = 0; i < 4; i++) add(scene, new THREE.CylinderGeometry(1.8 - i * 0.2, 2.0 - i * 0.2, 0.18, 24), mat(['#a9d26a', '#8fc05a'][i % 2]), [-4.5, 3.2 - i * 0.05, -6.4 + i * 0.9], [0, 0, 0], [1.4, 1, 0.6]);
  const r = rng(12);

  add(scene, new THREE.BoxGeometry(1.6, 0.8, 1.2), mat('#f4ecd8'), [-4.5, 3.9, -6.2]);
  add(scene, new THREE.CylinderGeometry(0.45, 0.5, 0.5, 24), mat('#f4ecd8'), [-4.5, 4.55, -6.2]);
  blob(scene, mat('#f2c230', { metalness: 0.6, roughness: 0.3 }), [-4.5, 4.85, -6.2], [0.5, 0.5, 0.5]);
  // Israeli flag
  const tex = (() => { const c = document.createElement('canvas'); c.width = 300; c.height = 210; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 300, 210); x.fillStyle = '#1b4fbf'; x.fillRect(0, 22, 300, 24); x.fillRect(0, 164, 300, 24);
    x.strokeStyle = '#1b4fbf'; x.lineWidth = 8; for (const d of [0, Math.PI]) { x.beginPath(); for (let i = 0; i < 3; i++) { const a = d - Math.PI / 2 + i * 2.094; const px = 150 + Math.cos(a) * 42, py = 105 + Math.sin(a) * 42; i ? x.lineTo(px, py) : x.moveTo(px, py); } x.closePath(); x.stroke(); }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  add(scene, new THREE.CylinderGeometry(0.04, 0.04, 4.6, 8), mat('#ccc'), [3.4, 2.3, -1.2]);
  add(scene, new THREE.PlaneGeometry(1.6, 1.12), new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide }), [4.2, 3.9, -1.2]);
  const j = placeJeans(scene, num, { scale: 2.1, x: -0.9, z: 0.4, ry: 0.5, pose: { legs: { r: [-0.15, -0.05] } } });
  const leg = j.userData.parts.legs.l;
  const patch = new THREE.Group(); patch.position.set(0, -0.27, 0.088);
  add(patch, new THREE.BoxGeometry(0.15, 0.15, 0.014), mat('#f4a62a')); add(patch, new THREE.BoxGeometry(0.125, 0.125, 0.018), mat('#ffd86a'), [0, 0, 0.002]);
  add(patch, new THREE.BoxGeometry(0.095, 0.014, 0.022), mat('#f4a62a'), [0, 0, 0.003]); add(patch, new THREE.BoxGeometry(0.014, 0.095, 0.022), mat('#f4a62a'), [0, 0, 0.003]); leg.add(patch);
  const p = PR.person({ shirt: '#fbfbfb', pants: '#2f3a5c', scale: 2.4, up: [0, 0.8] }); p.position.set(1.5, 0, 0.5); p.rotation.y = -0.6; scene.add(p);
  scene.updateMatrixWorld(true);
  const hand = p.userData.arms.r.localToWorld(new THREE.Vector3(0, -0.31, 0));
  const sh = j.localToWorld(new THREE.Vector3(0.185, 0.92, 0)), want = sh.clone().add(new THREE.Vector3(0.38, 0.08, 0.1));
  p.position.add(want.sub(hand)); scene.updateMatrixWorld(true);
  const h2 = p.userData.arms.r.localToWorld(new THREE.Vector3(0, -0.31, 0));
  const t = j.worldToLocal(h2.clone()); j.userData.reach('l', [t.x, t.y, t.z]);

  finishScene(stage, num, [j, p], [0.9, 1.9, 7.2], [0.7, 1.7, 0]);
});
