<script type="module">
// One leg of the JEANS reads whole exomes and genomes for rare diseases.
import { THREE, guard, mat, add, blob, rng, makeStage, meadow, flowers, finishScene, placeJeans, textTexture } from './common.js';
import * as PR from './props.js';
guard(() => {
  const { stage, scene, num } = makeStage();
  meadow(scene); flowers(scene, 4, 50, [-5, 5], [-4, 1]);
  const j = placeJeans(scene, num, { scale: 2, x: -1.0, ry: 0.7, pose: { legs: { r: [-1.0, -0.05], l: [0.05, 0.05] } },

  add(scene, new THREE.CylinderGeometry(0.22, 0.28, 0.5, 20), mat('#e8dcc8'), [3.2, 0.25, -0.3]);
  add(scene, new THREE.OctahedronGeometry(0.22), mat('#ff4a9a', { roughness: 0.15, emissive: '#aa2060', emissiveIntensity: 0.4 }), [3.2, 0.75, -0.3], [0, 0.5, 0], [1, 1.3, 1]);
  finishScene(stage, num, [j], [0.9, 1.3, 5.4], [0.9, 1.0, 0]);
});
