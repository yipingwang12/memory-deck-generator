<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { THREE, guard, makeStage, createAsimo, wrap, blob, box, cyl, add, mat, limbTo, limbArm, textPlane, tube, ribbon, dnaHelix, blade, person, armW, reachW, handPos, lens, crate, V3, rng, canvasTexture } from './common.js';
// q10 — Three DNA letters, A, G and C, sign a licence and carry the ASIMO robot's lentil boxes away.
function letterGuy(letter, color) {
  const g = new THREE.Group();
  for (const s of [-1, 1]) { cyl(g, '#333a4d', 0.05, 0.05, 0.4, [s * 0.17, 0.2, 0]); blob(g, '#222', [s * 0.17, 0.03, 0.04], [0.09, 0.05, 0.12]); }
  box(g, color, [0.74, 0.74, 0.5], [0, 0.78, 0]);
  textPlane(g, letter, 0.62, 0.62, [0, 0.78, 0.256], [0, 0, 0], { bg: color, fg: '#ffffff' });
  const arm = {}; g.userData.arm = (k, t) => { const s = k === 'l' ? 1 : -1; arm[k]?.removeFromParent(); arm[k] = limbArm(g, color, 0.055, [s * 0.38, 0.95, 0], t, '#fff', [s * 0.1, -0.05, 0.1]); };
  return g;
}
guard(() => {

  a.userData.pose({ arms: { l: [0, 2.6, -0.4], r: [0, 0.5] } });

  textPlane(dk, '', 0.7, 0.5, [0, 0.545, 0.0], [-1.15, 0, 0], { bg: '#fff8e6', border: '#caa84a', draw: (c, w, h) => {
    c.fillStyle = '#8a8a8a'; for (let i = 0; i < 5; i++) c.fillRect(w * 0.12, h * (0.18 + i * 0.09), w * (i === 4 ? 0.4 : 0.76), 9);
    c.strokeStyle = '#1a3d9c'; c.lineWidth = 7; c.beginPath(); c.moveTo(w * 0.15, h * 0.8); for (let i = 1; i < 8; i++) c.lineTo(w * (0.15 + i * 0.04), h * (0.8 + (i % 2 ? -0.07 : 0.05))); c.stroke();
    c.fillStyle = '#d62828'; c.beginPath(); c.arc(w * 0.8, h * 0.76, h * 0.13, 0, 7); c.fill(); c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(w * 0.8, h * 0.76, h * 0.06, 0, 7); c.fill(); } });
  const C = letterGuy('C', '#3b7bd8'); C.position.set(-0.75, 0, -0.1); C.rotation.y = 0.15; scene.add(C);
