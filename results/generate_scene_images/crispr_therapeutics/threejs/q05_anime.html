<script type="module">
// q05 — The CRISP's second editing tool is SYNTASE, a synthesis enzyme.
import { THREE, mat, add, blob, box, cyl, textPlane, textTexture, flag, person, helix, snake, scissors, startScene } from './common.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hand = (p, k) => { p.updateMatrixWorld(true); return p.userData.parts['arm' + k].localToWorld(V(0, -0.45, 0)); };
startScene(({ scene, crisp, reach, finish }) => {
  const c = crisp({ s: 2.3, x: -1.9, z: 0, ry: 0.4, pose: { arms: { l: [0, 0.8, 0], r: [0, 0.8, 0] } } });
  // enzyme: lumpy green protein with face, clamping a growing DNA strand
  const en = new THREE.Group(); en.position.set(1.7, 1.4, 0.2); scene.add(en);
  const g1 = mat('#43c06a'), g2 = mat('#2f9a52');
  blob(en, g1, [0, 0, 0], [0.9, 0.8, 0.7]); blob(en, g2, [-0.65, 0.35, 0], [0.5, 0.45, 0.45]); blob(en, g2, [0.7, 0.3, 0.05], [0.5, 0.45, 0.45]); blob(en, g1, [0, 0.75, 0], [0.42, 0.35, 0.4]);
  blob(en, mat('#1a1a20'), [0, -0.05, 0.62], [0.42, 0.2, 0.2]); // mouth groove holding strand
  for (const sx of [-1, 1]) { blob(en, mat('#fff'), [sx * 0.3, 0.25, 0.58], [0.15, 0.19, 0.08]); blob(en, mat('#2a1a10'), [sx * 0.3, 0.23, 0.64], [0.09, 0.14, 0.05]); blob(en, mat('#fff'), [sx * 0.27, 0.29, 0.69], [0.03, 0.03, 0.02]); }
  for (const sx of [-1, 1]) { cyl(en, g2, [sx * 0.35, -0.85, 0.1], 0.1, 0.4); blob(en, mat('#2a6dd8'), [sx * 0.35, -1.05, 0.2], [0.17, 0.09, 0.22]); }
  const dna = helix({ h: 1.8, r: 0.22, turns: 1.5 }); dna.rotation.z = Math.PI / 2; dna.position.set(0.2, -0.05, 0.62); en.add(dna);
  const sign = textPlane('SYNTASE', 2.3, 0.62, { bg: '#fff6d8', fg: '#1d6b3a' }); sign.position.set(1.7, 3.0, 0.2); scene.add(sign);
  cyl(scene, mat('#8a5a2a'), [1.7, 2.4, 0.1], 0.03, 0.4);
  reach(c, 'l', [0.5, 1.2, 0.8]);
  finish([0.1, 1.9, 6.0], [0.0, 1.5, 0]);
});
