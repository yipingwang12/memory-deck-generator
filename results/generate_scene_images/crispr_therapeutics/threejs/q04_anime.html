<!doctype html>
<html><head><meta charset="utf-8"><title>CRISPR q04 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q04 — A DOLL ties the CRISP to a VORTEX in partnership.
import { THREE, mat, add, blob, box, cyl, textPlane, textTexture, flag, person, helix, snake, scissors, startScene } from './common.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hand = (p, k) => { p.updateMatrixWorld(true); return p.userData.parts['arm' + k].localToWorld(V(0, -0.45, 0)); };
startScene(({ scene, crisp, finish }) => {
  const c = crisp({ s: 1.9, x: 0.2, z: 0, pose: { arms: { l: [0, 0.8, 0], r: [0, 0.8, 0] } } });
  const rope = mat('#d9a53a');
  add(scene, new THREE.TorusGeometry(1, 0.05, 10, 48), rope, [0.2, 0.95, 0], [Math.PI / 2, 0, 0]).scale.set(0.74, 0.4, 1);
  // doll
  const d = person({ shirt: '#ff7fb0', pants: '#ff7fb0', skin: '#ffe0cc', hair: '#ffcf33', s: 1.1 }); d.position.set(-2.6, 0, 0.4); d.rotation.y = 0.5; scene.add(d);
  add(d, new THREE.ConeGeometry(0.42, 0.7, 28), mat('#ff5a9a'), [0, 0.65, 0]);
  for (const sx of [-1, 1]) { blob(d, mat('#ffcf33'), [sx * 0.3, 1.2, -0.02], [0.1, 0.34, 0.1]); blob(d, mat('#e83a6a'), [sx * 0.3, 1.5, 0.02], [0.1, 0.07, 0.07]); }
  blob(d, mat('#e83a6a'), [0, 1.55, 0.1], [0.2, 0.08, 0.1]);
  d.userData.parts.armL.rotation.set(-1.2, 0, 0.5);
  const hp = hand(d, 'L');
  const tube = (pts) => add(scene, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.045, 8), rope);
  tube([hp, V(-1.7, 0.7, 0.9), V(-0.9, 0.6, 0.55), V(-0.5, 0.95, 0.4)]);
  // vortex
  const vx = 3.2; const cone = add(scene, new THREE.ConeGeometry(1.3, 3.2, 32, 1, true), mat('#6a4ad8', { side: THREE.DoubleSide }), [vx, 1.6, 0], [Math.PI, 0, 0]);
  for (let i = 0; i < 16; i++) { const t = i / 15, r = 0.16 + t * 1.25, y = 0.2 + t * 2.95; add(scene, new THREE.TorusGeometry(r, 0.12 + t * 0.05, 10, 40), mat(i % 2 ? '#8be3e8' : '#b69cff'), [vx + Math.sin(t * 7) * 0.12, y, Math.cos(t * 7) * 0.12], [Math.PI / 2 + 0.08 * Math.sin(i), 0, 0]); }
  for (let i = 0; i < 8; i++) { const a = i * 0.9; blob(scene, mat('#ffe9a8'), [vx + Math.cos(a) * 1.3, 1.0 + i * 0.3, Math.sin(a) * 1.3], [0.12, 0.05, 0.08]); }
  tube([V(0.9, 0.95, 0.4), V(1.5, 0.6, 0.5), V(2.2, 0.35, 0.5), V(vx, 0.4, 0.2)]);
  finish([0.9, 2.0, 7.6], [0.9, 1.4, 0]);
});

</script></body></html>
