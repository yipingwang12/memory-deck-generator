<html><head><meta charset="utf-8"><title>CRISPR q10 anime</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q10 — CTX321 in the CRISP targets LP(A), a lipoprotein record.
import { THREE, mat, add, blob, box, cyl, textPlane, textTexture, flag, person, helix, snake, scissors, startScene } from './common.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hand = (p, k) => { p.updateMatrixWorld(true); return p.userData.parts['arm' + k].localToWorld(V(0, -0.45, 0)); };
startScene(({ scene, crisp, reach, finish }) => {
  const c = crisp({ s: 2.3, x: -2.3, z: 0, ry: 0.3 });
  const cv = document.createElement('canvas'); cv.width = cv.height = 1024; const g = cv.getContext('2d');
  g.fillStyle = '#2a2a36'; g.fillRect(0, 0, 1024, 1024);
  for (let r = 200; r < 505; r += 9) { g.strokeStyle = r % 18 ? '#3a3a48' : '#555568'; g.lineWidth = 2; g.beginPath(); g.arc(512, 512, r, 0, 7); g.stroke(); }
  g.fillStyle = '#e8352e'; g.beginPath(); g.arc(512, 512, 190, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.font = 'bold 150px Arial Black, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('LP(A)', 512, 512);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
  const rec = new THREE.Group(); rec.position.set(1.3, 2.4, 0.2); rec.rotation.y = -0.25; scene.add(rec);
  add(rec, new THREE.CircleGeometry(1.7, 64), new THREE.MeshStandardMaterial({ map: tx, roughness: 0.4, side: THREE.DoubleSide }));
  cyl(rec, mat('#16161c'), [0, 0, -0.08], 1.7, 0.06, [Math.PI / 2, 0, 0]);
  // lipoprotein particles
  [[2.9, 0.8, 0.8, 0.45], [3.5, 1.5, 0.3, 0.3], [2.4, 0.5, 1.2, 0.25]].forEach(([x, y, z, r]) => { const p = new THREE.Group(); p.position.set(x, y, z); scene.add(p);
    blob(p, mat('#ff9a3c'), [0, 0, 0], [r, r, r]); blob(p, mat('#ffe14a'), [0, 0, 0], [r * 0.55, r * 0.55, r * 0.55]);
    for (let i = 0; i < 8; i++) { const a = i * 0.785; blob(p, mat('#7a3ad8'), [Math.cos(a) * r, Math.sin(a * 2) * r * 0.4, Math.sin(a) * r], [r * 0.18, r * 0.18, r * 0.18]); } });
  // dart in the record
  const dart = new THREE.Group(); dart.position.set(0.3, 1.5, 0.35); dart.rotation.z = -0.6; scene.add(dart);
  cyl(dart, mat('#c0c4cc', { metalness: 0.6 }), [0, 0, 0], 0.04, 1.0, [0, 0, Math.PI / 2]); add(dart, new THREE.ConeGeometry(0.06, 0.2, 12), mat('#c0c4cc'), [0.58, 0, 0], [0, 0, -Math.PI / 2]);
  for (const sg of [-1, 1]) box(dart, mat('#e02a3a'), [-0.5, sg * 0.1, 0], [0.22, 0.2, 0.02], [0, 0, sg * 0.2]);
  const tag = textPlane('CTX321', 1.3, 0.42, { bg: '#fff', fg: '#c01e2e' }); tag.position.set(-2.3, 0.5, 1.4); tag.rotation.x = -0.25; scene.add(tag);
  reach(c, 'l', [-0.2, 1.7, 0.6]);
  finish([0.3, 2.1, 7.4], [0.3, 1.9, 0]);
});
