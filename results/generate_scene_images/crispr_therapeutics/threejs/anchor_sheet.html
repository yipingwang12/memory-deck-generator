<!doctype html>
<html><head><meta charset="utf-8"><title>CRISP anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createCrisp } from './crisp.js';
const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 });
guard(() => {
  const stage = createAnimeStage({
    fov: 30, sunElevation: 35, sunAzimuth: 150, exposure: 1,
    sky: { cover: 2, seed: 5, towerTop: 0.5, puffCover: 2 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 },
    sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 },
    flare: 0.7, fog: { near: 120, far: 1500 },
  });
  const scene = stage.scene;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat('#6fae45')); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const pm = new Set();
  [[-1.3, 0], [0, 0.6], [1.3, 1.5708]].forEach(([x, ry], i) => {
    const c = createCrisp({ scale: 1.5 }); c.position.set(x, 0, 0); c.rotation.y = ry;
    c.userData.pose({ arms: { l: [0, 0.9, 0], r: [0, 0.5, 0] }, legs: { l: [0.2, 0], r: [-0.2, 0] } });
    scene.add(c); c.traverse((o) => pm.add(o));
  });
  stage.toonify(scene, (m) => pm.has(m));
  stage.addClouds([[150, 900, 90, 1.2], [187, 1000, 120, 1.6], [214, 950, 70, 0.9]]);
  stage.camera.position.set(0, 0.95, 5.2); stage.camera.lookAt(0, 0.85, 0);
  stage.finish();
});
</script></body></html>
