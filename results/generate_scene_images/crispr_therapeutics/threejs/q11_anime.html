<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
// q11 — A ZUG train (Zugo-cel) carries the CRISP's lead CAR-T.
import { THREE, mat, add, blob, box, cyl, textPlane, textTexture, flag, person, helix, snake, scissors, startScene } from './common.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hand = (p, k) => { p.updateMatrixWorld(true); return p.userData.parts['arm' + k].localToWorld(V(0, -0.45, 0)); };
startScene(({ scene, crisp, finish }) => {
  add(scene, new THREE.BoxGeometry(30, 0.12, 0.12), mat('#6a6a72'), [0, 0.1, 0.9]); add(scene, new THREE.BoxGeometry(30, 0.12, 0.12), mat('#6a6a72'), [0, 0.1, -0.9]);
  for (let x = -12; x < 12; x += 0.7) box(scene, mat('#7a5a38'), [x, 0.03, 0], [0.22, 0.06, 2.2]);
  const wheel = (p, x, z, r = 0.5) => { const w = cyl(p, mat('#2a2a30'), [x, r, z], r, 0.14, [Math.PI / 2, 0, 0]); cyl(p, mat('#e0b02a'), [x, r, z + (z > 0 ? 0.08 : -0.08)], r * 0.45, 0.06, [Math.PI / 2, 0, 0]); };
  // locomotive (faces +x)
  const L = new THREE.Group(); L.position.set(1.8, 0, 0); scene.add(L);
  cyl(L, mat('#d8352e'), [0.3, 1.45, 0], 0.85, 3.0, [0, 0, Math.PI / 2]);
  box(L, mat('#2a2a30'), [0.3, 0.75, 0], [3.1, 0.3, 1.6]);
  box(L, mat('#3a7bd5'), [-1.45, 1.8, 0], [1.3, 1.9, 1.8]); box(L, mat('#27518f'), [-1.45, 2.85, 0], [1.6, 0.18, 2.1]);
  box(L, mat('#bfe4ff'), [-1.45, 2.0, 0.92], [0.6, 0.6, 0.02]);
  cyl(L, mat('#2a2a30'), [1.2, 2.55, 0], 0.2, 0.8, [0, 0, 0], 0.28); cyl(L, mat('#2a2a30'), [1.2, 2.98, 0], 0.32, 0.1);
  blob(L, mat('#f2c230'), [1.82, 1.45, 0], [0.12, 0.38, 0.38]); blob(L, mat('#fff7c0'), [1.9, 1.5, 0], [0.1, 0.2, 0.2]);
  [[-1.6, 0.6], [0.0, 0.5], [0.9, 0.5]].forEach(([x, r]) => { wheel(L, x, 0.9, r); wheel(L, x, -0.9, r); });
  const nm = textPlane('ZUG', 1.9, 0.75, { bg: '#fff', fg: '#d8352e' }); nm.position.set(0.3, 1.45, 0.88); L.add(nm);
  // flatcar behind, carrying a toy CAR and a T cell
  const F = new THREE.Group(); F.position.set(-3.6, 0, 0); scene.add(F);
  box(F, mat('#2a2a30'), [0, 0.7, 0], [3.6, 0.2, 1.7]); [-1.2, 1.2].forEach((x) => { wheel(F, x, 0.9, 0.42); wheel(F, x, -0.9, 0.42); });
  box(scene, mat('#444'), [-1.35, 0.7, 0], [0.5, 0.1, 0.1]);
  box(F, mat('#2fa8e8'), [-0.8, 1.25, 0], [1.5, 0.45, 0.9]); box(F, mat('#2fa8e8'), [-0.8, 1.65, 0], [0.8, 0.4, 0.8]); box(F, mat('#bfe4ff'), [-0.8, 1.65, 0.41], [0.65, 0.28, 0.02]);
  [-1.25, -0.35].forEach((x) => [0.45, -0.45].forEach((z) => cyl(F, mat('#222'), [x, 0.98, z], 0.2, 0.12, [Math.PI / 2, 0, 0])));
  const cell = new THREE.Group(); cell.position.set(0.95, 1.5, 0); F.add(cell);
  blob(cell, mat('#5a7bff'), [0, 0, 0], [0.55, 0.55, 0.55]); blob(cell, mat('#2a3ad8'), [0, 0, 0.25], [0.3, 0.3, 0.3]);
  for (let i = 0; i < 9; i++) { const a = i * 0.7, el = (i % 3 - 1) * 0.6; const d = new THREE.Vector3(Math.cos(a) * Math.cos(el), Math.sin(el), Math.sin(a) * Math.cos(el));
    const y = new THREE.Group(); y.position.copy(d.clone().multiplyScalar(0.55)); y.lookAt(d.clone().multiplyScalar(2)); cell.add(y);
    cyl(y, mat('#ffcf33'), [0, 0, 0.12], 0.03, 0.25, [Math.PI / 2, 0, 0]); [-1, 1].forEach((sg) => cyl(y, mat('#ffcf33'), [sg * 0.07, 0, 0.3], 0.03, 0.18, [Math.PI / 2, sg * 0.4, 0]));
  }
  scene.children.forEach(() => {});
  const c = crisp({ s: 2.6, x: 1.9, y: 2.82, z: 0, ry: 0.35, pose: { arms: { l: [0, 2.3, 0], r: [0, 0.6, 0] } } });
  c.userData.pose({ arms: { l: [0, 2.4, 0], r: [0, 0.6, 0] } });
  finish([-0.5, 3.0, 10.2], [-0.5, 2.6, 0]);
}, { ground: '#8cb56a' });
