<!doctype html>
<html><head><meta charset="utf-8"><title>CRISPR q02 anime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 — A CHARPENTIER carpenter, a NOVAK nova star and a FOIL (Foy) plant flags on the CRISP.
import { THREE, mat, add, blob, box, cyl, textPlane, textTexture, flag, person, helix, snake, scissors, startScene } from './common.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hand = (p, k) => { p.updateMatrixWorld(true); return p.userData.parts['arm' + k].localToWorld(V(0, -0.45, 0)); };
startScene(({ scene, crisp, finish }) => {
  const c = crisp({ s: 1.9, x: 0.2, z: 0, pose: { arms: { l: [0, 0.9, 0], r: [0, 0.9, 0] } } });
  const fl = [['#e83a3a', -0.28, -0.4], ['#2f7fe0', 0.0, 0.0], ['#35c05a', 0.28, 0.4]];
  fl.forEach(([col, x, t]) => { const f = flag(col, { h: 1.0, w: 0.9 }); f.position.set(x * 1.2 + 0.2, 1.7, 0.0); f.rotation.z = -t * 0.5; scene.add(f); });
  // carpenter
  const cp = person({ shirt: '#c9482b', pants: '#6a4a2a', s: 1.05 }); cp.position.set(-2.4, 0, 0.3); cp.rotation.y = 0.5; scene.add(cp);
  const P = cp.userData.parts; P.armL.rotation.set(-2.7, 0, -0.2);
  box(cp, mat('#c88a3c'), [0, 0.85, 0.2], [0.34, 0.5, 0.06]);
  blob(cp, mat('#ffd02a'), [0, 1.5, 0], [0.3, 0.2, 0.3]); cyl(cp, mat('#ffd02a'), [0, 1.46, 0.1], 0.3, 0.05, [0, 0, 0]);
  cyl(P.armL, mat('#8a5a2a'), [0, -0.5, 0.0], 0.03, 0.5); box(P.armL, mat('#555a60'), [0, -0.76, 0], [0.34, 0.14, 0.12]);
  box(scene, mat('#d9a95a'), [-2.0, 0.08, 1.1], [1.3, 0.16, 0.4], [0, 0.3, 0]);
  // foil: silver person with foil roll
  const fo = person({ shirt: '#d0d6de', pants: '#b8c0ca', skin: '#e4e8ee', hair: '#9aa4b0', s: 1.05 }); fo.position.set(-1.1, 0, 1.0); fo.rotation.y = 0.2; scene.add(fo);
  fo.traverse((o) => { if (o.isMesh && o.material.color) { o.material = mat(o.material.color, { metalness: 0.7, roughness: 0.25 }); } });
  fo.userData.parts.armR.rotation.set(-1.2, 0, 0.2);
  cyl(fo, mat('#e8ecf0', { metalness: 0.8, roughness: 0.2 }), [-0.3, 0.7, 0.3], 0.09, 0.45, [0, 0, Math.PI / 2]);
  // nova star
  const sh = new THREE.Shape(), n = 5; for (let i = 0; i < n * 2; i++) { const a = Math.PI / 2 + i * Math.PI / n, r = i % 2 ? 0.34 : 0.85; sh[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
  const sg = new THREE.ExtrudeGeometry(sh, { depth: 0.25, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 2 }); sg.translate(0, 0, -0.125);
  const star = add(scene, sg, mat('#ffe14a', { emissive: '#ff9d1a', emissiveIntensity: 0.5 }), [2.6, 1.5, 0.3], [0, -0.3, 0.1]);
  for (const sx of [-1, 1]) { blob(star, mat('#fff'), [sx * 0.15, 0.0, 0.2], [0.09, 0.12, 0.03]); blob(star, mat('#2a1a10'), [sx * 0.15, -0.01, 0.23], [0.055, 0.085, 0.02]); }
  for (const sx of [-1, 1]) cyl(scene, mat('#ff9d1a'), [2.45 + sx * 0.15, 0.45, 0.4], 0.05, 0.6);
  finish([0.1, 1.8, 6.0], [0, 1.35, 0]);
});

</script></body></html>
