<script type="module">
import { THREE, mat, add, blob, glow, makeScene, synth, paw, note, bow, den, dancer, cheese, sauceBottle, spanner, eyeMask, gel, neuron, lightSwitch, lightCone, brain, church, rna, journal, tree, animeEyes } from './common.js';
// q04 — 1000ExM swells tissue a thousand times in volume (1000 -> 00 = SAUCE).
makeScene(({ scene }) => {
  const s = synth(scene, { pos: [-2.4, 0, 1.0], scale: 1.9, l: [-1.1, 2.6, 0.9], r: [-3.4, 2.6, 1.0], ry: 0.35 });

  note(scene, [-1.9, 3.0, 1.0], '#ffd23c', 1.2);
  return [s];
}, { cam: [0.4, 1.9, 8.0], look: [0.4, 1.5, 0.3], fov: 44 });
