<!doctype html>
<html><head><meta charset="utf-8"><title>Synthesizer anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { guard } from './kit.js';
import { createAnimeStage } from './kit_anime.js';
import { createSynthesizer } from './synthesizer.js';
guard(() => {
  const stage = createAnimeStage({ fov: 30, sunElevation: 35, sunAzimuth: 150, sky: { cover: 1, seed: 5, towerTop: 0.5, puffCover: 1 },
    rim: { color: '#fff3dc', strength: 1.4, width: 0.55 }, sunIntensity: 2.6, ambient: { color: '#e8e2ff', intensity: 2.3 }, triBumpScale: 0.3,
    ink: { width: 1.2, strength: 0.85, normalThresh: 0.45, normalStrength: 0.45, fadeFar: 60 }, flare: 0.3, fog: { near: 120, far: 1500 } });
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#8fc66a', roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; stage.scene.add(g);
  const views = [[-1.35, 0.5, 'front'], [0, 0.0, 'q'], [1.35, -1.3, 'side']];
  const all = [];
  views.forEach(([x, ry], i) => {
    const s = createSynthesizer({ scale: 1.2 }); s.position.set(x * 1.0, 0, 0); s.rotation.y = [0.0, 0.7, 2.3][i];
    s.userData.pose({ lean: 0.05, headTilt: 0.06, arms: { l: [0.3, 0.5, 0.1], r: [0, 0.35, 0.2] }, legs: { l: [0.2, 0], r: [-0.2, 0] } });
    stage.scene.add(s); all.push(s);
  });
  const pm = new Set(); all.forEach((s) => s.traverse((o) => pm.add(o)));
  stage.toonify(stage.scene, (m) => pm.has(m));
  stage.camera.position.set(0, 0.8, 4.6); stage.camera.lookAt(0, 0.6, 0);
  stage.finish();
});
</script></body></html>
