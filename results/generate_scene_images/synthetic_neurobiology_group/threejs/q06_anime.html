<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { THREE, mat, add, blob, glow, makeScene, synth, paw, note, bow, den, dancer, cheese, sauceBottle, spanner, eyeMask, gel, neuron, lightSwitch, lightCone, brain, church, rna, journal, tree, animeEyes } from './common.js';
// q06 — The SYNTHESIZER plays EXSEQ in a CHURCH.
makeScene(({ scene }) => {
  const c = church(); c.position.set(0.4, 0, -1.4); c.scale.setScalar(1.7); scene.add(c);
  const s = synth(scene, { pos: [-1.4, 0, 1.6], scale: 1.4, ry: 0.3, l: [-1.0, 0.9, 2.3], r: [-1.8, 0.9, 2.3] });
  // EXSEQ prop: tissue slab with RNA, beside the synth
  add(scene, new THREE.BoxGeometry(1.1, 0.25, 0.8), mat('#f3a6b8'), [1.5, 0.125, 1.9], [0, -0.3, 0]);
  for (let i = 0; i < 4; i++) { const r = rna(0.7 + i * 0.1, i + 2); r.position.set(1.2 + i * 0.22, 0.25, 1.9 - i * 0.07); scene.add(r); }
  note(scene, [-1.4, 3.0, 1.6], '#ffd23c', 1.3); note(scene, [-0.1, 3.3, 1.6], '#ff8fb0', 1.2);
  for (const [x, z] of [[-4, -1], [4.2, -0.5]]) { const t = tree(2.2); t.position.set(x, 0, z); scene.add(t); }
  return [s];
}, { cam: [0.2, 1.8, 6.8], look: [0.2, 1.4, 0.2], fov: 44 });
</script></body></html>
