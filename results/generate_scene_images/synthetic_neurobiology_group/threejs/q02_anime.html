<html><head><meta charset="utf-8"><title>Synthetic Neurobiology scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, mat, add, blob, glow, makeScene, synth, paw, note, bow, den, dancer, cheese, sauceBottle, spanner, eyeMask, gel, neuron, lightSwitch, lightCone, brain, church, rna, journal, tree, animeEyes } from './common.js';
// q02 — About sixty people dance around the SYNTHESIZER (60 = CHEESE).
makeScene(({ scene }) => {
  const s = synth(scene, { pos: [0, 0, 0], scale: 1.9, l: [0.65, 2.1, 0.3], r: [-0.65, 2.1, 0.3] });
  const cols = ['#e63946', '#f4a261', '#2a9d8f', '#4dabf7', '#b05cff', '#ff7ab8', '#ffd23c', '#8fdc5a'];
  let n = 0;
  for (const [R, c] of [[2.0, 10], [2.8, 14], [3.6, 17], [4.4, 19]]) for (let i = 0; i < c; i++, n++) {
    const a = 0.7 + i / c * (Math.PI * 2 - 1.4), p = dancer(cols[(n * 3) % 8], n); p.position.set(Math.sin(a) * R, 0, Math.cos(a) * R * 0.9); p.rotation.y = a + Math.PI; p.scale.setScalar(1.15); scene.add(p);
  }
  const ch = cheese(0.55); ch.position.set(-2.4, 0, 2.8); ch.rotation.y = 0.6; ch.scale.setScalar(1.3); scene.add(ch);
  const c2 = cheese(0.45); c2.position.set(-2.4, 0.8, 2.8); c2.rotation.y = 1.2; c2.scale.setScalar(1.3); scene.add(c2);
  for (const [x, y, z, col] of [[-0.9, 2.4, 0.5, '#ffd23c'], [1.0, 2.5, 0.5, '#ff8fb0']]) note(scene, [x, y, z], col, 1.2);
  return [s];
}, { cam: [0, 3.0, 8.2], look: [0, 1.0, 0.3], fov: 45 });
</script></body></html>
