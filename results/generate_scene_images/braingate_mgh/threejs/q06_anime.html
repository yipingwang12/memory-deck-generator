<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { guard } from './kit.js';
import { THREE, mat, add, blob, box, cyl, num, textPlane, makeStage, placeAnchor, wrap } from './common.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage({ ground: '#c9e0a8' });
  const S = stage.scene;
  const a = placeAnchor(stage, { x: -1.3, ry: 0.4, scale: 1.7, pose: { arms: { l: [0, 0.5, 0], r: [0, 0.4, 0] }, legs: { l: [0.2, 0], r: [-0.2, 0] } }, spin: 0.5 });
  // giant boot kicking
  const boot = new THREE.Group(); boot.position.set(0.9, 0.3, 0.2); boot.rotation.set(0, -0.3, 0.55); S.add(boot);
  const lea = mat('#9a5a2a'), dk = mat('#4a2a14'), cream = mat('#e8d9b0');
  cyl(boot, lea, [0, 0.9, 0], 0.4, 1.3);
  blob(boot, lea, [0.5, 0.15, 0], [0.95, 0.38, 0.45]);
  box(boot, dk, [0.4, -0.12, 0], [1.8, 0.16, 0.9]);
  box(boot, dk, [-0.2, -0.2, 0], [0.5, 0.2, 0.8]);
  cyl(boot, mat('#c88a4a'), [0, 1.62, 0], 0.46, 0.18);
  for (let i = 0; i < 4; i++) box(boot, cream, [0.25 + i * 0.16, 0.55 - i * 0.06 + 0.12, 0.43], [0.05, 0.05, 0.28], [0, 0, 0.8 - i * 0.1]);
  for (let i = 0; i < 3; i++) box(boot, cream, [-0.03, 0.75 + i * 0.25, 0.4], [0.5, 0.06, 0.06]);
  // flying result: 9.1% ball and error crosses
  const ball = textPlane('9.1%', { w: 1.5, h: 1.5, bg: '#2a9d4a', fg: '#ffffff', font: 'bold 150px sans-serif' }); ball.position.set(2.6, 2.1, 0.3); ball.scale.set(1, 0.6, 1); S.add(ball);
  box(S, mat('#2a9d4a'), [2.6, 2.1, 0.22], [1.6, 1.0, 0.1], [0.05, 0, 0.12]);
  ball.rotation.z = 0.12;
  const x = (px, py, r) => { const g = new THREE.Group(); g.position.set(px, py, 0.6); g.rotation.z = r; S.add(g); box(g, mat('#d8402e'), [0, 0, 0], [0.5, 0.12, 0.12], [0, 0, 0.78]); box(g, mat('#d8402e'), [0, 0, 0], [0.5, 0.12, 0.12], [0, 0, -0.78]); };
  x(1.7, 1.7, 0.3); x(2.1, 0.9, 1.0); x(3.4, 0.9, 0.5); x(0.8, 2.3, 0.2);
  wrap(stage, a, P, { cx: 1.0, cz: 5.6, cy: 1.2, tx: 1.0, ty: 0.95 });
});
