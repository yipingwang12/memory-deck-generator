<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { guard } from './kit.js';
import { THREE, mat, add, blob, box, cyl, num, textPlane, makeStage, placeAnchor, wrap } from './common.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage({ ground: '#d9c8a8', zenith: '#9fb4cc', horizon: '#e6e0d0' });
  const S = stage.scene;
  const person = (x, c, rotY) => {
    const g = new THREE.Group(); g.position.set(x, 0, 0); g.rotation.y = rotY; g.scale.setScalar(1.25); S.add(g);
    cyl(g, mat(c), [0, 0.75, 0], 0.22, 0.8, [0, 0, 0], 0.26);
    blob(g, mat('#ffdcb8'), [0, 1.35, 0], [0.24, 0.27, 0.24]);
    blob(g, mat('#3a2616'), [0, 1.48, -0.03], [0.26, 0.2, 0.25]);
    for (const s of [-1, 1]) { blob(g, mat('#fff'), [s * 0.09, 1.36, 0.2], [0.055, 0.07, 0.02]); blob(g, mat('#1a1210'), [s * 0.09, 1.35, 0.22], [0.035, 0.05, 0.02]); }
    for (const s of [-1, 1]) cyl(g, mat('#2b3340'), [s * 0.1, 0.22, 0.05], 0.06, 0.45);
    return g;
  };
  // CELL reporter behind prison bars, with PRESS hat and microphone
  const rep = person(-2.5, '#3a8f5a', 0.35); 
  box(rep, mat('#1c1c1c'), [0, 1.62, 0.05], [0.5, 0.08, 0.4]);
  const pr = textPlane('PRESS', { w: 0.5, h: 0.5, bg: '#ffd23a', fg: '#222', font: 'bold 120px sans-serif' }); pr.scale.set(1, 0.4, 1); pr.position.set(0, 0.88, 0.27); rep.add(pr);
  cyl(S, mat('#ffdcb8'), [-1.75, 1.3, 0.5], 0.06, 1.2, [0, 0, -1.5]);
  const mic = new THREE.Group(); mic.position.set(-1.15, 1.35, 0.7); S.add(mic);
  cyl(mic, mat('#2b2b30'), [0, 0, 0], 0.045, 0.45, [0, 0, -1.2]);
  blob(mic, mat('#e0454a'), [0.28, 0.1, 0], [0.12, 0.12, 0.12]);
  const bar = mat('#454b56', { metalness: 0.4 });
  for (let i = 0; i < 6; i++) cyl(S, bar, [-3.5 + i * 0.4, 1.45, 0.8], 0.04, 2.8);
  box(S, bar, [-2.5, 2.8, 0.8], [2.1, 0.07, 0.07]); box(S, bar, [-2.5, 0.1, 0.8], [2.1, 0.07, 0.07]);
  // locked-in man in wheelchair, cable to the anchor
  const man = person(2.6, '#6a7fa8', -0.3); man.position.y = 0.4;
  const wh = new THREE.Group(); wh.position.set(2.6, 0, 0); wh.rotation.y = -0.3; wh.scale.setScalar(1.25); S.add(wh);
  add(wh, new THREE.TorusGeometry(0.4, 0.05, 10, 28), mat('#2b2b30'), [0.3, 0.42, 0], [0, Math.PI / 2, 0]);
  add(wh, new THREE.TorusGeometry(0.4, 0.05, 10, 28), mat('#2b2b30'), [-0.3, 0.42, 0], [0, Math.PI / 2, 0]);
  box(wh, mat('#c4584a'), [0, 0.62, -0.1], [0.55, 0.1, 0.6]); box(wh, mat('#c4584a'), [0, 1.0, -0.38], [0.55, 0.7, 0.08]);
  const cable = new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0.5, 1.6, 0.1), new THREE.Vector3(1.0, 2.7, 0.4), new THREE.Vector3(2.0, 2.7, 0.3), new THREE.Vector3(2.5, 2.1, 0.2)]), 40, 0.035, 8);
  add(S, cable, mat('#e6a020'));
  const a = placeAnchor(stage, { x: -0.1, ry: 0.1, scale: 1.7, pose: { arms: { l: [0, 0.5, 0], r: [0, 0.4, 0] }, legs: { l: [0.2, 0], r: [-0.2, 0] } }, spin: 0.7 });
  wrap(stage, a, P, { cx: 0.0, cz: 5.4, cy: 1.3, tx: 0.0, ty: 1.0 });
});
