<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<script type="module">
import { guard } from './kit.js';
import { THREE, mat, add, blob, box, cyl, num, textPlane, makeStage, placeAnchor, wrap } from './common.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage({ ground: '#cfe6f2', zenith: '#5aa6e8', horizon: '#e6f3fb', cloudShade: '#cfe0f0' });
  const S = stage.scene;
  const ice = mat('#eaf7ff', { roughness: 0.35 }), deep = mat('#8cc8ec', { roughness: 0.3 });
  const berg = new THREE.Group(); berg.position.set(1.55, 0, -0.2); S.add(berg);
  const peak = (x, z, r, h, c) => add(berg, new THREE.ConeGeometry(r, h, 7), c, [x, h / 2, z]);
  peak(0, 0, 0.95, 2.3, ice); peak(-0.75, 0.2, 0.6, 1.3, ice); peak(0.7, 0.25, 0.55, 1.0, deep);
  blob(berg, deep, [0, 0.05, 0.3], [1.3, 0.18, 0.9]);
  // face
  for (const s of [-1, 1]) { blob(berg, mat('#ffffff'), [s * 0.22, 1.35, 0.74], [0.11, 0.14, 0.04]); blob(berg, mat('#14344f'), [s * 0.22, 1.33, 0.78], [0.065, 0.09, 0.03]); blob(berg, mat('#fff'), [s * 0.2, 1.38, 0.8], [0.02, 0.02, 0.01]); }
  add(berg, new THREE.TorusGeometry(0.1, 0.02, 8, 16, Math.PI), mat('#14344f'), [0, 1.14, 0.78], [0, 0, Math.PI]);
  // hockey stick pointing at the anchor
  const stick = new THREE.Group(); stick.position.set(-0.75, 1.0, 0.9); stick.rotation.z = 0.5; berg.add(stick);
  const wood = mat('#d9a441'), tape = mat('#222');
  cyl(stick, wood, [0, 0, 0], 0.045, 2.3);
  box(stick, wood, [-0.28, -1.15, 0], [0.7, 0.13, 0.1]);
  box(stick, tape, [-0.45, -1.15, 0], [0.3, 0.15, 0.12]);
  cyl(stick, tape, [0, 0.9, 0], 0.052, 0.4);
  cyl(berg, mat('#111'), [-1.7, 0.08, 1.2], 0.2, 0.12);
  const a = placeAnchor(stage, { x: -1.4, ry: 0.35, pose: { arms: { l: [0, 0.5, 0], r: [0, 0.3, 0] }, legs: { l: [0.2, 0], r: [-0.2, 0] } }, spin: 0.6 });
  wrap(stage, a, P, { cz: 5, ty: 0.9 });
});
</script></body></html>
