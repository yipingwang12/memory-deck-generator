<!doctype html>
<html><head><meta charset="utf-8"><title>q03</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { guard } from './kit.js';
import { THREE, mat, add, blob, box, cyl, num, textPlane, makeStage, placeAnchor, wrap } from './common.js';
guard(() => {
  const P = new URLSearchParams(location.search);
  const stage = makeStage({ ground: '#e8c48a' });
  const S = stage.scene;
  // long road to horizon with milestone posts
  add(S, new THREE.PlaneGeometry(1.6, 400), mat('#6a6f78'), [0.6, 0.004, -190], [-Math.PI / 2, 0, 0]);
  for (let i = 0; i < 40; i++) {
    box(S, mat('#ffffff'), [0.6, 0.006, 3 - i * 1.2], [0.1, 0.01, 0.55]).rotation.x = 0;
    if (i % 3 === 0 && i > 0) { const z = 2.2 - i * 1.2; box(S, mat(i % 2 ? '#d8402e' : '#ffffff'), [-0.55, 0.3, z], [0.14, 0.6, 0.14]); box(S, mat(i % 2 ? '#d8402e' : '#ffffff'), [1.75, 0.3, z], [0.14, 0.6, 0.14]); }
  }
  // tall calendar-page stack = years
  const stack = new THREE.Group(); stack.position.set(2.9, 0, 0.1); stack.rotation.y = -0.4; S.add(stack);
  for (let i = 0; i < 18; i++) box(stack, mat(i % 2 ? '#fdfbf4' : '#f1e9d2'), [(i % 3 - 1) * 0.02, 0.08 + i * 0.16, 0], [1.1, 0.14, 0.8]);
  const cal = textPlane('365', { w: 1.0, h: 1.0, bg: '#d8402e', fg: '#fff', font: 'bold 200px sans-serif' }); cal.position.set(0, 2.2, 0.41); cal.scale.set(1, 0.55, 1); stack.add(cal);
  // gold trophy with a big 1
  const tr = new THREE.Group(); tr.position.set(1.3, 0, 0.5); S.add(tr);
  const gold = mat('#f2b628', { metalness: 0.5, roughness: 0.3 });
  box(tr, mat('#5a3a22'), [0, 0.12, 0], [0.8, 0.24, 0.6]);
  cyl(tr, gold, [0, 0.45, 0], 0.12, 0.4, [0, 0, 0], 0.18);
  add(tr, new THREE.CylinderGeometry(0.5, 0.2, 0.7, 28), gold, [0, 1.0, 0]);
  add(tr, new THREE.TorusGeometry(0.28, 0.05, 10, 24), gold, [-0.52, 1.1, 0], [0, 0, 0]).rotation.y = 0;
  add(tr, new THREE.TorusGeometry(0.28, 0.05, 10, 24), gold, [0.52, 1.1, 0]);
  const one = textPlane('1', { w: 0.5, h: 0.5, bg: '#f2b628', fg: '#7a3a10', font: 'bold 300px sans-serif' }); one.position.set(0, 1.0, 0.43); one.scale.set(1, 1, 1); tr.add(one);
  const a = placeAnchor(stage, { x: -1.3, ry: 0.4, scale: 1.7, pose: { arms: { l: [0, 0.5, 0], r: [0, 0.3, 0] }, legs: { l: [0.35, 0], r: [-0.35, 0] } }, spin: 1.2 });
  wrap(stage, a, P, { cx: 0.9, cz: 5.6, cy: 1.3, tx: 0.9, ty: 1.0 });
});
</script></body></html>
