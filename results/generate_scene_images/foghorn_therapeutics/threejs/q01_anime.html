<!doctype html>
<html><head><meta charset="utf-8"><title>Foghorn q01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q01 CHROMATIN: foghorn booms at nucleosome beads-on-a-string (DNA wrapped on histone spools).
import { THREE, guard, rng, mat, add, blob, box, num, makeStage, ground, placeFoghorn, soundWaves, textPlane, aimAt, finishScene } from './common.js';
guard(() => {

  const stage = makeStage({ el: 30, az: 140 }); const scene = stage.scene;
  ground(scene, '#e9d9b8');
  const f = placeFoghorn(scene, { x: -1.5, z: 0.3, scale: 2.2 }); aimAt(f, [0.8, 1.3, 0]);
  const spool = () => {
    const g = new THREE.Group(), hist = mat('#3f8fe0', { roughness: 0.4 });
    add(g, new THREE.CylinderGeometry(0.3, 0.3, 0.26, 32), hist, [0, 0, 0], [Math.PI / 2, 0, 0]);
    for (let i = 0; i < 4; i++) { const y = -0.1 + i * 0.066; add(g, new THREE.TorusGeometry(0.325, 0.032, 10, 48), mat(i % 2 ? '#ff6f91' : '#ffd23f', { roughness: 0.4 }), [0, 0, y], [0, 0, 0]); }
    return g;
  };
  const pts = [[0.2, 1.2], [1.2, 0.7], [2.2, 1.55], [3.1, 0.75], [4.0, 1.5]].map(([x, y]) => new THREE.Vector3(x, y, 0));
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-0.5, 0.5, 0.1), ...pts, new THREE.Vector3(4.6, 0.4, 0.1)]);
  add(scene, new THREE.TubeGeometry(curve, 80, 0.04, 8, false), mat('#ff6f91'));
  pts.forEach((p, i) => { const s = spool(); s.position.copy(p); s.rotation.set(0.55 - i * 0.05, i % 2 ? 0.6 : -0.5, 0); scene.add(s); });
  soundWaves(scene, f, { n: 4 });
  finishScene(stage, f, { cam: [0.8, 1.5, 5.8], look: [1.0, 1.1, 0] });

});
</script></body></html>
