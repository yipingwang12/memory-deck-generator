<!doctype html>
<html><head><meta charset="utf-8"><title>Foghorn q06</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q06 multiple myeloma: foghorn breaks myeloma cells packed in a cut-open bone marrow.
import { THREE, guard, rng, mat, add, blob, box, num, makeStage, ground, placeFoghorn, soundWaves, textPlane, aimAt, finishScene } from './common.js';
guard(() => {

  const stage = makeStage({ el: 30, az: 140 }); const scene = stage.scene;
  ground(scene, '#e9d9b8');
  const f = placeFoghorn(scene, { x: -3.0, z: 0.8, scale: 2.0 }); aimAt(f, [1.5, 1.0, 0.3]);
  const bone = new THREE.Group(); bone.position.set(2.3, 1.1, 0); bone.rotation.z = Math.PI / 2; scene.add(bone);
  const ivory = mat('#f3ead2', { side: THREE.DoubleSide, roughness: 0.6 });
  add(bone, new THREE.CylinderGeometry(0.85, 0.85, 4, 40, 1, true, 0.9, Math.PI * 2 - 1.8), ivory);
  add(bone, new THREE.CylinderGeometry(0.72, 0.72, 3.9, 40, 1, true, 0.9, Math.PI * 2 - 1.8), mat('#b5262f', { side: THREE.DoubleSide }));
  for (const s of [-1, 1]) for (const dz of [-0.45, 0.45]) blob(bone, ivory, [0.15 * dz, s * 2.1, dz], [0.55, 0.5, 0.5]);
  const r = rng(5), cols = ['#7a3fd6', '#9b59e8', '#6a2fc0'];
  for (let i = 0; i < 26; i++) {
    const c = new THREE.Group(); c.position.set((r() - 0.5) * 1.3, (r() - 0.5) * 3.2, (r() - 0.2) * 0.6); bone.add(c);
    blob(c, mat(cols[i % 3], { roughness: 0.35 }), [0, 0, 0], [0.17, 0.17, 0.17]); blob(c, mat('#3b1670'), [0.04, 0.03, 0.1], [0.06, 0.06, 0.06]);
  }
  for (let i = 0; i < 12; i++) add(scene, new THREE.IcosahedronGeometry(0.07 + r() * 0.08, 0), mat(cols[i % 3]), [-0.2 + r() * 1.2, 2.3 + r() * 1.0 - (i % 2) * 2.4 + 0.7, 0.8 + r() * 0.6], [r() * 6, r() * 6, 0]);
  soundWaves(scene, f, { n: 4 });
  finishScene(stage, f, { cam: [0.4, 1.7, 7.4], look: [0.4, 1.1, 0] });

});
</script></body></html>
