<!doctype html>
<html><head><meta charset="utf-8"><title>Foghorn anchor</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { THREE, guard, makeStage, ground, add, mat, createFoghorn, finishScene } from './common.js';
guard(() => {
  const stage = makeStage({ el: 35, az: 150 });
  ground(stage.scene, '#d9c9a3');
  const views = [-0.9, 0, 0.9];
  let first;
  views.forEach((ry, i) => {
    const f = createFoghorn({ scale: 1.5 }); f.position.set((i - 1) * 1.7, 0, 0); f.rotation.y = ry * 1.3 + (i === 2 ? 0.9 : 0);
    f.userData.pose({ arms: { l: [0, 0.5], r: [0, 0.5] }, aim: [0.5, 0] }); stage.scene.add(f); first ??= f;
  });
  const pm = new Set(); stage.scene.children.forEach((c) => c.traverse((o) => pm.add(o)));
  stage.toonify(stage.scene, (m) => !m.geometry.type.startsWith('Plane'));
  stage.camera.position.set(0, 1.2, 4.6); stage.camera.lookAt(0, 0.85, 0);
  stage.finish();
});
</script></body></html>
