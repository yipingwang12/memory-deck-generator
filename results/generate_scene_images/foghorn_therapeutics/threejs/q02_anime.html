<!doctype html>
<html><head><meta charset="utf-8"><title>Foghorn q02</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// q02 degraders: foghorn blast shatters protein blobs into fragments.
import { THREE, guard, rng, mat, add, blob, box, num, makeStage, ground, placeFoghorn, soundWaves, textPlane, aimAt, finishScene } from './common.js';
guard(() => {

  const stage = makeStage({ el: 30, az: 140 }); const scene = stage.scene;
  ground(scene, '#e9d9b8');
  const f = placeFoghorn(scene, { x: -2.6, z: 0.3, scale: 2.2 }); aimAt(f, [1.2, 1.3, 0]);
  const cols = ['#8e4ee0', '#33b5a5', '#ff8a3d', '#e84a7f'];
  const protein = (p, s) => { const g = new THREE.Group(); g.position.set(...p);
    [[0, 0, 0, 1], [0.7, 0.3, 0.1, 0.75], [-0.6, 0.35, 0.1, 0.7], [0.1, 0.8, -0.1, 0.65], [0.2, -0.5, 0.3, 0.6]].forEach(([x, y, z, r], i) => blob(g, mat(cols[i % 4], { roughness: 0.35 }), [x * s, y * s, z * s], [r * s * 0.5, r * s * 0.5, r * s * 0.5]));
    scene.add(g); return g; };
  protein([2.3, 0.8, 0], 0.8);
  const r = rng(11);
  for (let i = 0; i < 26; i++) {
    const a = r() * 6.28, d = 0.3 + r() * 1.4, s = 0.07 + r() * 0.15;
    add(scene, new THREE.IcosahedronGeometry(s, 0), mat(cols[i % 4], { roughness: 0.35 }), [0.3 + Math.cos(a) * d * 0.9 + 0.2, 1.15 + Math.sin(a) * d * 0.8, (r() - 0.5) * 1.2], [r() * 6, r() * 6, r() * 6]);
  }
  protein([4.4, 0.7, 0.3], 0.6);
  soundWaves(scene, f, { n: 3 });
  finishScene(stage, f, { cam: [0.5, 1.5, 6.1], look: [0.6, 1.1, 0] });

});
</script></body></html>
